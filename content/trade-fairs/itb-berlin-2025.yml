excerpt:
  en: Uzbekistan stand at Europe's leading travel trade show — three days of DMC partner meetings, tour operator briefings, and Silk Road product updates. Meet the TourLink team at stand UZ-12 in Hall 4.1.
  ru: Стенд Узбекистана на ведущей европейской туристической выставке — три дня встреч с DMC-партнёрами, брифингов для туроператоров и обновлений продуктов Шёлкового пути. Встречайте команду TourLink на стенде UZ-12 в зале 4.1.
  uz: Yevropaning yetakchi turizm ko'rgazmasida O'zbekiston stendi — uch kun DMC hamkorlari uchrashuvlari, turoperator brifinglari va Ipak yo'li mahsulot yangilanishlari. 4.1 zalida UZ-12 stendida TourLink jamoasi bilan uchrashing.
