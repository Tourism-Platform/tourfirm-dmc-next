      ru: Сочетайте маршруты с впечатлениями
      uz: Marshrutlarni taassurotlar bilan juftlang
    description:
      en: After the fair, explore experiences linked to the same cities you discussed at the stand.
      ru: После ярмарки откройте впечатления в тех же городах, что обсуждали на стенде.
      uz: Yarmarkadan keyin stendda muhokama qilgan shaharlardagi taassurotlarni ko'ring.
