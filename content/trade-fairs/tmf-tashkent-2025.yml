title:
  en: Tashkent Tourism Fair 2025
  ru: Ташкентская туристическая ярмарка 2025
  uz: Toshkent turizm yarmarkasi 2025
excerpt:
  en: Home-market tourism fair in Tashkent — TourLink presents regional routes, agency-ready programs, and on-the-ground coordination capacity. Domestic operators and inbound partners meet the team at stand CA-08.
  ru: Туристическая ярмарка на домашнем рынке в Ташкенте — TourLink представляет региональные маршруты, программы для агентств и координацию на месте. Локальные операторы и inbound-партнёры встречают команду на стенде CA-08.
  uz: Toshkentdagi mahalliy turizm yarmarkasi — TourLink mintaqaviy marshrutlar, agentliklar uchun dasturlar va joyidagi muvofiqlashtirishni taqdim etadi. Mahalliy operatorlar va inbound hamkorlar CA-08 stendida jamoa bilan uchrashadi.
