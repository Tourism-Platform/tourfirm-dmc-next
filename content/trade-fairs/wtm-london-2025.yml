excerpt:
  en: World Travel Market at ExCeL London — TourLink on the Uzbekistan pavilion at stand B-24 for UK and EU agency meetings. Focus on Silk Road FIT programs, MICE blocks, and shoulder-season product for 2026 departures.
  ru: World Travel Market в ExCeL London — TourLink на павильоне Узбекистана, стенд B-24, встречи с британскими и EU-агентствами. Акцент на FIT по Шёлковому пути, MICE и продуктах межсезонья на вылеты 2026 года.
  uz: ExCeL London'dagi World Travel Market — O'zbekiston pavilyonida B-24 stendida TourLink, Buyuk Britaniya va EU agentliklari bilan uchrashuvlar. Ipak yo'li FIT, MICE va 2026 jo'nashlari uchun oraliq mavsum mahsulotlari.
