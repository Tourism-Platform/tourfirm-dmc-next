# Seed: global homepage (Payload CMS)
# Локали: en, ru, uz
# Карточки country: countrySlug даёт href; image/badge/description из YAML, если заданы

seo:
  metaTitle:
    en: TourLink | Your link to Central Asia
    ru: TourLink | Ваша связь с Центральной Азией
    uz: TourLink | Markaziy Osiyo bilan aloqangiz
  metaDescription:
    en: Private trips, group programs, and routes across Uzbekistan and Central Asia from the TourLink team.
    ru: Индивидуальные поездки, групповые программы и маршруты по Узбекистану и Центральной Азии от команды TourLink.
    uz: TourLink jamoasidan O'zbekiston va Markaziy Osiyo bo'ylab shaxsiy sayohatlar, guruh dasturlari va marshrutlar.

blocks:
  - blockType: hero
    image: assets/images/hero-image.jpg
    imageAlt:
      en: Central Asia landscape
      ru: Пейзаж Центральной Азии
      uz: Markaziy Osiyo manzarasi
    title:
      en: Your link to Central Asia
      ru: Ваша связь с Центральной Азией
      uz: Markaziy Osiyo bilan aloqangiz
    description:
      en: Private trips, group programs, and agency routes built around real places, people, and the rhythm of the road.
      ru: Индивидуальные поездки, групповые программы и маршруты для агентств — вокруг реальных мест, людей и ритма маршрута.
      uz: Shaxsiy sayohatlar, guruh dasturlari va agentlik marshrutlari — haqiqiy joylar, odamlar va marshrut ritmi atrofida.
    note:
      en: TourLink designs and coordinates its own programs across Central Asia — from a first trip in Uzbekistan to a wide Silk Road route.
      ru: TourLink проектирует и координирует собственные программы по Центральной Азии — от путешествия по Узбекистану до широкого маршрута Шёлкового пути.
      uz: TourLink Markaziy Osiyo bo'ylab o'z dasturlarini loyihalashtiradi va muvofiqlashtiradi — O'zbekistondagi birinchi sayohatdan Ipak yo'lining keng marshrutigacha.
    actions:
      - type: mailto
        variant: default
        title:
          en: Request a private tour
          ru: Запросить индивидуальный тур
          uz: Shaxsiy tur so'rash
        email: info@tourlink.uz
      - type: link
        variant: outline
        title:
          en: Browse destinations
          ru: Смотреть направления
          uz: Yo'nalishlarni ko'rish
        href: /destinations

  - blockType: overviewStats
    cards:
      - type: overviewStat
        icon: map-pin
        value:
          en: Team in Tashkent
          ru: Команда в Ташкенте
          uz: Toshkentdagi jamoa
      - type: overviewStat
        icon: globe-2
        value:
          en: Routes across the region
          ru: Маршруты по региону
          uz: Mintaqadagi marshrutlar
      - type: overviewStat
        icon: gauge
        value:
          en: Thoughtful pace
          ru: Продуманный темп
          uz: O'ylangan ritm
      - type: overviewStat
        icon: users
        value:
          en: Private, groups, B2B
          ru: Частные, группы, B2B
          uz: Shaxsiy, guruh, B2B
      - type: overviewStat
        icon: message-circle
        value:
          en: Market connections
          ru: Связь с рынками
          uz: Bozorlar bilan bog'lanish

  - blockType: routeLine
    eyebrow:
      en: How we work
      ru: Как мы работаем
      uz: Qanday ishlaymiz
    title:
      en: One line — from the first message to the last day.
      ru: Одна линия — от первого письма до последнего дня.
      uz: Bitta chiziq — birinchi xatdan oxirgi kungacha.
    description:
      en: Guides, transport, hotels, activities, and border crossings are ours — not outsourced. That is why the trip finds its rhythm before the city list.
      ru: Гиды, транспорт, отели, активности и переходы границ — всё это наше, а не подряд со стороны. Поэтому у поездки появляется ритм раньше, чем список городов.
      uz: Gidlar, transport, mehmonxonalar, faoliyatlar va chegaralar — bularning hammasi bizniki, tashqi pudratchi emas. Shuning uchun sayohat shaharlar ro'yxatidan oldin o'z ritmini topadi.
    start:
      label:
        en: Start
        ru: Начало
        uz: Boshlanish
      title:
        en: TourLink, Tashkent
        ru: TourLink, Ташкент
        uz: TourLink, Toshkent
      description:
        en: You write once — we assemble the route from there.
        ru: Вы пишете нам один раз — дальше маршрут собираем мы.
        uz: Bir marta yozasiz — marshrutni bundan keyin biz yig'amiz.
    items:
      - title:
          en: Guides
          ru: Гиды
          uz: Gidlar
        description:
          en: Our own, who know the city from inside — where, when, and at what pace.
          ru: Свои, знают город изнутри — где, когда и в каком темпе идти.
          uz: O'zimizniki, shaharni ichkaridan biladi — qayerda, qachon va qanday tempda.
      - title:
          en: Transport
          ru: Транспорт
          uz: Transport
        description:
          en: Our cars and on-site pickup — matched to the route and group size.
          ru: Свои машины и встреча на месте — под маршрут и размер группы.
          uz: O'z mashinalarimiz va joyida kutib olish — marshrut va guruh hajmiga mos.
      - title:
          en: Hotels
          ru: Отели
          uz: Mehmonxonalar
        description:
          en: Vetted stays booked ahead — no surprises from the photos.
          ru: Проверенные, забронированы заранее — без сюрпризов «по фото».
          uz: Tekshirilgan, oldindan bron qilingan — fotodagi kutilmagan holatlarsiz.
      - title:
          en: Activities
          ru: Активности
          uz: Faoliyatlar
        description:
          en: Crafts, makers, and tastings — what makes the day feel alive.
          ru: Ремёсла, мастера и дегустации — то, что делает день живым.
          uz: Hunarmandchilik, ustalar va degustatsiyalar — kunni jonli qiladigan narsa.
      - title:
          en: Borders
          ru: Границы
          uz: Chegaralar
        description:
          en: Crossings planned in advance — no hours lost at the checkpoint.
          ru: Переходы спланированы заранее — без потерянных часов на кордоне.
          uz: O'tishlar oldindan rejalashtirilgan — kordonlarda soatlar yo'qolmasin.
    end:
      label:
        en: Result
        ru: Результат
        uz: Natija
      title:
        en: Your route
        ru: Ваш маршрут
        uz: Sizning marshrutingiz
      description:
        en: One team owns the whole line.
        ru: За всю линию отвечает одна команда.
        uz: Butun chiziq uchun bitta jamoa javobgar.

  - blockType: regular
    eyebrow:
      en: Where we work
      ru: Где работаем
      uz: Qayerda ishlaymiz
    title:
      en: Five countries. One Silk Road line.
      ru: Пять стран. Одна линия Шёлкового пути.
      uz: Beshta mamlakat. Bitta Ipak yo'li chizig'i.
    description:
      en: Our home is Uzbekistan. The route can reach mountains, steppe, and desert roads when the trip needs a wider regional arc.
      ru: Наш дом — Узбекистан. Маршрут может вести к горам, степям и пустынным дорогам, когда поездке нужен более широкий контур региона.
      uz: Bizning uymiz — O'zbekiston. Sayohat kengroq mintaqa konturiga muhtoj bo'lganda marshrut tog'larga, dashtlarga va cho'l yo'llariga olib borishi mumkin.
    gridClassName: sm:grid-cols-2 sm:gap-5 md:grid-cols-2 lg:gap-6
    actions:
      - type: link
        variant: outline
        title:
          en: All destinations
          ru: Все направления
          uz: Barcha yo'nalishlar
        href: /destinations
    cards:
      - type: country
        countrySlug: uzbekistan
        featured: true
        image: assets/images/destinations/uzbekistan.jpg
        badge:
          en: The heart of the Silk Road
          ru: Сердце Великого шёлкового пути
          uz: Buyuk Ipak yo'lining yuragi
        description:
          en: "TourLink's home: courtyards, bazaar rhythm and Silk Road cities in one route."
          ru: "Дом TourLink: дворы, ритм базара и города Шёлкового пути в одном маршруте."
          uz: "TourLink uyi: hovlilar, bozor ritmi va Ipak yo'li shaharlari bitta yo'nalishda."
      - type: country
        countrySlug: kazakhstan
        image: assets/images/destinations/kazakhstan.jpg
        badge:
          en: Steppe scale, mountain cities
          ru: Степной масштаб, горные города
          uz: Dasht miqyosi, tog' shaharlari
        description:
          en: From Astana's avenues to Almaty's foothills and Turkistan's courtyards.
          ru: От широких проспектов Астаны к предгорьям Алматы и дворам Туркестана.
          uz: Ostona xiyobonlaridan Olmaota tog'oldilari va Turkiston hovlilarigacha.
      - type: country
        countrySlug: kyrgyzstan
        image: assets/images/destinations/kyrgyzstan.jpg
        badge:
          en: Mountains, lakes, and nomad roads
          ru: Горы, озёра и дороги кочевников
          uz: Tog'lar, ko'llar va ko'chmanchi yo'llar
        description:
          en: Issyk-Kul, Tian Shan gorges and routes where nomad logic still holds.
          ru: Иссык-Куль, ущелья Тянь-Шаня и маршруты, где ещё жива кочевая логика.
          uz: Issiqko'l, Tyan-Shan daralari va ko'chmanchi mantiq hali saqlanadigan yo'llar.
      - type: country
        countrySlug: tajikistan
        image: assets/images/destinations/tajikistan.jpg
        badge:
          en: Where the Pamirs touch the sky
          ru: Там, где Памир касается неба
          uz: Pomir osmonga tegadigan joy
        description:
          en: High passes, the Fann mountains and roads that need a slower pace.
          ru: Высокие перевалы, Фанские горы и дороги, которые требуют спокойного темпа.
          uz: Baland dovonlar, Fan tog'lari va sekin sur'at talab qiladigan yo'llar.
      - type: country
        countrySlug: turkmenistan
        image: assets/images/destinations/turkmenistan.jpg
        badge:
          en: Marble capital and desert roads
          ru: Мраморная столица и пустынные дороги
          uz: Marmar poytaxt va cho'l yo'llari
        description:
          en: Ashgabat, oasis ruins and caravan lines through the Karakum.
          ru: Ашхабад, оазисные руины и караванные линии через Каракумы.
          uz: Ashxobod, voha xarobalari va Qoraqum orqali karvon yo'llari.

  - blockType: regular
    eyebrow:
      en: Impression cards
      ru: Карточки впечатлений
      uz: Taassurot kartochkalari
    title:
      en: How Central Asia feels
      ru: Как ощущается Центральная Азия
      uz: Markaziy Osiyo qanday seziladi
    description:
      en: Six route sensations through which a traveler senses the region before dates, transfers, and city names.
      ru: Шесть маршрутных ощущений, через которые путешественник чувствует регион ещё до дат, переездов и названий городов.
      uz: Sayohatchi mintaqani sanalar, ko'chishlar va shahar nomlaridan oldin his qiladigan oltita marshrut taassuroti.
    gridClassName: sm:grid-cols-2 lg:grid-cols-3
    cards:
      - type: experience
        image: assets/images/experiences/culture-1.jpg
        badge:
          en: Culture
          ru: Культура
          uz: Madaniyat
        title:
          en: Historical walks
          ru: Исторические прогулки
          uz: Tarixiy sayr
        description:
          en: In a historic city, tiles, carved doors, and courtyard shade stop being separate details when a guide connects them to the street around you.
          ru: В историческом городе изразцы, резные двери и тень во дворе перестают быть отдельными деталями, когда гид связывает их с улицей вокруг вас.
          uz: Tarixiy shaharda kafel, o'yma eshiklar va hovli soyasi alohida tafsilot emas — gid ularni atrofdagi ko'chaga bog'laganda.
      - type: experience
        image: assets/images/experiences/craft.jpg
        badge:
          en: Crafts
          ru: Ремёсла
          uz: Hunarmandchilik
        title:
          en: Craft encounters
          ru: Ремесленные встречи
          uz: Hunarmand uchrashuvlari
        description:
          en: In a workshop clay stays on the table and silk thread catches the light. A handmade line never repeats itself twice.
          ru: В мастерской глина остаётся на столе, а шёлковая нить ловит свет. Мастер показывает движение медленно — ручная линия никогда не повторяется дважды.
          uz: Ustaxonada loy stolda qoladi, ipak ipi yorug'likni ushlaydi. Qo'l chizig'i hech qachon ikki marta takrorlanmaydi.
      - type: experience
        image: assets/images/experiences/food.jpg
        badge:
          en: Food
          ru: Еда
          uz: Ovqat
        title:
          en: Bazaar and courtyard
          ru: Базар и двор
          uz: Bozor va hovli
        description:
          en: Bukhara comes closer in small pauses — tea by the water, shade in a courtyard, market voices after the monuments.
          ru: Бухара становится ближе в малых паузах — чай у воды, тень во дворе, голоса лавок и неспешный разговор после памятников.
          uz: Buxoro kichik tanaffuslarda yaqinlashadi — suv yonida choy, hovli soyasi, yodgorliklardan keyin bozor ovozlari.
      - type: experience
        image: assets/images/experiences/culture-2.jpg
        badge:
          en: Culture
          ru: Культура
          uz: Madaniyat
        title:
          en: Sacred heritage in context
          ru: Сакральное наследие в контексте
          uz: Muqaddas meros kontekstda
        description:
          en: Under a dome or by a shrine courtyard, steps grow quieter. A guide opens the human story of the place.
          ru: Под куполом мечети или у двора святыни шаги сами становятся тише. Гид раскрывает человеческую историю места.
          uz: Gumbaz ostida yoki ibodat joyi hovlisida qadamlar o'zi tinchlanadi. Gid joyning insoniy hikoyasini ochadi.
      - type: experience
        image: assets/images/experiences/nature-1.jpg
        badge:
          en: Nature
          ru: Природа
          uz: Tabiat
        title:
          en: Routes in nature
          ru: Маршруты на природе
          uz: Tabiatdagi marshrutlar
        description:
          en: On a mountain road or by a desert lake the route grows quieter. The driver knows where the light shifts and the wind rises.
          ru: На горной дороге или у пустынного озера маршрут становится тише. Водитель знает, где меняется свет и где поднимается ветер.
          uz: Tog' yo'lida yoki cho'l ko'li yonida marshrut tinchlanadi. Haydovchi yorug'lik va shamol qayerda o'zgarishini biladi.
      - type: experience
        image: assets/images/experiences/nature-2.jpg
        badge:
          en: Nature
          ru: Природа
          uz: Tabiat
        title:
          en: Desert and oasis nights
          ru: Пустыня и оазисные ночи
          uz: Cho'l va vohali kechalar
        description:
          en: At the edge of a desert camp after sunset the sand releases its heat and the sky opens wider than the road behind you.
          ru: У края пустынного лагеря после заката песок отпускает жар, а небо раскрывается шире дороги позади вас.
          uz: Cho'l lageri chetida quyosh botgach qum issiqlikni qo'yib yuboradi va osmon ortingizdagi yo'ldan kengroq ochiladi.

  - blockType: regular
    eyebrow:
      en: Trip formats
      ru: Форматы поездок
      uz: Sayohat formatlari
    title:
      en: Every trip has its own rhythm
      ru: У каждой поездки свой ритм
      uz: Har bir sayohatning o'z ritmi bor
    description:
      en: "First we choose the shape of the trip: private pace, group energy, family days, or a business program."
      ru: "Сначала выбираем форму поездки: частный ритм, групповая энергия, семейные дни или деловая программа."
      uz: "Avval sayohat shaklini tanlaymiz: shaxsiy ritm, guruh energiyasi, oilaviy kunlar yoki biznes dastur."
    gridClassName: md:grid-cols-2 lg:grid-cols-4
    cards:
      - type: tripFormat
        icon: user
        badge:
          en: Private
          ru: Частный
          uz: Shaxsiy
        title:
          en: Private tours
          ru: Частные туры
          uz: Shaxsiy turlar
        description:
          en: Dates, pace, and interests shape the trip. The route can stay in Silk Road cities or reach mountains and quieter stops.
          ru: Даты, темп и интересы формируют поездку. Маршрут может оставаться в городах Шёлкового пути или уходить в горы и тихие остановки.
          uz: Sanalar, ritm va qiziqishlar sayohat shaklini belgilaydi. Marshrut Ipak yo'li shaharlarida qolishi yoki tog'larga borishi mumkin.
      - type: tripFormat
        icon: users
        badge:
          en: Group
          ru: Группа
          uz: Guruh
        title:
          en: Group programs
          ru: Групповые программы
          uz: Guruh dasturlari
        description:
          en: A shared departure runs on clear timing. You travel with a group, but the day still leaves room for context, food, and the city.
          ru: Общий выезд держится на ясном тайминге. Вы едете с группой, но в дне остаётся место для контекста, еды и города.
          uz: Umumiy jo'nash aniq vaqtga tayanadi. Guruh bilan sayohat qilasiz, lekin kunda kontekst, ovqat va shahar uchun joy qoladi.
      - type: tripFormat
        icon: heart
        badge:
          en: Family
          ru: Семья
          uz: Oila
        title:
          en: Family pace
          ru: Семейный темп
          uz: Oilaviy ritm
        description:
          en: Shorter days, a softer start, and fewer unnecessary stops help the route work across ages.
          ru: Более короткие дни, мягкий старт и меньше лишних остановок помогают маршруту работать для разных возрастов.
          uz: Qisqaroq kunlar, yumshoq boshlanish va ortiqcha to'xtashsiz marshrut turli yoshlar uchun ishlaydi.
      - type: tripFormat
        icon: briefcase
        badge:
          en: Business
          ru: Бизнес
          uz: Biznes
        title:
          en: MICE and incentive
          ru: MICE и incentive
          uz: MICE va incentive
        description:
          en: Meetings, transfers, meals, and translation move in one rhythm while guests still feel the place.
          ru: Встречи, трансферы, питание и перевод идут в одном ритме, а гости всё равно чувствуют место.
          uz: Uchrashuvlar, transferlar, ovqat va tarjima bir ritmda, mehmonlar joyni his qilishadi.

  - blockType: regular
    eyebrow:
      en: Tours
      ru: Туры
      uz: Turlar
    title:
      en: Tours across Central Asia
      ru: Туры по Центральной Азии
      uz: Markaziy Osiyo bo'ylab turlar
    description:
      en: First route directions. Programs are built around dates, countries, group size, and pace.
      ru: Первые направления маршрутов. Программы собираются под даты, страны, размер группы и темп.
      uz: Birinchi marshrut yo'nalishlari. Dastur sanalar, mamlakatlar, guruh hajmi va ritmga mos yig'iladi.
    cards:
      - type: routeIdea
