          uz: Marshrut so'rash
      - type: routeIdea
        image: assets/images/tours/silk-road.jpg
        badge:
          en: Silk Road
          ru: Шёлковый путь
          uz: Ipak yo'li
        meta:
          en: 7 days · Heritage cities
          ru: 7 дней · Города наследия
          uz: 7 kun · Meros shaharlar
        title:
          en: Silk Road Cities
          ru: Города Шёлкового пути
          uz: Ipak yo'li shaharlar
        description:
          en: Guide, crafts, and quieter evenings between the main stops on the route.
          ru: Гид, ремёсла и более тихие вечера между основными остановками маршрута.
          uz: Gid, hunarmandchilik va asosiy joylar orasidagi tinch kechalar.
        ctaHref: /help/contact
        ctaLabel:
          en: Request a route
          ru: Запросить маршрут
          uz: Marshrut so'rash
      - type: routeIdea
        image: assets/images/tours/multi-country.jpg
        badge:
          en: Multi-country
          ru: Несколько стран
          uz: Bir nechta mamlakat
        meta:
          en: 12 days · Region
          ru: 12 дней · Регион
          uz: 12 kun · Mintaqa
        title:
          en: Central Asia Route
          ru: Маршрут по Центральной Азии
          uz: Markaziy Osiyo marshruti
        description:
          en: A wider regional line — borders, flights, and roads are checked before the program is promised.
          ru: Более широкая региональная линия — границы, перелёты и дороги проверяются до обещания программы.
          uz: Mintaqada kengroq chiziq — chegaralar, reyslar va yo'llar dastur va'da qilinishidan oldin tekshiriladi.
        ctaHref: /help/contact
        ctaLabel:
          en: Request a route
          ru: Запросить маршрут
          uz: Marshrut so'rash

  - blockType: regular
    eyebrow:
      en: Why TourLink
      ru: Почему TourLink
      uz: Nega TourLink
    title:
      en: What changes when one team leads the route
      ru: Что меняется, когда маршрут ведёт одна команда
      uz: Marshrutni bitta jamoa boshqarganda nima o'zgaradi
    cards:
