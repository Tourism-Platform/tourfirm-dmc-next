          ru: 6 дней · Узбекистан
          uz: 6 kun · O'zbekiston
        title:
          en: Uzbekistan Essentials
          ru: Узбекистан — основное
          uz: "O'zbekiston: Asosiy"
        description:
          en: A short first route through Tashkent, Samarkand, and Bukhara tailored to your dates and pace.
          ru: Короткий первый маршрут через Ташкент, Самарканд и Бухару под ваши даты и темп.
          uz: Toshkent, Samarqand va Buxoro orqali qisqa birinchi marshrut — sanalar va ritmingizga mos.
        ctaHref: /catalog?destination=Uzbekistan
        ctaLabel:
          en: Request a route
