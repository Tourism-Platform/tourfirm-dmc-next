    "en": "Ugam-Chatkal gives the Chimgan route its real scale: Western Tien Shan ridges, deep valleys, mountain rivers, juniper slopes, and protected zones that cannot be treated like an ordinary roadside stop. A good visit begins with the right accessible side of the park, not with the idea that the whole park is open in the same way."
    "ru": "Угам-Чаткал показывает настоящий масштаб маршрута к Чимгану: хребты Западного Тянь-Шаня, глубокие долины, горные реки, можжевеловые склоны и охраняемые зоны, к которым нельзя относиться как к обычной остановке у дороги. Хороший визит начинается с подходящего доступного края парка, а не с идеи, что весь парк открыт одинаково."
    "uz": "Ugom-Chotqol Chimyon yo‘liga haqiqiy miqyos beradi: G‘arbiy Tyanshan tizmalari, chuqur vodiylar, tog‘ daryolari, archa yonbag‘irlari va oddiy yo‘l bo‘yidagi bekat kabi qabul qilib bo‘lmaydigan muhofaza zonalari. Yaxshi tashrif butun park bir xil ochiq degan fikrdan emas, mos keladigan kirish tomonini tanlashdan boshlanadi."
