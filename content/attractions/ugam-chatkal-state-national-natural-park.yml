      "ru": "Маршрут понятнее, когда соседние остановки имеют разные роли: Чимганские горы объясняют предгорную среду, Чарвак добавляет воду и дорожный ритм, Бельдерсай даёт вариант выше по склону, а Гулькам становится каньоном с гидом только при подходящих условиях."
      "uz": "Yaqin bekatlar har xil rol o‘ynaganda yo‘l tushunarliroq bo‘ladi: Chimyon tog‘lari tog‘oldi muhitini tushuntiradi, Chorvoq suv va yo‘l ritmini qo‘shadi, Beldersoy balandroq yonbag‘ir variantini beradi, Gulkam esa sharoit mos bo‘lganda gidli kanyonga aylanadi."
