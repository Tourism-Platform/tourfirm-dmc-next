    "title":
      "en": "Choose the accessible edge, not the whole park"
      "ru": "Выбирайте доступный край, а не весь парк сразу"
      "uz": "Butun parkni emas, kirish mumkin bo‘lgan chetni tanlang"
    "description":
      "en": "Treat Ugam-Chatkal as a protected mountain area with different access levels. A good visit starts from a real route side: Chimgan, Beldersay, Khodjikent, Parkent, a river valley, or another visitor-facing point that fits that day."
      "ru": "Угам-Чаткал лучше воспринимать как охраняемую горную территорию с разными уровнями доступа. Хороший визит строится вокруг реального участка маршрута: Чимгана, Бельдерсая, Ходжикента, Паркента, речной долины или другой точки, проверенной под конкретный день."
      "uz": "Ugom-Chotqolni kirish darajalari turlicha bo‘lgan muhofaza tog‘ hududi deb qabul qilish kerak. Yaxshi tashrif real yo‘l tomoni atrofida quriladi: Chimyon, Beldersoy, Xo‘jakent, Parkent, daryo vodiysi yoki shu kun uchun tekshirilgan boshqa nuqta."
  - "blockType": "regular"
