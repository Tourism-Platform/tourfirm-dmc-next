    "title":
      "en": "The protected landscape that gives Chimgan its depth"
      "ru": "Охраняемый ландшафт, который даёт Чимгану глубину"
      "uz": "Chimyonga chuqurlik beradigan muhofaza landshafti"
    "description":
      "en": "Chimgan, Beldersay, Charvak, Khodjikent, and Parkent are the familiar names travelers meet first. Ugam-Chatkal is the protected mountain system behind them: a vast national natural park where route choice must respect conservation zones, weather, road access, and the difference between recreation foothills and restricted nature.


        «Ugam-Chatkal is where Chimgan becomes bigger than a view: rivers, protected valleys, ancient traces, and a guide choosing which side of the park truly fits today.»"
      "ru": "Чимган, Бельдерсай, Чарвак, Ходжикент и Паркент — знакомые названия, с которых путешественник обычно начинает. Угам-Чаткал стоит за ними как большая горная система: национальный природный парк, где выбор маршрута должен учитывать охранные зоны, погоду, дорогу и разницу между рекреационными предгорьями и закрытыми природными участками.


        «Угам-Чаткал — место, где Чимган становится больше, чем вид: реки, охраняемые долины, древние следы и гид, который выбирает подходящую сторону парка на сегодня.»"
      "uz": "Chimyon, Beldersoy, Chorvoq, Xo‘jakent va Parkent sayohatchi avval eshitadigan tanish nomlar. Ugom-Chotqol esa ularning ortidagi katta tog‘ tizimidir: milliy tabiat bog‘i, bu yerda yo‘l tanlovi muhofaza zonalari, ob-havo, yo‘l holati va dam olishga ochiq tog‘oldi bilan yopiq tabiiy qism o‘rtasidagi farqni hisobga olishi kerak.


        «Ugom-Chotqol Chimyoni oddiy manzaradan kattaroq qiladi: daryolar, muhofaza vodiylari, qadimiy izlar va bugun parkning qaysi tomoni mosligini tanlaydigan gid.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Rivers, ridges, and protected foothills"
      "ru": "Реки, хребты и охраняемые предгорья"
      "uz": "Daryolar, tizmalar va muhofaza tog‘oldilari"
    "description":
      "en": "Read the park through a broad mountain sequence: foothill water, open slopes, and the road toward one accessible side of a much larger protected landscape."
      "ru": "Парк лучше понимать через широкую горную последовательность: предгорная вода, открытые склоны и дорога к одной доступной стороне большого охраняемого ландшафта."
      "uz": "Parkni keng tog‘ ketma-ketligi orqali tushunish yaxshiroq: tog‘oldi suvi, ochiq yonbag‘irlar va katta muhofaza landshaftining kirish mumkin bo‘lgan tomoniga boradigan yo‘l."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посещать"
