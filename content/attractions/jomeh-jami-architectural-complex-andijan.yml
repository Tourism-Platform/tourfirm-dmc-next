  "en": "In central Andijan, Jomeh brings the old part of the city into view: a minaret above garden shade, a broad courtyard, carved wooden columns, painted ceilings, and rooms where literary and art displays may be open. Together with Babur Memorial Park, it lets the eastern Fergana route show both memory and architecture before the road continues."
  "ru": "В центре Андижана Джоме показывает старую часть города через конкретные детали: минарет над тенью деревьев, широкий двор, резные деревянные колонны, расписные потолки и залы, где могут быть открыты литературные и художественные экспозиции. Вместе с парком Бабура он показывает на восточном маршруте Ферганской долины и память, и архитектуру до продолжения дороги."
  "uz": "Andijon markazida Jome shaharning eski qismini aniq detallar orqali ko‘z oldingizga keltiradi: daraxt soyasi ustidagi minora, keng hovli, o‘yma yog‘och ustunlar, naqshli shiftlar va ochiq bo‘lsa adabiyot hamda sanʼat ekspozitsiyalari joylashgan xonalar. Bobur bog‘i bilan birga u sharqiy Farg‘ona yo‘lida davom etishdan oldin xotira va meʼmoriyatni yonma-yon ko‘rsatadi."
