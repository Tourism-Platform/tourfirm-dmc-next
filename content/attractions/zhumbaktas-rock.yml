      "uz": "Jumbaqtas ixcham belgi, shuning uchun tashrif koʻp bekatlarga emas, manzara sifatiga tayanadi. Suv, yorugʻlik, qirgʻoq holati va atrofdagi qaragʻaylar qoya qanday koʻrinishini oʻzgartiradi."
