    "title":
      "en": "Where the lake view becomes a landmark"
      "ru": "Где озёрный вид становится ориентиром"
      "uz": "Koʻl manzarasi aniq shakl oladigan joy"
    "description":
      "en": "Zhumbaktas gives Lake Burabay a memorable silhouette. The rock is small beside the wider park, but it carries an important route role: it focuses the water view, gives the shore a clear direction, and ties the lake to the granite-and-pine landscape around the resort.


        «Zhumbaktas is strongest when the route slows down enough to let one rock, one lake view, and one careful angle carry the memory.»"
      "ru": "Жумбактас даёт озеру Бурабай запоминающийся силуэт. Скала невелика рядом с большим парком, но важна для маршрута: она фокусирует вид через воду, подсказывает, куда смотреть с берега, и связывает озеро с гранитно-сосновым ландшафтом.


        «Жумбактас запоминается, когда маршрут замедляется достаточно, чтобы одна скала, один озёрный вид и один удачный угол удержали всю сцену.»"
      "uz": "Jumbaqtas Burabay koʻliga esda qoladigan siluet beradi. Qoya keng park yonida kichik koʻrinadi, lekin marshrutda muhim rol oʻynaydi: suv manzarasini aniq qiladi, qirgʻoqqa yoʻnalish beradi va koʻlni granit hamda qaragʻayli manzara bilan bogʻlaydi.


        «Marshrut yetarlicha sekinlashganda Jumbaqtas esda qoladi: bitta qoya, bitta koʻl manzarasi va eʼtibor bilan tanlangan bitta burchak.»"
  - "blockType": "regular"
