    "description":
      "en": "Meros turns the village stop from a rural pause into a material story: water, handwork, paper fibre, and yellowish sheets made without chemical bleaching.


        «At Meros, Konigil becomes tactile: water turns, hands shape fiber, and paper gives the village a memory you can hold.»"
      "ru": "Meros превращает сельскую паузу в материальную историю: вода, ручной труд, бумажное волокно и желтоватые листы без химического отбеливания.


        «В Meros Конигил становится осязаемым: вода вращается, руки ведут процесс, а бумага даёт селу память, которую можно держать в руках.»"
      "uz": "Meros qishloq pauzasini moddiy hikoyaga aylantiradi: suv, qo‘l mehnati, qog‘oz tolasi va kimyoviy oqartirilmagan sarg‘ish varaqlar.


        «Merosda Konigil sezilarli bo‘ladi: suv aylanadi, qo‘llar harakat qiladi, qog‘oz esa qishloqqa qo‘lda ushlanadigan xotira beradi.»"
