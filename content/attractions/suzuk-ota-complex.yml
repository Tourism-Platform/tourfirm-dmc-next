      "en": "The strongest viewing order is simple: first the mosque and mausoleum, then the restored mahalla setting, then the craft story that explains why Suzuk-Ota belongs in an old-city route."
      "ru": "Лучше смотреть место простым порядком: сначала мечеть и мавзолей, затем восстановленную махаллинскую среду, потом ремесленную историю, которая объясняет, почему Сузук-Ота нужен маршруту по старому городу."
      "uz": "Joyni oddiy tartibda ko‘rish yaxshi: avval masjid va maqbara, keyin tiklangan mahalla muhiti, so‘ng Suzuk Ota nega eski shahar yo‘liga kirishini tushuntiradigan hunar tarixi."
  - "blockType": "regular"
