  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "Where old Tashkent remembers craft and faith together"
      "ru": "Где старый Ташкент держит вместе ремесло и веру"
      "uz": "Eski Toshkent hunar va eʼtiqodni birga saqlaydigan joy"
    "description":
      "en": "Chorsu gives old Tashkent its sound: bread sellers, market calls, fabric, spice and movement. Suzuk-Ota changes the scale. The stop is calmer, more residential and more tied to memory. It helps you see the old city not only through monuments, but through a mahalla where religious teaching and craft skill have long belonged side by side.


        «At Suzuk-Ota, old Tashkent feels close to daily hands: prayer, memory, craft and a mahalla that still has a human scale.»"
      "ru": "Чорсу даёт старому Ташкенту звук: продавцы лепёшек, рыночные голоса, ткани, специи и движение. Сузук-Ота меняет масштаб. Остановка спокойнее, ближе к жилой махалле и сильнее связана с памятью. Она помогает увидеть старый город не только через памятники, но и через место, где религиозное учение и ремесленное мастерство долго существовали рядом.


        «У Сузук-Ота старый Ташкент близок к ежедневному труду: молитва, память, ремесло и махалля человеческого масштаба.»"
      "uz": "Chorsu eski Toshkentga ovoz beradi: non sotuvchilari, bozor chaqiriqlari, matolar, ziravorlar va harakat. Suzuk Otada ritm sekinlashadi. To‘xtam sokinroq, yashash mahallasiga yaqinroq va xotiraga ko‘proq bog‘langan. U eski shaharni faqat yodgorliklar orqali emas, diniy taʼlim va hunarmandchilik mahorati uzoq vaqt yonma-yon yashagan mahalla orqali ko‘rishga yordam beradi.


        «Suzuk Otada eski Toshkent kundalik qo‘l mehnatiga yaqinlashadi: ibodat, xotira, hunar va insoniy ko‘lamdagi mahalla.»"
  - "blockType": "regular"
    "eyebrow":
