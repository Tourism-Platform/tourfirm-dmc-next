    "description":
      "en": "Suzuk-Ota is religious, memorial and residential in feeling. Keep the visit calm: check current access, dress modestly, and let the craft story support the stop rather than overpower the mosque and mausoleum."
      "ru": "Сузук-Ота ощущается как религиозное, мемориальное и соседское место. Пусть визит будет спокойным: проверьте актуальный доступ, выберите скромную одежду и дайте ремесленной истории поддержать остановку, а не перекрыть мечеть и мавзолей."
      "uz": "Suzuk Ota diniy, xotira va qo‘shnichilik joyi kabi seziladi. Tashrif sokin bo‘lsin: joriy kirishni tekshiring, kamtarona kiyim tanlang va hunar tarixi masjid hamda maqbarani bosib ketmasin, aksincha ularni qo‘llab tursin."
