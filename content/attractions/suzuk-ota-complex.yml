      "uz": "Chorsu, Ko‘kaldosh, Hazrati Imom va Shayxontohur Suzuk Otani to‘g‘ri muhitda saqlaydi: bozor hayoti, madrasa ko‘lami, diniy ansambl va eski shahar yo‘li atrofidagi xotira sokinligi."
