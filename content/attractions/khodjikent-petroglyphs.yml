    "en": "Khodjikent does not need to fill half a day. It needs the right light, a guide who can help the eye find the carved lines, and a visit calm enough to keep hands, water, chalk, shoes, and staged photos away from the stone."
    "ru": "Ходжикенту не нужен визит на полдня. Ему нужны подходящий свет, гид, который поможет глазу найти вырезанные линии, и спокойный формат без рук, воды, мела, обуви и постановочных кадров на камне."
    "uz": "Xo‘jakent yarim kunlik tashrifni talab qilmaydi. Unga to‘g‘ri yorug‘lik, chiziqlarni ko‘zga ko‘rsatadigan gid va toshdan qo‘l, suv, bo‘r, oyoq kiyim hamda sahnalashtirilgan suratlarni uzoq tutadigan sokin format kerak."
