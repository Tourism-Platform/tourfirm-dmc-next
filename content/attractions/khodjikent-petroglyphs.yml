    "title":
      "en": "Where the mountain road meets older marks"
      "ru": "Где горная дорога встречает более древние следы"
      "uz": "Tog‘ yo‘li qadimiy izlar bilan uchrashadigan joy"
    "description":
      "en": "The Chimgan side is often remembered for water, lift stations, ridges, and cooler air. Khodjikent changes that rhythm. Near the road toward Charvak, Beldersay, and Chimgan, the foothills also hold a quieter record: carved animals, people, and signs softened by weather on limestone rock.


        «At Khodjikent, the Chimgan road pauses long enough for older marks to come into view.»"
      "ru": "Сторону Чимгана чаще запоминают по воде, подъёмникам, хребтам и прохладному воздуху. Ходжикент меняет этот ритм. Рядом с дорогой к Чарваку, Бельдерсаю и Чимгану предгорья хранят более тихий след: животных, людей и знаки, выбитые на известняке и смягчённые временем.


        «В Ходжикенте дорога в Чимган замедляется настолько, чтобы на камне проступили более древние следы.»"
      "uz": "Chimyon tomoni ko‘pincha suv, liftlar, qirlar va salqin havo bilan esda qoladi. Xo‘jakent bu ritmni o‘zgartiradi. Chorvoq, Beldersoy va Chimyonga boradigan yo‘l yaqinida tog‘oldilar yana sokinroq izni ham saqlaydi: ohaktoshga o‘yilgan, vaqt yumshatgan hayvonlar, odamlar va belgilar.


        «Xo‘jakentda Chimyon yo‘li toshdagi qadimiy izlar ko‘rinadigan darajada sekinlashadi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Weathered lines on foothill stone"
      "ru": "Выветренные линии на предгорном камне"
      "uz": "Tog‘oldi toshidagi yemirilgan chiziqlar"
    "description":
      "en": "The viewing rhythm should move from the larger rock surface to the carved details and then back to the Chirchik foothill setting."
      "ru": "Осмотр лучше строить от общей поверхности скалы к вырезанным деталям, а затем снова к предгорному окружению Чирчика."
      "uz": "Ko‘rish ritmi avval qoyaning umumiy sirtidan o‘yilgan detallarga, keyin esa yana Chirchiq tog‘oldi muhitiga qaytishi kerak."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посещать"
      "uz": "Qanday ko‘rish"
    "title":
      "en": "Read the stone without touching it"
      "ru": "Читать камень, не касаясь его"
      "uz": "Toshni unga tegmasdan o‘qish"
    "description":
      "en": "Khodjikent works best with a guide and a small, patient stop. Check access first, then let the viewing stay slow enough for shallow lines to appear without turning the rock into a backdrop."
      "ru": "Ходжикент лучше раскрывается с гидом и в небольшом, терпеливом формате. Сначала проверьте доступ, затем дайте осмотру замедлиться настолько, чтобы неглубокие линии проявились без превращения скалы в фон."
      "uz": "Xo‘jakent gid bilan va kichik, sabrli to‘xtash sifatida yaxshiroq ochiladi. Avval kirishni tekshiring, keyin sayoz chiziqlar ko‘rinishi uchun shoshilmasdan toshga qarang va qoyani surat foni qilib yubormang."
  - "blockType": "regular"
