    "ru": "Фасад уже часть истории: кубическое здание 1970 года с бледными геометрическими экранами. Когда музей открыт, визит переходит из этой модернистской оболочки к большой истории страны; пока идёт ремонт, место лучше воспринимать как короткую архитектурную остановку, если доступ внутрь не подтверждён."
    "uz": "Fasadning o‘zi ham hikoyaning bir qismi: 1970 yildagi kubsimon bino och rangli geometrik ekranlar bilan o‘ralgan. Kirish ochiq bo‘lsa, tashrif shu modernistik qobiqdan mamlakatning chuqurroq tarixiga o‘tadi; taʼmir davom etsa, kirish tasdiqlanmaguncha bu joy qisqa tashqi meʼmoriy pauza sifatida qoladi."
