      "en": "This is the Tashkent museum for the full historical arc rather than one dynasty or one art form. Its lineage begins in 1876, its holdings run into the hundreds of thousands, and the building itself is a late Soviet modernist landmark. The strongest visit pairs that scale with a current access check, so travelers know whether they are entering the halls or reading the building from outside.


        «The museum works best when the access question is settled first: national history inside the halls, a brief architecture pause if repairs are still underway.»"
      "ru": "Это ташкентский музей не про одну династию и не про один вид искусства, а про большой исторический размах. Его музейная линия начинается в 1876 году, фонды исчисляются сотнями тысяч предметов, а само здание стало памятным примером позднесоветского модернизма. Самый сильный визит получается тогда, когда масштаб коллекции соединён с честной проверкой текущего доступа.


        «Место раскрывается после проверки доступа: история страны внутри залов или короткая архитектурная пауза, если ремонт ещё продолжается.»"
      "uz": "Bu Toshkentdagi bitta sulola yoki bitta sanʼat turi haqidagi muzey emas, balki katta tarixiy kenglik haqidagi joy. Uning muzey tarixi 1876 yildan boshlanadi, fondlari yuz minglab buyumlardan iborat, va binoning o‘zi kech sovet modernizmining esda qoladigan namunasi. Eng yaxshi tashrif kolleksiya ko‘lamini hozirgi kirish holatini aniq tekshirish bilan birlashtirganda paydo bo‘ladi.


        «Bu joy kirish holati aniqlanganda yaxshi ochiladi: zallar ochiq bo‘lsa mamlakat tarixi, taʼmir davom etsa qisqa meʼmoriy pauza.»"
