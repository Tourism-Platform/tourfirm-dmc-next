    "description":
      "en": "Kolsai and Lake Kaindy are stronger as the next mountain section after Saty, not as casual add-ons to Charyn. Pair them with the canyon only when daylight, weather, road time, and overnight plans support the move."
      "ru": "Кольсай и озеро Каинды сильнее как следующий горный участок после Саты, а не как случайное дополнение к Чарыну. Соединяйте их с каньоном только когда световой день, погода, время в дороге и план ночёвки поддерживают такой переход."
      "uz": "Kolsai va Kaindy Charynga tasodifiy qo'shimcha emas, Saty ortidan keladigan keyingi tog' qismidir. Ularni kanyon bilan faqat kunduzgi yorug'lik, ob-havo, yo'l vaqti va tunash rejasi bunga imkon berganda bog'lang."
