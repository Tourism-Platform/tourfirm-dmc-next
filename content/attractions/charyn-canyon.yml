      "ru": "Красные стены, выветренные формы и река Чарын"
      "uz": "Qizil devorlar, yemirilgan shakllar va Charyn daryosi"
    "description":
      "en": "Three elements make Charyn legible on the ground: red rock, open steppe, and the river line below the walls."
      "ru": "На месте Чарын складывается из трёх простых элементов: красной породы, открытой степи и линии реки под стенами."
      "uz": "Charyni joyida uch oddiy unsur tushuntiradi: qizil tosh, ochiq dasht va devorlar ostidagi daryo chizig'i."
  - "blockType": "regular"
    "eyebrow":
