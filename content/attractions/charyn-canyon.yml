      "en": "Charyn is a protected canyon visit. Before you commit to the walk, check the access rules, heat, wind, daylight, and return road."
      "ru": "Чарын — это визит в охраняемый каньон. До подтверждения прогулки проверьте правила доступа, жару, ветер, световой день и обратную дорогу."
      "uz": "Charyn muhofaza qilinadigan kanyon tashrifidir. Yurishni tasdiqlashdan oldin kirish qoidalari, issiq, shamol, kunduzgi yorug'lik va qaytish yo'lini tekshiring."
  - "blockType": "regular"
