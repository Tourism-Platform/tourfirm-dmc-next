    "title":
      "en": "Where the Almaty road reaches canyon country"
      "ru": "Где дорога из Алматы приходит в страну каньонов"
      "uz": "Almaty yo'li kanyon manzarasiga yetadigan joy"
    "description":
      "en": "Charyn gives southeast Kazakhstan one of its clearest landscape shifts. The protected park lies about 200 km east of Almaty; a first visit usually centers on the Charyn gorge and Valley of Castles route, where the road, wind, rock, and river make scale visible.


        «Charyn is strongest when you have time to leave the rim, feel the wind, and return before heat or daylight starts making the decisions.»"
      "ru": "Чарын даёт юго-восточному Казахстану одну из самых заметных смен ландшафта. Охраняемый парк находится примерно в 200 км к востоку от Алматы; первая поездка обычно строится вокруг Чарынского ущелья и маршрута Долины замков, где дорога, ветер, камень и река делают масштаб видимым.


        «Чарын сильнее всего, когда у вас есть время отойти от края, почувствовать ветер и вернуться до того, как жара или световой день начнут диктовать решения.»"
      "uz": "Charyn janubi-sharqiy Qozog'istonda landshaftning eng aniq o'zgarishlaridan birini beradi. Muhofaza qilingan park Almatydan taxminan 200 km sharqda joylashgan; birinchi tashrif odatda Charyn darasi va Qal'alar vodiysi yo'nalishi atrofida quriladi, bu yerda yo'l, shamol, tosh va daryo miqyosni ko'rsatadi.


        «Charyn eng kuchli taassurotni chetdan uzoqlashish, shamolni his qilish va issiq yoki yorug'lik qarorni belgilashidan oldin qaytishga vaqt bo'lganda beradi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
