    "description":
      "en": "This is a modest local museum, and that scale is part of its value. After Ancient Penjikent or before Sarazm, the rooms give the valley's archaeology, literature, and town history a quieter human frame.


        «Inside the museum, Penjikent's archaeology becomes names, objects, and literary memory.»"
      "ru": "Это скромный местный музей, и в этой камерности есть его ценность. После Древнего Пенджикента или перед Саразмом залы дают археологии долины, литературе и истории города более человеческий масштаб.


        «В залах Пенджикента археология становится именами, предметами и литературной памятью.»"
      "uz": "Bu katta emas, mahalliy muzey; aynan shu ixchamlik uning kuchi. Qadimiy Panjikentdan keyin yoki Sarazmdan oldin u sayohatchiga vodiy arxeologiyasi, adabiy xotira va shahar tarixini birga tushunish uchun sokin xonalar beradi.


        «Muzey xonalarida Panjikent arxeologiyasi ism, buyum va adabiy xotiraga aylanadi.»"
