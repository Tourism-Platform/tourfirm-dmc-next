    "description":
      "en": "See the museum gradually: painting and color first, then Karakalpak objects and archaeological material that connect the galleries with the route farther across the region."
      "ru": "Смотрите музей постепенно: сначала живопись и цвет, затем каракалпакские предметы и археологические материалы, которые связывают зал с дорогой дальше по региону."
      "uz": "Muzeyni bosqichma-bosqich ko‘ring: avval rangtasvir va rang, keyin zallarni mintaqa bo‘ylab davom etadigan yo‘l bilan bog‘laydigan qoraqalpoq buyumlari va arxeologik materiallar."
