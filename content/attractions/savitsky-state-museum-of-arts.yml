  "en": "The Savitsky Museum is the reason to pause in Nukus instead of treating the city as a transfer. Inside, Russian avant-garde painting, Karakalpak craft, archaeological material, and Igor Savitsky's collecting story bring the region close before the route continues toward Moynaq, Chilpyk, or Ellikqala."
