    "ru": "Музей Савицкого — причина задержаться в Нукусе, а не проехать мимо по дороге дальше. В его залах русский авангард, каракалпакское ремесло, археологические материалы и история Игоря Савицкого помогают увидеть регион до маршрута к Муйнаку, Чилпыку или Элликкале."
    "uz": "Savitskiy muzeyi Nukusdan shunchaki o‘tib ketmaslik uchun sababdir. Uning zallarida rus avangard rangtasviri, qoraqalpoq hunari, arxeologik materiallar va Igor Savitskiy hikoyasi Mo‘ynoq, Chilpiq yoki Ellikqal’a yo‘lidan oldin mintaqani yaqinlashtiradi."
