    "description":
      "en": "For many travelers, this is where Karakalpakstan stops being only a distance on the map. The collection brings Russian avant-garde painting, Karakalpak applied art, archaeology, and regional objects together, so the western Uzbekistan route begins with people, objects, and collected history."
      "ru": "Для многих путешественников именно здесь Каракалпакстан перестаёт быть только расстоянием на карте. Коллекция соединяет русский авангард, каракалпакское прикладное искусство, археологию и региональные предметы, поэтому знакомство с западом Узбекистана начинается с людей, вещей и собранной истории."
      "uz": "Ko‘p sayohatchilar uchun Qoraqalpog‘iston shu yerda xaritadagi masofadan ko‘ra aniqroq bo‘la boshlaydi. Kolleksiya rus avangard rangtasviri, qoraqalpoq amaliy sanʼati, arxeologiya va mintaqaviy buyumlarni birlashtiradi, shuning uchun g‘arbiy O‘zbekiston yo‘li odamlar, buyumlar va yig‘ilgan tarixdan boshlanadi."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Painting, craft, and ancient Khorezm"
      "ru": "Живопись, ремесло и древний Хорезм"
