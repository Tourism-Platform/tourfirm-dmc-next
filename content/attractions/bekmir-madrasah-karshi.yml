      "uz": "Bekmir muhim, chunki Qarshining taʼlim tarixi faqat katta fasadlarda saqlanmaydi. Sokin portal, hovli rejasi va Bekmurodboy nomi bilan bog‘liqlik eski markazni yanada tirikroq ko‘rsatadi, ayniqsa uni Odina, Sardoba, Qilichboy va Abdulazizxon yonida ko‘rganingizda."
