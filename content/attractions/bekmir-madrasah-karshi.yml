  "en": "Bekmir Madrasah brings a quieter scale to Qarshi's old-city walk. After Kilichboy and Abdulazizkhan, its 1911 courtyard, small cells, and women's study memory show how education once lived in the spaces between the city's larger landmarks."
  "ru": "Медресе Бекмир вводит в прогулку по старому Карши более камерный масштаб. После Киличбоя и Абдулазизхана его двор 1911 года, небольшие кельи и память о женском обучении показывают, как образование жило между крупными городскими ориентирами."
  "uz": "Bekmir madrasasi eski Qarshi sayriga sokinroq miqyos olib kiradi. Qilichboy va Abdulazizxondan keyin uning 1911 yilgi hovlisi, kichik hujralari va ayollar taʼlimi xotirasi taʼlim shahar yirik yodgorliklari orasida qanday yashaganini ko‘rsatadi."
