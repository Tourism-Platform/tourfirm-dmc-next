      "uz": "Dushanbe soya, xiyobon va sokin sayr bilan boshlanishi mumkin; muzey esa unga mamlakat miqyosini qoʻshadi. U poytaxtni eski yoʻllar, baland landshaftlar, shahar xotirasi va tojik hayotining materiallari bilan tushunarli qiladi."
  - "blockType": "regular"
    "eyebrow":
