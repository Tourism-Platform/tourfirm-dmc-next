      "en": "The strongest visit chooses a few visible threads: the country in maps and halls, objects that make its history tangible, and context for the roads still ahead."
      "ru": "Самый сильный визит выбирает несколько видимых тем: страну на картах и в залах, предметы, которые делают историю ощутимой, и контекст для дорог впереди."
      "uz": "Eng kuchli tashrif bir nechta koʻrinadigan mavzuni tanlaydi: xaritalar va zallardagi mamlakat, tarixni sezilarli qiladigan buyumlar va oldindagi yoʻllar uchun kontekst."
