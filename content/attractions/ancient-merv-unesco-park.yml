      "uz": "Qadimiy Marv tanlangan yo‘l bilan yaxshiroq ochiladi: kamroq to‘xtash, yaxshiroq izoh, salqin soatlar va mo‘rt qoldiqlar yonida ehtiyotkor yurish."
