      "uz": "Bir vohadagi bir nechta shahar"
    "description":
      "en": "This is the main reason Merv belongs in a first journey through Turkmenistan. The World Heritage area brings together a sequence of urban centres and remains, from early settlements to Islamic and Seljuk city forms and later walls.


        «Ancient Merv is not one view to collect; it is a slow route through walls, open terrain, and the memory of several cities.»"
      "ru": "Это главный повод включить Мерв в первый маршрут по Туркменистану. Объект Всемирного наследия собирает последовательность городских центров и остатков: от ранних поселений до исламских, сельджукских и более поздних городских форм.


        «Древний Мерв — не один вид на память, а медленный маршрут через стены, открытое пространство и следы нескольких городов.»"
      "uz": "Bu Marvni Turkmaniston bo‘ylab ilk yo‘nalishga kiritadigan asosiy sabab. Jahon merosi hududi erta manzilgohlardan islomiy, saljuqiy va keyingi shahar shakllarigacha bo‘lgan markazlar va qoldiqlar ketma-ketligini bir joyda ko‘rsatadi.


        «Qadimiy Marv bitta manzara emas; u devorlar, ochiq hudud va bir nechta shahar izlari orasidagi sekin yo‘ldir.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Walls, tells, and desert-edge space"
      "ru": "Стены, холмы и пространство у пустыни"
      "uz": "Devorlar, tepaliklar va cho‘l chekkasi"
    "description":
      "en": "The clearest first readings are the scale of the site, the wall lines that break the horizon, and the distances that make Merv feel like a landscape rather than a courtyard."
      "ru": "Первые ориентиры здесь простые и сильные: масштаб площадки, линии стен на горизонте и расстояния между остановками."
      "uz": "Bu yerda birinchi ko‘rinadigan belgilar sodda va kuchli: hudud miqyosi, ufqda uzilgan devor chiziqlari va to‘xtashlar orasidagi masofa."
  - "blockType": "regular"
