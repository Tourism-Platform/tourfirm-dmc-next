    "description":
      "en": "Each nearby stop changes the trip differently: Charvak brings water, Amirsoy or Beldersay bring resort roads, Gulkam brings a guided gorge, and Ugam-Chatkal opens wider protected nature."
      "ru": "Каждая соседняя остановка меняет поездку по-своему: Чарвак даёт воду, Амирсой или Бельдерсай — курортные дороги, Гулькам — ущелье с гидом, а Угам-Чаткал — более широкую охраняемую природу."
      "uz": "Chimyon atrofidagi har bir davom yo‘li sayohatni boshqacha o‘zgartiradi: Chorvoq suv beradi, Amirsoy yoki Beldersoy kurort yo‘llarini ochadi, Gulkam gidli darani beradi, Ugom-Chotqol esa kengroq qo‘riqlanadigan tabiatga olib kiradi."
