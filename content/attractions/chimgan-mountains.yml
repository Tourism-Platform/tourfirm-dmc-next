  "uz": "Chimyon — Toshkentdan chiqqan yo‘l ilk bor tog‘lik tus oladigan joy: yo‘l chetida maysa, oldinda tizmalar, ufqda esa Katta Chimyon ko‘rinadi. Yaxshi tashrif bitta aniq niyatdan boshlanadi: ochiq manzara, yonbag‘ir havosi, kurort yo‘li yoki gidli yurish."
