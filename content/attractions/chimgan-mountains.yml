  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "Where Tashkent first gives way to mountain air"
      "ru": "Где Ташкент впервые уступает место горам"
      "uz": "Toshkent yo‘li ilk bor tog‘larga kiradigan joy"
    "description":
      "en": "Chimgan matters because it changes the scale of a Tashkent journey quickly. After bazaars, museums, and city squares, the route can climb into open slopes, juniper air, dry ridges, winter snow, or a guided nature walk without adding a domestic flight.


        «Chimgan works best as a deliberate mountain pause: open views, a quiet hour on the slopes, or a guided trail.»"
      "ru": "Чимган важен потому, что быстро меняет масштаб поездки из Ташкента. После базаров, музеев и городских площадей маршрут может подняться к открытым склонам, можжевеловому воздуху, сухим хребтам, зимнему снегу или прогулке с местным гидом без внутреннего перелёта.


        «Чимган сильнее всего раскрывается как продуманная горная пауза: открытые виды, спокойный час на склонах или прогулка с гидом.»"
      "uz": "Chimyon Toshkent safarining miqyosini tez o‘zgartirgani uchun muhim. Bozorlar, muzeylar va shahar maydonlaridan keyin yo‘nalish uzoq ichki parvoz qo‘shmasdan ochiq yonbag‘irlar, archa hidi, quruq tizmalar, qishki qor yoki mahalliy gid bilan tabiat yurishiga ko‘tarilishi mumkin.


        «Chimyon aniq tog‘ pauzasi bo‘lganda kuchliroq ochiladi: ochiq manzara, yonbag‘irdagi sokin vaqt yoki gidli yurish.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Peaks, slopes, and the road into the hills"
      "ru": "Вершины, склоны и дорога в горы"
      "uz": "Cho‘qqilar, yonbag‘irlar va tog‘ga kiradigan yo‘l"
    "description":
      "en": "The Chimgan view is not a single frame. It shifts from open slopes and cloud shadows to dry tracks, rocky ridges, and snow that can still catch light above the valley."
      "ru": "Чимганский вид не сводится к одному кадру. Он меняется от открытых склонов и теней облаков к сухим дорогам, скальным склонам и снегу, который ещё может ловить свет над долиной."
      "uz": "Chimyon manzarasi bitta kadr bilan tugamaydi. U ochiq yonbag‘irlar va bulut soyalaridan quruq yo‘llar, qoyali yonbag‘irlar va vodiy ustida hali yorug‘lik tutadigan qorgacha o‘tadi."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посещать"
      "uz": "Qanday ko‘rish"
    "title":
      "en": "Set the mountain plan before leaving Tashkent"
      "ru": "Определите горный план до выезда из Ташкента"
      "uz": "Toshkentdan chiqishdan oldin tog‘ rejasini belgilang"
    "description":
      "en": "Chimgan can stay gentle or become active. Before departure, set the visit as a viewpoint, slope air, resort time, guided walk, or onward mountain road."
      "ru": "Чимган может быть спокойным или активным. До выезда задайте визиту ясную форму: обзорная точка, воздух склонов, курортное время, прогулка с гидом или дальнейшая горная дорога."
      "uz": "Chimyon sokin ham, faol ham bo‘lishi mumkin. Yo‘lga chiqishdan oldin tashrif tomosha nuqtasimi, yonbag‘ir havosimi, kurort vaqti, gidli yurish yoki keyingi tog‘ yo‘limi, shuni aniqlang."
  - "blockType": "regular"
