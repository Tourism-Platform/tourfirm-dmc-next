    "description":
      "en": "The stop is best understood through three views: the wide lake surface, the village-road setting, and the continuation toward the upper lakes. 1. **Broad lake view** **alt:** Marguzor Lake widening the Seven Lakes route in Tajikistan. **caption:** Marguzor gives Haftkul its broadest lake pause. **media_label:** Marguzor wide lake view 2. **Village-road setting** **alt:** The Seven Lakes road and village setting near Marguzor Lake. **caption:** The lived valley shapes the pace and care of the stop. **media_label:** Marguzor road and village setting 3. **Road toward the upper lakes** **alt:** The road continuing from Marguzor toward the upper Haftkul lakes. **caption:** Marguzor is the natural place to review whether the route should continue higher. **media_label:** Road above Marguzor"
      "ru": "Остановку лучше читать через три простых вида: широкую поверхность озера, сельскую дорогу вокруг него и продолжение к верхним озёрам. 1. **Широкий вид озера** **alt:** Озеро Маргузор расширяет маршрут Семи озёр в Таджикистане. **caption:** Маргузор даёт Хафткулю самую широкую озёрную паузу. **media_label:** Широкий вид озера Маргузор 2. **Сёла и дорога** **alt:** Дорога Семи озёр и сельская жизнь рядом с озером Маргузор. **caption:** Живая долина задаёт темп и бережность этой остановки. **media_label:** Дорога и кишлак у Маргузора 3. **Решение о подъёме** **alt:** Дорога от Маргузора к верхним озёрам Хафткуль. **caption:** Маргузор - естественное место, чтобы проверить, стоит ли продолжать выше. **media_label:** Дорога выше Маргузора"
      "uz": "Bu toʻxtash uch oddiy ko‘rinish orqali yaxshi tushuniladi: keng ko‘l yuzasi, qishloq-yo‘l muhiti va yuqori ko‘llar tomon davom. 1. **Keng koʻl manzarasi** **alt:** Tojikistondagi Yetti Koʻl yoʻlini kengaytiradigan Marguzor ko‘li. **caption:** Marguzor Haftkoʻlga eng keng koʻl pauzasini beradi. **media_label:** Marguzor keng koʻl manzarasi 2. **Qishloq va yoʻl muhiti** **alt:** Marguzor ko‘li yaqinidagi Yetti Koʻl yoʻli va qishloq muhiti. **caption:** Tirik vodiy toʻxtash surʼati va ehtiyotkorligini belgilaydi. **media_label:** Marguzor yoʻli va qishloq muhiti 3. **Yuqori yoʻl qarori** **alt:** Marguzordan Haftkoʻlning yuqori koʻllari tomon davom etadigan yoʻl. **caption:** Marguzor yuqoriga davom etish kerakmi degan savolni tekshirish uchun tabiiy joy. **media_label:** Marguzordan keyingi yoʻl"
