    "description":
      "en": "Marguzor matters because it is the route's broadest lake anchor. The lower lakes introduce the sequence; Marguzor gives travelers the fuller water view that makes Seven Lakes feel like a mountain-lake visit, not only a road with stops.


        «Marguzor is the lake that lets the Seven Lakes route stop counting and start settling.»"
      "ru": "Маргузор важен, потому что это самый широкий озёрный якорь маршрута. Нижние озёра вводят в последовательность; Маргузор даёт путешественникам большой водный вид, благодаря которому Семь озёр ощущаются горно-озёрным маршрутом, а не только дорогой с остановками.


        «Маргузор - озеро, где маршрут Семи озёр перестаёт считать остановки и начинает оседать в памяти.»"
      "uz": "Marguzor muhim, chunki u yoʻnalishning eng keng koʻl tayanchidir. Pastki koʻllar ketma-ketlikni boshlab beradi; Marguzor esa sayohatchiga katta suv manzarasini beradi va Yetti Koʻlni shunchaki toʻxtashlar yoʻli emas, togʻ-koʻl tashrifi sifatida his qildiradi.


        «Marguzor - Yetti Koʻl yoʻli sanashdan toʻxtab, xotirada joylashishni boshlaydigan ko‘l.»"
