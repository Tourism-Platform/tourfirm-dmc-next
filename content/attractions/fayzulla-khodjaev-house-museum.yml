  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "Old Bukhara inside a merchant house"
      "ru": "Старая Бухара внутри купеческого дома"
      "uz": "Eski Buxoro savdogar uyi ichida"
    "description":
      "en": "After the minarets, domes, and citadel walls, the route enters rooms. Painted ceilings, carved timber, household objects, and family biography make old Bukhara more than a sequence of public monuments.


        «Old Bukhara also lives in rooms, objects, and family stories.»"
      "ru": "После минаретов, куполов и стен Арка маршрут переходит в комнаты. Расписные потолки, резное дерево, бытовые предметы и семейная биография показывают старую Бухару не только через большие памятники.


        «Старая Бухара живёт и в комнатах, предметах, семейных историях.»"
      "uz": "Minoralar, gumbazlar va Ark devorlaridan keyin bu yerda sayr xonalarga kiradi. Bezakli shiftlar, o‘yma yog‘och, maishiy buyumlar va oilaviy tarix eski Buxoroni faqat katta yodgorliklar orqali emas, uy ichidan ham ko‘rsatadi.


        «Eski Buxoro xonalar, buyumlar va oilaviy hikoyalarda ham yashaydi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you will see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Courtyards, painted rooms, and household objects"
      "ru": "Дворы, расписные комнаты и бытовые предметы"
      "uz": "Hovlilar, bezakli xonalar va maishiy buyumlar"
    "description":
      "en": "Start with courtyards and painted rooms, then look at the objects that connect the house to merchant life: clothing, tableware, instruments, and kitchen displays."
      "ru": "Начните с дворов и расписных комнат, затем смотрите на предметы, которые связывают дом с купеческой жизнью: одежду, посуду, инструменты и кухонные экспозиции."
      "uz": "Avval hovlilar va bezakli xonalarni ko‘ring, keyin uyni savdogar hayoti bilan bog‘laydigan buyumlarga qarang: kiyim, idishlar, cholg‘u asboblari va oshxona ekspozitsiyalari."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посещать"
      "uz": "Qanday ko‘rish"
    "title":
      "en": "Give the house time"
      "ru": "Оставьте время для дома"
      "uz": "Xonalarga vaqt qoldiring"
    "description":
      "en": "The visit works best when the rooms stay connected to the people who used them: how the house was arranged, what the objects say about domestic life, and how Fayzulla Khodjaev's biography connects the house decoration with early-20th-century history."
      "ru": "Музей лучше воспринимается, когда комнаты связаны с людьми, которые ими пользовались: как устроен купеческий дом, что предметы говорят о быте и как биография Файзуллы Ходжаева связывает украшение дома с историей начала XX века."
      "uz": "Muzey xonalar u yerda yashagan odamlar bilan bog‘langanda aniqroq ko‘rinadi: savdogar uyi qanday tuzilgan, buyumlar maishiy hayot haqida nima deydi va Fayzulla Xo‘jayev biografiyasi uy bezagini XX asr boshidagi tarix bilan qanday bog‘laydi."
  - "blockType": "regular"
    "eyebrow":
      "en": "What to add nearby"
      "ru": "Что добавить рядом"
      "uz": "Yaqinda nima qo‘shish mumkin"
    "title":
      "en": "Lyabi-Hauz, Magoki-Attori, Trading Domes, and the Ark"
      "ru": "Ляби-Хауз, Магоки-Аттори, торговые купола и Арк"
      "uz": "Labi Hovuz, Mag‘oki Attori, savdo gumbazlari va Ark"
    "description":
      "en": "Nearby, Lyabi-Hauz keeps the social center of old Bukhara, Magoki-Attori adds the older mosque portal, the Trading Domes keep the craft and bazaar walk moving, and the Ark brings the route back to city power and museum rooms."
      "ru": "Рядом Ляби-Хауз держит социальный центр старой Бухары, Магоки-Аттори добавляет старый мечетный портал, Торговые купола ведут через ремесленную и базарную часть, а Арк возвращает маршрут к власти города и музейным залам."
      "uz": "Yaqinda Labi Hovuz eski Buxoroning ijtimoiy markazini ko‘rsatadi, Mag‘oki Attori eski masjid portalini qo‘shadi, savdo gumbazlari hunar va bozor qismini olib boradi, Ark esa yo‘nalishni shahar hokimiyati va muzey xonalariga qaytaradi."
