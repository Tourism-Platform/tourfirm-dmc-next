  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "The Sogdian city above Penjikent"
      "ru": "Согдийский город над Пенджикентом"
      "uz": "Panjikent ustidagi Sugʻd shahri"
    "description":
      "en": "Here Penjikent becomes more than a town before the mountains. The ruined Sogdian city shows a valley where trade, craft, settlement, and cultural exchange had shaped travel long before the modern route.


        «The ruins make Penjikent feel like a valley town with its own long memory, not just a pause before the mountains.»"
      "ru": "Здесь Пенджикент становится больше, чем городом перед горами. Руины согдийского города показывают долину, где торговля, ремесло, поселения и культурный обмен формировали путь задолго до современного маршрута.


        «Руины делают Пенджикент не транзитной точкой, а городом в долине с собственной долгой памятью.»"
      "uz": "Bu yerda Panjikent togʻlar oldidagi shahar bo‘libgina qolmaydi. Sugʻd shahri xarobalari savdo, hunar, manzillar va madaniy almashinuv zamonaviy yoʻldan ancha oldin ham vodiy harakatini shakllantirganini ko‘rsatadi.


        «Xarobalar Panjikentni oddiy oʻtish joyi emas, uzoq xotiraga ega vodiy shahri sifatida ko‘rsatadi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni koʻrasiz"
    "title":
      "en": "Wall lines, open ground, valley view"
      "ru": "Линии стен, открытая земля, вид на долину"
      "uz": "Devor chiziqlari, ochiq yer, vodiy manzarasi"
    "description":
      "en": "This is not a polished monument. The value is in the wall lines, exposed ground, and the valley position that becomes clearer as you walk."
      "ru": "Это не отполированный памятник. Ценность здесь в линиях стен, открытой земле и положении над долиной, которое становится яснее во время прогулки."
      "uz": "Bu sayqallangan yodgorlik emas. Qadri devor chiziqlari, ochiq yer va yurganingiz sari aniqroq seziladigan vodiydagi oʻrnida."
  - "blockType": "regular"
