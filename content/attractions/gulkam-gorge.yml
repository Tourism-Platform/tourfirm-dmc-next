  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "Where the Chimgan road turns into a canyon walk"
      "ru": "Где дорога к Чимгану переходит в каньонную прогулку"
      "uz": "Chimyon yo‘li kanyon yurishiga aylangan joy"
    "description":
      "en": "Gulkam shows the wilder side of the mountains near Tashkent. The route leaves the Chimgan road for the Gulkamsai riverbed, where boulders, cold water, steep walls, and small waterfalls make the visit active, close, and carefully paced.


        «Gulkam is powerful because the mountain becomes close: water underfoot, walls on both sides, and a guide deciding how far the group goes today.»"
      "ru": "Гулькам показывает более дикую сторону гор рядом с Ташкентом. Маршрут уходит от дороги Чимгана к руслу Гулькамсая: валуны, холодная вода, высокие стены и небольшие водопады делают поездку активной и требуют спокойного, точного темпа.


        «Гулькам силён тем, что гора подходит совсем близко: вода под ногами, стены с двух сторон и гид, который решает, насколько далеко группе идти сегодня.»"
      "uz": "Gulkam Toshkentga yaqin tog‘larning yovvoyiroq tomonini ko‘rsatadi. Yo‘l Chimyon yo‘lidan Gulkamsoy o‘zaniga buriladi: xarsangtoshlar, sovuq suv, baland devorlar va kichik sharsharalar tashrifni faol qiladi va sokin, aniq surʼat talab qiladi.


        «Gulkam kuchli, chunki tog‘ juda yaqin keladi: oyoq ostida suv, ikki tomonda devorlar va bugun guruh qanchagacha borishini belgilaydigan gid.»"
