  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nima uchun bu joy"
    "title":
      "en": "From Termez archaeology to Boysun mountains"
      "ru": "От археологии Термеза к горам Байсуна"
      "uz": "Termiz arxeologiyasidan Boysun tog‘lariga"
    "description":
      "en": "Baysuntau matters because it gives the southern route a different scale. Termez explains the region through museums, Buddhist sites, and shrine courtyards; Boysun and its mountains bring the route toward road, village life, and the wider landscape."
      "ru": "Байсунтау важен потому, что меняет масштаб южного маршрута. Термез объясняет регион через музеи, буддийские места и дворы святынь; Байсун и его горы ведут маршрут к дороге, жизни селений и более широкому ландшафту."
      "uz": "Boysuntov janubiy yo‘nalishga boshqa miqyos beradi. Termiz hududni muzeylar, buddaviy joylar va ziyorat hovlilari orqali tushuntiradi; Boysun va uning tog‘lari esa yo‘lni qishloq hayoti va kengroq manzaraga olib boradi."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you may see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Ridges, ravines, and village edges"
      "ru": "Хребты, овраги и края селений"
      "uz": "Tizmalar, jarliklar va qishloq chetlari"
    "description":
      "en": "The visual story is simple: mountain lines, dry ravines, red earth, meadow edges, and village courtyards where the range stays close."
      "ru": "Визуальная линия простая: горные контуры, сухие овраги, красная земля, края лугов и дворы селений, где хребет остаётся рядом."
      "uz": "Ko‘rinadigan chiziq sodda: tog‘ konturlari, quruq jarliklar, qizil tuproq, o‘tloq chetlari va tizma yaqin qoladigan qishloq hovlilari."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посетить"
      "uz": "Tashrif qanday kechadi"
    "title":
      "en": "Plan it as a mountain outing from Boysun"
      "ru": "Планируйте как горный выезд из Байсуна"
      "uz": "Boysundan tog‘ chiqishi sifatida rejalang"
    "description":
      "en": "Baysuntau works best when the route is planned around current road conditions, season, and local access. Think in viewpoints, village pauses, and suitable mountain roads, not a single fixed entrance."
      "ru": "Байсунтау лучше работает, когда маршрут зависит от состояния дороги, сезона и местного доступа. Думайте не об одной фиксированной входной точке, а о видах, паузах в селениях и подходящих горных дорогах."
      "uz": "Boysuntov yo‘l holati, mavsum va mahalliy kirish hisobga olinganda yaxshiroq ochiladi. Bitta qatʼiy kirishni emas, manzara nuqtalari, qishloqdagi qisqa pauzalar va mos tog‘ yo‘llarini o‘ylang."
  - "blockType": "regular"
