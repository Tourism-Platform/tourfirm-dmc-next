      "ru": "Полезный контекст здесь региональный, а не пешеходный: Термез даёт музейные залы, буддийские места, Древний Термез и дворы святынь до или после дороги к Байсуну."
      "uz": "Bu yerda foydali kontekst piyoda masofada emas, mintaqa ichida: Termiz Boysunga boradigan yoki undan qaytadigan yo‘ldan oldin muzey xonalari, buddaviy joylar, Qadimgi Termiz va ziyorat hovlilarini beradi."
