      "uz": "Katta Chimyonga pastdan yuqoriga qarab qarang: Chimyon ustidagi cho‘qqi chizig‘i, unga eltadigan ochiq yonbag‘irlar va oddiy manzara tog‘ yo‘liga aylana boshlaydigan qirlar."
