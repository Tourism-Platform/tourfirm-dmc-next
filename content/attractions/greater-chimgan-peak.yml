    "description":
      "en": "Greater Chimgan gives the Chimgan area its clearest mountain marker. For a gentle outing, it can stay as the skyline above lower viewpoints. For active travelers, it becomes a separate mountain day with guide advice, weather judgment, and enough daylight built in.


        «Greater Chimgan earns its place when the plan respects the mountain: see it clearly, and climb only when the day is right.»"
      "ru": "Большой Чимган даёт району Чимгана самый ясный горный ориентир. Для спокойного выезда он может остаться силуэтом над нижними обзорными точками. Для активных гостей это отдельный горный день с советом гида, оценкой погоды и запасом светового времени.


        «Большой Чимган сильнее всего звучит там, где план уважает гору: увидеть её ясно и идти выше только в правильный день.»"
      "uz": "Katta Chimyon Chimyon hududiga eng aniq tog‘ mo‘ljalini beradi. Sokin chiqishda u pastki tomosha nuqtalari ustidagi siluet bo‘lib qolishi mumkin. Faol mehmonlar uchun esa bu gid maslahati, ob-havo bahosi va yetarli kunduzgi vaqt bilan alohida tog‘ kuni.


        «Katta Chimyon reja tog‘ni hurmat qilganda kuchliroq ochiladi: uni aniq ko‘ring, yuqoriga esa faqat to‘g‘ri kunda boring.»"
