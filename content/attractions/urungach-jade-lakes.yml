  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "Two lakes, one seasonal decision"
      "ru": "Два озера и одно сезонное решение"
      "uz": "Ikki ko‘l va bitta mavsumiy qaror"
    "description":
      "en": "Urungach gives the Tashkent mountains a wilder lake note after the familiar Chimgan and Charvak stops. The reward is simple and specific: cold jade-colored water in a mountain hollow, a higher lake beyond it, and enough distance from Tashkent for the route to feel like a true nature outing.


        «At Urungach, the color comes first only when the season allows it; the road, weather, and walking pace decide the rest.»"
      "ru": "Урунгач добавляет ташкентским горам более дикий озёрный акцент после привычных Чимгана и Чарвака. Его смысл конкретен: холодная вода нефритового цвета в горной чаше, верхнее озеро выше по маршруту и расстояние от Ташкента, из-за которого поездка ощущается настоящим природным выездом.


        «В Урунгаче цвет выходит на первый план только тогда, когда сезон позволяет; остальное решают дорога, погода и темп пешего участка.»"
      "uz": "Urungach tanish Chimyon va Chorvoq bekatlaridan keyin Toshkent tog‘lariga yovvoyiroq ko‘l ohangini qo‘shadi. Uning ma’nosi aniq: tog‘ kosasidagi sovuq nefrit rangli suv, yuqoriroqdagi ikkinchi ko‘l va Toshkentdan uzoqligi sabab haqiqiy tabiat chiqishi hissi.


        «Urungachda rang faqat mavsum imkon berganda birinchi o‘ringa chiqadi; qolganini yo‘l, ob-havo va piyoda sur’at belgilaydi.»"
