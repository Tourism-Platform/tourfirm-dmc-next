  "uz": "Urungach Chimyon yo‘nalishiga uzoqroq mavsumiy tog‘ chiqishini qo‘shmoqchi bo‘lgan sayohatchilar uchun. Suv baland bo‘lganda quyi ko‘l sovuq firuza-nefrit tusga kiradi; yuqorida ikkinchi ko‘l bor, yo‘l va ob-havo esa bu tashrifni tez kurort bekati emas, ehtiyotkor Bo‘stonliq rejasi qiladi."
