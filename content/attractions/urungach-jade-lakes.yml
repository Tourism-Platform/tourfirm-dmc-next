    "description":
      "en": "The visual story is compact: jade water at the lower lake when the season is right, the higher route between the two lakes, and the protected mountain setting around them."
      "ru": "Визуальная история здесь компактная: нефритовая вода нижнего озера в подходящий сезон, путь выше между двумя озёрами и охраняемый горный ландшафт вокруг них."
      "uz": "Bu yerning ko‘rinish hikoyasi ixcham: mavsum mos bo‘lsa quyi ko‘ldagi nefrit suv, ikki ko‘l orasidagi yuqoriroq yo‘l va ularni o‘rab turgan muhofaza tog‘ manzarasi."
