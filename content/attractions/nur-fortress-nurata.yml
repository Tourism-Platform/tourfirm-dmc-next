  "en": "Nur Fortress gives Chashma its high viewpoint. From the slope above the spring, remaining mud-brick wall traces and open views show why this small town mattered on roads between the cities, the lake, and the Kyzylkum. The Alexander story belongs here as local tradition, not as a proven date or builder."
  "ru": "Крепость Нур даёт Чашме верхнюю точку обзора. Со склона над источником следы глинобитных стен и открытые виды показывают, почему этот небольшой город был важен на дорогах между городами, озером и Кызылкумом. Сюжет об Александре здесь звучит как местная традиция, а не как доказанная дата или имя строителя."
  "uz": "Nur qalʼasi Chashmaga yuqoridan qarash imkonini beradi. Buloq ustidagi qiyalikdan ko‘rinadigan xom g‘isht devor izlari va ochiq manzara bu kichik shaharning shaharlar, ko‘l va Qizilqum orasidagi yo‘llarda nega muhim bo‘lganini ko‘rsatadi. Iskandar haqidagi hikoya bu yerda mahalliy anʼana sifatida beriladi, isbotlangan sana yoki quruvchi sifatida emas."
