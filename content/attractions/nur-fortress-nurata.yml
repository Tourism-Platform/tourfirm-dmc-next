    "title":
      "en": "Why the climb changes Nurata"
      "ru": "Почему подъём меняет Нурату"
      "uz": "Ko‘tarilish Nurotani qanday o‘zgartiradi"
    "description":
      "en": "Nur Fortress matters because it lets you see Chashma and the town from above. The ruin is not a large museum-like monument; its value is the slope, surviving wall lines, exposed ground, and the view that connects Nurata with the roads toward Aydarkul, Sentyab, and the Kyzylkum."
      "ru": "Крепость Нур важна потому, что с неё Чашма и город видны сверху. Это не большой музейный памятник: ценность здесь в склоне, следах стен, открытой земле и виде, который связывает Нурату с дорогами к Айдаркулю, Сентобу и Кызылкуму."
      "uz": "Nur qalʼasi muhim, chunki u Chashma va shaharni yuqoridan ko‘rsatadi. Bu katta muzeyga o‘xshash yodgorlik emas: qiya yo‘l, devor izlari, ochiq tuproq va Nurotani Aydarko‘l, Sentob hamda Qizilqum yo‘llari bilan bog‘laydigan manzara uning asosiy qiymatidir."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Hill, wall traces, and eroded earth"
      "ru": "Холм, следы стен и размытая земля"
      "uz": "Tepalik, devor izlari va yemirilgan tuproq"
    "description":
      "en": "Look for the simple evidence of a hilltop ruin: wall lines, eroded earth, the slope of the approach, and the view back toward Chashma and Nurata."
      "ru": "Ищите простые признаки руин на холме: линии стен, размытый грунт, сам подъём и вид назад к Чашме и Нурате."
      "uz": "Tepalik xarobasining oddiy belgilariga qarang: devor chiziqlari, yemirilgan tuproq, qiya yondashuv va Chashma hamda Nurota tomonga qaytadigan manzara."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как проходит визит"
      "uz": "Tashrif qanday kechadi"
    "title":
      "en": "A short climb that changes the whole town"
      "ru": "Короткий подъём, который меняет весь город"
      "uz": "Butun shaharni o‘zgartiradigan qisqa ko‘tarilish"
    "description":
      "en": "Nur Fortress is not a long monument visit. It is a shift in angle: from spring water and courtyard shade to slope, dry air, and a view that makes the route beyond Nurata easier to feel."
      "ru": "Крепость Нур — не длинный осмотр памятника. Это смена угла: от воды источника и тени двора к склону, сухому воздуху и виду, который помогает почувствовать маршрут за Нуратой."
      "uz": "Nur qalʼasi uzun yodgorlik tashrifi emas. Bu qarash burchagi almashinuvi: buloq suvi va hovli soyasidan qiya yo‘l, quruq havo va Nurotadan keyingi yo‘lni sezdiradigan manzaraga o‘tish."
  - "blockType": "regular"
