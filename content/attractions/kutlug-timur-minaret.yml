    "description":
      "en": "Kutlug Timur is the clearest visible landmark of Kunya-Urgench. For travelers, the minaret turns old Khorezm from an open archaeological field into a place with height, direction, and a horizon.


        «The minaret gives Kunya-Urgench a vertical measure in a landscape of distance, earth, and low horizons.»"
      "ru": "Кутлуг-Тимур — самый заметный ориентир Куня-Ургенча. Для путешественника минарет превращает старый Хорезм из открытого археологического поля в место с высотой, направлением и горизонтом.


        «Минарет даёт Куня-Ургенчу вертикальную меру в ландшафте расстояния, земли и низкого горизонта.»"
      "uz": "Qutlug‘ Temur Ko‘hna Urganchning eng ko‘rinadigan belgisidir. Sayohatchi uchun minora eski Xorazmni ochiq arxeologik maydondan balandlik, yo‘nalish va ufqqa ega joyga aylantiradi.


        «Minora Ko‘hna Urganchga masofa, yer va past ufqlar orasida baland o‘lchov beradi.»"
