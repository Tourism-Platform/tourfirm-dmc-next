"excerpt":
  "en": "Khoja Abdulazizkhan Madrasah belongs close to Qarshi's central group of madrasahs, mosques, and water architecture. Its value is not scale alone: the stop lets you place a 1909 study building beside Kilichboy, Odina, Sardoba, and Kok-Gumbaz, then understand how the same building later carried part of Kashkadarya's museum story."
  "ru": "Медресе Ходжи Абдулазизхана находится рядом с центральной группой медресе, мечетей и водной архитектуры Карши. Его ценность не только в масштабе: эта остановка помогает поставить учебное здание 1909 года рядом с Киличбоем, Одиной, Сардобой и Кок-Гумбазом, а затем понять, как тот же адрес стал частью музейной истории Кашкадарьи."
  "uz": "Xoja Abdulazizxon madrasasi Qarshining markaziy madrasalari, masjidlari va suv meʼmorchiligi yaqinida turadi. Bu bekatning qadri faqat ko‘lami bilan emas: 1909 yilgi o‘quv binosini Qilichboy, Odina, Sardoba va Ko‘k-Gumbaz yonida ko‘rib, keyinchalik Qashqadaryo muzeyi tarixi shu bino bilan qanday bog‘langanini tushunasiz."
