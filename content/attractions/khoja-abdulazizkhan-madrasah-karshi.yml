      "uz": "Bu kichik bekat muhim xotirani saqlaydi. Bino Buxoro amirligining so‘nggi yillarida madrasa sifatida boshlangan, amirlikning turli shaharlaridan kelgan talabalarni qabul qilgan, keyin esa uch o‘n yildan ko‘proq vaqt Qashqadaryo o‘lkashunoslik muzeyi manzili bo‘lgan."
