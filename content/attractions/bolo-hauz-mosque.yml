      "en": "Bolo-Hauz matters because it gives the Ark area a different kind of stop. After gates and fortress walls, the hauz, wooden columns, and mosque porch bring the Bukhara walk back to close detail before nearby mausoleums, trading lanes, and the old-city route continue.


        «Bolo-Hauz gives the Ark-side walk a quieter moment by the hauz and wooden iwan.»"
      "ru": "Боло-Хауз важен не громкостью, а другим характером остановки рядом с Арком. После ворот и крепостных стен хауз, деревянные колонны и крыльцо мечети возвращают прогулку к близким деталям перед мавзолеями, торговыми улицами и дальнейшим маршрутом по старой Бухаре.


        «Боло-Хауз даёт прогулке у Арка спокойный момент у хауза и деревянного айвана.»"
      "uz": "Bolo-Hauz Ark yonidagi hududga boshqa turdagi bekat beradi. Darvoza va qalʼa devorlaridan keyin hovuz, yog‘och ustunlar va masjid ayvoni sayrni yaqin detallarga qaytaradi; undan keyin maqbaralar, savdo ko‘chalari va eski shahar yo‘li davom etadi.


        «Bolo-Hauz Ark yonidagi sayrga hovuz va yog‘och ayvon oldida sokin lahza beradi.»"
