  "en": "At Bolo-Hauz, the Ark is close, but the first detail is the hauz, the historic water basin in front of the mosque. Around it, the carved wooden iwan, mosque porch, and old Registan edge make a short, calm stop between the citadel and the western side of the old-city route."
  "ru": "В Боло-Хаузе Арк совсем рядом, но первым замечаешь хауз — исторический водоём перед мечетью. Вокруг него складываются резной деревянный айван, крыльцо мечети и край старого Регистана — короткая спокойная остановка между цитаделью и западной частью старогородского маршрута."
  "uz": "Bolo-Hauzda Ark juda yaqin, lekin avval masjid oldidagi hovuz ko‘zga tashlanadi. Uning atrofida o‘yma yog‘och ayvon, masjid ayvoni va eski Registon cheti sitadel bilan eski shahar yo‘lining g‘arbiy tomoni orasidagi qisqa, sokin bekatni hosil qiladi."
