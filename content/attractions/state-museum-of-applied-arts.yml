    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "Where Tashkent turns craft into architecture"
      "ru": "Где ремесло становится архитектурой"
      "uz": "Hunarmandchilik meʼmorchilikka aylangan joy"
    "description":
      "en": "The museum is not only a collection of objects. It is also a house shaped by the same decorative traditions the halls explain: carving, painting, ganch, ceramics, textiles, metalwork, embroidery, and regional craft schools. For travelers, it gives Tashkent a calmer indoor pause and a practical way to recognize the handwork that later appears in Bukhara, Rishtan, Samarkand, Margilan, or family workshops.


        «The museum is small enough to stay calm, but detailed enough to change how you look at Uzbek craft for the rest of the journey.»"
      "ru": "Это не только собрание предметов. Сам дом устроен через те же декоративные традиции, о которых рассказывают залы: резьбу, роспись, ганч, керамику, ткани, металл, вышивку и региональные школы ремесла. Для путешественника музей даёт Ташкенту спокойную крытую паузу и помогает узнавать ручную работу, которая дальше встретится в Бухаре, Риштане, Самарканде, Маргилане или мастерских.


        «Музей достаточно небольшой, чтобы остаться спокойным, и достаточно подробный, чтобы изменить взгляд на узбекское ремесло до конца поездки.»"
      "uz": "Bu faqat buyumlar to‘plami emas. Uyning o‘zi ham zallar tushuntiradigan bezak anʼanalari orqali qurilgan: o‘ymakorlik, naqsh, ganch, kulolchilik, mato, metall, kashta va hududiy hunarmandchilik maktablari. Sayohatchi uchun muzey Toshkentda sokin yopiq pauza beradi va keyin Buxoro, Rishton, Samarqand, Marg‘ilon yoki ustaxonalarda uchraydigan qo‘l mehnatini tanishga yordam beradi.


        «Muzey sokin qoladigan darajada ixcham, lekin safar oxirigacha o‘zbek hunarmandchiligiga qarashingizni o‘zgartiradigan darajada batafsil.»"
