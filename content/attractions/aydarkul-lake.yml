      "en": "Aydarkul matters because it changes the route's register. The road is no longer only distance between cities: water color, reeds, sand underfoot, and seasonal shore movement make the Kyzylkum feel wider and gentler at once."
      "ru": "Айдаркуль важен потому, что меняет регистр маршрута. Дорога здесь уже не только расстояние между городами: цвет воды, камыш, песок под ногами и сезонное движение у берега делают Кызылкум одновременно шире и мягче."
      "uz": "Aydarko‘l muhim, chunki yo‘nalish kayfiyatini o‘zgartiradi. Bu yerda yo‘l endi faqat shaharlar orasidagi masofa emas: suv rangi, qamish, oyoq ostidagi qum va qirg‘oqdagi mavsumiy harakat Qizilqumni ham kengroq, ham yumshoqroq sezdiradi."
