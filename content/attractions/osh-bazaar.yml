  "en": "Osh Bazaar is the living counterpoint to Sulaiman-Too: a place of bread steam, spice color, crowded aisles, daily goods, and sellers moving through a city where trade still feels close and immediate. On a first visit, the strongest route is simple: food rows, a few daily-goods aisles, and enough time to watch the market without getting swallowed by it."
  "ru": "Ошский базар — живой контраст к Сулайман-Тоо: пар от лепёшек, цвет специй, плотные проходы, повседневные товары и продавцы в городе, где торговля остаётся близкой и настоящей. В первый визит легче идти короткой линией: ряды еды, несколько проходов с хозяйственными товарами и достаточно времени, чтобы увидеть рынок без утомительной толпы."
  "uz": "Oʻsh bozori Sulaymon-Too bilan jonli muvozanat yaratadi: issiq non hidi, ziravor ranglari, gavjum yoʻlaklar, kundalik buyumlar va savdo ichidagi odamlar. Birinchi tashrifda taom qatorlari, bir nechta roʻzgʻor yoʻlaklari va bozorni shoshmasdan kuzatish yetarli."
