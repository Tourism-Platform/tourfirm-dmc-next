"excerpt":
  "en": "Otrar is not a polished monument that explains itself at first glance. The settlement spreads low across open ground near Shaulder, where earth walls, gate traces, bathhouse evidence, and museum artifacts make the old oasis feel present again. Come after the Otyrar museum if you can: the objects inside help the ruined city outside read as a place of water, craft, trade, and scholarship rather than a distant name on the Silk Road."
  "ru": "Отрар не похож на отполированный памятник, который всё объясняет с первого взгляда. Городище лежит низко на открытом участке у Шаульдера: земляные стены, следы ворот, материалы бани и музейные находки возвращают старый оазис в настоящее. Если возможно, приезжайте после Отырарского музея: предметы в залах помогают увидеть в руинах не дальнее имя Шёлкового пути, а место воды, ремесла, торговли и учёности."
  "uz": "Oʻtror bir qarashda hammasini tushuntirib beradigan silliq yodgorlik emas. Shauildir yaqinidagi ochiq maydonda shahar past yotadi: tuproq devorlar, darvoza izlari, hammom dalillari va muzey topilmalari eski vohani yana bugungi manzaraga qaytaradi. Imkon bo‘lsa, avval Oʻtror muzeyiga kiring: zaldagi buyumlar tashqaridagi xarobalarni Ipak yoʻlidagi uzoq nom emas, suv, hunar, savdo va ilm ko‘ringan joy sifatida ko‘rsatadi."
