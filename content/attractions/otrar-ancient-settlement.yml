    "title":
      "en": "The place where Otrar becomes visible"
      "ru": "Место, где Отрар становится видимым"
      "uz": "Oʻtror ko‘rinadigan joy"
    "description":
      "en": "The ancient settlement is the main reason the Otrar route should not be rushed. Around Otrartobe, the Silk Road stops being an abstract line between Turkistan and Shymkent and becomes ground you can walk carefully, with the museum close enough to hold the story together.


        «Otrar is strongest after the museum, when the artifacts have names and the open ground begins to feel like a city again.»"
      "ru": "Древнее городище — главная причина не спешить через Отрар. На Отрартобе Шёлковый путь перестаёт быть абстрактной линией между Туркестаном и Шымкентом и становится участком, по которому нужно идти внимательно, а музей рядом даёт истории предметную опору.


        «Отрар лучше раскрывается после музея, когда у находок уже есть имена, а открытый участок начинает снова ощущаться городом.»"
      "uz": "Qadimgi shahar xarobasi Oʻtror orqali shoshilmasdan o‘tishning asosiy sababidir. Otrartobeda Ipak yoʻli Turkiston va Chimkent orasidagi mavhum chiziq bo‘lib qolmaydi; u ehtiyotkorlik bilan yuriladigan joyga aylanadi, muzey esa hikoyani yaqin tutadi.


        «Oʻtror muzeydan keyin kuchliroq ochiladi: topilmalarning nomi bor, ochiq maydon esa yana shahar kabi sezila boshlaydi.»"
