    "title":
      "en": "Modern Urgench, older memory"
      "ru": "Современный Ургенч и древняя память"
      "uz": "Zamonaviy Urganch va qadimiy xotira"
    "description":
      "en": "Urgench often means movement: airport, train, transfer, and the road to Khiva. Avesto Park gives that movement a cultural pause. The 20-hectare park, monument, and museum founded in 2001 bring the Avesta story into a modern city setting without turning Urgench into another old town.


        «Avesto Park shows Urgench at the right scale: brief, specific, and tied to Khorezm memory.»"
      "ru": "Ургенч чаще всего означает движение: аэропорт, поезд, трансфер и дорогу к Хиве. Парк Авесто даёт этой дороге культурную паузу. Парк площадью 20 гектаров, памятник и музей, основанный в 2001 году, вводят тему Авесто в современную городскую среду без попытки превратить Ургенч во второй исторический центр.


        «Парк Авесто показывает Ургенч в правильном масштабе: кратко, конкретно и с памятью Хорезма.»"
      "uz": "Urganch ko‘pincha harakat bilan bog‘liq: aeroport, poyezd, transfer va Xivaga yo‘l. Avesto bog‘i shu harakatga madaniy pauza beradi. 20 gektarlik bog‘, yodgorlik va 2001 yilda tashkil etilgan muzey Avesto hikoyasini zamonaviy shahar muhitiga olib kiradi, lekin Urganchni yana bir eski shahar sifatida ko‘rsatmaydi.


        «Avesto bog‘i Urganchni to‘g‘ri miqyosda ko‘rsatadi: qisqa, aniq va Xorazm xotirasiga bog‘langan.»"
