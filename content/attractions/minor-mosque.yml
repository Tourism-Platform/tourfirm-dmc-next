      "uz": "Joyni bosqichma-bosqich ko‘ring: avval keng tashqi ko‘rinish va bog‘li yondashuv, keyin portal va koshin bezak, ichkariga esa joriy kirish, kiyim va namoz vaqti ritmi imkon bersa kiring."
