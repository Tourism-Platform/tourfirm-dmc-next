  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "A modern mosque that changes the city's tone"
      "ru": "Современная мечеть, которая меняет тон города"
      "uz": "Shahar ohangini o‘zgartiradigan zamonaviy masjid"
    "description":
      "en": "Tashkent often introduces itself through contrasts: old-city courtyards, Soviet-era boulevards, metro halls, museums and new civic spaces. Minor Mosque belongs to that same city story, but its tone is quieter. The white surfaces catch the light, the canal keeps the approach open, and the visit reminds travelers that the capital is still building religious landmarks, not only preserving older ones.


        «Minor Mosque is not an old-city courtyard; it is Tashkent looking newly built, polished, and still quiet enough for a respectful stop.»"
      "ru": "Ташкент часто раскрывается через контрасты: дворы старого города, советские проспекты, залы метро, музеи и новые городские пространства. Минор относится к той же истории столицы, но звучит тише. Белые поверхности ловят свет, канал оставляет подход открытым, а визит напоминает, что город не только хранит старые памятники, но и продолжает строить религиозные ориентиры.


        «Минор — не двор старого города, а новый Ташкент: светлый, выстроенный, отполированный и всё же достаточно тихий для уважительной паузы.»"
      "uz": "Toshkent ko‘pincha qarama-qarshi manzaralar orqali ochiladi: eski shahar hovlilari, sovet davri xiyobonlari, metro zallari, muzeylar va yangi shahar makonlari. Minor shu poytaxt hikoyasiga kiradi, lekin uning ohangi sokinroq. Oq devorlar yorug‘likni qaytaradi, kanal yondashuvni ochiq qoldiradi, tashrif esa shahar faqat eski yodgorliklarni saqlamay, yangi diniy mo‘ljallarni ham qurayotganini eslatadi.


        «Minor eski shahar hovlisi emas; u yangi qurilgan, silliq va baribir ehtiromli to‘xtam uchun yetarlicha sokin Toshkentdir.»"
