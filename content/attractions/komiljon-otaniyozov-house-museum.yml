        «This is a small stop with a precise purpose: Urgench remembered through music, not only through transfer roads and monuments.»"
      "ru": "После большого музейного контекста CAMUZ и городского монумента в парке Авесто этот дом-музей сужает масштаб. Он добавляет Ургенчу личную культурную ноту: Комилжон Отаниёзов, музыка и память, которой не нужен монументальный жест.


        «Это небольшая остановка с точным смыслом: Ургенч вспоминается через музыку, а не только через дороги и памятники.»"
      "uz": "CAMUZning kengroq muzey muhiti va Avesto bog‘idagi shahar yodgorligidan keyin bu uy-muzey miqyosni toraytiradi. U Urganchga shaxsiy madaniy ohang qo‘shadi: Komiljon Otaniyozov, musiqa va katta monumentlarsiz ham esda qoladigan xotira.


        «Bu kichik manzilning maqsadi aniq: Urganch faqat yo‘l va yodgorliklar orqali emas, musiqa orqali ham eslanadi.»"
