    "title":
      "en": "The valley where erosion looks like architecture"
      "ru": "Долина, где выветривание похоже на архитектуру"
      "uz": "Yemirilish arxitekturaga oʻxshaydigan vodiy"
    "description":
      "en": "Airakty gives northern Mangystau a different kind of scale. Sherkala is a single silhouette; Airakty spreads into walls, towers, and gaps that make the landscape feel almost built.


        «Airakty should not be reduced to one more remote stop. The valley earns its place when the route slows enough for the ridges to become the story.»"
      "ru": "Айракты даёт северному Мангистау другой масштаб. Шеркала — одиночный силуэт; Айракты растягивается в стены, башни и просветы, из-за которых ландшафт кажется почти построенным.


        «Айракты не стоит сводить к ещё одной удалённой остановке. Долина оправдывает место в маршруте, когда дорога замедляется настолько, чтобы гряды стали главным событием.»"
      "uz": "Airakty shimoliy Mangʻistovga boshqa miqyos beradi. Sherkala yakka siluet boʻlsa, Airakty devorlar, minoralar va ochiq boʻshliqlar boʻlib choʻzilib, landshaftni deyarli qurilgandek koʻrsatadi.


        «Airakty yana bir uzoq toʻxtashga qisqarib qolmasligi kerak. Yoʻl sekinlashib, qirlar hikoyaga aylanganda vodiy yoʻnalishda oʻz oʻrnini oqlaydi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni koʻrasiz"
    "title":
      "en": "Castle ridges, valley floor, and northern-road scale"
      "ru": "Скальные стены, дно долины и масштаб северной дороги"
      "uz": "Qalʼasimon qirlar, vodiy tagi va shimoliy yoʻl miqyosi"
    "description":
      "en": "Airakty comes into focus through shape and distance: the wall-like ridges first, then the open ground between them, then the wider road that links the valley with Sherkala and the rest of Mangystau."
      "ru": "Айракты раскрывается через форму и расстояние: сначала стены гряд, затем открытое пространство между ними, потом более широкий маршрут, который связывает долину с Шеркалой и остальным Мангистау."
      "uz": "Airakty shakl va masofa orqali ochiladi: avval devorga oʻxshash qirlar, keyin ular orasidagi ochiq yer, soʻng vodiyni Sherkala va butun Mangʻistov bilan bogʻlaydigan kengroq yoʻl."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посещать"
      "uz": "Qanday tashrif buyurish"
    "title":
      "en": "Give the valley a clear role"
      "ru": "Дайте долине понятную роль"
      "uz": "Vodiyga aniq rol bering"
    "description":
      "en": "Airakty fits best when it has a purpose in the route: either the main northern landscape stop or a carefully timed continuation after Sherkala and Kokkala. The visit becomes weaker when too many remote places are forced into the same drive."
      "ru": "Айракты лучше всего воспринимается, когда у неё есть ясная задача в маршруте: главный северный ландшафтный акцент или аккуратное продолжение после Шеркалы и Коккалы. Визит становится слабее, если в один выезд пытаются втиснуть слишком много удалённых мест."
      "uz": "Airakty yoʻnalishda aniq vazifaga ega boʻlganda yaxshiroq oʻqiladi: shimoldagi asosiy landshaft toʻxtashi yoki Sherkala va Kokkaladan keyingi ehtiyotkor davom. Bitta yoʻlda juda koʻp uzoq joy majburlansa, tashrif kuchsizlanadi."
  - "blockType": "regular"
