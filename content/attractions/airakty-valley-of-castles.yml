  "en": "Airakty is not an Aktau city sight. The road leaves the Caspian city for northern Mangystau and eventually reaches ridges that look less like one viewpoint than a desert skyline. Come for the castle-like forms, but let the vehicle, daylight, water, heat, wind, and local road advice decide whether the valley belongs in the route."
  "ru": "Айракты — не городская достопримечательность Актау. Дорога уходит от каспийского города в северный Мангистау и приводит к грядам, которые выглядят не как одна смотровая точка, а как пустынный силуэт города. Ехать сюда стоит ради форм, похожих на замки, но маршрут должны подтверждать машина, световой день, вода, жара, ветер и свежий местный совет по дороге."
  "uz": "Airakty Aqtau shahridagi oddiy ko‘rish joyi emas. Yoʻl Kaspiy shahridan shimoliy Mangʻistovga chiqadi va oxir-oqibat bitta manzara nuqtasidan ko‘ra cho‘l shahar chizig‘iga o‘xshaydigan qirlarga yetadi. Bu yerga qalʼasimon shakllar uchun kelasiz, lekin vodiyning yoʻnalishga kirishini avtomobil, kunduzgi vaqt, suv, issiq, shamol va hozirgi mahalliy yoʻl maslahati hal qiladi."
