    "description":
      "en": "Sherkala is the clearest current companion for Airakty, and Torysh can widen the northern Mangystau route when the road plan has enough margin. Kokkala, Shakpak-Ata, Beket-Ata, and Bozzhira remain wider route decisions until access, timing, and local confirmation are handled for each place."
      "ru": "Шеркала — самый понятный текущий спутник Айракты, а Торыш может расширить северный маршрут по Мангистау, если в дорожном плане есть запас. Коккала, Шакпак-Ата, Бекет-Ата и Бозжыра остаются отдельными решениями, пока для каждого места не проверены доступ, время и местные условия."
      "uz": "Sherkala Airakty uchun hozirgi eng aniq hamrohdir, Torysh esa yoʻl rejasida yetarli zaxira bo‘lsa shimoliy Mangʻistov yoʻnalishini kengaytirishi mumkin. Kokkala, Shakpak-Ata, Beket-Ata va Bozzhira har biri uchun kirish, vaqt va mahalliy sharoit tekshirilmaguncha alohida yoʻl qarori boʻlib qoladi."
