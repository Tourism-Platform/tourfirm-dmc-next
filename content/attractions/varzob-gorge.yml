  "en": "The road into Varzob Gorge changes Dushanbe quickly. River bends replace city heat, the slopes tighten around the road, and water becomes the sound of the outing. It is a close nature break, not a fixed mountain program, so the best version stays responsive to weather, traffic, and local access on the day."
  "ru": "Дорога в Варзобское ущелье быстро меняет Душанбе. Вместо городской жары появляются речные повороты, склоны ближе подходят к дороге, и главным звуком становится вода. Это близкий выезд на природу, а не фиксированная горная программа, поэтому лучший вариант зависит от погоды, трафика и доступа в день поездки."
  "uz": "Varzob darasiga kiradigan yoʻl Dushanbeni tez oʻzgartiradi. Shahar issigʻi oʻrnini daryo burilishlari egallaydi, yonbagʻirlar yoʻlga yaqinlashadi, suv tovushi esa chiqishning asosiy ohangiga aylanadi. Bu belgilab qoʻyilgan togʻ dasturi emas, balki yaqin tabiat tanaffusi; eng yaxshi reja ob-havo, tirbandlik va oʻsha kungi mahalliy kirishga moslashadi."
