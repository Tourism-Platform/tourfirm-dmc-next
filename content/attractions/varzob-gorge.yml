    "description":
      "en": "Varzob Gorge matters because it gives Dushanbe an easy way to breathe outward. The river and road stay close together, so travelers feel the city fall away before Tajikistan's higher valleys begin.


        «Varzob Gorge matters at a human scale: the river cools the road before the mountains become a long journey.»"
      "ru": "Варзобское ущелье важно тем, что даёт Душанбе простой выход к природе. Река и дорога идут рядом, поэтому путешественники чувствуют, как город отступает ещё до высоких долин Таджикистана.


        «Варзобское ущелье важно в человеческом масштабе: река охлаждает дорогу раньше, чем горы становятся большим путешествием.»"
      "uz": "Varzob darasi Dushanbedan tabiatga oson chiqish imkonini bergani uchun muhim. Daryo va yoʻl yonma-yon ketadi, shuning uchun sayohatchi Tojikistonning balandroq vodiylari boshlanishidan oldin shaharning ortda qolishini sezadi.


        «Varzob darasi insoniy oʻlchamda muhim: togʻlar uzun safarga aylanmasdan oldin daryo yoʻlni salqinlashtiradi.»"
