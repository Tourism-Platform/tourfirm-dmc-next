"excerpt":
  "en": "Begin Otrar indoors. In Shaulder, the museum-reserve brings the oasis into focus through artifacts from the Bronze Age to the 17th century: ceramics, tools, coins, tilework, water-supply pieces, bathhouse material, and ethnographic objects. From here, Otrartobe, Arystan Bab, and the surrounding oasis monuments feel connected instead of separate stops."
  "ru": "Начните Отрар в помещении. В Шаульдере музей-заповедник собирает оазис через находки от бронзового века до XVII века: керамику, инструменты, монеты, плитку, части водоснабжения, материалы бани и этнографические предметы. После этого Отрартобе, Арыстан-Баб и памятники оазиса складываются в один маршрут, а не в отдельные остановки."
  "uz": "Oʻtrorni binodan boshlang. Shauildirdagi muzey-qoʻriqxona vohani Bronza davridan XVII asrgacha bo‘lgan topilmalar orqali ko‘rsatadi: sopol, asboblar, tangalar, koshinlar, suv tizimi qismlari, hammom materiallari va etnografik buyumlar. Shundan keyin Otrartobe, Arystan Bab va voha yodgorliklari alohida bekatlar emas, bitta yoʻnalishdek ko‘rinadi."
