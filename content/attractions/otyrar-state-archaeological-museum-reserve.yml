    "description":
      "en": "The museum gives Otrar a human scale. It gathers the artifacts, research, and district-wide monument work that help a traveler understand why the open archaeological site matters.


        «The museum is where Otrar stops being a distant Silk Road name and becomes a place of water, craft, rooms, roads, and people.»"
      "ru": "Музей даёт Отрару человеческий масштаб. Он собирает предметы, исследования и работу с памятниками района, которые помогают понять открытое городище.


        «В музее Отрар перестаёт быть дальним именем Шёлкового пути и становится местом воды, ремесла, комнат, дорог и людей.»"
      "uz": "Muzey Oʻtrorga insoniy miqyos beradi. U ochiq shahar xarobasi nima uchun muhimligini tushuntiradigan buyumlar, tadqiqotlar va tuman yodgorliklari bilan ishlashni bir joyga jamlaydi.


        «Muzeyda Oʻtror Ipak yoʻlidagi uzoq nom bo‘lishdan chiqib, suv, hunar, xonalar, yoʻllar va odamlar joyiga aylanadi.»"
