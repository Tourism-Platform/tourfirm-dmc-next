  "en": "After Bukhara's lanes, domes, and fortress walls, Sitorai Mokhi-Khosa opens into a palace garden. Marble lions, mirrored rooms, carved ganch, porcelain, textiles, and applied-art displays show the last emir's summer residence as a different side of the city."
  "ru": "После бухарских улиц, куполов и крепостных стен Ситораи Мохи-Хоса открывает дворцовый сад. Мраморные львы, зеркальные комнаты, резной ганч, фарфор, ткани и прикладное искусство показывают летнюю резиденцию последнего эмира как другую сторону города."
  "uz": "Buxoroning ko‘chalari, gumbazlari va qalʼa devorlaridan keyin Sitorai Mohi-Xosa saroy bogʻiga ochiladi. Marmar sherlar, oynali xonalar, oʻyma ganch, chinni, matolar va amaliy sanʼat so‘nggi amir yozgi qarorgohini shaharning boshqa tomoni sifatida ko‘rsatadi."
