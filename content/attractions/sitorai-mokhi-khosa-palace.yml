  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place matters"
      "ru": "Почему это место важно"
      "uz": "Nima uchun bu joy"
    "title":
      "en": "The palace side of Bukhara beyond the old-city walk"
      "ru": "Дворцовая Бухара за пределами старого города"
      "uz": "Eski shahar tashqarisidagi saroy Buxorosi"
    "description":
      "en": "The palace changes the Bukhara route by moving from mosques, madrasahs, and bazaar streets into the summer world of the last emir. Built in the early 20th century, the new palace brings Bukharan craft, European-influenced interiors, museum displays, and garden space into one stop.


        «Sitorai shows another side of Bukhara: garden paths, mirrored rooms, and the court world of the last emir.»"
      "ru": "Дворец меняет бухарский маршрут: после мечетей, медресе и базарных улиц путешественник попадает в летний мир последнего эмира. Новый дворец начала XX века соединяет бухарское ремесло, интерьеры с европейским влиянием, музейные экспозиции и садовое пространство в одну остановку.


        «Ситораи показывает другую сторону Бухары: садовые дорожки, зеркальные комнаты и придворный мир последнего эмира.»"
      "uz": "Saroy Buxoro yo‘nalishini o‘zgartiradi: masjidlar, madrasalar va bozor ko‘chalaridan keyin sayohatchi so‘nggi amirning yozgi dunyosiga kiradi. XX asr boshidagi yangi saroy buxorolik hunarmandchilik, yevropacha taʼsirli interyerlar, muzey ekspozitsiyalari va bogʻ makonini bitta bekatda jamlaydi.


        «Sitorai Buxoroning boshqa tomonini ko‘rsatadi: bogʻ yo‘llari, oynali xonalar va so‘nggi amir saroy dunyosi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you will see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Palace gates, mirrored rooms, and applied-art displays"
      "ru": "Дворцовые ворота, зеркальные комнаты и прикладное искусство"
      "uz": "Saroy darvozalari, oynali xonalar va amaliy sanʼat"
    "description":
      "en": "The sequence is strongest when you move from the gate and garden into mirrored interiors and applied-art displays. The museum rooms keep the palace connected to real objects, not just empty architecture."
      "ru": "Последовательность лучше всего ощущается от ворот и сада к зеркальным интерьерам и прикладному искусству. Музейные комнаты связывают дворец с реальными предметами, а не только с архитектурой."
      "uz": "Ketma-ketlik darvoza va bogʻdan oynali interyerlar hamda amaliy sanʼatga o‘tganda kuchliroq seziladi. Muzey xonalari saroyni faqat meʼmorchilik emas, real buyumlar bilan ham bogʻlaydi."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как смотреть"
      "uz": "Qanday ko‘rish"
    "title":
      "en": "Give Sitorai its own transfer and museum time"
      "ru": "Оставьте Ситораи отдельный выезд и музейное время"
      "uz": "Sitorai uchun alohida yo‘l va muzey vaqtini qoldiring"
    "description":
      "en": "Sitorai feels different because it begins with a short drive and opens slowly through the garden, interiors, and displays. It fits best when the old-city anchors are not being rushed."
      "ru": "Ситораи ощущается иначе, потому что начинается с короткого выезда и постепенно открывается через сад, интерьеры и экспозиции. Лучше добавлять дворец тогда, когда главные места старого города не идут в спешке."
      "uz": "Sitorai qisqa yo‘l bilan boshlanib, bogʻ, interyerlar va ekspozitsiyalar orqali sekin ochilgani uchun boshqacha seziladi. Saroyni eski shaharning asosiy joylari shoshilmay ko‘rilgan kunga qo‘shgan maʼqul."
  - "blockType": "regular"
    "eyebrow":
      "en": "What to add nearby"
      "ru": "Что добавить рядом"
