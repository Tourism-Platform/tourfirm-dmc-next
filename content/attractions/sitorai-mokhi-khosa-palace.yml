    "title":
      "en": "Old-city anchors before or after Sitorai"
      "ru": "Главные места старого города до или после Ситораи"
      "uz": "Sitorai oldidan yoki keyin eski shaharning asosiy joylari"
    "description":
      "en": "The Ark and Bolo-Hauz sit naturally before the palace extension. Poi-Kalyan and the Trading Domes keep the old-city route clear when Sitorai is planned as a separate drive."
      "ru": "Арк и Боло-Хауз хорошо подходят перед дворцовым выездом. Пои-Калян и Торговые купола сохраняют маршрут по старой Бухаре понятным, если Ситораи запланирован отдельной дорогой."
      "uz": "Ark va Bolo-Hauz saroy chiqishidan oldin yaxshi mos keladi. Poyi Kalon va Savdo gumbazlari esa Sitorai alohida yo‘l sifatida rejalanganda eski shahar marshrutini tushunarli saqlaydi."
