    "en": "After the old-city walk, Bahauddin Naqshband Memorial Complex shows Bukhara through a sacred place of memory. Courtyards, water, marble detail, mosque space, and the Naqshbandi tradition make the visit a separate ziyorat setting with its own pace."
    "ru": "После прогулки по старой Бухаре мемориальный комплекс Бахауддина Накшбанда показывает Бухару через святое место памяти. Дворы, вода, мраморные детали, пространство мечети и традиция Накшбандии делают визит отдельным паломническим выездом со своим темпом."
    "uz": "Eski shahar sayridan keyin Bahouddin Naqshband yodgorlik majmuasi Buxoroni muqaddas xotira joyi orqali ko‘rsatadi. Hovlilar, suv, marmar detallar, masjid fazosi va Naqshbandiya anʼanasi tashrifni alohida ziyorat muhiti qiladi."
