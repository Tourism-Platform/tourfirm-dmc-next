    "description":
      "en": "The main reason to come is clear: this is Bukhara's memorial place for Bahauddin Naqshband and the Naqshbandi tradition. In a Bukhara day, it changes the route from old streets and domes to courtyards, water, memorial detail, mosque space, and the respectful context of a living sacred site.


        «Here Bukhara moves beyond the old streets and becomes a place of memory.»"
      "ru": "Главный смысл места — связь с Бахауддином Накшбандом и традицией Накшбандии. В бухарском дне это смена маршрута: от старых улиц и куполов к дворам, воде, мемориальным деталям, пространству мечети и уважительному контексту действующего святого места.


        «Здесь Бухара выходит за пределы старых улиц и становится местом памяти.»"
      "uz": "Joyning asosiy maʼnosi Bahouddin Naqshband va Naqshbandiya anʼanasi bilan bog‘liq. Buxoro kunida bu yo‘nalishni o‘zgartiradi: eski ko‘chalar va gumbazlardan hovlilar, suv, yodgorlik detallari, masjid fazosi va amaldagi muqaddas joy hurmatiga o‘tadi.


        «Bu yerda Buxoro eski ko‘chalardan chiqib, xotira joyiga aylanadi.»"
