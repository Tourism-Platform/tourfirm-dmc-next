      "ru": "Это не памятник с кассой. Дорога, воздух, склоны и край села показывают путешественнику, что он приехал в Бахмал, а не просто к ещё одному названию на карте.


        «Новка сильнее, когда горная среда остаётся достаточно тихой, чтобы село было заметно.»"
      "uz": "Bu chipta bilan kiriladigan yodgorlik emas. Yo‘l, havo, yonbag‘irlar va qishloq cheti sayohatchiga xaritadagi yana bir nomga emas, Baxmalga kelganini bildiradi.


        «Novqa tog‘ muhiti qishloqni sezishga imkon beradigan darajada sokin qolsa kuchliroq.»"
