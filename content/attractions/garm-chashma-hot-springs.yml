"excerpt":
  "en": "Garm Chashma turns the Ishkashim road toward a warmer side valley. Mineral water, pale limestone terraces, mountain air, and a small sanatorium setting give the stop a different mood from a fortress, river view, or high-pass photograph. Come only with fresh local advice: the side road, bathing areas, privacy expectations, and access rules can matter more than the distance on the map."
  "ru": "Гарм Чашма уводит дорогу Ишкашима в более тёплую боковую долину. Минеральная вода, светлые известняковые террасы, горный воздух и небольшая санаторная среда дают остановке другой тон, чем крепость, речной вид или кадр с перевала. Ехать сюда стоит только со свежим местным советом: боковая дорога, зоны купания, ожидания приватности и правила доступа могут оказаться важнее расстояния на карте."
  "uz": "Garm Chashma Ishkashim yoʻlini issiqroq yon vodiyga buradi. Mineral suv, och ohaktosh terrasalari, togʻ havosi va kichik sanatoriy muhiti bu toʻxtashni qalʼa, daryo manzarasi yoki dovon suratidan boshqacha qiladi. Bu yerga faqat yangi mahalliy maslahat bilan boring: yon yoʻl, choʻmilish joylari, shaxsiylik kutilmalari va kirish qoidalari xaritadagi masofadan muhimroq boʻlishi mumkin."
