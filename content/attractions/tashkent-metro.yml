    "description":
      "en": "The strongest metro views include both architecture and motion: halls built with care, trains arriving, and passengers using the city around you."
      "ru": "Лучшие виды метро соединяют архитектуру и движение: залы, сделанные с вниманием, прибывающие поезда и пассажиров, которые пользуются городом вокруг вас."
      "uz": "Metroning eng kuchli ko‘rinishlari meʼmorchilik va harakatni birlashtiradi: eʼtibor bilan qurilgan zallar, kelayotgan poyezdlar va shaharni ishlatayotgan yo‘lovchilar."
