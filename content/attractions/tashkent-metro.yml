      "uz": "Metro uzun yer osti ro‘yxatiga aylanmaganda kuchliroq. Bir necha bekat, aniq chiqish va yer ustidagi yaxshi keyingi nuqta hammasini birdan ko‘rishga urinishdan ko‘ra yaxshiroq ishlaydi."
