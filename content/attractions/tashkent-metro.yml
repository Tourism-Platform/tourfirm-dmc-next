      "en": "An underground gallery inside daily transport"
      "ru": "Подземная галерея внутри обычного транспорта"
      "uz": "Kundalik transport ichidagi yer osti galereyasi"
    "description":
      "en": "The metro gives Tashkent's modern story a visible form. Travelers do not need every station. A compact ride can show how Soviet-era civic design, Uzbek ornament, public art, and ordinary passenger life meet below the city.


        «In Tashkent, the metro helps the city speak through movement, not only through monuments.»"
      "ru": "Метро даёт современной истории Ташкента видимую форму. Путешественнику не нужно видеть каждую станцию. Короткая поездка показывает, как советский городской дизайн, узбекский орнамент, общественное искусство и обычная жизнь пассажиров встречаются под городом.


        «В Ташкенте метро помогает городу говорить через движение, а не только через памятники.»"
      "uz": "Metro Toshkentning zamonaviy hikoyasini ko‘zga ko‘rinadigan qiladi. Sayohatchiga har bir bekatni ko‘rish shart emas. Qisqa safar sovet davri shahar dizayni, o‘zbek naqshi, jamoat sanʼati va yo‘lovchilar hayoti yer ostida qanday uchrashishini ko‘rsatadi.


        «Toshkentda metro shaharni faqat yodgorliklar orqali emas, harakat orqali ham tushuntiradi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Trains, station halls, and decorated underground space"
      "ru": "Поезда, станционные залы и украшенное подземное пространство"
