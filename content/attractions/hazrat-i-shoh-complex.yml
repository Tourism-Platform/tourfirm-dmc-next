  "en": "Hazrat-i Shoh is the Istaravshan stop where the route lowers its voice. After hill ruins and blue-dome architecture, the mosque setting asks for modest dress, quiet movement, and a local check on which visitor areas are open that day. Keep the camera discreet, and let the stop stay respectful before the route continues through Mug Teppe, Kok Gumbaz, bazaar lanes, or craft streets."
  "ru": "Хазрат-и Шох - остановка, где маршрут по Истаравшану становится тише. После холма с древней памятью и голубого купола мечеть просит скромной одежды, спокойного движения и местной проверки того, какие зоны открыты гостям в этот день. Камеру лучше держать ненавязчиво, а саму остановку оставить уважительной перед продолжением к Муг-Теппе, Кок-Гумбазу, базарным переулкам или ремесленным улицам."
  "uz": "Hazrati Shoh Istaravshan yoʻnalishi sokinlashadigan bekatdir. Tepalikdagi qadimiy xotira va moviy gumbazdan keyin masjid muhiti kamtar kiyim, sokin harakat va oʻsha kuni mehmonlar uchun qaysi joylar ochiq ekanini mahalliy tekshirishni talab qiladi. Kamerani ehtiyotkor tuting, bekatni hurmat bilan saqlang va keyin yoʻnalish Mug Teppe, Koʻk Gumbaz, bozor yoʻlaklari yoki hunarmand koʻchalariga davom etsin."
