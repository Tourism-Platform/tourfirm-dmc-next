    "title":
      "en": "A hillside pause that gives Khorog shape"
      "ru": "Сад на склоне, где Хорог обретает форму"
      "uz": "Xorugʻ shaklini ko‘rsatadigan yonbagʻir bogʻi"
    "description":
      "en": "The garden matters because it gives Khorog a real place to walk, look, and understand the town's setting. Instead of passing through as only a road stop, travelers see planted terraces, Pamir air, and the river valleys that define the city.


        «From the garden, Khorog feels less like a pause between road sections and more like a town held between rivers, slopes, and planted paths.»"
      "ru": "Сад важен потому, что даёт Хорогу понятное место для прогулки, взгляда и ощущения города. Вместо простой дорожной паузы путешественник видит склоны с посадками, памирский воздух и речные долины, которые формируют город.


        «Из сада Хорог выглядит не просто остановкой дороги, а городом между реками, склонами и дорожками с посадками.»"
      "uz": "Bogʻ muhim, chunki Xorugʻda yurish, qarash va shahar joylashuvini tushunish uchun aniq joy beradi. Sayohatchi oddiy yoʻl toʻxtashidan ko‘ra ekilgan yonbagʻirlarni, Pomir havosini va shahar shaklini belgilaydigan daryo vodiylarini ko‘radi.


        «Bogʻdan Xorugʻ faqat yoʻl orasidagi toʻxtash emas, daryolar, yonbagʻirlar va ekilgan yoʻlaklar tutgan shahar bo‘lib ko‘rinadi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni koʻrasiz"
    "title":
      "en": "Paths, plants, river-valley views"
      "ru": "Дорожки, растения, виды к речным долинам"
      "uz": "Yoʻlaklar, oʻsimliklar, daryo vodiylari"
    "description":
      "en": "The garden's rhythm is simple: hillside paths first, planted slopes close by, then the view back over Khorog and the river setting."
      "ru": "Ритм сада простой: сначала дорожки на склоне, затем посадки рядом, а потом вид обратно на Хорог и речное окружение."
      "uz": "Bogʻning ritmi oddiy: avval yonbagʻir yoʻlaklari, keyin yaqin ekilgan joylar, soʻng Xorugʻ va daryo muhitiga qaragan manzara."
  - "blockType": "regular"
