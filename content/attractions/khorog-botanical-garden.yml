      "uz": "Botanika bogʻi ogʻir ekskursiyaga aylanishi shart emas. U qisqa mahalliy sayr sifatida yaxshi turadi: yoʻlaklar, yonbagʻir va manzara harakat beradi, keyin eʼtibor yana keyingi yoʻl qaroriga qaytadi."


