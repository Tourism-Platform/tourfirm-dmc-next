      "en": "A courtyard ensemble after Ak-Saray"
      "ru": "Двор после Ак-Сарая"
      "uz": "Ak-Saroydan keyingi hovli ansambli"
    "description":
      "en": "Dorut Tilovat matters because it keeps Shakhrisabz from becoming only the palace portal. After Ak-Saray, the route turns to religious architecture, mausoleum memory, and the Kok Gumbaz setting."
      "ru": "Дорут-Тиловат важен потому, что не даёт Шахрисабзу остаться только дворцовой историей. После портала Ак-Сарая маршрут переходит к религиозной архитектуре, мавзолейной памяти и пространству Кок-Гумбаза."
      "uz": "Dorut Tilovat Shahrisabzni faqat saroy hikoyasi bilan qoldirmaydi. Ak-Saroy peshtoqidan keyin yo‘l diniy meʼmorchilik, maqbaralar xotirasi va Ko‘k Gumbaz muhitiga o‘tadi."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Kok Gumbaz, brick walls, and ensemble space"
      "ru": "Кок-Гумбаз, кирпичные стены и двор ансамбля"
      "uz": "Ko‘k Gumbaz, g‘isht devorlar va ansambl hovlisi"
    "description":
      "en": "The visual story is architectural: brick walls, the blue dome, and the mosque edge beside the memorial ensemble."
      "ru": "Здесь важны не отдельные детали, а соседство: кирпичные стены, синий купол и пространство мечети рядом с мемориальным ансамблем."
      "uz": "Bu yerda alohida detal emas, yonma-yon turgan makon muhim: g‘isht devorlar, ko‘k gumbaz va memorial ansambl yonidagi masjid muhiti."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посещать"
      "uz": "Qanday tashrif buyurish"
    "title":
      "en": "Visit as a religious courtyard ensemble"
      "ru": "Спокойно и уважительно"
      "uz": "Sokin va hurmat bilan"
    "description":
      "en": "Treat Dorut Tilovat as a religious and memorial setting, not as a quick connector between Ak-Saray and Dorus-Saodat."
      "ru": "Относитесь к Дорут-Тиловату как к религиозному мемориальному ансамблю, а не как к короткому переходу между Ак-Сараем и Дорус-Саодат."
      "uz": "Dorut Tilovatga Ak-Saroy va Dorus-Saodat orasidagi qisqa o‘tish sifatida emas, diniy va memorial ansambl sifatida qarash kerak."
  - "blockType": "regular"
