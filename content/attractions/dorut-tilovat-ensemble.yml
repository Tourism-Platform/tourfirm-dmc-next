    "description":
      "en": "Nearby, the route can continue to Kok Gumbaz, Shamsiddin Kulol, Gumbazi Sayyidon, and Dorus-Saodat. Add them by access and pace, not as a rushed list."
      "ru": "Рядом маршрут может продолжиться к Кок-Гумбазу, Шамсиддину Кулолу, Гумбази-Саййидон и Дорус-Саодат. Эти места лучше добавлять по доступу и темпу, а не превращать центр в перечень."
      "uz": "Yaqinda yo‘nalish Ko‘k Gumbaz, Shamsiddin Kulol, Gumbazi Sayyidon va Dorus-Saodat tomon davom etishi mumkin. Ularni kirish va surʼatga qarab qo‘shgan maʼqul."
