    "description":
      "en": "Murghab is not a monument stop. Its value is quieter: the town lets the traveler feel altitude, distance, and current road conditions before the landscape opens again.


        «The most important thing in Murghab may be the conversation before the next road.»"
      "ru": "Мургаб не похож на памятник. Его ценность тише: посёлок даёт почувствовать высоту, расстояние и текущие дорожные условия перед тем, как пейзаж снова откроется.


        «Самым важным в Мургабе может оказаться разговор перед следующей дорогой.»"
      "uz": "Murgʻob yodgorlik toʻxtashi emas. Uning qiymati sokinroq: shaharcha manzara yana ochilishidan oldin balandlik, masofa va hozirgi yoʻl sharoitini his qildiradi.


        «Murgʻobdagi eng muhim narsa keyingi yoʻl oldidan boʻladigan suhbat boʻlishi mumkin.»"
