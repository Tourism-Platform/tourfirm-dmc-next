"excerpt":
  "en": "Murghab High Pamir Town is where the Pamir Highway stops feeling like a line on the map. Thin air, wind, low houses, shop counters, tea tables, and long horizons bring the eastern plateau close. The stop is most useful when it stays simple: arrive slowly, ask what the road is doing, check what the next section needs, and leave with one clear direction instead of a list of high-country names."
  "ru": "Высокогорный посёлок Мургаб — место, где Памирский тракт перестаёт быть линией на карте. Тонкий воздух, ветер, низкие дома, прилавки, чайные столы и длинный горизонт приближают восточное плато. Остановка сильнее всего, когда остаётся простой: приехать без спешки, узнать, что происходит с дорогой, проверить следующий участок и уехать в одном ясном направлении, а не со списком высокогорных названий."
  "uz": "Murgʻob baland Pomir shaharchasida Pomir trakti xaritadagi chiziq boʻlib qolmaydi. Yupqa havo, shamol, past uylar, doʻkon rastalari, choy stollari va uzoq ufq sharqiy platoni yaqinlashtiradi. Bu toʻxtash sodda qolganda eng foydali: sekin yetib kelish, yoʻl qandayligini soʻrash, keyingi qism nimani talab qilishini tekshirish va baland togʻ nomlari roʻyxati bilan emas, bitta aniq yoʻnalish bilan chiqish."
