      "ru": "Archazor сильнее всего работает, когда у него есть понятная роль в горном маршруте: ночёвка, восстановление в SPA, семейная пауза, остановка на еду или событийное размещение. До поездки нужно подтвердить категорию номера, текущие правила для гостей, время приезда и погоду."
      "uz": "Archazor tog‘ yo‘lida aniq vazifasi bo‘lganda kuchli chiqadi: tunash, SPA orqali tiklanish, oilaviy dam, ovqat bekati yoki tadbir uchun qolish. Safardan oldin xona turi, amaldagi mehmon qoidalari, yetib kelish vaqti va ob-havoni tasdiqlash kerak."
