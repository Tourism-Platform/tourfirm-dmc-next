    "description":
      "en": "Chimgan often means roads, ridges, lifts, and weather checks. Archazor gives that same mountain setting a steadier pace: a place to arrive, sleep, warm up, eat, and let the route breathe without leaving the mountains behind.


        «Archazor is for the moment when Chimgan should slow down: pine air outside, warm water inside, and the mountains still close enough to shape the evening.»"
      "ru": "Чимган часто означает дорогу, хребты, подъёмники и проверку погоды. Archazor даёт этой же горной среде более ровный ритм: приехать, выспаться, согреться, поесть и не терять ощущение гор.


        «Archazor подходит для момента, когда Чимган должен замедлиться: снаружи сосновый воздух, внутри тёплая вода, а горы всё ещё задают вечер.»"
      "uz": "Chimyon ko‘pincha yo‘l, tizma, liftlar va ob-havo tekshiruvini anglatadi. Archazor shu tog‘ muhitiga barqarorroq sur’at beradi: yetib kelish, uxlash, isinib olish, ovqatlanish va tog‘ hissini yo‘qotmaslik.


        «Archazor Chimyon sekinlashishi kerak bo‘lgan payt uchun: tashqarida qarag‘ay havosi, ichkarida iliq suv, kechni esa tog‘lar belgilaydi.»"
  - "blockType": "regular"
    "eyebrow":
