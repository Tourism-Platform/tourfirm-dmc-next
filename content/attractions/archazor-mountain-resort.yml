      "en": "Archazor reads in a mountain-resort sequence: Chimgan outside, pool water and sauna heat inside, a dining room with wide windows, and rooms where the view remains part of the stay."
      "ru": "Archazor читается как курортная последовательность: Чимган снаружи, вода бассейна и тепло SPA внутри, ресторан с широкими окнами и номера, где вид остаётся частью проживания."
      "uz": "Archazor bitta yodgorlik kabi o‘qilmaydi. Bu tog‘ kurorti ketma-ketligi: tashqarida Chimyon, ichkarida basseyn suvi va SPA issig‘i, keng oynali restoran va manzara turar joyning bir qismi bo‘lib qoladigan xonalar."
