    "description":
      "en": "The square gathers several views of Tashkent in one walkable frame: a national monument, formal garden paths, Soviet-era Hotel Uzbekistan, the Palace of Forums, nearby metro, and the Temurids Museum. It is most useful when it sets the day in place without turning a short stop into ceremony.


        «This is where central Tashkent's scale becomes clear before you choose the slower stop of the day.»"
      "ru": "В одной короткой прогулке сквер собирает несколько видов Ташкента: национальный памятник, строгие дорожки, гостиницу «Узбекистан» советского периода, Дворец форумов, метро рядом и музей Темуридов. Он полезнее всего тогда, когда помогает настроить день без лишней торжественности.


        «Здесь масштаб центрального Ташкента становится понятнее до того, как вы выберете более медленную остановку дня.»"
      "uz": "Xiyobon bir qisqa yurishda Toshkentning bir nechta qiyofasini jamlaydi: milliy yodgorlik, tartibli yo‘laklar, sovet davridan qolgan «O‘zbekiston» mehmonxonasi, Forumlar saroyi, yaqin metro va Temuriylar muzeyi. U kunni ortiqcha tantanaga aylantirmasdan tushunishga yordam berganda eng foydali.


        «Bu yerda markaziy Toshkent o‘lchami aniqroq ko‘rinadi, keyin kun qayerda sekinlashishini tanlash osonlashadi.»"
