  "uz": "Chilpiqni yana bir qalʼa emas, tepa va marosim inshooti sifatida ko‘rish kerak. Aylana xom g‘isht devor, ochiq zinapoyalar va Amudaryo manzarasi Nukusni qadimgi Xorazm bilan bog‘laydi, keyin yo‘l Xiva yoki cho‘l qalʼalariga davom etadi."
