    "description":
      "en": "Chilpyk matters because the form is clear before any long explanation: a lone hill, a roofless circular wall, and the Amu Darya landscape around it. The archaeological story should stay precise and respectful, without turning ritual history into spectacle."
      "ru": "Чилпык важен тем, что его форма понятна до длинного объяснения: одинокий холм, открытая круглая стена и ландшафт Амударьи вокруг. Археологический рассказ здесь должен оставаться точным и уважительным, без превращения ритуальной истории в зрелище."
      "uz": "Chilpiq muhim, chunki uning shakli uzun izohdan oldin ko‘rinadi: yolg‘iz tepa, tomsiz aylana devor va atrofdagi Amudaryo manzarasi. Arxeologik hikoya aniq va hurmatli qolishi, marosim tarixini tomoshaga aylantirmasligi kerak."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
