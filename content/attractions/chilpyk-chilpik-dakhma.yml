      "en": "Chilpyk can be a compact stop, but it should not feel like a quick photo climb. Plan the approach, heat, wind, footwear, and explanation before adding it to the Nukus-Khiva road."
      "ru": "Чилпык может быть короткой остановкой, но не должен превращаться в быстрый подъём ради фото. До включения в дорогу Нукус-Хива проверьте подъезд, жару, ветер, обувь и формат объяснения."
      "uz": "Chilpiq qisqa to‘xtash bo‘lishi mumkin, lekin uni faqat surat uchun tez ko‘tarilish deb qabul qilmaslik kerak. Nukus-Xiva yo‘liga qo‘shishdan oldin kirish, issiq, shamol, oyoq kiyim va izoh formatini tekshiring."
