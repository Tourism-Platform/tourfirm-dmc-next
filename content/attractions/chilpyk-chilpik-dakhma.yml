    "description":
      "en": "Chilpyk is spare and exposed: a conical hill, an adobe ring, steps, open ground, and the Amu Darya landscape around it."
      "ru": "Чилпык — сдержанное открытое место: конусный холм, сырцовое кольцо, ступени, открытая земля и ландшафт Амударьи вокруг."
      "uz": "Chilpiq ochiq va ixcham joy: konussimon tepa, xom g‘isht halqa, zinapoya, ochiq yer va atrofdagi Amudaryo manzarasi."
  - "blockType": "regular"
    "eyebrow":
