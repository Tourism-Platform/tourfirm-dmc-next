  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "Where the market route becomes quiet"
      "ru": "Где рыночный маршрут становится тише"
      "uz": "Bozor yoʻli sokinlashadigan joy"
    "description":
      "en": "The complex keeps Khujand's sacred life close to its busiest quarter. A short walk from Panjshanbe can shift from trade and street noise to tomb, mosque, and prayer etiquette without leaving the city center.


        «Sheikh Muslihiddin matters because Khujand does not only show itself through trade and walls; it also asks for respect, prayerful quiet, and a slower step.»"
      "ru": "Комплекс показывает, что священная жизнь Худжанда находится рядом с самым оживлённым центром. Несколько минут от Панджшанбе переводят маршрут от торговли и уличного шума к гробнице, мечети и этикету молитвенного места.


        «Шейх Муслихиддин важен потому, что Худжанд раскрывается не только через торговлю и стены; здесь нужны уважение, молитвенная тишина и более медленный шаг.»"
      "uz": "Majmua Xoʻjandning muqaddas hayoti shaharning eng gavjum markaziga yaqinligini koʻrsatadi. Panjshanbedan qisqa yoʻl savdo va koʻcha shovqinidan maqbara, masjid va namoz joyi odobiga olib kiradi.


        «Shayx Muslihiddin Xoʻjand faqat savdo va devorlar orqali emas, hurmat, ibodat sokinligi va sekinroq qadam orqali ham ochilishini koʻrsatadi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni koʻrasiz"
    "title":
      "en": "Tomb, mosque, and courtyard quiet"
      "ru": "Гробница, мечеть и тишина двора"
      "uz": "Maqbara, masjid va hovli sokinligi"
    "description":
      "en": "Look first for the sacred center of the mausoleum, then for the mosque-and-madrasa setting around it, and finally for the way the courtyard softens the market side of Khujand. 1. **Mausoleum and sacred memory** **alt:** Sheikh Muslihiddin mausoleum complex in central Khujand. **caption:** The mausoleum keeps the sacred meaning of the complex at the center of the visit. **media_label:** Mausoleum and sacred memory 2. **Mosque and madrasa memory** **alt:** Mosque and madrasa setting at Sheikh Muslihiddin in Khujand. **caption:** The complex is more than one tomb; it carries mosque, madrasa, and worship meaning. **media_label:** Mosque and madrasa setting 3. **Courtyard after the market** **alt:** Courtyard quiet near Panjshanbe Bazaar in central Khujand. **caption:** The mood change from bazaar to courtyard is what makes the city center feel complete. **media_label:** Courtyard quiet"
      "ru": "Сначала обратите внимание на священный центр мавзолея, затем на мечеть и память медресе вокруг него, а потом на то, как двор смягчает рыночную сторону Худжанда. 1. **Мавзолей и священная память** **alt:** Комплекс мавзолея шейха Муслихиддина в центре Худжанда. **caption:** Мавзолей удерживает священный смысл комплекса в центре визита. **media_label:** Мавзолей и священная память 2. **Мечеть и медресе** **alt:** Мечеть и память медресе в комплексе шейха Муслихиддина в Худжанде. **caption:** Комплекс не сводится к одной гробнице; он несёт смысл мечети, медресе и молитвы. **media_label:** Мечеть и медресе 3. **Двор после рынка** **alt:** Тишина двора рядом с базаром Панджшанбе в центре Худжанда. **caption:** Смена настроения от базара к двору делает центр города цельным. **media_label:** Тишина двора"
      "uz": "Avval maqbaraning muqaddas markaziga, keyin uning atrofidagi masjid va madrasa xotirasiga, soʻng hovli Xoʻjandning bozor tomonini qanday yumshatishiga eʼtibor bering. 1. **Maqbara va muqaddas xotira** **alt:** Markaziy Xoʻjanddagi Shayx Muslihiddin maqbarasi majmuasi. **caption:** Maqbara majmuaning muqaddas maʼnosini tashrif markazida ushlab turadi. **media_label:** Maqbara va muqaddas xotira 2. **Masjid va madrasa konteksti** **alt:** Xoʻjanddagi Shayx Muslihiddin majmuasida masjid va madrasa konteksti. **caption:** Majmua bitta maqbaradan koʻproq; unda masjid, madrasa va ibodat konteksti bor. **media_label:** Masjid va madrasa muhiti 3. **Bozordan keyingi hovli** **alt:** Markaziy Xoʻjandda Panjshanbe bozori yaqinidagi hovli sokinligi. **caption:** Bozordan hovliga kayfiyat oʻzgarishi shahar markazini toʻliqroq qiladi. **media_label:** Hovli sokinligi"
