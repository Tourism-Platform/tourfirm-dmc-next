    "description":
      "en": "The road into Duoba starts to feel like Zaamin before the village appears: bends, open air, and weather that can change quickly. The mountain approach sets the mood, while the real meaning of the stop stays in the mahalla.


        «The mountains should give Duoba air and pace, not turn the mahalla into a resort stop.»"
      "ru": "Дорога к Дуобе начинает ощущаться как Заамин ещё до села: повороты, открытый воздух и погода, которая быстро меняется. Горный подъезд задаёт настроение, а смысл остановки остаётся в махалле.


        «Горы должны дать Дуобе воздух и темп, а не превращать махаллю в курортную остановку.»"
      "uz": "Duobaga boradigan yo‘l qishloq ko‘rinishidan oldin ham Zominni sezdira boshlaydi: burilishlar, ochiq havo va tez o‘zgaradigan ob-havo. Tog‘ tomondan kirish kayfiyat beradi, bekatning ma’nosi esa mahallada qoladi.


        «Tog‘lar Duobaga havo va sur’at berishi kerak, mahallani kurort bekatiga aylantirmasligi kerak.»"
