  "en": "Bukhara State Art-Architectural Museum-Preserve is a museum system, not a single monument. The Ark gives it the clearest public address; the branches continue the story through palace rooms, a merchant house, fine-art galleries, documents, coins, textiles, books, and objects from Bukhara's daily life."
  "ru": "Бухарский государственный архитектурно-художественный музей-заповедник — это музейная система, а не один памятник. Арк даёт ей самый понятный публичный адрес; филиалы продолжают тему через дворцовые залы, купеческий дом, художественные коллекции, документы, монеты, ткани, книги и предметы повседневной жизни Бухары."
  "uz": "Buxoro davlat meʼmoriy-badiiy muzey-qo‘riqxonasi bitta yodgorlik emas, balki muzey tizimidir. Ark uning eng tushunarli ommaviy manzili; filiallar esa saroy xonalari, savdogar uyi, tasviriy sanʼat, hujjatlar, tangalar, matolar, kitoblar va Buxoroning kundalik hayoti buyumlari orqali davom etadi."
