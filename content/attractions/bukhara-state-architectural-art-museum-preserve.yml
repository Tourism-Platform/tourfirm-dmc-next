      "ru": "С музеем-заповедником лучше сочетать места, которые помогают уточнить выбор: Арк как главный адрес, дом-музей Файзуллы Ходжаева для городского быта, Ситораи для дворцового филиала и Торговые купола для возвращения к прогулке по старой Бухаре."
