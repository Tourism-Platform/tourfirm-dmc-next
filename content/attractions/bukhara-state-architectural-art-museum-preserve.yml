  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nima uchun bu joy"
    "title":
      "en": "A museum institution, not one more monument"
      "ru": "Музейная система, а не ещё одно здание"
      "uz": "Yana bir bino emas, muzey tizimi"
    "description":
      "en": "The museum-preserve matters because it explains how many of Bukhara's museum rooms belong to one institution. The official museum history begins in 1922; since 1945 its main address has been the Ark, and since 1985 it has carried museum-preserve status. That makes the page a route choice: which rooms or branch museums should belong to your Bukhara day.


        «The museum-preserve makes sense when you see it as Bukhara's museum system, not as another stop beside the Ark.»"
      "ru": "Музей-заповедник важен потому, что многие музейные залы Бухары относятся к одной институции. История музея начинается в 1922 году; с 1945 года его главный адрес находится в Арке, а в 1985 году он получил статус музея-заповедника. Поэтому эта остановка помогает решить, какие залы или филиалы действительно нужны в бухарском дне.


        «Музей-заповедник понятнее, когда вы видите в нём систему залов и филиалов, а не ещё одну точку рядом с Арком.»"
      "uz": "Muzey-qo‘riqxona muhim, chunki Buxorodagi ko‘plab muzey xonalari bitta muassasaga tegishli. Muzey tarixi 1922 yildan boshlanadi; 1945 yildan beri uning asosiy manzili Arkda, 1985 yildan esa muzey-qo‘riqxona maqomiga ega. Shuning uchun bu joy Buxoro kuniga qaysi zal yoki filial kerakligini tanlashga yordam beradi.


        «Muzey-qo‘riqxona Ark yonidagi yana bir nuqta emas, zallar va filiallar tizimi sifatida ko‘rilganda tushunarliroq bo‘ladi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you will see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Ark rooms, branch museums, and collection details"
      "ru": "Залы Арка, музейные филиалы и детали коллекций"
      "uz": "Ark xonalari, muzey filiallari va kolleksiya detallari"
    "description":
      "en": "Expect a mix rather than one facade: Ark museum rooms, separate branch museums, and smaller displays of coins, documents, textiles, books, paintings, photographs, and household objects."
      "ru": "Здесь не один фасад, а несколько типов музейного опыта: залы Арка, отдельные филиалы и небольшие экспозиции с монетами, документами, тканями, книгами, живописью, фотографиями и бытовыми предметами."
      "uz": "Bu yerda bitta fasad emas, bir necha muzey tajribasi bor: Ark xonalari, alohida filiallar hamda tanga, hujjat, mato, kitob, rasm, fotosurat va maishiy buyumlar ko‘rsatiladigan kichik ekspozitsiyalar."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посещать"
      "uz": "Qanday tashrif buyurish"
    "title":
      "en": "Choose the museum part of the Bukhara day"
      "ru": "Выберите музейную часть бухарского дня"
      "uz": "Buxoro kunining muzey qismini tanlang"
    "description":
      "en": "Start with the question you want the museum to answer: citadel and government history at the Ark, palace interiors at Sitorai, urban family life at Fayzulla's house, fine art, or a collection theme."
      "ru": "Начните с вопроса, который должен ответить музей: история цитадели и власти в Арке, дворцовые интерьеры в Ситораи, городская частная жизнь в доме Файзуллы, изобразительное искусство или отдельная тема коллекции."
      "uz": "Avval muzey qaysi savolga javob berishini tanlang: Arkda qalʼa va hokimiyat tarixi, Sitorayda saroy interyerlari, Fayzulla uyida shahar maishiy hayoti, tasviriy sanʼat yoki alohida kolleksiya mavzusi."
