"excerpt":
  "en": "Torysh is not an Aktau city sight. The road leaves the Caspian city for northern Mangystau, and the plateau begins to show rounded stone spheres: scattered, weathered, and strange enough to feel almost placed by hand. The view is the draw, but the road sets the terms; vehicle, daylight, water, heat, wind, and current local advice all need to be right."
  "ru": "Торыш - не городская достопримечательность Актау. Дорога уходит от Каспийского города на север Мангистау, и на плато появляются округлые каменные сферы: разрозненные, выветренные, настолько странные, будто их кто-то расставил вручную. Вид притягивает, но условия задаёт дорога: машина, световой день, вода, жара, ветер и свежий местный совет должны совпасть."
  "uz": "Torysh Aqtau ichidagi shahar diqqatga sazovor joyi emas. Yoʻl Kaspiy shahridan Mangʻistov shimoliga chiqadi va platoda yumaloq tosh sharlar koʻrina boshlaydi: tarqoq, shamolda yemirilgan, goʻyo kimdir ularni qoʻlda joylashtirgandek gʻalati. Manzara jalb qiladi, lekin shartni yoʻl belgilaydi: mashina, kunduzgi vaqt, suv, issiq, shamol va yangi mahalliy maslahat mos boʻlishi kerak."
