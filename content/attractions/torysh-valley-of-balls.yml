    "description":
      "en": "Torysh gives the route from Aktau its clearest geological pause. It is not one viewpoint but a field of rounded forms spread across open desert ground.


        «Torysh is not a quick city add-on. It is a Mangystau road stop where geology, distance, and weather all have a say.»"
      "ru": "Торыш даёт маршруту из Актау ясную геологическую паузу. Это не одна смотровая точка, а поле округлых форм на открытой пустынной поверхности.


        «Торыш - не быстрая добавка к Актау. Это дорожная остановка Мангистау, где геология, расстояние и погода тоже участвуют в маршруте.»"
      "uz": "Torysh Aqtau yoʻliga aniq geologik pauza beradi. Bu bitta tomosha nuqtasi emas, balki ochiq choʻl yuzasiga yoyilgan yumaloq shakllar maydoni.


        «Torysh Aqtauga tez qoʻshiladigan qoʻshimcha emas. Bu geologiya, masofa va ob-havo ham marshrutga taʼsir qiladigan Mangʻistov yoʻl toʻxtashidir.»"
