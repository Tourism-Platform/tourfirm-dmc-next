"excerpt":
  "en": "Ala-Archa is often the first place where travelers feel the Tian Shan after Bishkek. The road leaves the city for a river gorge, juniper slopes, and high ridges that can look close until the weather changes. It is easy to reach, but the park still asks for the right shoes, enough daylight, and a walk level chosen for the day."
  "ru": "Ала-Арча часто становится первым местом, где после Бишкека чувствуется Тянь-Шань. Дорога уводит город к речному ущелью, арчовым склонам и высоким гребням, которые кажутся близкими, пока не меняется погода. Доехать сюда легко, но парку всё равно нужны правильная обувь, достаточный световой день и прогулка, выбранная под условия."
  "uz": "Ala-Archa ko‘p sayohatchilar uchun Bishkekdan keyin Tyan-Shanni birinchi his qiladigan joydir. Yo‘l shaharni daryo darasi, archa yonbagʻirlari va ob-havo o‘zgarganda yaqinligi boshqacha seziladigan baland qirralarga olib chiqadi. Bu yerga yetib borish oson, lekin bogʻ baribir mos poyabzal, yetarli kunduzgi vaqt va kun sharoitiga mos yurishni so‘raydi."
