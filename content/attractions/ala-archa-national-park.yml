    "description":
      "en": "Ala-Archa matters because it changes the scale of a Bishkek stay quickly. A short road south brings river noise, juniper shade, steep stone, and the first real decision about how far into the mountains the route should go.


        «Ala-Archa feels close to Bishkek until the gorge reminds you that mountain weather, altitude, and trail choice deserve attention.»"
      "ru": "Ала-Арча важна потому, что быстро меняет масштаб поездки из Бишкека. Короткая дорога на юг выводит к шуму воды, арчовой тени, крутым камням и первому настоящему решению: насколько далеко идти в горы.


        «Ала-Арча кажется близкой к Бишкеку, пока ущелье не напоминает: горная погода, высота и выбор тропы требуют внимания.»"
      "uz": "Ala-Archa Bishkekdagi vaqt miqyosini tez o‘zgartirgani uchun muhim. Janubga qisqa yo‘l daryo shovqini, archa soyasi, tik toshlar va togʻ ichiga qanchalik kirish kerakligi haqidagi birinchi haqiqiy qarorga olib keladi.


        «Ala-Archa Bishkekka yaqin tuyuladi, toki dara togʻ ob-havosi, balandlik va yo‘l tanlovi eʼtibor talab qilishini eslatmaguncha.»"
