"title":
  "en": "Erk Kala"
  "ru": "Эрк-Кала"
  "uz": "Erk qal’a"
"subtitle":
  "en": "The early citadel mound of Ancient Merv"
  "ru": "Ранняя цитадель древнего Мерва"
  "uz": "Qadimiy Marv ichidagi ilk qo‘rg‘on tepaligi"
"excerpt":
  "en": "Erk Kala brings Ancient Merv back to form, height, and perimeter. The stop is not about a finished monument; it is about reading a fortified mound, its edges, and the way Merv grew through different city areas in the Murghab oasis. It works best when the route slows down for guide interpretation. From a distance, the mound may look modest; with context, it becomes one of the clearest ways to understand the older city."
  "ru": "Эрк-Кала возвращает взгляд к форме, высоте и периметру древнего Мерва. Эта остановка не про законченный монумент, а про укреплённый холм, его края и то, как Мерв рос через разные городские участки в оазисе Мургаба. Лучше всего Эрк-Кала работает там, где маршрут замедляется для объяснения гида. Издалека холм может показаться скромным, но с контекстом он становится одним из понятных ключей к раннему городу."
  "uz": "Erk qal’a qadimiy Marvni shakl, balandlik va perimetr orqali ko‘rsatadi. Bu to‘xtash tayyor monument haqida emas; u mustahkamlangan tepalik, uning chetlari va Marv Murg‘ob vohasida turli shahar hududlari orqali qanday o‘sganini tushunish haqida. Erk qal’a gid izohi uchun marom sekinlashganda yaxshiroq ochiladi. Uzoqdan tepalik kamtar ko‘rinishi mumkin; kontekst bilan esa u ilk shaharni tushunishning aniq nuqtalaridan biriga aylanadi."
