  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "Where the early city takes shape"
      "ru": "Где ранний город получает форму"
      "uz": "Ilk shahar shakl oladigan joy"
    "description":
      "en": "Erk Kala matters because it changes the rhythm of the Merv visit. Instead of looking for a dome or decorated wall, you read a raised form, a defensive outline, and the scale of an earlier city area.


        «Erk Kala is where Ancient Merv becomes form, perimeter, and time rather than only visible monuments.»"
      "ru": "Эрк-Кала важна тем, что меняет темп посещения Мерва. Здесь вы ищете не купол и не украшенную стену, а поднятую форму, оборонительный контур и масштаб более раннего городского участка.


        «На Эрк-Кале древний Мерв становится формой, периметром и временем, а не только видимыми памятниками.»"
      "uz": "Erk qal’a Marv tashrifi maromini o‘zgartirgani uchun muhim. Bu yerda gumbaz yoki bezakli devor emas, ko‘tarilgan shakl, mudofaa konturi va ilk shahar hududining ko‘lami o‘qiladi.


        «Erk qal’ada qadimiy Marv faqat ko‘rinadigan yodgorliklar emas, shakl, perimetr va vaqt sifatida ham seziladi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Ramparts, outline, and open Merv terrain"
      "ru": "Валы, контур и открытый рельеф Мерва"
      "uz": "Devorlar, kontur va ochiq Marv hududi"
    "description":
      "en": "The visual reading is quiet: look for the raised citadel form, the edge of the ramparts, and the open landscape that keeps Erk Kala tied to the whole oasis city."
      "ru": "Визуальное чтение здесь спокойное: ищите поднятую форму цитадели, край валов и открытый ландшафт, который связывает Эрк-Калу со всем городом оазиса."
      "uz": "Bu yerda ko‘rish sokin: ko‘tarilgan qo‘rg‘on shaklini, devor chetlarini va Erk qal’ani butun voha shahri bilan bog‘laydigan ochiq manzarani qidiring."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посещать"
      "uz": "Qanday ko‘rish"
    "title":
      "en": "Read the mound before moving on"
      "ru": "Сначала прочитайте холм, потом двигайтесь дальше"
      "uz": "Avval tepalikni o‘qing, keyin davom eting"
    "description":
      "en": "Erk Kala rewards a calm, guide-led pause. It is easy to miss if the route treats Merv as a list of monuments instead of a spread-out ancient city."
      "ru": "Эрк-Кала раскрывается в спокойной паузе с гидом. Её легко пропустить, если воспринимать Мерв как список памятников, а не как большой древний город."
      "uz": "Erk qal’a gid bilan sokin pauzada ochiladi. Agar Marv katta qadimiy shahar emas, balki yodgorliklar ro‘yxati sifatida ko‘rilsa, bu joyni o‘tkazib yuborish oson."
  - "blockType": "regular"
    "eyebrow":
