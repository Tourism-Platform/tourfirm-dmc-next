      "ru": "Держите остановку рядом с парком древнего Мерва, Султаном Санджаром и Кыз-Калой, чтобы холм читался как часть большого города оазиса."
      "uz": "To‘xtashni Qadimiy Marv UNESCO bog‘i, Sulton Sanjar va Qiz qal’a bilan bog‘lab turing; shunda tepalik keng voha shahri qismi sifatida o‘qiladi."
