  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place matters"
      "ru": "Почему это место важно"
      "uz": "Nima uchun bu joy"
    "title":
      "en": "Domes, shopfronts, and the walk between Bukhara's main places"
      "ru": "Купола, лавки и путь между главными местами"
      "uz": "Gumbazlar, rastalar va asosiy joylar orasidagi yo‘l"
    "description":
      "en": "The Trading Domes show Bukhara between the major monuments: brick vaults, shopfronts, textiles, copperwork, and everyday bargaining sit close together. The walk from Lyabi-Hauz toward Poi-Kalyan becomes part of the city itself, not a pause between sights.


        «Under the domes, Bukhara is not only a city of monuments; it is also a city of trade, craft, and lived-in streets.»"
      "ru": "Торговые купола показывают Бухару между большими памятниками: здесь рядом оказываются кирпичные своды, лавки, ткани, медная работа и обычный торг. Путь от Ляби-Хауза к Пои-Каляну становится не паузой между объектами, а частью самого города.


        «Под куполами Бухара видна не только как город памятников, но и как город торговли, ремесла и живых улиц.»"
      "uz": "Savdo gumbazlari Buxoroni katta yodgorliklar orasida ko‘rsatadi: bu yerda gʻisht ravoqlar, rastalar, matolar, mis buyumlar va odatiy savdolashuv yonma-yon turadi. Labi Hovuzdan Poyi Kalon tomonga yurish yodgorliklar orasidagi tanaffus emas, shaharning o‘ziga tegishli qismga aylanadi.


        «Gumbazlar ostida Buxoro faqat yodgorliklar shahri emas; u savdo, hunarmandchilik va tirik ko‘chalar shahri hamdir.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you will see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Brick vaults, shopfronts, and craft details"
      "ru": "Кирпичные своды, лавки и ремесленные детали"
      "uz": "Gʻisht ravoqlar, rastalar va hunarmandchilik detallari"
    "description":
      "en": "Move through the Trading Domes as a sequence: one vaulted crossing after another, shopfronts along the sides, and craft details that keep the old route active."
      "ru": "Торговые купола лучше проходить как последовательность: один сводчатый проход за другим, лавки по сторонам и ремесленные детали, которые удерживают старый маршрут живым."
      "uz": "Savdo gumbazlaridan ketma-ket o‘tish qulay: bir ravoqli yo‘lakdan keyingisiga, yon tomondagi rastalar va eski yo‘lni tirik tutadigan hunarmandchilik detallari bilan."
  - "blockType": "regular"
    "eyebrow":
      "en": "How the visit feels"
      "ru": "Как ощущается визит"
      "uz": "Tashrif qanday seziladi"
    "title":
      "en": "How to move through the Trading Domes without rushing"
      "ru": "Как пройти Торговые купола без спешки"
      "uz": "Savdo gumbazlaridan shoshilmasdan o‘tish"
    "description":
      "en": "This stop does not need to become a quick souvenir run. Walk under the vaults slowly, look at the shopfronts and craft details, ask before taking photos, then continue toward Magoki-Attori, Lyabi-Hauz, or Poi-Kalyan."
      "ru": "Здесь не нужно превращать остановку в быстрый рынок сувениров. Лучше пройти под сводами спокойно: посмотреть на лавки, ремесленные детали, спросить перед фото и затем продолжить к Магоки-Аттори, Ляби-Хаузу или Пои-Каляну."
      "uz": "Bu bekatni tez suvenir xaridiga aylantirish shart emas. Ravoqlar ostidan sokin o‘ting, rastalar va hunarmandchilik detallariga qarang, suratdan oldin ruxsat so‘rang va keyin Magʻoki Attori, Labi Hovuz yoki Poyi Kalon tomonga davom eting."
  - "blockType": "regular"
    "eyebrow":
      "en": "What to add nearby"
      "ru": "Что добавить рядом"
      "uz": "Yaqinda nima qo‘shish mumkin"
    "title":
      "en": "Poi-Kalyan, Magoki-Attori, Lyabi-Hauz, and Chor Minor"
      "ru": "Пои-Калян, Магоки-Аттори, Ляби-Хауз и Чор-Минор"
      "uz": "Poyi Kalon, Magʻoki Attori, Labi Hovuz va Chor Minor"
    "description":
      "en": "Poi-Kalyan is the main architectural continuation; Magoki-Attori sits close to the bazaar passages; Lyabi-Hauz gives a water-side pause; Chor Minor takes the day into quieter old-city streets."
      "ru": "Пои-Калян становится главным архитектурным продолжением; Магоки-Аттори стоит рядом с базарными проходами; Ляби-Хауз даёт паузу у воды; Чор-Минор уводит день в более тихие улицы старой Бухары."
      "uz": "Poyi Kalon asosiy meʼmoriy davom bo‘ladi; Magʻoki Attori bozor yo‘laklariga yaqin turadi; Labi Hovuz suv yonidagi pauzani beradi; Chor Minor esa kunni eski shaharning sokinroq ko‘chalariga olib kiradi."
