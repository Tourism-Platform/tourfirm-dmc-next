    "uz": "Qilichboy madrasasi Qarshidagi eski madrasalar guruhini sokinroq miqyosda ko‘rsatadi. Uning 1914 yilgi g‘isht devorlari, sobiq o‘quv xonalari, hovlisi va suv yo‘li shaharning kattaroq masjid, suv inshooti va ko‘prik bekatlari orasida yaqindan kuzatishga arziydi."
