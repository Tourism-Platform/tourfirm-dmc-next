      "ru": "Здесь маршрут по Термезу переходит от открытой археологии к двору с мавзолеями, айванами и надгробиями. Комплекс добавляет южной истории исламский и семейно-мемориальный контекст, не отделяя его от археологии Термеза."
      "uz": "Bu yerda Termiz yo‘nalishi ochiq arxeologiyadan maqbaralar, ayvonlar va qabr toshlari bor hovliga o‘tadi. Majmua janubiy hikoyaga islomiy va oilaviy xotira kontekstini qo‘shadi, lekin uni Termiz arxeologiyasidan ajratmaydi."
