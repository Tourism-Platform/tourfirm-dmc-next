      "ru": "Парк не сводится к фотографии. Он превращает официальные символы Ашхабада в физический маршрут — сначала фонтаны и статуи, затем высокая колонна, форма юрты и музейный контекст, если доступ открыт.


        «Сначала важна дистанция; фонтаны и символы задают масштаб, а затем музейная деталь или ковровое ремесло добавляют человеческий размер.»"
      "uz": "Park faqat surat nuqtasi emas. U Ashgabatning rasmiy ramzlarini jismoniy yoʻnalishga aylantiradi; avval favvoralar va haykallar, keyin baland ustun, o‘tov shakli va kirish ochiq bo‘lsa muzey konteksti.


        «Avval masofa muhim; favvoralar va ramzlar miqyosni beradi, keyin muzey detali yoki gilam hunari insoniy o‘lcham qo‘shadi.»"
