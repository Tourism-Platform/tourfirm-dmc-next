"excerpt":
  "en": "Independence Monument and Park makes Ashgabat's civic scale physical: a broad park approach, fountains and statues, and a 118-meter column crowned with a gilded crescent and five stars. The lower form recalls a Turkmen yurt; if the Museum of Independence is open, the stop can move from exterior symbolism into political and historical context before the route continues to nearby museums, carpet craft, or Nisa."
  "ru": "Монумент Независимости и парк делают масштаб Ашхабада физически ощутимым: широкий подход через парк, фонтаны и статуи, 118-метровая колонна с позолоченным полумесяцем и пятью звёздами. Нижняя форма монумента отсылает к туркменской юрте; если Музей Независимости открыт, остановка переходит от внешней символики к политическому и историческому контексту перед музеями рядом, ковровым ремеслом или дорогой к Нисе."
  "uz": "Mustaqillik monumenti va parki Ashgabat miqyosini jismonan sezdiradi: park bo‘ylab keng yaqinlashuv, favvoralar va haykallar, ustida zarhal yarim oy va besh yulduz turgan 118 metrlik ustun. Pastki shakl turkman o‘tovini eslatadi; Mustaqillik muzeyi ochiq bo‘lsa, tashqi ramzlar siyosiy va tarixiy kontekstga o‘tadi, keyin yoʻnalish yaqin muzeylar, gilam hunari yoki Nisa tomonga davom etadi."
