"excerpt":
  "en": "On Istaravshan's western side, Kok Gumbaz announces itself first by color: a light-blue dome above square brick and majolica. Closer in, the portal, painted walls, molded mihrab, and large hall turn the stop from a skyline marker into a mosque-madrasa with study and prayer memory. Local stories link it to Abdulatif Sultan, Ulugbek's son, and students were still being trained here at the end of the 19th century."
  "ru": "На западной стороне Истаравшана Кок-Гумбаз сначала запоминается цветом: светло-голубой купол поднимается над квадратным кирпичом и майоликой. Ближе видны портал, росписи, лепной михраб и большой зал, поэтому памятник перестаёт быть только силуэтом и становится мечетью-медресе с памятью учёбы и молитвы. Местные предания связывают его с Абдулатифом Султаном, сыном Улугбека, а в конце XIX века здесь ещё обучались студенты."
  "uz": "Istaravshanning gʻarbiy tomonida Koʻk Gumbaz avvalo rangi bilan esda qoladi: kvadrat gʻisht va majolika ustida havorang gumbaz koʻtariladi. Yaqinroq borganda peshtoq, devoriy bezaklar, bezatilgan mehrob va katta zal koʻrinadi; shunda yodgorlik faqat uzoqdan koʻrinadigan siluet emas, ilm va ibodat xotirasiga ega masjid-madrasa sifatida ochiladi. Mahalliy rivoyatlar uni Ulugʻbekning oʻgʻli Abdulatif Sulton bilan bogʻlaydi, XIX asr oxirida esa bu yerda talabalar hali ham taʼlim olgan."
