      "en": "After Mug Teppe's hill and before the town's other streets and monuments, Kok Gumbaz gives Istaravshan one clear architectural stop to slow around.


        «From a distance Kok Gumbaz is a blue dome; close up, it becomes Istaravshan's lesson in brick, tile, and quiet study memory.»"
      "ru": "После холма Муг-Теппе и перед другими улицами и памятниками города Кок-Гумбаз даёт маршруту одну ясную архитектурную остановку.


        «Издалека Кок-Гумбаз выглядит как голубой купол; вблизи он становится уроком Истаравшана в кирпиче, майолике и тихой памяти учёбы.»"
      "uz": "Mug Teppe tepaligidan keyin va shaharning boshqa koʻcha hamda yodgorliklaridan oldin Koʻk Gumbaz Istaravshan yoʻnalishiga aniq meʼmoriy toʻxtash beradi.


        «Uzoqdan Koʻk Gumbaz havorang gumbazdek koʻrinadi; yaqinda esa Istaravshanning gʻisht, koshin va sokin ilm xotirasi haqidagi darsiga aylanadi.»"
