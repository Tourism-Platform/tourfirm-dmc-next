  "uz": "Hudud faqat koʻrinish nuqtasi emas. Bu yerda Mangistau yoʻli oq tosh, kesilgan chetlar, och rangli chuqurliklar va guruhni sekinlashtiradigan sukunatga ochiladi. Yoʻl mahalliy tekshirilgan, sayohatchida esa orqaga chekinib, miqyosni anglash va zaminni izsiz qoldirish uchun vaqt boʻlganda tashrif eng kuchli boʻladi."
