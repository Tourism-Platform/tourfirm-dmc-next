    "description":
      "en": "Bozzhyra's power is visual but not simple. The same tract can feel like a panorama, a chalk amphitheater, a pair of fang-like towers, or a fragile floor underfoot depending on where the route stops.


        «The tract is strongest when the road gives the cliffs enough quiet to become larger than the photograph.»"
      "ru": "Сила Бозжыры зрительная, но не простая. Одно и то же урочище может ощущаться как панорама, меловой амфитеатр, пара зубчатых башен или хрупкая поверхность под ногами - в зависимости от того, где остановится маршрут.


        «Урочище сильнее, когда дорога дает скалам достаточно тишины, чтобы они стали больше фотографии.»"
      "uz": "Bozzhiraning kuchi koʻrinishda, lekin u sodda emas. Yoʻnalish qayerda toʻxtashiga qarab bir hudud panorama, boʻr amfiteatri, tishsimon minoralar yoki oyoq ostidagi nozik zamin kabi seziladi.


        «Hudud yoʻl qoyalarga suratdan kattaroq boʻlish uchun yetarli sukunat berganda eng kuchli ochiladi.»"
