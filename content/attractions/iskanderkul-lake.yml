    "description":
      "en": "The lake matters because it turns a mountain transfer into a visible destination. Before the route continues toward Penjikent, Dushanbe, Seven Lakes, or higher Fann choices, Iskanderkul gives travelers one calm frame of water and peaks.


        «Iskanderkul Lake does not need a crowded plan; the water and slopes are the reason to slow down.»"
      "ru": "Озеро важно потому, что превращает горный переезд в видимое место. Прежде чем маршрут продолжится к Пенджикенту, Душанбе, Семи озёрам или более высоким точкам Фанских гор, Искандеркуль даёт спокойный кадр воды и пиков.


        «Озеру Искандеркуль не нужен перегруженный план; вода и склоны сами объясняют, зачем замедлиться.»"
      "uz": "Koʻl togʻ yoʻlini koʻrinadigan manzilga aylantirgani uchun muhim. Yoʻnalish Panjikent, Dushanbe, Yetti koʻl yoki balandroq Fan tanlovlariga davom etishidan oldin Iskandarkoʻl suv va choʻqqilarni bir sokin manzarada beradi.


        «Iskandarkoʻlga tigʻiz reja kerak emas; suv va yonbagʻirlar sekinlashish sababini oʻzi ko‘rsatadi.»"
