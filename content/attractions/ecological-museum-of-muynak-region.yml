      "ru": "Кладбище кораблей показывает бывший порт снаружи. Музеи Нукуса могут добавить искусство, археологию и каракалпакский культурный материал до или после дороги в Муйнак."
      "uz": "Kemalar qabristoni sobiq portni ochiq maydonda ko‘rsatadi. Nukus muzeylari esa Mo‘ynoqqa borishdan oldin yoki keyin sanʼat, arxeologiya va qoraqalpoq madaniy materialini qo‘shishi mumkin."
