  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nima uchun bu joy"
    "title":
      "en": "Where Moynaq becomes more than a symbol"
      "ru": "Где Муйнак становится больше, чем символом"
      "uz": "Mo‘ynoq faqat ramz emasligi ko‘rinadigan joy"
    "description":
      "en": "The museum matters because it keeps Moynaq from becoming only an image of ships on the dry seabed. Its rooms show the former port through photographs, fishing work, household life, clothing, and paintings of the Aral Sea before and during its change."
      "ru": "Музей важен потому, что не даёт Муйнаку остаться только образом кораблей на сухом дне. В залах бывший порт виден через фотографии, рыбацкую работу, быт, одежду и живопись об Арале до и во время его изменений."
      "uz": "Muzey Mo‘ynoqni faqat quruq dengiz tubidagi kemalar tasviri bo‘lib qolishdan saqlaydi. Xonalarda sobiq port fotosuratlar, baliqchilik mehnati, maishiy hayot, kiyim va Orol o‘zgarishidan oldingi hamda keyingi rasmlar orqali ko‘rinadi."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Photographs, fishing tools, and Aral Sea paintings"
      "ru": "Фотографии, рыбацкий инвентарь и живопись об Арале"
      "uz": "Fotosuratlar, baliqchilik jihozlari va Orol rasmlari"
    "description":
      "en": "Expect a compact museum story: archive images, display cases, boats, nets, household objects, Karakalpak clothing, and paintings of the water that once reached the town."
      "ru": "Экспозиция компактная: архивные кадры, витрины, лодки, сети, бытовые предметы, каракалпакская одежда и картины с водой, которая когда-то доходила до города."
      "uz": "Ekspozitsiya ixcham: arxiv tasvirlari, vitrinalar, qayiqlar, to‘rlar, maishiy buyumlar, qoraqalpoq liboslari va bir paytlar shahargacha yetib kelgan suv tasvirlangan rasmlar."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как проходит визит"
      "uz": "Tashrif qanday kechadi"
    "title":
      "en": "A compact museum with important detail"
      "ru": "Небольшой музей с важными деталями"
      "uz": "Muhim detallarga ega kichik muzey"
    "description":
      "en": "Treat it as part of the Moynaq story, not just a quick indoor break. Photographs, labels, object cases, and the link to the ship graveyard make the former port easier to read."
      "ru": "Смотрите его как часть истории Муйнака, а не как короткую остановку в помещении. Фотографии, подписи, витрины и связь с кладбищем кораблей помогают лучше понять бывший порт."
      "uz": "Uni shunchaki yopiq joydagi qisqa tanaffus emas, Mo‘ynoq hikoyasining bir qismi sifatida ko‘ring. Fotosuratlar, yozuvlar, vitrinalar va kemalar qabristoni bilan bog‘lanish sobiq portni yaxshiroq tushunishga yordam beradi."
