  "uz": "Dungan masjidi Qorakoʻlning eng aniq shahar belgilaridan biri: boʻyalgan yogʻoch bezaklar, kamtar hovli va markazga yaqin diniy muhit. Muqaddas Uchlik sobori va sekinroq shahar sayri yonida u Qorakoʻlda jamoalar, ibodat, ovqat va togʻ yoʻllari qanday yonma-yon turishini koʻrsatadi."
