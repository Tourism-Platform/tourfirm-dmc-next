  "en": "Dungan Mosque is one of Karakol's clearest city landmarks: painted wooden detail, a modest courtyard, and a religious setting near the town center. It belongs beside Holy Trinity Cathedral and a slower Karakol walk, showing how communities, worship, food, and mountain roads meet in the town."
