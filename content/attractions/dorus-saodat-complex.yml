    "description":
      "en": "Dorus-Saodat matters because it adds the family side to Amir Timur's story in Shakhrisabz. Sources describe a large 14th-century memorial complex; only parts remain, but Jahangir's mausoleum, the mosque setting, and archaeological traces keep the story grounded."
      "ru": "Дорус-Саодат важен потому, что добавляет к Шахрисабзу семейную сторону истории Амира Темура. Источники описывают большой мемориальный комплекс XIV века; сохранились не все части, но мавзолей Джахангира, мечеть и археологические следы делают историю конкретной."
      "uz": "Dorus-Saodat muhim, chunki u Amir Temurning Shahrisabziga oilaviy hikoyani qo‘shadi. Manbalar XIV asrdagi katta memorial majmuani tasvirlaydi; hamma qismi saqlanmagan, ammo Jahongir maqbarasi, masjid muhiti va arxeologik izlar hikoyani aniq qiladi."
