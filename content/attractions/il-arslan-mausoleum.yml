  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "A compact tomb that brings old Urgench closer"
      "ru": "Компактная усыпальница, которая приближает старый Ургенч"
      "uz": "Eski Urganchni yaqinroq ko‘rsatadigan ixcham maqbara"
    "description":
      "en": "The mausoleum matters because it changes the scale of the visit. Kunya-Urgench often reads as open distance and tall silhouettes; Il Arslan pulls the eye back to brick geometry, terracotta detail, and a roof form tied to the city's pre-Mongol memory.


        «Il Arslan keeps old Urgench from becoming only distance and silhouette: brick, roof, and close detail matter here.»"
      "ru": "Мавзолей важен тем, что меняет масштаб визита. Куня-Ургенч часто воспринимается как открытое пространство и дальние силуэты; Иль-Арслан возвращает взгляд к кирпичной геометрии, терракотовой детали и форме кровли, связанной с домонгольской памятью города.


        «Иль-Арслан — тихая остановка, но именно она не даёт старому Ургенчу стать только расстоянием и силуэтом: здесь важны кирпич, кровля и близкая деталь.»"
      "uz": "Maqbara tashrif ko‘lamini o‘zgartirgani uchun muhim. Ko‘hna Urganch ko‘pincha keng manzara va uzoq siluetlar sifatida qabul qilinadi; Il Arslon nigohni g‘isht geometriyasi, terrakota detali va qadimgi shahar xotirasiga tegishli tom shakliga qaytaradi.


        «Il Arslon sokin to‘xtash, ammo u eski Urganchni faqat masofa va siluetga aylantirmaydi: bu yerda g‘isht, tom va yaqin detal muhim.»"
