"excerpt":
  "en": "Il Arslan Mausoleum slows the Kunya-Urgench visit to a closer scale. Instead of the height of Kutlug Timur Minaret or the sweep of the UNESCO landscape, this stop asks you to look at a compact brick body, a conical roof, and the detail held by a smaller tomb. It fits naturally near Sultan Tekesh, where royal memory and open ground already shift the route into a calmer rhythm."
  "ru": "Мавзолей Иль-Арслана переводит визит по Куня-Ургенчу в более камерный масштаб. Это не высота минарета Кутлуг-Тимура и не широкий ландшафт ЮНЕСКО; здесь важно рассмотреть компактный кирпичный объём, коническую кровлю и деталь небольшого мавзолея. Он естественно встаёт рядом с Султаном Текешем: в этой части старого Ургенча царская память, открытое пространство и близкая архитектурная деталь задают спокойный темп."
  "uz": "Il Arslon maqbarasi Ko‘hna Urganch tashrifini yaqinroq ko‘lamga olib keladi. Bu Qutlug‘ Temur minorasining balandligi ham, keng UNESCO manzarasi ham emas; bu yerda ixcham g‘ishtli shakl, konussimon tom va kichik maqbaradagi detalga qaraysiz. U Sulton Tekesh yonida tabiiy ko‘rinadi: eski Urganchning bu qismida hukmdor xotirasi, ochiq hudud va yaqin meʼmoriy detal sokinroq surʼat beradi."
