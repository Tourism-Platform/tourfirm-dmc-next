    "description":
      "en": "New Nisa matters because it keeps the UNESCO visit from becoming only Old Nisa. The visible remains are restrained, but they help show the Parthian city as a settled landscape, not only a fortified centre.


        «New Nisa is quieter than Old Nisa, but it gives the Nisa visit its wider setting: the city around the fortress, not only the walls themselves.»"
      "ru": "Новая Ниса важна потому, что не даёт объекту ЮНЕСКО превратиться только в Старую Нису. Видимые остатки сдержанные, но они помогают увидеть парфянский город как заселённый ландшафт, а не только как укреплённый центр.


        «Новая Ниса тише Старой Нисы, но даёт выезду к Нисе более широкую среду: город вокруг крепости, а не только сами стены.»"
      "uz": "Yangi Nisa muhim, chunki u YUNESKO tashrifini faqat Eski Nisaga aylantirib qoʻymaydi. Ko‘rinadigan qoldiqlar sokin, ammo ular Parfiya shahrini faqat qalʼa markazi emas, yashagan manzara sifatida ko‘rsatadi.


        «Yangi Nisa Eski Nisadan sokinroq, lekin Nisa tashrifiga kengroq muhit beradi: qalʼa atrofidagi shahar, faqat devorlarning oʻzi emas.»"
