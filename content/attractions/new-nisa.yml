"excerpt":
  "en": "New Nisa is the quieter companion to Old Nisa inside the UNESCO-listed Parthian Fortresses of Nisa. Old Nisa gives the visit its fortress image; New Nisa widens the view toward settlement ground, open distance, and the Kopet-Dag edge. Come expecting a contextual archaeological stop, not a monument skyline. With a guide and current access checks, New Nisa helps the whole Nisa landscape feel less like one ruin and more like a former city."
  "ru": "Новая Ниса — более тихая пара Старой Нисы внутри объекта ЮНЕСКО «Парфянские крепости Нисы». Старая Ниса даёт визиту крепостной образ; Новая Ниса расширяет взгляд к поселению, открытому пространству и краю Копетдага. Сюда стоит ехать не за силуэтом монумента, а за археологическим объяснением. С гидом и актуальной проверкой доступа Новая Ниса помогает увидеть весь ландшафт Нисы не как одну руину, а как бывший город."
  "uz": "Yangi Nisa YUNESKO roʻyxatidagi Parfiya qalʼalari ichida Eski Nisa bilan sokinroq juftlik hosil qiladi. Eski Nisa tashrifga qalʼa obrazini beradi; Yangi Nisa esa manzilgoh hududi, ochiq masofa va Kopetdogʻ etaklari tomon qarashni kengaytiradi. Bu yerga ulkan monument siluetini emas, arxeologik izohni kutib keling. Gid va amaldagi kirish tekshiruvi bilan Yangi Nisa butun Nisa manzarasini bitta xaroba emas, sobiq shahar sifatida ko‘rishga yordam beradi."
