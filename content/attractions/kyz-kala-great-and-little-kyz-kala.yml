    "description":
      "en": "In a vast archaeological landscape, Kyz Kala gives the eye something immediate to hold. The walls turn Ancient Merv from distant ruins into a place you remember by silhouette.


        «At Kyz Kala, Ancient Merv becomes a line of ribbed earth against the sky.»"
      "ru": "В большом археологическом ландшафте Кыз-Кала сразу даёт глазу ясный ориентир. Стены превращают Мерв из набора дальних руин в место, которое запоминается силуэтом.


        «На Кыз-Кале древний Мерв запоминается линией ребристой земли на фоне неба.»"
      "uz": "Keng arxeologik manzarada Qiz qal’a ko‘z uchun darrov aniq belgi beradi. Devorlar Marvni uzoq xarobalar ro‘yxati emas, siluet orqali esda qoladigan joyga aylantiradi.


        «Qiz qal’ada qadimiy Marv osmon qarshisidagi taram-taram tuproq chizig‘i bo‘lib esda qoladi.»"
