"excerpt":
  "en": "Obi-Rakhmat takes the Chimgan mountain route into a much older time scale. Near the Paltau and Charvak side of the western Tien Shan, a modest cave entrance leads into a record of Paleolithic strata, stone tools, and rare human evidence. Treat it as a quiet archaeology stop: ask locally before travel, follow site rules, and let the grotto be the reason for the detour."
  "ru": "Оби-Рахмат добавляет горному маршруту Чимгана совсем другой масштаб времени. На стороне Пальтау и Чарвака от Западного Тянь-Шаня скромный вход в грот ведёт к истории палеолитических слоёв, каменных орудий и редких свидетельств древнего человека. Относитесь к месту как к тихой археологической остановке: уточняйте условия до поездки, соблюдайте правила и включайте грот только тогда, когда археология — причина этого отклонения от маршрута."
  "uz": "Obirahmat Chimyon tog‘ yo‘nalishini ancha qadimiy vaqt ko‘lamiga olib kiradi. G‘arbiy Tyanshanning Paltov va Chorvoq tomonida kamtar g‘or kirishi paleolit qatlamlari, tosh qurollar va qadimgi inson izlari haqidagi tarixga ulanadi. Uni sokin arxeologik tashrif sifatida ko‘ring: safardan oldin joyida so‘rang, qoidalarga amal qiling va g‘orni faqat arxeologiya burilishning asosiy sababi bo‘lsa qo‘shing."
