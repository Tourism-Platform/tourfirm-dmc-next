    "description":
      "en": "Expect a modest cave-area stop, Paltau-side mountain surroundings, and an archaeological story that matters more than a scenic checklist."
      "ru": "Ожидайте скромный район грота, горную среду со стороны Пальтау и археологическую историю, которая важнее списка красивых видов."
      "uz": "Kamtar g‘or hududi, Paltov tomondagi tog‘ muhiti va chiroyli manzaralar ro‘yxatidan muhimroq arxeologik hikoyani kuting."
  - "blockType": "regular"
    "eyebrow":
