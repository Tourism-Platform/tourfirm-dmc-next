    "description":
      "en": "Obi-Rakhmat needs more care than an ordinary viewpoint. Before adding it to a route, the important questions are whether a visit is allowed, who can explain the site, and how the group will behave around a sensitive archaeological place."
      "ru": "Оби-Рахмат требует больше аккуратности, чем обычная обзорная точка. До включения в маршрут важно понять, разрешён ли визит, кто объяснит место и как группа будет вести себя рядом с деликатным археологическим объектом."
      "uz": "Obirahmat oddiy manzara nuqtasidan ko‘ra ko‘proq e’tibor talab qiladi. Uni yo‘nalishga qo‘shishdan oldin tashrifga ruxsat bormi, joyni kim tushuntiradi va guruh nozik arxeologik obyekt yonida qanday tutadi — shular muhim."
