      "en": "Where a mountain route meets deep human time"
      "ru": "Где горный маршрут встречает глубокое время человека"
      "uz": "Tog‘ yo‘li qadimiy inson vaqti bilan tutashadigan joy"
    "description":
      "en": "Chimgan is usually understood through ridges, reservoir water, resort roads, and canyon walks. Obi-Rakhmat changes the scale. A small limestone grotto turns the western Tien Shan from scenery into evidence of a much older human presence, so the visit should feel quiet, guided, and deliberate.


        «Obi-Rakhmat is strongest when the route slows enough for archaeology to be the point.»"
      "ru": "Чимган обычно раскрывается через хребты, воду водохранилища, курортные дороги и каньонные прогулки. Оби-Рахмат меняет масштаб. Небольшой известняковый грот превращает Западный Тянь-Шань из пейзажа в свидетельство гораздо более древнего человеческого присутствия, поэтому визит должен быть спокойным, с гидом и без суеты.


        «Оби-Рахмат сильнее всего тогда, когда маршрут замедляется настолько, чтобы археология стала главным смыслом.»"
      "uz": "Chimyon odatda tizmalar, suv ombori, kurort yo‘llari va kanyon yurishlari orqali tushuniladi. Obirahmat ko‘lamni o‘zgartiradi. Kichik ohaktosh g‘or G‘arbiy Tyanshanni shunchaki manzara emas, ancha qadimiy inson mavjudligining dalili sifatida ko‘rsatadi; shuning uchun tashrif sokin, gid bilan va bosiq bo‘lishi kerak.


        «Obirahmat yo‘l arxeologiya asosiy ma’noga aylanishi uchun yetarlicha sekinlashganda eng kuchli.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Cave entrance, limestone, and mountain route"
      "ru": "Вход в грот, известняк и горный маршрут"
