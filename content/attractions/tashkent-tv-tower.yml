    "description":
      "en": "You see the tower first as scale, then as atmosphere: its height over northern Tashkent, lit decks at blue hour, and the road-and-water setting that makes the capital feel wide."
      "ru": "Сначала здесь виден масштаб, затем атмосфера: башня над северным Ташкентом, подсвеченные площадки в синий час и дороги с водой вокруг, из-за которых столица кажется шире."
      "uz": "Bu yerda avval ko‘lam, keyin muhit seziladi: shimoliy Toshkent uzra minora, ko‘k soatda yoritilgan maydonchalar, atrofdagi yo‘l va suv chiziqlari poytaxtni kengroq ko‘rsatadi."
