    "title":
      "en": "A working tower that changes the scale of Tashkent"
      "ru": "Действующая башня, которая меняет масштаб Ташкента"
      "uz": "Toshkent ko‘lamini o‘zgartiradigan amaldagi minora"
    "description":
      "en": "Most Tashkent routes begin at street level: metro halls, markets, squares, museums, and broad Soviet-era avenues. The TV Tower changes the angle. From above, the city gathers into districts, roads, canals, green pockets, and a flat northern horizon, while the tower itself remains part of the capital's broadcasting infrastructure.


        «From above, Tashkent stops feeling like separate stops and begins to read as one working capital.»"
      "ru": "Большинство маршрутов по Ташкенту начинаются на уровне улицы: залы метро, базары, площади, музеи и широкие проспекты советского периода. Телебашня меняет угол зрения. Сверху город собирается в районы, дороги, каналы, зелёные зоны и ровный северный горизонт, а сама башня остаётся частью вещательной инфраструктуры столицы.


        «С высоты Ташкент перестаёт ощущаться набором отдельных остановок и начинает выглядеть как единая столица.»"
      "uz": "Toshkent odatda ko‘cha darajasida ochiladi: metro zallari, Chorsu shovqini, muzeylar, keng prospektlar va soyali xiyobonlar orqali. Teleminora bu tanish shaharga boshqa o‘lcham beradi. Yuqoridan yo‘llar, kanallar, turar joy mavzelari, bog‘lar va shimoliy gorizont bir tizimga yig‘iladi; minoraning o‘zi esa faol infratuzilma bo‘lgani uchun tashrif tartibi uning ma’nosining bir qismidir.


        «Yuqoridan Toshkent alohida to‘xtamlar yig‘indisi emas, bitta ishlayotgan poytaxt sifatida o‘qila boshlaydi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
