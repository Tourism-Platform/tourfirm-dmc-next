      "uz": "Muzey Termizni xarobalarga chiqishdan oldin tushunishga yordam beradi. Haykal bo‘lagi, sopol idish, tosh hovuz yoki maydonlar xaritasi janubdagi joylarni ularning odamlari, materiali va tarixiy yo‘llari bilan bog‘laydi."
