        «Между базаром, священным комплексом и крепостью парк показывает Худжанд с более мягкой стороны.»"
      "uz": "Memorial bogʻ Xoʻjand markaziga boshqa ohang beradi. Bozor shovqini, muqaddas hovlilar va qalʼa devorlari yurishning birinchi tayanchlarini ko‘rsatadi; Kamoli Xujandiy esa shu yoʻlga shoir nomini qoʻshadi.


        «Bozor, muqaddas majmua va qalʼa orasida bogʻ Xoʻjandning yumshoqroq tomonini koʻrsatadi.»"
