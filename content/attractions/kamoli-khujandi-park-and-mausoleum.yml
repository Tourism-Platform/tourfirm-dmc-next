      "en": "The memorial park adds a different register to Khujand's center. Market noise, sacred courtyards, and fortress walls give the first city anchors; Kamoli Khujandi adds a human literary name inside the same walk.


        «Between the bazaar, the sacred complex, and the fortress, the park gives Khujand a softer register.»"
