      "uz": "Bog‘ni uch oddiy manzara orqali o‘qing: asosiy kirish, gulzorlar va ekilgan kompozitsiyalar, keyin mahalliy odamlar bog‘dan qanday foydalanishini ko‘rsatadigan attraksionlar hamda oilaviy hududlar."
