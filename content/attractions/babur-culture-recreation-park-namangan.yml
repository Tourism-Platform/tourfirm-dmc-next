    "description":
      "en": "Babur Park is not a monument that asks for a long historical explanation. Its value is immediate: flowers, shade, family leisure, and festival memory gather in one public place, so travelers can feel why Namangan is known as a city of flowers.


        «Babur Park gives Namangan its first color: not as a slogan, but as flowers, shade, rides, and city life around you.»"
      "ru": "Парк Бабура не требует длинного исторического объяснения. Его ценность видна сразу: цветы, тень, семейный отдых и фестивальная память сходятся в одном общественном месте, где путешественник понимает, почему Наманган называют городом цветов.


        «Парк Бабура даёт Намангану первый цвет: не как лозунг, а как клумбы, тень, аттракционы и городская жизнь вокруг вас.»"
      "uz": "Bobur bog‘i uzun tarixiy izoh talab qiladigan yodgorlik emas. Uning qiymati darhol ko‘rinadi: gullar, soya, oilaviy hordiq va festival xotirasi bitta jamoat joyida jamlanadi, sayohatchi esa Namangan nega gullar shahri deb atalishini shu yerda tushunadi.


        «Bobur bog‘i Namanganga birinchi rangni beradi: shior sifatida emas, atrofingizdagi gulzor, soya, attraksion va shahar hayoti sifatida.»"
  - "blockType": "regular"
