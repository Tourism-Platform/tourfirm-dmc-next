"excerpt":
  "en": "In Babur Park, Namangan's flower-city idea becomes visible at walking pace: planted beds, shaded paths, families under trees, and rides that give the stop an ordinary city rhythm. During Flower Festival season, the same setting can become brighter and busier; outside those dates, it remains a gentle green pause before Mullah-Kyrgyz, Akhsikent, Chust, Andijan, or the road back through the Valley."
  "ru": "В парке Бабура репутация Намангана как города цветов становится видимой в прогулочном темпе: клумбы, тенистые дорожки, семьи под деревьями и аттракционы с обычным городским ритмом. В сезон Фестиваля цветов это пространство может быть ярче и люднее; в другие даты оно остаётся мягкой зелёной паузой перед медресе Мулла-Киргиз, Ахсикентом, Чустом, Андижаном или обратной дорогой по долине."
  "uz": "Bobur bog‘ida Namanganning gullar shahri degan obro‘si sekin sayrda ko‘rinadi: gulzorlar, soyali yo‘laklar, daraxtlar ostidagi oilalar va oddiy shahar ritmini beradigan attraksionlar. Gullar festivali mavsumida bu joy yorqinroq va gavjumroq bo‘lishi mumkin; boshqa paytlarda esa u Mulla Qirg‘iz, Axsikent, Chust, Andijon yoki vodiy bo‘ylab qaytish yo‘lidan oldingi sokin yashil to‘xtam bo‘lib qoladi."
