    "title":
      "en": "A small shrine that slows the mountain route"
      "ru": "Небольшая святыня, которая замедляет горный маршрут"
      "uz": "Togʻ tomonidagi kichik ziyoratgoh"
    "description":
      "en": "This is not the largest sight in Osh, and it should not be made to feel larger than it is. Its value is quieter: a remembered legend, a prayer-room space, and a modest building beside the city's sacred mountain.


        «The mausoleum asks for attention at a smaller scale: legend, prayer space, brickwork, and the sacred mountain held together in one modest stop.»"
      "ru": "Это не самая крупная достопримечательность Оша, и её не нужно искусственно увеличивать. Ценность здесь тише: памятная легенда, молитвенное помещение и скромное здание рядом со священной горой города.


        «Мавзолей просит внимания в меньшем масштабе: легенда, молитвенное пространство, кирпичная кладка и священная гора держатся вместе в одной скромной остановке.»"
      "uz": "Bu Oʻshdagi eng katta diqqatga sazovor joy emas, uni sunʼiy ravishda kattalashtirish ham kerak emas. Qimmati boshqa joyda: eslab kelinadigan rivoyat, ibodat xonasi va shaharning muqaddas togʻi yonidagi kamtar bino.


        «Maqbara kichikroq miqyosdagi eʼtiborni soʻraydi: rivoyat, ibodat joyi, gʻisht terimi va muqaddas togʻ bir kamtar bekatda jamlanadi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Domes, brickwork, and sacred mountain context"
      "ru": "Купола, кирпичную кладку и контекст священной горы"
      "uz": "Gumbazlar, gʻisht terimi va muqaddas togʻ konteksti"
    "description":
      "en": "Expect a compact place rather than a showpiece. The details are small: domed rooms, restrained brickwork, prayer space, and the mausoleum's position beside Sulaiman-Too."
      "ru": "Ожидайте компактное место, а не эффектный объект напоказ. Детали здесь небольшие: купольные помещения, сдержанная кладка, молитвенное пространство и положение мавзолея рядом с Сулайман-Тоо."
      "uz": "Bu yerda katta tomosha emas, ixcham joy kutiladi. Detallar kichik: gumbazli xonalar, vazmin gʻisht terimi, ibodat joyi va maqbaraning Sulaymon-Too yonidagi oʻrni."
