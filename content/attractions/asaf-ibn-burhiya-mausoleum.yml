    "uz": "Asaf ibn Burhiya maqbarasi Oʻshning muqaddas togʻi yaqinida joylashgan. Mahalliy anʼana bu joyni shoh Sulaymonning dono vaziri bilan bogʻlaydi; tashrif esa ixcham qabr xonasi, ibodat joyi va tirik ziyorat maskanining odobiga suyanadi."
