  "en": "Asaf ibn Burhiya Mausoleum sits close to Osh's sacred mountain route. Local tradition links the place with the wise vizier of King Suleiman, while the visit itself stays grounded in a compact tomb chamber, a prayer room, and the etiquette of a living pilgrimage stop."
  "ru": "Мавзолей Асафа ибн Бурхии находится рядом с маршрутом по священной горе Оша. Местная традиция связывает это место с мудрым визирем царя Сулеймана, а само посещение возвращает внимание к компактной погребальной камере, молитвенному помещению и этикету живой паломнической остановки."
  "uz": "Asaf ibn Burhiya maqbarasi Oʻshning muqaddas togʻi yaqinida joylashgan. Mahalliy anʼana bu joyni shoh Sulaymonning dono vaziri bilan bogʻlaydi; tashrif esa ixcham qabr xonasi, ibodat joyi va tirik ziyorat maskanining odobiga suyanadi."
