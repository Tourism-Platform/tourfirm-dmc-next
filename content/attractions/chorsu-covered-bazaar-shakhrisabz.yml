  "en": "Chorsu brings Shakhrisabz back to the street. UNESCO names the Chor-su bazaar within the historic centre: a covered market at the meeting of old routes, where an octagonal plan, central cupola, brick passages, and passing trade keep the walk from becoming only palaces and memorials."
