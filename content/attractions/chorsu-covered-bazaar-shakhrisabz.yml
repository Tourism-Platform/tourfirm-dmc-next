      "uz": "Gumbaz, yo‘laklar va eski chorraha"
    "description":
      "en": "Chorsu is strongest in its proportions: the covered hall, brick surfaces, side passages, and the feeling that old streets once pulled trade into one roofed place."
      "ru": "Чорсу сильнее всего в своих пропорциях: крытый зал, кирпичные поверхности, боковые проходы и ощущение, что улицы когда-то собирали торговлю под одной крышей."
      "uz": "Chorsu nisbatlari bilan kuchli: yopiq zal, g‘isht yuzalar, yon yo‘laklar va eski ko‘chalar savdoni bir tom ostiga yig‘ganini sezdiradigan kayfiyat."
