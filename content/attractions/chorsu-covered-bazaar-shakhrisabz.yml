  "uz": "Chorsu Shahrisabz sayrini yana shahar ko‘chasiga qaytaradi. UNESCO Chor-su bozorini tarixiy markaz ichida tilga oladi: eski yo‘llar tutashgan joydagi yopiq bozor, sakkiz qirrali reja, markaziy gumbaz, g‘isht yo‘laklar va savdo xotirasi marshrutni faqat saroy va memoriallardan iborat qilib qo‘ymaydi."
