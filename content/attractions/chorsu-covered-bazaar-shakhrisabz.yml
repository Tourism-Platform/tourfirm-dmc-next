    "description":
      "en": "Chorsu matters because it changes the scale of the city. It is not a palace, mosque, or mausoleum; it is a covered bazaar where streets, brickwork, trade memory, and people passing through make the UNESCO-listed centre feel lived-in."
      "ru": "Чорсу важен потому, что меняет масштаб города. Это не дворец, мечеть или мавзолей, а крытый базар, где улицы, кирпичная архитектура, торговая память и проходящие люди делают исторический центр UNESCO обжитым."
      "uz": "Chorsu muhim, chunki u shahar miqyosini o‘zgartiradi. Bu saroy, masjid yoki maqbara emas; bu ko‘chalar, g‘isht meʼmorchiligi, savdo xotirasi va o‘tayotgan odamlar UNESCO tarixiy markazini yashab turgan joydek sezdiradigan yopiq bozordir."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Cupola, passages, and the old crossroads"
