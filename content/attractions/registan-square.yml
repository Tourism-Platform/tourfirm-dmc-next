    "description":
      "en": "Registan is more than a facade stop. It gives the city a public center: teaching walls, ceremonial space, craft detail, and the three madrasahs that still define the first Samarkand view."
      "ru": "Регистан не сводится к фасадам. Он даёт Самарканду открытую городскую сцену: стены медресе, церемониальное пространство, ремесленную деталь и три здания, с которых часто начинается первое знакомство с городом."
      "uz": "Registon faqat fasadlar emas. U Samarqandga ochiq shahar sahnasini beradi: madrasa devorlari, tantanali maydon, hunar detali va shahar bilan birinchi tanishuv ko‘pincha boshlanadigan uch bino."
  - "blockType": "regular"
