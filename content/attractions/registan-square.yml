    "description":
      "en": "Registan is easiest to take in from the square inward: first the open space, then the portals, then the mosaic and carved details near the walls."
      "ru": "Регистан проще воспринимать от площади к деталям: сначала открытое пространство, затем порталы, потом мозаика и резьба у стен."
      "uz": "Registonni maydondan detallarga qarab qabul qilish osonroq: avval ochiq fazo, keyin portallar, so‘ng devor yonidagi mozaika va o‘yma bezaklar."
  - "blockType": "regular"
    "eyebrow":
