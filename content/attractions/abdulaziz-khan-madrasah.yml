      "ru": "Расписной портал в паре с Улугбеком"
      "uz": "Ulugbek yonidagi bezakli madrasa"
    "description":
      "en": "The clearest reason to stop here is the close comparison. Ulugbek Madrasah gives the street its earlier Timurid learning context; Abdulaziz Khan brings 17th-century Bukhara closer, with a painted portal, carved surfaces, unusual motifs, and visible traces of work that was never fully completed.


        «Two madrasahs let one old-city street show two different centuries.»"
      "ru": "Главное здесь — близкое сравнение. Медресе Улугбека даёт этой улице более ранний тимуридский контекст учёбы, а Абдулазиз-хан рядом показывает Бухару XVII века: расписной портал, резные поверхности, необычные мотивы и следы работы, которую не успели завершить.


        «Здесь два медресе помогают увидеть одну улицу в разных эпохах.»"
      "uz": "Bu yerda asosiy sabab - yaqin taqqoslash. Ulugbek madrasasi ko‘chaga temuriylar davri ilm kontekstini beradi; Abdulazizxon esa XVII asr Buxorosini rangli peshtoq, o‘yma yuzalar, noodatiy naqshlar va tugallanmagan ish izlari orqali yaqinroq ko‘rsatadi.


        «Bu yerda ikki madrasa bitta ko‘chani turli davrlarda ko‘rsatadi.»"
