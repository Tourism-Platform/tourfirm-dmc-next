  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nima uchun bu joy"
    "title":
      "en": "A spring shrine beside the Samanid Mausoleum"
      "ru": "Святыня у родника рядом с мавзолеем Саманидов"
      "uz": "Somoniylar maqbarasi yonidagi buloqli ziyorat joyi"
    "description":
      "en": "Chashma-Ayub starts with the spring. The site is associated with Saint Job, and the building took shape over several periods; its conical dome stands apart from many Bukhara monuments. The visit is about belief, architecture, and local memory held in one small place.


        «At Chashma-Ayub, Bukhara moves from large monuments toward a spring, a dome, and a story people still approach with respect.»"
      "ru": "История Чашма-Аюба начинается с родника. Место связывают со святым Айюбом, а здание складывалось в разные периоды; конический купол выделяет его среди многих бухарских памятников. Здесь важны предание, архитектура и местная память в небольшом пространстве.


        «У Чашма-Аюба Бухара переходит от крупных памятников к роднику, куполу и истории, к которой по-прежнему подходят с уважением.»"
      "uz": "Chashma-Ayub hikoyasi buloqdan boshlanadi. Bu joy Avliyo Ayub bilan bog‘lanadi, bino esa turli davrlarda shakllangan; konus gumbaz uni ko‘plab Buxoro yodgorliklaridan ajratib turadi. Bu yerda eʼtiqod, meʼmorchilik va mahalliy xotira kichik makonda jamlanadi.


        «Chashma-Ayubda Buxoro yirik yodgorliklardan buloq, gumbaz va hanuz hurmat bilan yondashiladigan hikoyaga o‘tadi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Conical dome, shrine entrance, and spring story"
      "ru": "Конический купол, вход к святыне и история родника"
      "uz": "Konus gumbaz, ziyorat kirishi va buloq hikoyasi"
    "description":
      "en": "Look for close, concrete details: the dome profile, the low entrance, brickwork, and the museum room that explains why water matters here."
      "ru": "Здесь важны близкие детали: линия купола, низкий вход, кирпичная кладка и музейная комната, которая объясняет значение воды в этом месте."
      "uz": "Bu yerda yaqin detallar muhim: gumbaz chizig‘i, past kirish, g‘isht terimi va suv nega muhimligini tushuntiradigan muzey xonasi."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как проходит визит"
      "uz": "Tashrif qanday kechadi"
    "title":
      "en": "Give the spring and shrine a little time"
      "ru": "Оставьте время для родника и святыни"
      "uz": "Buloq va ziyorat joyiga vaqt qoldiring"
    "description":
      "en": "Chashma-Ayub is compact, but it benefits from an unhurried visit. Move softly, treat the spring as part of a sacred setting, and let the museum room connect the legend with Bukhara's wider story."
      "ru": "Чашма-Аюб небольшой, но его лучше смотреть без спешки. Двигайтесь спокойно, воспринимайте родник как часть святыни и дайте музейной комнате связать предание с более широкой историей Бухары."
      "uz": "Chashma-Ayub ixcham, lekin uni shoshilmasdan ko‘rgan yaxshi. Sokin harakat qiling, buloqni ziyorat muhitining bir qismi sifatida qabul qiling va muzey xonasi rivoyatni Buxoroning kengroq hikoyasi bilan bog‘lasin."
