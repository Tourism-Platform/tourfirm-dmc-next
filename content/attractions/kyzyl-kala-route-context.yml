    "description":
      "en": "Near Toprak-Kala, Kyzyl-Kala turns the route into a direct comparison. The two sites are close enough to compare scale, color, and function in one sequence: palace-city remains at Toprak-Kala, tighter fortress walls at Kyzyl-Kala."
      "ru": "Рядом с Топрак-Калой Кызыл-Кала становится понятным сравнением. Две площадки достаточно близки, чтобы в одном маршруте сравнить масштаб, цвет и функцию: следы дворцового города у Топрак-Калы и более собранные крепостные стены у Кызыл-Калы."
      "uz": "Tuproq-qalʼa yonida Qizil-qalʼa aniq taqqoslashga aylanadi. Ikki joy bir yo‘nalishda miqyos, rang va vazifani solishtirish uchun yetarlicha yaqin: Tuproq-qalʼada saroy-shahar izlari, Qizil-qalʼada esa ixcham qalʼa devorlari."
  - "blockType": "regular"
    "eyebrow":
      "en": "What to notice"
      "ru": "На что смотреть"
      "uz": "Nimaga eʼtibor berish"
    "title":
      "en": "Red walls, square outline, and the Toprak-Kala plain"
      "ru": "Красные стены, квадратный контур и равнина Топрак-Калы"
      "uz": "Qizil devorlar, kvadrat shakl va Tuproq-qalʼa tekisligi"
    "description":
      "en": "Kyzyl-Kala is compact and easy to read on site: restored walls, the square plan, arrow-shaped openings, the sloped approach, and the plain that keeps Toprak-Kala close in the route."
      "ru": "Кызыл-Калу легко понять на месте: восстановленные стены, квадратный план, бойницы, наклонный подход и равнина, где Топрак-Кала остаётся близко по маршруту."
      "uz": "Qizil-qalʼani joyida tushunish oson: tiklangan devorlar, kvadrat reja, o‘q tuynuklari, qiya yondashuv va Tuproq-qalʼani yo‘lda yaqin tutadigan tekislik."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как проходит визит"
      "uz": "Tashrif qanday kechadi"
    "title":
      "en": "Compare it with Toprak-Kala"
      "ru": "Сравните её с Топрак-Калой"
      "uz": "Uni Tuproq-qalʼa bilan solishtiring"
    "description":
      "en": "If the route includes both sites, it is easier to begin with Toprak-Kala's palace-city remains, then let Kyzyl-Kala sharpen the comparison: color, shape, defensive form, and the restored wall line. Keep footing careful and confirm local access before departure."
      "ru": "Если маршрут включает обе площадки, логично начать с дворцового города Топрак-Калы, а затем смотреть Кызыл-Калу как сравнение: цвет, форму, оборонительную логику и восстановленную линию стен. Идите аккуратно и уточняйте доступ до выезда."
      "uz": "Yo‘l ikkala joyni ham olgan bo‘lsa, avval Tuproq-qalʼaning saroy-shahar izlaridan boshlash, keyin Qizil-qalʼada rang, shakl, mudofaa mantiqi va tiklangan devor chizig‘ini solishtirish tabiiy. Ehtiyot yuring va kirishni yo‘lga chiqishdan oldin tekshiring."
  - "blockType": "regular"
