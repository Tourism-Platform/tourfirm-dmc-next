    "title":
      "en": "Toprak-Kala, Ayaz-Kala, and Nukus museums"
      "ru": "Топрак-Кала, Аяз-Кала и музеи Нукуса"
      "uz": "Tuproq-qalʼa, Ayoz-qalʼa va Nukus muzeylari"
    "description":
      "en": "Toprak-Kala gives the closest palace-city comparison, Ayaz-Kala extends the desert-fortress route, and Nukus museums can connect the road with Karakalpakstan's archaeology, art, and memory."
      "ru": "Топрак-Кала даёт ближайшее дворцовое сравнение, Аяз-Кала продолжает пустынный крепостной маршрут, а музеи Нукуса связывают дорогу с археологией, искусством и памятью Каракалпакстана."
      "uz": "Tuproq-qalʼa eng yaqin saroy-shahar taqqoslashini beradi, Ayoz-qalʼa cho‘l qalʼalari yo‘lini davom ettiradi, Nukus muzeylari esa yo‘lni arxeologiya, sanʼat va Qoraqalpog‘iston xotirasi bilan bog‘laydi."
