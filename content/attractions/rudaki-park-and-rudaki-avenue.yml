      "uz": "Bu joy poytaxtni kelishdan keyin, muzeylar yoki vodiy yoʻllaridan oldin sokin ochadi. Park va xiyobon sayri Dushanbening kundalik miqyosini ko‘rsatadi: soya, suv, jamoat binolari, yaqindagi choy va shahar harakati."
