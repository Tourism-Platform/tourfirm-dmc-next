      "ru": "Одина — компактная визуальная остановка: цвет купола наверху, длинные арки на уровне человека и музейная память рядом с рабочими улицами Карши."
      "uz": "Odina ixcham vizual bekat: tepada gumbaz rangi, inson bo‘yidagi uzun arkalar va Qarshining ishlayotgan ko‘chalari yonida saqlangan muzey xotirasi."
