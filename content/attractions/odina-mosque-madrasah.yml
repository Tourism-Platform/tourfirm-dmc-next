    "description":
      "en": "Odina matters because it gives the Qarshi visit a human-scale counterpoint after the bridge. The building is not only a blue dome; it holds mosque history, remembered women's education and prayer, and museum rooms that now speak about repression and resilience in the region."
      "ru": "Одина важна потому, что даёт маршруту по Карши человеческий масштаб после моста. Это не только синий купол: здание хранит историю мечети, память женского образования и молитвы, а музейные залы сегодня говорят о репрессиях и стойкости людей региона."
      "uz": "Odina muhim, chunki u ko‘prikdan keyin Qarshi yo‘nalishiga insoniy miqyos beradi. Bu faqat ko‘k gumbaz emas: bino masjid tarixi, ayollar ta’limi va ibodati xotirasi, bugungi muzey xonalari esa qatag‘on va mintaqa odamlari saboti haqida gapiradi."
