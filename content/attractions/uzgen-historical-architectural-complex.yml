    "title":
      "en": "Where Karakhanid brick gives Uzgen its character"
      "ru": "Где караханидская кладка задаёт характер города"
      "uz": "Qoraxoniylar gʻishti shaharga belgi bergan joy"
    "description":
      "en": "The complex gives Uzgen its main reason to stop. The visit can stay in one place and still show a complete Karakhanid picture: portals, patterned brick, terracotta, mausoleums, and the minaret in the same town setting.


        «The stop is short in distance, but the brickwork asks you to slow down and notice how much is held in one compact ensemble.»"
      "ru": "Комплекс даёт Узгену главную причину для остановки. Посещение может оставаться в одном месте и всё равно показать цельную караханидскую картину: порталы, кирпичный орнамент, терракоту, мавзолеи и минарет в городской среде.


        «Расстояния здесь небольшие, но кирпичная кладка просит замедлиться и заметить, сколько смысла собрано в одном компактном ансамбле.»"
      "uz": "Majmua Oʻzganda toʻxtash uchun asosiy sabab beradi. Tashrif bir joyda qolib ham Qoraxoniylar meʼmorchiligini toʻliqroq koʻrsatadi: peshtoqlar, gʻisht naqshi, terrakota, maqbaralar va minora shahar muhitida turadi.


        «Bu yerda masofa qisqa, ammo gʻisht naqshi sekinlashishni va bir ixcham ansamblda qancha maʼno jamlanganini ko‘rishni so‘raydi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni koʻrasiz"
