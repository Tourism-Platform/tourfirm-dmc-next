      "en": "Read the complex through three visible elements: the attached mausoleums, the minaret, and the surface detail that ties them together."
      "ru": "Рассматривайте комплекс через три видимые части: соединённые мавзолеи, минарет и поверхность кладки, которая связывает их между собой."
      "uz": "Majmuani uch ko‘rinadigan qism orqali o‘qing: tutash maqbaralar, minora va ularni bogʻlaydigan gʻisht yuzasi."
