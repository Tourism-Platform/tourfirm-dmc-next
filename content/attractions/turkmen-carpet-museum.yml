"excerpt":
  "en": "After Ashgabat's white marble, monument parks, and national museum halls, the Turkmen Carpet Museum brings the route down to wool, knot, motif, and the hands behind them. Its halls are tied to a craft tradition recognized by UNESCO and to a national museum collection of about 2,000 rare carpet exhibits, so the stop gives Ashgabat a quieter, more tactile scale."
  "ru": "После белого мрамора Ашхабада, монументальных парков и залов Национального музея Музей туркменского ковра приближает маршрут к шерсти, узлу, орнаменту и рукам, которые стоят за ними. Его залы связаны с ремеслом, признанным ЮНЕСКО, и с музейным собранием примерно из 2 000 редких ковровых экспонатов, поэтому остановка даёт Ашхабаду более тихий и тактильный масштаб."
  "uz": "Ashgabatning oq marmari, monument bog‘lari va Milliy muzey zallaridan keyin Turkman gilami muzeyi yo‘lni jun, tugun, naqsh va ularning ortidagi qo‘llarga yaqinlashtiradi. Uning zallari UNESCO tan olgan hunar anʼanasi va taxminan 2 000 nodir gilam eksponati saqlanadigan muzey to‘plami bilan bog‘liq, shu sababli bu to‘xtash Ashgabatga sokinroq va seziladigan miqyos beradi."
