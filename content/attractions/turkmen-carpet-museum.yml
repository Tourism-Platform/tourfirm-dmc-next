  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "A craft stop that makes the city more human"
      "ru": "Ремесленная остановка, которая делает город человечнее"
      "uz": "Shaharni insoniyroq qiladigan hunar to‘xtashi"
    "description":
      "en": "Turkmen carpet weaving is not only decorative art. Motifs carry family, regional, and craft memory; carded wool, spun thread, dyed yarn, and finished carpets show how that memory becomes an object.


        «The best moment here is when pattern stops looking like decoration and starts reading as memory held in wool.»"
      "ru": "Туркменское ковроткачество — не только декоративное искусство. Орнаменты несут семейную, региональную и ремесленную память; чесание шерсти, прядение нити, окрашивание пряжи и готовые ковры показывают, как эта память становится предметом.


        «Лучший момент здесь наступает, когда орнамент перестаёт быть декором и начинает читаться как память, удержанная в шерсти.»"
      "uz": "Turkman gilamdo‘zligi faqat bezak sanʼati emas. Naqshlar oilaviy, hududiy va hunar xotirasini olib yuradi; jun tarash, ip yigirish, bo‘yoq tayyorlash va tayyor gilamlar bu xotira qanday buyumga aylanishini ko‘rsatadi.


        «Bu yerda eng yaxshi lahza naqsh bezakdan chiqib, junda saqlangan xotira sifatida o‘qila boshlaganda keladi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Carpets, motifs, and making process"
      "ru": "Ковры, орнаменты и процесс изготовления"
      "uz": "Gilamlar, naqshlar va tayyorlash jarayoni"
    "description":
      "en": "Three cues matter here: motif language on the carpet surface, the scale of woven works, and the craft process behind wool, thread, dye, felt, dress, and display."
      "ru": "Здесь важны три подсказки: язык орнамента на поверхности ковра, масштаб тканых работ и процесс за шерстью, нитью, красителем, войлоком, одеждой и экспозицией."
      "uz": "Bu yerda uchta belgi muhim: gilam yuzasidagi naqsh tili, to‘qilgan ishlarning miqyosi va jun, ip, bo‘yoq, kigiz, kiyim hamda ekspozitsiya ortidagi jarayon."
