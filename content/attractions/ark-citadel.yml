    "description":
      "en": "The Ark is where Bukhara's old-city route opens out. After the lanes and courtyards, the fortress brings walls, gates, and rooms tied to the city's rulers and museum collections."
      "ru": "Арк — место, где маршрут по старой Бухаре выходит на открытое пространство. После улиц и дворов здесь появляются стены, ворота и залы, связанные с правителями города и музейными коллекциями."
      "uz": "Arkda eski Buxoro yo‘nalishi ochiqroq joyga chiqadi. Ko‘cha va hovlilardan keyin bu yerda devorlar, darvoza, shahar hukmdorlari va muzey kolleksiyalari bilan bog‘liq xonalar paydo bo‘ladi."
  - "blockType": "regular"
