      "uz": "Ark atrofida Poyi Kalon va Labi Hovuz ko‘chalariga qaraganda ochiq joy ko‘proq. Ayniqsa issiq oylarda tashqi yondashuv va ichki xonalar uchun vaqt qoldiring."
