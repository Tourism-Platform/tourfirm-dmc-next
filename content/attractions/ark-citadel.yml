    "description":
      "en": "The Ark changes what you see on the Bukhara walk: a long fortress wall, a raised gate, and views that place the old city around it."
      "ru": "В Арке меняется сама картинка прогулки по Бухаре: длинная крепостная стена, поднятые ворота и виды, которые показывают старый город вокруг."
      "uz": "Arkda Buxoro sayrining ko‘rinishi o‘zgaradi: uzun qalʼa devori, baland darvoza va eski shaharni atrofda ko‘rsatadigan manzaralar."
  - "blockType": "regular"
