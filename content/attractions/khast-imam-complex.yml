  "uz": "Hazrati Imom majmuasi eski Toshkentni sokin ritmda ochadi: ochiq hovlilar, koshinli peshtoqlar, madrasalar, masjidlar, soya va qoʻlyozmalar tarixi. Chorsudagi harakatdan keyin bu yer shaharni sekinroq his qilishga imkon beradi."
