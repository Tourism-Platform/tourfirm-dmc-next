      "en": "The bazaar gives Bishkek a different kind of clarity: not state buildings or museum context, but food, trade, voices, and ordinary errands.


        «Osh Bazaar speaks in bread steam, spice color, seller voices, and the movement of people buying what the city needs.»"
      "ru": "Базар делает Бишкек понятным иначе: не через государственные здания или музейный контекст, а через еду, торговлю, голоса и обычные покупки.


        «Ошский базар говорит паром хлеба, цветом специй, голосами продавцов и движением людей, которые покупают всё нужное для города.»"
      "uz": "Bozor Bishkekni boshqa tomondan ochadi: davlat binolari yoki muzey mazmuni orqali emas, balki taom, savdo, ovozlar va oddiy xaridlar orqali.


        «Oʻsh bozori non bugʻi, ziravor rangi, sotuvchilar ovozi va shahar uchun zarur narsalarni olayotgan odamlar harakati bilan gapiradi.»"
