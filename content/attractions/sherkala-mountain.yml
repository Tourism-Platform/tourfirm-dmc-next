      "ru": "Что вы увидите"
      "uz": "Nimalarni koʻrasiz"
    "title":
      "en": "Mesa outline, open ground, and road scale"
      "ru": "Силуэт горы, открытая земля и масштаб дороги"
      "uz": "Togʻ silueti, ochiq yer va yoʻl miqyosi"
    "description":
      "en": "Sherkala is not a complex monument. The visit is about one form, the empty ground around it, and the distance from Aktau that makes the stop feel remote."
      "ru": "Шеркала — не сложный памятник. Визит держится на одной форме, пустом пространстве вокруг и расстоянии от Актау, которое делает остановку удалённой."
      "uz": "Sherkala murakkab yodgorlik emas. Tashrif bitta shakl, atrofdagi boʻsh yer va Aqtaudan uzoqlik hissi atrofida quriladi."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посещать"
      "uz": "Qanday tashrif buyurish"
    "title":
      "en": "A remote landscape stop, not a city sight"
      "ru": "Удалённая ландшафтная остановка, а не городская прогулка"
      "uz": "Uzoq landshaft toʻxtashi, shahar sayri emas"
    "description":
      "en": "Sherkala belongs in a Mangystau road route, not in casual city sightseeing. The visit feels calmer when the stop order, vehicle, light, heat, wind, water, and return or onward drive are settled together before leaving Aktau."
      "ru": "Шеркала принадлежит дороге по Мангистау, а не городской прогулке из Актау. Визит спокойнее, когда порядок остановок, машина, свет, жара, ветер, вода и обратная или дальнейшая дорога решены вместе."
      "uz": "Sherkala Aqtau ichidagi oddiy sayr emas, Mangʻistov yoʻlining bir qismi. Toʻxtashlar tartibi, avtomobil, yorugʻlik, issiq, shamol, suv va qaytish yoki davom etish yoʻli birga aniqlansa, tashrif xotirjamroq kechadi."
  - "blockType": "regular"
    "eyebrow":
      "en": "What to add nearby"
      "ru": "Что добавить рядом"
      "uz": "Yaqinda nima qoʻshish mumkin"
    "title":
      "en": "Sherkala belongs with realistic northern stops"
      "ru": "Шеркала сочетается только с реалистичными северными остановками"
      "uz": "Sherkala haqiqiy shimoliy toʻxtashlar bilan moslashadi"
    "description":
      "en": "Torysh is the clearest current companion for a Sherkala route. Kokkala, Airakty, Shakpak-Ata, Beket-Ata, and Bozzhira can shape wider Mangystau plans, but each needs separate access, timing, etiquette, and road checks before we recommend it beside Sherkala."
      "ru": "Торыш — самый ясный соседний выбор для маршрута с Шеркалой. Коккала, Айракты, Шакпак-Ата, Бекет-Ата и Бозжыра могут формировать более широкие планы по Мангистау, но каждому месту нужны отдельные проверки доступа, времени, этикета и дороги, прежде чем мы рекомендуем его рядом с Шеркалой."
      "uz": "Torysh Sherkala yoʻnalishi uchun hozirgi eng aniq yaqin tanlov. Kokkala, Airakty, Shakpak-Ata, Beket-Ata va Bozzhira kengroq Mangʻistov rejalarini shakllantirishi mumkin, ammo har biri uchun kirish, vaqt, odob va yoʻl boʻyicha alohida tekshiruvlar kerak."
