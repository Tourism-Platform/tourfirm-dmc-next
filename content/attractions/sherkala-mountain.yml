    "title":
      "en": "The lone mesa that makes the distance visible"
      "ru": "Силуэт, который показывает масштаб дороги"
      "uz": "Masofani sezdiradigan yakka siluet"
    "description":
      "en": "In northern Mangystau, Sherkala gives the road a fixed point. After pale ground and long horizons, the mesa rises as a shape travelers can recognize before they are near it.


        «Sherkala belongs to the road as much as to the view: the same conditions that make the drive workable also decide whether the stop has meaning.»"
      "ru": "В северном Мангистау Шеркала даёт дороге ясную точку. После бледной земли и длинного горизонта столовая гора поднимается как форма, которую видно задолго до подъезда.


        «Шеркала принадлежит дороге не меньше, чем виду: те же условия, которые делают поездку выполнимой, решают, будет ли остановка осмысленной.»"
      "uz": "Shimoliy Mangʻistovda Sherkala yoʻlga aniq nuqta beradi. Oqish yer va uzun ufqdan keyin yassi togʻ uzoqdan taniladigan shakl sifatida koʻtariladi.


        «Sherkala manzaraga qancha tegishli boʻlsa, yoʻlga ham shuncha tegishli: safarni amalga oshiradigan sharoitlar toʻxtashning maʼnosini ham belgilaydi.»"
  - "blockType": "regular"
    "eyebrow":
