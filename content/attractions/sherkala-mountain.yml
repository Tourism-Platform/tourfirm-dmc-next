  "uz": "Sherkala Aqtau ichidagi shahar diqqatga sazovor joyi emas. Yoʻl Kaspiy shahridan shimoliy Mangʻistovga chiqadi; u yerda bitta yassi togʻ butun ufqda koʻzga tashlanadi. Shakl va atrofdagi sokinlik uchun toʻxtash arziydi, lekin avtomobil, kunduzgi vaqt, suv, issiq, shamol va mahalliy yoʻl maslahati oldindan tekshirilgandan keyin."
