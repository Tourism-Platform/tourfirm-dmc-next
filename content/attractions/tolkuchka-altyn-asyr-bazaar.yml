    "title":
      "en": "Where Ashgabat turns toward market life"
      "ru": "Где Ашхабад поворачивает к рыночной жизни"
      "uz": "Ashgabat bozor hayotiga buriladigan joy"
    "description":
      "en": "The bazaar gives the capital a human counterweight. Instead of reading Ashgabat only through official space, travelers meet trade, texture, bargaining, transport, and the practical work of a city buying what it needs.


        «The market matters because it lets Ashgabat sound different: less official space, more fabric, traffic, sellers, and exchange.»"
      "ru": "Базар даёт столице человеческий противовес. Ашхабад здесь воспринимается не только через официальное пространство, а через торговлю, фактуру, торг, транспорт и практическую работу города, который покупает нужные вещи.


        «Рынок важен потому, что Ашхабад начинает звучать иначе: меньше официального пространства, больше ткани, движения, продавцов и обмена.»"
      "uz": "Bozor poytaxtga insoniy qarama-qarshi miqyos beradi. Ashgabat bu yerda faqat rasmiy makon orqali emas, savdo, mato va gilam fakturasi, savdolashuv, transport va kerakli narsalarni xarid qilayotgan shahar hayoti orqali seziladi.


        «Bozor muhim, chunki Ashgabat boshqacha eshitiladi: rasmiy makon kamroq, mato, harakat, sotuvchilar va almashinuv ko‘proq.»"
