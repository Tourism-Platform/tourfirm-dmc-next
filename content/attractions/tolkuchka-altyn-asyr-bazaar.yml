    "en": "After Ashgabat's marble avenues, monument parks, and museum rooms, Tolkuchka / Altyn Asyr Bazaar changes the city's texture. The route moves toward market lanes, fabric, carpet rows, household goods, voices, traffic, and everyday trading on the Bagtyyarlyk side of Ashgabat. This is not a casual walk from the central monuments. Include it when the active market window, transfer approach, access, and photography boundaries have been checked locally."
    "ru": "После мраморных проспектов, монументальных парков и музейных залов Толкучка / базар «Алтын Асыр» меняет фактуру Ашхабада. Маршрут выходит к рыночным рядам, тканям, коврам, бытовым товарам, голосам, транспорту и повседневной торговле на стороне Багтыярлыка. Это не прогулка от центральных монументов. Базар стоит включать в маршрут только тогда, когда активное время рынка, подъезд, доступ и границы фотосъёмки проверены на месте."
    "uz": "Ashgabatning marmar xiyobonlari, monument bog‘lari va muzey zallaridan keyin Tolkuchka / Altyn Asyr bozori shahar fakturasini o‘zgartiradi. Yo‘nalish bozor yo‘laklari, matolar, gilam qatorlari, maishiy buyumlar, ovozlar, transport va Bagtyyarlyk tomonidagi kundalik savdoga olib chiqadi. Bu markaziy monumentlardan oddiy piyoda yurish emas. Bozorning faol vaqti, borish yo‘li, kirish va suratga olish chegaralari joyida tekshirilganda u yo‘nalishga kiritiladi."
