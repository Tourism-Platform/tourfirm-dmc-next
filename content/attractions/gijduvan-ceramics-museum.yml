  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "Where the craft stays close to the maker"
      "ru": "Где ремесло остаётся рядом с мастером"
      "uz": "Hunar usta bilan yonma-yon qoladigan joy"
    "description":
      "en": "The museum matters because the finished piece and the maker stay close. Bowls, trays, toys, brushes, shelves, and the potter's wheel sit in one family workshop setting, so the visit is not only a display; it shows how Gijduvan ceramics are made and passed on.


        «The bowl matters more when you have seen the wheel, the brush, and the hand behind it.»"
      "ru": "Музей важен тем, что предмет и мастер остаются рядом. Чаши, ляганы, игрушки, кисти, полки и работа на круге находятся в одном семейном пространстве, поэтому визит показывает не только экспозицию, но и то, как гиждуванская керамика создаётся и передаётся.


        «Расписная чаша воспринимается иначе, когда за ней видны круг, кисть и рука мастера.»"
      "uz": "Muzey muhim, chunki buyum va usta bir-biridan ajralmaydi. Kosalar, laganlar, oʻyinchoqlar, moʻyqalamlar, javonlar va charxdagi ish bir oilaviy ustaxona muhitida turadi; shuning uchun tashrif faqat ekspozitsiya emas, Gʻijduvon keramikasi qanday yaratilishi va davom etishini ko‘rsatadi.


        «Kosa ortida charx, moʻyqalam va usta qoʻli ko‘ringanda uning qadri boshqacha seziladi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nima koʻrasiz"
    "title":
      "en": "Wheel, brush, shelves, and courtyard detail"
      "ru": "Круг, кисть, полки и детали двора"
      "uz": "Charx, moʻyqalam, javonlar va hovli detali"
    "description":
      "en": "The visual story moves from process to object: clay on the wheel, painted ceramics on the shelf, and the courtyard or room where the craft setting becomes personal."
      "ru": "Визуальная история идёт от процесса к предмету: глина на круге, расписная керамика на полке и двор или комната, где ремесленное пространство становится личным."
      "uz": "Vizual hikoya jarayondan buyumga oʻtadi: charxdagi loy, javondagi naqshli keramika va hunarmand makon shaxsiylashadigan hovli yoki xona."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посетить"
      "uz": "Qanday tashrif buyuriladi"
    "title":
      "en": "Let the workshop set the pace"
      "ru": "Мастерская задаёт темп визита"
      "uz": "Ustaxona tashrif ritmini belgilaydi"
    "description":
      "en": "The visit is clearest when there is time for both display and process: shelves, family stories, the potter's wheel when available, tea, and a closer look at the pieces."
      "ru": "Музей понятнее, когда у гостя есть время и на экспозицию, и на процесс: полки, семейные истории, работа на круге, если она доступна, чай и внимательный взгляд на вещи."
      "uz": "Mehmon ekspozitsiya va jarayonga vaqt topganda muzey aniqroq seziladi: javonlar, oilaviy hikoyalar, mavjud bo‘lsa charxdagi ish, choy va buyumlarga diqqat bilan qarash."
