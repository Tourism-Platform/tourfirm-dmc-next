"excerpt":
  "en": "Hazret Sultan Mosque gives Astana's monumental center a quieter register. The white-stone complex opened in 2012 beside Independence Square, with four 77-meter minarets, a 51-meter dome shaped by the shanyrak symbol, and a prayer hall built for daily worship and holiday crowds. Approach it first as a mosque in use, then as part of the capital's ceremonial ensemble."
  "ru": "Мечеть Хазрет Султан добавляет спокойный тон монументальному центру Астаны. Белокаменный комплекс открылся в 2012 году рядом с площадью Независимости: четыре 77-метровых минарета, 51-метровый купол с образом шанырака и молитвенный зал для ежедневной молитвы и праздничных собраний. Сначала воспринимайте её как действующую мечеть, затем как часть столичного ансамбля."
  "uz": "Hazret Sultan masjidi Ostonaning monumentalli markaziga sokinroq ohang beradi. Oq toshli majmua 2012 yilda Mustaqillik maydoni yonida ochilgan: toʻrtta 77 metrlik minora, shanyrak timsolidagi 51 metrlik gumbaz va kundalik namoz hamda bayram jamoatlari uchun qurilgan keng namoz zali. Uni avval amaldagi masjid sifatida qabul qiling, keyin poytaxt ansamblining bir qismi sifatida ko‘ring."
