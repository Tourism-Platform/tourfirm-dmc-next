  "en": "Kok-Tobe rises close enough to central Almaty to feel like part of the city, but high enough to set the skyline against the Trans-Ili Alatau. In clear air, it gives a useful orientation view before a market, museum, dinner, or a separate Medeu-Shymbulak mountain plan."
  "ru": "Кок-Тобе находится достаточно близко к центру, чтобы оставаться частью Алматы, и достаточно высоко, чтобы показать город на фоне Заилийского Алатау. В ясную погоду это удобный вид для ориентации перед рынком, музеем, ужином или отдельным выездом к Медеу и Шымбулаку."
  "uz": "Koʻk-Tobe markaziy Olmaotaga yaqin bo‘lgani uchun shahar qismidek tuyuladi, balandligi esa shaharni Iliorti Olatovi fonida ko‘rsatadi. Havo ochiq bo‘lsa, u bozor, muzey, kechki ovqat yoki alohida Medeu-Shimbuloq rejasi oldidan yaxshi manzara beradi."
