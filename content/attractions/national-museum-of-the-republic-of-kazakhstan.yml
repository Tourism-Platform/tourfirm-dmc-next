  "uz": "Tauelsizdik shohkoʻchasida Milliy muzey Mustaqillik maydonining madaniy tomonini mustahkamlaydi. Tashrif qadimgi va oʻrta asrlar tarixidan Oltin zal, etnografiya, zamonaviy sanʼat, Ostona zali va Mustaqil Qozogʻistonga oʻtadi, shunda poytaxtning fuqarolik miqyosida milliy tarix chizigʻi paydo boʻladi."
