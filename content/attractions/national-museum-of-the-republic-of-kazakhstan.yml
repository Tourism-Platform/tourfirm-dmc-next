"excerpt":
  "en": "On Tauelsizdik Avenue, the National Museum anchors the cultural side of Astana's Independence Square. The visit moves from ancient and medieval history to the Gold Hall, ethnography, contemporary art, the Hall of Astana, and Independent Kazakhstan, giving the capital's civic scale a national timeline you can follow with time and attention."
