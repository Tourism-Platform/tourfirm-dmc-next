    "description":
      "en": "Yerkurgan works when the route gives it a purpose: ancient Nakhshab, Qarshi's deeper timeline, and the difference between a visible monument and an archaeological landscape."
      "ru": "Еркурган работает, когда у остановки есть понятная задача: древний Нахшаб, более глубокая шкала времени Карши и разница между видимым памятником и археологическим ландшафтом."
      "uz": "Yerkurgan yoʻnalishda aniq vazifaga ega boʻlganda ishlaydi: qadimiy Naxshab, Qarshining chuqurroq vaqt chizigʻi, koʻrinadigan yodgorlik va arxeologik landshaft oʻrtasidagi farq."
