  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nima uchun bu joy"
    "title":
      "en": "Qarshi's older city story begins outside the old center"
      "ru": "Более ранняя городская история Карши начинается за старым центром"
      "uz": "Qarshining qadimiyroq shahar hikoyasi eski markazdan tashqarida boshlanadi"
    "description":
      "en": "Qarshi's visible city walk is compact and architectural. Yerkurgan changes the scale. It moves the route from bridge, dome, water, and madrasah to the earlier urban world of Nakhshab, where walls, settlement planning, craft life, and ritual spaces shaped the region before the modern city took form.


        «Yerkurgan makes Qarshi feel less like a single city walk and more like the visible edge of ancient Nakhshab.»"
      "ru": "Видимая прогулка по Карши компактна и архитектурна. Еркурган меняет масштаб. Он переводит маршрут от моста, купола, воды и медресе к более раннему городскому миру Нахшаба, где стены, планировка поселения, ремесленная жизнь и ритуальные пространства формировали регион до современного города.


        «Еркурган делает Карши не одной городской прогулкой, а видимым краем древнего Нахшаба.»"
      "uz": "Qarshining koʻrinadigan shahar sayri ixcham va meʼmoriy. Yerkurgan miqyosni oʻzgartiradi. U yoʻnalishni koʻprik, gumbaz, suv va madrasadan Naxshabning avvalgi shahar dunyosiga olib oʻtadi. Bu dunyoda devorlar, manzilgoh rejalari, hunarmandchilik hayoti va marosim joylari zamonaviy shahardan oldin hududni shakllantirgan.


        «Yerkurgan Qarshini bitta shahar sayri emas, qadimiy Naxshabning koʻrinadigan cheti sifatida his qildiradi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni koʻrasiz"
    "title":
      "en": "Earthworks, open ground, and archaeological context"
      "ru": "Земляные формы, открытый участок и археологический контекст"
      "uz": "Tuproq shakllari, ochiq hudud va arxeologik kontekst"
    "description":
      "en": "The site should be read through physical traces and explanation, not through a restored facade. Same-place media is still pending, so image slots remain unassigned until a truthful Yerkurgan set is approved."
      "ru": "Место нужно читать через физические следы и объяснение, а не через восстановленный фасад. Собственные фотографии Еркургана ещё не утверждены, поэтому слоты изображений остаются незаполненными до подтверждения правдивого набора с этого же места."
      "uz": "Bu joyni tiklangan fasad orqali emas, jismoniy izlar va tushuntirish orqali oʻqish kerak. Aynan shu joyga oid media hali kutilmoqda, shuning uchun haqqoniy Yerkurgan toʻplami tasdiqlanmaguncha rasm slotlari biriktirilmaydi."
  - "blockType": "regular"
