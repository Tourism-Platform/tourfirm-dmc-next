  "en": "Northwest of Qarshi, Yerkurgan / Erkurgan opens a deeper chapter of Kashkadarya: ancient Nakhshab, earthen walls, settlement traces, craft quarters, and temple or memorial structures known through archaeology. We treat it as a special-interest stop until the exact access, route approach, and same-place media are confirmed locally."
  "ru": "К северо-западу от Карши Еркурган / Эркурган открывает более глубокую главу Кашкадарьи: древний Нахшаб, земляные стены, следы поселения, ремесленные кварталы, храмовые или мемориальные сооружения, известные по археологии. Мы держим его как остановку специального интереса, пока точный доступ, подъезд и собственные фотографии места не подтверждены на месте."
  "uz": "Qarshining shimoli-gʻarbida Yerkurgan / Erkurgan Qashqadaryoning chuqurroq bobini ochadi: qadimiy Naxshab, tuproq devorlar, manzilgoh izlari, hunarmandchilik hududlari, arxeologiya orqali maʼlum boʻlgan ibodatxona yoki memorial tuzilmalar. Aniq kirish, borish yoʻli va aynan shu joyga oid media mahalliy tasdiqlanmaguncha uni maxsus qiziqish bekati sifatida tutamiz."
