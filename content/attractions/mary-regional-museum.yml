    "description":
      "en": "Ancient Merv is wide, exposed, and archaeological. A focused museum stop in Mary gives real objects, craft, and local memory to place beside the walls and earthworks outside the city.


        «Mary's museum gives Ancient Merv a human scale before the route returns to the archaeological landscape.»"
      "ru": "Древний Мерв — большой открытый археологический ландшафт. Музейная остановка в Мары даёт предметы, ремесло и местную память, которые затем легче соотнести со стенами и земляными формами за городом.


        «Музей в Мары помогает увидеть древний Мерв в человеческом масштабе, прежде чем маршрут снова выйдет к археологическому ландшафту.»"
      "uz": "Qadimiy Marv keng va ochiq arxeologik manzaradir. Maridagi muzey to‘xtashi shahar tashqarisidagi devorlar va tuproq shakllarini tushunishga yordam beradigan buyumlar, hunar va mahalliy xotirani beradi.


        «Maridagi muzey qadimiy Marvni insoniy miqyosda ko‘rsatadi, keyin yo‘l yana arxeologik manzaraga qaytadi.»"
  - "blockType": "regular"
    "eyebrow":
