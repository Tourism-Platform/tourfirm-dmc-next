      "en": "The museum's strongest value is the shift from open ruins to objects close at hand: archaeology, craft, and regional memory."
      "ru": "Главная ценность музея — переход от открытых руин к предметам рядом: археологии, ремеслу и региональной памяти."
      "uz": "Muzeyning asosiy qiymati ochiq xarobalardan yoningizdagi buyumlarga o‘tishda ko‘rinadi: arxeologiya, hunar va mintaqaviy xotira."
