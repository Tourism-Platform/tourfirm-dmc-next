      "uz": "Temuriy hikoyani o‘zgartiradigan rejalangan qabr"
    "description":
      "en": "This small chamber matters because it gives Shakhrisabz a factual pause. The crypt was discovered in the nineteenth century behind Dorus-Saodat and designed for a single burial, with a marble sarcophagus under a heavy slab. It was intended for Timur, but his burial story leads away from Shakhrisabz."
      "ru": "Эта небольшая камера важна потому, что даёт Шахрисабзу точную паузу. Склеп нашли в XIX веке за Дорус-Саодат и задумали для одного захоронения: с мраморным саркофагом под тяжёлой плитой. Он был предназначен для Темура, но история его погребения уходит из Шахрисабза."
      "uz": "Bu kichik kamera muhim, chunki u Shahrisabzga aniq pauza beradi. Sag‘ana XIX asrda Dorus-Saodat ortida topilgan va bitta dafn uchun mo‘ljallangan: og‘ir plita ostidagi marmar sarkofag bilan. U Temur uchun tayyorlangan, ammo uning dafn hikoyasi Shahrisabzdan boshqa tomonga ketadi."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Chamber, threshold, and memorial setting"
      "ru": "Камера, порог и мемориальное пространство"
      "uz": "Kamera, ostona va memorial muhit"
    "description":
      "en": "The crypt is compact. Its visible story is the descent, the chamber prepared for one burial, and the Dorus-Saodat setting that keeps it inside Shakhrisabz's family memorial context."
      "ru": "Склеп очень компактный. Его видимая история — спуск, камера, подготовленная для одного захоронения, и пространство Дорус-Саодат, которое держит его внутри семейной памяти Шахрисабза."
      "uz": "Sag‘ana juda ixcham. Uning ko‘rinadigan hikoyasi pastga tushish, bitta dafn uchun tayyorlangan kamera va uni Shahrisabz oilaviy xotirasi ichida ushlab turadigan Dorus-Saodat muhitidir."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как проходит визит"
      "uz": "Tashrif qanday kechadi"
    "title":
      "en": "Keep the stop small and respectful"
      "ru": "Держите остановку короткой и уважительной"
      "uz": "Bekatni qisqa va hurmatli tuting"
    "description":
      "en": "If the chamber is open, treat it as a short memorial visit. The value is not a long explanation; it is the exact burial fact, the lower space, and the way the guide can connect it back to Dorus-Saodat."
      "ru": "Если камера открыта, воспринимайте её как короткий мемориальный визит. Смысл не в длинном объяснении, а в точном факте о захоронении, нижнем пространстве и связи, которую гид проводит обратно к Дорус-Саодат."
      "uz": "Kamera ochiq bo‘lsa, uni qisqa memorial tashrif sifatida ko‘ring. Mazmun uzun izohda emas, dafn haqidagi aniq fakt, pastki makon va gid uni Dorus-Saodat bilan bog‘lab berishidadir."
