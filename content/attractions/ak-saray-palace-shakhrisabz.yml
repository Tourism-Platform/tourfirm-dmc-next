      "en": "Give Ak-Saray enough time at the start of the Shakhrisabz walk. The site is open and fragmentary, so the visit is strongest when you notice both what remains and what has disappeared before moving to the courtyards and memorial complexes."
      "ru": "Ак-Сараю нужно дать время в начале прогулки по Шахрисабзу. Место открытое и фрагментарное, поэтому оно сильнее, когда вы видите и сохранившееся, и утраченное перед переходом к дворам и мемориальным комплексам."
      "uz": "Shahrisabz sayrining boshida Ak-Saroyga vaqt bering. Joy ochiq va bo‘laklar holida saqlangan; shuning uchun hovlilar va memorial majmualarga o‘tishdan oldin saqlangan va yo‘qolgan qismlarni birga ko‘rish muhim."
