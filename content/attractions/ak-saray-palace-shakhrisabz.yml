    "description":
      "en": "Ak-Saray matters because it gives Shakhrisabz a clear Timurid beginning. The palace is fragmentary, but the surviving walls, tilework, inscriptions, and the open square make the lost complex understandable without pretending it is complete."
      "ru": "Ак-Сарай важен потому, что даёт Шахрисабзу ясное тимуридское начало. Дворец фрагментарен, но уцелевшие стены, майолика, надписи и открытая площадь помогают понять утраченный комплекс без иллюзии полной сохранности."
      "uz": "Ak-Saroy muhim, chunki Shahrisabzga aniq temuriy boshlanish beradi. Saroy bo‘laklar holida, lekin saqlangan devorlar, koshin, yozuv izlari va ochiq maydon yo‘qolgan majmuani to‘liq saqlangandek ko‘rsatmasdan tushunishga yordam beradi."
  - "blockType": "regular"
