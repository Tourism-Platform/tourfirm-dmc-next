    "description":
      "en": "The view changes with distance: first the standing portal walls, then the worn blue ornament, then the square that keeps the palace in the city."
      "ru": "С расстоянием меняется и взгляд: сначала уцелевшие стены портала, затем потёртый синий орнамент, затем площадь, которая оставляет дворец внутри города."
      "uz": "Masofa o‘zgargan sari nigoh ham o‘zgaradi: avval saqlangan peshtoq devorlari, keyin yeyilgan ko‘k naqsh, keyin saroyni shahar ichida ushlab turgan maydon."
