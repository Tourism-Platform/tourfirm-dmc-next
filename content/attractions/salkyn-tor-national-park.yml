      "en": "Plan Salkyn-Tor through a fresh local access check, not as a fixed sightseeing slot. Weather, road condition, trail clarity, and protected-area rules decide whether the stop feels easy or forced."
      "ru": "Планируйте Салкын-Тор через свежую местную проверку доступа, а не как фиксированную остановку. Погода, состояние дороги, понятность троп и правила территории решают, будет ли выезд лёгким или лишним."
      "uz": "Salkyn-Torni qatʼiy tomosha toʻxtashi sifatida emas, yangi mahalliy kirish tekshiruvi bilan rejalang. Ob-havo, yoʻl holati, soʻqmoq aniqligi va hudud qoidalari tashrif oson yoki ortiqcha boʻlishini belgilaydi."
