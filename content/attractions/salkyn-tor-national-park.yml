  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "A quick turn from city streets to protected slopes"
      "ru": "Быстрый переход от городских улиц к охраняемым склонам"
      "uz": "Shahar koʻchalaridan muhofaza yonbagʻirlariga tez oʻtish"
    "description":
      "en": "Salkyn-Tor lets a Naryn stay breathe without sending the whole journey far from town. It can add fresh air, a gorge walk, and a conservation setting near the city, while Song-Kul and Tash Rabat remain separate highland routes.


        «The point is not another long highland promise; it is mountain air close enough to Naryn to keep the wider route calm.»"
      "ru": "Салкын-Тор даёт остановке в Нарыне больше воздуха, не уводя весь маршрут далеко от города. Здесь можно добавить свежий воздух, прогулку в ущелье и природоохранный смысл рядом с Нарыном, а Сон-Куль и Таш-Рабат оставить отдельными высокогорными маршрутами.


        «Смысл Салкын-Тора не в ещё одном дальнем высокогорном обещании, а в горном воздухе рядом с Нарыном, который не ломает маршрут.»"
      "uz": "Salkyn-Tor Norindagi toʻxtashga nafas beradi, lekin butun yoʻnalishni shahardan uzoqqa olib ketmaydi. U shaharga yaqin toza havo, dara boʻylab yurish va tabiatni muhofaza qilish mazmunini qoʻshadi; Song-Koʻl va Tash Rabat esa alohida baland togʻ yoʻllari boʻlib qoladi.


        «Salkyn-Torning maʼnosi yana bir uzoq baland togʻ vaʼdasida emas, balki Noringa yaqin togʻ havosida.»"
