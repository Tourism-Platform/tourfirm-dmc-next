      "en": "Expect a modest protected-area outing rather than a built resort. The strongest details are landscape, air, water, and the knowledge that the place is managed as a nature park."
      "ru": "Ожидайте скромный природный выезд, а не благоустроенный курорт. Главные детали здесь - ландшафт, воздух, вода и понимание, что территория управляется как природный парк."
      "uz": "Bu joyni katta kurort emas, ixcham muhofaza hududiga chiqish sifatida tasavvur qiling. Bu yerda eng kuchli belgilar - manzara, havo, suv va hudud tabiat bogʻi sifatida boshqarilishini tushunish."
