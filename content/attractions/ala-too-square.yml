"excerpt":
  "en": "Ala-Too Square is the broad public room at the center of Bishkek: flags, fountains, formal buildings, the State History Museum nearby, and the Tian Shan line beyond the city when the air is clear. For a first visit, it gives the capital a quick spatial shape before the walk continues into a museum, park, cafe street, or Osh Bazaar."
  "ru": "Площадь Ала-Тоо — широкое общественное пространство в центре Бишкека: флаги, фонтаны, официальные здания, рядом Государственный исторический музей, а при ясной погоде за городом виден Тянь-Шань. В первый визит она быстро даёт столице форму, а дальше прогулка естественно продолжается к музею, парку, улицам с кафе или Ошскому базару."
  "uz": "Ala-Too maydoni Bishkek markazidagi keng jamoat makoni: bayroqlar, fontanlar, rasmiy binolar, yaqindagi Davlat tarixi muzeyi va havo ochiq paytda shahar ortidagi Tyan-Shan chizigʻi. Birinchi tashrifda u poytaxtni tez anglashga yordam beradi, keyin yurish muzey, park, kafeli koʻcha yoki Oʻsh bozori tomonga davom etadi."
