      "uz": "Bishkekka birinchi shakl beradigan maydon"
    "description":
      "en": "Ala-Too Square is not a deep historical visit on its own; its value is orientation. It shows the scale of the capital, the official city center, and the mountains beyond it in one open view.


        «The square gives Bishkek a first outline before the city becomes more human in its streets, parks, and markets.»"
      "ru": "Площадь Ала-Тоо сама по себе не заменяет глубокого исторического визита; её ценность в ориентации. В одном открытом виде она показывает масштаб столицы, официальный центр и горы за городом.


        «Площадь даёт Бишкеку первый контур, а дальше город становится живее в улицах, парках и рынках.»"
      "uz": "Ala-Too maydoni oʻzi alohida chuqur tarixiy tashrif emas; uning qiymati moʻljalda. U poytaxt miqyosini, rasmiy markazni va shahar ortidagi togʻlarni bitta ochiq manzarada koʻrsatadi.


        «Maydon Bishkekka birinchi kontur beradi, keyin shahar koʻchalar, parklar va bozorlarda jonliroq ochiladi.»"
