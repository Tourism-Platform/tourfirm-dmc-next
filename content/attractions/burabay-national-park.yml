  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "Where the steppe route reaches forest and water"
      "ru": "Где степной маршрут приходит к лесу и воде"
      "uz": "Dasht yoʻli oʻrmon va suvga yetadigan joy"
    "description":
      "en": "Burabay National Park is the main reason the Astana route turns north. The protected landscape gathers pine forest, lake shores, rock silhouettes, and resort access into a nature stay that feels distinct from the capital and the open Akmola steppe.


        «Burabay is strongest when the route slows down: pine shade, lake wind, and one or two viewpoints chosen with care.»"
      "ru": "Национальный парк Бурабай — главная причина, по которой маршрут из Астаны поворачивает на север. Охраняемый ландшафт собирает сосновый лес, берега озёр, скальные силуэты и курортный доступ в природную остановку, которая отличается и от столицы, и от открытой Акмолинской степи.


        «Бурабай сильнее всего, когда маршрут замедляется: сосновая тень, озёрный ветер и одна-две смотровые, выбранные с вниманием.»"
      "uz": "Burabay milliy bogʻi Ostona yoʻnalishining shimolga burilishidagi asosiy sababdir. Qoʻriqlanadigan manzara qaragʻayzor, koʻl qirgʻoqlari, qoya siluetlari va kurort kirishini poytaxt hamda ochiq Aqmola dashtidan farq qiladigan tabiat toʻxtashiga jamlaydi.


        «Burabay yoʻnalish sekinlashganda kuchliroq ochiladi: qaragʻay soyasi, koʻl shamoli va eʼtibor bilan tanlangan bir-ikki manzara nuqtasi.»"
  - "blockType": "regular"
