      "ru": "Бурабай раскрывается через несколько простых элементов: лесную тень после степи, берега озёр, которые открывают вид, и скальные формы, по которым узнаётся парк."
      "uz": "Burabay bir necha oddiy element orqali ochiladi: dashtdan keyingi oʻrmon soyasi, manzarani ochadigan koʻl qirgʻoqlari va parkni tanitadigan qoya shakllari."
