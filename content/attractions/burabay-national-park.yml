  "en": "After the open road north from Astana, Burabay feels like a sudden change of air. Pines close around the lakes, granite forms lift over the water, and the stop starts to feel like its own nature stay rather than a quick add-on after the capital. Before you choose a lake edge, forest path, or viewpoint, current local checks for season, paths, access, and crowding still matter."
  "ru": "После открытой дороги к северу от Астаны Бурабай ощущается как резкая смена воздуха. Сосны смыкаются вокруг озёр, гранитные формы поднимаются над водой, и остановка начинает восприниматься как отдельный природный выезд, а не короткое дополнение после столицы. Перед выбором берега, лесной тропы или смотровой всё равно нужны актуальные проверки сезона, троп, доступа и загруженности."
  "uz": "Ostonadan shimolga ochiq yoʻldan keyin Burabay havosi birdan oʻzgaradi. Qaragʻaylar koʻllar atrofini oʻrab oladi, granit shakllar suv ustida koʻtariladi, va bu toʻxtash poytaxtdan keyingi tez qoʻshimcha emas, alohida tabiat safari kabi tuyula boshlaydi. Koʻl qirgʻogʻi, oʻrmon yoʻli yoki manzara nuqtasini tanlashdan oldin mavsum, yoʻllar, kirish va gavjumlik boʻyicha joriy mahalliy tekshiruvlar baribir muhim."
