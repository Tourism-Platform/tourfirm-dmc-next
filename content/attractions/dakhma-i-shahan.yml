      "en": "After the palace, family memory"
      "ru": "После дворца — семейная память"
      "uz": "Saroydan keyin oilaviy xotira"
    "description":
      "en": "Khudoyar Khan Palace shows the public side of the Kokand Khanate. Dakhma-i-Shahan changes the scale: through carved wood you enter a courtyard with family burials, Quranic inscriptions, and the memory of Nodira and Umarkhan."
      "ru": "Дворец Худояр-хана показывает публичную сторону Кокандского ханства. Дахма-и-Шахан меняет масштаб: через резное дерево вы входите во двор с семейными захоронениями, надписями из Корана и памятью о Нодире и Умархане."
      "uz": "Xudoyorxon saroyi Qoʻqon xonligining ommaviy tomonini ko‘rsatadi. Daxmai Shohon miqyosni o‘zgartiradi: oʻyma yogʻoch orqali oilaviy qabrlar, Qurʼon yozuvlari, Nodira va Umarxon xotirasi bor hovliga kirasiz."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Portal, courtyard, memorial details"
      "ru": "Портал, двор, мемориальные детали"
      "uz": "Peshtoq, hovli, memorial detallar"
    "description":
      "en": "Move in order: the carved entrance, inner courtyard, burials, small mosque, and decorative work in wood and ganch."
      "ru": "Сначала смотрите резной вход, затем внутренний двор, захоронения, небольшую мечеть и декоративную работу по дереву и ганчу."
      "uz": "Ketma-ket ko‘ring: oʻyma kirish, ichki hovli, qabrlar, kichik masjid va yogʻoch hamda ganch bezaklari."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как смотреть"
      "uz": "Qanday ko‘rish kerak"
    "title":
      "en": "Visit it as a memorial place"
      "ru": "Посещать как мемориальное место"
      "uz": "Memorial joy sifatida ko‘ring"
    "description":
      "en": "The complex is compact, but it needs a respectful order: entrance, courtyard, burials, inscriptions, and a short context for Nodira and the Kokand khans."
      "ru": "Комплекс компактный, но ему нужен уважительный порядок: вход, двор, захоронения, надписи и короткий контекст о Нодире и кокандских ханах."
      "uz": "Majmua ixcham, lekin unga hurmatli tartib kerak: kirish, hovli, qabrlar, yozuvlar hamda Nodira va Qoʻqon xonlari haqida qisqa kontekst."
