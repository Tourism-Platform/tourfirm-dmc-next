  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "Where Nisa's fortress form becomes visible"
      "ru": "Где видна крепостная форма Нисы"
      "uz": "Nisa qalʼa shakli koʻrinadigan joy"
    "description":
      "en": "Old Nisa gives the UNESCO property a clear focal point. The earthworks are modest in height, but they hold the royal name Mithradatkert, defensive lines, and ritual memory in one walk.


        «Old Nisa is most powerful when you treat the quiet ground as the beginning of the Parthian story, not as another ruin on a list.»"
      "ru": "Старая Ниса даёт объекту ЮНЕСКО ясный фокус. Земляные стены невысоки, но в одной прогулке держат имя Митридаткерт, оборонительные линии и память о ритуалах.


        «Старая Ниса раскрывается сильнее, когда тихий грунт воспринимаешь как начало парфянской истории, а не как ещё одну руину в списке.»"
      "uz": "Eski Nisa YUNESKO obyektiga aniq markaz beradi. Yer devorlari baland emas, lekin Mitridatkert nomi, mudofaa chiziqlari va marosim xotirasini bitta sayrda ushlab turadi.


        «Eski Nisa sokin zaminni roʻyxatdagi yana bir xaroba emas, Parfiya hikoyasining boshlanishi sifatida koʻrganingizda kuchliroq.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni koʻrasiz"
    "title":
      "en": "Wall lines, open ground, and royal memory"
      "ru": "Стены, открытый грунт и царская память"
      "uz": "Devor chiziqlari, ochiq zamin va shohlik xotirasi"
    "description":
      "en": "The visible elements are restrained: defensive lines at ground level, bare earth, and the royal name that gives the site its focus."
      "ru": "Видимые элементы сдержанные: оборонительные линии у земли, открытый грунт и царское имя, которое удерживает фокус места."
      "uz": "Koʻrinadigan unsurlar soddaroq: yer sathidagi mudofaa chiziqlari, yalang zamin va joyga fokus beradigan shohlik nomi."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посещать"
      "uz": "Qanday ko‘rish"
    "title":
      "en": "Walk slowly and protect the site"
      "ru": "Идите медленно и берегите место"
      "uz": "Sekin yuring va joyni asrang"
    "description":
      "en": "Old Nisa asks for a careful pace. Stay on permitted paths, avoid touching the earthworks, and leave enough time for the missing architecture to be explained without rushing."
      "ru": "Старой Нисе нужен осторожный темп: оставайтесь на разрешённых проходах, не трогайте земляные стены и оставьте время для объяснения исчезнувшей архитектуры."
      "uz": "Eski Nisa ehtiyotkor surʼatni talab qiladi: ruxsat etilgan yoʻlaklarda qoling, yer devorlariga tegmang va yoʻqolgan meʼmorchilikni tushuntirishga vaqt qoldiring."
