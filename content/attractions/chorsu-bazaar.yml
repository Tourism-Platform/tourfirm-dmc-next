"excerpt":
  "en": "Chorsu makes old Tashkent immediate: a blue dome above the market, bread steam at the entrances, sellers behind dairy, dried fruit, spices, and hot-food rows. Before the quieter courtyards of Kukeldash or Khast Imam, the city feels lived-in and close."
  "ru": "Чорсу сразу показывает старый Ташкент: синий купол над рынком, пар от лепёшек у входов, продавцы за молочными рядами, сухофруктами, специями и горячей едой. Перед более тихими дворами Кукельдаша или Хазрати Имам город ощущается живым и близким."
  "uz": "Chorsu eski Toshkentni darhol yaqinlashtiradi: bozor ustidagi ko‘k gumbaz, kirishlardagi non isi, sut mahsulotlari, quruq mevalar, ziravorlar va issiq taomlar ortidagi sotuvchilar. Ko‘kaldosh yoki Hazrati Imomning sokinroq hovlilaridan oldin shahar tirik va yaqin seziladi."
