    description:
      en: "Best in the morning when bread, spices and fruit stalls are at their liveliest. The dome hall is the visual anchor; outer lanes add crafts and local snacks. Pair with Khazrati Imam Complex in the same old-city half-day."
      ru: "Лучше утром, когда хлеб, специи и фрукты особенно живые. Купольный зал — визуальный центр; внешние ряды добавляют ремёсла и местные закуски. Сочетайте с комплексом Хазрати Имам в одной половине дня по старому городу."
      uz: "Ertalab non, ziravorlar va meva do'konlari eng jonli bo'lganda yaxshi. Gumbazli zal vizual markaz; tashqi qatorlar hunarmandchilik va mahalliy taomlarni qo'shadi. Eski shaharda yarim kunlik sayrda Hazrati Imom majmuasi bilan birlashtiring."
