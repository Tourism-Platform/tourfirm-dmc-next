  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "The market that gives old Tashkent its movement"
      "ru": "Рынок, который даёт старому Ташкенту движение"
      "uz": "Eski Toshkentga harakat beradigan bozor"
    "description":
      "en": "Chorsu matters because it brings daily life into the Tashkent route. The capital can feel broad and modern at first; here it gathers around counters, voices, baskets, smells, bargaining, and a market tradition tied to one of the city's oldest crossroads.


        «At Chorsu, Tashkent is not introduced by a monument first; it is introduced by bread, voices, spices, and the blue dome.»"
      "ru": "Чорсу важен потому, что возвращает повседневную жизнь в маршрут по Ташкенту. С первого взгляда столица может казаться широкой и современной; здесь она собирается вокруг прилавков, голосов, корзин, запахов, торга и рыночной традиции одного из старых перекрёстков города.


        «На Чорсу Ташкент сначала представляется не памятником, а хлебом, голосами, специями и синим куполом.»"
      "uz": "Chorsu muhim, chunki u Toshkent marshrutiga kundalik hayotni olib kiradi. Poytaxt birinchi qarashda keng va zamonaviy ko‘rinishi mumkin; bu yerda u rastalar, ovozlar, savatlar, hidlar, savdolashuv va shaharning eski chorrahalaridan biriga bog‘langan bozor anʼanasi atrofida jamlanadi.


        «Chorsuda Toshkent sizni avval yodgorlik bilan emas, non, ovozlar, ziravorlar va ko‘k gumbaz bilan kutib oladi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Blue dome, market entrance, and city movement"
      "ru": "Синий купол, вход на рынок и движение города"
      "uz": "Ko‘k gumbaz, bozor kirishi va shahar harakati"
    "description":
      "en": "From outside, Chorsu first reads as a city landmark: turquoise dome, arched entrances, people arriving, and the open space before the market pulls you into its rows."
      "ru": "Снаружи Чорсу сначала воспринимается как городской ориентир: бирюзовый купол, арочные входы, люди у входа и открытое пространство перед тем, как рынок втягивает вас в свои ряды."
      "uz": "Tashqaridan Chorsu avval shahar mo‘ljali sifatida ko‘rinadi: feruza gumbaz, ravoqli kirishlar, kelayotgan odamlar va bozor sizni rastalariga tortishidan oldingi ochiq maydon."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посещать"
      "uz": "Qanday ko‘rish"
    "title":
      "en": "Let the market set the pace before the next old-city stop"
      "ru": "Дайте рынку задать темп перед следующей остановкой старого города"
      "uz": "Keyingi eski shahar bekatidan oldin bozor surʼatini his qiling"
    "description":
      "en": "Chorsu is strongest when it stays a market, not a rushed shopping errand. Walk slowly, keep purchases optional, ask before photographing people or counters, and let the clearest food rows shape the visit on the day."
      "ru": "Чорсу сильнее всего, когда остаётся рынком, а не быстрой остановкой за покупками. Идите спокойно, не превращайте покупки в обязанность, спрашивайте перед съёмкой людей или прилавков и выбирайте самые понятные ряды с едой по ситуации в день визита."
      "uz": "Chorsu tez xarid bekati emas, haqiqiy bozor sifatida qolganda kuchli. Sekin yuring, xaridni majburiy qilmang, odamlar yoki peshtaxtalarni suratga olishdan oldin so‘rang va eng ravshan taom rastalarini tashrif kunidagi holatga qarab tanlang."
  - "blockType": "regular"
    "eyebrow":
