    "description":
      "en": "Khast Imam gives the old-city route its quieter side after Chorsu: courtyards, tiled portals, manuscript tradition, and religious etiquette after the market's food and movement."
      "ru": "После Чорсу Хазрати Имам показывает более тихую сторону старого города: дворы, мозаичные порталы, рукописную традицию и религиозный этикет после рыночной еды и движения."
      "uz": "Chorsudan keyin Hazrati Imom eski shaharning sokinroq tomonini ko‘rsatadi: hovlilar, koshinli peshtoqlar, qo‘lyozmalar anʼanasi va bozor taomi hamda harakatidan keyingi diniy odob."
