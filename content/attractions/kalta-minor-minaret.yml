      "uz": "Kalta Minor Xiva miqyosini ko‘chaga yaqinlashtirgani uchun muhim. Belgini yaqindan ko‘rasiz: firuza koshin, minoraning keng egri shakli, yonidagi madrasa devorlari va maydon atrofidagi odamlar harakati."
