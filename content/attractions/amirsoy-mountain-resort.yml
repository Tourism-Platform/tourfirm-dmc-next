  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "A modern mountain stop above Chimgan"
      "ru": "Современная горная остановка над Чимганом"
      "uz": "Chimyon ustidagi zamonaviy tog‘ bekati"
    "description":
      "en": "Amirsoy brings a resort-shaped mountain pause into the Tashkent-and-Chimgan route. The draw is not only snow: the road climbs toward the Chatkal foothills, the resort covers the northern hillsides of Maygashkan, and mixed groups can reach mountain views without turning the whole outing into a trail day.


        «Plan Amirsoy around mountain air first; let lifts, snow, and activities join only when the day allows.»"
      "ru": "Амирсой добавляет к маршруту Ташкент-Чимган курортную горную паузу. Его притяжение не только в снеге: дорога поднимается к предгорьям Чаткальского хребта, курорт занимает северные склоны Майгашкана, а группы с разным темпом могут увидеть горы без обязательного треккинга на весь день.


        «Планируйте Амирсой вокруг горного воздуха; подъёмники, снег и активности добавляйте только тогда, когда день это позволяет.»"
      "uz": "Amirsoy Toshkent-Chimyon yo‘liga kurort ruhidagi tog‘ pauzasini qo‘shadi. Uning qiziq tomoni faqat qor emas: yo‘l Chotqol tog‘oldiga ko‘tariladi, kurort Maygashkanning shimoliy yonbag‘irlarini egallaydi, turli sur’atdagi guruhlar esa butun kunlik piyoda yo‘lsiz ham tog‘ manzaralariga chiqishi mumkin.


        «Amirsoyni avvalo tog‘ havosi atrofida rejalang; liftlar, qor va faoliyatlar faqat kun imkon berganda qo‘shilsin.»"
  - "blockType": "regular"
    "eyebrow":
