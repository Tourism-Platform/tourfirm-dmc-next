    "description":
      "en": "The visual story should stay honest to the Chimgan setting: the resort road, nearby slopes, winter ridges, and the mountain approach that makes Amirsoy part of a wider foothill outing."
      "ru": "Визуальный ряд должен оставаться честным к Чимганскому контексту: дорога к курорту, близкие склоны, зимние хребты и горный подъезд, который делает Амирсой частью большого выезда в предгорья."
      "uz": "Vizual hikoya Chimyon kontekstiga sodiq qolishi kerak: kurort yo‘li, yaqin yonbag‘irlar, qishki tizmalar va Amirsoyni kengroq tog‘oldi safariga bog‘laydigan tog‘ga yondashuv."
