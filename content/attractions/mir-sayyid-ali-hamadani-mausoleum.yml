"excerpt":
  "en": "Mir Sayyid Ali Hamadani Mausoleum is the quiet turn in Kulob's city route. The shrine keeps the memory of a 14th-century poet, scholar, philosopher, and Sufi figure, and its garden setting asks for a slower, more respectful visit. Come with modest dress, ask locally which areas are appropriate for visitors, and let the stop sit beside the bazaar, museum, Ismoil Somoni square, and the road toward Hulbuk."
  "ru": "В маршруте по Кулябу мавзолей — момент, когда город становится тише. Святыня хранит память о поэте, ученом, философе и суфийской фигуре XIV века, а садовое окружение просит более медленного и уважительного визита. Приходите в скромной одежде, уточняйте на месте, какие зоны подходят для гостей, и воспринимайте остановку рядом с базаром, музеем, площадью Исмоила Сомони и дорогой к Хульбуку."
  "uz": "Mir Sayyid Ali Hamadani maqbarasi Kulob marshrutidagi sokin burilishdir. Ziyoratgoh XIV asr shoiri, olimi, faylasufi va sufiy siymosi xotirasini saqlaydi; bog' muhiti esa sekinroq va hurmatliroq tashrifni talab qiladi. Kamtarona kiyinib boring, mehmonlar uchun qaysi joylar mosligini joyida so'rang va maqbarani bozor, muzey, Ismoil Somoniy maydoni hamda Xulbuk yo'li bilan birga ko'ring."
