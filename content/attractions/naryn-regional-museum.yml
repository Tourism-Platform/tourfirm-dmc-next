    "description":
      "en": "This is not a major museum that carries a whole day. It belongs as a focused stop inside Naryn: enough time to see regional craft, nomadic household objects, local history, and mountain-road meaning before dinner or the next road check.


        «The museum is useful because it makes the highland road feel connected to people and objects, not only to distance.»"
      "ru": "Это не крупный музей на полдня. Он уместен как точная остановка в Нарыне: достаточно времени, чтобы увидеть ремесло, кочевой быт, локальную историю и смысл горных дорог перед ужином или проверкой следующего выезда.


        «Музей полезен тем, что связывает высокогорную дорогу с людьми и предметами, а не только с расстоянием.»"
      "uz": "Bu yarim kunlik katta muzey emas. U Norin ichidagi aniq to‘xtash sifatida mos keladi: kechki ovqat yoki keyingi yo‘l tekshiruvigacha hunarmandchilik, ko‘chmanchi turmush, mahalliy tarix va togʻ yoʻllari maʼnosini bir joyda ko‘rish uchun yetarli vaqt.


        «Muzey baland togʻ yo‘lini faqat masofa bilan emas, odamlar va buyumlar bilan bog‘lagani uchun foydali.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
