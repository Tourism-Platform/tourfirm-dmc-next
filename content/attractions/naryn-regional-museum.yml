    "description":
      "en": "Expect a modest regional museum where the meaning comes through objects rather than scale: felt work, household tools, yurt references, and local-history displays."
      "ru": "Ожидайте небольшой региональный музей, где смысл раскрывают предметы, а не масштаб: войлок, бытовые вещи, юртовые мотивы и локальные исторические экспозиции."
      "uz": "Katta ko‘lamdan ko‘ra buyumlari bilan gapiradigan kamtar mintaqaviy muzeyni kuting: kigiz, uy-ro‘zg‘or ashyolari, oʻtovga oid belgilar va mahalliy tarix ekspozitsiyalari."
