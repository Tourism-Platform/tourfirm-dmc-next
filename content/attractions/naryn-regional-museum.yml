      "ru": "Посещайте музей как короткую городскую остановку в Нарыне. Поскольку публичных источников немного, а программы могут меняться, часы, билеты, язык сопровождения и любые кулинарные или кинопоказы нужно подтверждать до обещания в маршруте."
