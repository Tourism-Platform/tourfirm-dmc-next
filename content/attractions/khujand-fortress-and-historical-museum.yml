    "description":
      "en": "The gallery should move from the fortress exterior to the museum collection and then to the local story that keeps the site tied to Khujand. 1. **Fortress walls and towers** **alt:** Khujand Fortress walls and towers in central Khujand. **caption:** The exterior sets the scale before the visit moves toward the museum rooms. **media_label:** Fortress exterior 2. **Museum rooms** **alt:** Museum rooms with Sogdian-region artifacts in Khujand. **caption:** Textiles, mosaics, dioramas, and regional objects add meaning beyond the fortress walls. **media_label:** Museum collection 3. **Temurmalik memory** **alt:** Temurmalik story inside the Khujand fortress museum. **caption:** The local hero memory keeps the fortress tied to Khujand's own story. **media_label:** Temurmalik story"
      "ru": "Взгляд движется от внешней формы крепости к музейной коллекции, а затем к местной памяти, которая удерживает место внутри Худжанда. 1. **Крепостные стены и башни** **alt:** Стены и башни Худжандской крепости в центре Худжанда. **caption:** Внешний контур задаёт масштаб перед переходом к музейным залам. **media_label:** Внешний вид крепости 2. **Музейные залы** **alt:** Залы исторического музея с артефактами Согдийского региона в Худжанде. **caption:** Ткани, мозаики, диорамы и региональные предметы дают больше смысла, чем один вид на стены. **media_label:** Музейная коллекция 3. **Память Темурмалика** **alt:** Темурмалик в музее Худжандской крепости. **caption:** Память местного героя удерживает крепость внутри собственной истории Худжанда. **media_label:** История Темурмалика"
      "uz": "Koʻrish qalʼaning tashqi shaklidan muzey kolleksiyasiga, keyin esa bu joyni Xoʻjandga bogʻlab turadigan mahalliy hikoyaga oʻtadi. 1. **Qalʼa devorlari va minoralari** **alt:** Markaziy Xoʻjanddagi Xoʻjand qalʼasi devorlari va minoralari. **caption:** Tashqi koʻrinish muzey xonalariga oʻtishdan oldin miqyosni belgilaydi. **media_label:** Qalʼaning tashqi koʻrinishi 2. **Muzey xonalari** **alt:** Xoʻjanddagi Sugʻd mintaqasi artefaktlari bor muzey xonalari. **caption:** Matolar, mozaikalar, dioramalar va mintaqaviy buyumlar devorlardan naridagi kontekstni ochadi. **media_label:** Muzey kolleksiyasi 3. **Temurmalik xotirasi** **alt:** Xoʻjand qalʼasi muzeyidagi Temurmalik konteksti. **caption:** Mahalliy qahramon xotirasi qalʼani Xoʻjandning oʻz hikoyasi bilan bogʻlaydi. **media_label:** Temurmalik hikoyasi"
