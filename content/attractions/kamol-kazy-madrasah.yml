      "en": "Jami Mosque, Norbut-biy Madrasah, Dakhma-i-Shahan, and Modari Khan Mausoleum connect the madrasah to prayer, study, and khan-family memory in central Kokand."
      "ru": "Мечеть Джами, медресе Норбут-бия, Дахма-и-Шахан и Модари-хан связывают Камол-Казы с молитвенным двором, учёбой и ханской памятью центрального Коканда."
      "uz": "Jome masjidi, Norboʻtabiy madrasasi, Daxmai Shohon va Modari Xon Komol Qozini namoz hovlisi, taʼlim va markaziy Qoʻqonning xonlik xotirasi bilan bogʻlaydi."
