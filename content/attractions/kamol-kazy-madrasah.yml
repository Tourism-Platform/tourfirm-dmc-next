      "en": "A madrasah courtyard near Jami"
      "ru": "Медресе рядом с Джами"
      "uz": "Jome yonidagi madrasa"
    "description":
      "en": "The palace gives Kokand its ceremonial scale. Around Jami, the visit turns to a prayer courtyard and wooden columns. Kamol-Kazy adds the educational side of the historic center: a decorated portal, square courtyard, hujras, a darskhona, and a mosque-ayvan."
      "ru": "Дворец задаёт торжественный масштаб Коканда. У Джами маршрут переходит к молитвенному двору и деревянным колоннам. Камол-Казы добавляет учебную сторону исторического центра: портал, квадратный двор, худжры, дарсхону и мечеть-айван."
      "uz": "Saroy Qoʻqonga tantanali ko‘lam beradi. Jome atrofida yo‘l namoz hovlisi va yogʻoch ustunlarga o‘tadi. Komol Qozi tarixiy markazning taʼlim tomonini qo‘shadi: peshtoq, kvadrat hovli, hujralar, darsxona va masjid-ayvon."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Portal, hujras, and courtyard detail"
      "ru": "Портал, худжры и детали двора"
      "uz": "Peshtoq, hujralar va hovli detallari"
    "description":
      "en": "Kamol-Kazy is best seen close up: the decorated entrance, courtyard edges, hujras, brickwork, and ganch detail that connect the stop to Kokand's study architecture."
      "ru": "Камол-Казы лучше смотреть вблизи: украшенный вход, края двора, худжры, кирпич и детали ганча связывают остановку с учебной архитектурой Коканда."
      "uz": "Komol Qozini yaqindan ko‘rish maʼqul: bezakli kirish, hovli chetlari, hujralar, pishiq gʻisht va ganch detallari bekatni Qoʻqonning taʼlim meʼmorchiligi bilan bogʻlaydi."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посетить"
      "uz": "Qanday tashrif buyurish"
    "title":
      "en": "Give the madrasah a clear, respectful stop"
      "ru": "Посмотрите медресе спокойно и уважительно"
      "uz": "Madrasani osoyishta va hurmat bilan ko‘ring"
    "description":
      "en": "The visit is compact, but it deserves more than a pass-by between larger monuments. Leave time for the entrance, courtyard, hujras, and current access rules."
      "ru": "Остановка короткая, но её не стоит проходить только по пути между крупными памятниками. Оставьте время для входа, двора, худжр и правил доступа."
      "uz": "Tashrif qisqa, lekin uni yirik yodgorliklar orasidagi yo‘l-yo‘lakay bekatga aylantirmang. Kirish, hovli, hujralar va kirish qoidalariga vaqt qoldiring."
