    "description":
      "en": "The stop is best understood in three simple views: the lower-lake colour, the Shing Valley approach, and the road continuing toward the next lakes. 1. **Lower-lake colour** **alt:** Mijgon Lake water below the lower Seven Lakes road in Tajikistan. **caption:** Mijgon gives the Haftkul route its first visible colour change. **media_label:** Mijgon water and valley setting 2. **Shing Valley approach** **alt:** The road approach toward Mijgon Lake in the Shing Valley above Penjikent. **caption:** The approach through the lived valley makes the first water view feel different. **media_label:** Shing Valley approach 3. **Road onward** **alt:** The Seven Lakes road continuing from Mijgon toward the middle lakes. **caption:** After Mijgon, the route opens toward wider water at Marguzor. **media_label:** Road toward Marguzor"
      "ru": "Эту остановку проще читать через три вида: цвет нижнего озера, подход по долине Шинг и дорогу, которая продолжается к следующим озёрам. 1. **Цвет нижнего озера** **alt:** Вода озера Мижгон ниже дороги Семи озёр в Таджикистане. **caption:** Мижгон даёт маршруту Хафткуль первую заметную смену цвета. **media_label:** Вода Мижгона и долина 2. **Подход через долину Шинг** **alt:** Дорога к озеру Мижгон через долину Шинг над Пенджикентом. **caption:** Подъезд через живую долину меняет ощущение первого вида на воду. **media_label:** Подход через долину Шинг 3. **Дорога дальше** **alt:** Дорога Семи озёр от Мижгона к средним озёрам. **caption:** После Мижгона маршрут раскрывается к более широкой воде Маргузора. **media_label:** Дорога к Маргузору"
      "uz": "Bu toʻxtashni uch oddiy koʻrinish orqali tushunish oson: pastki koʻl rangi, Shing vodiysi orqali yondashuv va keyingi koʻllarga ketadigan yoʻl. 1. **Pastki koʻl rangi** **alt:** Tojikistondagi Yetti Koʻl yoʻli pastida Mijgon ko‘li suvi. **caption:** Mijgon Haftkoʻl yoʻliga birinchi ko‘rinadigan rang almashinuvini beradi. **media_label:** Mijgon suvi va vodiy muhiti 2. **Shing vodiysi orqali yondashuv** **alt:** Panjikent ustidagi Shing vodiysi orqali Mijgon ko‘liga boradigan yoʻl. **caption:** Yashaydigan vodiy orqali kelish birinchi suv manzarasini boshqacha his qildiradi. **media_label:** Shing vodiysi yondashuvi 3. **Davom etadigan yoʻl** **alt:** Mijgondan oʻrta koʻllar tomon davom etadigan Yetti Koʻl yoʻli. **caption:** Mijgondan keyin yoʻl Marguzorning kengroq suvi tomon ochiladi. **media_label:** Marguzor tomon yoʻl"
