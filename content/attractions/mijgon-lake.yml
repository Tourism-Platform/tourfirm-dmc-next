      "en": "Where Haftkul first becomes water"
      "ru": "Где Хафткуль впервые становится озёрной дорогой"
      "uz": "Haftkoʻl ilk bor suv bilan ochiladigan joy"
    "description":
      "en": "Mijgon matters because it is the first lake where the Seven Lakes road stops feeling like an approach. The pause can be short, but it gives travelers the first colour and valley setting of the Haftkul sequence.


        «Mijgon is not the largest lake; it is the first moment when Haftkul asks you to slow down.»"
      "ru": "Мижгон важен как первое озеро, после которого дорога Семи озёр перестаёт быть только подъездом. Остановка может быть короткой, но именно здесь появляется первый цвет воды и ощущение долины Хафткуль.


        «Мижгон не самое большое озеро, но именно здесь Хафткуль впервые просит сбавить скорость.»"
      "uz": "Mijgon muhim, chunki Yetti Koʻl yoʻli shu yerda faqat yondashuv boʻlib qolmaydi. Toʻxtash qisqa boʻlishi mumkin, lekin aynan shu joyda Haftkoʻl ketma-ketligining birinchi rangi va vodiy hissi paydo boʻladi.


        «Mijgon eng katta koʻl emas, lekin Haftkoʻl birinchi marta aynan shu yerda sekinlashishni soʻraydi.»"
