    "description":
      "en": "Mizdakhan is a cemetery and pilgrimage place as well as an archaeological site. Keep the visit quiet, allow time for the hills and mausoleums, and treat legends as local belief rather than proof."
      "ru": "Миздакхан — кладбище и место паломничества, а не только археологический объект. Смотрите его спокойно, оставляйте внимание холмам и мавзолеям, а предания воспринимайте как местную веру, не как доказанный факт."
      "uz": "Mizdaxon arxeologik joy bo‘lishi bilan birga qabriston va ziyorat hududidir. Tashrifni sokin tuting, tepaliklar va maqbaralarga eʼtibor bering, rivoyatlarni esa isbotlangan fakt emas, mahalliy eʼtiqod sifatida qabul qiling."
