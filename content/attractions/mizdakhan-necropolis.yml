    "title":
      "en": "The open-air stop after Nukus museums"
      "ru": "Открытое место после музеев Нукуса"
      "uz": "Nukus muzeylaridan keyingi ochiq bekat"
    "description":
      "en": "Mizdakhan matters because it changes the scale of the Nukus route. Official tourism sources describe a large archaeological cemetery complex near Khojeyli, with ancient burials, three hills, mazars, and Gyaur-Kala in the wider context. The place asks for attention to both evidence and belief."
      "ru": "Миздакхан важен тем, что меняет масштаб маршрута из Нукуса. Официальные туристические источники описывают большой археологический некрополь у Ходжейли: древние погребения, три холма, мазары и Гяур-Калу в более широком контексте. Здесь нужно различать археологию, местную веру и предания."
      "uz": "Mizdaxon Nukus yo‘nalishining miqyosini o‘zgartirgani uchun muhim. Rasmiy turizm manbalari Xo‘jayli yaqinidagi katta arxeologik qabriston majmuasini, qadimiy dafnlarni, uch tepalikni, mozorlarni va kengroq kontekstdagi Gyaur-Kalani tilga oladi. Bu yerda arxeologiya, mahalliy eʼtiqod va rivoyatni ajratib ko‘rish kerak."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Mausoleum domes, interior tile, and ruined walls"
      "ru": "Купола мавзолеев, интерьерная плитка и руинированные стены"
      "uz": "Maqbara gumbazlari, ichki koshin va vayrona devorlar"
    "description":
      "en": "The images should stay close to the real place: domed mausoleums, an interior tile dome, mud-brick walls, and the dry ground that connects archaeology with pilgrimage."
      "ru": "Фотографии должны оставаться близко к самому месту: купольные мавзолеи, интерьерный бирюзовый купол, глинобитные стены и сухая земля, где археология соседствует с паломническим смыслом."
      "uz": "Suratlar joyning o‘ziga yaqin qolishi kerak: gumbazli maqbaralar, ichki feruza gumbaz, paxsa devorlar va arxeologiya ziyorat maʼnosi bilan yonma-yon turadigan quruq yer."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как проходит визит"
      "uz": "Tashrif qanday kechadi"
    "title":
      "en": "Keep the visit quiet and clear"
      "ru": "Смотрите спокойно и уважительно"
