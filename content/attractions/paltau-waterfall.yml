    "description":
      "en": "The most natural combinations keep the day coherent: Charvak for the reservoir road, Ugam-Chatkal for the protected landscape, Gulkam for a more demanding canyon comparison, and Chimgan Mountains for the broader ridge-and-resort frame."
      "ru": "Самые естественные сочетания сохраняют понятный день: Чарвак даёт дорогу и водохранилище, Угам-Чаткал объясняет охраняемый ландшафт, Гулькам служит сравнением более сложного каньона, а Чимганские горы удерживают широкий хребтово-курортный контекст."
      "uz": "Eng tabiiy qo‘shimchalar kunni tushunarli saqlaydi: Chorvoq suv ombori yo‘lini beradi, Ugom-Chotqol muhofaza landshaftini tushuntiradi, Gulkam murakkabroq kanyon taqqoslashini beradi, Chimyon tog‘lari esa keng tizma va kurort ko‘lamini ushlab turadi."
