  "en": "Paltau suits travelers who want the mountain day to leave the reservoir road and enter a narrower canyon. Check the approach close to travel, wear shoes for wet stone and uneven ground, and treat the waterfall as a guided stop within the wider Charvak, Burchmulla, and Ugam-Chatkal landscape."
  "ru": "Пальтау подходит тем, кто хочет, чтобы горный день ушёл от дороги вдоль водохранилища в более узкий каньон. Подход проверяют ближе к поездке, обувь выбирают для мокрого камня и неровной тропы, а сам водопад оставляют частью большого пейзажа Чарвака, Бурчмуллы и Угам-Чаткала."
  "uz": "Paltov tog‘ kuni suv ombori yo‘lidan torroq kanyonga o‘tishini xohlagan sayohatchilar uchun mos. Yo‘nalish safarga yaqin tekshiriladi, oyoq kiyim ho‘l tosh va notekis yo‘lga mos bo‘ladi, sharshara esa Chorvoq, Burchmulla va Ugom-Chotqol manzarasi ichidagi gidli to‘xtash nuqtasi bo‘lib qoladi."
