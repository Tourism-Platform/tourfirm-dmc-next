  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "A canyon stop that changes the pace of the mountain day"
      "ru": "Каньонная остановка, меняющая темп горного дня"
      "uz": "Tog‘ kunining tezligini o‘zgartiradigan kanyon bekati"
    "description":
      "en": "Chimgan and Charvak often read as broad views: ridges, reservoir water, resort roads, and mountain air. Paltau narrows the experience. The route shifts from panorama to stream, canyon wall, wet rock, vegetation, and the sound of falling water before the day opens back toward the reservoir or the Chimgan road.


        «Paltau is strongest when the route slows down: road, trail, canyon sound, and a local check before the final approach.»"
      "ru": "Чимган и Чарвак часто читаются широко: хребты, вода водохранилища, курортные дороги и горный воздух. Пальтау сужает этот опыт. Маршрут уходит от панорамы к ручью, стенам каньона, мокрому камню, растительности и звуку падающей воды, прежде чем день снова раскрывается к водохранилищу или дороге на Чимган.


        «Пальтау сильнее всего, когда маршрут замедляется: дорога, тропа, звук каньона и местная проверка перед финальным подходом.»"
      "uz": "Chimyon va Chorvoq ko‘pincha keng manzara sifatida ko‘rinadi: tizmalar, suv ombori, kurort yo‘llari va tog‘ havosi. Paltov bu tajribani toraytiradi. Yo‘l panoramadan soyga, kanyon devoriga, ho‘l toshga, o‘simliklarga va tushayotgan suv ovoziga o‘tadi, keyin kun yana suv ombori yoki Chimyon yo‘li tomonga ochiladi.


        «Paltov yo‘l sekinlashganda eng kuchli ko‘rinadi: yo‘l, so‘qmoq, kanyon ovozi va yakuniy yondashuvdan oldingi joyida tekshiruv.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Water, canyon rock, and the road above Charvak"
      "ru": "Вода, скалы каньона и дорога над Чарваком"
      "uz": "Suv, kanyon toshi va Chorvoq ustidagi yo‘l"
    "description":
      "en": "The stop unfolds as a waterfall-route sequence: approach road, canyon terrain, and the cool, loud place near the falling water."
      "ru": "Остановка раскрывается как маршрут к водопаду: подъездная дорога, каньонный рельеф и прохладное шумное место у воды."
      "uz": "Bekat sharshara yo‘nalishi sifatida ochiladi: yaqinlashish yo‘li, kanyon relyefi va suv yonidagi salqin, shovqinli joy."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как смотреть"
      "uz": "Qanday ko‘rish"
    "title":
      "en": "Plan it as a checked mountain walk"
      "ru": "Планируйте его как проверенный горный выход"
      "uz": "Uni tekshirilgan tog‘ yurishi deb qabul qiling"
    "description":
      "en": "Paltau is best planned after a current route check, not by assuming that every summer day or every vehicle can make the same stop. Keep the group small enough to move steadily and leave room for changing the plan."
      "ru": "Пальтау лучше планировать после актуальной проверки маршрута, а не по принципу, что каждый летний день и любой транспорт подходят для одной и той же остановки. Группу стоит держать достаточно компактной, чтобы двигаться спокойно и при необходимости менять план."
      "uz": "Paltovni har bir yoz kuni yoki har qanday transport bir xil bekatga bora oladi degan taxmin bilan emas, joriy yo‘nalish tekshiruviga tayangan holda rejalash yaxshiroq. Guruh tinch yuradigan darajada ixcham bo‘lsin va rejani o‘zgartirishga joy qoldirsin."
  - "blockType": "regular"
