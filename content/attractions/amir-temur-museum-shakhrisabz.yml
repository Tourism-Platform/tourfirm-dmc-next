  "en": "Inside Chubin Madrasah, Amir Temur Museum slows the Shakhrisabz walk down to rooms, cases, courtyard displays, and object detail. After Ak-Saray's scale and the memorial courtyards, the museum helps the city feel close enough to read through carved wood, ceramics, fragments, models, and Timurid material."
  "ru": "Внутри медресе Чубин Музей Амира Темура переводит прогулку по Шахрисабзу в другой масштаб: залы, витрины, двор и детали предметов. После размаха Ак-Сарая и мемориальных дворов здесь легче рассмотреть город вблизи: резное дерево, керамику, фрагменты, модели и темуридские материалы."
  "uz": "Chubin madrasasi ichida Amir Temur muzeyi Shahrisabz sayrini boshqa miqyosga olib kiradi: zallar, vitrinalar, hovli va buyum tafsilotlari. Ak-Saroyning keng manzarasi va memorial hovlilardan keyin bu yerda shaharni yaqindan ko‘rish osonlashadi: o‘yma yog‘och, sopol, parchalar, maketlar va temuriy materiallar."
