    "title":
      "en": "Where Shakhrisabz comes down to object scale"
      "ru": "Где Шахрисабз переходит в предметный масштаб"
      "uz": "Shahrisabz buyumlar miqyosida ko‘rinadigan joy"
    "description":
      "en": "Most Shakhrisabz stops ask you to read scale from outside: palace pylons, domes, courtyards, and long views. The museum changes the scale. In Chubin Madrasah, ancient finds, Timurid decoration, stone, wood, ceramics, tombstone fragments, and models sit close enough for a guide to connect them to the monuments you have just seen."
      "ru": "Большинство остановок в Шахрисабзе читаются снаружи: пилоны дворца, купола, дворы и дальние виды. Музей меняет масштаб. В медресе Чубин древние находки, темуридский декор, камень, дерево, керамика, фрагменты надгробий и модели оказываются достаточно близко, чтобы гид связал их с памятниками, которые вы уже увидели."
      "uz": "Shahrisabzdagi ko‘p bekatlar tashqaridan o‘qiladi: saroy pilonlari, gumbazlar, hovlilar va uzoq manzaralar. Muzey esa miqyosni o‘zgartiradi. Chubin madrasasida qadimiy topilmalar, temuriy bezak, tosh, yog‘och, sopol, qabrtosh parchalari va maketlar gid ko‘rilgan yodgorliklar bilan bog‘lab tushuntiradigan darajada yaqin turadi."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Museum rooms, courtyard display, and Timurid fragments"
      "ru": "Залы музея, двор и темуридские фрагменты"
      "uz": "Muzey zallari, hovli va temuriy parchalar"
    "description":
      "en": "The visual rhythm is quieter than Ak-Saray or the blue domes: display halls, madrasah walls, courtyard air, carved wood, ceramics, and fragments that bring the city's history within arm's reach."
      "ru": "Визуальный ритм здесь тише, чем у Ак-Сарая или синих куполов: музейные залы, стены медресе, воздух двора, резное дерево, керамика и фрагменты, которые приближают историю города."
      "uz": "Bu yerning ko‘rish ritmi Ak-Saroy yoki ko‘k gumbazlardan sokinroq: ekspozitsiya zallari, madrasa devorlari, hovli havosi, o‘yma yog‘och, sopol va shahar tarixini qo‘l yetar joyga olib keladigan parchalar."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как проходит визит"
      "uz": "Tashrif qanday kechadi"
    "title":
      "en": "Let the rooms sharpen the heritage walk"
      "ru": "Пусть залы сделают прогулку по наследию точнее"
      "uz": "Zallar meros sayrini aniqroq qilsin"
    "description":
      "en": "The museum works best as a pause with your guide, not a race through display cases. Objects seen indoors can send you back to the street with a sharper eye for carving, ceramics, and Timurid memory."
      "ru": "Музей лучше работает как пауза с гидом, а не как беглый проход по витринам. Предметы внутри помогают вернуться на улицу с более точным взглядом на резьбу, керамику и темуридскую память."
      "uz": "Muzey vitrinalar bo‘ylab shoshilish emas, gid bilan qilingan pauza bo‘lganda yaxshiroq ishlaydi. Ichkarida ko‘rilgan buyumlar ko‘chaga qaytganda o‘yma naqsh, sopol va temuriy xotirani aniqroq ko‘rishga yordam beradi."
  - "blockType": "regular"
    "eyebrow":
      "en": "What to add nearby"
      "ru": "Что добавить рядом"
      "uz": "Yaqinda nimalar bor"
