    "description":
      "en": "The museum belongs in the central Shakhrisabz walk: Ak-Saray gives scale, Chorsu adds market life, and Dorut Tilovat or Dorus-Saodat return the route to memorial courtyards."
      "ru": "Музей лучше читается в центральной прогулке по Шахрисабзу: Ак-Сарай даёт масштаб, Чорсу добавляет жизнь базара, а Дорут-Тиловат или Дорус-Саодат возвращают маршрут к мемориальным дворам."
      "uz": "Muzey Shahrisabzning markaziy sayri ichida yaxshiroq o‘qiladi: Ak-Saroy miqyos beradi, Chorsu bozor hayotini qo‘shadi, Dorut Tilovat yoki Dorus-Saodat esa yo‘nalishni memorial hovlilarga qaytaradi."
