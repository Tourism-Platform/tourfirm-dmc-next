  "uz": "Xan Shatir Ostonadagi eng sokin bekat emas, shuning uchun ham u yoʻnalishda kerak. Chodir tom chap qirgʻoqqa uzoqdan taniladigan moʻljal beradi; ichkarida esa rejalangan poytaxtning kundalik tomoni ko‘rinadi: qahva, oilalar, ko‘ngilochar joylar va shamol, sovuq, issiq yoki yomgʻirdan pana."
