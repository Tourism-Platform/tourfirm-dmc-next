    "description":
      "en": "Juma Mosque matters because it changes the pace and scale of the Khiva walk. After gates, lanes, and exterior landmarks, the route enters a covered prayer hall where wooden columns, carved details, and a respectful pace bring the city closer."
      "ru": "Джума-мечеть важна тем, что меняет темп и масштаб прогулки по Хиве. После ворот, улиц и внешних ориентиров маршрут входит в крытый молитвенный зал, где деревянные колонны, резные детали и уважительный темп приближают город."
      "uz": "Juma masjidi Xiva yurishining tempi va miqyosini o‘zgartirgani uchun muhim. Darvozalar, ko‘chalar va tashqi belgilar ortidan yo‘l yopiq namoz zaliga kiradi; yog‘och ustunlar, o‘yma detallar va hurmatli temp shaharni yaqinroq qiladi."
  - "blockType": "regular"
