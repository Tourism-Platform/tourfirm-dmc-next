    "description":
      "en": "The visual story is close rather than panoramic: repeated columns, carved timber, ceiling details, and the compact route through the hall."
      "ru": "Визуальная история здесь близкая, а не панорамная: повтор колонн, резное дерево, детали потолка и компактный путь через зал."
      "uz": "Bu yerda ko‘rinish panoramadan ko‘ra yaqindan ochiladi: ustunlar takrori, o‘yma yog‘och, shift detallari va zal ichidagi ixcham yo‘l."
