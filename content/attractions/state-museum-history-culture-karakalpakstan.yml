      "ru": "Музей состоит из близких деталей: старых форм Хорезма, каракалпакской материальной культуры и природного мира вокруг реки, степи и бывшего моря."
      "uz": "Muzey yaqin detallardan tuzilgan: Xorazmning eski shakllari, qoraqalpoq moddiy madaniyati va daryo, dasht hamda sobiq dengiz atrofidagi tabiat dunyosi."
