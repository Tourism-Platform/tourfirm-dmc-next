    "description":
      "en": "The museum is not built around one famous object. Its meaning comes through several sections: ancient Khorezm, Karakalpak dress and craft, Aral-region nature, and the republic's modern history."
      "ru": "Музей не держится на одном главном экспонате. Его смысл складывается из разделов: древний Хорезм, каракалпакская одежда и ремесло, природа Приаралья и современная история республики."
      "uz": "Muzey bitta mashhur eksponat atrofida qurilmagan. Uning maʼnosi bir nechta bo‘limdan yig‘iladi: qadimgi Xorazm, qoraqalpoq kiyimi va hunari, Orolbo‘yi tabiati hamda respublikaning zamonaviy tarixi."
  - "blockType": "regular"
