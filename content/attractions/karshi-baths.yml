  "en": "Karshi Baths bring Qarshi's old-city walk from bridge, mosque, and madrasah into water and heat. The story is modest but specific: a medieval bathhouse dated to the 16th century, remembered for a heating system that could hold warmth from one small stove."
  "ru": "Каршинские бани переводят прогулку по старому Карши от моста, мечети и медресе к воде и теплу. История места скромная, но точная: средневековая баня XVI века, которую помнят за систему, способную удерживать тепло от одной небольшой печи."
  "uz": "Qarshi hammomlari eski Qarshi sayrini ko‘prik, masjid va madrasadan suv hamda issiqlik mavzusiga olib o‘tadi. Joy hikoyasi ixcham, lekin aniq: XVI asrga oid o‘rta asr hammomi, bir kichik pechdan issiqlikni saqlay olgan tizimi bilan eslanadi."
