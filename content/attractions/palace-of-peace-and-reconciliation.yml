      "ru": "Дворец важен тем, что его форма понятна сразу, а назначение необычно: современный ориентир для религиозного диалога, культурных событий, образования и представления страны.


        «Пирамида сильнее всего тогда, когда её ясная форма приводит к вопросу, для которого она построена: как новая столица принимает диалог через архитектуру.»"
      "uz": "Saroy muhim, chunki uning shakli darhol tushunarli, vazifasi esa noodatiy: diniy muloqot, madaniy tadbirlar, taʼlim va mamlakat vakilligi uchun zamonaviy ramz.


        «Piramida eng kuchli paytda uning ravshan shakli bino koʻtargan savolga olib boradi: yangi poytaxt meʼmorchilik orqali muloqotni qanday qabul qiladi.»"
