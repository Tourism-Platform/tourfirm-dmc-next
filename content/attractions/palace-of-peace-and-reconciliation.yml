  "en": "The Palace gives Astana's Independence Square a pyramid you can read from the pavement: stone, glass, and a stained-glass crown over a building made for congresses and performance. Designed by Foster + Partners after the first interfaith Congress in Astana, it belongs naturally with the National Museum, Hazret Sultan Mosque, and the capital's wider ceremonial district."
  "ru": "Дворец мира и согласия даёт площади Независимости форму, которую видно сразу: камень, стекло и витражная вершина над зданием, созданным для конгрессов и выступлений. Проект Foster + Partners появился после первого межрелигиозного конгресса в Астане, поэтому дворец естественно читать рядом с Национальным музеем, мечетью Хазрет Султан и церемониальным районом столицы."
  "uz": "Tinchlik va totuvlik saroyi Mustaqillik maydoniga darhol taniladigan shakl beradi: kongresslar va sahna uchun yaratilgan bino ustida tosh, shisha va vitrajli choʻqqi. Foster + Partners loyihasi Ostonadagi birinchi dinlararo kongressdan keyin paydo boʻlgan, shuning uchun saroy Milliy muzey, Hazret Sultan masjidi va poytaxtning marosim hududi bilan tabiiy bogʻlanadi."
