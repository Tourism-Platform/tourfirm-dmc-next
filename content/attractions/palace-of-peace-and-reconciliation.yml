    "uz": "Tinchlik va totuvlik saroyi Mustaqillik maydoniga darhol taniladigan shakl beradi: kongresslar va sahna uchun yaratilgan bino ustida tosh, shisha va vitrajli choʻqqi. Foster + Partners loyihasi Ostonadagi birinchi dinlararo kongressdan keyin paydo boʻlgan, shuning uchun saroy Milliy muzey, Hazret Sultan masjidi va poytaxtning marosim hududi bilan tabiiy bogʻlanadi."
