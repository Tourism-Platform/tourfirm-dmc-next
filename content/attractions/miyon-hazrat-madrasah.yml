      "en": "The visit is compact, but it loses meaning if it becomes only a name between larger monuments. Let the courtyards, open rooms, and Mukimi context shape the stop."
      "ru": "Визит компактный, но теряет смысл, если становится только названием между крупными памятниками. Лучше смотреть его через дворы, доступные комнаты и историю Мукими."
      "uz": "Tashrif ixcham, lekin yirik yodgorliklar orasidagi oddiy nomga aylanib qolsa, mazmunini yoʻqotadi. Uni hovlilar, ochiq xonalar va Muqimiy hikoyasi orqali ko‘rish kerak."
