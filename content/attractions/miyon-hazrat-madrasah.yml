    "title":
      "en": "Study, prayer, and Mukimi's memory"
      "ru": "Учёба, молитва и память Мукими"
      "uz": "Oʻqish, ibodat va Muqimiy xotirasi"
    "description":
      "en": "The first impression is not about size. A carved gateway leads to courtyards and rooms where the madrasah's history is tied to study, prayer, and the memory of the Kokand poet Mukimi."
      "ru": "Первое впечатление здесь не в размере. Резные ворота ведут к дворам и комнатам, где история медресе связана с учёбой, молитвой и памятью кокандского поэта."
      "uz": "Bu yerda birinchi taassurot kattalikda emas. Oʻyma darvoza hovlilar va xonalarga olib kiradi; madrasa tarixi oʻqish, ibodat va Qoʻqon shoiri xotirasi bilan bogʻlangan."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Courtyards, rooms, and Mukimi's memory"
      "ru": "Дворы, комнаты и память Мукими"
      "uz": "Hovlilar, xonalar va Muqimiy xotirasi"
    "description":
      "en": "Look for the shift from gateway to courtyards: carved wood, brickwork, ganch interiors, student rooms, and the room-museum that connects the place with Mukimi."
      "ru": "Обратите внимание на переход от ворот к дворам: резное дерево, кирпичную кладку, ганчевые интерьеры, комнаты медресе и комнату-музей, которая связывает место с Мукими."
      "uz": "Darvozadan hovlilarga oʻtishni kuzating: oʻyma yogʻoch, gʻisht terimi, ganchli ichki joylar, madrasa xonalari va joyni Muqimiy bilan bogʻlaydigan xona-muzey."
  - "blockType": "regular"
