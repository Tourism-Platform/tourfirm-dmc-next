  "en": "At Chor Minor, Bukhara shifts from big ensembles to a neighborhood lane. Four blue-domed towers rise above a compact gatehouse, while homes, doors, and everyday movement keep the monument close."
  "ru": "Чор-Минор показывает другую сторону старой Бухары: не площадь и не большой ансамбль, а тихую улицу с воротами бывшего медресе. Четыре башни с синими куполами видны над светлыми стенами, и памятник воспринимается почти в масштабе квартала."
  "uz": "Chor Minor eski Buxoroning boshqa tomonini ko‘rsatadi: katta maydon yoki yirik ansambl emas, sobiq madrasa darvozasi turgan sokin ko‘cha. Ko‘k gumbazlar och rang devorlar ustida ko‘rinadi, yodgorlik esa mahalla ritmiga yaqin seziladi."
