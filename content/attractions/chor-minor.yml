    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "The old city at close range"
      "ru": "Старая Бухара вблизи"
      "uz": "Eski Buxoro yaqindan"
    "description":
      "en": "Chor Minor changes the tempo of the old-city walk without leaving it. The compact two-storey gatehouse is linked to Khalif Niyazkul's 1807 madrasa, with four corner towers, blue tilework, and a quiet lane around it. Chor Minor is part of Bukhara's historic centre, which is on the UNESCO World Heritage List.


        «Chor Minor shows how Bukhara can become quiet without leaving the old city.»"
      "ru": "Чор-Минор меняет темп прогулки по старой Бухаре. Это не большая площадь, а компактные двухэтажные ворота бывшего медресе Халифа Ниязкула 1807 года: четыре угловые башни, синий орнамент и улица вокруг. Чор-Минор входит в исторический центр Бухары, который находится в списке Всемирного наследия UNESCO.


        «Чор-Минор показывает, как старая Бухара может стать тихой, не выходя из города.»"
      "uz": "Chor Minor eski shahar sayrining ritmini o‘zgartiradi. U Xalif Niyozqulning 1807-yilgi sobiq madrasasi bilan bog‘liq ixcham ikki qavatli darvoza: to‘rt burchak minorasi, ko‘k bezak va atrofidagi sokin ko‘cha. Chor Minor UNESCO Jahon merosi ro‘yxatidagi Buxoro tarixiy markazi tarkibiga kiradi.


        «Chor Minor eski Buxoro shahar ichidayoq sokinlashishini ko‘rsatadi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you will see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Blue domes, pale walls, and an old-city lane"
      "ru": "Синие купола, светлые стены и улица старого города"
      "uz": "Ko‘k gumbazlar, och rang devorlar va eski shahar ko‘chasi"
    "description":
      "en": "Chor Minor is best viewed from close range: the four corner towers, blue tile detail, pale walls, domed gatehouse, and lane setting all sit within a small old-city frame."
      "ru": "Чор-Минор лучше рассматривать вблизи: четыре угловые башни, синие детали, светлые стены, купольные ворота и улица старого города находятся в одном небольшом поле зрения."
      "uz": "Chor Minorni yaqindan ko‘rgan yaxshi: to‘rt burchak minorasi, ko‘k koshin detali, och rang devorlar, gumbazli darvoza va eski shahar ko‘chasi bitta ixcham manzarada turadi."
  - "blockType": "regular"
    "eyebrow":
      "en": "How the visit feels"
      "ru": "Как проходит визит"
      "uz": "Tashrif qanday seziladi"
    "title":
      "en": "A simple, unhurried stop"
      "ru": "Простая неторопливая остановка"
      "uz": "Oddiy va shoshilmasdan ko‘riladigan bekat"
    "description":
      "en": "Chor Minor does not need a long program. Give yourself enough time to stand in the lane, notice the four towers and doorway, and keep the neighborhood setting respectful."
      "ru": "Чор-Минору не нужна длинная программа. Достаточно оставить время, чтобы постоять на улице, рассмотреть четыре башни и дверь, а также уважительно отнестись к жизни квартала вокруг."
      "uz": "Chor Minor uchun uzun dastur kerak emas. Ko‘chada to‘xtab, to‘rt minorani va eshikni ko‘rish, shu bilan birga atrofdagi mahalla hayotiga hurmat bilan qarash kifoya."
