      "ru": "Ляби-Хауз оставляет маршрут у воды и чайханной жизни; Магоки-Аттори добавляет остановку у старой мечети; Пои-Калян возвращает к главному ансамблю минарета и медресе; Боло-Хауз ведёт к воде, колоннам и тени рядом с Арком."
