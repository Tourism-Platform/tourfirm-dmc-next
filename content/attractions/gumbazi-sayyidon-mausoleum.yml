    "description":
      "en": "Gumbazi Sayyidon matters because it adds another memorial story beside Shamsiddin Kulol inside Dorut Tilovat. Sources connect the mausoleum with Mirzo Ulugbek's 1437-1438 order, the Termez Sayyids, and marble tombstones whose inscriptions preserve family memory."
      "ru": "Гумбази-Саййидон важен потому, что рядом с Шамсиддином Кулолом добавляет Дорут-Тиловату ещё одну мемориальную историю. Источники связывают мавзолей с заказом Мирзо Улугбека 1437-1438 годов, термезскими сейидами и мраморными надгробиями, где надписи хранят память рода."
      "uz": "Gumbazi Sayyidon muhim, chunki Shamsiddin Kulol yonida Dorut Tilovatga yana bir memorial hikoyani qo‘shadi. Manbalar maqbarani Mirzo Ulug‘bekning 1437-1438 yillardagi buyrug‘i, Termiz sayyidlari va oilaviy xotirani saqlagan yozuvli marmar qabrtoshlar bilan bog‘laydi."
