"excerpt":
  "en": "Shymbulak rises above the Medeu valley on Almaty's southern mountain edge. In one outing, the city gives way to gondola stations, colder air, ridge views, cafes or walking paths, and winter slopes when the season allows. Treat it as the mountain part of the day: check weather, lift access, road time, and clothing before you go."
  "ru": "Шымбулак расположен выше долины Медеу на южном горном краю Алматы. За один выезд город сменяется станциями канатной дороги, более холодным воздухом, видами на хребет, кафе или прогулками, а зимой — горными склонами, если сезон и погода позволяют. Это отдельная горная часть дня: проверьте погоду, работу подъёмников, дорогу и одежду перед выездом."
  "uz": "Shimbuloq Olmaotaning janubiy togʻ chetida, Medeu vodiysidan yuqorida joylashgan. Bir safarda shahar kanat yoʻli stansiyalari, salqinroq havo, tizma manzaralari, kafe yoki sayr yoʻllari bilan almashadi; qorli mavsumda esa yonbagʻirlar ham safarning bir qismiga aylanishi mumkin. Uni kunning alohida togʻ qismi sifatida ko‘ring: yo‘lga chiqishdan oldin ob-havo, lift va kanat yoʻli ishlashi, yoʻl va kiyimni tekshiring."
