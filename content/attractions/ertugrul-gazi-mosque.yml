    "description":
      "en": "The mosque helps Ashgabat read as more than official scale. It brings worship, courtyard space, religious etiquette, and Turkish-style architectural detail into a city day that can otherwise feel dominated by marble avenues and state monuments.


        «The mosque matters because it changes the capital's register: less monument sequence, more worship space, etiquette, and quiet.»"
      "ru": "Мечеть помогает читать Ашхабад не только через официальный масштаб. Она вводит в городской день религиозную среду, двор, этикет посещения и турецкие архитектурные детали — то, чего не хватает, когда маршрут строится только вокруг мраморных проспектов и государственных монументов.


        «Мечеть важна потому, что меняет регистр столицы: меньше ряда монументов, больше религиозного пространства, этикета и тишины.»"
      "uz": "Masjid Ashgabatni faqat rasmiy miqyos orqali emas, kengroq o‘qishga yordam beradi. U marmar xiyobonlar va davlat monumentlari ustun bo‘lgan shahar kuniga ibodat muhiti, hovli, tashrif odobi va turkcha meʼmoriy detallarni qo‘shadi.


        «Masjid muhim, chunki u poytaxt ohangini o‘zgartiradi: monumentlar ketma-ketligi kamroq, ibodat joyi, odob va sokinlik ko‘proq.»"
