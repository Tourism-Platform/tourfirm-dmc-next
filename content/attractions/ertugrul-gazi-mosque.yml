"excerpt":
  "en": "After Ashgabat's monument parks, wide avenues, and museum rooms, Ertugrul Gazi Mosque changes the pace. Four white minarets, a dome, a courtyard fountain, and Turkish-style detail bring the route into an active religious place rather than another ceremonial landmark. The mosque is also known as Azadi Mosque because of its Azadi Street setting. Include it only when current access, prayer-time rhythm, dress expectations, and photography boundaries have been checked locally."
  "ru": "После монументальных парков, широких проспектов и музейных залов мечеть Эртугрул Гази меняет темп Ашхабада. Четыре белых минарета, купол, двор с фонтаном и турецкий архитектурный облик вводят маршрут в действующее религиозное пространство, а не в очередной парадный ориентир. Мечеть также известна как мечеть Азади из-за расположения на улице Азади. Включайте её в маршрут только тогда, когда доступ, ритм молитвенного времени, требования к одежде и границы фотосъёмки проверены на месте."
  "uz": "Ashgabatning monument bog‘lari, keng xiyobonlari va muzey zallaridan keyin Ertugrul Gazi masjidi shahar surʼatini o‘zgartiradi. To‘rtta oq minora, gumbaz, favvorali hovli va turkcha meʼmoriy detal yo‘nalishni yana bir rasmiy belgiga emas, faol diniy joyga olib kiradi. Masjid Azadi ko‘chasida joylashgani uchun Azadi masjidi deb ham ataladi. Uni yo‘nalishga faqat joriy kirish, namoz vaqti ritmi, kiyinish talablari va suratga olish chegaralari joyida tekshirilganda kiriting."
