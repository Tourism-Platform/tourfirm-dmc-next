  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "A Parthian capital beside Ashgabat"
      "ru": "Парфянская столица рядом с Ашхабадом"
      "uz": "Ashgabat yonidagi Parfiya poytaxti"
    "description":
      "en": "Nisa changes the Ashgabat route from modern capital scale to ancient power. The site preserves the remains of a Parthian centre that stood between Central Asian and Mediterranean worlds.


        «Nisa is quiet because it is low; its scale comes from the distance between the two tells and the power once held on this foothill ground.»"
      "ru": "Ниса переводит маршрут из масштаба современной столицы к древней власти. Здесь сохранились следы парфянского центра между мирами Центральной Азии и Средиземноморья.


        «Ниса тиха, потому что она низкая; её масштаб раскрывается в расстоянии между двумя холмами и в силе, которая когда-то держалась у этих предгорий.»"
      "uz": "Nisa Ashgabat yoʻlini zamonaviy poytaxt miqyosidan qadimiy qudrat tomon olib oʻtadi. Bu yer Markaziy Osiyo va Oʻrta Yer dengizi dunyolari orasida turgan Parfiya markazi izlarini saqlagan.


        «Nisa past va sokin; uning miqyosi ikki tepalik orasidagi masofada va bu togʻoldi zaminda bir vaqtlar jamlangan qudratda seziladi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni koʻrasiz"
    "title":
