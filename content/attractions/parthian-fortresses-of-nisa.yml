      "ru": "Низкие стены, открытый грунт и два холма"
      "uz": "Past devorlar, ochiq zamin va ikki tepalik"
    "description":
      "en": "Look first for the low defensive lines, then for the open foothill setting, and finally for the way Old and New Nisa complete the same UNESCO story."
      "ru": "Сначала смотрите на низкие оборонительные линии, затем на открытые предгорья и только потом на то, как Старая и Новая Ниса складываются в одну историю ЮНЕСКО."
      "uz": "Avval past mudofaa chiziqlariga, keyin ochiq togʻoldi zaminga, soʻng Eski va Yangi Nisa bir YUNESKO hikoyasini qanday toʻldirishiga eʼtibor bering."
