  "en": "Nisa is a quiet archaeological stop just outside Ashgabat: two low tells, open sky, and earthen walls that once belonged to an early Parthian capital. The visit is strongest when Old and New Nisa are seen together, with museum time and the foothill setting helping the fragments make sense."
  "ru": "Ниса — тихая археологическая остановка рядом с Ашхабадом: два низких холма, открытое небо и земляные стены ранней парфянской столицы. Посещение сильнее, когда Старая и Новая Ниса воспринимаются вместе, а музейное время и предгорный ландшафт помогают собрать фрагменты в понятную историю."
  "uz": "Nisa Ashgabat yaqinidagi sokin arxeologik toʻxtash joyi: ikki past tepalik, ochiq osmon va erta Parfiya poytaxtidan qolgan yer devorlari. Tashrif Eski va Yangi Nisa birga koʻrilganda kuchliroq bo‘ladi; muzey vaqti va togʻoldi manzarasi parchalarning maʼnosini ochadi."
