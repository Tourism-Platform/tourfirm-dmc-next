    "uz": "Tarix va madaniyat davlat muzeyi Qarshiga ko‘prik, masjidlar, Sardoba va madrasalardan keyingi sokin ichki bekat beradi. Vitrinalar va fotosuratlarda Qashqadaryo arxeologiya, tangalar, qo‘lyozmalar, hunarmandchilik buyumlari va bir paytlar Xo‘ja Abdulaziz madrasasida joylashgan kolleksiya xotirasiga aylanadi."
