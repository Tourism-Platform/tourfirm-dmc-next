  "ru": "Государственный музей истории и культуры даёт Карши более тихую внутреннюю остановку после моста, мечетей, Сардобы и медресе. В витринах и фотографиях Кашкадарья становится археологией, монетами, рукописями, ремесленными предметами и памятью о коллекции, которая много лет находилась в медресе Ходжи Абдулазиза."
