        «The museum turns a Kashkadarya route into objects you can read one by one.»"
      "ru": "На прогулке по Карши вы видите арки, купола, водные сооружения и небольшие медресе. Музей показывает предметы за этим городским образом: археологию, ремесло, документы, фотографии и вещи повседневной жизни, благодаря которым Кашкадарья не сводится к одной исторической прогулке.


        «Музей превращает маршрут по Кашкадарье в предметы, которые можно читать по одному.»"
      "uz": "Qarshi bo‘ylab tashqi sayr arkalar, gumbazlar, suv inshootlari va kichik madrasalarni ko‘rsatadi. Muzey shu manzara ortidagi buyumlarni yaqinlashtiradi: arxeologiya, hunar, hujjatlar, fotosuratlar va kundalik hayot buyumlari Qashqadaryoni bitta tarixiy sayrdan kengroq ko‘rsatadi.


        «Muzey Qashqadaryo yo‘nalishini birma-bir o‘qiladigan buyumlarga aylantiradi.»"
