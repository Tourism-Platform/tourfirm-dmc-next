    "description":
      "en": "Urgench is often treated as the road before Khiva. CAMUZ gives the city a quieter reason to stop: a museum opened in 1983 as an art gallery in the 1910 first post office building, with Khorezm artists central to what visitors see today.


        «CAMUZ gives Urgench a softer note: Khorezm seen through artists, not only through roads and walls.»"
      "ru": "Ургенч часто воспринимают как дорогу перед Хивой. CAMUZ даёт городу более тихую причину остановиться: музей, открытый в 1983 году как художественная галерея в первом здании почты 1910 года, где сегодня важное место занимают художники Хорезма.


        «CAMUZ даёт Ургенчу более мягкую ноту: Хорезм через художников, а не только через дороги и стены.»"
      "uz": "Urganch ko‘pincha Xivadan oldingi yo‘l sifatida qabul qilinadi. CAMUZ shaharda to‘xtash uchun tinchroq sabab beradi: 1983 yilda 1910 yilgi birinchi pochta binosida badiiy galereya sifatida ochilgan muzey, bugun esa unda Xorazm rassomlari muhim o‘rin tutadi.


        «CAMUZ Urganchga yumshoqroq ohang beradi: Xorazm faqat yo‘l va devorlar orqali emas, rassomlar orqali ham ko‘rinadi.»"
