  "uz": "Rabati Malik sardobasi eski Navoiy yo‘lining amaliy yarmini ko‘rsatadi. Karvonsaroy peshtoqi kelish va salobat haqida gapirsa, yonidagi g‘ishtli sardoba suv, soya, hayvonlar va keyingi yo‘lni mumkin qilgan g‘amxo‘rlik haqida gapiradi."
