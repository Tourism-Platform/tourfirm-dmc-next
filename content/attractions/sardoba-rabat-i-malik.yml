      "uz": "Sardobaga ixcham suv muhandisligi bekati sifatida qarang: g‘isht yuzasi, gumbaz shakli, chuqurlik hissi va suv nega kerak bo‘lganini tushuntiradigan karvonsaroy peshtoqi."
