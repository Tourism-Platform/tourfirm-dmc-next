    "description":
      "en": "Rudaki Avenue brings the route back outside, the National Museum adds the country story, and Navruz Palace gives the city a modern craft-and-architecture contrast."
      "ru": "Проспект Рудаки возвращает маршрут на воздух, Национальный музей добавляет историю страны, а Дворец Навруз даёт современный ремесленно-архитектурный контраст."
      "uz": "Rudakiy xiyoboni yoʻnalishni yana ochiq havoga olib chiqadi, Milliy muzey mamlakat hikoyasini qoʻshadi, Navroʻz saroyi esa shaharga zamonaviy hunarmandchilik va meʼmorchilik kontrastini beradi."
