  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "A modern market that brings the city closer"
      "ru": "Современный рынок, который приближает город"
      "uz": "Shaharni yaqinroq ko‘rsatadigan zamonaviy bozor"
    "description":
      "en": "Mehrgon matters because it brings everyday exchange into a capital day that can otherwise stay formal. Museums explain the country and avenues show the civic city; the market gives you produce, small purchases, food smells, vendor movement, and the ordinary choices that make Dushanbe feel lived in."
      "ru": "Мехргон важен тем, что вводит повседневную торговлю в столичный день, который иначе может остаться слишком официальным. Музеи объясняют страну, проспекты показывают гражданский город, а рынок добавляет продукты, небольшие покупки, запах еды, движение продавцов и обычные решения, из которых складывается живой Душанбе."
      "uz": "Mehrgon poytaxtdagi rasmiy joylar orasiga kundalik savdo va odamlar harakatini olib kirgani uchun muhim. Muzeylar mamlakatni tushuntiradi, xiyobonlar rasmiy shaharni ko‘rsatadi; bozor esa mahsulot, kichik xarid, ovqat hidi, sotuvchilar harakati va Dushanbeni tirik his qildiradigan oddiy tanlovlarni beradi."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni koʻrasiz"
    "title":
      "en": "Produce rows, spice piles, and food counters"
      "ru": "Фруктовые ряды, специи и еда"
      "uz": "Meva rastalari, ziravorlar va ovqat"
    "description":
      "en": "The visual story is practical rather than monumental: seasonal fruit, dried apricots, nuts, tea and spice displays, honey, sweets, food counters, and the large indoor market shell around them."
      "ru": "Визуальная история здесь практична, а не монументальна: сезонные фрукты, курага, орехи, чай и специи, мёд, сладости, еда и большая крытая рыночная оболочка вокруг них."
      "uz": "Bu yerning vizual hikoyasi monumental emas, amaliy: mavsumiy mevalar, quruq oʻrik, yongʻoq, choy va ziravorlar, asal, shirinlik, ovqat rastalari va ularni oʻrab turgan katta yopiq bozor binosi."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посещать"
      "uz": "Qanday koʻrish"
    "title":
      "en": "Keep it useful, respectful, and unhurried"
      "ru": "Практично, уважительно и без спешки"
      "uz": "Amaliy, hurmatli va shoshilmasdan"
    "description":
      "en": "This is not a museum stop. Give the market enough time to breathe: walk the main rows, taste only when offered, ask before photos, and choose one or two small purchases if the group wants a practical memory of the city."
      "ru": "Это не музейная остановка. Дайте рынку достаточно времени: пройдите основные ряды, пробуйте только когда предлагают, спрашивайте перед фотографиями и выберите одну-две небольшие покупки, если группе хочется практичного воспоминания о городе."
      "uz": "Bu muzey toʻxtashi emas. Bozorga yetarli vaqt bering: asosiy rastalarni aylaning, faqat taklif qilinsa tatib ko‘ring, foto oldidan soʻrang va guruh shahar haqida amaliy xotira xohlasa, bir-ikki kichik xarid tanlang."
  - "blockType": "regular"
    "eyebrow":
