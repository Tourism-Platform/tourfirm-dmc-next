    "description":
      "en": "Toprak-Kala and Kyzyl-Kala form the close comparison before Ayaz-Kala in the Ancient Khorezm chapter. Chilpyk and the Nukus museums can extend the western story when the route continues through Karakalpakstan."
      "ru": "Топрак-Кала и Кызыл-Кала дают близкое сравнение перед Аяз-Калой в главе древнего Хорезма. Чилпык и музеи Нукуса расширяют западный контекст, если маршрут продолжается по Каракалпакстану."
      "uz": "Tuproq-qalʼa va Qizil-qalʼa Ayoz-qalʼadan oldingi yaqin taqqoslashni beradi. Yo‘l Qoraqalpog‘iston bo‘ylab davom etsa, Chilpiq va Nukus muzeylari g‘arbiy kontekstni kengaytiradi."
