    "description":
      "en": "Ayaz-Kala changes the scale of the Ellikqala route. After the closer palace-and-wall stops, the road reaches hills, clay lines, and the direction of Ayazkol, so ancient Khorezm begins to read as territory as well as architecture."
      "ru": "Аяз-Кала меняет масштаб маршрута по Элликкале. После более близких дворцовых и крепостных остановок дорога выходит к холмам, глиняным линиям и направлению Аязколя, поэтому древний Хорезм становится не только архитектурой, но и территорией."
      "uz": "Ayoz-qalʼa Ellikqal’a yo‘lining miqyosini o‘zgartiradi. Yaqin saroy va qalʼa bekatlaridan keyin yo‘l tepaliklar, xom g‘isht chiziqlari va Ayozko‘l tomonga chiqadi; shunda qadimgi Xorazm faqat meʼmorchilik emas, keng hudud sifatida ham tushuniladi."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Hilltop walls and open desert"
      "ru": "Стены на холмах и открытая пустыня"
      "uz": "Tepalik devorlari va ochiq cho‘l"
    "description":
      "en": "Look for the three-part site story rather than one perfect angle: wall lines, slopes, tracks, and the desert around the fortress."
      "ru": "Здесь важно смотреть не один удачный ракурс, а историю трёх частей: линии стен, склоны, дороги и пустыню вокруг крепости."
      "uz": "Bu yerda bitta mukammal burchak emas, uch qismli joy hikoyasi muhim: devor chiziqlari, qiyaliklar, yo‘llar va qalʼa atrofidagi cho‘l."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посещать"
      "uz": "Tashrif qanday kechadi"
    "title":
      "en": "Come prepared for open ground"
      "ru": "Подготовьтесь к открытому рельефу"
      "uz": "Ochiq relyefga tayyor bo‘ling"
    "description":
      "en": "Ayaz-Kala is not a polished museum stop. A visit here needs water, sun protection, careful shoes, and current local advice about where vehicles stop and where walking is appropriate."
      "ru": "Аяз-Кала — не музейная остановка с гладким покрытием. Нужны вода, защита от солнца, удобная обувь и актуальная местная информация о том, где останавливается машина и где можно идти пешком."
      "uz": "Ayoz-qalʼa silliq qoplamali muzey bekati emas. Suv, quyoshdan himoya, qulay oyoq kiyim va mashina qayerda to‘xtashi, qayerdan piyoda yurish mumkinligi haqidagi dolzarb mahalliy maslahat kerak."
  - "blockType": "regular"
