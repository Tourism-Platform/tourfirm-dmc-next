"excerpt":
  "en": "Neutrality Monument rises from Ashgabat's southern ceremonial landscape as a 95-meter white-marble structure on three pylons. The form recalls a Turkmen tagan, the hearth stand, while viewing levels and the golden figure make the stop a quick lesson in how the capital uses height, marble, and open squares to express state symbolism. It works best between Independence Monument, the National Museum, or the Carpet Museum, where exterior scale can give way to objects, craft, and history."
  "ru": "Монумент Нейтралитета поднимается в южной церемониальной части Ашхабада как 95-метровое беломраморное сооружение на трёх пилонах. Его форма напоминает туркменский таган, очажную подставку; видовые уровни и золотая фигура превращают остановку в короткое объяснение того, как столица говорит высотой, мрамором и открытыми площадями. Монумент лучше воспринимается рядом с Монументом Независимости, Национальным музеем или Музеем ковра: внешний масштаб тогда получает продолжение в предметах, ремесле и истории."
  "uz": "Betaraflik monumenti Ashgabatning janubiy tantanali hududida uch pilon ustidagi 95 metrlik oq marmar inshoot sifatida ko‘tariladi. Uning shakli turkman o‘choq taganini eslatadi; tomosha maydonchalari va oltin figura bu toʻxtashni poytaxt balandlik, marmar va ochiq maydonlar orqali davlat ramzlarini qanday ko‘rsatishini tushuntiradigan qisqa tajribaga aylantiradi. Monument Mustaqillik monumenti, Milliy muzey yoki Gilam muzeyi bilan birga kelganda aniqroq seziladi: tashqi miqyos keyin buyumlar, hunar va tarix bilan davom etadi."
