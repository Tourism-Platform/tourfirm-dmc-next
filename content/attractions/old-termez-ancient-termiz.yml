  "uz": "Qadimgi Termiz Termiz yo‘nalishiga qadimiy miqyos beradi. Zamonaviy shahar g‘arbida qalʼa izlari, buddaviy joylar, stupa qoldiqlari, ziyorat yo‘llari va Amudaryo muzey, Fayoztepa, Zurmala hamda keyingi memoriallarni bitta janubiy manzaraga bog‘laydi."
