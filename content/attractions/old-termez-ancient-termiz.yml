    "description":
      "en": "Ancient Termiz matters because it changes the Termez route from individual stops into a wider landscape. Museum objects, Fayaz Tepa, Zurmala, shrine courtyards, and the citadel area make more sense when you know they belong to the old city around the Amu Darya."
      "ru": "Древний Термез важен потому, что превращает маршрут из отдельных остановок в широкий ландшафт. Музейные предметы, Фаязтепа, Зурмала, дворы святынь и район цитадели становятся понятнее, когда ясно, что они относятся к старому городу у Амударьи."
      "uz": "Qadimgi Termiz muhim, chunki u yo‘nalishni alohida to‘xtashlardan kengroq manzaraga olib chiqadi. Muzey buyumlari, Fayoztepa, Zurmala, ziyorat hovlilari va qalʼa hududi ularning Amudaryo bo‘yidagi eski shaharga tegishli ekani bilinanda aniqroq bo‘ladi."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Citadel traces, open land, and nearby sites"
      "ru": "Следы цитадели, открытая местность и близкие места"
      "uz": "Qalʼa izlari, ochiq hudud va yaqin joylar"
    "description":
      "en": "The visit is less about a restored facade than about a landscape: low remains, open ground, nearby Buddhist sites, and shrine roads that make ancient Termez visible."
      "ru": "Визит здесь не про восстановленный фасад, а про ландшафт: низкие остатки, открытую местность, близкие буддийские места и дороги к святыням, благодаря которым Древний Термез становится видимым."
      "uz": "Bu tashrif tiklangan fasaddan ko‘ra manzara haqida: past qoldiqlar, ochiq hudud, yaqin buddaviy joylar va Qadimgi Termizni ko‘rinadigan qiladigan ziyorat yo‘llari."
