    "description":
      "en": "Ancient Termiz can feel quiet at first because much of the city survives as traces. It is best seen after the museum or with a clear explanation of what stood here, what disappeared, and how nearby sites fit together."
      "ru": "Древний Термез поначалу может казаться тихим: многое сохранилось только следами. Лучше смотреть его после музея или с ясным объяснением того, что здесь стояло, что исчезло и как соседние места относятся друг к другу."
      "uz": "Qadimgi Termiz boshida juda sokin ko‘rinishi mumkin, chunki shaharning katta qismi faqat izlar bilan qolgan. Uni muzeydan keyin yoki bu yerda nima bo‘lgan, nima yo‘qolgan va yaqin joylar qanday bog‘lanishi aniq tushuntirilganda ko‘rish yaxshiroq."
