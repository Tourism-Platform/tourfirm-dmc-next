    "ru": "Выше Чимгана Бельдерсай меняет горный выезд: вместо общего вида на долину появляется воздух более крутых склонов. Когда подъёмники работают, маршрут может подняться выше дороги; когда нет, для визита нужна другая ясная причина — зимний снег, тёплая прогулка к ущелью или тихая высокая остановка перед возвращением к Чимгану."
    "uz": "Chimyondan yuqoriroqda Beldersoy tog‘ chiqishini umumiy vodiy manzarasidan tikroq yonbag‘ir havosiga o‘zgartiradi. Liftlar ishlaganda tashrif yo‘ldan balandroqqa chiqishi mumkin; ular ishlamasa, yo‘nalishga boshqa aniq sabab kerak bo‘ladi: qishki qor, iliq mavsumdagi dara yurishi yoki Chimyonga qaytishdan oldingi sokin baland bekat."
