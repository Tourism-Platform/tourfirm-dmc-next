    "title":
      "en": "A higher slope stop near Chimgan"
      "ru": "Более высокая остановка на склонах рядом с Чимганом"
      "uz": "Chimyon yaqinidagi balandroq yonbag‘ir bekati"
    "description":
      "en": "Beldersay is part of the mountain cluster that gives Tashkent a quick escape into cooler air. It is not the same kind of stop as Amirsoy: the interest here is the steeper ski-area feeling, the cable-car possibility, and the way the road shifts from Chimgan village toward a quieter high-slope setting.


        «Choose Beldersay for slope air and height, then let the lifts, snow, or gorge route join only when conditions support them.»"
      "ru": "Бельдерсай входит в горный кластер, который быстро выводит маршрут из Ташкента к более прохладному воздуху. Это не такой же тип остановки, как Амирсой: здесь важнее ощущение склонов, возможность подъёма по канатной дороге и переход от посёлка Чимган к более тихой высокогорной среде.


        «Выбирайте Бельдерсай ради склонов и высоты, а подъёмники, снег или маршрут к ущелью добавляйте только тогда, когда условия это поддерживают.»"
      "uz": "Beldersoy Toshkentdan salqinroq havoga tez olib chiqadigan tog‘ klasteriga kiradi. Bu Amirsoy bilan bir xil bekat emas: bu yerda tikroq chang‘i hududi hissi, kanat yo‘li imkoniyati va Chimyon qishlog‘idan sokinroq baland yonbag‘ir muhitiga o‘tish muhim.


        «Beldersoyni yonbag‘ir havosi va balandlik uchun tanlang; liftlar, qor yoki dara yo‘li faqat sharoit mos bo‘lganda qo‘shilsin.»"
