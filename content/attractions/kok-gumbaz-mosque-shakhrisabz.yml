    "description":
      "en": "Kok Gumbaz is best understood through exterior views: the turquoise dome above brick walls, the entrance mass, and the wider Dorut Tilovat setting."
      "ru": "Кок-Гумбаз лучше всего читается через внешние виды: бирюзовый купол над кирпичными стенами, входной объём и более широкое пространство Дорут-Тиловата."
      "uz": "Ko‘k Gumbaz tashqi ko‘rinishlar orqali yaxshi anglashiladi: g‘isht devorlar ustidagi feruza gumbaz, kirish hajmi va kengroq Dorut Tilovat muhiti."
