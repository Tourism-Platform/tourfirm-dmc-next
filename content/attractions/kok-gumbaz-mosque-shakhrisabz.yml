      "en": "Kok Gumbaz matters because it turns the Dorut Tilovat stop from a courtyard name into a visible mosque setting. The blue dome is the first signal, but the visit also depends on the entrance, brick surfaces, inscription band, and current access rules."
      "ru": "Кок-Гумбаз важен потому, что делает Дорут-Тиловат не только названием ансамбля, а видимой мечетной средой. Синий купол — первый ориентир, но визит держится на входе, кирпичной поверхности, надписях и актуальном доступе."
      "uz": "Ko‘k Gumbaz Dorut Tilovatni faqat ansambl nomi emas, ko‘rinadigan masjid muhiti sifatida anglatadi. Ko‘k gumbaz birinchi belgi, ammo tashrif kirish, g‘isht yuzalar, yozuvlar va amaldagi ochiq joylarga ham bog‘liq."
