      "ru": "Чашма раскрывается через близкие детали: воду источника, тень мечети и холм, который держит в кадре более старую историю Нураты."
      "uz": "Chashma yaqin detallar orqali ochiladi: buloq suvi, masjid soyasi va Nurotaning qadimiyroq hikoyasini ko‘rsatib turadigan tepalik."
