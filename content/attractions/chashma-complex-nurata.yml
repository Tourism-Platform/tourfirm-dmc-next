      "en": "Chashma matters because the desert route begins here with water, shade, prayer space, and quiet local movement rather than only sand and distance. The spring pool and mosque courtyard show why Nurata is more than a road stop between the great cities and the Kyzylkum."
      "ru": "Чашма важна потому, что путь к пустыне здесь начинается с воды, тени, молитвенного пространства и спокойного местного движения, а не только с песка и расстояния. Бассейн источника и двор мечети показывают, почему Нурата — больше чем дорожная остановка между большими городами и Кызылкумом."
      "uz": "Chashma muhim, chunki cho‘l yo‘li bu yerda faqat qum va masofadan emas, suv, soya, ibodat joyi va sokin mahalliy harakatdan boshlanadi. Buloq hovuzi va masjid hovlisi Nurota katta shaharlar bilan Qizilqum orasidagi oddiy yo‘l bekatidan ko‘proq ekanini ko‘rsatadi."
