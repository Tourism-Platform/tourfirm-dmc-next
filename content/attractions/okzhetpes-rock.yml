      "ru": "Окжетпес добавляет Бурабаю более физический выбор. Озеро Бурабай и Жумбактас можно читать с берега; Окжетпес заставляет решить, останется ли маршрут с видами снизу или включит более крутой, проверенный на месте подъём ради панорамы озера и леса.


        «Окжетпес должен ощущаться выбранной видовой точкой, а не спешной добавкой после озера.»"
      "uz": "Oqjetpes Burabayga jismoniyroq tanlov qo‘shadi. Burabay ko‘li va Jumbaqtasni qirg‘oqdan ko‘rish mumkin; Oqjetpes esa yo‘l pastdagi manzaralar bilan qoladimi yoki ko‘l va o‘rmon panoramasi uchun mahalliy tekshirilgan tikroq ko‘tarilishni qo‘shadimi, degan qarorni talab qiladi.


        «Oqjetpes ko‘ldan keyingi shoshilinch qo‘shimcha emas, tanlangan manzara nuqtasi bo‘lib sezilishi kerak.»"
