  "en": "Okzhetpes rises above Burabay's lake-and-forest landscape as the place where a quiet shore visit can become a more physical viewpoint. From below, the rock gives the resort area a sharper granite profile; from the climb, when conditions allow, Lake Borovoe and the surrounding pine forest open into one wider view. Treat it as a chosen active stop, with access, weather, local support, and fitness checked close to travel."
  "ru": "Окжетпес поднимается над озёрно-лесным пейзажем Бурабая там, где спокойный береговой визит может перейти в более физическую видовую точку. Снизу скала добавляет курортной зоне выразительный гранитный профиль; с подъёма, когда условия позволяют, озеро Боровое и сосновый лес раскрываются одним широким видом. Относитесь к нему как к выбранной активной остановке: доступ, погоду, сопровождение и физическую готовность проверяют ближе к поездке."
  "uz": "Oqjetpes Burabayning ko‘l va o‘rmon manzarasi ustida, sokin qirg‘oq tashrifi jismoniyroq manzara nuqtasiga aylanishi mumkin bo‘lgan joyda ko‘tariladi. Pastdan qoya kurort hududiga aniq granit siluet beradi; ko‘tarilishdan esa, sharoit mos bo‘lsa, Borovoe ko‘li va qarag‘ayli o‘rmon bitta keng manzara bo‘lib ochiladi. Uni tanlangan faol bekat deb qabul qiling: kirish, ob-havo, mahalliy yordam va tayyorgarlik safarga yaqin tekshiriladi."
