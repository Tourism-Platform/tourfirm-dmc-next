    "en": "Beket-Ata is not the city mosque in Aktau. The route moves far into Mangystau's desert south, where pilgrims descend toward a mosque cut into limestone and a sacred landscape of low voices, steps, and distance. This stop belongs in a route for its quiet religious setting, with modest dress, calm behavior, daylight, vehicle choice, water, and current local advice shaping the visit."
    "ru": "Бекет-Ата — не городская мечеть в Актау. Маршрут уходит далеко в южную пустыню Мангистау, где паломники спускаются к мечети, вырубленной в известняке, и к священному пространству тихих голосов, ступеней и расстояния. Эта остановка нужна маршруту ради спокойной религиозной среды, а одежда, поведение, световой день, машина, вода и свежий местный совет определяют, как именно строится посещение."
    "uz": "Beket-Ata Aqtaudagi shahar masjidi emas. Yoʻnalish Mangʻistovning janubiy choʻliga uzoq kiradi; u yerda ziyoratchilar ohaktoshga oʻyilgan masjid va past ovoz, zinapoya hamda masofa seziladigan muqaddas muhit tomon tushadi. Bu toʻxtash yoʻnalishga sokin diniy muhit sababli kiradi; kiyim, xulq, kunduzgi vaqt, avtomobil, suv va hozirgi mahalliy maslahat tashrif qanday kechishini belgilaydi."
