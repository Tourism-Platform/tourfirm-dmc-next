    "description":
      "en": "Beket-Ata gives Mangystau a different kind of depth. After the open road and chalk landscapes, the route enters a sacred place where silence, descent, and respect matter as much as the view.


        «Beket-Ata loses meaning as a quick desert photo stop. The route belongs here only when it protects the quiet of the place.»"
      "ru": "Бекет-Ата добавляет Мангистау другую глубину. После открытой дороги и меловых ландшафтов маршрут входит в священное место, где тишина, спуск и уважение важны не меньше вида.


        «Бекет-Ата нельзя превращать в пустынную фотостановку. Маршрут уместен здесь только тогда, когда он сохраняет тишину места.»"
      "uz": "Beket-Ata Mangʻistovga boshqa chuqurlik beradi. Ochiq yoʻl va oqish manzaralardan keyin marshrut sukunat, pastga tushish va hurmat manzara kabi muhim boʻlgan muqaddas joyga kiradi.


        «Beket-Atani choʻldagi tezkor surat toʻxtashiga aylantirish uning maʼnosini kamaytiradi. Yoʻnalish bu yerda faqat joyning sukunatini asraganda mos keladi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni koʻrasiz"
    "title":
      "en": "Cliff descent, mosque chambers, and pilgrimage quiet"
      "ru": "Скальный спуск, помещения мечети и тишина паломничества"
      "uz": "Qoyadagi tushish, masjid xonalari va ziyorat sukunati"
    "description":
      "en": "Beket-Ata is read through movement and restraint: the approach through open desert, the descent into the rock, and the way pilgrims keep the place from feeling like an empty monument."
      "ru": "Бекет-Ата читается через движение и сдержанность: подход по открытой пустыне, спуск в скалу и люди, благодаря которым место не становится пустым памятником."
      "uz": "Beket-Ata harakat va bosiqlik orqali anglashiladi: ochiq choʻldan yaqinlashish, qoyaga tushish va joyni boʻsh yodgorlikka aylantirmaydigan ziyoratchilar."
