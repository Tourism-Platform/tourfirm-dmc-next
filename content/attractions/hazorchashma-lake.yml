    "title":
      "en": "The upper lake that stays optional"
      "ru": "Верхнее озеро, которое остаётся выбором"
      "uz": "Tanlov boʻlib qoladigan yuqori koʻl"
    "description":
      "en": "Hazorchashma matters because it gives Seven Lakes a possible upper continuation without making it compulsory. When conditions are calm, reaching it can deepen the Haftkul visit; when they are not, stopping at Marguzor is still a complete choice.


        «The upper lake is stronger as a careful choice than as a fixed promise.»"
      "ru": "Хазорчашма важна тем, что даёт Семи озёрам возможное верхнее продолжение, но не делает его обязательным. В спокойных условиях озеро может углубить визит к Хафткулю; если условия меняются, остановка на Маргузоре остаётся полноценным решением.


        «Верхнее озеро сильнее как внимательный выбор, чем как заранее данное обещание.»"
      "uz": "Hazorchashma muhim, chunki u Yetti Koʻlga majburiy emas, sharoitga bogʻliq yuqori davom imkonini beradi. Sharoit tinch boʻlsa, u Haftkoʻl tashrifini boyitadi; sharoit mos boʻlmasa, Marguzorda toʻxtash ham toʻliq tanlov boʻlib qoladi.


        «Yuqori koʻl oldindan berilgan vaʼda emas, ehtiyotkor tanlov boʻlsa kuchliroq.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni koʻrasiz"
    "title":
      "en": "Upper water, road conditions, and return margin"
      "ru": "Верхняя вода, дорожные условия и запас на возвращение"
      "uz": "Yuqori suv, yoʻl holati va qaytish zaxirasi"
    "description":
      "en": "Three views define the stop: upper-lake water, the current road and weather conditions, and the need to leave enough margin for the return. 1. **Upper-lake water** **alt:** Hazorchashma Lake in the upper Seven Lakes / Haftkul sequence in Tajikistan. **caption:** The upper lake belongs in the visit when the continuation stays calm. **media_label:** Hazorchashma upper lake 2. **Road and weather conditions** **alt:** Road conditions toward Hazorchashma Lake above Marguzor on the Haftkul route. **caption:** The upper continuation depends on current road, weather, vehicle, and daylight. **media_label:** Upper-road conditions 3. **Return margin** **alt:** The Seven Lakes route returning from the upper-lake area toward Marguzor. **caption:** A careful plan protects the descent back through the valley. **media_label:** Return from Hazorchashma"
      "ru": "Эту остановку определяют три вида: вода верхнего озера, состояние дороги и погоды, а также необходимость оставить достаточно времени на обратный путь. 1. **Вода верхнего озера** **alt:** Озеро Хазорчашма в верхней части маршрута Семь озёр / Хафткуль в Таджикистане. **caption:** Верхнее озеро уместно в визите, когда продолжение остаётся спокойным. **media_label:** Верхнее озеро Хазорчашма 2. **Дорога и погода** **alt:** Дорога к озеру Хазорчашма выше Маргузора на маршруте Хафткуль. **caption:** Верхнее продолжение зависит от текущей дороги, погоды, машины и светового дня. **media_label:** Условия верхней дороги 3. **Запас на возвращение** **alt:** Маршрут Семи озёр возвращается от верхней части к Маргузору. **caption:** Внимательный план сохраняет спокойный спуск обратно по долине. **media_label:** Возвращение от Хазорчашмы"
      "uz": "Bu toʻxtashni uch narsa belgilaydi: yuqori koʻl suvi, yoʻl va ob-havo holati, hamda qaytishga yetarli vaqt qoldirish. 1. **Yuqori koʻl suvi** **alt:** Tojikistondagi Yetti Koʻl / Haftkoʻl yoʻlining yuqori qismidagi Hazorchashma ko‘li. **caption:** Davom xotirjam boʻlsa, yuqori koʻl tashrifga qoʻshiladi. **media_label:** Hazorchashma yuqori koʻli 2. **Yoʻl va ob-havo holati** **alt:** Haftkoʻl yoʻlida Marguzordan yuqoridagi Hazorchashma ko‘liga borish sharoiti. **caption:** Yuqori davom joriy yoʻl, ob-havo, mashina va kunduzgi vaqtga bogʻliq. **media_label:** Yuqori yoʻl holati 3. **Qaytish zaxirasi** **alt:** Yetti Koʻl yoʻli yuqori koʻllar hududidan Marguzor tomon qaytadi. **caption:** Ehtiyotkor reja vodiydan xotirjam qaytishni saqlaydi. **media_label:** Hazorchashmadan qaytish"
