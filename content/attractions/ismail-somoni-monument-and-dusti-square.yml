  "uz": "Ismoil Somoniy Dusti maydoni markazida turadi: tojli figura, arka, favvoralar, avtomobil harakati va rasmiy binolar Dushanbe markaziga tantanali poytaxt koʻrinishini beradi. Bu joyni birinchi shahar sayrida, Rudakiy shohkoʻchasi, muzey vaqti va keyingi yoʻl orasidagi qisqa toʻxtash sifatida koʻrish qulay."
