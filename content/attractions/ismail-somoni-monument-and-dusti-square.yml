  "en": "Ismail Somoni stands at the center of Dusti Square, where a crowned statue, arch, fountains, traffic movement, and official buildings give central Dushanbe its ceremonial scale. The stop fits best as a clear pause on a first city walk, between Rudaki Avenue, museum time, and the next road."
