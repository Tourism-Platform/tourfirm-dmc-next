      "ru": "Мост уместнее всего в начале Карши: короткий взгляд на дорогу, воду, кирпич и городскую жизнь перед мечетями, стенами медресе, дымом еды и дальней дорогой по Кашкадарье."
      "uz": "Ko‘prik Qarshini boshlash uchun eng to‘g‘ri joy: masjidlar, madrasa devorlari, taom tutuni va kengroq Qashqadaryo yo‘lidan oldin yo‘l, suv, g‘isht va o‘tayotgan shahar hayotini qisqa ko‘rasiz."
