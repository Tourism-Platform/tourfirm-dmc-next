      "en": "Where Qarshi's city story gathers around the river"
      "ru": "Где история Карши собирается у реки"
      "uz": "Qarshi hikoyasi daryo atrofida yig‘iladigan joy"
    "description":
      "en": "The bridge gives Qarshi a place to begin. Before the mosques, madrasahs, market streets, and the road back toward Shakhrisabz, the city starts here with arches, river air, traffic, footsteps, and the memory of a crossing that mattered to trade."
      "ru": "Мост даёт Карши точку начала. До мечетей, медресе, рынка и дороги к Шахрисабзу город начинается здесь: с арок, речного воздуха, движения, шагов и памяти переправы, важной для торговли."
      "uz": "Ko‘prik Qarshiga boshlanish nuqtasini beradi. Masjidlar, madrasalar, bozor ko‘chalari va Shahrisabz yo‘lidan oldin shahar shu yerdan boshlanadi: arkalar, daryo havosi, harakat, qadamlar va savdo uchun muhim bo‘lgan kechuv xotirasi bilan."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Arches, river edge, and city movement"
      "ru": "Арки, кромка реки и движение города"
      "uz": "Arkalar, daryo cheti va shahar harakati"
    "description":
      "en": "Look for the repeated brick arches, the line of water below, the road beside the bridge, and the city sounds that keep the stop from feeling like a frozen monument."
      "ru": "Смотрите на повтор кирпичных арок, воду внизу, дорогу рядом и городские звуки, из-за которых мост не кажется застывшим памятником."
      "uz": "Takrorlangan g‘isht arkalar, pastdagi suv, yonidagi yo‘l va ko‘prikni qotib qolgan yodgorlik emas, tirik shahar joyi qilib ko‘rsatadigan tovushlarga e’tibor bering."
  - "blockType": "regular"
