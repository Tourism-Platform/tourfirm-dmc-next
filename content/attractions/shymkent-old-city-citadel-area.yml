  "uz": "Avval Shym Qaladan boshlang: bu ochiq osmon ostidagi majmua Chimkent qalʼasi, shahristoni va rabodini tushunarli shahar sayriga aylantiradi. Arxeologik izlar 2200 yillik shahar tarixini ko‘rsatadi; keyin Markaziy bozor non rastalari, savdo ovozlari va kundalik harakatni qoʻshadi."
