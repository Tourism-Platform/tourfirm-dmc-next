  "en": "Begin at Shym Qala, the open-air complex that makes Shymkent's citadel, shahristan, and rabad readable in one city walk. Its archaeological outline brings the 2,200-year city story into view before Central Bazaar adds bread rows, bargaining voices, and everyday movement."
