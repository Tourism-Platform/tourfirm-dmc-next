  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "A market that brings Almaty close"
      "ru": "Рынок, где Алматы становится ближе"
      "uz": "Olmaotani yaqinroq koʻrsatadigan bozor"
    "description":
      "en": "Green Bazaar matters because it shows the city buying, tasting, carrying bags, choosing lunch, and talking across counters. The same central area that holds parks and church architecture also has a marketplace with more than a century of local habit behind it.


        «The bazaar is most useful when it stays ordinary: a place to taste, choose, ask, and watch Almaty buying lunch.»"
      "ru": "Зелёный базар важен тем, что показывает город в обычном движении: здесь выбирают продукты, пробуют, несут пакеты, обедают и переговариваются через прилавки. В том же центральном районе, где находятся парки и храмовая архитектура, живёт рынок с историей больше века.


        «Базар особенно ценен, когда остаётся обычным: здесь пробуют, выбирают, спрашивают и видят, как Алматы покупает обед.»"
      "uz": "Koʻk bozor shaharni odatiy harakatida koʻrsatadi: bu yerda mahsulot tanlanadi, taʼm koʻriladi, xaltalar koʻtariladi, tushlik qilinadi va peshtaxtalar orasida gaplashiladi. Bogʻlar va ibodatxona meʼmorchiligi turgan markaziy hududda bir asrdan ortiq bozor odati ham yashaydi.


        «Bozor oddiyligicha qolganida qadrlidir: bu yerda tatib koʻriladi, tanlanadi, soʻraladi va Olmaota tushlik xarid qilayotganini koʻrasiz.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni koʻrasiz"
    "title":
      "en": "Produce, spices, canteens"
      "ru": "Продукты, специи, столовые"
      "uz": "Mahsulot, ziravorlar, oshxonalar"
    "description":
      "en": "Read the market in three passes: produce and dried fruit first, spice and ready-food counters next, then the practical aisles that keep Kok Bazar tied to daily city life."
      "ru": "Смотрите рынок в три прохода: сначала продукты и сухофрукты, затем специи и готовая еда, потом практичные ряды, которые держат Кок базар рядом с повседневной жизнью города."
      "uz": "Bozorni uch bosqichda koʻring: avval mahsulot va quruq mevalar, keyin ziravorlar va tayyor ovqat, soʻng Koʻk bozorni kundalik shahar hayotiga bogʻlab turadigan amaliy rastalar."
