      "ru": "Зелёный базар можно пройти компактно, но он лучше раскрывается как рабочий рынок. Двигайтесь легко, пробуйте вежливо и помните, что большинство людей вокруг покупают или едят, а не участвуют в представлении."
      "uz": "Koʻk bozorni ixcham koʻrish mumkin, lekin u faol bozor sifatida yaxshiroq ochiladi. Yengil yuring, odob bilan tatib koʻring va atrofdagilarning koʻpi xarid qilayotgan yoki ovqatlanayotganini unutmang."
