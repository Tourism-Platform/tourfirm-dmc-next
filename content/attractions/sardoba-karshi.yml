    "description":
      "en": "Sardoba suits a short, attentive visit. It does not need long onsite time, but it does need enough quiet for the traveler to understand why water architecture mattered in Qarshi."
      "ru": "Сардобе подходит короткий, внимательный визит. Ей не нужно много времени на месте, но нужна тишина и внимание, чтобы гость понял, почему водная архитектура была важна для Карши."
      "uz": "Sardoba qisqa, diqqatli tashrifga mos. U yerda ko‘p vaqt kerak emas, ammo sayohatchi suv meʼmorchiligi Qarshi uchun nega muhim bo‘lganini tushunishi uchun yetarli sokinlik va eʼtibor kerak."
