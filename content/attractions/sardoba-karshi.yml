    "title":
      "en": "The water story behind Qarshi's brick and shade"
      "ru": "Водная история за кирпичом и тенью Карши"
      "uz": "Qarshi g‘ishti va soyasi ortidagi suv hikoyasi"
    "description":
      "en": "Sardoba matters because it changes the Qarshi visit from visible monuments to the engineering of survival in a dry climate. The reservoir is remembered as a 14th-century water structure that collected rainwater and served the city into the early 20th century; its value is the practical intelligence of brick, shade, stored water, and sound."
      "ru": "Сардоба важна потому, что переводит Карши от видимых памятников к инженерной логике жизни в сухом климате. Резервуар XIV века собирал дождевую воду и служил городу до начала XX века; его ценность — практический ум кирпича, тени, сохранённой воды и звука."
      "uz": "Sardoba muhim, chunki u Qarshini ko‘rinadigan yodgorliklardan quruq iqlimdagi hayot muhandisligiga olib o‘tadi. XIV asr suv inshooti yomg‘ir suvini yig‘gan va XX asr boshigacha shaharga xizmat qilgan; uning qadri g‘isht, soya, saqlangan suv va tovushning amaliy aqlidadir."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Brick dome, quiet opening, and water memory"
      "ru": "Кирпичный купол, тихий проём и память о воде"
      "uz": "G‘isht gumbaz, sokin teshik va suv xotirasi"
    "description":
      "en": "Sardoba is not a decorative monument. Its power is in the practical form: brick surfaces, a low dome, an interior that once protected water, and the strange quiet that can hold inside such a small structure."
      "ru": "Сардоба — не декоративный памятник. Её сила в практичной форме: кирпичных поверхностях, низком куполе, внутреннем пространстве, которое когда-то защищало воду, и странной тишине внутри небольшой постройки."
      "uz": "Sardoba bezakli yodgorlik emas. Uning kuchi amaliy shaklda: g‘isht yuzalari, past gumbaz, bir paytlar suvni himoya qilgan ichki makon va kichik inshoot ichida saqlanadigan g‘alati sokinlikda."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как проходит визит"
      "uz": "Tashrif qanday kechadi"
    "title":
