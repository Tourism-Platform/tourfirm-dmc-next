  "en": "Sardoba is Qarshi's quiet water monument: a 14th-century domed reservoir built to collect rainwater in a dry city. When local access allows, the brick chamber, cooler air, and small echo make the old problem of storing water easy to feel."
  "ru": "Сардоба — тихий водный памятник Карши: купольный резервуар XIV века, построенный для сбора дождевой воды в сухом городе. Если текущий доступ позволяет, кирпичная камера, прохладный воздух и небольшое эхо помогают почувствовать старую задачу хранения воды."
  "uz": "Sardoba Qarshining sokin suv yodgorligi: quruq shaharda yomg‘ir suvini yig‘ish uchun qurilgan XIV asr gumbazli ombori. Hozirgi kirish imkon bersa, g‘isht xona, salqin havo va kichik aks-sado suvni saqlashning qadimgi vazifasini his qildiradi."
