    "description":
      "en": "The mausoleum matters because it makes Kunya-Urgench more personal. After the site panorama and the minaret, the stop brings the route close to a named ruler, a tall brick form, and the blue roof that still catches the eye across the open ground.


        «At Sultan Tekesh, old Urgench becomes less panoramic and more personal: brick, blue tile, and dynastic memory held in the open ground.»"
      "ru": "Мавзолей важен тем, что делает Куня-Ургенч более личным. После панорамы территории и минарета остановка приближает маршрут к имени правителя, высокому кирпичному силуэту и голубой кровле, заметной среди открытого пространства.


        «У Султана Текеша старый Ургенч становится не только панорамой, но и личной династической памятью: кирпич, голубая керамика и открытое пространство вокруг.»"
      "uz": "Maqbara Ko‘hna Urganchni yanada shaxsiyroq qiladi. Umumiy manzara va minoradan keyin bu to‘xtash yo‘nalishni hukmdor nomi, baland g‘ishtli shakl va ochiq hududda ko‘zga tashlanadigan ko‘k tomga yaqinlashtiradi.


        «Sulton Tekeshda eski Urganch faqat panorama emas, shaxsiyroq sulola xotirasiga aylanadi: g‘isht, ko‘k koshin va ochiq hudud.»"
