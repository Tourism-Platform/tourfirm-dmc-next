"excerpt":
  "en": "Sultan Tekesh Mausoleum gives Kunya-Urgench a different kind of monument: not the long vertical line of Kutlug Timur Minaret or the chamber detail of Turabek Khanum, but a royal brick tomb capped by blue tile. It makes the most sense after the wider UNESCO landscape has set the scale of old Urgench. The stop is brief, but it is not minor: the mausoleum brings a named Khwarazmshah ruler into the heritage area and gives the route a quieter dynastic pause."
  "ru": "Мавзолей Султана Текеша даёт Куня-Ургенчу другой тип памятника: не длинную вертикаль минарета Кутлуг-Тимура и не внутреннюю деталь Тюрабек-ханым, а царскую кирпичную усыпальницу под голубой конической кровлей. Он понятнее после того, как ландшафт ЮНЕСКО уже задал масштаб старого Ургенча. Остановка короткая, но не второстепенная: мавзолей вводит в зону наследия имя хорезмшаха и даёт маршруту более тихую династическую паузу."
  "uz": "Sulton Tekesh maqbarasi Ko‘hna Urganchda boshqa turdagi yodgorlikni ko‘rsatadi: Qutlug‘ Temur minorasining uzun vertikal chizig‘i ham emas, To‘rabek Xonimdagi ichki bezak ham emas, balki ko‘k koshinli tom bilan yopilgan hukmdor g‘isht maqbarasi. UNESCO manzarasi eski Urganch ko‘lamini ko‘rsatgandan keyin bu to‘xtash yaxshiroq tushuniladi. To‘xtash qisqa, lekin ahamiyatsiz emas: maqbara Ko‘hna Urganch meros hududiga Xorazmshoh hukmdori nomini olib kiradi va yo‘nalishga sokin sulola xotirasini qo‘shadi."
