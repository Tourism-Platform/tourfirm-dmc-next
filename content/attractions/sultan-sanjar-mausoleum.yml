    "title":
      "en": "Where Seljuk Merv comes into focus"
      "ru": "Место, с которого понятен сельджукский Мерв"
      "uz": "Saljuqiy Marv shu yerda aniq ko‘rinadi"
    "description":
      "en": "Ancient Merv spreads across several city sites. At Sultan Sanjar, the guide can gather that distance into one building: the centre of Sultan Kala, the Great Seljuk capital, and one of the park's clearest architectural moments.


        «Here, one Seljuk monument gives the wide ruins direction.»"
      "ru": "Древний Мерв раскинут между несколькими городскими площадками. У Султана Санджара гид может собрать это расстояние в одно здание: центр Султан-Калы, столицу Великих Сельджуков и один из самых ясных архитектурных моментов парка.


        «Здесь один сельджукский памятник задаёт направление широким руинам.»"
      "uz": "Qadimiy Marv bir nechta shahar o‘rinlari bo‘ylab yoyilgan. Sulton Sanjar maqbarasida gid bu kenglikni bitta bino orqali tushuntira oladi: Sulton Qal’a markazi, Buyuk Saljuqiylar poytaxti va bog‘ning eng ravshan meʼmoriy nuqtalaridan biri.


        «Shu yerda bitta saljuqiy yodgorlik keng xarobalarga yo‘nalish beradi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
