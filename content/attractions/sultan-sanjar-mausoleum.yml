      "en": "Use the three views to read the monument gradually: the whole form first, then the Seljuk detail, then the empty space that still explains Merv's scale."
      "ru": "Три ракурса помогают читать памятник постепенно: сначала весь объём, затем сельджукскую деталь, потом пустое пространство, которое всё ещё объясняет масштаб Мерва."
      "uz": "Uch ko‘rinish yodgorlikni bosqichma-bosqich o‘qishga yordam beradi: avval butun shakl, keyin saljuqiy detal, keyin Marv miqyosini tushuntirib turgan bo‘sh makon."
