      "uz": "Xudoyorxon saroyi va Daxmai Shohon Qoʻqonga xonlik miqyosini beradi. Modari Xon oilaviy kontekstni qoʻshadi: Nodira tashabbusi bilan qurilgan Umarxon onasi maqbarasi, saqlangan peshtoq orqali hukmdor oilasi hikoyasini yaqinroq qiladi."
