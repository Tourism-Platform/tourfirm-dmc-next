"excerpt":
  "en": "Gyaur Kala shows Ancient Merv at city scale. The stop is about walls, distance, and traces inside a large urban area rather than a single photogenic monument. With a guide, the stop can connect Erk Kala, Sultan Kala, mosque and cistern remains, Buddhist-period traces, and the way Merv changed shape across the oasis. Without that explanation, the place can feel too quiet for a rushed visit."
  "ru": "Гяур-Кала показывает древний Мерв в масштабе города. Здесь важны стены, расстояние и следы внутри большой городской территории, а не один эффектный памятник. С гидом эта остановка связывает Эрк-Калу, Султан-Калу, следы мечети и водоёма, буддийский период и то, как Мерв менял форму в оазисе. Без такого объяснения место может показаться слишком тихим для спешного визита."
  "uz": "Gyaur qal’a qadimiy Marvni shahar ko‘lamida ko‘rsatadi. Bu yerda bitta ko‘zga tashlanadigan yodgorlik emas, devorlar, masofa va katta shahar hududi ichidagi izlar muhim. Gid bilan bu to‘xtash Erk qal’a, Sulton qal’a, masjid va suv inshooti izlari, buddaviy davr hamda Marv vohada qanday o‘zgarganini birlashtiradi. Bunday izohsiz joy shoshilgan tashrifda juda sokin tuyulishi mumkin."
