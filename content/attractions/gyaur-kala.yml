    "description":
      "en": "Gyaur Kala matters because it changes how Ancient Merv is read. Instead of moving from monument to monument, you begin to see a defended urban area: perimeter, interior traces, and the space that once held a large oasis city.


        «Gyaur Kala makes Merv feel like a city again: walls, distance, and traces that need time with a guide.»"
      "ru": "Гяур-Кала важна тем, что меняет восприятие древнего Мерва. Вместо движения от памятника к памятнику вы начинаете видеть защищённую городскую территорию: периметр, внутренние следы и пространство, где когда-то жил большой город оазиса.


        «Гяур-Кала снова делает Мерв городом: стены, расстояние и следы, которым нужно время с гидом.»"
      "uz": "Gyaur qal’a qadimiy Marvni boshqacha ko‘rsatgani uchun muhim. Yodgorlikdan yodgorlikka yurish o‘rniga himoyalangan shahar hududini ko‘rasiz: perimetr, ichki izlar va bir paytlar katta voha shahri bo‘lgan makon.


        «Gyaur qal’a Marvni yana shahar sifatida sezdiradi: devorlar, masofa va gid bilan vaqt talab qiladigan izlar.»"
