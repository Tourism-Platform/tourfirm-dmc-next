    "description":
      "en": "The park changes the Almaty nature route from a long transfer into a real mountain-lake stay. The first Kolsai lake brings the main reward into view: dark water, spruce slopes, cooler air, and choices that depend on the day's conditions.


        «Kolsai is most rewarding when the route gives the lake time to set the pace, not only time to reach the shore.»"
      "ru": "Парк превращает природный маршрут из Алматы из длинного переезда в настоящий горно-озёрный выезд. Первое озеро сразу показывает главный смысл: тёмная вода, еловые склоны, прохладный воздух и решения, которые зависят от условий в конкретный день.


        «Кольсай лучше раскрывается, когда у маршрута есть время, чтобы озеро задало темп, а не только чтобы доехать до берега.»"
      "uz": "Park Almaty tabiat yo‘lini uzun transferdan haqiqiy tog‘-ko‘l tashrifiga aylantiradi. Birinchi Kolsai ko‘li asosiy mazmunni darhol ko‘rsatadi: qoramtir suv, archa yonbag‘irlari, salqin havo va ayni kundagi sharoitga bog‘liq qarorlar.


        «Kolsai qirg‘oqqa shunchaki yetib borishdan ko‘ra, ko‘l tempini shoshirmaydigan yo‘nalishda kuchliroq ochiladi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Water, spruce slopes, and protected high country"
      "ru": "Вода, еловые склоны и высокогорный ландшафт"
      "uz": "Suv, archa yonbag‘irlari va baland tog‘ manzarasi"
    "description":
      "en": "Kolsai is best understood through what the traveler actually meets there: lake water, forested slopes, mountain weather, and the discipline of a protected landscape."
      "ru": "Кольсай лучше понимать через то, что путешественник встречает на месте: воду озера, лесные склоны, горную погоду и порядок охраняемой территории."
      "uz": "Kolsaini sayohatchi joyida uchratadigan narsalar orqali tushunish osonroq: ko‘l suvi, o‘rmonli yonbag‘irlar, tog‘ ob-havosi va muhofaza hududi tartibi."
  - "blockType": "regular"
