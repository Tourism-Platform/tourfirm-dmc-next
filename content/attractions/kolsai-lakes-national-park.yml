      "ru": "Относитесь к Кольсаю как к горному визиту в охраняемой зоне, а не как к фиксированной фототочке. Сильный маршрут сохраняет гибкость для дороги, погоды, доступа и той прогулки, которая будет уместна именно в этот день."
      "uz": "Kolsaini oddiy surat nuqtasi emas, muhofaza hududidagi tog‘ tashrifi sifatida qabul qiling. Kuchli yo‘nalish yo‘l, ob-havo, kirish va aynan shu kuni qancha piyoda yurish mos kelishini hisobga oladi."
