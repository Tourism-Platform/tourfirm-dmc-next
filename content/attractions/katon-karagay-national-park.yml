      "ru": "Катон-Карагайский национальный парк объясняет, зачем ехать так далеко на восток: охраняемый алтайский лес, длинные долины, горная погода и дистанция от города делают путешествие другим.


        «Здесь маршрут перестаёт быть городским и начинает подчиняться лесу, погоде, расстоянию и правилам охраняемой территории.»"
      "uz": "Katon-Qaragʻay milliy bogʻi sayohatchilar nega bunchalik sharqqa borishini tushuntiradi: qoʻriqlanadigan Altay oʻrmoni, uzun vodiylar, togʻ ob-havosi va shahardan uzoqlik safarni boshqacha qiladi.


        «Bu yerda yoʻnalish shahar ritmidan chiqib, oʻrmon, ob-havo, masofa va qoʻriqlanadigan hudud qoidalariga bo‘ysuna boshlaydi.»"
