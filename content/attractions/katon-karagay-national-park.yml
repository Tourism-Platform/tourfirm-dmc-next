  "en": "The park changes the scale of East Kazakhstan. After Oskemen and the Irtysh cities, the route moves toward forest, river valleys, mountain weather, and a protected landscape where distance is part of the experience. Treat Katon-Karagay as the Altai reason to slow down, not as one more stop after the city."
  "ru": "Парк меняет масштаб Восточного Казахстана. После Усть-Каменогорска и городов на Иртыше маршрут уходит к лесу, речным долинам, горной погоде и охраняемому ландшафту, где расстояние становится частью впечатления. Катон-Карагай стоит воспринимать как алтайскую причину замедлиться, а не как ещё одну остановку после города."
  "uz": "Bogʻ Sharqiy Qozogʻiston miqyosini oʻzgartiradi. Oʻskemen va Irtish shaharlari ortda qolgach, yoʻnalish oʻrmon, daryo vodiylari, togʻ ob-havosi va qoʻriqlanadigan manzaraga kiradi; bu yerda masofaning oʻzi taassurotning bir qismidir. Katon-Qaragʻayni shahardan keyingi yana bir toʻxtash emas, Altay uchun sekinlashish sababi sifatida ko‘ring."
