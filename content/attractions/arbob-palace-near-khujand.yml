  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Зачем ехать"
      "uz": "Nega bu joy"
    "title":
      "en": "A palace beyond Khujand's city walk"
      "ru": "Дворец за пределами городской прогулки"
      "uz": "Shahar yurishidan tashqaridagi saroy"
    "description":
      "en": "Arbob earns its place by changing both scale and subject. It is not another central Khujand stop; it is a palace-and-park ensemble where Soviet architecture, collective-farm history, and modern Tajik state memory meet.


        «Arbob is strongest after Khujand's center, when the route widens from bazaar streets and fortress walls to a formal palace landscape.»"
      "ru": "Арбоб важен тем, что меняет масштаб и тему поездки. Это не ещё одна центральная остановка Худжанда, а дворцово-парковый ансамбль, где встречаются советская архитектура, колхозная история и современная государственная память Таджикистана.


        «Арбоб сильнее всего раскрывается после центра Худжанда, когда маршрут переходит от базара и крепостных стен к парадному дворцовому ландшафту.»"
      "uz": "Arbob safar miqyosi va mavzusini oʻzgartirgani uchun muhim. Bu Xoʻjand markazidagi yana bir bekat emas, balki sovet meʼmorchiligi, kolxoz davri tarixi va Tojikistonning zamonaviy davlat xotirasi tutashadigan saroy-bogʻ ansambli.


        «Arbob Xoʻjand markazidan keyin kuchliroq ochiladi: yoʻnalish bozor ko‘chalari va qalʼa devorlaridan tantanali saroy manzarasiga oʻtadi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посещать"
      "uz": "Qanday tashrif buyurish"
    "title":
