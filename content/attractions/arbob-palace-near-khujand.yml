    "description":
      "en": "Arbob feels clearest as a planned out-of-center stop. It needs transport, a current access check, and enough time for the palace and park to feel distinct from the central walk."
      "ru": "Арбоб лучше воспринимается как самостоятельная остановка за пределами центра. Нужны транспорт, проверка доступа и время, чтобы дворец и парк не превратились в спешную добавку к городской прогулке."
      "uz": "Arbob markazdan tashqaridagi rejalangan bekat sifatida yaxshiroq oʻqiladi. Transport, kirish holati va saroy-bogʻni shahar yurishidan ajratib turadigan vaqt kerak."
