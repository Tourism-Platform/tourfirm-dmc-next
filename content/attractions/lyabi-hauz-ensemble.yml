    "description":
      "en": "Lyabi-Hauz is both an architectural ensemble and a public meeting place. The hauz, the madrasah and khanaka facades, the trees, and the tea tables keep Bukhara's heritage close to its daily life."
      "ru": "Ляби-Хауз одновременно архитектурный ансамбль и городское место встреч. Хауз, фасады медресе и ханаки, деревья и чайные столы соединяют наследие Бухары с её повседневной жизнью."
      "uz": "Labi Hovuz ham meʼmoriy ansambl, ham shahar uchrashuv joyi. Hovuz, madrasa va xonaqoh fasadlari, daraxtlar va choy stollari Buxoro merosini kundalik hayot bilan yonma-yon ko‘rsatadi."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
