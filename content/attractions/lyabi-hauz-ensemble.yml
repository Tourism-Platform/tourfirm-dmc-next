      "en": "Hauz, facades, and old-city lanes"
      "ru": "Хауз, фасады и старогородские улицы"
      "uz": "Hovuz, fasadlar va eski shahar ko‘chalari"
    "description":
      "en": "Look first at the hauz, then at how the tables, trees, madrasah facades, khanaka, and lanes share the same compact space."
      "ru": "Сначала посмотрите на хауз, затем на то, как в одном небольшом пространстве сходятся столы, деревья, фасады медресе, ханака и соседние улицы."
      "uz": "Avval hovuzga qarang, keyin stollar, daraxtlar, madrasa fasadlari, xonaqoh va yaqin ko‘chalar bir ixcham joyda qanday tutashishini ko‘rasiz."
