      "uz": "Petrogliflar maydoni Cholpon-Ataga boshqa xotira beradi. Plyaj shovqini va kurort ko‘chalari o‘rniga sayohatchi toshdagi belgilar shimoliy qirg‘oqni qadimgi harakat, hayvonlar va osmon bilan bog‘laydigan ochiq maydonda yuradi."
