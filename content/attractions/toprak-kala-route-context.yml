    "title":
      "en": "Where the fortress route gains a palace story"
      "ru": "Где крепостный маршрут получает дворцовую историю"
      "uz": "Qalʼalar yo‘li saroy hikoyasini oladigan joy"
    "description":
      "en": "Toprak-Kala gives the route its clearest palace-city chapter. It is not only a defensive outline: the site links walls, a high palace platform, room plans, sanctuaries, painted and sculpted fragments, and written finds with the political life of ancient Khorezm."
      "ru": "Топрак-Кала даёт маршруту самую ясную дворцовую главу. Это не только оборонительный контур: место соединяет стены, высокую дворцовую платформу, планы помещений, святилища, фрагменты росписей и скульптур, письменные находки и политическую жизнь древнего Хорезма."
      "uz": "Tuproq-qalʼa yo‘lga eng ravshan saroy-shahar bobini beradi. Bu faqat mudofaa chizig‘i emas: joy devorlar, baland saroy platformasi, xona rejasi, ziyorat joylari, rasmlar va haykal parchalari, yozma topilmalar hamda qadimgi Xorazm siyosiy hayotini bog‘laydi."
  - "blockType": "regular"
    "eyebrow":
      "en": "What to notice"
      "ru": "На что смотреть"
      "uz": "Nimaga eʼtibor berish"
    "title":
      "en": "Palace platform, wall lines, and room traces"
      "ru": "Дворцовая платформа, линии стен и следы помещений"
      "uz": "Saroy platformasi, devor chiziqlari va xona izlari"
    "description":
      "en": "The important details are structural rather than decorative: the raised palace zone, defensive wall lines, surviving room traces, and open approach that let the settlement read as a former city."
      "ru": "Главные детали здесь конструктивные, а не декоративные: поднятая дворцовая зона, линии оборонительных стен, сохранившиеся следы помещений и открытый подход, который помогает читать поселение как бывший город."
      "uz": "Bu yerda asosiy detallar bezakdan ko‘ra tuzilishga tegishli: ko‘tarilgan saroy zonasi, mudofaa devorlari chiziqlari, saqlangan xona izlari va manzilni sobiq shahar sifatida o‘qishga yordam beradigan ochiq yondashuv."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как проходит визит"
      "uz": "Tashrif qanday kechadi"
    "title":
      "en": "Read the palace city before the fortress pair"
      "ru": "Сначала дворцовый город, потом крепостная пара"
      "uz": "Avval saroy-shahar, keyin qalʼalar juftligi"
    "description":
      "en": "Treat Toprak-Kala as the first archaeological anchor of the Ellikqala sequence: begin with the palace platform and room plan, then compare nearby Kyzyl-Kala and continue toward Ayaz-Kala only when access, heat, and road time make sense."
      "ru": "Планируйте Топрак-Калу как первую археологическую опору последовательности Элликкалы: начните с дворцовой платформы и плана помещений, затем сравните близкую Кызыл-Калу и продолжайте к Аяз-Кале только если доступ, жара и дорога подходят."
      "uz": "Tuproq-qalʼani Ellikqal’a ketma-ketligidagi birinchi arxeologik tayanch sifatida rejalang: saroy platformasi va xona rejasidan boshlang, so‘ng yaqin Qizil-qalʼa bilan solishtiring va kirish, issiq hamda yo‘l mos bo‘lsa Ayoz-qalʼaga davom eting."
  - "blockType": "regular"
    "eyebrow":
      "en": "What to add nearby"
      "ru": "Что добавить рядом"
      "uz": "Yaqinda nimalar bor"
    "title":
      "en": "Kyzyl-Kala, Ayaz-Kala, and Nukus museums"
      "ru": "Кызыл-Кала, Аяз-Кала и музеи Нукуса"
      "uz": "Qizil-qalʼa, Ayoz-qalʼa va Nukus muzeylari"
    "description":
      "en": "Kyzyl-Kala gives the closest comparison, Ayaz-Kala adds the wider desert-fortress setting, and Nukus museums can place the archaeological route beside Karakalpakstan's art and regional memory."
      "ru": "Кызыл-Кала даёт ближайшее сравнение, Аяз-Кала добавляет широкий пустынный масштаб, а музеи Нукуса связывают археологический маршрут с искусством и памятью Каракалпакстана."
      "uz": "Qizil-qalʼa eng yaqin solishtirish nuqtasi, Ayoz-qalʼa kengroq cho‘l qalʼasi manzarasini qo‘shadi, Nukus muzeylari esa arxeologik yo‘lni sanʼat va Qoraqalpog‘iston xotirasi bilan bog‘laydi."
