  "uz": "Tuproq-qalʼa Ellikqal’a qalʼalari yo‘lida ufqdagi devorlardan ko‘proq narsa ko‘rsatadigan bekatdir. Saroy qismi, xona izlari, mudofaa chiziqlari, ziyorat joylari va topilmalar bu maydonni hokimiyat, ibodat, mehnat va kundalik hayot uchrashgan shahar sifatida o‘qishga yordam beradi."
