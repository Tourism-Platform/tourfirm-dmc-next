    "title":
      "en": "Where the mountain road opens to water"
      "ru": "Где горная дорога выходит к воде"
      "uz": "Tog‘ yo‘li suvga ochiladigan joy"
    "description":
      "en": "Charvak gives the Tashkent-and-Chimgan route a different tempo. After the capital and the lower mountain road, the reservoir adds a broad blue surface, dry red-grey slopes, shore life in warm months, and a calmer way to feel the foothills without committing to a trail.


        «Charvak is best when the plan stays clear: water and ridges first, shore activity only when the day supports it.»"
      "ru": "Чарвак даёт маршруту Ташкент-Чимган другой темп. После столицы и нижней горной дороги появляется широкая синяя вода, сухие красно-серые склоны, береговая жизнь в тёплые месяцы и более спокойный способ почувствовать предгорья без обязательной тропы.


        «Чарвак лучше всего раскрывается в ясном плане: сначала вода и хребты, а береговая активность — только когда день это позволяет.»"
      "uz": "Chorvoq Toshkent-Chimyon yo‘liga boshqa sur’at beradi. Poytaxt va pastki tog‘ yo‘lidan keyin keng ko‘k suv, quruq qizil-kulrang yonbag‘irlar, issiq oylardagi qirg‘oq hayoti va murakkab so‘qmoqsiz tog‘oldini his qilish imkoniyati paydo bo‘ladi.


        «Chorvoq aniq rejada eng yaxshi ochiladi: avval suv va tizmalar, qirg‘oq faoliyati esa faqat kun sharoiti ko‘tarsa.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
