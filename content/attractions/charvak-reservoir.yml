    "description":
      "en": "Charvak changes with the season, but the main image stays clear: water held below the mountains, shore roads and villages, and ridges that make the reservoir feel part of the Chimgan landscape."
      "ru": "Чарвак меняется по сезонам, но главный образ остаётся ясным: вода под горами, береговые дороги и посёлки, хребты, из-за которых водохранилище воспринимается частью чимганского пейзажа."
      "uz": "Chorvoq mavsumga qarab o‘zgaradi, lekin asosiy manzara aniq qoladi: tog‘lar ostidagi suv, qirg‘oq yo‘llari va qishloqlar, suv omborini Chimyon manzarasining bir qismi qiladigan tizmalar."
  - "blockType": "regular"
