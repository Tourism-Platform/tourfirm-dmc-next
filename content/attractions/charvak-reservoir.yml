      "ru": "Чарвак может быть обзорной точкой, обедом у берега, пляжной остановкой или сезонной зоной активности. Правильная версия зависит от погоды, нагрузки выходного дня, состояния воды и открытых площадок."
      "uz": "Chorvoq tomosha nuqtasi, qirg‘oqdagi tushlik, plyaj to‘xtashi yoki mavsumiy faoliyat hududi bo‘lishi mumkin. To‘g‘ri shakl ob-havo, dam olish kunlari bosimi, suv holati va ochiq obyektlarga bog‘liq."
