  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "The palace city behind the Khatlon road"
      "ru": "Дворцовый город за южной дорогой Хатлона"
      "uz": "Xatlon janubiy yoʻli ortidagi saroy shahri"
    "description":
      "en": "Hulbuk gives southern Khatlon a rare visible anchor for medieval Khuttal. The restored wall line is only the first clue: behind it is a palace city that once belonged to roads running toward Bukhara, Badakhshan, and India.


        «Let Hulbuk slow the road long enough for Ancient Khuttal to become more than a name.»"
      "ru": "Хульбук даёт южному Хатлону редкий видимый ориентир средневекового Хутталя. Восстановленная линия стен — только первая подсказка: за ней стоит дворцовый город на дорогах к Бухаре, Бадахшану и Индии.


        «Дайте Хульбуку замедлить дорогу настолько, чтобы Древний Хутталь стал не только названием.»"
      "uz": "Xulbuk janubiy Xatlon uchun oʻrta asr Xuttalining kam uchraydigan koʻrinadigan tayanchidir. Tiklangan devor chizigʻi faqat birinchi belgi: uning ortida Buxoro, Badaxshon va Hindiston tomonga ketgan yoʻllarga tutash saroy shahri turadi.


        «Xulbuk yoʻlni sekinlashtirib, Qadimgi Xuttalni oddiy nomdan koʻra aniqroq narsaga aylantirsin.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni koʻrasiz"
    "title":
      "en": "Citadel, ornament, and museum artefacts"
      "ru": "Цитадель, декор и музейные находки"
      "uz": "Sitadel, bezak va muzey topilmalari"
    "description":
      "en": "Move through Hulbuk in three parts: the palace outline outside, the carved and baked-brick details that show the site's refinement, and the museum objects that carry everyday and courtly life."
      "ru": "Рассматривайте Хульбук в трёх частях: дворцовый контур снаружи, резной декор и обожжённый кирпич, а затем музейные предметы, которые возвращают повседневную и дворцовую жизнь."
      "uz": "Xulbukni uch qismda koʻring: tashqaridagi saroy konturi, joyning nozikligini koʻrsatadigan oʻyma va pishiq gʻisht detallari, keyin esa kundalik va saroy hayotini olib keladigan muzey buyumlari."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посещать"
      "uz": "Qanday koʻrish"
    "title":
      "en": "Come to understand, not only to photograph"
      "ru": "Приезжайте, чтобы понять, а не только снять кадр"
      "uz": "Faqat surat uchun emas, maʼno uchun boring"
    "description":
      "en": "Hulbuk is strongest when the outdoor walls and museum cases are not separated. Check the day's access, protect comfort in the heat, and leave enough time for explanation if it is available."
      "ru": "Хульбук сильнее всего, когда открытая площадка и музейные витрины не отделены друг от друга. Проверьте доступ на день поездки, берегите силы в жару и оставьте время на объяснение, если оно доступно."
      "uz": "Xulbuk ochiq devorlar va muzey vitrinalari bir-biridan ajralmaganda kuchliroq. Safar kunidagi kirishni tekshiring, issiqda qulaylikni saqlang va izoh mavjud boʻlsa, unga vaqt qoldiring."
  - "blockType": "regular"
    "eyebrow":
      "en": "Nearby in Kulob"
      "ru": "Рядом с Кулябом"
      "uz": "Koʻlob yaqinida"
