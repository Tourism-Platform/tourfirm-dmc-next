"excerpt":
  "en": "At Hulbuk, the road from Kulob leaves the shrine city for the palace world of Ancient Khuttal. Reconstructed walls, a broad citadel plan, baked brick, carved ganch, ceramics, coins, and jewellery bring a medieval road network into view. Treat the map marker as orientation and check current museum and site access before departure; the visit is most rewarding when there is time to look slowly and understand what the fragments mean."
  "ru": "В Хульбуке дорога от Куляба уходит от города святыни к дворцовому миру Древнего Хутталя. Восстановленные стены, широкий план цитадели, обожжённый кирпич, резной ганч, керамика, монеты и украшения выводят на поверхность средневековую сеть дорог. Считайте маркер на карте ориентиром и заранее уточняйте доступ к музею и площадке; Хульбук лучше раскрывается, когда есть время смотреть медленно и понимать значение фрагментов."
  "uz": "Xulbukda Koʻlobdan kelgan yoʻl ziyorat shahridan Qadimgi Xuttalning saroy dunyosiga oʻtadi. Tiklangan devorlar, keng sitadel rejasi, pishiq gʻisht, oʻyma ganch, sopol buyumlar, tangalar va taqinchoqlar oʻrta asr yoʻllari dunyosini koʻrsatadi. Xaritadagi markerni moʻljal sifatida oling va muzey hamda maydonga kirishni safardan oldin tekshiring; Xulbuk sekin qarashga va parchalarning maʼnosini tushunishga vaqt boʻlganda kuchliroq ochiladi."
