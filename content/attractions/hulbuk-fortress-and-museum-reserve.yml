    "description":
      "en": "Pair Hulbuk with Kulob's central shrine, market or museum time, or let it stand as the archaeology stop before the road turns toward Bokhtar, Nurek, or Dushanbe."
      "ru": "Хульбук хорошо сочетается со святыней в центре Куляба, рынком или музейным временем — либо становится главной археологической остановкой перед дорогой к Бохтару, Нуреку или Душанбе."
      "uz": "Xulbukni Koʻlob markazidagi ziyoratgoh, bozor yoki muzey vaqti bilan qoʻshing yoki Boxtar, Nurek yoki Dushanbe tomonga burilishdan oldingi asosiy arxeologik toʻxtash sifatida qoldiring."
