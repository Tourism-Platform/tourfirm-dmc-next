    "description":
      "en": "Ak-Beshim shifts the Tokmok story from one visible monument to a wider city landscape. Burana gives the road a vertical marker; Ak-Beshim widens the view to low walls, mounds, settlement ground, and the idea of Suyab as a city on the old routes through the Tian Shan.


        «Ak-Beshim rewards the traveler who can slow down enough to see a city in the ground, not just a monument above it.»"
      "ru": "Ак-Бешим переводит историю Токмока от одного заметного памятника к более широкому городскому ландшафту. Бурана даёт дороге вертикальный ориентир; Ак-Бешим расширяет взгляд до низких стен, холмов, территории поселения и самого Суяба как города на старых путях через Тянь-Шань.


        «Ак-Бешим вознаграждает того, кто готов замедлиться и увидеть город в земле, а не только памятник над ней.»"
      "uz": "Ak-Beshim Toqmoq hikoyasini bitta ko‘rinadigan yodgorlikdan kengroq shahar manzarasiga olib chiqadi. Burana yoʻlga tik belgi beradi; Ak-Beshim esa past devorlar, tepaliklar, manzil maydoni va Suyabning Tyan-Shan orqali oʻtgan eski yoʻllardagi shahar sifatidagi maʼnosini ko‘rsatadi.


        «Ak-Beshim yer ichidagi shaharni koʻrish uchun sekinlashishga tayyor sayohatchini mukofotlaydi.»"
