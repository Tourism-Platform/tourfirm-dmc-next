    "title":
      "en": "Where the road becomes a stone shelter"
      "ru": "Где дорога превращается в каменное укрытие"
      "uz": "Yoʻl tosh boshpanaga aylangan joy"
    "description":
      "en": "Tash Rabat turns a mountain transfer into a heritage stop. The building is compact, but the setting is wide: open valley, cold air, silence, and the feeling that shelter mattered before the next hard road.


        «The building is small enough to understand in one visit, but the valley around it makes the old road feel much longer.»"
      "ru": "Таш-Рабат превращает горный переезд в остановку с наследием. Здание компактное, но вокруг него широкое пространство: открытая долина, холодный воздух, тишина и ощущение, что перед следующей трудной дорогой укрытие было необходимо.


        «Здание достаточно компактное, чтобы понять его за один визит, но долина вокруг делает старую дорогу намного длиннее.»"
      "uz": "Tash Rabat togʻ yoʻlini merosga ega toʻxtashga aylantiradi. Bino ixcham, lekin atrofi keng: ochiq vodiy, sovuq havo, sokinlik va keyingi qiyin yoʻldan oldin boshpana zarur bo‘lganini sezish mumkin.


        «Binoni bir tashrifda tushunish mumkin, lekin atrofidagi vodiy eski yoʻlni ancha uzunroq sezdiradi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Stone rooms, valley weather, and the road approach"
      "ru": "Каменные помещения, погода долины и дорога к караван-сараю"
