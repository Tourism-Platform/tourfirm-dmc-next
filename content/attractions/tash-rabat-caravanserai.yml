      "uz": "Tash Rabatni meros va baland hudud sharoitini hisobga olib rejalang. Obyekt ixcham, lekin ob-havo, kiyim, yoʻl tekshiruvi va keyingi yoʻnalish tashrifni shakllantiradi."


