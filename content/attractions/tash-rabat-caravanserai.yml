    "description":
      "en": "Keep the building and valley together. The stone interior explains shelter; the approach road and exposed weather explain why it mattered."
      "ru": "Держите здание и долину вместе. Каменный интерьер объясняет укрытие; подъездная дорога и открытая погода объясняют, почему оно было нужно."
      "uz": "Bino va vodiyni birga ko‘ring. Tosh ichki makon boshpanani tushuntiradi; yondashuv yoʻli va ochiq ob-havo boshpana nega zarur bo‘lganini anglatadi."
