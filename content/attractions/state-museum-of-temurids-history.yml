    "description":
      "en": "The museum is most useful when central Tashkent needs more than a monument photo. Opened in 1996 for Amir Temur's anniversary, it gathers the dynasty's story into one compact stop: the ceremonial building outside, the painted hall inside, and exhibits that prepare you for Timurid monuments later on the route.


        «The strongest visit turns the monument outside into a story you can carry into the next Timurid city.»"
      "ru": "Музей особенно полезен, когда центральному Ташкенту нужно больше, чем фотография у памятника. Открытый в 1996 году к юбилею Амира Темура, он собирает историю династии в одну компактную остановку: церемониальное здание снаружи, расписной зал внутри и экспозиции, которые помогают подготовиться к темуридским памятникам дальше по маршруту.


        «Самый сильный визит превращает памятник снаружи в историю, которую можно взять дальше по маршруту.»"
      "uz": "Markaziy Toshkentda yodgorlik oldidagi suratdan ko‘proq maʼno kerak bo‘lsa, bu muzey foydali. 1996 yilda Amir Temur yubileyi munosabati bilan ochilgan muzey sulola tarixini bir ixcham joyda jamlaydi: tashqarida tantanali bino, ichkarida bezakli zal va keyingi temuriylar yodgorliklariga tayyorlaydigan ekspozitsiyalar.


        «Eng kuchli tashrif tashqaridagi yodgorlikni yo‘l davomida olib ketish mumkin bo‘lgan hikoyaga aylantiradi.»"
