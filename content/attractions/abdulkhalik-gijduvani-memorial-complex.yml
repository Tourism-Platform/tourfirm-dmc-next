    "description":
      "en": "The point is not a change of scenery, but a change of meaning. After the ceramics workshop, Gijduvan opens as the place connected with Abdulkhalik Gijduvani and the first orientation point of the Seven Pirs route.


        «Gijduvan is clearer when ceramics and Seven Pirs memory stay within one calm outing.»"
      "ru": "Здесь важна не смена картинки, а смена смысла. После керамической мастерской Гиждуван открывается как место памяти Абдулхалика Гиждувани и первый ориентир маршрута Семи пиров.


        «Гиждуван понятнее, когда керамика и память Семи пиров остаются частью одного спокойного выезда.»"
      "uz": "Bu yerda muhim narsa manzaraning almashishi emas, maʼnoning oʻzgarishi. Keramika ustaxonasidan keyin Gʻijduvon Abduxoliq Gʻijduvoniy xotirasi va Yetti Pir marshrutining birinchi yoʻnalish nuqtasi sifatida ochiladi.


        «Keramika va Yetti Pir xotirasi bitta xotirjam chiqishda qolsa, Gʻijduvon aniqroq bo‘ladi.»"
