    "title":
      "en": "Where Burabay opens into water and sky"
      "ru": "Где Бурабай открывается водой и небом"
      "uz": "Burabay suv va osmonga ochiladigan joy"
    "description":
      "en": "Lake Burabay is where the resort area becomes easiest to understand. Forest, rocks, shore paths, and classic viewpoints gather around the water before the route widens toward Zhumbaktas, Okzhetpes, Bolektau, Kokshetau, or longer park walks.


        «The lake is strongest when the route lets it breathe: a shore walk, a view across the water, and one next stop chosen with care.»"
      "ru": "Озеро Бурабай помогает быстрее понять курортную зону. Вокруг воды сходятся лес, скалы, береговые прогулки и классические виды, а дальше маршрут может раскрыться к Жумбактасу, Окжетпесу, Бөлектау, Кокшетау или более длинным прогулкам по парку.


        «Озеро сильнее всего, когда маршрут даёт ему время: прогулка у берега, взгляд через воду и следующая остановка, выбранная с вниманием.»"
      "uz": "Burabay koʻli kurort hududini eng oson tushuntiradigan joydir. Suv atrofida oʻrmon, qoyalar, qirgʻoq yoʻllari va klassik manzaralar jamlanadi; keyin marshrut Jumbaqtas, Oqjetpes, Bölektaū, Kokshetau yoki uzunroq park yurishlariga ochilishi mumkin.


        «Koʻlga vaqt berilganda u kuchliroq seziladi: qirgʻoq boʻylab yurish, suv ortiga qarash va eʼtibor bilan tanlangan keyingi bekat.»"
