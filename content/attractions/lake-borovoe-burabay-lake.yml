"excerpt":
  "en": "After the road from Astana and the forest edge of Burabay National Park, Lake Burabay gives the route its first open view. Water appears between pines, granite forms hold the far shore, and the resort name becomes a landscape you can read from the lake edge. The best stop still depends on season, crowding, weather, and the shore section that is accessible and comfortable on the travel date."
  "ru": "После дороги из Астаны и лесной кромки национального парка озеро Бурабай даёт маршруту первый открытый вид. Между соснами появляется вода, на дальнем берегу держатся гранитные формы, и название курорта становится реальным ландшафтом. Лучшая остановка всё равно зависит от сезона, загруженности, погоды и участка берега, который доступен и удобен в день поездки."
  "uz": "Ostonadan kelgan yoʻl va Burabay milliy bogʻining oʻrmon chetidan keyin Burabay koʻli marshrutga birinchi ochiq manzarani beradi. Qaragʻaylar orasida suv koʻrinadi, narigi qirgʻoqda granit qoyalar turadi, kurort nomi esa koʻl boʻyidan koʻrinadigan haqiqiy manzaraga aylanadi. Eng mos toʻxtash mavsum, gavjumlik, ob-havo va safar kuni ochiq hamda qulay boʻlgan qirgʻoq qismiga bogʻliq."
