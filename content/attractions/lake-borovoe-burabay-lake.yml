    "description":
      "en": "The lake does not need a long checklist. Its value is the way open water, pine shores, resort movement, and rock shapes come together in one readable Burabay view."
      "ru": "Озеру не нужен длинный список. Его ценность в том, как открытая вода, сосновые берега, курортное движение и скальные формы сходятся в один читаемый вид Бурабая."
      "uz": "Koʻlga uzun roʻyxat kerak emas. Uning qiymati ochiq suv, qaragʻayli qirgʻoqlar, kurort harakati va qoya shakllari bitta tushunarli Burabay manzarasida jamlanishida."
