    "description":
      "en": "Lake Burabay can be a short pause, a gentle walk, or the starting point for a wider park sequence. The useful choice depends on weather, season, access, crowding, and how much time you want by the water."
      "ru": "Озеро Бурабай может быть короткой паузой, лёгкой прогулкой или началом более широкого маршрута по парку. Полезный выбор зависит от погоды, сезона, доступа, загруженности и того, сколько времени вы хотите провести у воды."
      "uz": "Burabay koʻli qisqa toʻxtash, yengil yurish yoki kengroq park ketma-ketligining boshlanishi boʻlishi mumkin. Foydali tanlov ob-havo, mavsum, kirish, gavjumlik va suv yonida qancha vaqt oʻtkazmoqchi ekaningizga bogʻliq."
  - "blockType": "regular"
