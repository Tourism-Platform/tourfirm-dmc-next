    "title":
      "en": "A quieter memory inside old Tashkent"
      "ru": "Тихая память внутри старого Ташкента"
      "uz": "Eski Toshkent ichidagi sokin xotira"
    "description":
      "en": "Tashkent often introduces itself through movement: arrival roads, metro stations, Chorsu, broad avenues and museum rooms. Sheikhantaur slows that rhythm. The ensemble is small beside the scale of the capital, but it carries a long city memory: Sufi teaching, local rulers, restored mausoleums and courtyard time that helps old Tashkent feel lived, not listed.


        «At Sheikhantaur, Tashkent lowers its voice: three mausoleums, shade, memory and a visit that rewards patience.»"
      "ru": "Ташкент часто начинается с движения: дорога из аэропорта, метро, Чорсу, широкие проспекты и музейные залы. Шейхантаур замедляет этот ритм. Ансамбль невелик по сравнению с масштабом столицы, но в нём держится долгая городская память: суфийское учение, местные правители, восстановленные мавзолеи и двор, где старый Ташкент ощущается живым, а не перечисленным.


        «Шейхантаур - место, где Ташкент говорит тише: три мавзолея, тень, память и маршрут, которому нужно терпение.»"
      "uz": "Toshkent ko‘pincha harakat bilan boshlanadi: aeroport yo‘li, metro bekatlari, Chorsu, keng shohko‘chalar va muzey zallari. Shayxontohur bu ritmni sekinlashtiradi. Ansambl poytaxt miqyosida kichik, lekin unda shaharning uzoq xotirasi bor: so‘fiylik taʼlimi, mahalliy hukmdorlar, tiklangan maqbaralar va eski Toshkentni ro‘yxat emas, tirik joy sifatida his qildiradigan sokin hovli va yo‘laklar.


        «Shayxontohurda Toshkent sokinlashadi: uch maqbara, soya, xotira va sabr talab qiladigan yo‘l.»"
