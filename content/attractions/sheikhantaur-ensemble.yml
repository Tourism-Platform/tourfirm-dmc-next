    "ru": "Шейхантаур легко пропустить, если смотреть на Ташкент только через движение, базары и главные площади. Среди городских улиц три сохранившихся мавзолея хранят память о шейхе Ховенди ат-Тахуре, Калдыргач-бие и Юнус-хане, добавляя тихую паузу старого города после Чорсу, Кукельдаша и Хаст-Имама."
    "uz": "Agar Toshkentni faqat harakat, bozorlar va katta maydonlar orqali ko‘rsangiz, Shayxontohur ko‘zdan qochishi mumkin. Shahar ko‘chalari orasida uchta saqlangan maqbara Shayx Xovandi Tohur, Qaldirg‘ochbiy va Yunusxon xotirasini tutib turadi; Chorsu, Ko‘kaldosh va Hazrati Imomdan keyin poytaxtga sokin eski shahar to‘xtamini qo‘shadi."
