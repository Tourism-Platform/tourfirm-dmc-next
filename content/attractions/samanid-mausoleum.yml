  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nima uchun bu joy"
    "title":
      "en": "Bukhara's early architecture, up close"
      "ru": "Ранняя архитектура Бухары вблизи"
      "uz": "Buxoroning ilk meʼmorchiligi yaqin masofada"
    "description":
      "en": "The mausoleum is part of the Historic Centre of Bukhara and is traditionally linked with Ismail Samani. It has no large courtyard or high portal; the interest is in the compact form, the brickwork, and the way the building stands slightly apart from the busiest old-city stops.


        «A short walk around the mausoleum shows why this small brick tomb matters in Bukhara.»"
      "ru": "Мавзолей входит в исторический центр Бухары и традиционно связывается с Исмаилом Самани. Здесь нет большого двора или высокого портала: главное — компактная форма, кирпичная кладка и положение чуть в стороне от самых оживлённых точек старого города.


        «Короткий обход вокруг мавзолея показывает, почему эта небольшая кирпичная усыпальница важна для Бухары.»"
      "uz": "Maqbara Buxoroning tarixiy markazi tarkibiga kiradi va anʼanaviy ravishda Ismoil Somoniy bilan bog‘lanadi. Bu yerda katta hovli yoki baland peshtoq yo‘q: asosiy eʼtibor ixcham shakl, g‘isht terimi va eski shaharning eng gavjum joylaridan biroz chetroq turishidadir.


        «Maqbara atrofidan qisqa aylanish bu kichik g‘isht maqbarasi Buxoro uchun nega muhimligini ko‘rsatadi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Cube, dome, brickwork, and park paths"
      "ru": "Куб, купол, кладка и дорожки парка"
      "uz": "Kub, gumbaz, g‘isht terimi va park yo‘laklari"
    "description":
      "en": "The view is compact and close: the cube-and-dome form, patterned walls, and the park approach around the monument."
      "ru": "Здесь важны близкие виды: форма куба и купола, узорные стены и подход через парк вокруг памятника."
      "uz": "Bu yerda yaqin ko‘rinishlar muhim: kub-gumbaz shakli, naqshli devorlar va yodgorlik atrofidagi park yo‘laklari."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посетить"
      "uz": "Tashrif qanday kechadi"
    "title":
      "en": "Walk around all four sides"
      "ru": "Обойдите здание со всех сторон"
      "uz": "Binoni har tomondan aylanib chiqing"
    "description":
      "en": "The visit is short, but it works best as a full circuit: first the whole tomb, then the brickwork, then the way the dome and walls change from side to side."
      "ru": "Визит короткий, но лучше воспринимается в полном обходе: сначала вся усыпальница, затем кладка, затем то, как купол и стены меняются от стороны к стороне."
      "uz": "Tashrif qisqa, lekin to‘liq aylanib ko‘rilganda yaxshiroq tushuniladi: avval butun maqbara, keyin g‘isht terimi, so‘ng gumbaz va devorlarning har tomonda o‘zgarishi."
