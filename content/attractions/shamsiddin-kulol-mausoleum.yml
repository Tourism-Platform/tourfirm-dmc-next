    "description":
      "en": "Shamsiddin Kulol matters because Dorut Tilovat is not only a mosque and courtyard setting. The mausoleum gives the ensemble a named memorial focus: a Sufi teacher associated with Kesh and Nesef, his burial after 1371, and a marble tombstone ordered by Amir Temur."
      "ru": "Шамсиддин Кулол важен потому, что Дорут-Тиловат — это не только мечеть и двор. Мавзолей даёт ансамблю конкретную мемориальную точку: суфийского наставника, связанного с Кешем и Несефом, его захоронение после 1371 года и мраморное надгробие по приказу Амира Темура."
      "uz": "Shamsiddin Kulol muhim, chunki Dorut Tilovat faqat masjid va hovli emas. Maqbara ansamblga aniq memorial markaz beradi: Kesh va Nasaf bilan bog‘langan so‘fiy ustoz, 1371 yildan keyingi dafn xotirasi va Amir Temur buyurgan marmar qabrtosh."
