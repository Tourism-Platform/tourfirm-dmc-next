      "ru": "Шамсиддин Кулол воспринимается через близкие детали: пространство мавзолея, память надгробия и его положение рядом с Кок-Гумбазом внутри Дорут-Тиловата."
      "uz": "Shamsiddin Kulol yaqin detallar orqali tushuniladi: maqbara muhiti, qabrtosh xotirasi va Ko‘k Gumbaz yonida, Dorut Tilovat ichida joylashgani."
