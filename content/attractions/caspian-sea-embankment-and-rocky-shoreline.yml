    "ru": "Актау не начинает знакомство со старого памятника. Он начинается там, где город встречается с Каспием: ветер над водой, открытое пространство для прогулки, каменистые края и горизонт, после которого дорога вглубь региона ощущается серьезнее. Оставьте этот первый час простым, а затем решите, сколько Мангистау маршрут может честно выдержать."
    "uz": "Aqtau tanishuvni qadimiy yodgorlikdan boshlamaydi. U shahar Kaspiy bilan uchrashadigan joydan boshlanadi: suv ustidagi shamol, yurish uchun ochiq makon, toshli chetlar va ichkariga yoʻlni jiddiyroq his qildiradigan ufq. Shu birinchi soatni sodda qoldiring, keyin marshrut Mangʻistovdan qanchasini rost va qulay ko'tara olishini tanlang."
