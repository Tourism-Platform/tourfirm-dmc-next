      "en": "Aktau's shoreline can sit beside a museum visit, dinner, or overnight preparation. Remote places such as Torysh, Sherkala, and Beket-Ata need separate road timing, vehicle checks, etiquette, and daylight planning."
      "ru": "Берег Актау можно соединить с музеем, ужином или подготовкой к ночевке. Удаленные места вроде Торыша, Шеркалы и Бекет-Ата требуют отдельного расчета дороги, машины, этикета и светового дня."
