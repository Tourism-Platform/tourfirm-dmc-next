  "en": "Aktau does not introduce itself through an old monument. It begins where the city meets the Caspian: wind on the water, open pedestrian space, rocky edges, and a horizon that makes the inland road feel more serious. Keep this first hour simple, then decide how much of Mangystau the journey can honestly carry."
