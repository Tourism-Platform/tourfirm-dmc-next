  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Зачем сюда"
      "uz": "Nega bu joy"
    "title":
      "en": "The shoreline gives Aktau its first sense of place"
      "ru": "Берег дает Актау первое чувство места"
      "uz": "Qirgʻoq Aqtauga birinchi joy hissini beradi"
    "description":
      "en": "The embankment and rocky shoreline are not a checklist attraction. They are the easiest way to feel why Aktau is different from Kazakhstan's inland cities before the route moves toward Torysh, Sherkala, Beket-Ata, or other remote Mangystau stops.


        «Start at the sea, not because Aktau is a beach city, but because the shoreline explains how close the city sits to both water and desert.»"
      "ru": "Набережная и скалистый берег — не точка для галочки. Это самый простой способ почувствовать, чем Актау отличается от внутренних городов Казахстана до дороги к Торышу, Шеркале, Бекет-Ата или другим удаленным остановкам Мангистау.


        «Начните у моря не потому, что Актау пляжный курорт, а потому, что берег объясняет, как близко город стоит и к воде, и к пустыне.»"
      "uz": "Sayilgoh va toshli qirgʻoq belgilab qoʻyiladigan oddiy nuqta emas. Bu Aqtau Qozogʻistonning ichki shaharlaridan nimasi bilan farq qilishini Torysh, Sherqala, Beket-Ata yoki Mangʻistovdagi boshqa uzoq toʻxtashlardan oldin his qilishning eng oson yo'li.


        «Dengizdan boshlang, Aqtau plyaj shahri bo'lgani uchun emas, balki qirgʻoq shahar suvga ham, choʻlga ham qanchalik yaqinligini tushuntirgani uchun.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что увидите"
      "uz": "Nima ko'rasiz"
    "title":
      "en": "Sea edge, pale city, and the first Mangystau horizon"
      "ru": "Берег моря, светлый город и первый горизонт Мангистау"
      "uz": "Dengiz cheti, och rang shahar va Mangʻistovning birinchi ufqi"
    "description":
      "en": "Keep expectations precise. The shoreline is valuable because it gives Aktau a visible frame, not because it behaves like a resort promenade or a finished sightseeing monument."
      "ru": "Держите ожидания точными. Берег важен потому, что дает Актау видимую рамку, а не потому, что работает как курортная набережная или завершенный экскурсионный памятник."
      "uz": "Kutilmalarni aniq tuting. Qirgʻoq Aqtauga ko'rinadigan ramka bergani uchun qimmatli, kurort sayilgohi yoki tayyor ekskursiya yodgorligi bo'lgani uchun emas."
  - "blockType": "regular"
