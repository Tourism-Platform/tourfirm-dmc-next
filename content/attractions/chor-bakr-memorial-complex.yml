    "description":
      "en": "Bahauddin Naqshband keeps the day in memorial and pilgrimage context, Sitorai Mokhi-Khosa adds a palace-garden visit, while the Ark and Bolo-Hauz bring the route back toward central Bukhara."
      "ru": "Бахауддин Накшбанд сохраняет мемориальный и паломнический контекст дня, Ситораи Мохи-Хоса добавляет дворцовый сад, а Арк и Боло-Хауз возвращают маршрут к центральной Бухаре."
