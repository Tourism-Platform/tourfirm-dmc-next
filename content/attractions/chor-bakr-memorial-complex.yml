  "en": "Chor-Bakr opens Bukhara's west-side memorial setting: walled necropolis courtyards, marble gravestones, mosque and khanqah spaces, and a slim minaret near Sumitan. It deserves a separate drive from the center, with enough time for quiet, respect, and a slower pace."
  "ru": "Чор-Бакр открывает западную сторону Бухары: дворы некрополя за стенами, мраморные надгробия, пространства мечети и ханаки и тонкий минарет рядом с Сумитаном. Сюда лучше ехать отдельным выездом, чтобы у мемориального места остались тишина, уважительный темп и время."
  "uz": "Chor Bakr Buxoroning g‘arbiy tomonini ochadi: devorli nekropol hovlilari, marmar qabrtoshlar, masjid va xonaqoh joylari hamda Sumitan yaqinidagi ingichka minora. Bu joyga markazdan alohida borish yaxshiroq, shunda xotira maskanida sukunat, hurmatli temp va vaqt qoladi."
