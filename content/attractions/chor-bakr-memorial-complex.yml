    "description":
      "en": "Chor-Bakr works best with its own time. The visit moves through courtyards, stone, walls, and sacred-site etiquette, with current access, photo comfort, and prayer rhythm best checked locally before the visit."
      "ru": "Для Чор-Бакра лучше оставить отдельное время. Визит идёт через дворы, камень, стены и этикет священного места, а текущий доступ, отношение к съёмке и молитвенный ритм лучше проверить на месте перед визитом."
      "uz": "Chor Bakrga alohida vaqt ajratgan maʼqul. Tashrif hovlilar, tosh, devorlar va muqaddas joy odobi orqali yuradi; joriy kirish, suratga munosabat va ibodat ritmini tashrifdan oldin joyida tekshirish yaxshiroq."
