    "title":
      "en": "Necropolis courtyards west of Bukhara"
      "ru": "Дворы некрополя к западу от Бухары"
      "uz": "Buxorodan g‘arbdagi nekropol hovlilari"
    "description":
      "en": "Chor-Bakr shows another side of Bukhara: not a square or bazaar street, but necropolis courtyards, marble gravestones, and mosque and khanqah spaces. It is better planned as a separate drive from the dense center route, so the place keeps a calmer pace.


        «Chor-Bakr changes the pace of a day in Bukhara: after the center, the route moves toward the necropolis courtyards near Sumitan.»"
      "ru": "Чор-Бакр показывает Бухару с другой стороны: не через площадь или базарную улицу, а через дворы некрополя, мраморные надгробия, пространство мечети и ханаки. Сюда лучше ехать отдельно от плотной прогулки по центру, чтобы у места остался спокойный темп.


        «Чор-Бакр меняет темп бухарского дня: после центра маршрут выходит к дворам некрополя рядом с Сумитаном.»"
      "uz": "Chor Bakr Buxoroni boshqa tomondan ko‘rsatadi: maydon yoki bozor ko‘chasi orqali emas, nekropol hovlilari, marmar qabrtoshlar, masjid va xonaqoh joylari orqali. Uni markazdagi zich sayrdan alohida rejalash yaxshiroq, shunda joyning sokin tempi saqlanadi.


        «Chor Bakr Buxoro kunining tempini o‘zgartiradi: markazdan keyin marshrut Sumitan yaqinidagi nekropol hovlilariga olib boradi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you will see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Courtyards, gravestones, mosque space, and a slim minaret"
      "ru": "Дворы, надгробия, пространство мечети и тонкий минарет"
      "uz": "Hovlilar, qabrtoshlar, masjid joyi va ingichka minora"
    "description":
      "en": "The complex is easiest to understand as a sequence: gate, courtyard, walls, gravestones, mosque and khanqah spaces, minaret, and quiet movement inside a memorial setting."
      "ru": "Комплекс легче понять как последовательность: ворота, двор, стены, мраморные надгробия, пространства мечети и ханаки, минарет и тихое движение внутри мемориального места."
      "uz": "Majmuani ketma-ketlik sifatida tushunish osonroq: darvoza, hovli, devorlar, marmar qabrtoshlar, masjid va xonaqoh joylari, minora va xotira joyi ichidagi sokin harakat."
  - "blockType": "regular"
