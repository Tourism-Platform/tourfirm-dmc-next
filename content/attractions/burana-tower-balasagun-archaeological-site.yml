  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nima uchun bu joy"
    "title":
      "en": "Where the Chuy road meets Balasagun"
      "ru": "Где Чуйская дорога встречает Баласагун"
      "uz": "Chuy yoʻli Balasagʻun bilan uchrashadigan nuqta"
    "description":
      "en": "Burana matters because it gives the Chuy Valley a visible Silk Road anchor. You do not need to imagine the whole medieval city at once: the tower, stone figures, museum context, and plain around the site make the old route understandable in one clear stop.


        «Step back from the tower and the stop becomes simple: brick under the sky, stone figures nearby, and the old Chuy road running quietly through the plain.»"
      "ru": "Бурана важна тем, что даёт Чуйской долине видимый ориентир Шёлкового пути. Не нужно сразу представлять весь средневековый город: башня, каменные фигуры, музейный контекст и равнина вокруг делают старую дорогу понятной за одну спокойную остановку.


        «Отойдите от башни на несколько шагов: кирпич под небом, каменные фигуры рядом и старая Чуйская дорога становятся одной ясной картиной.»"
      "uz": "Burana Chuy vodiysiga Ipak yoʻlining koʻrinadigan tayanchini beradi. Butun oʻrta asr shahrini birdan tasavvur qilish shart emas: minora, tosh figuralar, muzey konteksti va atrofdagi tekislik eski yoʻlni bir sokin toʻxtashda tushunarli qiladi.


        «Minoradan bir necha qadam chekinsangiz, manzara soddalashadi: osmon ostidagi gʻisht, yonidagi tosh figuralar va tekislikdan oʻtgan eski Chuy yoʻli.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni koʻrasiz"
    "title":
      "en": "Brick, stone figures, open Balasagun ground"
      "ru": "Кирпич, каменные фигуры, открытый Баласагун"
      "uz": "Gʻisht, tosh figuralar, ochiq Balasagʻun maydoni"
    "description":
      "en": "Keep the visit concrete. Burana is strongest when the visible details stay connected: the minaret first, the balbal stones next, then the open archaeological ground that explains why the tower stands here."
      "ru": "Держите визит конкретным. Бурана сильнее всего, когда видимые детали связаны между собой: сначала минарет, затем балбалы и открытая археологическая площадка, объясняющая, почему башня стоит именно здесь."
      "uz": "Tashrifni aniq tuting. Burana koʻrinadigan detallar bir-biriga bogʻlanganida kuchliroq: avval minora, keyin balbal toshlari, soʻng minora nega shu yerda turganini tushuntiradigan ochiq arxeologik hudud."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посещать"
      "uz": "Qanday koʻrish kerak"
    "title":
      "en": "Keep the stop clear and unhurried"
      "ru": "Не торопите короткую остановку"
      "uz": "Qisqa toʻxtashni shoshirmang"
    "description":
      "en": "Burana is easy to weaken by rushing from the car to the tower and back. Give the stop a simple order: look from a distance, read the brickwork, walk the stones, and leave time for current access checks."
      "ru": "Бурану легко ослабить, если быстро пройти от машины к башне и обратно. Дайте визиту простой порядок: посмотрите издалека, прочитайте кирпичный узор, пройдите к камням и оставьте время на актуальные правила доступа."
      "uz": "Mashinadan minoragacha borib darhol qaytsangiz, Burana kuchsizroq seziladi. Tashrifga oddiy tartib bering: uzoqdan koʻring, gʻisht naqshini oʻqing, toshlar yonidan yuring va amaldagi kirish qoidalariga vaqt qoldiring."
  - "blockType": "regular"
    "eyebrow":
      "en": "What to add nearby"
      "ru": "Что добавить рядом"
      "uz": "Yaqinda nima qoʻshish mumkin"
    "title":
      "en": "Upper Chuy archaeology, only when it fits"
      "ru": "Археология верхнего Чуя, только когда это уместно"
      "uz": "Yuqori Chuy arxeologiyasi, faqat mos kelganda"
    "description":
      "en": "Ak-Beshim/Suyab and Krasnaya Rechka/Navekat can deepen the Silk Road story when access, timing, and the route fit are confirmed for the date. If those extensions are not ready, keep Burana as the focused Chuy stop."
      "ru": "Ак-Бешим/Суяб и Красная Речка/Навекат могут углубить тему Шёлкового пути, если доступ, время и смысл продолжения подтверждены на дату поездки. Если эти остановки не готовы, лучше оставить Бурану главным фокусом Чуйской дороги."
      "uz": "Ak-Beshim/Suyab va Krasnaya Rechka/Navekat Ipak yoʻli mavzusini chuqurlashtirishi mumkin, lekin kirish, vaqt va davomning mantiqi safar sanasiga tasdiqlanganda. Agar bu toʻxtashlar tayyor boʻlmasa, Buranani Chuy yoʻlining asosiy fokusi sifatida qoldirish yaxshiroq."
