  "en": "Burana is where the Tokmok road becomes more than a transfer east of Bishkek. The brick tower rises from open ground, the Tian Shan sits behind it, and the site keeps the memory of medieval Balasagun close enough to read without turning the stop into a long museum day."
  "ru": "У Бураны дорога через Токмок перестаёт быть просто переездом восточнее Бишкека. Кирпичная башня стоит среди открытой равнины, за ней виден Тянь-Шань, а память о средневековом Баласагуне читается без длинной музейной программы."
  "uz": "Burana yonida Toqmoq yoʻli Bishkekdan sharqqa oddiy oʻtish boʻlib qolmaydi. Gʻishtin minora ochiq tekislikdan koʻtariladi, ortida Tyan-Shan koʻrinadi, oʻrta asr Balasagʻun xotirasi esa uzoq muzey dasturisiz ham seziladi."
