    "description":
      "en": "Sheikh Muslihiddin changes the market mood into a sacred courtyard. The fortress museum adds the older city story before the route turns back to the river or out of the city."
      "ru": "Шейх Муслихиддин переводит рыночное настроение в священный двор. Крепостной музей добавляет старую историю города перед выходом к реке или из города."
      "uz": "Shayx Muslihiddin bozor kayfiyatini muqaddas hovli sokinligiga oʻtkazadi. Qalʼa muzeyi esa yoʻnalish daryo boʻyiga yoki shahar tashqarisiga burilishidan oldin tarixiy mazmun qoʻshadi."
