  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "Where Khujand begins with trade"
      "ru": "Где Худжанд начинается с торговли"
      "uz": "Xoʻjand savdo bilan boshlanadigan joy"
    "description":
      "en": "Panjshanbe is strongest at the start of a Khujand walk because it introduces the city through people rather than monuments. The Silk Road idea becomes practical here: goods on the counters, sellers calling, food rows, and daily movement in the northern city center.


        «Panjshanbe is not only a place to buy things; it is where Khujand starts sounding like itself.»"
      "ru": "Панджшанбе лучше всего раскрывает Худжанд в начале прогулки, потому что вводит в город через людей, а не через памятники. Идея Шёлкового пути здесь становится простой и видимой: товары на прилавках, голоса продавцов, еда и повседневное движение в центре северного города.


        «Панджшанбе — не только место покупок; здесь Худжанд начинает звучать как сам Худжанд.»"
      "uz": "Panjshanbe Xoʻjand yurishining boshida eng aniq seziladi, chunki u shaharni yodgorliklar orqali emas, odamlar orqali ochadi. Ipak yoʻli gʻoyasi bu yerda amaliy koʻrinadi: rastadagi mahsulotlar, sotuvchilar ovozi, ovqat qatorlari va shimoliy shahar markazidagi kundalik harakat.


        «Panjshanbe faqat xarid joyi emas; Xoʻjand aynan shu yerda oʻz ovozi bilan eshitila boshlaydi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni koʻrasiz"
    "title":
      "en": "Market rows, food stalls, and city movement"
      "ru": "Рыночные ряды, еда и движение города"
      "uz": "Bozor qatorlari, oziq-ovqat rastalari va shahar harakati"
    "description":
      "en": "The bazaar is easiest to notice in three parts: the central market rows, the food and spice stalls, and the short walk back into Khujand's nearby landmarks. 1. **Central market rows** **alt:** Panjshanbe Bazaar market rows in central Khujand. **caption:** The market rows keep Khujand's trade memory visible in the city center. **media_label:** Panjshanbe market rows 2. **Food and spice rows** **alt:** Bread, fruit, spices, and produce rows inside Panjshanbe Bazaar. **caption:** Food, spices, and everyday shopping give the stop its human rhythm. **media_label:** Bread, fruit, and spices 3. **Central-city walk** **alt:** The city walk from Panjshanbe Bazaar toward nearby Khujand landmarks. **caption:** The bazaar pairs naturally with Sheikh Muslihiddin and the fortress museum. **media_label:** Bazaar to city walk"
      "ru": "Базар легче воспринимать через три части: центральные торговые ряды, еду и специи, а также короткую прогулку к соседним ориентирам Худжанда. 1. **Центральные торговые ряды** **alt:** Торговые ряды базара Панджшанбе в центре Худжанда. **caption:** Рыночные ряды сохраняют торговую память Худжанда в центре города. **media_label:** Ряды Панджшанбе 2. **Еда и специи** **alt:** Хлеб, фрукты, специи и продуктовые ряды на базаре Панджшанбе. **caption:** Еда, специи и повседневные покупки дают остановке человеческий ритм. **media_label:** Хлеб, фрукты и специи 3. **Городская прогулка** **alt:** Прогулка от базара Панджшанбе к соседним ориентирам Худжанда. **caption:** Базар естественно сочетается с шейхом Муслихиддином и крепостным музеем. **media_label:** От базара к городу"
      "uz": "Bozorni uch qismda koʻrish oson: markaziy savdo qatorlari, ovqat va ziravor rastalari, hamda yaqin diqqat joylarga olib boradigan shahar yurishi. 1. **Markaziy savdo qatorlari** **alt:** Xoʻjand markazidagi Panjshanbe bozori savdo qatorlari. **caption:** Savdo qatorlari Xoʻjandning bozor xotirasini shahar markazida saqlaydi. **media_label:** Panjshanbe savdo qatorlari 2. **Ovqat va ziravor qatorlari** **alt:** Panjshanbe bozoridagi non, meva, ziravor va mahsulot qatorlari. **caption:** Ovqat, ziravor va kundalik xarid bu joyga insoniy surʼat beradi. **media_label:** Non, meva va ziravorlar 3. **Markaziy shahar yurishi** **alt:** Panjshanbe bozoridan Xoʻjandning yaqin diqqat joylariga olib boradigan shahar yurishi. **caption:** Bozor Shayx Muslihiddin va qalʼa muzeyi bilan bitta markaziy yurishga kiradi. **media_label:** Bozordan shahar yurishiga"
