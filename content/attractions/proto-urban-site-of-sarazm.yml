  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "Where the valley's early urban story begins"
      "ru": "Где начинается ранняя протогородская история долины"
      "uz": "Vodiyning ilk protoshahar tarixi boshlangan joy"
    "description":
      "en": "Sarazm moves the valley from medieval heritage to much older settled life. Its remains point to farming and pastoral communities, mineral resources, craft production, and exchange that connected Central Asia with wider horizons.


        «Sarazm turns the Zeravshan Valley from a Silk Road corridor into a much older human settlement story.»"
      "ru": "Саразм переносит долину от средневекового наследия к гораздо более ранней оседлой жизни. Его остатки говорят о земледельческих и скотоводческих общинах, минеральных ресурсах, ремесле и обмене с дальними торговыми горизонтами.


        «Саразм превращает Зеравшан из коридора Шёлкового пути в гораздо более древнюю историю человеческого поселения.»"
      "uz": "Sarazm vodiyni oʻrta asr merosidan ancha oldingi oʻtroq hayotga olib oʻtadi. Bu yer qoldiqlari dehqonchilik va chorvadorlik dunyolari, mineral manbalar, hunar va uzoq savdo ufqlari bilan almashinuv haqida gapiradi.


        «Sarazm Zarafshon vodiysini Ipak yoʻli yoʻlagidan ancha qadimiy inson manzili hikoyasiga aylantiradi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni koʻrasiz"
    "title":
      "en": "Earth traces, shelters, and valley setting"
      "ru": "Земля, навесы и среда долины"
      "uz": "Yer izlari, himoya soyabonlari va vodiy muhiti"
    "description":
      "en": "The site is read through protected remains and careful interpretation: low archaeological traces, shelter structures, and the valley landscape that explains why settlement could begin here."
      "ru": "Памятник читается через охраняемые остатки и внимательное объяснение: низкие археологические следы, защитные конструкции и ландшафт долины, где могло возникнуть поселение."
      "uz": "Yodgorlik himoyalangan qoldiqlar va diqqatli izoh orqali oʻqiladi: past arxeologik izlar, himoya tuzilmalari va manzil nega shu yerda boshlanganini tushuntiradigan vodiy manzarasi."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посещать"
      "uz": "Qanday koʻrish"
    "title":
      "en": "Start with the chronology"
      "ru": "Сначала поймите хронологию"
      "uz": "Avval vaqt tartibini tushuning"
    "description":
      "en": "Sarazm is a better visit when the chronology is clear before you start. Once the 4th-3rd millennium BCE frame is in place, the modest remains carry more weight."
      "ru": "Саразм воспринимается сильнее, когда хронология понятна до прогулки. После рамки IV-III тысячелетий до н. э. скромные остатки начинают звучать весомее."
      "uz": "Sarazm vaqt tartibi aniq boʻlganda kuchliroq koʻrinadi. Miloddan avvalgi IV-III ming yillik ramkasi tushunilgach, kamtar qoldiqlar ham ogʻirroq maʼno oladi."
  - "blockType": "regular"
