    "uz": "Zurmala Termizning buddaviy o‘tmishiga aniq saqlanib qolgan shakl beradi: Qadimgi Termiz arxeologik hududi yonidagi yumaloq g‘isht stupa. Uni muzeydan keyin va Fayoztepa bilan birga tushunish osonroq; topilmalar, monastir devorlari va stupa bir mavzuni davom ettiradi."
