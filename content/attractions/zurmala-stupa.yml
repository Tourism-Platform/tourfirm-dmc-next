      "en": "Zurmala matters because the route through Ancient Termiz still has a visible Buddhist stupa on the ground, not only museum fragments or low lines of walls. Sources connect the monument with the Buddhist presence of the Kushan period; on site, the traveler sees the surviving brick form and the open ground around it."
      "ru": "Зурмала важна потому, что в маршруте по Древнему Термезу остаётся видимая буддийская ступа, а не только музейные фрагменты или низкие линии стен. Источники связывают её с буддийским присутствием кушанского времени рядом с Древним Термезом; на месте путешественник видит сохранившуюся кирпичную форму и открытую площадку вокруг."
      "uz": "Zurmala Qadimgi Termiz yo‘nalishida ko‘rinib turgan buddaviy stupa saqlangani uchun muhim: bu faqat muzeydagi bo‘laklar yoki past devor chiziqlari emas. Manbalar uni Kushon davridagi buddaviy mavjudlik bilan bog‘laydi; joyida sayohatchi saqlangan g‘isht shaklni va atrofdagi ochiq maydonni ko‘radi."
