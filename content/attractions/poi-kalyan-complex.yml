      "ru": "Бухара часто чувствуется через низкие улицы, тенистые дворы и близкие кирпичные поверхности. У Пои-Каляна город раскрывается вверх: минарет даёт ориентир, а мечеть и медресе возвращают масштаб к человеку."
      "uz": "Buxoro ko‘pincha past ko‘chalar, soyali hovlilar va yaqin g‘isht yuzalari orqali seziladi. Poyi Kalonda shahar yuqoriga ochiladi: minora yo‘l ko‘rsatadi, masjid va madrasa esa miqyosni odamga yaqinlashtiradi."
