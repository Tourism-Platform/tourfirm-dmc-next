    "en": "Sary-Mogul is a village landscape before it is a route choice: roofs low in the valley, poles beside the gravel road, and the Trans-Alay range rising behind it. From here, Tulpar-Kol, Traveller's Pass, and the Lenin Peak approach become real choices rather than names on a map."
    "ru": "Сары-Могол сначала читается как сельский ландшафт: низкие крыши в долине, столбы у гравийной дороги и Заалайский хребет за ними. Отсюда Тулпар-Кёль, перевал Путешественников и подходы к пику Ленина становятся не названиями на карте, а настоящим выбором маршрута."
    "uz": "Sary-Mogʻul avval qishloq manzarasi sifatida oʻqiladi: vodiydagi past tomlar, shagʻal yoʻl yonidagi ustunlar va ortida koʻtarilgan Zaalay tizmasi. Shu yerdan Tulpar-Koʻl, Sayohatchilar dovoni va Lenin choʻqqisi yoʻnalishlari xaritadagi nom emas, haqiqiy tanlovga aylanadi."
