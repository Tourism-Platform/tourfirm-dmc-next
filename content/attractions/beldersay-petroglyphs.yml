    "description":
      "en": "Beldersay is usually remembered for slopes, lift rides, winter snow, and the road from Chimgan. The petroglyphs change that story. Higher in the gorge, the route leaves the easy resort frame and asks the traveler to look closely at hunting scenes, animal forms, and marks softened by wind, sun, snow, and time.


        «Above Beldersay, the route stops being only a mountain view and becomes a careful reading of stone.»"
      "ru": "Бельдерсай обычно запоминают по склонам, канатной дороге, зимнему снегу и дороге от Чимгана. Петроглифы меняют этот образ. Выше в ущелье маршрут уходит из привычного курортного масштаба и просит смотреть внимательнее: на сцены охоты, фигуры животных и следы, смягчённые ветром, солнцем, снегом и временем.


        «Над Бельдерсаем маршрут перестаёт быть только видом на горы и становится внимательным чтением камня.»"
      "uz": "Beldersoy ko‘pincha yonbag‘irlar, ko‘targichlar, qishki qor va Chimyondan keladigan yo‘l bilan esda qoladi. Petrogliflar bu tasavvurni o‘zgartiradi. Darada balandroqda yo‘nalish oson kurort ko‘lamidan chiqib, ov sahnalari, hayvon shakllari va shamol, quyosh, qor hamda vaqt yumshatgan izlarga diqqat bilan qarashni so‘raydi.


        «Beldersoy tepasida yo‘nalish faqat tog‘ manzarasi emas, toshni ehtiyot bilan o‘qishga aylanadi.»"
