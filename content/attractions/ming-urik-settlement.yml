  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "Ancient Chach beneath the modern capital"
      "ru": "Древний Чач под современным Ташкентом"
      "uz": "Zamonaviy Toshkent ostidagi qadimgi Choch"
    "description":
      "en": "Many first Tashkent impressions are modern: broad avenues, Soviet-era facades, metro halls and museums. Ming Urik brings the scale down to clay, roofed walls and fragments that need explanation. It is not a grand monument; it is the place where the guide can show how the capital's story reaches back to fortified Chach and early urban life under today's streets.


        «At Ming Urik, Tashkent feels older than the avenues around it.»"
      "ru": "Первое впечатление от Ташкента часто современное: широкие проспекты, советские фасады, метро и музеи. Минг-Урик уменьшает масштаб до глины, стен под навесом и фрагментов, которым нужно объяснение. Это не парадный памятник, а место, где гид помогает увидеть, как история столицы уходит к укреплённому Чачу и ранней городской жизни под сегодняшними улицами.


        «В Минг-Урике Ташкент кажется старше проспектов вокруг.»"
      "uz": "Toshkent haqidagi birinchi taassurot ko‘pincha zamonaviy: keng xiyobonlar, sovet davri fasadlari, metro zallari va muzeylar. Ming O‘rik bu ko‘lamni loy, tom ostidagi devorlar va izoh talab qiladigan parchalargacha kichraytiradi. Bu tantanali yodgorlik emas; gid shu yerda poytaxt tarixi mustahkamlangan Choch va bugungi ko‘chalar ostidagi erta shahar hayotiga borib taqalishini ko‘rsatadi.


        «Ming O‘rikda Toshkent atrofidagi xiyobonlardan ham qadimiyroq seziladi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Clay walls, sheltered remains and reconstructed rooms"
      "ru": "Глинобитные стены, укрытые остатки и реконструированные комнаты"
      "uz": "Loy devorlar, tom ostidagi qoldiqlar va rekonstruksiya qilingan xonalar"
    "description":
      "en": "Look for the evidence at close range: roofed clay walls, excavation edges and reconstructed domestic details that make the early settlement easier to imagine."
      "ru": "Смотрите на доказательства вблизи: стены под навесом, края раскопа и бытовые реконструкции помогают представить раннее поселение."
      "uz": "Dalillarga yaqindan qarang: tom ostidagi loy devorlar, qazilma chetlari va erta shahristonni tasavvur qilishga yordam beradigan turmush rekonstruksiyalari."
