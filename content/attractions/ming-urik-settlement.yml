  "metaDescription":
    "en": "Ming Urik is modest at first sight: an urban entrance, a roofed excavation, clay walls, pottery and reconstructed domestic corners. With a guide's explanation, the stop turns present-day Tashkent toward the earlier city of Chach and the fortified life that once stood near today's center."
    "ru": "Сначала Минг-Урик кажется скромным: городской вход, раскоп под навесом, глинобитные стены, керамика и реконструированные бытовые уголки. С объяснением гида остановка переводит сегодняшний Ташкент к более раннему Чачу и укреплённой городской жизни, которая когда-то стояла рядом с нынешним центром."
    "uz": "Ming O‘rik avvaliga kamtar ko‘rinadi: shahar ichidagi kirish, tom ostidagi qazilma, loy devorlar, sopol buyumlar va rekonstruksiya qilingan turmush burchaklari. Gid izohi bilan bu to‘xtam bugungi Toshkentni qadimgi Chochga va hozirgi markaz yonida bo‘lgan mustahkamlangan shahar hayotiga buradi."
