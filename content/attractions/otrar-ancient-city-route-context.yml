    "description":
      "en": "Otrar is strongest when the museum-reserve context and the ancient settlement are treated together. The ruins are exposed and subtle, so the visit needs interpretation, water, and an unhurried route pace."
      "ru": "Отрар сильнее всего, когда музейный контекст и древнее городище воспринимаются вместе. Руины открыты и тонки по деталям, поэтому нужны объяснение, вода и спокойный темп маршрута."
      "uz": "Otrar muzey-qoʻriqxona konteksti va qadimiy manzilgoh birga qabul qilinganda kuchliroq. Xarobalar ochiq va nozik, shuning uchun izoh, suv va shoshilmas yoʻl surʼati kerak."
