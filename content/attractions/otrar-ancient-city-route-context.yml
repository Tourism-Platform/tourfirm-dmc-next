      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "Where an oasis city comes back into view"
      "ru": "Где оазисный город снова становится видимым"
      "uz": "Voha shahri yana koʻrina boshlaydigan joy"
    "description":
      "en": "Otrar adds the city-and-steppe side of southern Kazakhstan to a Turkistan journey. The attraction is not a single polished facade; its meaning builds through earth structures, museum evidence, and the surrounding oasis.


        «Otrar rewards a guide's explanation and a patient route pace: the city is still there, but much of it has to be read through the ground.»"
      "ru": "Отрар важен потому, что добавляет к маршруту по Туркестану сторону города и степи. Здесь нет одной отполированной фасадной точки: смысл складывается из земляных конструкций, музейных свидетельств и окружающего оазиса.


        «Отрару нужен гид и неторопливый темп: город всё ещё здесь, но многое приходится читать через землю.»"
      "uz": "Otrar Turkiston safariga shahar va dasht tomonini qoʻshadi. Bu yerda bitta sayqal berilgan fasad emas, balki xom gʻisht tuzilmalari, muzey dalillari va atrofdagi voha orqali maʼno ochiladi.


        «Otrarga gid izohi va shoshilmas surʼat kerak: shahar hali shu yerda, lekin uning ko‘p qismi yer orqali oʻqiladi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Earth walls, city traces, and museum context"
      "ru": "Земляные стены, следы города и музейный контекст"
      "uz": "Xom gʻisht devorlar, shahar izlari va muzey konteksti"
    "description":
      "en": "Otrar is understood through visible fragments and the interpretation around them: the raised settlement, earthen structures, restored urban traces, and the museum evidence that gives the low remains a human scale."
      "ru": "Отрар понимается через фрагменты и объяснение вокруг них: поднятое городище, земляные конструкции, восстановленные городские следы и музейные свидетельства, которые дают низким остаткам человеческий масштаб."
      "uz": "Otrar ko‘rinadigan parchalari va ularning atrofidagi izoh orqali tushuniladi: ko‘tarilgan manzilgoh, xom gʻisht tuzilmalari, tiklangan shahar izlari va past qoldiqlarga inson miqyosini beradigan muzey dalillari."
  - "blockType": "regular"
