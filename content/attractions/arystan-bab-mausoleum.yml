  "en": "Arystan Bab turns the Otrar road from archaeology alone toward a living shrine. After museum rooms and open earthworks, you arrive where people pray, remember local stories, and move with care. Give the stop its own calm place in the journey, with dress, conduct, and photo rules checked before arrival."
  "ru": "Арыстан-Баб переводит дорогу через Отрар из одной археологии к живой святыне. После музейных залов и открытых раскопов вы приезжаете туда, где люди молятся, хранят местные предания и движутся осторожнее. Такому визиту нужно собственное спокойное место: одежду, поведение и правила съёмки лучше проверить до приезда."
  "uz": "Arystan Bab Oʻtror yoʻlini faqat arxeologiya emas, tirik ziyoratgoh tomon buradi. Muzey zallari va ochiq arxeologik maydondan keyin siz odamlar ibodat qiladigan, mahalliy rivoyatlarni eslaydigan va ehtiyotkorroq harakatlanadigan joyga kelasiz. Bu toʻxtash uchun alohida sokin vaqt kerak: kiyim, xulq va surat qoidalarini kelishdan oldin tekshirish maʼqul."
