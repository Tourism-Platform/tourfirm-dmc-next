      "en": "The mausoleum is understood through conduct as much as architecture: arrival, corridor space, mosque, shrine areas, and the return toward Otrar."
      "ru": "Мавзолей понимается не только через архитектуру, но и через поведение: приезд, коридорные пространства, мечеть, зоны святыни и возвращение к Отрару."
      "uz": "Maqbara faqat meʼmorchilik orqali emas, xulq orqali ham tushuniladi: kelish, koridorlar, masjid, ziyorat joylari va Oʻtrorga qaytish."
