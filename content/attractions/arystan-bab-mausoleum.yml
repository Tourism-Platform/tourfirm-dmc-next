    "title":
      "en": "A shrine that changes the Otrar road"
      "ru": "Святыня, которая меняет дорогу к Отрару"
      "uz": "Oʻtror yoʻlini oʻzgartiradigan ziyoratgoh"
    "description":
      "en": "Arystan Bab adds devotion to the Otrar sequence without pushing archaeology aside. The mausoleum stands over a burial place remembered locally as Arystan Bab's and keeps the road close to Khoja Ahmed Yasawi's spiritual world.


        «Here the Otrar road asks for quiet conduct as much as historical explanation.»"
      "ru": "Арыстан-Баб добавляет отрарской последовательности паломнический смысл, не вытесняя археологию. Мавзолей стоит над местом захоронения, которое местная традиция связывает с Арыстан-Бабом, и держит дорогу рядом с духовным миром Ходжи Ахмада Ясави.


        «Здесь дорога к Отрару требует тихого поведения не меньше, чем исторического объяснения.»"
      "uz": "Arystan Bab Oʻtror ketma-ketligiga ziyorat maʼnosini qoʻshadi, lekin arxeologiyani chetga surmaydi. Maqbara mahalliy xotirada Arystan Bab dafn joyi sifatida eslanadigan yer ustida turadi va yoʻlni Xoja Ahmad Yasaviy maʼnaviy olamiga yaqin tutadi.


        «Bu yerda Oʻtror yoʻli tarixiy izoh qadar sokin xulqni ham soʻraydi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
