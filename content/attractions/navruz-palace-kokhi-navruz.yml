    "title":
      "en": "A modern palace built from craft detail"
      "ru": "Современный дворец, собранный из ремесленных деталей"
      "uz": "Hunarmandchilik detallari bilan qurilgan zamonaviy saroy"
    "description":
      "en": "Kokhi Navruz matters because it shows Dushanbe's ceremonial side through the hands of Tajik craftspeople. Instead of a single historical relic, the main story is the way carving, stone, mosaic, plaster, and painted ceilings were gathered into one modern civic complex."
      "ru": "Кохи Навруз важен тем, что показывает церемониальную сторону Душанбе через работу таджикских мастеров. Главная история здесь не одна древняя реликвия, а резьба, камень, мозаика, ганчевая отделка и расписные потолки, собранные в современный городской комплекс."
      "uz": "Koʻhi Navroʻz Dushanbening tantanali tomonini tojik ustalari mehnati orqali ko‘rsatadi. Bu yerda asosiy hikoya bitta qadimiy yodgorlik emas, balki yogʻoch oʻymakorligi, tosh, mozaika, ganch bezagi va naqshli shiftlarning zamonaviy shahar majmuasida jamlanishidir."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni koʻrasiz"
    "title":
      "en": "Halls, carving, stone and gold"
      "ru": "Залы, резьба, камень и золото"
      "uz": "Zallar, oʻymakorlik, tosh va oltin"
    "description":
      "en": "The visit is about moving room by room: painted ceilings, decorative plaster, carved wood, stone surfaces, glass mosaic, and the ceremonial scale of the halls."
      "ru": "Здесь важно двигаться от зала к залу: расписные потолки, ганчевая отделка, резное дерево, каменные поверхности, стеклянная мозаика и церемониальный масштаб раскрываются постепенно."
      "uz": "Bu yerda zaldan zalga oʻtib koʻrish muhim: naqshli shiftlar, ganch bezagi, oʻyma yogʻoch, tosh yuzalar, shisha mozaika va tantanali miqyos asta-sekin ochiladi."
  - "blockType": "regular"
    "eyebrow":
