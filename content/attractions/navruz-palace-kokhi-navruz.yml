      "en": "The stop reads best as a focused craft-and-design visit. Keep the modern date clear, move slowly through the hall details, and check whether interiors are open before planning the route around it."
      "ru": "Лучше воспринимать Кохи Навруз как короткий визит о ремесле и дизайне. Держите в памяти современную дату, рассматривайте детали залов спокойно и заранее проверяйте, открыты ли интерьеры."
      "uz": "Koʻhi Navroʻzni hunarmandchilik va dizayn haqidagi qisqa tashrif sifatida ko‘rish maʼqul. Zamonaviy qurilish sanasini esda tuting, zal detallarini shoshmasdan kuzating va interyerlar ochiqligini oldindan tekshiring."
