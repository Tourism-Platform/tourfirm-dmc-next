"excerpt":
  "en": "Navruz Palace feels different from Dushanbe's museums and avenues. Built in 2014, the large five-floor complex turns national-style architecture into rooms of wood carving, stonework, glass mosaic, painted ceilings, and chandelier light; a short visit gives travelers a close look at contemporary Tajik ornament."
  "ru": "Дворец Навруз воспринимается иначе, чем музеи и проспекты Душанбе. Построенный в 2014 году большой пятиэтажный комплекс собирает национальную архитектуру в залах с резьбой по дереву, камнем, стеклянной мозаикой, расписными потолками и светом люстр; короткий визит даёт внимательный взгляд на современный таджикский орнамент."
  "uz": "Navroʻz saroyi Dushanbe muzeylari va xiyobonlaridan boshqacha taassurot beradi. 2014 yilda qurilgan yirik besh qavatli majmua milliy uslubdagi meʼmorchilikni yogʻoch oʻymakorligi, tosh, shisha mozaika, naqshli shiftlar va qandil nuri bilan toʻldirilgan zallarga jamlaydi; qisqa tashrif zamonaviy tojik bezagini yaqindan ko‘rsatadi."
