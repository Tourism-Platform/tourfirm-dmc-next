    "en": "Near the Oq-Saroy area, Maqom Museum gathers archive photographs, documents, musical instruments, and the memory of maqom schools. It gives the Shakhrisabz route a calmer room after the monuments, where Timurid architecture is joined by classical music memory and living Uzbek repertoire."
    "ru": "Рядом с зоной Ак-Сарая Музей макома собирает архивные фотографии, документы, музыкальные инструменты и память о школах макома. После памятников он даёт маршруту более тихую комнату, где темуридская архитектура соединяется с классической музыкальной памятью и живым узбекским репертуаром."
    "uz": "Ak-Saroy hududiga yaqin Maqom muzeyida arxiv suratlari, hujjatlar, musiqa asboblari va maqom maktablari xotirasi jamlanadi. Yodgorliklar ortidan u Shahrisabz yo‘nalishiga tinchroq xona beradi: temuriy meʼmorchilik mumtoz musiqa xotirasi va tirik o‘zbek repertuari bilan bog‘lanadi."
