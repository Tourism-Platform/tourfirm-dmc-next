    "title":
      "en": "Where Shakhrisabz begins to listen"
      "ru": "Где Шахрисабз начинает слушать"
      "uz": "Shahrisabz tinglashni boshlaydigan joy"
    "description":
      "en": "The museum matters because Shakhrisabz can feel dominated by scale: Ak-Saray height, blue domes, sun-bright brick, and long views. Here the route turns inward. A guide can move from a photograph or an instrument to the singers, musicians, and listeners who keep maqom from becoming only a word on a label."
      "ru": "Музей важен потому, что Шахрисабз часто ощущается городом масштаба: высота Ак-Сарая, синие купола, яркий кирпич и дальние виды. Здесь маршрут поворачивает внутрь. Гид может перейти от фотографии или инструмента к певцам, музыкантам и слушателям, благодаря которым маком остаётся не только словом на подписи."
      "uz": "Muzey muhim, chunki Shahrisabz ko‘pincha miqyos shahri sifatida seziladi: Ak-Saroy balandligi, ko‘k gumbazlar, yorqin g‘isht va uzoq manzaralar. Bu yerda yo‘nalish ichkariga buriladi. Gid surat yoki asbobdan xonandalar, sozandalar va tinglovchilarga o‘tishi mumkin; ular tufayli maqom faqat yozuvdagi so‘z bo‘lib qolmaydi."
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Instruments, archive images, and regional maqom memory"
      "ru": "Инструменты, архивные образы и региональная память макома"
      "uz": "Asboblar, arxiv suratlari va mintaqaviy maqom xotirasi"
    "description":
      "en": "The gallery rhythm should feel intimate: a close look at instruments, photographs, documents, and the quieter museum rooms that let Shakhrisabz carry music memory as well as tile and brick."
      "ru": "Ритм галереи должен быть камерным: близкий взгляд на инструменты, фотографии, документы и более тихие музейные залы, где Шахрисабз несёт не только изразец и кирпич, но и музыкальную память."
      "uz": "Galereya ritmi kamerali bo‘lishi kerak: asboblar, suratlar, hujjatlar va Shahrisabzga koshin hamda g‘isht qatori musiqa xotirasini ham beradigan sokinroq muzey xonalari."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как проходит визит"
      "uz": "Tashrif qanday kechadi"
    "title":
      "en": "Let the music archive slow the monument day"
      "ru": "Музыкальный архив замедляет день памятников"
      "uz": "Musiqa arxivi yodgorliklar kunini sekinlashtiradi"
    "description":
      "en": "The museum is most useful when it gives the Shakhrisabz walk a human pause. It does not need a promised performance to matter; a careful look at instruments, photographs, and names can make the city feel less silent after the open monuments."
      "ru": "Музей особенно полезен, когда даёт прогулке по Шахрисабзу человеческую паузу. Для его смысла не нужно обещать выступление: внимательный взгляд на инструменты, фотографии и имена уже помогает городу не звучать безмолвно после открытых памятников."
      "uz": "Muzey Shahrisabz sayriga insoniy pauza berganda eng foydali. Uning maʼnosi uchun albatta jonli chiqish vaʼda qilish shart emas: asboblar, suratlar va nomlarga sinchiklab qarash ochiq yodgorliklardan keyin shaharni jim qoldirmaydi."
