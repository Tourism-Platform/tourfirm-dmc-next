  "en": "Near the Oq-Saroy area, Maqom Museum gathers archive photographs, documents, musical instruments, and the memory of maqom schools. It gives the Shakhrisabz route a calmer room after the monuments, where Timurid architecture is joined by classical music memory and living Uzbek repertoire."
