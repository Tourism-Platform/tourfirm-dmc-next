    "en": "ALZHIR changes the rhythm of an Astana journey. After the capital's glass towers, museums, and ceremonial avenues, the road to Akmol village leads to a place shaped by loss, names, barracks, and the women imprisoned here during Soviet repression. The value of the visit is not another sight checked off. It is the choice to slow down enough to understand what the memorial asks you to remember."
    "ru": "АЛЖИР меняет ритм поездки по Астане. После стеклянных башен, музеев и широких церемониальных проспектов дорога в Акмол ведёт к месту, где главными становятся утрата, имена, бараки и женщины, заключённые здесь во время советских репрессий. Ценность визита не в ещё одной отметке в списке, а в выборе замедлиться и понять, что именно мемориал просит помнить."
    "uz": "ALJIR Ostona safarining ritmini oʻzgartiradi. Poytaxtning shisha minoralari, muzeylari va keng marosim shohkoʻchalaridan keyin Aqmolga olib boradigan yoʻl yoʻqotish, ismlar, baraklar va sovet qatagʻoni davrida bu yerda qamalgan ayollar haqida oʻylashga majbur qiladi. Tashrifning qadri navbatdagi joyni belgilab qoʻyishda emas, memorial nimani eslashni soʻrayotganini anglash uchun sekinlashishda."
