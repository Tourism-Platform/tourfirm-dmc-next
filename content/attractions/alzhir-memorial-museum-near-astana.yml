  "uz": "ALJIR Ostona safarining ritmini oʻzgartiradi. Poytaxtning shisha minoralari, muzeylari va keng marosim shohkoʻchalaridan keyin Aqmolga olib boradigan yoʻl yoʻqotish, ismlar, baraklar va sovet qatagʻoni davrida bu yerda qamalgan ayollar haqida oʻylashga majbur qiladi. Tashrifning qadri navbatdagi joyni belgilab qoʻyishda emas, memorial nimani eslashni soʻrayotganini anglash uchun sekinlashishda."
