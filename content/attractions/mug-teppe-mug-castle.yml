"excerpt":
  "en": "Mug Teppe is a compact hill site, not a restored castle. Its value is quieter: settlement memory, traces of an old gate and dome, and the first context for understanding why Istaravshan's later monuments belong together. Start here, and Kok Gumbaz, Hazrat-i-Shoh, bazaar streets, and old neighborhoods feel less like isolated stops."
  "ru": "Муг-Теппе - компактная площадка на холме, а не восстановленная крепость. Его ценность спокойнее: память поселения, следы старых ворот и купола, первый контекст для понимания Истаравшана. Если начать прогулку здесь, Кок-Гумбаз, Хазрати-Шох, базарные улицы и кварталы ниже складываются в городскую историю, а не в набор остановок."
  "uz": "Mug Teppe qayta tiklangan qalʼa emas, ixcham tepalik maydonidir. Uning qiymati sokinroq: manzilgoh xotirasi, eski darvoza va gumbaz izlari, Istaravshanni tushunish uchun birinchi kontekst. Sayr shu yerdan boshlansa, Kok Gumbaz, Hazrati Shoh, bozor koʻchalari va pastdagi mahallalar alohida toʻxtashlar emas, bitta shahar hikoyasiga aylanadi."
