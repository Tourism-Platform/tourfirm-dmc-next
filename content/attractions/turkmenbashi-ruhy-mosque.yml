"excerpt":
  "en": "After Ashgabat's museums and monument parks, Turkmenbashi Ruhy Mosque takes the route west to Gypjak. The setting changes quickly: central-city monuments give way to a white-marble mosque complex, four high minarets, fountains, and a memorial tone that calls for a quieter visit. The mosque is an active religious place, and the mausoleum beside it gives the stop a ceremonial weight. Include it only after current visitor access, prayer-time rhythm, dress expectations, entrance approach, and photography boundaries have been checked locally."
  "ru": "После музеев и монументальных парков Ашхабада мечеть Туркменбаши Рухы выводит маршрут к Гыпджаку. Здесь меняется ощущение маршрута: центральные монументы уступают место беломраморному комплексу, четырём высоким минаретам, фонтанам и мемориальной среде, где нужна более спокойная манера посещения. Мечеть остаётся действующим религиозным местом, а мавзолей рядом задаёт церемониальный тон. Включайте её в маршрут только после локальной проверки доступа, времени молитв, требований к одежде, подъезда и границ фотосъёмки."
  "uz": "Ashxobod muzeylari va monument bog‘laridan keyin Turkmanboshi Ruhy masjidi yo‘lni Gypjakka olib chiqadi. Manzara tez o‘zgaradi: markazdagi monumentlar ortda qolib, oq marmar masjid majmuasi, to‘rt baland minora, favvoralar va sokinroq tashrifni talab qiladigan xotira muhiti boshlanadi. Masjid faol diniy joy, yonidagi maqbara esa tashrifga tantanali ohang beradi. Uni yo‘nalishga faqat kirish, namoz vaqti, kiyinish talablari, kelish yo‘li va suratga olish chegaralari joyida tekshirilgandan keyin kiriting."
