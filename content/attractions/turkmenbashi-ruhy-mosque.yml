    "description":
      "en": "The stop's value is not only size. Turkmenbashi Ruhy Mosque helps travelers understand Ashgabat beyond the central avenues: white marble, formal religious architecture, memorial space, and a slower, more restrained way of moving than in a museum or monument park.


        «This is not another city landmark for a quick stop; it is a mosque and memorial setting that changes the tone of an Ashgabat route.»"
      "ru": "Ценность остановки не только в размере. Мечеть Туркменбаши Рухы помогает увидеть Ашхабад за пределами центральных проспектов: белый мрамор, строгую религиозную архитектуру, мемориальное пространство и более сдержанное движение, чем в музее или парке монументов.


        «Это не ещё один городской ориентир для быстрой отметки; это мечеть и мемориальная среда, которые меняют тон ашхабадского маршрута.»"
      "uz": "Bu to‘xtashning qiymati faqat kattaligida emas. Turkmanboshi Ruhy masjidi Ashxobodning markaziy xiyobonlardan tashqaridagi tomonini ko‘rsatadi: oq marmar, rasmiy diniy meʼmorchilik, xotira muhiti va muzey yoki monument bog‘iga qaraganda vazminroq harakat.


        «Bu tez belgilab o‘tiladigan yana bir shahar mo‘ljali emas; u Ashxobod yo‘nalishining ohangini o‘zgartiradigan masjid va xotira muhitidir.»"
