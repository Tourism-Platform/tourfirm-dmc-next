      "uz": "Ruh Ordo Cholpon-Ataga mehmonxonalar, sohil va yo‘l o‘tishlaridan boshqa ritm beradi. Tashrif suvga yaqin qoladi, ammo ma’no madaniy belgilar, adabiyot, e’tiqod va ochiq hududning ko‘l bo‘yidagi sokinligidan keladi."
