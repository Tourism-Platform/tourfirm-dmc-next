    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nega bu joy"
    "title":
      "en": "A calm architectural stop at the edge of the market"
      "ru": "Спокойная архитектурная остановка у рынка"
      "uz": "Bozor chetidagi sokin meʼmoriy bekat"
    "description":
      "en": "Kukeldash deserves a little more than a photograph after Chorsu. It gives the old Tashkent walk a change of pace: a 16th-century madrasah form, a high entrance portal, a hujra-lined courtyard, tile detail, and the present-day care that comes with a functioning religious place.


        «Kukeldash is strongest when Chorsu is still close enough to hear, but the courtyard has already slowed your steps.»"
      "ru": "Кукельдаш заслуживает чуть больше времени, чем фотография после Чорсу. Он меняет темп прогулки по старому Ташкенту: форма медресе XVI века, высокий входной портал, двор с худжрами, керамические детали и современная осторожность вокруг действующего религиозного места.


        «Кукельдаш сильнее всего, когда Чорсу ещё почти слышно, но двор уже замедлил шаг.»"
      "uz": "Ko‘kaldosh Chorsudan keyingi shoshilinch surat bekati bo‘lib qolmasin. U eski Toshkent sayriga boshqa surʼat beradi: XVI asr madrasasi, baland kirish peshtoqi, hujralar bilan o‘ralgan hovli, koshin detallari va faol diniy joy atrofidagi ehtiyotkorlik.


        «Ko‘kaldosh Chorsu hali eshitilib turgan, lekin hovli qadamlaringizni allaqachon sekinlashtirgan paytda eng kuchli ko‘rinadi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Courtyard, portal, and tile detail"
      "ru": "Двор, портал и керамические детали"
      "uz": "Hovli, peshtoq va koshin detallari"
    "description":
      "en": "The strongest views show the madrasah as a place, not only a facade: courtyard garden, brick arcades, a tall tiled portal, and the shift from Chorsu's street energy into quieter space."
      "ru": "Лучшие виды показывают медресе как место, а не только фасад: двор с зеленью, кирпичные аркады, высокий керамический портал и переход от энергии Чорсу к более тихому пространству."
      "uz": "Eng kuchli ko‘rinishlar madrasani faqat fasad emas, joy sifatida ko‘rsatadi: ko‘kalamzor hovli, g‘isht ravoqlar, baland koshinli peshtoq va Chorsu energiyasidan sokinroq makonga o‘tish."
  - "blockType": "regular"
    "eyebrow":
      "en": "How to visit"
      "ru": "Как посещать"
      "uz": "Qanday ko‘rish"
    "title":
      "en": "Keep the stop respectful and unhurried"
      "ru": "Сохраняйте уважительный и спокойный темп"
      "uz": "Hurmatli va sokin surʼatni saqlang"
    "description":
      "en": "Kukeldash is a compact stop, but it should not feel casual. Treat it as a historic and functioning religious setting, then let old Tashkent continue at a calm pace."
      "ru": "Кукельдаш занимает немного времени, но это не случайная остановка. Отнеситесь к нему как к историческому и действующему религиозному месту, а затем продолжайте старый город без спешки."
      "uz": "Ko‘kaldosh ko‘p vaqt olmaydi, lekin tasodifiy bekat emas. Uni tarixiy va faol diniy joy sifatida qabul qiling, keyin eski shaharni shoshmasdan davom ettiring."
