      "en": "Chorsu gives Kukeldash its market context, Khast Imam can deepen the religious and manuscript story, and the metro can move the route toward modern Tashkent without losing the city thread."
      "ru": "Чорсу даёт Кукельдашу рыночный контекст, Хазрати Имам углубляет религиозную и рукописную тему, а метро помогает перейти к современному Ташкенту без потери городской нити."
      "uz": "Chorsu Ko‘kaldoshga bozor muhitini beradi, Hazrati Imom diniy va qo‘lyozma mavzusini chuqurlashtiradi, metro esa Toshkent hissini yo‘qotmasdan zamonaviy shahar tomonga olib o‘tadi."
