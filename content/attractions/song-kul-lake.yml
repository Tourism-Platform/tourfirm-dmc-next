    "description":
      "en": "Song-Kul can be beautiful and uncomfortable in the same hour. Come prepared for altitude: road checks, a carefully chosen camp, warm clothing, and a route flexible enough for weather."
      "ru": "Сон-Куль может быть красивым и неудобным в один и тот же час. Подготовьтесь к высоте: проверьте дорогу, внимательно выберите лагерь, возьмите теплые вещи и оставьте маршруту гибкость на случай погоды."
      "uz": "Soʻng-Koʻl bir soatning ichida ham goʻzal, ham noqulay bo‘lishi mumkin. Balandlikka tayyorlaning: yoʻlni tekshiring, lagerni diqqat bilan tanlang, issiq kiyim oling va ob-havo uchun moslashuv qoldiring."


