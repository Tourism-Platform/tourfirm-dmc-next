      "en": "Song-Kul is a place of scale rather than monuments: pasture, road, lake weather, and the camp details that turn a view into a stay."
      "ru": "Сон-Куль раскрывается не через список памятников, а через масштаб: пастбище, дорогу, озерную погоду и детали лагеря, которые превращают вид в пребывание."
      "uz": "Soʻng-Koʻl yodgorliklar ro‘yxati emas, miqyos orqali ochiladi: yaylov, yoʻl, koʻl ob-havosi va manzarani tunashga aylantiradigan lager tafsilotlari."
