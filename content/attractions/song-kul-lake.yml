      "en": "Where the high road opens into pasture"
      "ru": "Где высокая дорога выходит к пастбищу"
      "uz": "Baland yoʻl yaylovga ochiladigan joy"
    "description":
      "en": "Song-Kul turns the central Kyrgyzstan road into a highland stay. The lake gives the route a wide horizon; the pasture, camps, and weather make that horizon human and practical.


        «The lake feels calm because the route has been given room: the right road, the right night, and hosts ready for the season.»"
      "ru": "Сон-Куль превращает дорогу по центральному Кыргызстану в высокогорное пребывание. Озеро дает маршруту широкий горизонт, а пастбище, лагеря и погода делают его живым и практичным.


        «Озеро кажется спокойным потому, что маршруту дали пространство: подходящую дорогу, правильную ночь и хозяев, готовых к сезону.»"
      "uz": "Soʻng-Koʻl markaziy Qirgʻiziston yoʻlini baland hududdagi turishga aylantiradi. Koʻl marshrutga keng ufq beradi, yaylov, lagerlar va ob-havo esa uni insoniy va amaliy qiladi.


        «Koʻl sokin tuyuladi, chunki marshrutga joy berilgan: toʻgʻri yoʻl, toʻgʻri tun va mavsumga tayyor mezbonlar.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
