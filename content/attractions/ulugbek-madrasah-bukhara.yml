  - "blockType": "regular"
    "eyebrow":
      "en": "Why this place"
      "ru": "Почему это место"
      "uz": "Nima uchun bu joy"
    "title":
      "en": "Ulugbek and Bukhara's history of learning"
      "ru": "Улугбек и традиция учёбы в старой Бухаре"
      "uz": "Ulugbek va ilm shahri"
    "description":
      "en": "The madrasah is linked to Mirzo Ulugbek, the Timurid ruler and astronomer whose name is tied to learning across Central Asia. In Bukhara, that story appears at close range: in a compact courtyard, a portal, traces of tilework, and the street life around the trading domes. The site is part of the Historic Centre of Bukhara, which is on the UNESCO World Heritage List.


        «Here Bukhara turns from market movement toward study, shade, and a quieter courtyard.»"
      "ru": "Медресе связано с Мирзо Улугбеком, правителем и астрономом Тимуридской эпохи, чьё имя в Центральной Азии связывают с наукой и образованием. В Бухаре эта история раскрывается вблизи: через компактный двор, портал, следы керамики и жизнь улиц вокруг торговых куполов. Памятник входит в исторический центр Бухары, который находится в списке Всемирного наследия UNESCO.


        «Здесь после базарного движения Бухара становится тише: двор медресе возвращает маршрут к истории учёбы.»"
      "uz": "Madrasa nomi Markaziy Osiyoda ilm bilan bog‘langan temuriy hukmdor va astronom Mirzo Ulugbek bilan bog‘liq. Buxoroda bu hikoya yaqin masofada seziladi: ixcham hovli, portal, koshin izlari va savdo gumbazlari atrofidagi ko‘cha hayoti orqali. Yodgorlik UNESCO ro‘yxatidagi Buxoro tarixiy markazi tarkibiga kiradi.


        «Bu yerda Buxoro bozor harakatidan ilm, soya va sokin hovli tomonga o‘tadi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you will see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni ko‘rasiz"
    "title":
      "en": "Portal, courtyard, and surviving tilework"
      "ru": "Портал, двор и сохранившаяся керамика"
      "uz": "Portal, hovli va saqlangan koshin bezaklari"
    "description":
      "en": "The madrasah is best seen in close details: portal shade, patterned fragments, courtyard geometry, upper-level rhythm, and the human scale of a former learning space."
      "ru": "Медресе лучше всего смотреть в близких деталях: тень портала, фрагменты орнамента, геометрия двора, ритм верхнего яруса и человеческий масштаб бывшего учебного пространства."
      "uz": "Madrasani yaqin detallarda ko‘rish yaxshi: portal soyasi, naqsh parchalari, hovli geometriyasi, yuqori qavat ritmi va sobiq taʼlim makonining insoniy miqyosi."
  - "blockType": "regular"
    "eyebrow":
      "en": "How the visit feels"
      "ru": "Как ощущается визит"
      "uz": "Tashrif qanday seziladi"
    "title":
      "en": "A short stop where details matter"
      "ru": "Короткая остановка, где важны детали"
      "uz": "Detallar muhim bo‘lgan qisqa bekat"
    "description":
      "en": "Ulugbek Madrasah does not need a long stop. Slow down enough to see the portal, courtyard, tilework, and how the learning story fits the old city."
      "ru": "Медресе Улугбека не требует долгой остановки. Замедлитесь настолько, чтобы увидеть портал, двор, керамику и то, как история знания встроена в старый город."
      "uz": "Ulugbek madrasasi uzoq to‘xtashni talab qilmaydi. Portal, hovli, koshinlar va ilm hikoyasi eski shaharga qanday qo‘shilishini ko‘rish uchun biroz sekinlashish kifoya."
  - "blockType": "regular"
