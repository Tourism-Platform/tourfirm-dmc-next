      "uz": "Qo‘shni madrasa, bozor soyasi, minora, eski masjid va suv"
    "description":
      "en": "Abdulaziz Khan Madrasah keeps the learning story close; Trading Domes hold the bazaar route; Poi-Kalyan brings the main ensemble; Magoki-Attori adds an older mosque stop; Lyabi-Hauz returns the walk to water and tea."
      "ru": "Медресе Абдулазизхана продолжает тему знания рядом; торговые купола держат базарный маршрут; Пои-Калян возвращает главный ансамбль; Магоки-Аттори добавляет старую мечеть; Ляби-Хауз возвращает прогулку к воде и чаю."
      "uz": "Abdulazizxon madrasasi ilm hikoyasini yaqin tutadi; Savdo gumbazlari bozor yo‘lini ushlab turadi; Poyi Kalon asosiy ansamblni qaytaradi; Magʻoki Attori eski masjid bekatini qo‘shadi; Labi Hovuz sayrni suv va choyga qaytaradi."
