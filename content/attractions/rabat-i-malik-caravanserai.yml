      "en": "Rabat-i Malik matters because the site begins with a visible threshold. Before names and dates, the surviving portal gives the old road scale: brick height, patterned shadow, and enough empty ground around it to understand why shelter mattered."
      "ru": "Рабат-и Малик важен потому, что место начинается с видимого порога. До имён и дат сохранившийся портал даёт старой дороге масштаб: высоту кирпича, узорную тень и достаточно пустого пространства, чтобы понять, зачем путникам было нужно укрытие."
      "uz": "Rabat-i Malik muhim, chunki joy avval ko‘rinadigan ostonadan boshlanadi. Ism va sanalardan oldin saqlangan peshtoq eski yo‘lga miqyos beradi: g‘isht balandligi, naqshli soya va panoh nega kerak bo‘lganini ko‘rsatadigan ochiq maydon."
