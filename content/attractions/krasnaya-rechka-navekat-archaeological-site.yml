    "title":
      "en": "Navekat beyond the visible landmarks"
      "ru": "Навекат за пределами самых заметных ориентиров"
      "uz": "Koʻrinadigan belgilar ortidagi Navekat"
    "description":
      "en": "Krasnaya Rechka widens the Tokmok route from the familiar Burana anchor toward the old city-site pattern of the Chuy Valley. The stop asks for slower attention: earth forms, open ground, and explanation do more work here than a single standing monument.


        «Krasnaya Rechka is strongest when it turns the Chuy plain from a single landmark into a carefully explained sequence of old city sites.»"
      "ru": "Красная Речка расширяет маршрут через Токмок от знакомой Бураны к старой городской карте Чуйской долины. Здесь нужно более медленное внимание: форма земли, открытая территория и объяснение важнее одного стоящего памятника.


        «Красная Речка сильнее всего тогда, когда Чуйская равнина перестаёт быть одним ориентиром и становится аккуратно объяснённой последовательностью старых городищ.»"
      "uz": "Krasnaya Rechka Toqmoq yoʻnalishini tanish Burana tayanchidan Chuy vodiysining eski shahar yodgorliklari xaritasiga kengaytiradi. Bu yerda sekinroq eʼtibor kerak: yer shakli, ochiq maydon va izoh bitta tik turgan yodgorlikdan muhimroq.


        «Krasnaya Rechka Chuy tekisligini bitta belgi emas, ehtiyotkor izohlangan eski shahar joylari ketma-ketligi sifatida ko‘rsatganda eng kuchli bo‘ladi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "What you'll see"
      "ru": "Что вы увидите"
      "uz": "Nimalarni koʻrasiz"
    "title":
      "en": "City-site traces and a wide Chuy setting"
      "ru": "Следы городища и широкую Чуйскую равнину"
      "uz": "Shahar izlari va keng Chuy muhiti"
    "description":
      "en": "Expect an archaeological landscape, not a reconstructed monument. The visible value comes from ground form, scale, and the way the open plain helps explain why several city sites mattered in this corridor."
      "ru": "Ожидайте археологический ландшафт, а не восстановленный памятник. Видимая ценность здесь в форме земли, масштабе и в том, как открытая равнина объясняет значение нескольких городищ в одном коридоре."
      "uz": "Tiklangan yodgorlik emas, arxeologik landshaftni kuting. Koʻrinadigan qimmat yer shakli, miqyos va ochiq tekislik bir koridordagi bir nechta shahar yodgorliklari nega muhim bo‘lganini tushuntirishida."
  - "blockType": "regular"
