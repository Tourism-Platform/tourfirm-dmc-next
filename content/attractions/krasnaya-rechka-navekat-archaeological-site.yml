    "uz": "Krasnaya Rechka Chuy tekisligiga Burana va Ak-Beshim/Suyabdan keyingi sokinroq arxeologik toʻxtashni beradi. Toʻgʻri kontekst bilan Navekatning past izlari vodiyni bitta alohida yodgorlik emas, shahar yodgorliklari ketma-ketligi sifatida ko‘rsatadi."
