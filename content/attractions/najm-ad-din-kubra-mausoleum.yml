        «У Наджм ад-Дина Кубры Куня-Ургенч становится не столько высотой, сколько памятью: имя, мавзолей и тихое пространство вокруг.»"
      "uz": "Maqbara Ko‘hna Urganch maʼnosini kengaytirgani uchun muhim. Bu yerda faqat balandlik, g‘isht va uzoq siluetlar emas; nom bilan bog‘langan ruhiy xotira va qabriston muhiti ham bor.


        «Najm ad-Din Kubra yonida Ko‘hna Urganch balandlikdan ko‘ra xotira bo‘lib seziladi: ism, maqbara va atrofdagi sokin hudud.»"
