"excerpt":
  "en": "Najm ad-Din Kubra Mausoleum shifts Kunya-Urgench from monument scale to Sufi memory. After the open UNESCO landscape, minaret, and royal mausoleums, this northern stop asks for quieter movement, modest dress, and a careful reading of how old Khorezm is remembered. The stop is not an architectural checklist item. It is a mausoleum and cemetery setting, so current access, walking lines, and photography boundaries should be confirmed locally before arrival."
  "ru": "Мавзолей Наджм ад-Дина Кубры переводит визит по Куня-Ургенчу от масштаба памятников к паломнической памяти. После открытого ландшафта ЮНЕСКО, минарета и царских мавзолеев эта северная остановка требует более тихого движения, скромной одежды и внимания к тому, как старый Хорезм продолжает хранить имена. Это не пункт архитектурного списка. Это мавзолей в кладбищенском окружении, поэтому актуальный доступ, проходы и границы съёмки лучше подтвердить на месте до поездки."
  "uz": "Najm ad-Din Kubra maqbarasi Ko‘hna Urganch tashrifini yodgorliklar ko‘lamidan ziyorat xotirasiga buradi. Ochiq UNESCO manzarasi, minora va hukmdor maqbaralaridan keyin bu shimoliy to‘xtash sokinroq yurish, odobli kiyim va eski Xorazm nomlari qanday eslanishiga eʼtibor so‘raydi. Bu meʼmoriy ro‘yxatdagi yana bir band emas. Bu maqbara va qabriston muhiti, shuning uchun amaldagi kirish, yurish yo‘llari va suratga olish chegaralarini tashrifdan oldin joyida tasdiqlash kerak."
