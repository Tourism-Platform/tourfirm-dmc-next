      "en": "A museum pause before the fortress road"
      "ru": "Музейная пауза перед крепостной дорогой"
      "uz": "Qalʼalar yo‘lidan oldingi muzey pauzasi"
    "description":
      "en": "The museum's value is context rather than scale. It gives the Ellikqala route a slower indoor stop, so Toprak-Kala, Kyzyl-Kala, and Ayaz-Kala feel less like isolated ruins and more like part of a district with memory, research, objects, and local life around them.


        «The museum gives Ellikqala a pause indoors, where the fortress route can be read through objects before returning to the desert road.»"
      "ru": "Ценность музея — в контексте, а не в масштабе. Он даёт маршруту по Элликкале более спокойную остановку в помещении, чтобы Топрак-Кала, Кызыл-Кала и Аяз-Кала воспринимались не как отдельные руины, а как часть района с памятью, исследованиями, предметами и местной жизнью.


        «Музей даёт Элликкале паузу в помещении, где крепостной маршрут можно прочитать через предметы перед возвращением на пустынную дорогу.»"
      "uz": "Muzeyning qiymati ulkanlikda emas, kontekstda. U Ellikqal’a yo‘liga xonalar ichidagi sokin to‘xtam beradi; shunda Tuproq-qalʼa, Qizil-qalʼa va Ayoz-qalʼa yakka xaroba emas, xotira, tadqiqot, buyumlar va mahalliy hayot bor tuman qismi sifatida ko‘rinadi.


        «Muzey Ellikqal’aga bino ichidagi pauza beradi: qalʼalar yo‘lini buyumlar orqali o‘qib, keyin yana cho‘l yo‘liga qaytasiz.»"
  - "blockType": "regular"
