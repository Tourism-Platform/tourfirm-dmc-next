    "description":
      "en": "Konigil is not a remote excursion. Its strength is closeness: Samarkand’s monumental core can give way to craft, water, and a smaller village scale before the road returns to the city.


        «Konigil holds together because it is close: one craft focus, one water-side pause, and Samarkand still carrying the route.»"
      "ru": "Конигил — не дальняя экспедиция. Его сила в близости: монументальное ядро Самарканда может смениться ремеслом, водой и меньшим сельским масштабом, а затем дорога вернётся в город.


        «Конигил силён своей близостью: один ремесленный фокус, одна пауза у воды, и Самарканд всё ещё держит маршрут.»"
      "uz": "Konigil uzoq ekspeditsiya emas. Uning kuchi yaqinlikda: Samarqandning monumental markazi hunar, suv va kichikroq qishloq miqyosiga almashadi, keyin yo‘l shaharga qaytadi.


        «Konigil yaqinligi bilan kuchli: bitta hunarmandchilik fokusi, bitta suv bo‘yidagi pauza va Samarqand marshrutni birlashtirib turadi.»"
