  "metaDescription":
    "en": "Ertoshsoy sits high on the Ohangaron side, where the road begins to matter as much as the stop itself. In the green season, clean air, water, and a simple local table can make the village feel close and human; the visit is strongest when weather, vehicle fit, meeting point, and return time are agreed before departure."
    "ru": "Эртошсой находится выше по ахангаранской стороне, и здесь дорога так же важна, как сама остановка. В зелёный сезон воздух, вода и простой местный стол могут дать селу живое ощущение; маршрут получается лучше, когда погода, транспорт, встреча и возвращение согласованы до выезда."
    "uz": "Ertoshsoy Ohangaron tomonida balandroq joylashgan, bu yerda yo‘lning o‘zi ham bekat kabi muhim. Yashil mavsumda havo, suv va oddiy mahalliy dasturxon qishloqqa jonli maʼno beradi; ob-havo, transport, uchrashuv joyi va qaytish vaqti oldindan kelishilsa, tashrif aniqroq bo‘ladi."
