  "en": "After Termez, the road to Boysun changes the southern route: open archaeological ground gives way to ridges, village roofs, songs, embroidery, tandoor bread, and a cultural space recognized by UNESCO as intangible heritage. Boysun belongs in the route as a careful mountain-and-culture continuation: local hosts, courtyard pauses, festival season, and the road toward Baysuntau need current checks and time."
  "ru": "После Термеза дорога к Байсуну меняет южный маршрут: вместо открытой археологической земли появляются хребты, крыши селений, песни, вышивка, тандыры и культурное пространство, которое UNESCO признаёт нематериальным наследием. Байсун сильнее как аккуратное горно-культурное продолжение: местные хозяева, паузы во дворах, фестивальный сезон и дороги к Байсунтау требуют времени и актуальной проверки."
  "uz": "Termizdan keyin Boysunga boradigan yo‘l janubiy yo‘nalishni o‘zgartiradi: ochiq arxeologik yer o‘rniga tizmalar, qishloq tomlari, qo‘shiqlar, kashta, tandirlar va UNESCO nomoddiy meros sifatida tan olgan madaniy makon paydo bo‘ladi. Boysun tog‘ va madaniyat davomi sifatida kuchliroq: mahalliy mezbonlar, hovlidagi pauzalar, festival mavsumi va Boysuntovga yo‘l vaqt hamda dolzarb tekshiruv talab qiladi."
