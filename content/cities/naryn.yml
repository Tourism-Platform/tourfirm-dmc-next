              "ru": "Сон-Куль, Эки-Нарын, Ат-Баши, Таш-Рабат и Кель-Суу могут быть важны, но каждому нужны своё время, машина и проверка погоды."
              "uz": "Soʻng-Koʻl, Eki-Naryn, At-Bashi, Tash-Rabat va Kel-Suu muhim boʻlishi mumkin, lekin har biri alohida vaqt, avtomobil va ob-havo tekshiruvini soʻraydi."
          - "type": "dashTitle"
            "title":
