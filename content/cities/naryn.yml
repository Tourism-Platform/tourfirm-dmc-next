              "ru": "В холодный сезон короткая городская остановка и осторожный выбор дорог обычно лучше амбициозного плана по высоким долинам."
              "uz": "Sovuq mavsumda qisqaroq shahar toʻxtashi va ehtiyotkor yoʻl tanlovi baland vodiylarga haddan tashqari katta rejadan foydaliroq."
          - "type": "alert"
            "title":
              "en": "Traveler takeaway"
              "ru": "Что важно для путешественника"
              "uz": "Sayohatchi uchun xulosa"
            "description":
