        "icon": "CircleQuestionMark"
        "title":
          "en": "How long should groups stay in Naryn?"
          "ru": "Сколько времени группам стоит проводить в Нарын?"
          "uz": "Narynda guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "2–3 nights is usually enough when the old core or main anchors get a full walking window. City tone: “A river city before the high country”."
          "ru": "Обычно хватает 2–3 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Город у реки перед высокогорьем»."
          "uz": "Odatda 2–3 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Baland togʻlar oldidagi daryo shahri»."
      - "type": "destinationInsight"
        "icon": "Landmark"
        "title":
          "en": "Should Naryn be a walkable core or a base for day trips?"
          "ru": "Нарын — это пешеходное ядро или база для выездов?"
          "uz": "Naryn piyoda yadroimi yoki chiqishlar uchun baza?"
        "description":
          "en": "Start with the compact city walk first. Day trips only after the centre has settled — otherwise the stop feels like a transfer with monuments attached."
          "ru": "Сначала компактная городская прогулка. Выезды — только после того, как центр «сел»; иначе остановка ощущается как трансфер с памятниками."
          "uz": "Avval ixcham shahar sayri. Chiqishlar — markaz joylashgandan keyin; aks holda bekat yodgorlikli transferdek tuyuladi."
      - "type": "destinationInsight"
        "icon": "Hotel"
        "title":
