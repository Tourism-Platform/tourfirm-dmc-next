    "description":
      "en": "Kochkor is often the craft and approach stop, Song-Kul is the high-lake direction, and Tash Rabat gives the southbound road its caravanserai purpose. Each needs its own timing instead of being treated as a minor detour from Naryn."
      "ru": "Кочкор часто становится ремесленной и подъездной остановкой, Сон-Куль ведёт к высокому озеру, а Таш-Рабат даёт южной дороге караван-сарайный смысл. Каждому месту нужно своё время, а не роль короткого довеска к Нарыну."
      "uz": "Kochkor koʻpincha hunarmandchilik va kirish toʻxtashi boʻladi, Soʻng-Koʻl baland koʻl yoʻnalishini beradi, Tash-Rabat esa janubiy yoʻlga karvonsaroy maʼnosini qoʻshadi. Har biriga Naryndan kichik burilish emas, oʻz vaqti kerak."
