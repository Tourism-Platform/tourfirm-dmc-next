              "ru": "Дайте Нарыну одну роль за раз: город прибытия, полезную ночёвку, проверку погоды или выбор перед дорогой к Сон-Кулю, Таш-Рабату, Ат-Баши или Кель-Суу."
              "uz": "Narynga bir vaqtning oʻzida bitta rol bering: kelish shahri, foydali tunash, ob-havo tekshiruvi yoki Soʻng-Koʻl, Tash-Rabat, At-Bashi yoxud Kel-Suu oldidagi tanlov."
        "right":
