"excerpt":
  "en": "Jayrakhona sits near Tupchoq in Kitob District, where the road after Shakhrisabz and Kitob leaves heritage-city scale for smaller village routes. It is a developing tourism village, best treated as a light rural pause rather than a fixed activity stop: a few lanes, field edges, lower foothill air, and a quieter return to the Kashkadarya road."
  "ru": "Жайрахона находится рядом с Тупчоком в Китабском районе, там, где дорога после Шахрисабза и Китаба уходит от масштаба города наследия к малым сельским маршрутам. Это развивающееся туристическое село, которое лучше воспринимать как лёгкую сельскую паузу, а не как готовую программу активностей: несколько улиц, края полей, предгорный воздух и спокойное возвращение к кашкадарьинской дороге."
  "uz": "Jayraxona Kitob tumanida, Tupchoq yaqinida joylashgan; Shahrisabz va Kitobdan keyin yo‘l meros shahri miqyosidan kichik qishloq yo‘llariga o‘tadi. Bu rivojlanayotgan turizm qishlog‘i, shuning uchun uni tayyor faoliyat dasturi emas, yengil qishloq pauzasi sifatida ko‘rish kerak: bir necha ko‘cha, dala chetlari, tog‘oldi havosi va Qashqadaryo yo‘liga sokin qaytish."
