          "en": "1–2 nights is usually enough when the old core or main anchors get a full walking window. City tone: “Pichoq knives and doʻppi craft on the Namangan side of the Fergana Valley”."
          "ru": "Обычно хватает 1–2 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Ножи-пичак и доппи со стороны Намангана»."
