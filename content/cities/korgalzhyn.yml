          "en": "Astana brings Kazakhstan’s modern capital into the route: Baiterek on the Left Bank, Nur Alem, the National Museum, Ishim River wind, and northern continuations toward Burabay or Korgalzhyn."
          "ru": "Астана показывает современную столицу Казахстана: Байтерек на Левом берегу, Nur Alem, Национальный музей, ветер у Ишима и северные продолжения к Бурабаю или Коргалжыну."
          "uz": "Ostona Qozogʻistonning zamonaviy poytaxtini marshrutga olib kiradi: chap qirgʻoqdagi Bayterek, Nur Alem, Milliy muzey, Ishim shamoli va Burabay yoki Qoʻrgʻaljin tomonga shimoliy davomlar."
