"seo":
  "metaTitle":
    "en": "Korgalzhyn | TourLink"
    "ru": "Коргалжын | TourLink"
    "uz": "Qorgʻaljyn | TourLink"
  "metaDescription":
    "en": "Korgalzhyn gives the Astana journey its first wide nature turn: dry grassland, freshwater and saline lakes, reed edges, and migratory birds moving through a protected landscape. The visit asks for patience - binoculars instead of close approach, checked access instead of assumptions, and enough time for the horizon to slow the road down."
    "ru": "Коргалжын дает маршруту по Астанинскому региону первый широкий природный поворот: сухая степь, пресные и соленые озера, камышовые кромки и перелетные птицы в охраняемом ландшафте. Здесь нужна терпение: бинокль вместо близкого подхода, проверенный доступ вместо предположений и время, чтобы горизонт замедлил дорогу."
    "uz": "Qorgʻaljyn Ostona mintaqasi safariga birinchi keng tabiiy burilish beradi: quruq dasht, chuchuk va shoʻr koʻllar, qamish chetlari va qoʻriqlanadigan landshaftdan oʻtuvchi koʻchmanchi qushlar. Bu tashrif sabr soʻraydi - yaqin borish oʻrniga durbin, taxmin oʻrniga tekshirilgan kirish va ufq yoʻlni sekinlashtirishi uchun vaqt."
