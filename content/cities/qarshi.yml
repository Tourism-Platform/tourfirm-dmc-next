        "description":
          "en": "Odina Mosque and Madrasah is Qarshi's quieter old-city stop: a mosque-madrasah setting associated with Amir Temur, women's learning and prayer, and today's Memorial Museum of Repression Victims."
          "ru": "Мечеть и медресе Одина — более тихая остановка старого Карши: пространство мечети и медресе, связанное с Амиром Темуром, женским обучением и молитвой, а сегодня ещё и с Музеем памяти жертв репрессий."
          "uz": "Odina masjidi va madrasasi Qarshining sokinroq eski shahar bekati: Amir Temur, ayollar ta’limi va ibodati bilan bog‘langan masjid va madrasa muhiti, bugun esa Qatag‘on qurbonlari xotirasi muzeyi."
