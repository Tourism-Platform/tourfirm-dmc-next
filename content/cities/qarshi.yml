          "ru": "Медресе Киличбой показывает старый ряд медресе Карши в более тихом масштабе. Его кирпичные стены 1914 года, бывшие учебные комнаты, двор и водоотвод стоит рассматривать между более крупными остановками города — мечетью, Сардобой и мостом."
