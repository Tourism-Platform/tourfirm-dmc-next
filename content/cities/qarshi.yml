          "ru": "Мост Карши сразу делает город понятным: десять кирпичных арок над Кашкадарьёй, переправа XVI века, связанная с Абдуллаханом II, и память старой торговой дороги, которая до сих пор задаёт Карши ощущение движения."
          "uz": "Qarshi ko‘prigi shaharni darhol tushunarli qiladi: Qashqadaryo ustidagi o‘n g‘isht arka, Abdullaxon II bilan bog‘liq XVI asr kechuvi va Qarshining harakat hissini hanuz belgilab turadigan eski savdo yo‘li xotirasi."
