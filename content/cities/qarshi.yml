      "en": "Places that give Qarshi its city shape"
      "ru": "Места, которые дают Карши городской облик"
      "uz": "Qarshiga shahar shaklini beradigan joylar"
    "description":
      "en": "Qarshi's city shape starts with the old bridge, Odina Mosque and Madrasah, Kok-Gumbaz in Qarshi, the Sardoba, Abu Ubayda, and market life. Together they show the city as more than a transfer between Shakhrisabz and the wider south."
      "ru": "Облик Карши начинается со старого моста, мечети и медресе Одина, Кок-Гумбаза в Карши, Сардобы, комплекса Абу Убайды и рынка. Вместе они показывают город не просто как переезд между Шахрисабзом и югом."
      "uz": "Qarshi qiyofasi eski ko‘prik, Odina masjidi va madrasasi, Qarshidagi Ko‘k-Gumbaz, Sardoba, Abu Ubayda majmuasi va bozor hayotidan boshlanadi. Birgalikda ular shaharni Shahrisabz bilan kengroq janub orasidagi oddiy o‘tish emasligini ko‘rsatadi."
