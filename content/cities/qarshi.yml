      "ru": "Карши лучше работает, когда его не заставляют соперничать с Шахрисабзом. Пусть он делает другую работу: переводит маршрут в региональный город с видом на мост, дворами мечетей, едой, водным наследием и вечерними улицами."
      "uz": "Qarshi Shahrisabz bilan bellashtirilmaganda yaxshiroq ishlaydi. Uning vazifasi boshqa: yo‘nalishni ko‘prik manzarasi, masjid hovlilari, taom bekatlari, suv merosi va kechki ko‘chalari bor mintaqa shahriga olib kirish."
