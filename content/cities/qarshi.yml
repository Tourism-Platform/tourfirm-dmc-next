          "uz": "Xoja Abdulazizxon madrasasi Qarshining markaziy madrasalari, masjidlari va suv meʼmorchiligi yaqinida turadi. Bu bekatning qadri faqat ko‘lami bilan emas: 1909 yilgi o‘quv binosini Qilichboy, Odina, Sardoba va Ko‘k-Gumbaz yonida ko‘rib, keyinchalik Qashqadaryo muzeyi tarixi shu b"
