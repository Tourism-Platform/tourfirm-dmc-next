        "description":
          "en": "Kok-Gumbaz is Qarshi's own blue-domed mosque, associated with the old Namazgoh setting and the late 16th-century city. It belongs after the bridge or Odina, when the visit moves from river arches and museum shade toward a mosque that still needs a respectful pace."
          "ru": "Кок-Гумбаз — собственная синекупольная мечеть Карши, связанная с пространством старого намазгоха и городом конца XVI века. Она хорошо ложится после моста или Одины, когда визит переходит от речных арок и музейной тени к мечети, где нужен уважительный темп."
          "uz": "Ko‘k-Gumbaz Qarshining o‘z ko‘k gumbazli masjidi bo‘lib, eski namozgoh muhiti va XVI asr oxiridagi shahar bilan bog‘lanadi. U ko‘prik yoki Odinadan keyin yaxshi joylashadi: tashrif daryo arkalari va muzey soyasidan hurmatli sur’at talab qiladigan masjidga o‘tadi."
        "ctaHref": "/destinations/uzbekistan/kashkadarya-and-shakhrisabz/qarshi/kok-gumbaz-mosque-karshi"
