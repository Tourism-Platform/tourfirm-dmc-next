      "uz": "Oʻtrorni shahar sayri emas, arxeologik hudud sifatida rejalang"
    "description":
      "en": "Otrar needs a slower plan than a city walk in Turkistan or Shymkent. Museum halls, exposed ground, and shrine space each ask for different timing, with heat, conservation rules, road time, and local access checks shaping the visit."
      "ru": "Отрар требует более медленного плана, чем городская прогулка в Туркестане или Шымкенте. Музейные залы, открытое городище и святыня требуют разного времени, а визит формируют жара, правила сохранения, дорога и актуальные проверки доступа."
      "uz": "Oʻtror Turkiston yoki Chimkentdagi shahar sayridan ko‘ra sekinroq reja talab qiladi. Muzey zallari, ochiq qadimgi shahar va ziyoratgoh har biri alohida vaqt soʻraydi; tashrifni issiq, saqlash qoidalari, yoʻl va mahalliy kirish tekshiruvlari belgilaydi."
    "rows":
      - "ratio": "2:1"
        "left":
          - "type": "dashTitle"
            "title":
              "en": "Begin with museum context"
              "ru": "Начните с музейного контекста"
              "uz": "Muzey mazmunidan boshlang"
            "description":
              "en": "The museum holds ceramics, tools, coins, water-system fragments, bathhouse material, and the wider Otyrar oasis story. That context helps the open site feel inhabited rather than empty."
              "ru": "В музее есть керамика, инструменты, монеты, фрагменты водных систем, материалы бань и история Отырарского оазиса. После этого открытый участок меньше похож на пустую землю."
              "uz": "Muzeyda sopol, asboblar, tangalar, suv tizimi parchalari, hammom materiallari va Oʻtror vohasi hikoyasi bor. Bu mazmun ochiq maydonni bo‘sh yer emas, yashagan shahar sifatida ko‘rsatadi."
          - "type": "quote"
            "quote":
              "en": "Otrar starts to speak when the museum gives the objects names and the open ground is treated as a city, not as an empty ruin."
              "ru": "Отрар оживает, когда музей даёт предметам имена, а открытая земля воспринимается как город, а не пустые руины."
              "uz": "Muzey buyumlarga nom berganda va ochiq tuproq bo‘sh xaroba emas, shahar sifatida ko‘rilganda Oʻtror jonlanadi."
          - "type": "dashTitle"
            "title":
              "en": "Protect the open site"
              "ru": "Берегите открытый участок"
              "uz": "Ochiq maydonni ehtiyot qiling"
            "description":
              "en": "Otrartobe is not a finished monument. Walk only where access and conservation rules allow, avoid fragile edges, and let the guide explain what low walls and ground lines mean."
              "ru": "Отрартобе не выглядит как законченный памятник. Идите только там, где позволяют доступ и правила сохранения, не выходите на хрупкие края и дайте гиду объяснить линии стен и земли."
              "uz": "Otrartobe tayyor yodgorlikka o‘xshamaydi. Faqat kirish va saqlash qoidalari ruxsat bergan joydan yuring, mo‘rt chetlarga chiqmang va gid past devorlar hamda tuproq chiziqlari nimani anglatishini tushuntirsin."
          - "type": "dashTitle"
            "title":
              "en": "Keep shrine etiquette separate."
              "ru": "Оставьте святыне отдельный этикет."
              "uz": "Ziyoratgoh odobini alohida saqlang."
            "description":
              "en": "Arystan Bab belongs close to Otrar, but it asks for a living-shrine approach: modest clothing, quiet movement, photo caution, and current local advice before arrival."
              "ru": "Арыстан-Баб близок к Отрару, но требует подхода живой святыни: скромной одежды, тихого движения, осторожности с фото и актуального местного совета до приезда."
              "uz": "Arystan Bab Oʻtrorga yaqin, lekin tirik ziyoratgoh yondashuvini soʻraydi: kamtar kiyim, sokin harakat, suratga ehtiyotkorlik va kelishdan oldingi mahalliy maslahat."
          - "type": "alert"
            "title":
              "en": "Traveler takeaway"
              "ru": "Вывод для путешественника"
              "uz": "Sayohatchi uchun xulosa"
            "description":
              "en": "Begin with museum context, walk Otrartobe gently, and add Arystan Bab only when the route can keep a respectful pace."
              "ru": "Начните с музейного контекста, пройдите Отрартобе бережно и добавляйте Арыстан-Баб только тогда, когда маршрут сохраняет уважительный темп."
              "uz": "Muzey mazmunidan boshlang, Otrartobeni ehtiyotkor ko‘ring va Arystan Babni yoʻl hurmatli surʼatni saqlay olgandagina qoʻshing."
        "right":
          - "type": "miniTable"
            "title":
              "en": "Before you go"
              "ru": "Перед поездкой"
              "uz": "Safardan oldin"
            "icon": "Circle"
            "rows":
              - "icon": "MapPin"
                "title":
                  "en": "At a glance Place"
                  "ru": "Коротко Место"
                  "uz": "Qisqacha Joy"
                "description":
                  "en": "Otrar sits in Turkistan Region around the museum, Otrartobe, and nearby Arystan Bab."
                  "ru": "Отрар находится в Туркестанской области вокруг музея, Отрартобе и близкого Арыстан-Баба."
                  "uz": "Oʻtror Turkiston viloyatida, muzey, Otrartobe va yaqin Arystan Bab atrofida joylashgan."
              - "icon": "Landmark"
                "title":
                  "en": "Main anchors"
                  "ru": "Главные ориентиры"
                  "uz": "Asosiy moʻljallar"
                "description":
                  "en": "These three stops carry the first public visit."
                  "ru": "Эти три остановки держат первый публичный визит."
                  "uz": "Birinchi ommaviy tashrifni shu uch toʻxtash ushlab turadi."
              - "icon": "Sun"
                "title":
                  "en": "Time"
                  "ru": "Время"
                  "uz": "Vaqt"
                "description":
                  "en": "Exact road time, museum hours, tickets, and access should be checked close to travel."
                  "ru": "Дорогу, часы музея, билеты и доступ нужно проверять ближе к поездке."
                  "uz": "Yoʻl, muzey soati, chipta va kirish safarga yaqin tekshiriladi."
              - "icon": "Route"
                "title":
                  "en": "Season and heat"
                  "ru": "Сезон и жара"
                  "uz": "Mavsum va issiq"
                "description":
                  "en": "Summer sun, wind, uneven ground, shade, water, and footwear matter more than they would in a city center."
                  "ru": "Летнее солнце, ветер, неровная земля, тень, вода и обувь важнее, чем в городском центре."
                  "uz": "Yozgi quyosh, shamol, notekis yer, soya, suv va poyabzal shahar markazidagidan ko‘ra muhimroq."
              - "icon": "MapPin"
                "title":
                  "en": "Before travel"
                  "ru": "Перед поездкой"
                  "uz": "Safardan oldin"
                "description":
                  "en": "Check museum hours, ticketing, guide language, site access, conservation paths, shrine etiquette, photo rules, and road timing."
                  "ru": "Часы музея, билеты, язык гида, доступ на участок, правила сохранения, этикет святыни, фото и дорогу."
                  "uz": "Muzey soati, chipta, gid tili, maydon kirishi, saqlash yoʻllari, ziyorat odobi, surat qoidalari va yoʻl vaqti."
  - "blockType": "regular"
    "eyebrow":
      "en": "Nearby"
      "ru": "Рядом"
      "uz": "Yaqin joylar"
    "title":
      "en": "Turkistan and Shymkent frame the Otrar road"
      "ru": "Туркестан и Шымкент задают рамку дороги к Отрару"
      "uz": "Turkiston va Chimkent Oʻtror yoʻliga ramka beradi"
    "description":
      "en": "Turkistan is the closest heritage city for the Otrar road, while Shymkent gives the wider southern approach and more services. Sayram and Sauran can fit broader plans, but they should not crowd the first Otrar visit."
      "ru": "Туркестан — ближайший город наследия для дороги к Отрару, а Шымкент даёт более широкий южный подход и больше сервисов. Сайрам и Сауран могут войти в расширенный план, но не должны перегружать первый визит в Отрар."
      "uz": "Turkiston Oʻtror yoʻli uchun eng yaqin meros shahri, Chimkent esa kengroq janubiy yondashuv va ko‘proq xizmatlarni beradi. Sayram va Sauran kengroq rejaga kirishi mumkin, lekin birinchi Oʻtror tashrifini haddan tashqari to‘ldirmasligi kerak."
