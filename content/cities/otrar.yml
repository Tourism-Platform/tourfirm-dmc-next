  "metaDescription":
    "en": "Otrar asks for slower looking. In Shaulder, the museum gives names to ceramics, coins, water-system fragments, bathhouse material, and the wider oasis. Outside, Otrartobe is low walls, gate lines, sun, and open earth; nearby Arystan Bab changes the road into a living shrine visit."
    "ru": "Отрар требует медленного взгляда. В Шаульдере музей даёт имена керамике, монетам, фрагментам водных систем, материалам бань и всему оазису. Снаружи Отрартобе — это низкие стены, линии ворот, солнце и открытая земля; рядом Арыстан-Баб переводит дорогу к живой святыне."
    "uz": "Oʻtror sekinroq qarashni soʻraydi. Shauildirdagi muzey sopol, tangalar, suv tizimi parchalari, hammom materiallari va keng vohaga nom beradi. Tashqarida Otrartobe past devorlar, darvoza chiziqlari, quyosh va ochiq tuproq bo‘lib ko‘rinadi; yaqin Arystan Bab esa yoʻlni tirik ziyoratgoh tashrifiga buradi."
