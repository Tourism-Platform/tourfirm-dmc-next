  "en": "On the Zaamin side of the Jizzakh mountain route, Duoba brings the journey down to mahalla scale. Tea, a family meal, a craft demonstration, or cooking with a receiving household gives the stop its human center; cable-car, Sufa, riding, quad, and snow ideas come only after season, road, and access checks."
