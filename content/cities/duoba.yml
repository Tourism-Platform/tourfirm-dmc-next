      "ru": "Дуоба сильнее всего на человеческом масштабе: визит в махаллю с семейным приёмом, ремеслом или готовкой и горным воздухом вокруг."
      "uz": "Duoba insoniy miqyosda kuchliroq: oilaviy mehmondo‘stlik, hunar yoki taom va atrofida tog‘ havosi bor mahalla tashrifi."
    "rows":
      - "ratio": "2:1"
        "left":
          - "type": "dashTitle"
            "title":
              "en": "Start with the mahalla"
              "ru": "Начните с махалли"
              "uz": "Mahalladan boshlang"
            "description":
              "en": "Begin with the family or local participant who can receive guests that day."
              "ru": "Начните с семьи или местного участника, который может принять гостей в этот день."
              "uz": "O‘sha kuni mehmon kutishi mumkin bo‘lgan oila yoki mahalliy ishtirokchidan boshlang."
          - "type": "quote"
            "quote":
              "en": "In Duoba, the mountain route feels strongest when it begins at a village table."
              "ru": "В Дуобе горный маршрут сильнее всего начинается за сельским столом."
              "uz": "Duobada tog‘ marshruti qishloq dasturxonidan boshlanganda kuchliroq seziladi."
          - "type": "dashTitle"
            "title":
              "en": "Keep recreation flexible"
              "ru": "Оставьте отдых гибким"
              "uz": "Dam olishni moslashuvchan qoldiring"
            "description":
              "en": "Treat cable-car, Sufa, riding, quad, and snow ideas as separate checks, not as the reason to choose Duoba."
              "ru": "Канатная дорога, Суфа, лошади, квадроциклы и снег — отдельные проверки, а не причина выбирать Дуобу сами по себе."
              "uz": "Kanat yo‘li, Sufa, ot, kvadrosikl va qor Duobani tanlash sababi emas, alohida tekshiruvlardir."
          - "type": "dashTitle"
            "title":
              "en": "Give the road enough time"
              "ru": "Дайте дороге время"
              "uz": "Yo‘lga vaqt bering"
            "description":
              "en": "Let the road support the village visit instead of reducing Duoba to a quick name beside Zaamin."
              "ru": "Пусть дорога поддержит сельский визит, а не сведёт Дуобу к быстрому названию рядом с Заамином."
              "uz": "Yo‘l Duobani Zomin yonidagi tez nomga aylantirmasdan, qishloq tashrifini qo‘llasin."
          - "type": "alert"
            "title":
              "en": "For travelers"
              "ru": "Для путешественников"
              "uz": "Sayohatchilar uchun"
            "description":
              "en": "Choose Duoba for a modest Zaamin-side village stop: hospitality first, mountain air around it, and recreation only when the conditions are right."
              "ru": "Выбирайте Дуобу для спокойной сельской остановки у Заамина: сначала гостеприимство, вокруг него горный воздух, а отдых только при подходящих условиях."
              "uz": "Duobani Zomin tomonidagi vazmin qishloq bekati uchun tanlang: avval mehmondo‘stlik, atrofida tog‘ havosi, dam olish esa sharoit mos bo‘lganda."
        "right":
          - "type": "miniTable"
            "title":
              "en": "Before you go"
              "ru": "Перед поездкой"
              "uz": "Borishdan oldin"
            "icon": "Circle"
            "rows":
              - "icon": "MapPin"
                "title":
                  "en": "At a glance Status"
                  "ru": "Коротко Статус"
                  "uz": "Qisqacha Maqom"
                "description":
                  "en": "Official tourism mahalla in Zaamin District, Jizzakh Region."
                  "ru": "Официальная туристическая махалля Зааминского района Джизакской области."
                  "uz": "Jizzax viloyati Zomin tumanidagi rasmiy turizm mahallasi."
              - "icon": "Landmark"
                "title":
                  "en": "Main pull"
                  "ru": "Главный смысл"
                  "uz": "Asosiy mazmun"
                "description":
                  "en": "Family hospitality, craft or cooking moments, and Zaamin-side mountain air."
                  "ru": "Семейное гостеприимство, ремесло или готовка и горный воздух со стороны Заамина."
                  "uz": "Oilaviy mehmondo‘stlik, hunar yoki taom tayyorlash va Zomin tomoni tog‘ havosi."
              - "icon": "Sun"
                "title":
                  "en": "Route role"
                  "ru": "Роль в маршруте"
                  "uz": "Marshrutdagi rol"
                "description":
                  "en": "A village stop before or after Zaamin-side nature or recreation when the route has enough time."
                  "ru": "Сельская остановка до или после зааминской природы и отдыха, если в маршруте достаточно времени."
                  "uz": "Marshrutda yetarli vaqt bo‘lsa, Zomin tomoni tabiati yoki dam olishidan oldin yoki keyin qishloq bekati."
              - "icon": "Route"
                "title":
                  "en": "Confirm before travel"
                  "ru": "Перед поездкой"
                  "uz": "Safar oldidan"
                "description":
                  "en": "Meals, homes, road condition, weather, comfort basics, and activity access are checked close to travel."
                  "ru": "Питание, дома, состояние дороги, погода, бытовые детали и доступ к активностям подтверждаются ближе к поездке."
                  "uz": "Ovqat, xonadon, yo‘l holati, ob-havo, qulaylik detallari va faoliyatga kirish safarga yaqin tasdiqlanadi."


  - "blockType": "regular"
    "eyebrow":
      "en": "City in detail"
      "ru": "Город в деталях"
      "uz": "Shahar batafsil"
    "title":
      "en": "How to place Duoba in the day plan"
      "ru": "Как поставить Дуоба в план дня"
      "uz": "Duobani kun rejasiga qanday joylashtirish"
    "description":
      "en": "Walking time, overnight location, and when day trips make sense."
      "ru": "Пешее время, место ночёвки и когда выезды имеют смысл."
      "uz": "Piyoda vaqt, tunash joyi va chiqishlar qachon o‘rinli."
    "gridClassName": "grid-cols-1"
    "cards":
      - "type": "destinationInsight"
        "icon": "CircleQuestionMark"
        "title":
          "en": "How long should groups stay in Duoba?"
          "ru": "Сколько времени группам стоит проводить в Дуоба?"
          "uz": "Duobada guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "one focused city day plus overnight is usually enough when the old core or main anchors get a full walking window. City tone: “Village hospitality and mountain air on the Zaamin side”."
          "ru": "Обычно хватает один насыщенный городской день плюс ночёвка, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Сельское гостеприимство и горный воздух со стороны Заамина»."
          "uz": "Odatda bitta zich shahar kuni va tunash yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Zomin tomonidagi mehmondo‘stlik va tog‘ havosi»."
      - "type": "destinationInsight"
        "icon": "MapPin"
        "title":
          "en": "Should Duoba be a walkable core or a base for day trips?"
          "ru": "Дуоба — это пешеходное ядро или база для выездов?"
          "uz": "Duoba piyoda yadroimi yoki chiqishlar uchun baza?"
        "description":
          "en": "Start with the compact city walk first. Day trips only after the centre has settled — otherwise the stop feels like a transfer with monuments attached."
          "ru": "Сначала компактная городская прогулка. Выезды — только после того, как центр «сел»; иначе остановка ощущается как трансфер с памятниками."
          "uz": "Avval ixcham shahar sayri. Chiqishlar — markaz joylashgandan keyin; aks holda bekat yodgorlikli transferdek tuyuladi."
      - "type": "destinationInsight"
        "icon": "Moon"
        "title":
          "en": "Where should overnight be relative to Duoba's centre?"
          "ru": "Где лучше ночевать относительно центра Дуоба?"
          "uz": "Duoba markaziga nisbatan qayerda tunash yaxshi?"
        "description":
          "en": "Stay close enough for an evening return on foot or a short transfer. That keeps tea, dinner, and a second pass through the lanes easy without burning the next morning."
          "ru": "Живите достаточно близко, чтобы вечером вернуться пешком или коротким трансфером. Так чай, ужин и второй проход по улицам остаются лёгкими и не сжигают следующее утро."
          "uz": "Kechqurun piyoda yoki qisqa transfer bilan qaytishga yaqin turing. Choy, kechki ovqat va ko‘chalardan ikkinchi o‘tish oson qoladi, erta tongni yoqib yubormaydi."
