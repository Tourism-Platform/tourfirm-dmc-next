              "en": "The change begins before the ruins. The marble city gives way to a quieter road and a lower horizon, so the traveler arrives ready for a different kind of attention."
              "ru": "Перемена начинается до руин. Белая столица уступает место более тихой дороге и низкому горизонту, поэтому путешественник приезжает с другим вниманием."
              "uz": "Oʻzgarish xarobalardan oldin boshlanadi. Oq poytaxt sokinroq yoʻl va past gorizontga joy beradi, shuning uchun sayohatchi boshqacha eʼtibor bilan keladi."
          - "type": "quote"
            "quote":
              "en": "The road from Ashgabat is short, but Nisa changes the journey's age: less facade, more ground, and a much older map under the open sky."
              "ru": "Дорога из Ашхабада короткая, но Ниса меняет возраст поездки: меньше фасадов, больше земли и гораздо более древняя карта под открытым небом."
              "uz": "Ashgabatdan yoʻl qisqa, lekin Nisa sayohat yoshini oʻzgartiradi: fasadlar kamroq, zamin koʻproq va ochiq osmon ostida ancha qadimiy xarita."
          - "type": "dashTitle"
            "title":
              "en": "Old and New Nisa"
              "ru": "Старая и Новая Ниса"
              "uz": "Eski va Yangi Nisa"
            "description":
              "en": "UNESCO treats the two tells as one property. Old Nisa gives the clearest fortress form; New Nisa keeps the broader ancient city in the visit, even when it is not the main public stop."
              "ru": "ЮНЕСКО рассматривает два холма как один объект. Старая Ниса даёт самую ясную форму крепости; Новая Ниса удерживает в визите более широкий древний город, даже когда она не является главной публичной остановкой."
              "uz": "YUNESKO ikki tepalikni bitta obyekt sifatida ko‘radi. Eski Nisa qalʼa shaklini eng aniq beradi; Yangi Nisa esa tashrifda kengroq qadimiy shaharni ushlab turadi, hatto asosiy ommaviy toʻxtash bo‘lmasa ham."
          - "type": "dashTitle"
            "title":
              "en": "Why the guide matters"
              "ru": "Почему важен гид"
              "uz": "Gid nima uchun muhim"
            "description":
              "en": "The walls are spare. A strong guide brings in Parthian power, trade roads, Mediterranean influence, and the objects now held in museum stories without turning the walk into a timeline."
              "ru": "Стены здесь сдержанные. Хороший гид вводит парфянскую власть, торговые дороги, средиземноморские влияния и музейные предметы, не превращая прогулку в сухую хронологию."
              "uz": "Devorlar kamgap. Kuchli gid Parfiya qudrati, savdo yoʻllari, Oʻrta Yer dengizi taʼsiri va hozir muzey hikoyalarida turgan buyumlarni qoʻshadi, sayrni quruq xronologiyaga aylantirmaydi."
          - "type": "alert"
            "title":
              "en": "Traveler takeaway"
              "ru": "Для путешественника"
              "uz": "Sayohatchi uchun"
            "description":
              "en": "Give Nisa cooler hours, a measured walk, and enough guided context for the low walls to become a place, not only a ruin."
              "ru": "Дайте Нисе прохладные часы, размеренный шаг и достаточно контекста от гида, чтобы низкие стены стали местом, а не только руиной."
              "uz": "Nisaga salqin soatlar, oʻlchamli qadam va past devorlar faqat ruina emas, haqiqiy joyga aylanishi uchun yetarli gid kontekstini bering."
        "right":
          - "type": "miniTable"
            "title":
              "en": "Before you go"
              "ru": "Перед поездкой"
              "uz": "Borishdan oldin"
            "icon": "Circle"
            "rows":
              - "icon": "MapPin"
                "title":
                  "en": "At a glance Time needed"
                  "ru": "Коротко Сколько времени"
                  "uz": "Qisqacha Kerakli vaqt"
                "description":
                  "en": "Enough for the transfer, a calm site walk, and a return to the capital or museum time."
                  "ru": "Хватит на переезд, спокойную прогулку по месту и возвращение в столицу или музейное время."
                  "uz": "Transfer, sokin joy sayri va poytaxtga qaytish yoki muzey vaqti uchun yetadi."
              - "icon": "Landmark"
                "title":
                  "en": "Main magnet"
                  "ru": "Главный магнит"
                  "uz": "Asosiy magnit"
                "description":
                  "en": "The World Heritage property is the reason Nisa belongs in the first Turkmenistan route."
                  "ru": "Объект Всемирного наследия - причина, по которой Ниса нужна в первой поездке по Туркменистану."
                  "uz": "Jahon merosi obyekti Nisaning ilk Turkmaniston yoʻliga kirish sababidir."
              - "icon": "Sun"
                "title":
                  "en": "Light and heat"
                  "ru": "Свет и жара"
                  "uz": "Nur va issiq"
                "description":
                  "en": "Open ground can feel harsh; cooler timing protects both attention and comfort."
                  "ru": "Открытый грунт может быть жёстким; прохладное время бережёт и внимание, и комфорт."
                  "uz": "Ochiq zamin ogʻir sezilishi mumkin; salqin vaqt diqqatni ham, qulaylikni ham asraydi."
              - "icon": "Route"
                "title":
                  "en": "Route role"
                  "ru": "Роль в маршруте"
                  "uz": "Yoʻldagi roli"
                "description":
                  "en": "Nisa turns the first Ashgabat day from city orientation toward ancient history."
                  "ru": "Ниса переводит первый день у Ашхабада от городской ориентации к древней истории."
                  "uz": "Nisa Ashgabat atrofidagi birinchi kunni shahar moʻljalidan qadimiy tarix tomon olib o‘tadi."
  - "blockType": "regular"
