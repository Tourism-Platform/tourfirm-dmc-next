        "title":
          "en": "How long should groups stay in Nisa?"
          "ru": "Сколько времени группам стоит проводить в Ниса?"
          "uz": "Nisada guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "one focused city day plus overnight is usually enough when the old core or main anchors get a full walking window. City tone: “Parthian walls at Ashgabat's edge”."
          "ru": "Обычно хватает один насыщенный городской день плюс ночёвка, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Парфянские стены у края Ашхабада»."
          "uz": "Odatda bitta zich shahar kuni va tunash yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Ashgabat chetidagi Parfiya devorlari»."
      - "type": "destinationInsight"
        "icon": "MapPin"
        "title":
