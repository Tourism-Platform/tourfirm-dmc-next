  "metaDescription":
    "en": "Nisa sits just outside Ashgabat, but it changes the age of the journey. The white capital falls behind, the ground opens into low Parthian walls, and Old and New Nisa begin the older story that leads toward Mary, Merv, and the desert."
    "ru": "Ниса находится совсем рядом с Ашхабадом, но меняет возраст поездки. Белая столица остаётся позади, земля раскрывается низкими парфянскими стенами, и Старая с Новой Нисой начинают более древнюю линию пути к Мары, Мерву или пустыне."
    "uz": "Nisa Ashgabatga juda yaqin, lekin sayohatning vaqt miqyosini o‘zgartiradi. Oq poytaxt ortda qoladi, yer past Parfiya devorlariga ochiladi, Eski va Yangi Nisa esa Mary, Marv yoki sahro tomon ketadigan qadimiyroq hikoyani boshlaydi."
