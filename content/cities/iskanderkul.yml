    "title":
      "en": "Dushanbe, Penjikent, and the Fann road"
      "ru": "Душанбе, Пенджикент и дорога Фанских гор"
      "uz": "Dushanbe, Panjikent va Fan yoʻli"
    "description":
      "en": "Dushanbe gives the practical start or return. Penjikent brings the route onto the Zeravshan side. Varzob is a separate near-capital mountain outing, while Seven Lakes belongs to a fuller Fann program rather than a quick add-on."
      "ru": "Душанбе даёт практическое начало или возвращение. Пенджикент выводит маршрут на зеравшанскую сторону. Варзоб — отдельный горный выезд рядом со столицей, а Семь озёр относятся к более полной программе по Фанским горам, не к быстрому добавлению."
      "uz": "Dushanbe amaliy boshlanish yoki qaytishni beradi. Panjikent yo‘nalishni Zarafshon tomoniga olib chiqadi. Varzob poytaxt yaqinidagi alohida tog‘ chiqishi, Yetti ko‘l esa tez qo‘shimcha emas, to‘liqroq Fan dasturiga tegishli."
