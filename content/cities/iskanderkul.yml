              "ru": "Пенджикент, Семь озёр, Артуч и высокие маршруты требуют собственного времени, а не спешного добавления к озеру."
              "uz": "Panjikent, Yetti koʻl, Artuch va yuqori Fan yoʻllari shoshilinch koʻl tashrifiga qoʻshilmasdan, oʻz vaqtini talab qiladi."
          - "type": "alert"
