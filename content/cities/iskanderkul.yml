          "ru": "Пенджикент открывает западную часть маршрута по Фанским горам: древний Пенджикент над городом, Саразм ЮНЕСКО, музей Рудаки, рынок и выбор дороги к Семи озёрам или Искандеркулю."
          "uz": "Panjikent Fan togʻlari yo‘lining gʻarbiy qismini ochadi: shahar ustidagi qadimiy Panjikent, UNESCO Sarazm, Rudakiy muzeyi, bozor va Yetti ko‘l yoki Iskandarko‘l tomonga yo‘l tanlovi."
