  "en": "Iskanderkul is where the Fann Mountains become water first. The road reaches a turquoise lake held by red-grey slopes, with Dushanbe on one side of the journey and Penjikent on the other. Treat it as a mountain pause with one or two clear stops, not as a rushed photo turn."
  "ru": "На Искандеркуле Фанские горы сначала становятся водой. Дорога выходит к бирюзовому озеру в красно-серых склонах: Душанбе остаётся с одной стороны маршрута, Пенджикент — с другой. Это горная пауза с одной-двумя ясными остановками, а не быстрый разворот ради фотографии."
  "uz": "Iskandarkoʻlda Fan togʻlari avval suvga aylanadi. Yoʻl qizil-kulrang yonbagʻirlar orasidagi feruza koʻlga keladi: Dushanbe yoʻnalishning bir tomonida, Panjikent esa ikkinchi tomonida qoladi. Buni shoshilinch surat toʻxtashi emas, bir-ikki aniq bekatli togʻ pauzasi sifatida ko‘rish kerak."
