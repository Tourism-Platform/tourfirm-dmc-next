  "metaDescription":
    "en": "Karakol gives eastern Issyk-Kul its town rhythm before the route climbs higher. Dungan kitchens, a painted wooden mosque, a timber cathedral, guesthouses, and museum context help travelers choose whether the next day belongs to Jeti-Oguz, Altyn-Arashan, Ala-Kol, hot springs, or a quieter lake-road continuation."
    "ru": "Каракол задаёт восточному Иссык-Кулю городской ритм до подъёма выше. Дунганская кухня, расписная деревянная мечеть, деревянный собор, гостевые дома и музейный контекст помогают понять, стоит ли следующий день посвятить Джети-Огузу, Алтын-Арашану, Ала-Кулю, горячим источникам или более спокойному продолжению по озёрной дороге."
    "uz": "Qorakoʻl sharqiy Issiqkoʻlga togʻga chiqishdan oldin shahar ritmini beradi. Dungan oshxonasi, boʻyalgan yogʻoch masjid, yogʻoch sobor, mehmon uylari va muzey konteksti keyingi kun Jeti-Oʻgʻuz, Oltin-Arashan, Ala-Koʻl, issiq buloqlar yoki sokinroq koʻl yoʻli davomiga tegishli boʻlishini aniqlashga yordam beradi."
