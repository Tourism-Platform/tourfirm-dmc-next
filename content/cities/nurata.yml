                  "ru": "Мягкая весна и осень помогают легче читать двор, холм и продолжение к озеру."
                  "uz": "Yumshoq bahor va kuz havosi hovli, tepalik va ko‘l davomini o‘qishni osonlashtiradi."
              - "icon": "Route"
