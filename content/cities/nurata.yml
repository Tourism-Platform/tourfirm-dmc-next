                  "ru": "Город-порог между городами Шёлкового пути и дорогами к озеру, предгорьям, пустынным лагерям и Кызылкуму."
                  "uz": "Ipak yo‘li shaharlari bilan ko‘l, tog‘oldi, cho‘l lagerlari va Qizilqum yo‘llari orasidagi shahar-ostona."
