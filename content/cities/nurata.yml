                  "ru": "Источник Чашма, двор мечети, рыбы в бассейне, следы старой крепости и свет пустынной дороги."
                  "uz": "Chashma buloqi, masjid hovlisi, hovuzdagi baliqlar, eski qalʼa izlari va cho‘l yo‘li nuri."
