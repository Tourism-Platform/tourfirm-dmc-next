              "uz": "Chashma buloqi"
            "description":
              "en": "The spring gives Nurata its first pull: cool water, fish in the pool, courtyard shade, and a sound that softens the road before the desert."
              "ru": "Источник даёт Нурате первое притяжение: прохладную воду, рыб в бассейне, тень двора и звук, который смягчает дорогу перед пустыней."
              "uz": "Buloq Nurotadagi birinchi kuchli taassurotni beradi: salqin suv, hovuzdagi baliqlar, hovli soyasi va cho‘l oldidan yo‘lni yumshatadigan tovush."
          - "type": "quote"
            "quote":
              "en": "In Nurata, the road to the desert begins beside water."
              "ru": "В Нурате дорога к пустыне начинается у воды."
              "uz": "Nurotada cho‘lga boradigan yo‘l suv yonidan boshlanadi."
          - "type": "dashTitle"
            "title":
              "en": "Fortress earth"
              "ru": "Крепостная земля"
              "uz": "Qalʼa tuprog‘i"
            "description":
              "en": "Old fortress traces and dry stone add a rougher contrast above town, so the stop feels older and wider than the quiet streets first suggest."
              "ru": "Следы старой крепости и сухой камень дают над городом более грубый контраст, поэтому остановка кажется старше и шире, чем сначала подсказывают тихие улицы."
              "uz": "Eski qalʼa izlari va quruq tosh shahar ustida dag‘alroq qarama-qarshilik beradi, shu bois bekat sokin ko‘chalar avval ko‘rsatganidan qadimiyroq va kengroq seziladi."
          - "type": "dashTitle"
            "title":
              "en": "Lake and village roads"
              "ru": "Дороги к озеру и селу"
              "uz": "Ko‘l va qishloq yo‘llari"
            "description":
              "en": "From Nurata, the route can continue toward Aydarkul's blue shore or Sentyab's foothill paths, keeping spring water, sand, and village life in one clear sequence."
              "ru": "Из Нураты маршрут может продолжиться к синему берегу Айдаркуля или к предгорным тропам Сентоба, сохраняя воду источника, песок и сельскую жизнь в одной понятной последовательности."
              "uz": "Nurotadan yo‘l Aydarko‘lning ko‘k qirg‘og‘iga yoki Sentobning tog‘oldi so‘qmoqlariga davom etishi mumkin, buloq suvi, qum va qishloq hayotini bitta aniq ketma-ketlikda ushlab turadi."
          - "type": "alert"
            "title":
              "en": "For travelers"
              "ru": "Для путешественника"
              "uz": "Sayohatchi uchun"
            "description":
              "en": "Nurata is strongest when the visit includes Chashma, the fortress hill, and a clear onward choice toward Aydarkul, Sentyab, or the Kyzylkum night."
              "ru": "Нурата сильнее всего раскрывается, когда визит включает Чашму, холм крепости и понятное продолжение к Айдаркулю, Сентобу или ночи Кызылкума."
              "uz": "Nurota tashrif Chashma, qalʼa tepaligi va Aydarko‘l, Sentob yoki Qizilqum tuniga aniq davomni o‘z ichiga olganda kuchliroq ochiladi."
        "right":
