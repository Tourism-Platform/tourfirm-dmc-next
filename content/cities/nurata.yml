                  "ru": "Город источника и первая спокойная остановка маршрута Нурата, Айдаркуль и Кызылкум."
                  "uz": "Nurota, Aydarko‘l va Qizilqum yo‘nalishidagi buloq shahri va birinchi sokin to‘xtash."
