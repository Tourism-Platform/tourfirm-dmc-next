        "description":
          "en": "2–3 nights is usually enough when the old core or main anchors get a full walking window. City tone: “Spring water, mosque shade, and desert roads”."
          "ru": "Обычно хватает 2–3 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Вода источника, тень мечети и дорога в пустыню»."
          "uz": "Odatda 2–3 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Buloq suvi, masjid soyasi va cho‘l yo‘li»."
