          "ru": "Айдаркуль — озёрная остановка на дороге по Кызылкуму: открытый берег, камыш на ветру, мягкий песок, сезонное движение птиц и путь обратно к Нурате или Сентобу."
          "uz": "Aydarko‘l Qizilqum yo‘lidagi ko‘l bekati: ochiq qirg‘oq, shamoldagi qamish, yumshoq qum, mavsumiy qushlar harakati va Nurota yoki Sentobga qaytadigan yo‘l."
