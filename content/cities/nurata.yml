      "ru": "Айдаркуль открывает горизонт озера и песка; Сентоб уводит маршрут к предгорным тропам, дворам гостевых домов и времени за сельским столом."
      "uz": "Aydarko‘l ko‘l va qum ufqini ochadi; Sentob yo‘lni tog‘oldi so‘qmoqlari, mehmon uylari hovlilari va qishloq dasturxoni vaqtiga olib kiradi."
