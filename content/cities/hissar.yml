          "ru": "Сначала видны ворота: две круглые башни, высокий кирпичный портал и открытая территория у Гиссара. Это главный образ короткой поездки из Душанбе, но визит становится содержательнее, когда вы продолжаете к старому медресе, музейным залам и территории крепости."
