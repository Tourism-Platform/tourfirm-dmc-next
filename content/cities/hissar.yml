    "description":
      "en": "The visit begins with Hissar Fortress: restored gate, twin towers, Old Madrasa, museum rooms, and the open valley around the complex. The Old Madrasa belongs inside the fortress-complex visit; the museum display, Mahdumi Azam Mausoleum, and caravanserai traces need later source and access checks before they become separate public stops."
      "ru": "Визит начинается с Гиссарской крепости: восстановленные ворота, две башни, Старое медресе, музейные залы и открытая долина вокруг комплекса. Старое медресе относится к визиту в крепостной комплекс; музейная экспозиция, мавзолей Махдуми Азам и следы караван-сарая требуют дальнейшей проверки источников и доступа, прежде чем станут отдельными публичными остановками."
      "uz": "Tashrif Hisor qalʼasidan boshlanadi: tiklangan darvoza, ikki minora, Eski madrasa, muzey xonalari va majmua atrofidagi ochiq vodiy. Eski madrasa qalʼa majmuasi ichidagi tashrifga kiradi; muzey ekspozitsiyasi, Mahdumi Aʼzam maqbarasi va karvonsaroy izlari alohida ommaviy to‘xtash bo‘lishidan oldin keyingi manba va kirish tekshiruvlarini talab qiladi."
