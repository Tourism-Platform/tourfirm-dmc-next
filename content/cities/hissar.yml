  "uz": "Hisor Dushanbe yo‘lini ortiqcha murakkabliksiz o‘zgartiradi. Poytaxtdan yo‘l tiklangan qalʼa darvozasiga, Eski madrasa hovlilariga, muzey xonalariga va Hisor vodiysining yumshoq chetiga olib keladi. Bitta aniq tarixiy chiqish uchun keling, keyin shaharga qayting yoki vodiy va tog‘ tomonga davom eting."
