  "metaDescription":
    "en": "Hissar changes the Dushanbe route without making it complicated. The road from the capital leads to a restored fortress gate, Old Madrasa courtyards, museum rooms, and the softer edge of the Hissar Valley. Come for one focused heritage outing, then return to the city or continue toward the valley and mountains."
    "ru": "Гиссар меняет маршрут из Душанбе без лишней сложности. Дорога из столицы приводит к восстановленным крепостным воротам, дворам Старого медресе, музейным залам и мягкому краю Гиссарской долины. Приезжайте ради одного ясного исторического выезда, а затем возвращайтесь в город или продолжайте путь к долине и горам."
    "uz": "Hisor Dushanbe yo‘lini ortiqcha murakkabliksiz o‘zgartiradi. Poytaxtdan yo‘l tiklangan qalʼa darvozasiga, Eski madrasa hovlilariga, muzey xonalariga va Hisor vodiysining yumshoq chetiga olib keladi. Bitta aniq tarixiy chiqish uchun keling, keyin shaharga qayting yoki vodiy va tog‘ tomonga davom eting."
