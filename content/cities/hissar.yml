          "ru": "Сколько времени группам стоит проводить в Гиссар?"
          "uz": "Hisorda guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "1–2 nights is usually enough when the old core or main anchors get a full walking window. City tone: “A fortress town on the short road from Dushanbe”."
          "ru": "Обычно хватает 1–2 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Крепостной город на коротком выезде из Душанбе»."
          "uz": "Odatda 1–2 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Dushanbedan qisqa yo‘ldagi qalʼa shahri»."
      - "type": "destinationInsight"
        "icon": "Footprints"
        "title":
          "en": "Should Hissar be a walkable core or a base for day trips?"
          "ru": "Гиссар — это пешеходное ядро или база для выездов?"
          "uz": "Hisor piyoda yadroimi yoki chiqishlar uchun baza?"
        "description":
          "en": "Start with the compact city walk first. Day trips only after the centre has settled — otherwise the stop feels like a transfer with monuments attached."
          "ru": "Сначала компактная городская прогулка. Выезды — только после того, как центр «сел»; иначе остановка ощущается как трансфер с памятниками."
          "uz": "Avval ixcham shahar sayri. Chiqishlar — markaz joylashgandan keyin; aks holda bekat yodgorlikli transferdek tuyuladi."
      - "type": "destinationInsight"
        "icon": "Clock"
        "title":
