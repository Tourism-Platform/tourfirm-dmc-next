          "en": "2–3 nights is usually enough when the old core or main anchors get a full walking window. City tone: “Ceramics, workshop rooms, and the Seven Pirs road”."
          "ru": "Обычно хватает 2–3 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Керамика, мастерская и путь Семи пиров»."
          "uz": "Odatda 2–3 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Kulolchilik, ustaxona va Yetti Pir yoʻli»."
