              "uz": "Bu yerda toʻxtashning birinchi sababi kulolchilik: charx, moʻyqalam, javon, kosa va ularning ortidagi oilaviy ustaxona."
          - "type": "quote"
            "quote":
              "en": "Gijduvan is clearest when the traveler sees clay on the wheel become a painted bowl."
              "ru": "Гиждуван понятнее, когда путешественник видит путь от глины на круге до расписной чаши."
              "uz": "Gʻijduvon sayohatchi charxdagi loy naqshli kosaga aylanish jarayonini ko‘rganda aniqroq seziladi."
          - "type": "dashTitle"
            "title":
              "en": "Outing from Bukhara"
              "ru": "Выезд из Бухары"
              "uz": "Buxorodan chiqish"
            "description":
              "en": "Add Gijduvan after Bukhara's main places when the route needs time for a workshop, ceramics, and the people keeping the craft active."
              "ru": "Гиждуван стоит добавлять после главных мест Бухары, когда в маршруте нужно время для мастерской, керамики и живого ремесленного контекста."
              "uz": "Gʻijduvonni Buxoroning asosiy joylaridan keyin qoʻshgan maʼqul: marshrutga ustaxona, kulolchilik va hunarni davom ettirayotgan odamlar uchun vaqt kerak bo‘lganda."
          - "type": "dashTitle"
            "title":
              "en": "Before the outing"
              "ru": "Перед выездом"
              "uz": "Yoʻlga chiqishdan oldin"
            "description":
              "en": "Before leaving Bukhara, check whether the workshop is open, whether a demonstration is possible, and whether the route should include time for lunch or time with the makers."
              "ru": "Перед поездкой стоит уточнить, работает ли мастерская, возможен ли показ процесса и нужно ли закладывать время на обед или встречу с мастерами."
              "uz": "Yoʻlga chiqishdan oldin ustaxona ochiqligini, jarayonni koʻrsatish imkonini va tushlik yoki ustalar bilan vaqt kerak bo‘lishini aniqlab olish kerak."
          - "type": "alert"
            "title":
              "en": "For the traveler"
              "ru": "Для путешественника"
              "uz": "Sayohatchi uchun"
            "description":
              "en": "Come for the process: clay at the wheel, a brush line, a finished bowl in the hand, and a quieter stop with Abdulkhalik Gijduvani when the Seven Pirs road is part of the day."
              "ru": "Сюда стоит ехать ради процесса: глина на круге, линия кисти, готовая чаша в руках и спокойная остановка у Абдулхалика Гиждувани, если день связан с путём Семи пиров."
              "uz": "Bu yerga jarayon uchun kelish kerak: charxdagi loy, moʻyqalam chizigʻi, qoʻldagi tayyor kosa va kun Yetti Pir yoʻli bilan bogʻlanganda Abduxoliq Gʻijduvoniydagi sokin toʻxtash."
