          "ru": "Мургаб упорядочивает дорогу по восточному Памиру: тонкий воздух, простые посёлковые дела, проверку топлива и разрешений и один ясный выбор к Каракулю, Ак-Байталу, Рангкулю, Аличуру или Хорогу."
          "uz": "Murgʻob Sharqiy Pomir yoʻlini tartibga soladi: yupqa havo, oddiy shaharcha ishlari, yoqilgʻi va ruxsatnoma tekshiruvi hamda Qorakoʻl, Oq-Baytal, Rangkoʻl, Alichur yoki Xorugʻ sari bitta aniq tanlov."
