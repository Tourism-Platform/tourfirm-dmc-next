              "en": "The Panj gives Ishkashim its strongest visual memory, but it is also a border where people live. Move quietly, ask before photographs, and let the town remain itself rather than a scene arranged for visitors."
              "ru": "Пяндж оставляет самое сильное зрительное впечатление от Ишкашима, но это ещё и граница, рядом с которой живут люди. Двигайтесь спокойно, спрашивайте перед фотографиями и не превращайте городок в сцену для гостей."
              "uz": "Panj Ishkashimning eng kuchli koʻrinishini beradi, lekin u odamlar yashaydigan chegara hamdir. Sokin harakat qiling, suratga olishdan oldin soʻrang va shaharchani mehmonlar uchun sahnaga aylantirmang."
          - "type": "dashTitle"
            "title":
              "en": "Keep the onward plan fresh"
              "ru": "Обновляйте дальнейший план"
              "uz": "Davom rejasini yangilab boring"
            "description":
              "en": "Wakhan, Garm Chashma, fortress roads, and river viewpoints should be chosen after fresh local advice. Conditions, permits, and comfort change the route more than distance alone."
              "ru": "Вахан, Гарм-Чашма, крепостные дороги и виды Пянджа лучше выбирать после актуального местного совета. Условия, разрешения и комфорт меняют маршрут сильнее, чем одно расстояние."
              "uz": "Vaxon, Garm Chashma, qalʼa yoʻllari va Panj manzaralarini yangi mahalliy maslahatdan keyin tanlagan yaxshi. Sharoit, ruxsatnoma va qulaylik yoʻnalishni masofadan koʻproq oʻzgartirishi mumkin."
          - "type": "alert"
            "title":
              "en": "Traveler takeaway"
              "ru": "Для путешественника"
              "uz": "Sayohatchi uchun"
            "description":
              "en": "Leave Ishkashim only when the Wakhan direction is still valid: permits, weather, road, driver, and border etiquette checked."
              "ru": "Выезжайте из Ишкашима только тогда, когда направление к Вахану всё ещё подтверждено: разрешения, погода, дорога, водитель и этикет у границы проверены."
              "uz": "Ishkashimdan Vaxon tomoni hali ham mosligi tasdiqlanganda chiqing: ruxsatnoma, ob-havo, yoʻl, haydovchi va chegara odobi tekshirilgan boʻlsin."
        "right":
          - "type": "miniTable"
            "title":
              "en": "Before you go"
              "ru": "Перед поездкой"
              "uz": "Safardan oldin"
            "icon": "Circle"
            "rows":
              - "icon": "MapPin"
                "title":
                  "en": "At a glance Place"
                  "ru": "Коротко Место"
                  "uz": "Qisqacha Joy"
                "description":
                  "en": "Town on the Tajik side of the Panj, inside the Pamir & GBAO tourist region."
                  "ru": "Городок на таджикской стороне Пянджа, внутри туристического региона Памир и ГБАО."
                  "uz": "Panjning tojik tomonidagi shaharcha, Pomir va GBAO turistik hududi ichida."
              - "icon": "Landmark"
                "title":
                  "en": "Overnight stop"
                  "ru": "Ночёвка"
                  "uz": "Tunash"
                "description":
                  "en": "Usually one night when the route turns toward Wakhan; add time only when access, weather, or road conditions call for it."
                  "ru": "Обычно одна ночь, если маршрут поворачивает к Вахану; больше времени нужно только при доступе, погоде или дорожных условиях."
                  "uz": "Yoʻnalish Vaxon tomon burilsa, odatda bir kecha; kirish, ob-havo yoki yoʻl sharoiti talab qilsa, vaqt qoʻshiladi."
              - "icon": "Sun"
                "title":
                  "en": "Route role"
                  "ru": "Роль в маршруте"
                  "uz": "Yoʻnalishdagi roli"
                "description":
                  "en": "Wakhan-turn stop between Khorog, Panj River villages, hot-spring roads, fortress routes, and wider Pamir choices."
                  "ru": "Остановка перед Ваханом между Хорогом, деревнями у Пянджа, дорогами к горячим источникам, крепостными маршрутами и более широким Памиром."
                  "uz": "Xorugʻ, Panj boʻyidagi qishloqlar, issiq buloq yoʻllari, qalʼa yoʻnalishlari va kengroq Pomir tanlovlari orasidagi Vaxon oldi toʻxtashi."
              - "icon": "Route"
                "title":
                  "en": "Season and comfort"
                  "ru": "Сезон и комфорт"
                  "uz": "Mavsum va qulaylik"
                "description":
                  "en": "Road surface, valley heat or cold, snow higher up, and border-zone sensitivity matter more than a fixed timetable."
                  "ru": "Состояние дороги, жара или холод в долине, снег выше по маршруту и пограничный контекст важнее фиксированного расписания."
                  "uz": "Yoʻl holati, vodiydagi issiq yoki sovuq, yuqoriroqdagi qor va chegara hududi sezgirligi qatʼiy jadvaldan muhimroq."
              - "icon": "MapPin"
                "title":
                  "en": "Before departure"
                  "ru": "Перед выездом"
                  "uz": "Joʻnashdan oldin"
                "description":
