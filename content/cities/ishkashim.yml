          "ru": "Хорог даёт памирскому маршруту городскую остановку у рек: дорожки Ботанического сада, воздух Пянджа и Гунта, проверки ГБАО и выбор дороги к Вахану, Бартангу или Мургабу."
          "uz": "Xorugʻ Pomir yoʻliga daryo bo‘yidagi shahar toʻxtashini beradi: Botanika bogʻi yoʻlaklari, Panj va Gunt havosi, GBAO tekshiruvlari va Vaxon, Bartang yoki Murgʻob sari yoʻl tanlovi."
