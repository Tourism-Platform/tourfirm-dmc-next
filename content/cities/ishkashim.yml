                  "ru": "Перед отъездом ещё раз проверьте разрешения ГБАО и пограничной зоны, машину, водителя, погоду, дорогу, ночёвку и местный доступ."
                  "uz": "GBAO va chegara hududi ruxsatnomalari, mashina, haydovchi, ob-havo, yoʻl, tunash joyi va mahalliy kirishni ketishdan oldin yana tekshiring."
  - "blockType": "regular"
    "eyebrow":
      "en": "Where to continue"
      "ru": "Куда продолжить"
      "uz": "Qayerga davom etish"
    "title":
      "en": "Khorog, Murghab, Dushanbe, and the wider Pamir route"
      "ru": "Хорог, Мургаб, Душанбе и широкий памирский маршрут"
      "uz": "Xorugʻ, Murgʻob, Dushanbe va kengroq Pomir yoʻnalishi"
    "description":
      "en": "Khorog is the nearest larger town anchor. Murghab turns the route toward the eastern plateau, while Dushanbe remains the lower-road start or return point."
      "ru": "Хорог остаётся ближайшим крупным ориентиром. Мургаб разворачивает маршрут к восточному плато, а Душанбе остаётся нижним началом или возвращением маршрута."
      "uz": "Xorugʻ eng yaqin yirik yoʻnalish tayanchi. Murgʻob yoʻlni sharqiy plato tomonga buradi, Dushanbe esa pastki yoʻlning boshlanishi yoki qaytish nuqtasi boʻlib qoladi."
