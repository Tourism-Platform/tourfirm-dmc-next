          "uz": "Ishkashimda guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "one focused city day plus overnight is usually enough when the old core or main anchors get a full walking window. City tone: “Where the Pamir road turns toward Wakhan”."
          "ru": "Обычно хватает один насыщенный городской день плюс ночёвка, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Где памирская дорога поворачивает к Вахану»."
          "uz": "Odatda bitta zich shahar kuni va tunash yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Pomir yoʻli Vaxon tomon buriladigan joy»."
      - "type": "destinationInsight"
        "icon": "MapPin"
