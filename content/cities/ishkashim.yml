  "metaDescription":
    "en": "Ishkashim sits low beside the Panj, where the road from Khorog begins to feel like Wakhan: slower, closer to the river, and more sensitive to conditions. Look across the valley, ask what has changed on the road, and let permits, weather, and border etiquette decide the next move."
    "ru": "Ишкашим стоит ниже по долине у Пянджа, где дорога из Хорога начинает ощущаться как Вахан: медленнее, ближе к реке и внимательнее к условиям. Посмотрите на долину, узнайте, что изменилось на дороге, и пусть разрешения, погода и пограничный этикет зададут следующий шаг."
    "uz": "Ishkashim Panj boʻyidagi pastroq vodiyda joylashgan: Xorugʻdan kelgan yoʻl shu yerda Vaxonga xos boʻlib sekinlashadi, daryoga yaqinlashadi va sharoitga koʻproq bogʻlanadi. Vodiyga qarang, yoʻl haqida yangilik soʻrang va ruxsatnoma, ob-havo hamda chegara odobi keyingi qadamni belgilasin."
