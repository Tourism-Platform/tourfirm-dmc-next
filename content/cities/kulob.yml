            "quote":
              "en": "Kulob is strongest at a measured pace: shrine first, city life next, and the southern road only when the plan still feels right."
              "ru": "Куляб сильнее всего в размеренном темпе: сначала святыня, затем городская жизнь, и только потом южная дорога, если план всё ещё выглядит верным."
              "uz": "Koʻlob oʻlchovli surʼatda kuchliroq: avval ziyorat, keyin shahar hayoti, janubiy yoʻl esa reja hali ham mos boʻlsa."
          - "type": "dashTitle"
            "title":
              "en": "Add ordinary city life"
              "ru": "Добавьте обычную городскую жизнь"
              "uz": "Oddiy shahar vaqtini qoʻshing"
            "description":
              "en": "Market streets, tea, food, and museum time make Kulob feel like a lived city rather than a waypoint toward Hulbuk."
              "ru": "Рыночные улицы, чай, еда и музейное время делают Куляб живым городом, а не только точкой на дороге к Хулбуку."
              "uz": "Bozor koʻchalari, choy, ovqat va muzey vaqti Koʻlobni tirik shahar sifatida koʻrsatadi, faqat Hulbuk sari yoʻl belgisi emas."
          - "type": "dashTitle"
            "title":
              "en": "Choose one southern continuation"
              "ru": "Выберите одно южное продолжение"
              "uz": "Bitta janubiy davomni tanlang"
            "description":
              "en": "The route stays clearer when one continuation carries the next leg. Choose Hulbuk, Bokhtar, Nurek, or another Khatlon stop only when it is open, comfortable, and meaningful for the journey."
              "ru": "Маршрут остаётся яснее, когда следующий отрезок держит одно продолжение. Выбирайте Хулбук, Бохтар, Нурек или другую остановку Хатлона только тогда, когда она открыта, комфортна и действительно важна поездке."
              "uz": "Keyingi yoʻl bitta davomga tayansa, yoʻnalish aniqroq qoladi. Hulbuk, Boxtar, Nurek yoki boshqa Xatlon toʻxtashini faqat ochiq, qulay va safar uchun mazmunli boʻlganda tanlang."
          - "type": "alert"
            "title":
              "en": "Traveler takeaway"
              "ru": "Для путешественника"
              "uz": "Sayohatchi uchun"
            "description":
              "en": "Treat Kulob as a measured Khatlon stop, not a monument list: one strong city visit, one careful road choice, and current local advice before continuing."
              "ru": "Воспринимайте Куляб как спокойную остановку Хатлона, а не список памятников: один сильный городской визит, один аккуратный выбор дороги и свежий местный совет перед продолжением."
              "uz": "Koʻlobni yodgorliklar roʻyxati emas, oʻlchovli Xatlon toʻxtashi deb biling: bitta kuchli shahar tashrifi, bitta ehtiyotkor yoʻl tanlovi va davom etishdan oldin yangi mahalliy maslahat."
        "right":
          - "type": "miniTable"
            "title":
              "en": "Before you go"
              "ru": "Перед поездкой"
              "uz": "Safardan oldin"
