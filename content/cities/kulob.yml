                  "ru": "Город в туристическом регионе Хатлон и южная археология, к югу от основного прибытия через Душанбе."
                  "uz": "Xatlon va janubiy arxeologiya turistik hududidagi shahar, asosiy Dushanbe kelish yoʻlidan janubda."
              - "icon": "Landmark"
