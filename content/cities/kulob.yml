      "uz": "Hozircha Dushanbe asosiy amaliy qaytish nuqtasi. Boxtar, Nurek va Kalai Hulbuk Xatlon xaritasini tushunishga yordam beradi, lekin ular alohida koʻrib chiqilmaguncha yoʻl nomlari boʻlib qolishi kerak."
