  "metaDescription":
    "en": "South of Dushanbe, Kulob slows the route into a more local scale. The Hamadani courtyard, market streets, museum time, and the wider Ancient Khuttal story give the city its reason to stay before you choose whether to continue toward Hulbuk or return north."
    "ru": "К югу от Душанбе Куляб переводит маршрут в более местный масштаб. Двор Хамадани, рыночные улицы, музейное время и история Древнего Хутталя дают городу причину для остановки перед выбором: продолжать к Хулбуку или возвращаться на север."
    "uz": "Dushanbedan janubda Koʻlob yoʻnalishni mahalliyroq miqyosga olib kiradi. Hamadoniy hovlisi, bozor koʻchalari, muzey mazmuni va Qadimgi Xuttal hikoyasi shaharni toʻxtab tushunishga arziydigan qiladi; keyin Hulbuk tomonga davom etish yoki shimolga qaytishni tanlaysiz."
