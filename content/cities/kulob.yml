                  "ru": "Жара, тень, состояние дороги, комфорт машины и условия доступа должны задавать порядок посещений."
                  "uz": "Issiq, soya, yoʻl holati, mashina qulayligi va kirish sharoiti tashrif tartibini belgilashi kerak."
              - "icon": "MapPin"
                "title":
