                  "ru": "Южная городская опора для пространства Хамадани, рынка, музейного времени и возможного продолжения к Хулбуку."
                  "uz": "Hamadoniy makoni, bozor, muzey vaqti va Hulbuk tomonga mumkin boʻlgan davom uchun janubiy shahar tayanchi."
              - "icon": "Route"
