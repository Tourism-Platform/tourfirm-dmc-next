                  "ru": "Обычно одна ночь, если Куляб связан с размеренным продолжением по Хатлону."
                  "uz": "Koʻlob oʻlchovli Xatlon davomi bilan bogʻlansa, odatda bir kecha."
              - "icon": "Sun"
