                  "ru": "Уточните этикет святыни, доступ к музею, условия для Хулбука, план водителя, воду и свежий местный совет."
                  "uz": "Ziyorat odobi, muzey kirishi, Hulbuk sharoiti, haydovchi rejasi, suv va yangi mahalliy maslahatni aniqlang."
