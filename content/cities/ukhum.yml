  "metaDescription":
    "en": "Ukhum sits on the quieter Forish side of the Nuratau foothills. The best visit begins in the village itself: a courtyard stay, old water channels, nearby petroglyph slopes, and a walking plan that respects heat, footing, and the pace of the village."
    "ru": "Ухум лежит на более тихой, фаришской стороне предгорий Нуратау. Лучший визит начинается в самом селе: во дворе гостевого дома, у старых арыков, на соседних петроглифных склонах и в таком темпе, который учитывает жару, тропы и масштаб села."
    "uz": "Uhum Nurota tog‘oldilarining sokinroq, Forish tomonida joylashgan. Eng yaxshi tashrif qishloqning o‘zidan boshlanadi: mehmon uyi hovlisi, eski ariqlar, yaqin petroglif yonbag‘irlari hamda issiq, so‘qmoq va qishloq ko‘lamiga mos sekin yurish bilan."
