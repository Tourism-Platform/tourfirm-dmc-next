    "en": "Kichiksoy sits in Kattasoy MFY of Nurota District, close to Mushkan on the Nurota-side village road. It suits a measured rural pause: the approach road, the scale of the village, one household or craft moment when arranged, and an easy return toward Nurata, Sentob, Chuya, or Aydarkul."
    "ru": "Кичиксой находится в КФЙ Каттасой Нуратинского района, рядом с Мушканом на нуратинской сельской дороге. Это место подходит для размеренной сельской паузы: подъездной дороги, масштаба села, одного домашнего или ремесленного момента по договорённости и возвращения к Нурате, Сентобу, Чуе или Айдаркулю."
    "uz": "Kichiksoy Nurota tumanidagi Kattasoy MFYda, Mushkan yaqinidagi Nurota tomoni qishloq yo‘lida joylashgan. Bu joy o‘lchamli qishloq pauzasiga mos: kirish yo‘li, qishloq miqyosi, kelishilsa bitta xonadon yoki hunar lahzasi, keyin Nurota, Sentob, Chuya yoki Aydarko‘l tomonga qaytish."
