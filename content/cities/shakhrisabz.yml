      "ru": "Шахрисабзу нужно больше, чем короткая дворцовая остановка. Ак-Сарай начинает визит, но город становится понятнее через близкие дворы, мемориальные места, Чорсу, музейные коллекции и выбор следующей дороги по Кашкадарье."
      "uz": "Shahrisabzga tez saroy bekati sifatida qarash yetarli emas. Ak-Saroy tashrifni boshlaydi, lekin shahar yaqin hovlilar, memorial joylar, Chorsu, muzey buyumlari va Qashqadaryo yo‘li qayerga davom etishini tanlash orqali aniqroq bo‘ladi."
    "rows":
