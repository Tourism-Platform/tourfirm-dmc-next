        "title":
          "en": "Amir Temur Museum"
          "ru": "Музей Амира Темура"
          "uz": "Amir Temur muzeyi"
        "description":
          "en": "Inside Chubin Madrasah, Amir Temur Museum slows the Shakhrisabz walk down to rooms, cases, courtyard displays, and object detail. After Ak-Saray's scale and the memorial courtyards, the museum helps the city feel close enough to read through carved wood, ceramics, fragments, mode"
          "ru": "Внутри медресе Чубин Музей Амира Темура переводит прогулку по Шахрисабзу в другой масштаб: залы, витрины, двор и детали предметов. После размаха Ак-Сарая и мемориальных дворов здесь легче рассмотреть город вблизи: резное дерево, керамику, фрагменты, модели и темуридские материалы"
          "uz": "Chubin madrasasi ichida Amir Temur muzeyi Shahrisabz sayrini boshqa miqyosga olib kiradi: zallar, vitrinalar, hovli va buyum tafsilotlari. Ak-Saroyning keng manzarasi va memorial hovlilardan keyin bu yerda shaharni yaqindan ko‘rish osonlashadi: o‘yma yog‘och, sopol, parchalar, ma"
        "ctaHref": "/destinations/uzbekistan/kashkadarya-and-shakhrisabz/shakhrisabz/amir-temur-museum-shakhrisabz"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
      - "type": "routeIdea"
        "image": "assets/images/destinations/uzbekistan/regions/kashkadarya-and-shakhrisabz/cities/shakhrisabz/attractions/makom-museum-shakhrisabz.webp"
