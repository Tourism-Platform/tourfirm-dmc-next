            "description":
              "en": "Chorsu and the museums can keep the walk in the historic centre; add Kitab, Gissarak, Sarchashma, or Qarshi only when route timing and access are clear."
              "ru": "Чорсу и музеи могут оставить прогулку в историческом центре; Китаб, Гиссарак, Сарчашму или Карши стоит добавлять только тогда, когда понятны дорога и доступ."
              "uz": "Chorsu va muzeylar sayrni tarixiy markaz ichida ushlab turishi mumkin; Kitob, G‘issarak, Sarchashma yoki Qarshini esa yo‘l va kirish aniq bo‘lganda qo‘shgan yaxshi."
