  "en": "Shakhrisabz changes the journey after Samarkand. The city begins with the surviving Ak-Saray portal, then moves into Dorut Tilovat, Kok Gumbaz, Dorus-Saodat, Chorsu, museum rooms, and the road east toward Kitab, where the Kashkadarya route starts to approach the foothills."
  "ru": "После Самарканда Шахрисабз меняет ход маршрута. Город начинается с сохранившегося портала Ак-Сарая, затем переходит к Дорут-Тиловату, Кок-Гумбазу, Дорус-Саодату, Чорсу, музейным залам и дороге на восток к Китабу, где маршрут по Кашкадарье начинает подходить к предгорьям."
  "uz": "Samarqanddan keyin Shahrisabz yo‘l kayfiyatini o‘zgartiradi. Shahar saqlangan Ak-Saroy peshtoqidan boshlanadi, keyin Dorut Tilovat, Ko‘k Gumbaz, Dorus-Saodat, Chorsu, muzey xonalari va Qashqadaryo yo‘li tog‘oldiga yaqinlashadigan Kitob tomonga o‘tadi."
