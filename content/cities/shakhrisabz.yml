      "uz": "Shahar uchta aniq lahzada yaxshi ochiladi: Ak-Saroyga yondashuv, Dorut Tilovat va Ko‘k Gumbaz hovli muhiti, hamda Kitob va tog‘oldi tomonga davom etishi mumkin bo‘lgan yo‘l."
