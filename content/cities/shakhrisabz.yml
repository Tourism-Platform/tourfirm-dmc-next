        "description":
          "en": "Dorus-Saodat changes the focus after Ak-Saray: Jahangir's mausoleum, surviving brickwork, a mosque setting, and the crypt nearby make family memory concrete."
          "ru": "В Дорус-Саодате после Ак-Сарая внимание переходит к семейной памяти: мавзолею Джахангира, уцелевшей кирпичной архитектуре, пространству мечети и склепу рядом."
          "uz": "Dorus-Saodatda Ak-Saroydan keyin eʼtibor oilaviy xotiraga o‘tadi: Jahongir maqbarasi, saqlangan g‘isht meʼmorchiligi, masjid hududi va yaqin sag‘ana."
