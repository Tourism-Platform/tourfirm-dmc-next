          "uz": "Tavsiya"
        "title":
          "en": "Chorsu Covered Bazaar"
          "ru": "Крытый базар Чорсу"
          "uz": "Chorsu yopiq bozori"
        "description":
          "en": "Chorsu brings Shakhrisabz back to the street. UNESCO names the Chor-su bazaar within the historic centre: a covered market at the meeting of old routes, where an octagonal plan, central cupola, brick passages, and passing trade keep the walk from becoming only palaces and memoria"
          "ru": "Чорсу возвращает прогулку по Шахрисабзу к городской улице. UNESCO называет базар Chor-su внутри исторического центра: крытый рынок на встрече старых дорог, где восьмиугольный план, центральный купол, кирпичные проходы и торговая память не дают маршруту стать только чередой дворцо"
          "uz": "Chorsu Shahrisabz sayrini yana shahar ko‘chasiga qaytaradi. UNESCO Chor-su bozorini tarixiy markaz ichida tilga oladi: eski yo‘llar tutashgan joydagi yopiq bozor, sakkiz qirrali reja, markaziy gumbaz, g‘isht yo‘laklar va savdo xotirasi marshrutni faqat saroy va memoriallardan ibo"
        "ctaHref": "/destinations/uzbekistan/kashkadarya-and-shakhrisabz/shakhrisabz/chorsu-covered-bazaar-shakhrisabz"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
      - "type": "routeIdea"
        "image": "assets/images/destinations/uzbekistan/regions/kashkadarya-and-shakhrisabz/cities/shakhrisabz/attractions/amir-temur-museum-shakhrisabz.webp"
