          "en": "Recommended"
          "ru": "Рекомендуем"
          "uz": "Tavsiya"
        "title":
          "en": "Crypt of Amir Temur"
          "ru": "Склеп Амира Темура"
          "uz": "Amir Temur sag‘anasi"
        "description":
          "en": "Near Dorus-Saodat, Shakhrisabz narrows from Timurid scale to a single underground chamber. The crypt was prepared for Amir Temur, but he was not buried here; if it is open, the visit is brief, quiet, and strongest when that fact stays plain."
          "ru": "Рядом с Дорус-Саодат Шахрисабз сужается от тимуридского масштаба до одной подземной камеры. Склеп был подготовлен для Амира Темура, но он не был похоронен здесь; если камера открыта, визит получается коротким, тихим и сильнее всего действует тогда, когда факт остаётся простым."
          "uz": "Dorus-Saodat yonida Shahrisabz temuriylar miqyosidan bitta yerosti kameraga torayadi. Sag‘ana Amir Temur uchun tayyorlangan, ammo u bu yerda dafn etilmagan; agar kamera ochiq bo‘lsa, tashrif qisqa, sokin va fakt sodda qolganida kuchliroq bo‘ladi."
        "ctaHref": "/destinations/uzbekistan/kashkadarya-and-shakhrisabz/shakhrisabz/crypt-of-amir-temur-shakhrisabz"
