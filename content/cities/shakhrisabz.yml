          "ru": "Ак-Сарай, ансамбли святынь, Чорсу и музейный контекст дают Шахрисабзу первую ясную причину выехать по кашкадарьинской дороге к югу от Самарканда."
          "uz": "Ak-Saroy, ziyorat ansambllari, Chorsu va muzey konteksti Shahrisabzni Samarqanddan janubga Qashqadaryo yo‘liga chiqish uchun birinchi aniq sababga aylantiradi."
      - "type": "experience"
