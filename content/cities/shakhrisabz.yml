          "ru": "После Ак-Сарая Дорут-Тиловат переводит маршрут к Кок-Гумбазу, дворам, почитаемым именам и более камерной стороне мемориального центра Шахрисабза."
          "uz": "Ak-Saroydan keyin Dorut Tilovat yo‘lni Ko‘k Gumbaz, hovlilar, eʼzozlangan ismlar va Shahrisabz memorial markazining sokinroq tomoniga olib kiradi."
