    "title":
      "en": "Main places in Shakhrisabz"
      "ru": "Главные места Шахрисабза"
      "uz": "Shahrisabzning asosiy joylari"
    "description":
      "en": "Start with Ak-Saray, then follow the historic centre through Dorut Tilovat, Kok Gumbaz, Shamsiddin Kulol, Gumbazi Sayyidon, Dorus-Saodat, the Crypt of Amir Temur, Chorsu, and the museum stops. Historic baths and smaller mosque context remain for later local verification."
      "ru": "Начните с Ак-Сарая, затем проходите исторический центр через Дорут-Тиловат, Кок-Гумбаз, Шамсиддина Кулола, Гумбази-Саййидон, Дорус-Саодат, склеп Амира Темура, Чорсу и музейные остановки. Исторические бани и малые мечети остаются для будущей местной проверки."
      "uz": "Ak-Saroydan boshlang, keyin tarixiy markaz bo‘ylab Dorut Tilovat, Ko‘k Gumbaz, Shamsiddin Kulol, Gumbazi Sayyidon, Dorus-Saodat, Amir Temur sag‘anasi, Chorsu va muzey bekatlariga o‘ting. Tarixiy hammomlar va kichik masjidlar keyingi mahalliy tekshiruv uchun qoladi."
