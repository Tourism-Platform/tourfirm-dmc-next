              "uz": "Nurota va Qizilqum yo‘nalishiga arxeologiya, sokin eʼtibor va gid tushuntirishi kerak bo‘lganda Sarmishsoy mos keladi; keyin yo‘l buloq suvi, ko‘l qirg‘og‘i, tog‘oldi qishlog‘i yoki cho‘l yo‘liga davom etadi."
