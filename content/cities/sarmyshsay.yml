  "metaDescription":
    "en": "On the road between Nurata, Aydarkul, and the Kyzylkum, Sarmyshsay turns a wide route toward close stone. The gorge holds animal figures, hunting scenes, symbols, and later inscriptions under dark patina, so the strongest visit is guided, unrushed, and hands-off around the rock."
    "ru": "На дороге между Нуратой, Айдаркулем и Кызылкумом Сармышсай переводит широкий маршрут к близкому камню. В ущелье под тёмной патиной держатся фигуры животных, сцены охоты, символы и более поздние надписи, поэтому место лучше смотреть с гидом, без спешки и без касания скал."
    "uz": "Nurota, Aydarko‘l va Qizilqum orasidagi yo‘lda Sarmishsoy keng yo‘nalishni yaqin toshga olib keladi. Darada qoramtir patina ostida hayvon qiyofalari, ov sahnalari, belgilar va keyingi yozuvlar saqlangan; shu bois joy gid bilan, shoshilmasdan va qoya yuzalariga tegmasdan yaxshiroq tushuniladi."
