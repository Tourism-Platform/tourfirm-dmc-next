          "en": "one focused city day plus overnight is usually enough when the old core or main anchors get a full walking window. City tone: “A rock-art gorge between Nurata, Aydarkul, and the Kyzylkum road”."
          "ru": "Обычно хватает один насыщенный городской день плюс ночёвка, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Ущелье с петроглифами между Нуратой, Айдаркулем и дорогой Кызылкума»."
          "uz": "Odatda bitta zich shahar kuni va tunash yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Nurota, Aydarko‘l va Qizilqum yo‘li orasidagi qoyatosh sanʼati darasi»."
