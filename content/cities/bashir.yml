  "uz": "Hazrati Bashirga boradigan yo‘l Shahrisabz va Kitobdagi temuriy kenglikdan sokinroq tog‘oldi surʼatiga o‘tadi. Bu yerga ziyorat maʼnosi uchun kelishadi; eski chinorlar yonida suv ovozi eshitiladi, oilaviy mehmon uylari esa qishloqqa shoshmasdan, hurmat bilan kirishni talab qiladi."
