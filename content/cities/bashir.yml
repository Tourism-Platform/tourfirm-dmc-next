          "uz": "Hazrati Bashirda guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "2–3 nights is usually enough when the old core or main anchors get a full walking window. City tone: “A Kitob foothill village of pilgrimage, water, and family welcome”."
          "ru": "Обычно хватает 2–3 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Зиаратное село в предгорьях Китаба: вода, тень и семейный прием»."
          "uz": "Odatda 2–3 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Kitob tog‘oldilaridagi ziyorat, suv va oilaviy mehmonnavozlik qishlog‘i»."
