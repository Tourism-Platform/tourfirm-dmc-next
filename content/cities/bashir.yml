  "en": "The road to Hazrat Bashir leaves the Timurid scale of Shakhrisabz and Kitab for a quieter foothill rhythm. Travelers come for the sacred context, water runs near old plane trees, and family guesthouses make the village a place to enter with care rather than hurry through."
