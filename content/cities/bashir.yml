  "metaDescription":
    "en": "The road to Hazrat Bashir leaves the Timurid scale of Shakhrisabz and Kitab for a quieter foothill rhythm. Travelers come for the sacred context, water runs near old plane trees, and family guesthouses make the village a place to enter with care rather than hurry through."
    "ru": "Дорога к Хазрат Баширу уводит от тимуридского масштаба Шахрисабза и Китаба к более тихому предгорному ритму. Сюда приезжают ради зиаратного контекста; рядом с чинарами слышна вода, а семейные гостевые дома делают село местом, куда входят бережно, а не проезжают наскоро."
    "uz": "Hazrati Bashirga boradigan yo‘l Shahrisabz va Kitobdagi temuriy kenglikdan sokinroq tog‘oldi surʼatiga o‘tadi. Bu yerga ziyorat maʼnosi uchun kelishadi; eski chinorlar yonida suv ovozi eshitiladi, oilaviy mehmon uylari esa qishloqqa shoshmasdan, hurmat bilan kirishni talab qiladi."
