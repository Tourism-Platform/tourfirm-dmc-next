        "icon": "CircleQuestionMark"
        "title":
          "en": "How long should groups stay in Tersak?"
          "ru": "Сколько времени группам стоит проводить в Терсак?"
          "uz": "Tersakda guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "1–2 nights is usually enough when the old core or main anchors get a full walking window. City tone: “An Urgut mountain village for home meals, cooler air, and a slower return”."
          "ru": "Обычно хватает 1–2 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Горное село Ургута с домашним дастарханом, прохладным воздухом и спокойной дорогой»."
          "uz": "Odatda 1–2 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Oilaviy dasturxon, salqin havo va sokin qaytish yo‘li bor Urgut tog‘ qishlog‘i»."
      - "type": "destinationInsight"
