          "en": "2–3 nights is usually enough when the old core or main anchors get a full walking window. City tone: “A Vakhsh Valley city before the southern roads”."
          "ru": "Обычно хватает 2–3 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Город Вахшской долины перед южными дорогами»."
          "uz": "Odatda 2–3 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Janubiy yo‘llardan oldingi Vaxsh vodiysi shahri»."
