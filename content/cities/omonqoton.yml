  "metaDescription":
    "en": "Omonqoton gives the Samarkand route a softer mountain-side pause. The road turns through Urgut toward spring water, family-run stays, capsule-style overnights, summer village life, and the mountain line that can continue toward Tersak or Qoratepa."
    "ru": "Омонкотон даёт самаркандскому маршруту мягкую паузу со стороны гор. Дорога идёт через Ургут к родниковой воде, семейным домам, капсульному формату ночлега, летней сельской жизни и направлению, которое может продолжиться к Терсаку или Коратепа."
    "uz": "Omonqoton Samarqand marshrutiga tog‘ tomondagi yumshoq pauzani qo‘shadi. Yo‘l Urgut orqali buloq suvi, oilaviy uylar, kapsula uslubidagi tunash, yozgi qishloq hayoti va Tersak yoki Qoratepa tomonga davom etadigan tog‘ chizig‘iga olib boradi."
