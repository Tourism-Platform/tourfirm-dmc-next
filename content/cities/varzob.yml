  "metaDescription":
    "en": "Varzob sits just north of Dushanbe, where the capital's heat gives way to river bends and gorge air. It is not the Pamirs or the Fann Mountains; it is the close, useful mountain pause before a Tajikistan route goes higher."
    "ru": "Варзоб лежит к северу от Душанбе, там, где жара столицы сменяется речными поворотами и воздухом ущелья. Это ещё не Памир и не Фанские горы, а близкая горная пауза перед тем, как маршрут по Таджикистану уходит выше."
    "uz": "Varzob Dushanbedan shimolda, poytaxt issigʻi daryo burilishlari va dara havosiga almashadigan joyda boshlanadi. Bu hali Pomir ham, Fan togʻlari ham emas; Tojikiston yoʻli balandroqqa chiqishidan oldingi yaqin togʻ pauzasi."
