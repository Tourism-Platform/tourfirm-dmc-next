              "ru": "Начните с Бабура"
              "uz": "Boburdan boshlang"
            "description":
              "en": "Babur Memorial Park, the house-museum context, and the city's literary memory explain why Andijan belongs in the itinerary."
              "ru": "Парк Бабура, контекст дома-музея и литературная память города объясняют, зачем Андижан появляется в маршруте."
              "uz": "Bobur bog‘i, uy-muzey mazmuni va shaharning adabiy xotirasi Andijon nega yo‘lga kirishini tushuntiradi."
          - "type": "quote"
            "quote":
              "en": "Andijan is clearest when Babur memory opens the visit and the eastern valley road gives it purpose."
              "ru": "Андижан понятнее всего, когда память о Бабуре открывает визит, а восточная дорога даёт ему цель."
              "uz": "Andijon Bobur xotirasi tashrifni ochib, sharqiy vodiy yo‘li unga maqsad berganda eng aniq ko‘rinadi."
          - "type": "dashTitle"
            "title":
              "en": "Add Jomeh and museums carefully"
              "ru": "Добавляйте Джами и музеи аккуратно"
              "uz": "Jome va muzeylarni ehtiyotkorlik bilan qo‘shing"
            "description":
              "en": "The Jomeh complex and museum stops can deepen the visit, but access, prayer time, opening rules, and group flow should be checked before they are promised."
              "ru": "Комплекс Джами и музейные остановки могут углубить визит, но доступ, время молитвы, правила работы и движение группы нужно проверить заранее."
              "uz": "Jome majmuasi va muzey bekatlari tashrifni chuqurlashtirishi mumkin, lekin kirish, namoz vaqti, ish qoidalari va guruh harakati oldindan tekshirilishi kerak."
          - "type": "dashTitle"
            "title":
              "en": "Keep one ordinary city moment"
              "ru": "Оставьте один обычный городской момент"
              "uz": "Bir oddiy shahar lahzasini qoldiring"
            "description":
              "en": "A short street walk, tea, bread, fruit, or a calm local meal helps Andijan feel like a living city, not just a Babur note."
              "ru": "Короткая прогулка, чай, хлеб, фрукты или спокойный местный обед помогают Андижану ощущаться живым городом, а не только заметкой о Бабуре."
              "uz": "Qisqa sayr, choy, non, meva yoki sokin mahalliy taom Andijonni faqat Bobur eslatmasi emas, jonli shahar sifatida his qildiradi."
          - "type": "alert"
            "title":
              "en": "For travelers"
              "ru": "Для путешественника"
              "uz": "Sayohatchi uchun"
            "description":
              "en": "Choose Andijan when the Fergana Valley route has a real reason for Babur, Jomeh, and an eastern-valley decision, not when the program only needs one more city name."
              "ru": "Выбирайте Андижан, когда в маршруте по Ферганской долине есть настоящая причина для Бабура, Джами и восточного решения, а не когда программе нужно ещё одно городское название."
              "uz": "Fargʻona vodiysi yo‘lida Bobur, Jome va haqiqiy sharqiy qaror uchun aniq sabab bo‘lsa, Andijonni tanlang; dasturga yana bir shahar nomi kerak bo‘lgani uchun emas."
        "right":
