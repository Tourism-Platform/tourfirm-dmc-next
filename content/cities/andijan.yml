      "ru": "Андижан расширяет восточную сторону долины, а Коканд, Маргилан и Риштан остаются главными дворцовыми, шёлковыми и керамическими опорами, с которыми его можно соединить."
      "uz": "Andijon vodiyning sharqiy tomonini kengaytiradi, Qo‘qon, Margʻilon va Rishton esa u bilan bog‘lanadigan asosiy saroy, ipak va kulolchilik tayanchlari bo‘lib qoladi."
