        "icon": "CircleQuestionMark"
        "title":
          "en": "How long should groups stay in Andijan?"
          "ru": "Сколько времени группам стоит проводить в Андижан?"
          "uz": "Andijonda guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "2–3 nights is usually enough when the old core or main anchors get a full walking window. City tone: “Babur memory at the eastern edge of the Fergana Valley”."
          "ru": "Обычно хватает 2–3 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Память о Бабуре на восточном краю Ферганской долины»."
          "uz": "Odatda 2–3 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Fargʻona vodiysining sharqiy chetida Bobur xotirasi»."
      - "type": "destinationInsight"
        "icon": "Landmark"
        "title":
          "en": "Should Andijan be a walkable core or a base for day trips?"
          "ru": "Андижан — это пешеходное ядро или база для выездов?"
          "uz": "Andijon piyoda yadroimi yoki chiqishlar uchun baza?"
        "description":
          "en": "Start with the compact city walk first. Day trips only after the centre has settled — otherwise the stop feels like a transfer with monuments attached."
          "ru": "Сначала компактная городская прогулка. Выезды — только после того, как центр «сел»; иначе остановка ощущается как трансфер с памятниками."
          "uz": "Avval ixcham shahar sayri. Chiqishlar — markaz joylashgandan keyin; aks holda bekat yodgorlikli transferdek tuyuladi."
      - "type": "destinationInsight"
        "icon": "Hotel"
        "title":
          "en": "Where should overnight be relative to Andijan's centre?"
          "ru": "Где лучше ночевать относительно центра Андижан?"
          "uz": "Andijon markaziga nisbatan qayerda tunash yaxshi?"
        "description":
          "en": "Stay close enough for an evening return on foot or a short transfer. That keeps tea, dinner, and a second pass through the lanes easy without burning the next morning."
          "ru": "Живите достаточно близко, чтобы вечером вернуться пешком или коротким трансфером. Так чай, ужин и второй проход по улицам остаются лёгкими и не сжигают следующее утро."
          "uz": "Kechqurun piyoda yoki qisqa transfer bilan qaytishga yaqin turing. Choy, kechki ovqat va ko‘chalardan ikkinchi o‘tish oson qoladi, erta tongni yoqib yubormaydi."
