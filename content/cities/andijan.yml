                  "ru": "Осознанная дневная остановка или ночёвка лучше, чем спешная добавка между главными западными опорами долины."
                  "uz": "Shoshilinch qo‘shimchadan ko‘ra ongli kunduzgi bekat yoki tunash asosiy g‘arbiy vodiy tayanchlari orasida yaxshiroq mos keladi."
  - "blockType": "regular"
