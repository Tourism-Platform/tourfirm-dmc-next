  "metaDescription":
    "en": "Nanay sits on the mountain side of Namangan Region, where the Fergana Valley road leaves the larger city rhythm for cleaner air, village hospitality, and local culture. It belongs in a route as a modest tourism-village stop when the road, local welcome, and return timing are current."
    "ru": "Нанай расположен на горной стороне Наманганской области, там, где маршрут по Ферганской долине уходит от городского ритма к чистому воздуху, сельскому гостеприимству и местной культуре. В маршруте это небольшая остановка туристического села, которую стоит включать, когда дорога, местный приём и время возвращения актуальны."
    "uz": "Nanay Namangan viloyatining tog‘ tomonida joylashgan. Bu yerda Farg‘ona vodiysi yo‘li katta shahar sur’atidan chiqib, toza havo, qishloq mehmondo‘stligi va mahalliy madaniyatga yaqinlashadi. Yo‘nalishda Nanay kichik turizm qishlog‘i bekati sifatida yo‘l, mahalliy qabul va qaytish vaqti joriy bo‘lganda yaxshi ochiladi."
