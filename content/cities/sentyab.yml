    "description":
      "en": "Nurata gives the spring-town start, Aydarkul opens the water and desert side, and Ukhum shows another Nuratau village expression when the route can carry more than one rural stop."
      "ru": "Нурата даёт начало у источника, Айдаркуль открывает воду и пустынный край, а Ухум показывает другое выражение Нуратау, когда маршрут выдерживает больше одной сельской остановки."
      "uz": "Nurota buloq boshini beradi, Aydarko‘l suv va cho‘l tomonini ochadi, Uxum esa yo‘l bir nechta qishloq bekatini ko‘tara olganda Nurotaning boshqa qishloq ifodasini ko‘rsatadi."
