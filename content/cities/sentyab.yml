              "uz": "Nurota-Aydarko‘l yo‘li haqiqiy tog‘oldi qishlog‘ida sekinlashishi kerak bo‘lsa, Sentobni tanlang: qisqa yurish, vaqt va kutib olish tabiiy mos kelsa xonadon dasturxoni yoki yo‘l yana ochilishidan oldin yonbag‘irlarga qarash."
