          "uz": "Qishloqdan keyin Chashma suvi, Aydarko‘l qirg‘og‘i, qamish, qum va Qizilqum yo‘li marshrutni ochiq mamlakatga qaytaradi."
  - "blockType": "regular"
    "eyebrow":
      "en": "Before you go"
      "ru": "Перед поездкой"
      "uz": "Safardan oldin"
    "title":
      "en": "A village stop at human scale"
      "ru": "Сельская остановка в человеческом масштабе"
      "uz": "Qishloq bekati insoniy miqyosda"
    "description":
      "en": "Sentob has strong recognition, including UN Tourism Best Tourism Villages 2023. For travelers, the value is the scale itself: lanes, courtyards, gardens, and slopes close enough to read slowly."
      "ru": "У Сентоба уже сильное признание, включая Best Tourism Villages 2023 от UN Tourism. Для путешественника ценность — в самом масштабе: улицы, дворы, сады и склоны здесь достаточно близко, чтобы читать их не спеша."
      "uz": "Sentobda kuchli eʼtirof bor, jumladan UN Tourism Best Tourism Villages 2023 ro‘yxati. Sayohatchi uchun qiymat qishloq miqyosining o‘zida: ko‘chalar, hovlilar, bog‘lar va yonbag‘irlar sekin o‘qiladigan darajada yaqin."
    "rows":
      - "ratio": "2:1"
        "left":
          - "type": "dashTitle"
            "title":
              "en": "Start with the stone village"
              "ru": "Начните с каменного села"
              "uz": "Tosh qishloqdan boshlang"
            "description":
              "en": "Let Sentob begin at village scale: stone walls, shaded lanes, courtyards, trees, and the ordinary rhythm of people who live there. A short respectful walk can carry more feeling than adding stops just to fill time."
              "ru": "Пусть Сентоб начинается в сельском масштабе: каменные стены, тенистые улицы, дворы, деревья и обычный ритм людей, которые здесь живут. Короткая уважительная прогулка может дать больше, чем попытка добавить лишние остановки."
              "uz": "Sentob qishloq miqyosida boshlansin: tosh devorlar, soyali ko‘chalar, hovlilar, daraxtlar va shu yerda yashaydigan odamlarning oddiy sur’ati. Qisqa va hurmatli yurish qo‘shimcha bekatlar qo‘shishdan ko‘ra ko‘proq maʼno beradi."
          - "type": "quote"
            "quote":
              "en": "Sentob is strongest when stone lanes, household food, and the mountain edge stay at village scale."
              "ru": "Сентоб сильнее всего, когда каменные улицы, домашняя еда и край гор остаются в сельском масштабе."
              "uz": "Sentob tosh ko‘chalar, xonadon taomi va tog‘ cheti qishloq miqyosida qolganda eng kuchli."
          - "type": "dashTitle"
            "title":
              "en": "Let the table stay personal"
              "ru": "Оставьте домашний стол личным"
              "uz": "Xonadon dasturxoni shaxsiy qolsin"
            "description":
              "en": "Bread, tea, fruit, dairy, dried fruit, honey, or a simple meal belongs here as a human moment in the route, not as something every courtyard needs to provide."
              "ru": "Лепёшка, чай, фрукты, молочные продукты, сухофрукты, мёд или простая еда звучат здесь как человеческая часть маршрута, а не как обязанность каждого двора."
              "uz": "Non, choy, meva, sut mahsuloti, qoq meva, asal yoki sodda ovqat bu yerda har bir hovlining majburiy vazifasi emas, yo‘lning insoniy qismi sifatida eshitiladi."
          - "type": "dashTitle"
            "title":
              "en": "Keep mountain extensions selective"
              "ru": "Выбирайте горные продолжения аккуратно"
              "uz": "Tog‘ davomlarini ehtiyotkor tanlang"
            "description":
              "en": "Fozilman, high paths, Aydarkul, Sarmyshsay, caves, and waterfall scenery can extend the journey, but Sentob remains strongest when the village stop does not become overloaded."
              "ru": "Фозильман, высокие тропы, Айдаркуль, Сармышсай, пещеры и водопадные пейзажи могут расширить путешествие, но Сентоб сильнее всего, когда сельская остановка не перегружена."
              "uz": "Fozilman, baland so‘qmoqlar, Aydarko‘l, Sarmishsoy, g‘orlar va sharshara manzaralari safarni kengaytirishi mumkin, lekin Sentob qishloq bekati ortiqcha yuklanmaganda kuchliroq."
          - "type": "alert"
            "title":
              "en": "For travelers"
              "ru": "Для путешественника"
              "uz": "Sayohatchi uchun"
            "description":
              "en": "Choose Sentob when the Nurata and Aydarkul route should slow into a real foothill village, with any longer mountain choice kept secondary to the route’s rhythm."
              "ru": "Выбирайте Сентоб, когда маршрут Нураты и Айдаркуля должен замедлиться в настоящем предгорном селе, а любой длинный горный выбор остаётся вторым планом маршрута."
              "uz": "Nurota va Aydarko‘l yo‘li haqiqiy tog‘oldi qishlog‘ida sekinlashishi kerak bo‘lsa, Sentobni tanlang; uzoqroq tog‘ tanlovi esa yo‘l ritmida ikkinchi rejada qolsin."
        "right":
          - "type": "miniTable"
            "title":
              "en": "Before you go"
              "ru": "Перед поездкой"
              "uz": "Safardan oldin"
            "icon": "Circle"
            "rows":
              - "icon": "MapPin"
                "title":
                  "en": "Before you go Recognition"
                  "ru": "Перед поездкой Признание"
                  "uz": "Safardan oldin Eʼtirof"
                "description":
                  "en": "Sentob is an official tourism village and was listed by UN Tourism among the Best Tourism Villages in 2023."
                  "ru": "Сентоб имеет статус туристического села и был отмечен UN Tourism среди Best Tourism Villages 2023."
                  "uz": "Sentob turizm qishlog‘i maqomiga ega va 2023 yilda UN Tourism Best Tourism Villages ro‘yxatida qayd etilgan."
              - "icon": "Landmark"
                "title":
                  "en": "Main setting"
                  "ru": "Главная среда"
                  "uz": "Asosiy muhit"
                "description":
                  "en": "Nurata District village between the Nuratau foothills, the Kyzylkum edge, and the Aydarkul route."
                  "ru": "Село Нуратинского района между предгорьями Нуратау, краем Кызылкума и маршрутом Айдаркуля."
                  "uz": "Nurota tog‘oldilari, Qizilqum cheti va Aydarko‘l yo‘li orasidagi Nurota tumani qishlog‘i."
              - "icon": "Sun"
                "title":
                  "en": "Visit shape"
                  "ru": "Формат визита"
                  "uz": "Tashrif shakli"
                "description":
                  "en": "Stone-lane walk, courtyard shade, household table, garden produce, and a short foothill view when timing suits the route."
                  "ru": "Прогулка по каменным улицам, тень дворов, домашний стол, садовые продукты и короткий вид на предгорья, когда время подходит маршруту."
                  "uz": "Tosh ko‘cha yurishi, hovli soyasi, xonadon dasturxoni, bog‘ mahsuloti va vaqt yo‘lga mos kelganda qisqa tog‘oldi manzarasi."
              - "icon": "Route"
                "title":
                  "en": "Mountain choices"
                  "ru": "Горный выбор"
                  "uz": "Tog‘ tanlovi"
                "description":
                  "en": "Fozilman and longer walks belong only when the path, weather, walking distance, and return hour are suitable."
                  "ru": "Фозильман и длинные прогулки уместны только тогда, когда тропа, погода, длина пути и возвращение подходят маршруту."
                  "uz": "Fozilman va uzoqroq yurishlar faqat so‘qmoq, ob-havo, masofa va qaytish vaqti yo‘lga mos bo‘lganda o‘rinli."
  - "blockType": "regular"
