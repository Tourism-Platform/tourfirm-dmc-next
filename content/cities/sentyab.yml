          "uz": "Bog‘ mevasi va non"
        "description":
          "en": "Apricots, mulberries, walnuts, dried fruit, honey, dairy, and bread give the table a season instead of a performance."
          "ru": "Урюк, шелковица, грецкий орех, сухофрукты, мёд, молочные продукты и лепёшка дают столу сезон, а не постановку."
