          "uz": "Fozilman yo‘l tanlovi"
        "description":
          "en": "Fozilman belongs only when the path, weather, walking distance, and return hour make the mountain side realistic."
          "ru": "Фозильман уместен только тогда, когда тропа, погода, длина прогулки и возвращение делают горную сторону реалистичной."
          "uz": "Fozilman faqat so‘qmoq, ob-havo, yurish masofasi va qaytish vaqti tog‘ tomonini real qilganda mos keladi."
      - "type": "experience"
