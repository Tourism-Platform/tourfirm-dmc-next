          "uz": "Sentobda guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "1–2 nights is usually enough when the old core or main anchors get a full walking window. City tone: “Stone lanes, garden shade, and Nuratau foothill hospitality”."
          "ru": "Обычно хватает 1–2 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Каменные улицы, садовая тень и предгорное гостеприимство Нуратау»."
          "uz": "Odatda 1–2 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Tosh ko‘chalar, bog‘ soyasi va Nurota tog‘oldi mehmondo‘stligi»."
      - "type": "destinationInsight"
        "icon": "Footprints"
