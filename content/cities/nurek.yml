  "en": "Nurek changes the southern road before it becomes a long Khatlon journey. Water appears between dry hills, the dam gives the landscape its scale, and the right visit stays clear-eyed: confirmed viewpoints, no casual infrastructure access, and an early choice between returning to Dushanbe or continuing toward Bokhtar and Kulob."
  "ru": "Нурек меняет южную дорогу еще до того, как она становится длинным маршрутом по Хатлону. Между сухими холмами появляется вода, плотина задает месту масштаб, а удачный визит остается честным: проверенные смотровые точки, без обещаний свободного доступа к инфраструктуре, и раннее решение - вернуться в Душанбе или продолжить к Бохтару и Кулябу."
  "uz": "Nurek janubiy yo‘l uzoq Xatlon marshrutiga aylanishidan oldin uning ohangini o‘zgartiradi. Quruq tepaliklar orasida suv ko‘rinadi, to‘g‘on manzaraga miqyos beradi, yaxshi tashrif esa aniq qoladi: tasdiqlangan tomosha nuqtalari, infratuzilmaga erkin kirish va’dasisiz, va Dushanbega qaytish yoki Boxtar hamda Ko‘lob tomon davom etish bo‘yicha erta qaror."
