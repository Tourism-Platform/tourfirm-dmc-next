              "uz": "Yongʻoq o‘rmoni qishloqqa uning qiyofasini beradi. Balandroq yoki uzunroq rejalarni qo‘shishdan oldin soya, so‘qmoqlar, yonbagʻirlar va suvga vaqt ajrating."
          - "type": "quote"
            "quote":
              "en": "Arslanbob feels strongest when the forest sets the pace and the waterfall is chosen for the right day."
              "ru": "Арсланбоб сильнее всего раскрывается, когда лес задаёт темп, а водопад выбран под подходящий день."
              "uz": "Arslonbob o‘rmon surʼat berganda va sharshara mos kunga tanlanganda eng kuchli ochiladi."
          - "type": "dashTitle"
            "title":
              "en": "Match the waterfall to the day"
              "ru": "Подберите водопад под день"
              "uz": "Sharsharani kunga moslang"
            "description":
              "en": "Big Waterfall is the strongest public walk for this stage. Footing, heat, rain, water level, footwear, and return timing should shape the choice."
              "ru": "Большой водопад — самый сильный публичный выход на этом этапе. Поверхность тропы, жара, дождь, уровень воды, обувь и время возвращения должны влиять на выбор."
              "uz": "Katta sharshara bu bosqichdagi eng kuchli ommaviy yurishdir. So‘qmoq yuzasi, issiq, yomgʻir, suv darajasi, poyabzal va qaytish vaqti tanlovga taʼsir qilishi kerak."
          - "type": "dashTitle"
            "title":
              "en": "Add village time only when ready"
              "ru": "Добавляйте сельское время только когда оно готово"
              "uz": "Qishloq vaqtini faqat tayyor bo‘lganda qo‘shing"
            "description":
              "en": "Guesthouses, meals, community visits, harvest moments, and guided mountain routes need current confirmation. They add warmth only when the people and standards are prepared."
              "ru": "Гостевые дома, еда, общинные визиты, урожайные моменты и горные маршруты требуют текущего подтверждения. Они добавляют тепло только тогда, когда люди и стандарты готовы."
              "uz": "Mehmon uylari, ovqat, jamoa tashriflari, hosil lahzalari va togʻ marshrutlari joriy tasdiq talab qiladi. Ular odamlar va standartlar tayyor bo‘lgandagina iliqlik qo‘shadi."
          - "type": "alert"
            "title":
              "en": "Traveler takeaway"
              "ru": "Что важно путешественнику"
              "uz": "Sayohatchi uchun xulosa"
            "description":
              "en": "Leave with the village rhythm intact: walnut shade, one clear walk, and local arrangements that were genuinely ready."
              "ru": "Уезжайте с сохранённым ритмом села: ореховая тень, одна ясная прогулка и местные договоренности, которые действительно были готовы."
              "uz": "Qishloq surʼatini saqlagan holda chiqing: yongʻoq soyasi, bitta aniq yurish va haqiqatan tayyor bo‘lgan mahalliy kelishuvlar."
