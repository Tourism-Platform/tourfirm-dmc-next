    "description":
      "en": "Osh gives the south its city anchor; Uzgen adds a focused Silk Road stop when the road plan allows. Jalal-Abad and Sary-Chelek remain important choices, but they need separate checks before they join the same stay."
      "ru": "Ош даёт югу главный городской ориентир; Узген добавляет точную остановку наследия Шёлкового пути, когда дорожный план это позволяет. Джалал-Абад и Сары-Челек остаются важными решениями, но перед включением в ту же остановку требуют отдельных проверок."
      "uz": "Osh janubga shahar tayanchini beradi; O‘zgan yoʻl rejasi imkon berganda aniq Ipak yoʻli merosi to‘xtashini qo‘shadi. Jalolobod va Sari-Chelek muhim tanlov bo‘lib qoladi, lekin ularni shu to‘xtashga qo‘shishdan oldin alohida tekshiruv kerak."
