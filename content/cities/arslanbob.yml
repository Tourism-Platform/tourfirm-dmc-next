    "en": "Arslanbob changes the southern road from transit into village time. Begin with the walnut forest, let the waterfall walk depend on weather and path conditions, and add meals, host time, or local support only when arrangements are confirmed."
    "ru": "Арсланбоб переводит южную дорогу из транзита в сельское время. Начните с орехового леса, выбирайте водопад по погоде и состоянию тропы, а еду, время с хозяевами или местную помощь добавляйте только после подтверждения."
