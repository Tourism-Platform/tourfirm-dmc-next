                  "ru": "паузы на сельской дороге, масштаб Маргузора и решение, подходит ли Хазорчашма под условия."
                  "uz": "qishloq yoʻlidagi pauzalar, Marguzor miqyosi va Hazorchashma sharoitga mos keladimi degan qaror."
              - "icon": "Sun"
