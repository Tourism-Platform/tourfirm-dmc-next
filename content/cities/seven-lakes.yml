                  "ru": "подходящую машину, световой день, остановки на еду и отдых, этикет в сёлах, чувствительность к фотографиям и смысл продолжения к верхнему озеру."
                  "uz": "vehicle suitability, daylight, meal and rest stops, village etiquette, photography sensitivity, and the sense of continuing to the upper lake."
  - "blockType": "regular"
    "eyebrow":
