      "uz": "Koʻl yoʻlini sabr bilan rejalang"
    "description":
      "en": "The distances can look simple on a map, but the valley asks for slower judgment. Water level, road surface, village traffic, meal stops, and weather can all change how far the visit should go."
      "ru": "На карте расстояния могут выглядеть простыми, но долина требует более медленной оценки. Уровень воды, поверхность дороги, движение в сёлах, остановки на еду и погода могут изменить то, насколько высоко стоит подниматься."
      "uz": "Xarita masofalarni sodda koʻrsatishi mumkin, lekin vodiy sekinroq bahoni talab qiladi. Suv darajasi, yoʻl yuzasi, qishloq harakati, ovqat uchun toʻxtashlar va ob-havo qanchalik yuqoriga borishni oʻzgartirishi mumkin."
    "rows":
      - "ratio": "2:1"
        "left":
          - "type": "dashTitle"
            "title":
              "en": "Begin with the lower lakes"
              "ru": "Начните с нижних озёр"
              "uz": "Pastki koʻllardan boshlang"
            "description":
              "en": "Mijgon, Soya, Hushyor, Nofin, and Khurdak build the climb gradually. Your guide can choose pauses that make the changes visible without turning every stop into the same photograph."
              "ru": "Мижгон, Соя, Хушёр, Нофин и Хурдак постепенно собирают подъём. Гид может выбрать паузы так, чтобы перемены были заметны, а каждое озеро не превращалось в одинаковую фотографию."
              "uz": "Mijgon, Soya, Hushyor, Nofin va Khurdak koʻtarilishni asta-sekin yigʻadi. Gid oʻzgarishlar koʻrinadigan, lekin har bir toʻxtash bir xil suratga aylanmaydigan pauzalarni tanlay oladi."
          - "type": "quote"
            "quote":
              "en": "The strongest Seven Lakes visit is not the one that reaches the highest point; it is the one that lets the valley change in front of you."
              "ru": "Самый сильный визит к Семи озёрам не тот, что любой ценой доходит до верхней точки, а тот, в котором долина успевает измениться у вас на глазах."
              "uz": "Yetti Koʻlning eng kuchli tashrifi eng yuqori nuqtaga qanday boʻlsa ham yetib borish emas, balki vodiyning koʻz oldingizda oʻzgarishiga vaqt berishdir."
          - "type": "dashTitle"
            "title":
              "en": "Give Marguzor the main pause"
              "ru": "Дайте Маргузору главную паузу"
              "uz": "Marguzorga asosiy pauzani bering"
            "description":
              "en": "Marguzor gives the valley its broadest water frame and village setting. If the route reaches this level, the lake deserves time to be seen properly."
              "ru": "Маргузор даёт самый широкий водный вид и показывает сельскую жизнь долины. Если маршрут дошёл до этого уровня, озеру нужно время, чтобы его действительно увидеть."
              "uz": "Marguzor vodiydagi eng keng suv manzarasi va qishloq muhitini beradi. Yoʻl shu darajaga yetsa, koʻlni chindan koʻrish uchun unga vaqt kerak."
          - "type": "dashTitle"
            "title":
              "en": "Let Hazorchashma stay conditional"
              "ru": "Оставьте Хазорчашму условным продолжением"
              "uz": "Hazorchashma shartli davom boʻlib qolsin"
            "description":
              "en": "Hazorchashma sits higher in the sequence. Continue only when the current road, daylight, vehicle, and group comfort make the upper section sensible."
              "ru": "Хазорчашма стоит выше в последовательности. Продолжать стоит только тогда, когда текущая дорога, световой день, машина и самочувствие группы делают верхний участок разумным."
              "uz": "Hazorchashma ketma-ketlikda yuqoriroqda turadi. Hozirgi yoʻl, kunduzgi vaqt, mashina va guruhning holati yuqori qismni maʼqul qilgandagina davom eting."
          - "type": "alert"
            "title":
              "en": "Traveler takeaway"
              "ru": "Для путешественника"
              "uz": "Sayohatchi uchun"
            "description":
              "en": "Come for the colour sequence, give Marguzor real time, and decide on Hazorchashma with the conditions in front of you."
              "ru": "Ехать стоит ради цветовой последовательности, времени у Маргузора и честного решения на месте, нужна ли Хазорчашма именно в этот визит."
              "uz": "Rang ketma-ketligi, Marguzor yonidagi vaqt va Hazorchashma aynan shu tashrifga kerakmi degan sharoitga qarab halol qaror uchun boring."
        "right":
