    "uz": "Yetti Koʻl | TourLink"
  "metaDescription":
    "en": "Seven Lakes is the lake road that takes the Zeravshan journey above Penjikent toward water, cliffs, and mountain villages. The road climbs through the Shing Valley, where the visit changes from first colour at Mijgon to the wider pause at Marguzor. Hazorchashma belongs in the plan only when current conditions make the upper section sensible."
    "ru": "Семь озёр ведут зеравшанский маршрут над Пенджикентом к воде, скалам и горным сёлам. Дорога поднимается через долину Шинг: от первого цвета Мижгона к широкой паузе у Маргузора. Хазорчашма входит в план только тогда, когда текущие условия делают верхний участок разумным."
    "uz": "Yetti Koʻl Zarafshon yoʻlini Panjikent ustidan suv, qoyalar va togʻ qishloqlari tomon olib chiqadi. Yoʻl Shing vodiysi orqali koʻtariladi: Mijgondagi birinchi rangdan Marguzor yonidagi kengroq pauzagacha. Hazorchashma faqat hozirgi sharoit yuqori qismni maʼqul qilganda rejaga kiradi."
