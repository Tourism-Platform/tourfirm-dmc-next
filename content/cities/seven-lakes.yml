    "title":
      "en": "Penjikent, Iskanderkul, and the Fann road"
      "ru": "Пенджикент, Искандеркуль и дорога Фанских гор"
      "uz": "Panjikent, Iskandarkoʻl va Fan yoʻli"
    "description":
      "en": "Penjikent gives the nearest practical approach to Haftkul. Iskanderkul is another Fann lake route with separate road time, while Dushanbe anchors longer Tajikistan journeys before or after the Zeravshan side."
      "ru": "Пенджикент даёт ближайший практический подход к Хафткулю. Искандеркуль - другой озёрный маршрут Фанских гор со своим временем в дороге, а Душанбе держит более длинные маршруты по Таджикистану до или после Зеравшана."
      "uz": "Panjikent Haftkoʻlga eng yaqin amaliy yondashuvni beradi. Iskandarkoʻl Fan togʻlaridagi boshqa koʻl yoʻli va alohida yoʻl vaqtiga ega; Dushanbe esa Zarafshondan oldin yoki keyin uzunroq Tojikiston safarlarining tayanchidir."
