      "ru": "В Хафткуле семь именных озёр. Для первого визита три опоры помогают читать долину спокойно: Мижгон для первой смены цвета, Маргузор для главного масштаба и сельской жизни, Хазорчашма для вопроса о верхней дороге."
      "uz": "Haftkoʻlda yetti nomli koʻl bor. Birinchi tashrif uchun uch tayanch vodiyni tushunarli qiladi: Mijgon - birinchi rang almashinuvi, Marguzor - asosiy koʻl miqyosi va qishloq muhiti, Hazorchashma - yuqori yoʻl haqidagi savol."
