  "uz": "Ostonadan shimolda Burabay sayohatni birinchi qirgʻoq manzarasidan oldinoq oʻzgartiradi. Ochiq dasht oʻrnini qaragʻay soyasi, koʻl havosi va suv ustidagi granit siluetlar egallaydi. Eng kuchli taassurot uzun qoya nomlari roʻyxati emas; bu qaragʻaylar orasidan ochiladigan suv, koʻl narisidagi bitta aniq belgi va joyning ochilishi uchun yetarli vaqt."
