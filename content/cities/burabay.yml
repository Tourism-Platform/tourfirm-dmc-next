  "metaDescription":
    "en": "North of Astana, Burabay changes the journey before the first lakeshore view. Open steppe gives way to pine shade, lake air, and granite profiles above the water. The strongest memory is not a long list of named rocks; it is water opening between pines, one clear landmark across the lake, and enough time for the place to settle."
    "ru": "К северу от Астаны Бурабай меняет путешествие ещё до первого вида на берег. Открытая степь уступает место сосновой тени, озёрному воздуху и гранитным силуэтам над водой. Самое сильное впечатление здесь - не длинный список скал с названиями, а вода между соснами, один ясный ориентир через озеро и время, чтобы место успело раскрыться."
    "uz": "Ostonadan shimolda Burabay sayohatni birinchi qirgʻoq manzarasidan oldinoq oʻzgartiradi. Ochiq dasht oʻrnini qaragʻay soyasi, koʻl havosi va suv ustidagi granit siluetlar egallaydi. Eng kuchli taassurot uzun qoya nomlari roʻyxati emas; bu qaragʻaylar orasidan ochiladigan suv, koʻl narisidagi bitta aniq belgi va joyning ochilishi uchun yetarli vaqt."
