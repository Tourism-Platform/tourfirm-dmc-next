"seo":
  "metaTitle":
    "en": "Oskemen | TourLink"
    "ru": "Усть-Каменогорск | TourLink"
    "uz": "Oʻskemen | TourLink"
  "metaDescription":
    "en": "Oskemen is where East Kazakhstan changes scale. The Irtysh and Ulba meet inside the city, the airport and rail links bring the route within reach, and beyond the streets the road divides toward Ridder, Katon-Karagay, and longer Altai plans. Read it as an arrival city with a river edge and a clear purpose: rest after the transfer, check the latest road conditions with the guide or driver, then leave for the mountains with fewer assumptions."
    "ru": "В Усть-Каменогорске Восточный Казахстан меняет масштаб. Иртыш и Ульба сходятся внутри города, аэропорт и железная дорога делают маршрут достижимым, а за городскими улицами дорога расходится к Риддеру, Катон-Карагаю и более длинным алтайским планам. Смотрите на него как на город прибытия с речным краем и ясной задачей: отдохнуть после переезда, вместе с гидом или водителем проверить свежую дорожную обстановку и уехать к горам без лишних предположений."
    "uz": "Oʻskemenda Sharqiy Qozogʻiston oʻlchami oʻzgaradi. Irtish va Ulba shahar ichida uchrashadi, aeroport va temir yoʻl yoʻnalishni yaqinlashtiradi, shahar koʻchalaridan keyin esa yoʻl Ridder, Katon-Qaragʻay va uzoqroq Oltay rejalariga ajraladi. Uni daryo chetidagi aniq vazifali kelish shahri sifatida qabul qiling: transferdan keyin dam oling, gid yoki haydovchi bilan soʻnggi yoʻl holatini tekshiring, keyin togʻlarga kamroq taxmin bilan chiqing."
