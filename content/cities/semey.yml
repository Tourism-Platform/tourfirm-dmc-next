  "metaDescription":
    "en": "Semey is more than a short note on the way to the Altai. The Irtysh gives the city its visible line; Abai and Dostoevsky give the visit a literary center; local museums help the route slow without turning painful history into spectacle. Approach Semey as a measured cultural stop: a walk by the river, a small set of museums, and enough restraint for memory to feel thoughtful rather than heavy."
    "ru": "Семей — не короткая сноска на пути к Алтаю. Иртыш даёт городу видимый край, Абай и Достоевский задают литературный центр, а музеи помогают замедлить маршрут без превращения сложной истории в зрелище. Смотрите на Семей как на размеренную культурную остановку: одна прогулка у реки, выбранные музеи и достаточно такта, чтобы память звучала вдумчиво, а не тяжело."
    "uz": "Semey Oltayga borish yo‘lidagi qisqa izoh emas. Irtish shaharga aniq chekka beradi, Abay va Dostoevskiy tashrifga adabiy markaz qo‘shadi, muzeylar esa murakkab tarixni tomoshaga aylantirmasdan yo‘nalishni sekinlashtiradi. Semeyni o‘lchovli madaniy to‘xtash sifatida tuting: bitta daryo sayri, tanlangan muzeylar va xotira og‘ir emas, o‘ychan sezilishi uchun yetarli ehtiyotkorlik."
