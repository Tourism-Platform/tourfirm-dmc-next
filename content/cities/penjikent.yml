          "en": "Seven Lakes, or Haftkul, carries the route above Penjikent into the Shing Valley: colour-changing water, village-road pauses, and a higher climb that depends on road, weather, vehicle, and daylight."
          "ru": "Семь озёр, или Хафткуль, ведут из Пенджикента в долину Шинг: вода меняет цвет, дорога проходит через сёла, а подъём выше зависит от дороги, погоды, машины и светового дня."
          "uz": "Yetti Koʻl, yaʼni Haftkoʻl, Panjikentdan Shing vodiysiga olib boradi: suv rangi oʻzgaradi, yoʻl qishloqlar oralab oʻtadi, yuqoriga chiqish esa yoʻl, ob-havo, mashina va kunduzgi vaqtga bogʻliq."
