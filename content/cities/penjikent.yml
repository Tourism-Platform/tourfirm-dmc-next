              "uz": "Qadimiy Panjikent va Sarazmni tashrif boshiga yaqin qo‘yish ma’qul. Ular yo‘l suv, qishloqlar va dovonlarga burilishidan oldin vodiyni tushuntiradi."
          - "type": "quote"
            "quote":
              "en": "Penjikent works best when old Zeravshan history has time before the first mountain road."
              "ru": "Пенджикент лучше раскрывается, когда старая история Зеравшана успевает прозвучать до первой горной дороги."
              "uz": "Panjikentda eski Zarafshon tarixi birinchi tog‘ yo‘lidan oldin eshitilsa, shahar yaxshiroq ochiladi."
          - "type": "dashTitle"
            "title":
              "en": "Keep the town in the visit"
              "ru": "Оставьте город в маршруте"
              "uz": "Shaharni tashrif ichida qoldiring"
            "description":
              "en": "The Rudaki Museum and market streets stop the city from becoming only ruins and dates. They bring local memory, daily movement, and a human scale into the route."
              "ru": "Музей Рудаки и рыночные улицы не дают Пенджикенту стать только руинами и датами. Они добавляют местную память, движение города и человеческий масштаб."
              "uz": "Rudakiy muzeyi va bozor ko‘chalari Panjikentni faqat xarobalar va sanalarga aylantirmaydi. Ular mahalliy xotira, shahar harakati va insoniy o‘lcham qo‘shadi."
          - "type": "dashTitle"
            "title":
              "en": "Choose the next road deliberately"
              "ru": "Выбирайте следующую дорогу осознанно"
              "uz": "Keyingi yo‘lni ongli tanlang"
            "description":
              "en": "Seven Lakes and Iskanderkul pull the route in different directions. Treat one as the next clear move unless there is enough time and current road information for more."
              "ru": "Семь озёр и Искандеркуль ведут маршрут в разные стороны. Лучше выбрать одно ясное продолжение, если нет достаточно времени и свежей информации о дороге."
              "uz": "Yetti ko‘l va Iskandarko‘l yo‘nalishni ikki tomonga tortadi. Vaqt va yo‘l haqidagi yangi ma’lumot yetarli bo‘lmasa, bitta aniq davomni tanlash yaxshiroq."
          - "type": "alert"
            "title":
              "en": "Traveler takeaway"
              "ru": "Для путешественника"
              "uz": "Sayohatchi uchun"
            "description":
              "en": "Let Penjikent clarify the valley first, then continue with one mountain direction that fits the season and pace."
              "ru": "Сначала Пенджикент помогает понять долину, затем маршрут продолжается в одном горном направлении, которое подходит сезону и темпу."
              "uz": "Avval Panjikent vodiy ma’nosini ochadi, keyin yo‘l mavsum va sur’atga mos bitta tog‘ tomonga davom etadi."
        "right":
          - "type": "miniTable"
            "title":
              "en": "Before you go"
              "ru": "Перед поездкой"
              "uz": "Borishdan oldin"
            "icon": "Circle"
            "rows":
              - "icon": "MapPin"
                "title":
                  "en": "At a glance Stay"
                  "ru": "Коротко Ночёвка"
                  "uz": "Qisqacha Qolish"
                "description":
                  "en": "One night is enough for Ancient Penjikent, Sarazm, the museum, and a town walk; a second night helps if the route continues toward Seven Lakes or Iskanderkul."
                  "ru": "Одной ночи достаточно для древнего Пенджикента, Саразма, музея и прогулки по городу; вторая помогает, если маршрут идёт к Семи озёрам или Искандеркулю."
                  "uz": "Bir kecha qadimiy Panjikent, Sarazm, muzey va shahar sayri uchun yetadi; yo‘l Yetti ko‘l yoki Iskandarko‘l tomonga davom etsa, ikkinchi kecha yordam beradi."
              - "icon": "Landmark"
                "title":
                  "en": "Main reason"
                  "ru": "Главная причина"
                  "uz": "Asosiy sabab"
                "description":
                  "en": "Ancient Penjikent and Sarazm give the town a deeper role than a road stop between Samarkand and the mountains."
                  "ru": "Древний Пенджикент и Саразм дают городу более глубокую роль, чем дорожная остановка между Самаркандом и горами."
                  "uz": "Qadimiy Panjikent va Sarazm shaharga Samarqand bilan tog‘lar orasidagi yo‘l to‘xtashidan chuqurroq ma’no beradi."
              - "icon": "Sun"
                "title":
                  "en": "Route role"
                  "ru": "Роль в маршруте"
                  "uz": "Yoʻldagi roli"
                "description":
                  "en": "Penjikent links the Zeravshan Valley with Tajikistan's first mountain-road choices."
                  "ru": "Пенджикент связывает Зеравшанскую долину с первыми горными дорогами Таджикистана."
                  "uz": "Panjikent Zarafshon vodiysini Tojikistonning ilk tog‘ yo‘llari bilan bog‘laydi."
              - "icon": "Route"
                "title":
                  "en": "Season and pace"
                  "ru": "Сезон и темп"
                  "uz": "Mavsum va surʼat"
                "description":
                  "en": "Valley visits are simpler than lake roads; weather, daylight, and road condition decide how far to continue."
                  "ru": "Долинные места проще озёрных дорог; погода, световой день и состояние дороги решают, как далеко продолжать."
                  "uz": "Vodiy tashriflari ko‘l yo‘llaridan osonroq; ob-havo, kunduzgi vaqt va yo‘l holati qanchalik uzoq davom etishni belgilaydi."
  - "blockType": "regular"
    "eyebrow":
      "en": "Where to continue"
      "ru": "Куда продолжить"
      "uz": "Qayerga davom etish"
    "title":
      "en": "Visible onward choices from Penjikent"
      "ru": "Видимые направления после Пенджикента"
      "uz": "Panjikentdan keyingi ko‘rinadigan yo‘llar"
    "description":
      "en": "After Penjikent, the journey can return to Dushanbe for museums and valley roads, or continue much farther toward Khorog and the Pamirs."
      "ru": "После Пенджикента путь может вернуться к Душанбе с музеями и долинными дорогами или уйти намного дальше к Хорогу и Памиру."
      "uz": "Panjikentdan keyin yo‘l Dushanbening muzeylari va vodiy yo‘llariga qaytishi yoki ancha uzoqroqqa, Xorugʻ va Pomir tomonga davom etishi mumkin."
