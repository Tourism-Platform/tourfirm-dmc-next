        "description":
          "en": "Iskanderkul is the lake-area pause in the Fann Mountains: turquoise water, red-grey slopes, a waterfall side walk, and road checks before the route climbs farther."
          "ru": "Искандеркуль — озёрная остановка в Фанских горах: бирюзовая вода, красно-серые склоны, короткий выход к водопаду и проверка дороги перед дальнейшим подъёмом."
          "uz": "Iskandarkoʻl Fan togʻlaridagi koʻl pauzasidir: feruza suv, qizil-kulrang yonbagʻirlar, sharsharaga qisqa chiqish va yoʻl yuqoriga davom etishidan oldingi tekshiruvlar."
