  "metaDescription":
    "en": "Penjikent sits where the Zeravshan Valley changes from border road to mountain approach. Ancient walls above town, Sarazm nearby, a small museum, and a working market make the city a useful start before the Fann lake roads."
    "ru": "Пенджикент стоит там, где Зеравшанская долина меняет пограничную дорогу на подход к горам. Древние стены над городом, Саразм рядом, небольшой музей и работающий рынок делают город важным началом перед дорогами к озёрам."
    "uz": "Panjikent Zarafshon vodiysi chegara yo‘lidan tog‘larga kirishga o‘tadigan joyda turadi. Shahar ustidagi qadimiy devorlar, yaqin Sarazm, kichik muzey va ishlayotgan bozor uni ko‘l yo‘llaridan oldingi muhim boshlanishga aylantiradi."
