      "ru": "Встройте остановку «Хива» в программу (Узбекистан)"
      "uz": "Xiva bekatini Oʻzbekiston dasturingizga qo‘shing"
    "description":
      "en": "We help agencies set a realistic pace and choose the right next move — without rushing the places that matter."
      "ru": "Помогаем агентствам выстроить реалистичный темп и выбрать следующий шаг — без спешки там, где важны места."
      "uz": "Agentliklarga real sur’at va keyingi qadamni tanlashda yordam beramiz — muhim joylarni shoshiltirmasdan."
    "actions":
