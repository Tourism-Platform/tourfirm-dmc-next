        "title":
          "en": "Khorezm food and tea"
          "ru": "Хорезмская еда и чай"
          "uz": "Xorazm taomi va choy"
        "description":
          "en": "Tea, shivit oshi, and an unhurried meal matter as much as the monuments here; without that pause, the day turns too quickly into a museum route."
          "ru": "Чай, шивит оши и спокойная еда нужны Хиве так же, как памятники: без этой паузы день быстро становится слишком музейным."
          "uz": "Choy, shivit oshi va shoshilmasdan qilingan ovqat Xivada yodgorliklar kabi muhim; bu pauzasiz kun juda tez muzey yo‘liga aylanadi."
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan/character/khiva/khiva-character-5.webp"
        "badge":
          "en": "Culture"
          "ru": "Культура"
          "uz": "Madaniyat"
        "title":
          "en": "Palaces and museum rooms"
          "ru": "Дворцы и музеи"
          "uz": "Saroylar va muzeylar"
        "description":
          "en": "Palace courtyards, mausoleums, and museum rooms need their own time; this is where Khiva moves from the street into court, family, and museum memory."
          "ru": "Дворцовые дворы, мавзолеи и музейные комнаты требуют отдельного времени: здесь Хива переходит от улицы к придворной и семейной памяти."
          "uz": "Saroy hovlilari, maqbaralar va muzey xonalari alohida vaqt talab qiladi; shu yerda Xiva ko‘chadan saroy, oila va muzey xotirasiga o‘tadi."
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan/character/khiva/khiva-character-6.webp"
        "badge":
          "en": "Special interest"
          "ru": "Специнтерес"
          "uz": "Maxsus qiziqish"
        "title":
          "en": "The fortress-road choice"
          "ru": "Выбор крепостной дороги"
          "uz": "Qalʼalar yo‘li tanlovi"
        "description":
          "en": "After the walled city, the route either returns through Urgench or continues toward Nurullabay, Dishan-Kala, desert fortresses, Nukus, and the Aral Sea."
          "ru": "После города за стенами маршрут либо возвращается через Ургенч, либо уходит к Нуруллабаю, Дишан-Кале, пустынным крепостям, Нукусу и Аралу."
          "uz": "Devorli shahardan keyin yo‘l Urganch orqali qaytishi yoki Nurullaboy, Dishan Qalʼa, cho‘l qalʼalari, Nukus va Orol tomonga davom etishi mumkin."
  - "blockType": "regular"
    "eyebrow":
      "en": "Before you go"
      "ru": "Перед поездкой"
      "uz": "Yo‘lga chiqishdan oldin"
    "title":
      "en": "How not to compress Khiva into one circuit"
      "ru": "Как не сжать Хиву в один круг"
      "uz": "Xivani bitta aylanishga siqmaslik"
    "description":
      "en": "Itchan Kala is compact, so it is easy to move too quickly. Separate the day before it starts: first walk, interiors, food, craft, and only then the choice of whether to leave the walls."
      "ru": "Ичан-Кала компактна, поэтому её легко пройти слишком быстро. Лучше заранее разделить день: первая прогулка, интерьеры, еда, ремесло и только потом решение о выезде за стены."
      "uz": "Ichan Qalʼa ixcham, shuning uchun uni juda tez aylanib chiqish oson. Kunni oldindan bo‘ling: birinchi yurish, interyerlar, ovqat, hunar va shundan keyingina devor tashqarisiga chiqish qarori."
    "rows":
      - "ratio": "2:1"
        "left":
          - "type": "dashTitle"
            "title":
              "en": "Return inside the walls"
              "ru": "Вернуться внутрь стен"
              "uz": "Devorlar ichiga qaytish"
            "description":
              "en": "Khiva reads better when you can come back into Itchan Kala after a rest or a meal. One fast circuit makes the city feel too flat."
              "ru": "Хива лучше воспринимается, когда в Ичан-Калу возвращаются после отдыха или еды. Один быстрый круг делает город слишком плоским."
              "uz": "Dam yoki ovqatdan keyin Ichan Qalʼaga qayta kirish mumkin bo‘lsa, Xiva yaxshiroq o‘qiladi. Bitta tez aylanish shaharni juda tekis ko‘rsatadi."
          - "type": "quote"
            "quote":
              "en": "Khiva is small on the map, but the day inside the walls fills quickly."
              "ru": "Хива маленькая на карте, но день внутри стен быстро становится плотным."
              "uz": "Xiva xaritada kichik, lekin devorlar ichidagi kun tez to‘lib ketadi."
          - "type": "dashTitle"
            "title":
              "en": "Give palaces and museums their own time"
              "ru": "Дать время дворцам и музеям"
              "uz": "Saroy va muzeylarga alohida vaqt berish"
            "description":
              "en": "Kunya-Ark, Tash Khauli, Islam Khoja, Pahlavon Mahmud, Muhammad Amin Khan Madrasah, and the museum-reserve should not be the leftover part of the walk."
              "ru": "Куня-Арк, Таш-Хаули, Ислам-Ходжа, Пахлаван-Махмуд, медресе Мухаммад Амин-хана и музей-заповедник не должны быть остатком после прогулки."
              "uz": "Kunya Ark, Tosh Hovli, Islom Xo‘ja, Pahlavon Mahmud, Muhammad Aminxon madrasasi va muzey-qo‘riqxona yurishdan qolgan vaqt bo‘lib qolmasligi kerak."
          - "type": "dashTitle"
            "title":
              "en": "Keep the outing separate"
              "ru": "Вынести выезд за город отдельно"
              "uz": "Shahar tashqarisidagi chiqishni alohida tutish"
            "description":
              "en": "Nurullabay, Dishan-Kala, and the desert fortresses work better as a separate continuation of Khiva, not an add-on to an already full day inside the walls."
              "ru": "Нуруллабай, Дишан-Кала и пустынные крепости лучше смотрятся как отдельное продолжение Хивы, а не как добавка к уже полному дню."
              "uz": "Nurullaboy, Dishan Qalʼa va cho‘l qalʼalari allaqachon to‘lgan kunga qo‘shimcha emas, Xivaning alohida davomi sifatida yaxshiroq ko‘rinadi."
          - "type": "alert"
            "title":
              "en": "For the traveler"
              "ru": "Для путешественника"
              "uz": "Sayohatchi uchun"
            "description":
              "en": "Plan Khiva as a city you return to during the day: first the walls and main landmarks, then food, craft details, interiors, and only after that the road beyond the city."
              "ru": "Планируйте Хиву как город, в который возвращаются в течение дня: сначала стены и главные ориентиры, затем еда, ремесленные детали, интерьеры и только потом дорога дальше."
              "uz": "Xivani kun davomida qaytiladigan shahar sifatida rejalang: avval devorlar va asosiy orientirlar, keyin ovqat, hunar detallari, interyerlar va shundan keyingina keyingi yo‘l."
        "right":
          - "type": "miniTable"
            "title":
              "en": "Before you go"
              "ru": "Перед поездкой"
              "uz": "Yo‘lga chiqishdan oldin"
            "icon": "Circle"
            "rows":
              - "icon": "MapPin"
                "title":
                  "en": "Before you go Where to stay"
                  "ru": "Перед поездкой Где остановиться"
                  "uz": "Yo‘l oldidan Qayerda qolish"
                "description":
                  "en": "Inside Itchan Kala or near the walls, so morning, daytime, and evening returns do not need extra transfers."
                  "ru": "Внутри Ичан-Калы или рядом со стенами, чтобы утром, днём и вечером можно было возвращаться без лишних переездов."
                  "uz": "Ichan Qalʼa ichida yoki devorlar yonida; ertalab, kunduzi va kechqurun ortiqcha transfersiz qaytish oson bo‘ladi."
              - "icon": "Landmark"
                "title":
                  "en": "First circuit"
                  "ru": "Первый круг"
                  "uz": "Birinchi aylanish"
                "description":
                  "en": "Gates, Kalta Minor, Juma Mosque, shopfront lanes, and carved doors."
                  "ru": "Ворота, Кальта-Минор, Джума-мечеть, улицы с лавками и резные двери."
                  "uz": "Darvozalar, Kalta Minor, Juma masjidi, do‘konli ko‘chalar va o‘yma eshiklar."
              - "icon": "Sun"
                "title":
                  "en": "Season and pace"
                  "ru": "Сезон и темп"
                  "uz": "Mavsum va temp"
                "description":
                  "en": "Spring and autumn are easiest; in summer, start early, keep the hottest hours for rest or interiors, and return later in the day."
                  "ru": "Весной и осенью проще; летом лучше начинать рано, самые жаркие часы оставлять для отдыха или интерьеров и возвращаться позже."
                  "uz": "Bahor va kuz osonroq; yozda erta boshlash, eng issiq soatlarni dam yoki ichki joylarga qoldirish va kunning keyinroq qismida qaytish maʼqul."
              - "icon": "Route"
                "title":
                  "en": "What comes next"
                  "ru": "Дальше по маршруту"
                  "uz": "Keyingi yo‘l"
                "description":
                  "en": "Return through Urgench, or continue toward Nurullabay, Dishan-Kala, the fortresses, Nukus, and the Aral Sea."
                  "ru": "Возврат через Ургенч или продолжение к Нуруллабаю, Дишан-Кале, крепостям, Нукусу и Аралу."
                  "uz": "Urganch orqali qaytish yoki Nurullaboy, Dishan Qalʼa, qalʼalar, Nukus va Orol tomonga davom etish."
  - "blockType": "regular"
    "eyebrow":
      "en": "Where next"
      "ru": "Куда дальше"
      "uz": "Keyin qayerga"
    "title":
      "en": "After Khiva: back to Bukhara or farther through Khorezm"
      "ru": "После Хивы: назад к Бухаре или дальше по Хорезму"
      "uz": "Xivadan keyin: Buxoroga qaytish yoki Xorazm bo‘ylab davom"
    "description":
      "en": "Most routes return through Urgench toward Bukhara and Samarkand. Longer journeys can use Khiva as the start of a road toward desert fortresses, Nukus, and the Aral Sea."
      "ru": "Чаще маршрут возвращается через Ургенч к Бухаре и Самарканду. Если поездка длиннее, Хива может стать началом дороги к пустынным крепостям, Нукусу и Аралу."
      "uz": "Yo‘l ko‘pincha Urganch orqali Buxoro va Samarqand tomonga qaytadi. Uzunroq safarda Xiva cho‘l qalʼalari, Nukus va Orol tomonga boshlanadigan yo‘lga aylanishi mumkin."
    "gridClassName": "sm:grid-cols-2 lg:grid-cols-2"
    "cards":
      - "type": "routeIdea"
        "image": "assets/images/destinations/uzbekistan/next/khiva-next-bukhara.webp"
        "badge":
          "en": "City"
          "ru": "Город"
          "uz": "Shahar"
        "title":
          "en": "Bukhara"
          "ru": "Бухара"
          "uz": "Buxoro"
        "description":
          "en": "Bukhara comes together on foot: Poi-Kalyan, the Ark, Lyabi-Hauz, trading domes, courtyards, craft lanes, and nearby continuations."
          "ru": "Бухара лучше раскрывается пешком: Пои-Калян, Арк, Ляби-Хауз, торговые купола, дворы, ремесленные улицы и близкие продолжения."
          "uz": "Buxoro piyoda yaxshiroq ochiladi: Poyi Kalon, Ark, Labi Hovuz, savdo gumbazlari, hovlilar, hunarmand ko‘chalari va yaqin yoʻnalishlar."
        "ctaHref": "/destinations/uzbekistan/bukhara-region/bukhara"
        "ctaLabel":
          "en": "View"
          "ru": "Смотреть"
          "uz": "Ko'rish"
      - "type": "routeIdea"
        "image": "assets/images/destinations/uzbekistan/next/khiva-next-samarkand.webp"
        "badge":
          "en": "City"
          "ru": "Город"
          "uz": "Shahar"
        "title":
          "en": "Samarkand"
          "ru": "Самарканд"
          "uz": "Samarqand"
        "description":
          "en": "Samarkand brings the route to monumental scale: Registan, Shah-i-Zinda, Bibi-Khanym, Gur-e-Amir, Siab Bazaar, Afrosiab, and Ulugh Beg Observatory."
          "ru": "Самарканд даёт маршруту монументальный масштаб: Регистан, Шахи-Зинда, Биби-Ханым, Гур-Эмир, Сиабский базар, Афрасиаб и обсерватория Улугбека."
          "uz": "Samarqand yoʻnalishga monumental miqyos beradi: Registon, Shohi Zinda, Bibi Xonim, Goʻri Amir, Siyob bozori, Afrosiyob va Ulugʻbek rasadxonasi."
        "ctaHref": "/destinations/uzbekistan/samarkand-region/samarkand"
        "ctaLabel":
          "en": "View"
          "ru": "Смотреть"
          "uz": "Ko'rish"


  - "blockType": "regular"
    "eyebrow":
      "en": "City in detail"
      "ru": "Город в деталях"
      "uz": "Shahar batafsil"
    "title":
      "en": "How to place Khiva in the day plan"
      "ru": "Как поставить Хива в план дня"
      "uz": "Xivani kun rejasiga qanday joylashtirish"
    "description":
      "en": "Walking time, overnight location, and when day trips make sense."
      "ru": "Пешее время, место ночёвки и когда выезды имеют смысл."
      "uz": "Piyoda vaqt, tunash joyi va chiqishlar qachon o‘rinli."
    "gridClassName": "grid-cols-1"
    "cards":
      - "type": "destinationInsight"
        "icon": "CircleQuestionMark"
        "title":
          "en": "How long should groups stay in Khiva?"
          "ru": "Сколько времени группам стоит проводить в Хива?"
          "uz": "Xivada guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "2–3 nights is usually enough when the old core or main anchors get a full walking window. City tone: “A walled city at the western edge of the route”."
          "ru": "Обычно хватает 2–3 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Город за стенами на западном краю маршрута»."
          "uz": "Odatda 2–3 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Yo‘lning g‘arbiy chekkasidagi devorli shahar»."
      - "type": "destinationInsight"
        "icon": "Landmark"
        "title":
          "en": "Should Khiva be a walkable core or a base for day trips?"
          "ru": "Хива — это пешеходное ядро или база для выездов?"
          "uz": "Xiva piyoda yadroimi yoki chiqishlar uchun baza?"
        "description":
          "en": "Start with the compact city walk first. Day trips only after the centre has settled — otherwise the stop feels like a transfer with monuments attached."
          "ru": "Сначала компактная городская прогулка. Выезды — только после того, как центр «сел»; иначе остановка ощущается как трансфер с памятниками."
          "uz": "Avval ixcham shahar sayri. Chiqishlar — markaz joylashgandan keyin; aks holda bekat yodgorlikli transferdek tuyuladi."
      - "type": "destinationInsight"
        "icon": "Hotel"
        "title":
          "en": "Where should overnight be relative to Khiva's centre?"
          "ru": "Где лучше ночевать относительно центра Хива?"
          "uz": "Xiva markaziga nisbatan qayerda tunash yaxshi?"
        "description":
          "en": "Stay close enough for an evening return on foot or a short transfer. That keeps tea, dinner, and a second pass through the lanes easy without burning the next morning."
          "ru": "Живите достаточно близко, чтобы вечером вернуться пешком или коротким трансфером. Так чай, ужин и второй проход по улицам остаются лёгкими и не сжигают следующее утро."
          "uz": "Kechqurun piyoda yoki qisqa transfer bilan qaytishga yaqin turing. Choy, kechki ovqat va ko‘chalardan ikkinchi o‘tish oson qoladi, erta tongni yoqib yubormaydi."
  - "blockType": "cta"
    "image": "assets/images/destinations/uzbekistan/regions/khorezm-region/cities/khiva.webp"
    "eyebrow":
