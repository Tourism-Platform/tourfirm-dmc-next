  "metaDescription":
    "en": "Khiva works best when you return inside the walls during the day: first the gates and Kalta Minor, then Juma Mosque, palace courtyards, carved doors, workshops, and a meal in the old town before the route decides whether to stay in the city or continue across Khorezm."
    "ru": "Хива лучше раскрывается не одним кругом, а возвращением внутрь стен: сначала ворота и Кальта-Минор, затем Джума-мечеть, дворцовые дворы, резные двери, мастерские и еда в старом городе до решения, останется ли маршрут в Хиве или уйдёт дальше по Хорезму."
    "uz": "Xiva bir aylanishdan ko‘ra, kun davomida devorlar ichiga qaytilganda yaxshiroq ochiladi: avval darvozalar va Kalta Minor, keyin Juma masjidi, saroy hovlilari, o‘yma eshiklar, ustaxonalar va eski shahardagi ovqat; shundan so‘ng yo‘l Xivada qoladimi yoki Xorazm bo‘ylab davom etadimi, aniqroq bo‘ladi."
