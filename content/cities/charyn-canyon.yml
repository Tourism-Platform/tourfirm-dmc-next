  "metaDescription":
    "en": "Charyn turns the Almaty nature route dry, open, and wind-shaped. The red walls of the Valley of Castles are the strongest draw, but the area matters just as much for route decisions: when to walk, how to manage heat and daylight, and whether the road returns to Almaty or continues toward Saty."
    "ru": "Чарын делает природный маршрут из Алматы сухим, открытым и выветренным. Красные стены Долины замков — главная причина ехать сюда, но район важен и для решений по маршруту: когда идти, как учесть жару и световой день, возвращаться ли в Алматы или продолжать к Саты."
    "uz": "Charyn Almatydan chiqadigan tabiat yo‘nalishini quruq, ochiq va shamol shakllantirgan manzaraga olib chiqadi. Qal’alar vodiysining qizil devorlari bu yerga kelishning eng kuchli sababi, lekin hudud yo‘l qarorlari uchun ham muhim: qachon yurish, issiq va kunduzgi yorug‘likni qanday hisoblash, Almatyga qaytish yoki Saty tomon davom etishni qanday tanlash."
