          "uz": "Olmaota Qozogʻistonni togʻoldi kayfiyatida ochadi: yashil koʻchalar, bozor vaqti, Koʻk-Tobe manzarasi, Medeu havosi, Shimbuloq vaqt tanlovi hamda kanyon, ko‘l, qoya rasmlari va dasht yoʻllari."
