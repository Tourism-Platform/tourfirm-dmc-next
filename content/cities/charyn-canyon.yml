      "ru": "Алматы остаётся практичным городским ориентиром для рейсов, отелей и длинной дороги на восток. Саты может идти после Чарына как ночёвка перед Кольсаем и Каинды, но только когда световой день, погода и дорожное время делают переход спокойным."
      "uz": "Almaty parvozlar, mehmonxonalar va sharqqa uzun yo‘l uchun amaliy shahar tayanchi. Saty Charyndan keyin Kolsai va Kaindy oldidan tunash qadami bo‘lishi mumkin, lekin faqat kunduzgi yorug‘lik, ob-havo va yo‘l vaqti bu harakatni sokin qilsa."
