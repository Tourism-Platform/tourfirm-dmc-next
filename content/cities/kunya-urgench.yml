"excerpt":
  "en": "Kunya-Urgench makes old Khorezm feel spacious. The UNESCO landscape, Kutlug Timur Minaret, and Turabek Khanum Mausoleum sit apart, so the visit depends on open ground, heat, brick, sky, and the quiet between monuments. A guide helps turn that distance into the story of a former capital rather than a scatter of ruins."
  "ru": "В Куня-Ургенче старый Хорезм ощущается через пространство. Объект ЮНЕСКО, минарет Кутлуг-Тимура и мавзолей Тюрабек-ханым стоят не вплотную, поэтому в визите важны открытый воздух, жара, кирпич, небо и тишина между памятниками. Гид помогает увидеть в этих расстояниях бывшую столицу, а не набор разрозненных руин."
  "uz": "Ko‘hna Urganchda eski Xorazm kenglik orqali seziladi. UNESCO hududi, Qutlug‘ Temur minorasi va To‘rabek Xonim maqbarasi bir joyga zich to‘planmagan; shu bois tashrifda ochiq makon, issiq, g‘isht, osmon va yodgorliklar orasidagi sukunat muhim. Gid bu masofalarni alohida xarobalar emas, sobiq poytaxt hikoyasi sifatida tushuntiradi."
