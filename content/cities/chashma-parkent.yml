  "metaDescription":
    "en": "Chashma sits on the Parkent side of Tashkent Region, close enough to Kumushkon for the two villages to make sense together. The name points toward water, but the visit should stay modest: a clear arrival point, a short hello or tea when it is arranged for the date, and enough time to understand the village without turning it into a large attraction."
    "ru": "Чашма находится на паркентской стороне Ташкентской области, достаточно близко к Кумушкану, чтобы два села воспринимались вместе. Название ведёт к родниковому смыслу, а визит лучше держать скромным: понятная точка прибытия, короткая встреча или чай при договорённости и время увидеть село без превращения его в крупную достопримечательность."
    "uz": "Chashma Toshkent viloyatining Parkent tomonida, Kumushkonga yaqin joylashgan; ikki qishloqni bir yo‘nalishda ko‘rish mumkin. Nomi suvga ishora qiladi, tashrif esa kamtar qolishi kerak: aniq kelish joyi, kelishilgan bo‘lsa qisqa uchrashuv yoki choy, qishloqni katta obyektga aylantirmay tushunish uchun vaqt."
