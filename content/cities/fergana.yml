  "metaDescription":
    "en": "Fergana is not the valley's palace, silk, or ceramics headline. It helps in another way: as an arrival city, an overnight stop, a museum introduction, and a measured place to choose the next road through the Valley."
    "ru": "Фергана не главный дворцовый, шёлковый или керамический образ долины. Она помогает иначе: как город прибытия или ночёвки, музейное введение и спокойное место, где становится понятнее следующая дорога по долине."
    "uz": "Fargʻona vodiyning saroy, ipak yoki kulolchilik boʻyicha bosh manzili emas. U boshqacha yordam beradi: kelish yoki tunash shahri, muzey orqali kirish nuqtasi va vodiy boʻylab keyingi yoʻlni tanlash uchun xotirjam joy sifatida."
