          "en": "one focused city day plus overnight is usually enough when the old core or main anchors get a full walking window. City tone: “A practical city stop in the Fergana Valley”."
          "ru": "Обычно хватает один насыщенный городской день плюс ночёвка, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Практичная городская остановка в Ферганской долине»."
          "uz": "Odatda bitta zich shahar kuni va tunash yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Fargʻona vodiysidagi amaliy shahar toʻxtami»."
