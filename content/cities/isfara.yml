    "uz": "Isfarani shaharning o‘zidan boshlang: bozor yo‘laklari, eski mahallalar va Xo‘jand hamda Istaravshandan keyingi Sharqiy Sug‘d ohangi. Abdullo Xon madrasasi, Chorku, ziyorat odobi va bog‘ yo‘llari tashrifni chuqurlashtiradi, lekin faqat mahalliy jamoa kirish, vaqt va qabulni tasdiqlaganidan keyin."
