    "en": "Start with Isfara itself: market lanes, older neighborhoods, and the first sense of eastern Sughd after Khujand and Istaravshan. Abdullo Khan Madrasa, Chorku context, shrine etiquette, and orchard roads can deepen the visit, but only after our local team confirms access, timing, and welcome."
