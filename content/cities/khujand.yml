                  "ru": "Ближе к поездке проверьте доступ в музей, этикет священного места, рыночный ритм, транспорт и приграничные дороги."
                  "uz": "Muzey kirishi, muqaddas joy odobi, bozor ritmi, transport va chegara tomondagi yoʻllarni safarga yaqin tekshiring."
              - "icon": "MapPin"
                "title":
