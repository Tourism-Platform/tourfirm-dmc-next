                  "ru": "Истаравшан, Исфара, Кайраккум, Пенджикент, Семь озёр или Фанские горы подходят только тогда, когда на каждую дорогу есть достаточно времени."
                  "uz": "Istaravshan, Isfara, Qayroqqum, Panjikent, Yetti Koʻl yoki Fan togʻlari har bir yoʻlga yetarli vaqt berilganda mos keladi."
  - "blockType": "regular"
    "eyebrow":
      "en": "Nearby"
      "ru": "Рядом"
      "uz": "Yaqin joylar"
    "title":
      "en": "Dushanbe, Penjikent, Seven Lakes, and Iskanderkul"
      "ru": "Душанбе, Пенджикент, Семь озёр и Искандеркуль"
      "uz": "Dushanbe, Panjikent, Yetti Koʻl va Iskandarkoʻl"
    "description":
      "en": "Dushanbe frames longer Tajikistan arrivals. Penjikent, Seven Lakes, and Iskanderkul point toward the Zeravshan and Fann side; Istaravshan and Isfara stay as northern extensions for a separately checked plan."
      "ru": "Душанбе задаёт рамку для длинных путешествий по Таджикистану. Пенджикент, Семь озёр и Искандеркуль ведут к Зеравшанской и Фанской стороне; Истаравшан и Исфара остаются северными вариантами для отдельной проверки маршрута."
      "uz": "Dushanbe Tojikiston boʻylab uzunroq safarlar uchun ramka beradi. Panjikent, Yetti Koʻl va Iskandarkoʻl Zarafshon va Fan tomoniga olib boradi; Istaravshan va Isfara esa alohida tekshiriladigan shimoliy variantlar boʻlib qoladi."
