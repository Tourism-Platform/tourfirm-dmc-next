        "icon": "CircleQuestionMark"
        "title":
          "en": "How long should groups stay in Khujand?"
          "ru": "Сколько времени группам стоит проводить в Худжанд?"
          "uz": "Xoʻjandda guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "1–2 nights is usually enough when the old core or main anchors get a full walking window. City tone: “Syr Darya trading city at Tajikistan's northern gate”."
          "ru": "Обычно хватает 1–2 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Торговый город на Сырдарье у северных ворот Таджикистана»."
          "uz": "Odatda 1–2 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Sirdaryo boʻyidagi Shimoliy Tojikiston savdo shahri»."
      - "type": "destinationInsight"
        "icon": "Footprints"
        "title":
          "en": "Should Khujand be a walkable core or a base for day trips?"
          "ru": "Худжанд — это пешеходное ядро или база для выездов?"
          "uz": "Xoʻjand piyoda yadroimi yoki chiqishlar uchun baza?"
        "description":
          "en": "Start with the compact city walk first. Day trips only after the centre has settled — otherwise the stop feels like a transfer with monuments attached."
          "ru": "Сначала компактная городская прогулка. Выезды — только после того, как центр «сел»; иначе остановка ощущается как трансфер с памятниками."
          "uz": "Avval ixcham shahar sayri. Chiqishlar — markaz joylashgandan keyin; aks holda bekat yodgorlikli transferdek tuyuladi."
      - "type": "destinationInsight"
        "icon": "Clock"
        "title":
