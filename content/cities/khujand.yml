    "ru": "Худжанд | TourLink"
    "uz": "Xoʻjand | TourLink"
  "metaDescription":
    "en": "On the Syr Darya, Khujand still feels like a trading city before it feels like a checklist of sights. The first visit moves from Panjshanbe Bazaar to the Sheikh Muslihiddin complex, then to the fortress and historical museum, where Sogdian memory and the Temurmalik story help the city make sense."
    "ru": "На Сырдарье Худжанд сначала ощущается как торговый город, а не как список достопримечательностей. Первый маршрут ведёт от базара Панджшанбе к комплексу шейха Муслихиддина, затем к крепости и историческому музею, где согдийская память и история Темурмалика помогают понять город."
    "uz": "Sirdaryo boʻyida Xoʻjand avval savdo shahri sifatida seziladi, diqqatga sazovor joylar roʻyxati sifatida emas. Birinchi tashrif Panjshanbe bozoridan Shayx Muslihiddin majmuasiga, keyin qalʼa va tarixiy muzeyga olib boradi; u yerda Sugʻd xotirasi va Temurmalik hikoyasi shaharni tushunarli qiladi."
