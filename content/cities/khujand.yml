              "en": "Sheikh Muslihiddin is close enough to keep the central walk compact, but the mood changes quickly. Dress and voice matter because the mosque, mausoleum, and madrasa complex is a sacred place, not only an architectural stop."
              "ru": "Шейх Муслихиддин расположен достаточно близко, чтобы центральная прогулка оставалась компактной, но настроение быстро меняется. Одежда и голос важны, потому что комплекс с мечетью, мавзолеем и медресе - священное место, а не только архитектурная остановка."
              "uz": "Shayx Muslihiddin markaziy yurish ixcham qoladigan darajada yaqin, lekin kayfiyat tez oʻzgaradi. Kiyim va ovoz muhim, chunki masjid, maqbara va madrasa majmuasi faqat meʼmoriy toʻxtash emas, muqaddas joy."
          - "type": "dashTitle"
            "title":
              "en": "Use the fortress for memory"
              "ru": "Используйте крепость как память города"
              "uz": "Qalʼani shahar xotirasi sifatida koʻring"
            "description":
              "en": "Khujand Fortress and the historical museum bring the visit back to older Sughd: fortress walls, museum rooms, Sogdian memory, and the Temurmalik story before the road continues."
              "ru": "Худжандская крепость и исторический музей возвращают посещение к старому Согду: крепостные стены, музейные залы, согдийская память и история Темурмалика перед продолжением дороги."
              "uz": "Xoʻjand qalʼasi va tarixiy muzeyi tashrifni eski Sugʻdga qaytaradi: qalʼa devorlari, muzey xonalari, Sugʻd maʼnosi va keyingi yoʻldan oldin Temurmalik hikoyasi."
          - "type": "alert"
            "title":
              "en": "Traveler takeaway"
              "ru": "Что важно для путешественника"
              "uz": "Sayohatchi uchun xulosa"
            "description":
              "en": "Come for the bazaar and fortress, but let the sacred courtyard and Syr Darya keep Khujand from becoming only a transfer."
              "ru": "Приезжайте за базаром и крепостью, но дайте священному двору и Сырдарье не превратить Худжанд в простой переезд."
              "uz": "Bozor va qalʼa uchun keling, lekin muqaddas hovli va Sirdaryo Xoʻjandni oddiy koʻchishga aylantirmasin."
        "right":
