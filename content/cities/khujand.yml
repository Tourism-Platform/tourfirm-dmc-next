                  "ru": "Северный город Таджикистана на Сырдарье в туристическом регионе Худжанд и северный Таджикистан."
                  "uz": "Sirdaryo boʻyidagi Shimoliy Tojikiston shahri, Xoʻjand va Shimoliy Tojikiston turistik hududida."
              - "icon": "Landmark"
