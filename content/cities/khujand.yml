                  "ru": "Базар Панджшанбе, мечеть и мавзолей шейха Муслихиддина, Худжандская крепость и исторический музей, плюс время у Сырдарьи, если позволяет график."
                  "uz": "Panjshanbe bozori, Shayx Muslihiddin masjidi va maqbarasi, Xoʻjand qalʼasi va tarixiy muzeyi, vaqt mos kelsa Sirdaryo boʻyidagi sokin vaqt."
