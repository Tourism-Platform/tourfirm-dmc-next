        "description":
          "en": "Panfilov Park is a small central green space with more weight than its size suggests. Trees and benches soften the street noise, the Memorial of Glory asks for a respectful pause, and Ascension Cathedral gives the park its most recognizable wooden silhouette."
          "ru": "Парк Панфиловцев — небольшое зелёное пространство в центре Алматы, но смысл у него шире, чем размер. Деревья и скамейки смягчают шум улиц, Мемориал Славы требует уважительного тона, а Вознесенский собор даёт парку самый узнаваемый деревянный силуэт."
          "uz": "Panfilov bogʻi Olmaota markazidagi kichik yashil makon, lekin uning mazmuni hajmidan kengroq. Daraxtlar va oʻrindiqlar koʻcha shovqinini yumshatadi, Shon-sharaf yodgorligi bu yerda ohangni sokin tutishni eslatadi, Voznesenskiy sobori esa bogʻga eng tanish yogʻoch siluetni beradi."
