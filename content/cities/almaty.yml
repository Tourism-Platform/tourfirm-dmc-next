        "description":
          "en": "Ascension Cathedral rises from the trees of Panfilov Park with painted timber, domes, and an active church life behind the doors. It gives a central Almaty walk a strong architectural anchor while staying tied to the park, memorial paths, and city movement around it."
          "ru": "Вознесенский собор поднимается среди деревьев Парка Панфиловцев: расписное дерево, купола и живая церковная среда за дверями. Он даёт прогулке по центру Алматы сильный архитектурный ориентир и остаётся связанным с парком, мемориальными аллеями и движением города вокруг."
          "uz": "Voznesenskiy sobori Panfilov bogʻi daraxtlari orasidan koʻtariladi: boʻyalgan yogʻoch, gumbazlar va eshik ortidagi amaldagi cherkov hayoti. U markaziy Olmaota sayriga kuchli arxitektura markazini beradi va bogʻ, xotira yoʻlaklari hamda shahar harakati bilan birga qoladi."
