  "metaDescription":
    "en": "Almaty does not need an immediate climb to feel shaped by the mountains. The visit begins with trees, traffic, coffee, market noise, and the former capital's civic scale; then the route can rise to Kok-Tobe, Medeu, or Shymbulak when weather, lift status, and the traveler’s pace support it."
    "ru": "Алматы не нужно сразу подниматься в горы, чтобы чувствоваться городом у хребта. Сначала идут деревья, трафик, кофе, рынок и масштаб бывшей столицы; затем маршрут может подняться к Кок-Тобе, Медеу или Шымбулаку, если погода, подъёмники и темп путешествия позволяют."
    "uz": "Olmaota togʻ kayfiyatini berishi uchun darhol balandlikka shoshilmaydi. Avval daraxtlar, tirbandlik, qahva, bozor shovqini va sobiq poytaxtning shahar miqyosi keladi; keyin ob-havo, lift holati va sayohatchi surʼati mos boʻlsa, yoʻl Koʻk-Tobe, Medeu yoki Shimbuloqqa koʻtariladi."
