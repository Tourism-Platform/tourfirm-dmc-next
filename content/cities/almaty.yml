      "ru": "Куда может вести Алматы"
      "uz": "Olmaota keyin qayerga olib borishi mumkin"
    "description":
      "en": "After the city, the route can stay in the northern Tian Shan, cross to the capital, or continue south toward Kazakhstan's heritage corridor."
      "ru": "После города маршрут может остаться в Северном Тянь-Шане, перейти к столице или продолжиться на юг к наследию Казахстана."
      "uz": "Shahardan keyin yoʻnalish Shimoliy Tyanshanda qolishi, poytaxtga oʻtishi yoki Qozogʻiston meros yoʻli bo‘ylab janubga davom etishi mumkin."
