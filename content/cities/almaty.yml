      - "type": "experience"
        "image": "assets/images/destinations/kazakhstan/character/almaty/almaty-character-1.webp"
        "badge":
          "en": "Nature"
          "ru": "Природа"
          "uz": "Tabiat"
        "title":
          "en": "Foothill city skyline"
          "ru": "Горизонт предгорного города"
          "uz": "Togʻoldi shahar ufqi"
        "description":
          "en": "Green districts, broad avenues, and the Tian Shan behind them make Almaty's setting visible before any mountain road begins."
          "ru": "Зелёные районы, широкие проспекты и Тянь-Шань за ними показывают положение Алматы ещё до первой горной дороги."
          "uz": "Yashil tumanlar, keng ko‘chalar va ortdagi Tyanshan togʻ yoʻli boshlanmasidan oldin ham Olmaota joylashuvini ko‘rsatadi."
      - "type": "experience"
        "image": "assets/images/destinations/kazakhstan.jpg"
        "badge":
          "en": "Culture"
          "ru": "Культура"
          "uz": "Madaniyat"
        "title":
          "en": "Kok-Tobe first view"
          "ru": "Первый вид с Кок-Тобе"
          "uz": "Koʻk-Tobedagi birinchi manzara"
        "description":
          "en": "A lighter climb above the center gives travelers Almaty's shape: city grid, foothills, and mountain edge in one frame."
          "ru": "Лёгкий подъём над центром даёт путешественнику форму Алматы: городскую сетку, предгорья и горный край в одном кадре."
          "uz": "Markaz ustidagi yengil koʻtarilish sayohatchiga Olmaota shaklini beradi: shahar to‘ri, togʻoldi va togʻ cheti bir kadrda."
      - "type": "experience"
        "image": "assets/images/destinations/kazakhstan/character/almaty/almaty-character-3.webp"
        "badge":
          "en": "Nature"
          "ru": "Природа"
          "uz": "Tabiat"
        "title":
          "en": "Medeu and Shymbulak air"
          "ru": "Воздух Медеу и Шымбулака"
          "uz": "Medeu va Shimbuloq havosi"
        "description":
          "en": "Treat the higher valley as a weather-aware climb: close to the city, but shaped by road time, lift status, visibility, and temperature."
          "ru": "Считайте высокую долину погодным подъёмом: она близко к городу, но зависит от дороги, подъёмников, видимости и температуры."
          "uz": "Baland vodiyni ob-havo bilan tanlanadigan koʻtarilish deb ko‘ring: u shaharga yaqin, lekin yoʻl, lift holati, ko‘rinish va haroratga bogʻliq."
  - "blockType": "regular"
    "eyebrow":
      "en": "Before you go"
      "ru": "Перед поездкой"
      "uz": "Borishdan oldin"
    "title":
      "en": "Let Almaty keep two tempos"
      "ru": "Дайте Алматы два темпа"
      "uz": "Olmaotaga ikki surʼat bering"
    "description":
      "en": "The city is comfortable, but it can lose its shape when every famous name is squeezed into one plan. Treat the city floor and the mountain edge as two related decisions."
      "ru": "Город удобный, но теряет форму, если пытаться соединить все известные названия сразу. Планируйте городскую часть и горный край как два связанных решения."
      "uz": "Shahar qulay, ammo hamma mashhur nomlarni birdaniga ulashga urinilsa, uning shakli yoʻqoladi. Shahar qismi va togʻ chetini bir-biriga bogʻliq ikki qaror sifatida rejalang."
    "rows":
      - "ratio": "2:1"
        "left":
          - "type": "dashTitle"
            "title":
              "en": "City floor"
              "ru": "Городская часть"
              "uz": "Shahar qismi"
            "description":
              "en": "A first walk, meal, or market hour helps travelers understand Almaty before the route points uphill."
              "ru": "Первая прогулка, еда или час на рынке помогают понять Алматы до того, как маршрут пойдёт вверх."
              "uz": "Birinchi sayr, ovqat yoki bozor soati yoʻl yuqoriga burilishidan oldin Olmaotani tushunishga yordam beradi."
          - "type": "quote"
            "quote":
              "en": "Almaty opens best when the city explains the mountains before the road climbs into them."
              "ru": "Алматы лучше раскрывается, когда город объясняет горы до того, как дорога начинает подниматься."
              "uz": "Olmaota avval shahar togʻlarni tushuntirib berganda, keyin yoʻl yuqoriga ko‘tarilganda yaxshiroq ochiladi."
          - "type": "dashTitle"
            "title":
              "en": "One climb"
              "ru": "Один подъём"
              "uz": "Bitta koʻtarilish"
            "description":
              "en": "Choose Kok-Tobe, or choose the Medeu-Shymbulak road; combining every high stop usually weakens the visit."
              "ru": "Выберите Кок-Тобе или дорогу Медеу-Шымбулак; попытка соединить все высокие точки обычно ослабляет маршрут."
              "uz": "Koʻk-Tobeni tanlang yoki Medeu-Shimbuloq yoʻlini tanlang; barcha baland nuqtalarni birga ulash odatda marshrutni zaiflashtiradi."
          - "type": "dashTitle"
            "title":
              "en": "Wider region"
              "ru": "Шире в регион"
              "uz": "Kengroq mintaqa"
            "description":
              "en": "Charyn, Saty, Kolsai, Kaindy, Tamgaly, Altyn-Emel, and the Assy Plateau deserve route space, current road checks, and season-aware timing."
              "ru": "Чарын, Саты, Кольсай, Каинды, Тамгалы, Алтын-Эмель и плато Ассы требуют места в маршруте, актуальных дорожных проверок и сезонного тайминга."
              "uz": "Charyn, Saty, Kolsai, Kaindy, Tamgaly, Altyn-Emel va Assy platosi yoʻnalishda alohida joy, joriy yoʻl tekshiruvi va mavsumiy vaqt talab qiladi."
          - "type": "alert"
            "title":
              "en": "For the traveler"
              "ru": "Для путешественника"
              "uz": "Sayohatchi uchun"
            "description":
              "en": "Stay with the city long enough to understand it, then widen the route only as far as the season, roads, and traveler energy support."
              "ru": "Задержитесь в городе достаточно, чтобы понять его, а затем расширяйте маршрут настолько, насколько позволяют сезон, дороги и силы путешественников."
              "uz": "Shaharda uni tushunishga yetadigan vaqt qoling, keyin yoʻnalishni faqat mavsum, yoʻllar va sayohatchi kuchi qoʻllagan darajada kengaytiring."
        "right":
          - "type": "miniTable"
            "title":
              "en": "Before you go"
              "ru": "Перед поездкой"
              "uz": "Borishdan oldin"
            "icon": "Circle"
            "rows":
              - "icon": "MapPin"
                "title":
                  "en": "Good to know Stay"
                  "ru": "Коротко Ночёвки"
                  "uz": "Qisqacha Tunash"
                "description":
                  "en": "Two nights give a calm city visit and one close mountain choice; add more for Charyn, Kolsai, Kaindy, Tamgaly, or Altyn-Emel."
                  "ru": "Две ночи дают спокойный город и один близкий горный выбор; для Чарына, Кольсая, Каинды, Тамгалы или Алтын-Эмеля нужно больше времени."
                  "uz": "Ikki tun sokin shahar tashrifi va bitta yaqin togʻ tanlovini beradi; Charyn, Kolsai, Kaindy, Tamgaly yoki Altyn-Emel uchun ko‘proq vaqt qoʻshing."
              - "icon": "Landmark"
                "title":
                  "en": "Route role"
                  "ru": "Роль в маршруте"
                  "uz": "Yoʻnalishdagi roli"
                "description":
                  "en": "Arrival city, former-capital culture, and a natural start for southeast Kazakhstan's mountain routes."
                  "ru": "Город прибытия, культура бывшей столицы и естественное начало горных маршрутов юго-восточного Казахстана."
                  "uz": "Kelish shahri, sobiq poytaxt madaniyati va janubi-sharqiy Qozogʻiston togʻ yoʻllari uchun tabiiy boshlanish."
              - "icon": "Sun"
                "title":
                  "en": "Weather and roads"
                  "ru": "Погода и дороги"
                  "uz": "Ob-havo va yoʻllar"
                "description":
                  "en": "High-mountain and remote-road plans need same-week checks for lifts, snow, visibility, access, and drive time."
                  "ru": "Высокогорье и дальние дороги требуют проверок на той же неделе: подъёмники, снег, видимость, доступ и время в пути."
                  "uz": "Baland togʻ va uzoq yoʻl rejalari uchun liftlar, qor, koʻrinish, kirish va yoʻl vaqtini shu hafta ichida tekshirish kerak."
  - "blockType": "regular"
    "eyebrow":
      "en": "Nearby"
      "ru": "Рядом"
