              "ru": "Сначала прибытие"
              "uz": "Avval kelish"
            "description":
              "en": "Treat the flight, train, and transfer as part of the journey, not empty time before the route begins."
              "ru": "Перелёт, поезд и трансфер лучше считать частью путешествия, а не пустым временем до начала маршрута."
              "uz": "Parvoz, poyezd va transfer safar boshlanishi oldidagi bo‘sh vaqt emas, yo‘lning bir qismi sifatida ko‘riladi."
          - "type": "quote"
            "quote":
              "en": "Urgench is at its best when it clears the way to Khiva and the western road."
              "ru": "Ургенч сильнее всего тогда, когда расчищает путь к Хиве и западной дороге."
              "uz": "Urganch Xiva va g‘arbiy yo‘lga yo‘l ochib berganda eng kuchli."
