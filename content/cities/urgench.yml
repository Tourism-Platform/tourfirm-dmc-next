          "uz": "Urganchda guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "one focused city day plus overnight is usually enough when the old core or main anchors get a full walking window. City tone: “Khorezm's arrival city before Khiva”."
          "ru": "Обычно хватает один насыщенный городской день плюс ночёвка, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Город прибытия в Хорезм перед Хивой»."
          "uz": "Odatda bitta zich shahar kuni va tunash yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Xiva oldidan Xorazmga kirish shahri»."
      - "type": "destinationInsight"
        "icon": "MapPin"
        "title":
