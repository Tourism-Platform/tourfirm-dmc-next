              "ru": "Самая сильная хорезмская ночёвка обычно находится в Хиве или рядом с ней. Ургенч делает подход спокойнее, а Ичан-Кала держит главный прогулочный день."
              "uz": "Eng kuchli Xorazm tuni odatda Xiva yoki uning yaqinida bo‘ladi. Urganch yondashuvni sokinlashtiradi, Ichan Qalʼa esa asosiy piyoda kunni ushlab turadi."
          - "type": "dashTitle"
