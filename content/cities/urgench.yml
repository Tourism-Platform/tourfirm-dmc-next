              "ru": "Одна дополнительная остановка, не список"
              "uz": "Bitta qo‘shimcha bekat, ro‘yxat emas"
            "description":
              "en": "Avesto Park, CAMUZ, Ulli Hovli, or fortress-road planning can be worthwhile when they fit the transfer rhythm without making the route feel rushed."
              "ru": "Парк Авесто, CAMUZ, Ули-Ховли или решения по крепостным дорогам имеют смысл, когда они совпадают с темпом трансфера и не делают маршрут спешным."
              "uz": "Avesto bog‘i, CAMUZ, Ulli Hovli yoki qalʼalar yo‘li haqidagi qarorlar transfer surʼatiga mos tushganda va yo‘lni shoshiltirmaganda maʼnoli bo‘ladi."
          - "type": "alert"
            "title":
              "en": "For travelers"
              "ru": "Для путешественника"
              "uz": "Sayohatchi uchun"
            "description":
              "en": "Choose Urgench for clear arrivals and one measured Khorezm moment: a transfer, a rest, a short cultural stop, then the road to Khiva or the wider west."
              "ru": "Выбирайте Ургенч для понятного прибытия и одного взвешенного хорезмского момента: трансфера, отдыха, короткой культурной остановки, а затем дороги к Хиве или дальше на запад."
              "uz": "Urganchni aniq kelish va bitta vazmin Xorazm lahzasi uchun tanlang: transfer, dam olish, qisqa madaniy bekat, keyin Xiva yoki g‘arbiy yo‘l."
        "right":
          - "type": "miniTable"
