      "ru": "От портала и сардобы средний маршрут может идти к петроглифам Сармышсая, источнику Чашма в Нурате, открытому берегу Айдаркуля или обратно к Бухаре."
      "uz": "Peshtoq va sardobadan keyin o‘rta yo‘l Sarmishsoy petrogliflari, Nurotadagi Chashma bulog‘i, Aydarko‘lning ochiq qirg‘og‘i yoki Buxoroga qaytadigan yo‘l tomonga burilishi mumkin."
