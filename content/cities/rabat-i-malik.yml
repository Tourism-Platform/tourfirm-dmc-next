              "ru": "Водный купол делает остановку человеческой. Он переводит внимание от архитектуры к жажде, тени, сохранённой воде и заботе, которая требовалась караванной дороге."
              "uz": "Suv gumbazi bekatni insoniy qiladi. U diqqatni meʼmorlikdan tashnalik, soya, saqlangan suv va karvon yo‘liga kerak bo‘lgan g‘amxo‘rlikka buradi."
          - "type": "dashTitle"
            "title":
