              "ru": "Для путешественника"
              "uz": "Sayohatchi uchun"
            "description":
              "en": "Rabat-i Malik fits when the route needs one clear Silk Road image between larger stops: not a long detour, but a focused place to understand arrival, water, heat, and rest."
              "ru": "Рабат-и Малик подходит, когда маршруту нужен один ясный образ Шёлкового пути между большими остановками: не длинный крюк, а сосредоточенное место, где понятны прибытие, вода, жара и отдых."
              "uz": "Katta bekatlar orasida yo‘nalishga bitta ravshan Ipak yo‘li obrazi kerak bo‘lsa, Rabat-i Malik mos keladi: uzun aylanma emas, kelish, suv, issiq va damni tushuntiradigan jamlangan joy."
