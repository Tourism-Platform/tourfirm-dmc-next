              "ru": "Используйте формулировку UNESCO аккуратно: караван-сарай и сардоба являются компонентами Silk Roads: Zarafshan-Karakum Corridor, а точный подъезд, парковка и движение на месте требуют актуальной местной ориентации."
              "uz": "UNESCO atamasini ehtiyotkor ishlating: karvonsaroy va sardoba Silk Roads: Zarafshan-Karakum Corridor komponentlari, aniq yondashuv, parking va joydagi harakat esa hozirgi mahalliy yo‘l-yo‘riqqa bog‘liq."
