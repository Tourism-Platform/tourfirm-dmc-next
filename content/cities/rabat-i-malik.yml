  "uz": "Navoiy yaqinida Rabat-i Malik shahar bo‘ylab sayr emas, yo‘lni tushunarli qiladigan meros bekati. Saqlangan karvonsaroy peshtoqi tekislikka kirish nuqtasini beradi; yonidagi sardoba esa suv, soya va dam harakat uchun nega zarur bo‘lganini ko‘rsatadi."
