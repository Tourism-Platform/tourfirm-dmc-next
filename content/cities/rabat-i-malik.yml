          "en": "1–2 nights is usually enough when the old core or main anchors get a full walking window. City tone: “A Karakhanid portal and water dome near Navoi”."
          "ru": "Обычно хватает 1–2 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Караханидский портал и водный купол у Навои»."
          "uz": "Odatda 1–2 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Navoiy yaqinidagi qoraxoniylar peshtoqi va suv gumbazi»."
      - "type": "destinationInsight"
