  "metaDescription":
    "en": "Novqa brings a human Bakhmal stop into the Zaamin & Jizzakh Mountains route. The road rises toward cooler air and orchard country, then the visit should narrow: one courtyard, one maker, tea or fruit at a table, and enough time for the village to be felt before the road continues."
    "ru": "Новка добавляет маршруту Заамин и горы Джизака человеческую остановку в Бахмале. Дорога поднимается к садам и более прохладному воздуху, а сам визит лучше сузить: один двор, один мастер, чай или фрукты за столом и достаточно времени, чтобы почувствовать село до дальнейшей дороги."
    "uz": "Novqa Zomin va Jizzax tog‘lari yo‘nalishiga Baxmaldagi insoniy bekatni qo‘shadi. Yo‘l bog‘lar va salqinroq havo tomon ko‘tariladi, tashrif esa torroq qolsa yaxshi: bitta hovli, bitta usta, dasturxon atrofida choy yoki meva va yo‘l davom etishidan oldin qishloqni sezishga yetarli vaqt."
