  "metaDescription":
    "en": "Yakkatut sits on the Bo‘stonliq side of the mountains above Tashkent, close to the Charvak and Burchmulla geography that already shapes many foothill routes. It belongs as a modest village pause: useful when a meeting point, meal or household welcome, etiquette, comfort details, and return timing are agreed for the date, not as a resort promise."
    "ru": "Яккатут находится на бостанлыкской стороне гор над Ташкентом, рядом с географией Чарвака и Бурчмуллы, которая уже формирует многие маршруты в предгорья. Его стоит воспринимать как скромную сельскую паузу: она уместна, когда встреча, еда или приём в доме, этикет, бытовые детали и время возвращения согласованы на дату, а не как курортное обещание."
    "uz": "Yakkatut Toshkent ustidagi tog‘larning Bo‘stonliq tomonida, Chorvoq va Burchmulla geografiyasiga yaqin joylashgan. Uni kamtar qishloq pauzasi sifatida ko‘rish kerak: uchrashuv joyi, ovqat yoki xonadondagi qabul, etiket, qulaylik tafsilotlari va qaytish vaqti sana uchun kelishilganda maʼnoli, lekin kurort vaʼdasi emas."
