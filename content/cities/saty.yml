    "en": "Saty gives the lake route a human rhythm. Guesthouse breakfasts begin before the first cars leave, the road climbs toward Kolsai and Kaindy, and the morning is easier when weather, park access, and transfer plans are checked the night before."
    "ru": "Саты добавляет озерному маршруту человеческий ритм. В гостевых домах готовят завтрак до первых выездов, дорога поднимается к Кольсаю и Каинды, а утро начинается спокойнее, если погода, доступ в парк и трансфер понятны еще накануне."
    "uz": "Saty ko‘llar yo‘liga insoniy ritm qo‘shadi. Mehmon uylarida ilk mashinalar chiqishidan oldin nonushta tayyorlanadi, yo‘l Kolsai va Qayindy tomon ko‘tariladi, ob-havo, parkka kirish va transfer rejasi bir kun oldin aniqlansa, tong ancha sokin boshlanadi."
