          "uz": "Bog‘ibalandda guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "one focused city day plus overnight is usually enough when the old core or main anchors get a full walking window. City tone: “A Samarkand city-edge mahalla of fig shade, fairs, and quieter pauses”."
          "ru": "Обычно хватает один насыщенный городской день плюс ночёвка, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Махалля у края Самарканда: инжирная тень, ярмарка и спокойная пауза»."
          "uz": "Odatda bitta zich shahar kuni va tunash yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Samarqand chetidagi mahalla: anjir soyasi, yarmarka va sokin pauza»."
      - "type": "destinationInsight"
