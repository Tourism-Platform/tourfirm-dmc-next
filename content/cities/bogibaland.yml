              "ru": "Богибаланд раскрывается сильнее всего, когда инжирная тень, ярмарочная фактура и край Самарканда складываются в одну спокойную паузу."
              "uz": "Bog‘ibaland anjir soyasi, yarmarka tuslari va Samarqand cheti bir sokin pauzaga aylanganda kuchli ochiladi."
          - "type": "dashTitle"
            "title":
              "en": "Let the fair stay seasonal"
              "ru": "Оставьте ярмарку сезонной"
              "uz": "Yarmarka mavsumiy bo‘lib qolsin"
            "description":
