              "ru": "Ремёсла, инжир, сухофрукты, варенье, указатели и информационный пункт ценны, когда они входят в живую сцену дня."
              "uz": "Hunarmandchilik, anjir, quruq meva, murabbo, ko‘rsatkichlar va axborot nuqtasi kunning jonli sahnasiga kirganda qadrli."
          - "type": "dashTitle"
