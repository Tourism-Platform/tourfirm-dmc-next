              "ru": "Богибаланд должен ощущаться как короткая передышка у края города перед возвращением в Самарканд, Конигил или другое соседнее село."
              "uz": "Bog‘ibaland Samarqand, Konigil yoki boshqa yaqin qishloqqa qaytishdan oldin shahar chetidagi qisqa nafasdek sezilishi kerak."
          - "type": "alert"
            "title":
              "en": "For travelers"
              "ru": "Для путешественников"
              "uz": "Sayohatchilar uchun"
            "description":
