    "en": "Morning in Dushanbe begins under plane trees: fountains, wide avenues, museum facades, and mountain air from the valley edge. The capital lets travelers arrive gently before the route turns toward Hissar, Varzob, the Fann Mountains, or the Pamirs."
    "ru": "Утро в Душанбе начинается под платанами: фонтаны, широкие проспекты, музейные фасады и горный воздух со стороны долины. Столица помогает мягко войти в страну перед дорогой к Гиссару, Варзобу, Фанским горам или Памиру."
    "uz": "Dushanbeda tong chinorlar ostida boshlanadi: favvoralar, keng xiyobonlar, muzey fasadlari va vodiy tomondan keladigan togʻ havosi. Poytaxt Hisor, Varzob, Fan togʻlari yoki Pomir tomonga yoʻl olishdan oldin sayohatchini sokin kiritadi."
