          "ru": "После открытой прогулки по Душанбе Национальный музей даёт спокойную точку входа в Таджикистан. Внутри карты, предметы и залы помогают связать горы, археологию, государственную историю и повседневную культуру в один понятный маршрутный смысл."
          "uz": "Dushanbedagi ochiq shahar sayridan keyin Milliy muzey Tojikistonga sokin kirish nuqtasini beradi. Ichkarida xaritalar, buyumlar va zallar togʻlar, arxeologiya, davlat hikoyasi va kundalik madaniyatni yoʻlga olib chiqish mumkin boʻlgan miqyosga keltiradi."
