          "ru": "Исмаил Сомони стоит в центре площади Дусти, где фигура с короной, арка, фонтаны, движение машин и официальные здания задают парадный масштаб центра Душанбе. Лучше смотреть это место как короткую остановку в первой городской прогулке — между проспектом Рудаки, музеями и следующей "
