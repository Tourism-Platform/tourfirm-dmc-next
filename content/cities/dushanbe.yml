          "ru": "Мехргон — современный крытый базар Душанбе: сезонные фрукты, курага, орехи, специи, мёд, чай и простая еда под одной большой крышей. Лучше всего заходить утром, когда между проспектами, музеями и следующей дорогой нужен живой городской эпизод."
          "uz": "Mehrgon — Dushanbedagi zamonaviy yopiq bozor: mavsumiy meva, quruq oʻrik, yongʻoq, ziravor, asal, choy va oddiy ovqat bitta katta tom ostida. Ertalab, xiyobonlar, muzeylar va keyingi yoʻl orasida shaharning kundalik ovqat manzarasini ko‘rish uchun qulay."
