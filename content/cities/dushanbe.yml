          "uz": "Navroʻz saroyi Dushanbe muzeylari va xiyobonlaridan boshqacha taassurot beradi. 2014 yilda qurilgan yirik besh qavatli majmua milliy uslubdagi meʼmorchilikni yogʻoch oʻymakorligi, tosh, shisha mozaika, naqshli shiftlar va qandil nuri bilan toʻldirilgan zallarga jamlaydi; qisqa ta"
        "ctaHref": "/destinations/tajikistan/dushanbe-and-hissar-valley/dushanbe/navruz-palace-kokhi-navruz"
