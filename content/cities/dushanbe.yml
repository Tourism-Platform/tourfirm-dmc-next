        "description":
          "en": "The National Museum of Antiquities narrows Dushanbe to a quieter archaeology room: Buddhist-era finds, pre-Islamic objects, and fragments from older settlements. It belongs before the route leaves the capital for Penjikent, Hissar, Khatlon, or the Zeravshan Valley."
          "ru": "В Национальном музее древностей Душанбе становится тише: буддийские находки, доисламские предметы и фрагменты древних поселений складываются в одну археологическую линию. Это уместная остановка перед дорогой к Пенджикенту, Гиссару, Хатлону или Зеравшанской долине."
          "uz": "Tojikiston Qadimiyat milliy muzeyida Dushanbe sokinroq ko‘rinadi: buddaviy davr topilmalari, islomdan oldingi buyumlar va qadimiy manzilgoh parchalarini bitta arxeologik yoʻnalishda koʻrasiz. Bu Penjikent, Hisor, Xatlon yoki Zarafshon vodiysi tomonga chiqishdan oldin foydali toʻx"
        "ctaHref": "/destinations/tajikistan/dushanbe-and-hissar-valley/dushanbe/national-museum-of-antiquities-of-tajikistan"
