"excerpt":
  "en": "Jalal-Abad / Manas is where the western Kyrgyzstan map starts to feel practical. Roads from Osh, Bishkek, and the Ferghana edge meet here before travelers choose Arslanbob's walnut forest, Sary-Chelek's protected lake country, or the longer road north. Most journeys do not need a long city checklist here. The useful version is simple: arrive, eat, collect what you need, take a short walk if it fits, and leave the bigger time for the road that comes next."
  "ru": "Джалал-Абад / Манас — место, где карта западного Кыргызстана становится практичной. Дороги от Оша, Бишкека и края Ферганской долины сходятся здесь, а затем путешественник выбирает: ореховый лес Арсланбоба, озёрный Сары-Челек или длинную дорогу на север. Здесь не нужен длинный список городского осмотра. Достаточно приехать, поесть, взять нужное в дорогу, пройтись, если это уместно, и оставить основное время для следующего направления."
  "uz": "Jalolobod / Manasda Qirgʻiziston gʻarbi xaritadagi nuqtadan amaliy yoʻl tanloviga aylanadi. Oʻsh, Bishkek va Fargʻona chekkasidan kelgan yoʻllar shu yerda uchrashadi, keyin sayohatchi Arslonbob yongʻoq oʻrmoni, Sary-Chelek koʻl hududi yoki uzoq shimoliy yoʻlni tanlaydi. Bu yerda uzun shahar roʻyxati shart emas. Kelish, ovqatlanish, yoʻlga kerakli narsalarni olish, mos boʻlsa qisqa yurish va asosiy vaqtni keyingi yoʻnalishga qoldirish kifoya."
