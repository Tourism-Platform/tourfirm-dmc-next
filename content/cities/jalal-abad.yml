        "description":
          "en": "one focused city day plus overnight is usually enough when the old core or main anchors get a full walking window. City tone: “Western Kyrgyzstan stop before Arslanbob and Sary-Chelek”."
          "ru": "Обычно хватает один насыщенный городской день плюс ночёвка, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Западная остановка перед Арсланбобом и Сары-Челеком»."
          "uz": "Odatda bitta zich shahar kuni va tunash yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Arslonbob va Sary-Chelek oldidagi gʻarbiy bekat»."
      - "type": "destinationInsight"
