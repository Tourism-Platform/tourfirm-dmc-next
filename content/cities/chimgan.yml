        "description":
          "en": "Chimgan is where the road out of Tashkent begins to feel mountainous: grass at the edges, ridges ahead, and Greater Chimgan holding the skyline. A good visit starts with one clear intention, whether you come for open views, slope air, a resort road, or a guided walk."
          "ru": "Чимган — место, где дорога из Ташкента впервые становится горной: по сторонам трава, впереди хребты, а Большой Чимган держит линию горизонта. Хороший выезд начинается с ясной цели: открытые виды, воздух склонов, курортная дорога или прогулка с гидом."
          "uz": "Chimyon — Toshkentdan chiqqan yo‘l ilk bor tog‘lik tus oladigan joy: yo‘l chetida maysa, oldinda tizmalar, ufqda esa Katta Chimyon ko‘rinadi. Yaxshi tashrif bitta aniq niyatdan boshlanadi: ochiq manzara, yonbag‘ir havosi, kurort yo‘li yoki gidli yurish."
