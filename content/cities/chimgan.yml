          "ru": "Пальтау подходит тем, кто хочет, чтобы горный день ушёл от дороги вдоль водохранилища в более узкий каньон. Подход проверяют ближе к поездке, обувь выбирают для мокрого камня и неровной тропы, а сам водопад оставляют частью большого пейзажа Чарвака, Бурчмуллы и Угам-Чаткала."
