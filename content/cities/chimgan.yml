          "ru": "Снег после проверок"
          "uz": "Tekshiruvlardan keyingi qor"
        "description":
          "en": "Winter can make Chimgan crisp and quiet, but snow, road safety, lift schedules, and resort readiness shape whether the day should stay soft or active."
          "ru": "Зима может сделать Чимган ясным и тихим, но снег, безопасность дороги, расписания подъёмников и готовность курортов определяют, будет ли день мягким или активным."
          "uz": "Qish Chimyonni tiniq va sokin qilishi mumkin, lekin qor, yoʻl xavfsizligi, koʻtargich jadvallari va kurort tayyorligi kun yengilmi yoki faolroq bo‘lishini belgilaydi."
  - "blockType": "regular"
    "eyebrow":
      "en": "Before you go"
      "ru": "Перед поездкой"
      "uz": "Borishdan oldin"
    "title":
      "en": "How Chimgan changes the Tashkent route"
      "ru": "Как Чимган меняет ташкентский маршрут"
      "uz": "Chimyon Toshkent yoʻnalishini qanday oʻzgartiradi"
    "description":
      "en": "The road is close to Tashkent, but the mountain area changes the pace of the trip. A good Chimgan day is not a race through every name on the map; it is a clear choice shaped by weather, road time, trail conditions, and the mood of the group."
      "ru": "Дорога близка к Ташкенту, но горная зона меняет темп поездки. Хороший день в Чимгане — не гонка по всем названиям на карте, а ясный выбор по погоде, дороге, состоянию троп и настроению группы."
      "uz": "Yoʻl Toshkentga yaqin, lekin togʻ hududi safar surʼatini oʻzgartiradi. Yaxshi Chimyon kuni xaritadagi hamma nomlarni shoshilib koʻrish emas; u ob-havo, yoʻl vaqti, soʻqmoqlar holati va guruh kayfiyatiga qarab tanlangan aniq rejadir."
    "rows":
      - "ratio": "2:1"
        "left":
          - "type": "dashTitle"
            "title":
              "en": "Choose the outing"
              "ru": "Выберите формат дня"
              "uz": "Kun shaklini tanlang"
            "description":
              "en": "Begin with the feeling you want from the day: open slopes, Charvak water, a resort road, or a guide-led gorge. Trying to force them all into one outing usually makes the mountains feel rushed."
              "ru": "Начните с ощущения, которое нужно от дня: открытые склоны, вода Чарвака, курортная дорога или ущелье с гидом. Если пытаться втиснуть всё сразу, горы быстро начинают казаться спешкой."
              "uz": "Kundagi hissiyotdan boshlang: ochiq yonbagʻirlar, Chorvoq suvi, kurort yoʻli yoki gidli dara. Hammasini bitta chiqishga tiqishtirish togʻlarni shoshqaloq ko‘rsatadi."
          - "type": "quote"
            "quote":
              "en": "The capital stays close, but the air changes fast."
              "ru": "Столица остаётся рядом, но воздух меняется быстро."
              "uz": "Poytaxt yaqin qoladi, lekin havo tez o‘zgaradi."
          - "type": "dashTitle"
            "title":
              "en": "Check conditions"
              "ru": "Проверить условия"
              "uz": "Sharoitni tekshirish"
            "description":
              "en": "Mountain roads, weekends, weather, lifts, snow, and trail access can change the right plan, so the final version should be checked close to departure, especially for Gulkam, Ugam-Chatkal, and winter routes."
              "ru": "Горные дороги, выходные, погода, подъёмники, снег и доступ к тропам могут изменить правильный план, поэтому финальную версию стоит проверять ближе к выезду, особенно для Гулькама, Угам-Чаткала и зимних маршрутов."
              "uz": "Togʻ yoʻllari, dam olish kunlari, ob-havo, koʻtargichlar, qor va soʻqmoq kirishi toʻgʻri rejani oʻzgartirishi mumkin, shuning uchun yakuniy shakl chiqishga yaqin tekshiriladi, ayniqsa Gulkam, Ugom-Chotqol va qishki yoʻnalishlar uchun."
          - "type": "dashTitle"
            "title":
              "en": "Return to Tashkent"
              "ru": "Вернуться в Ташкент"
              "uz": "Toshkentga qaytish"
            "description":
              "en": "Keeping Tashkent as the return point makes Chimgan easier to fit around flights, trains, museums, meals, and the next heritage-city route."
              "ru": "Когда Ташкент остаётся точкой возвращения, Чимган проще связать с рейсами, поездами, музеями, едой и следующим маршрутом по городам наследия."
              "uz": "Toshkent qaytish nuqtasi boʻlib qolsa, Chimyonni reyslar, poyezdlar, muzeylar, ovqat va keyingi meros shaharlari yoʻnalishi bilan bogʻlash osonroq bo‘ladi."
          - "type": "alert"
