          "ru": "Бельдерсай над склонами"
          "uz": "Beldersoy yonbagʻirlar ustida"
        "description":
          "en": "When the lift is running, Beldersay raises the view over the slopes and gives the mountain day height without turning it into a hard hike."
          "ru": "Когда подъёмник открыт, Бельдерсай поднимает вид над склонами и даёт горному дню высоту без сложного похода."
          "uz": "Koʻtargich ochiq bo‘lsa, Beldersoy manzarani yonbagʻirlardan yuqoriga olib chiqadi va togʻ kuniga qiyin yurishsiz balandlik hissini beradi."
      - "type": "experience"
