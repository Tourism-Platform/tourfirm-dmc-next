          "ru": "Чарвакское водохранилище переводит выезд к Чимгану от склонов к воде и открытому горизонту. Сначала сюда приезжают за самим видом: обзорной точкой, обедом у берега или сезонной зоной отдыха, а купание и лодки решаются на месте по погоде, оператору и условиям безопасности."
