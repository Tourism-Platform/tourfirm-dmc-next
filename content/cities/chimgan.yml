          "en": "Gulkam with local guidance"
          "ru": "Гулькам с местным гидом"
          "uz": "Gulkam mahalliy gid bilan"
        "description":
          "en": "Gulkam belongs in the plan only when weather, water, footing, boulders, and local guidance make the gorge a responsible choice."
          "ru": "Гулькам стоит включать только тогда, когда погода, вода, обувь, камни и местный гид делают ущелье ответственным выбором."
          "uz": "Gulkam faqat ob-havo, suv, oyoq osti, xarsanglar va mahalliy gid darani masʼuliyatli tanlovga aylantirganda rejaga kiradi."
