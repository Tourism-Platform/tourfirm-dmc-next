          "ru": "Гулькам переводит выезд к Чимгану от открытых горных видов к воде, валунам и узким скальным стенам. Идите сюда, когда местный гид проверил погоду, уровень воды, обувь, подготовку группы и светлое время для каньонного маршрута."
          "uz": "Gulkam Chimyon safarini ochiq tog‘ manzaralaridan suv, xarsangtoshlar va tor qoyali devorlarga olib kiradi. Bu yerga mahalliy gid ob-havo, suv darajasi, oyoq kiyim, guruh tayyorgarligi va kunduzgi vaqtni tekshirganidan keyin boring."
