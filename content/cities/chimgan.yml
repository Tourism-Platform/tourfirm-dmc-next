          "ru": "Водохранилище добавляет синюю воду под сухими хребтами, свет берега и более широкий горный вид перед возвращением в Ташкент."
          "uz": "Suv ombori quruq tizmalar ostidagi moviy suv, qirgʻoq nuri va Toshkentga qaytishdan oldin kengroq togʻ manzarasini qoʻshadi."
      - "type": "experience"
