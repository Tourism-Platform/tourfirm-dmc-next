        "description":
          "en": "Greater Chimgan is the peak that makes the Chimgan road feel suddenly vertical. From below, it gives the foothills their skyline and a reason to leave Tashkent's heat; for prepared hikers, it belongs only in a guided plan shaped by weather, daylight, and route conditions."
          "ru": "Большой Чимган — вершина, из-за которой дорога к Чимгану вдруг кажется вертикальной. Снизу она задаёт силуэт предгорий и даёт повод уехать от ташкентской жары; для подготовленных гостей это не спонтанный поворот, а маршрут с сопровождением, погодной оценкой и запасом светового дн"
          "uz": "Katta Chimyon — Chimyon yo‘lini birdan tik tog‘ yo‘lidek his qildiradigan cho‘qqi. Pastdan u tog‘oldi siluetini belgilaydi va Toshkent issig‘idan chiqishga sabab beradi; tayyor mehmonlar uchun esa bu ob-havo, kunduzgi vaqt va yo‘l holatiga qarab tuziladigan gidli reja."
        "ctaHref": "/destinations/uzbekistan/tashkent-region/chimgan/greater-chimgan-peak"
