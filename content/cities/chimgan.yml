        "description":
          "en": "Urungach is the mountain-lake choice for travelers who can give the Chimgan route a longer seasonal outing. When the water is high, the lower lake turns cold jade-turquoise; beyond it, a higher lake and changing road conditions make the visit a careful Bostanlyk plan rather than "
          "ru": "Урунгач подходит тем, кто готов дать маршруту через Чимган более дальний сезонный выезд. Когда воды достаточно, нижнее озеро становится холодным бирюзово-нефритовым; выше лежит второе озеро, а дорога и погода превращают поездку в аккуратный план по Бостанлыку, а не в быструю куро"
          "uz": "Urungach Chimyon yo‘nalishiga uzoqroq mavsumiy tog‘ chiqishini qo‘shmoqchi bo‘lgan sayohatchilar uchun. Suv baland bo‘lganda quyi ko‘l sovuq firuza-nefrit tusga kiradi; yuqorida ikkinchi ko‘l bor, yo‘l va ob-havo esa bu tashrifni tez kurort bekati emas, ehtiyotkor Bo‘stonliq reja"
        "ctaHref": "/destinations/uzbekistan/tashkent-region/chimgan/urungach-jade-lakes"
        "ctaLabel":
