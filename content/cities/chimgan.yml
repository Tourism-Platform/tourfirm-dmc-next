      "ru": "Выезд может остаться мягким или стать активнее: первый воздух после Ташкента, вода Чарвака, высота Бельдерсая, инфраструктура Амирсоя, Гулькам с гидом или зимний план по снегу и расписаниям."
      "uz": "Chiqish yengil qolishi yoki faolroq boʻlishi mumkin: Toshkentdan keyingi birinchi havo, Chorvoq suvi, Beldersoy balandligi, Amirsoy infratuzilmasi, gidli Gulkam yoki qor va jadvallarga qarab tuzilgan qishki reja."
