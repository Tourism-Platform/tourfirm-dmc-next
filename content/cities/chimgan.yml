          "ru": "Столичная дорога переходит в предгорный воздух, сухую траву, открытые склоны и первое ощущение, что маршрут по Узбекистану вышел за город."
          "uz": "Poytaxt yoʻli togʻoldi havosi, quruq oʻt, ochiq yonbagʻirlar va Oʻzbekiston yoʻnalishi shahardan chiqqanini sezdiradigan joyga almashadi."
      - "type": "experience"
