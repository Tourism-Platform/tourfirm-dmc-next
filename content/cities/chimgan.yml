      "en": "Start with the mountain setting: Chimgan slopes and Greater Chimgan give the area its shape; Charvak adds water; Amirsoy and Beldersay bring resort roads; Gulkam and Ugam-Chatkal need guide-led planning and current conditions."
      "ru": "Начинайте с горного окружения: склоны Чимгана и Большой Чимган задают форму места; Чарвак добавляет воду; Амирсой и Бельдерсай дают курортные дороги; Гулькам и Угам-Чаткал требуют планирования с гидом и проверки текущих условий."
      "uz": "Togʻ muhitidan boshlang: Chimyon yonbagʻirlari va Katta Chimyon joy shaklini beradi; Chorvoq suv qoʻshadi; Amirsoy va Beldersoy kurort yoʻllarini olib keladi; Gulkam va Ugom-Chotqol gidli reja hamda joriy sharoit tekshiruvini talab qiladi."
