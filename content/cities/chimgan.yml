          "ru": "Угам-Чаткал показывает настоящий масштаб маршрута к Чимгану: хребты Западного Тянь-Шаня, глубокие долины, горные реки, можжевеловые склоны и охраняемые зоны, к которым нельзя относиться как к обычной остановке у дороги. Хороший визит начинается с подходящего доступного края парка"
          "uz": "Ugom-Chotqol Chimyon yo‘liga haqiqiy miqyos beradi: G‘arbiy Tyanshan tizmalari, chuqur vodiylar, tog‘ daryolari, archa yonbag‘irlari va oddiy yo‘l bo‘yidagi bekat kabi qabul qilib bo‘lmaydigan muhofaza zonalari. Yaxshi tashrif butun park bir xil ochiq degan fikrdan emas, mos kela"
        "ctaHref": "/destinations/uzbekistan/tashkent-region/chimgan/ugam-chatkal-state-national-natural-park"
