          "uz": "Amirsoy osonroq kirish bilan"
        "description":
          "en": "Amirsoy suits travelers who want a more structured mountain stop, resort facilities, and a clear access check before leaving Tashkent."
          "ru": "Амирсой подходит тем, кому нужен более собранный горный выезд, курортная инфраструктура и понятная проверка доступа до отправления из Ташкента."
          "uz": "Amirsoy tartibliroq togʻ chiqishi, kurort infratuzilmasi va Toshkentdan chiqishdan oldin aniq kirish tekshiruvi kerak bo‘lgan sayohatchilarga mos."
      - "type": "experience"
