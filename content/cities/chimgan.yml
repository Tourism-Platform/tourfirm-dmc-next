    description:
      en: "After the capital, the road climbs through the Chirchiq valley to Charvak Reservoir, then Chimgan village. Plan cable car, short hikes or horseback riding before the return to Tashkent.\n\n• Charvak — turquoise photo stop on the way uphill.\n• Chimgan village — base for meadows and cable car.\n• Beldersay — ski slopes and gorge views in winter and summer."
      ru: "После столицы дорога поднимается по долине Чирчика к Чарваку, затем к посёлку Чимган. Запланируйте канатную дорогу, короткие прогулки или верховую езду перед возвращением в Ташкент.\n\n• Чарвак — бирюзовая фото-остановка по пути в горы.\n• Посёлок Чимган — база для лугов и канатной дороги.\n• Белdersay — горнолыжные склоны и ущелье круглый год."
      uz: "Poytaxtdan keyin yo'l Chirchiq vodiy bo'ylab Charvakga, so'ngra Chimgan qishlog'iga ko'tariladi. Toshkentga qaytishdan oldin kanat yo'li, qisqa yurish yoki ot sayohatini rejalashtiring.\n\n• Charvak — ko'tarilish yo'lidagi moviy fototo'xtash.\n• Chimgan qishlog'i — chimzorlar va kanat yo'li bazasi.\n• Beldersay — qish va yozda chang'i va yo'lak manzaralari."

