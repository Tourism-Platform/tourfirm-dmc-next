  "metaDescription":
    "en": "Chimgan is where a Tashkent day opens into the foothills. The road follows the Chirchiq valley toward open slopes, Charvak light, resort roads, and guided gorges, so the visit feels best when one mountain plan is chosen before leaving the capital."
    "ru": "Чимган — место, где день из Ташкента быстро выходит в предгорья. Дорога идёт через Чирчикскую долину к открытым склонам, свету Чарвака, курортным дорогам и ущельям с гидом, поэтому выезд лучше строить вокруг одного горного плана ещё до отправления из столицы."
    "uz": "Chimyon — Toshkent kuni togʻoldiga ochiladigan joy. Yoʻl Chirchiq vodiysi orqali ochiq yonbagʻirlar, Chorvoq nuri, kurort yoʻllari va gidli daralarga olib boradi, shuning uchun poytaxtdan chiqishdan oldin bitta togʻ rejasi tanlansa, tashrif yaxshiroq kechadi."
