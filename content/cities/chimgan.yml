        "description":
          "en": "Obi-Rakhmat takes the Chimgan mountain route into a much older time scale. Near the Paltau and Charvak side of the western Tien Shan, a modest cave entrance leads into a record of Paleolithic strata, stone tools, and rare human evidence. Treat it as a quiet archaeology stop: ask "
          "ru": "Оби-Рахмат добавляет горному маршруту Чимгана совсем другой масштаб времени. На стороне Пальтау и Чарвака от Западного Тянь-Шаня скромный вход в грот ведёт к истории палеолитических слоёв, каменных орудий и редких свидетельств древнего человека. Относитесь к месту как к тихой арх"
