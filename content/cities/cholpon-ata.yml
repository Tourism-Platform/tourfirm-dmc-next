              "en": "The drive from Bishkek or Chuy can make the lake feel like a prize at the end of the road. A walk by the water, a slower meal, or an overnight pause helps the route change pace before more ambitious mountain or shore choices."
              "ru": "Дорога из Бишкека или Чуя может сделать озеро наградой в конце переезда. Прогулка у воды, спокойная еда или ночёвка помогают маршруту сменить темп перед более амбициозным выбором гор или берега."
              "uz": "Bishkek yoki Chuydan keladigan yo‘l ko‘lni safar oxiridagi mukofotdek his qildirishi mumkin. Suv bo‘yida yurish, sokin ovqat yoki tunash pauzasi togʻ yoki qirgʻoq bo‘yicha kattaroq tanlovdan oldin yo‘nalish surʼatini o‘zgartiradi."
          - "type": "quote"
            "quote":
              "en": "Cholpon-Ata is most useful when it gives the route a real pause by the water, then lets the lake road continue with purpose."
              "ru": "Чолпон-Ата полезнее всего, когда даёт маршруту настоящую паузу у воды, а затем позволяет дороге вокруг озера продолжиться осмысленно."
              "uz": "Cholpon-Ata yo‘nalishga suv bo‘yida haqiqiy pauza berganda eng foydali, keyin esa ko‘l yo‘li maqsad bilan davom etadi."
          - "type": "dashTitle"
            "title":
              "en": "Separate the two cultural stops"
              "ru": "Разделите две культурные остановки"
              "uz": "Ikki madaniy toʻxtashni ajrating"
            "description":
              "en": "Ruh Ordo and the petroglyph field ask for different moods. One is lakefront and symbolic; the other is open-air archaeology above town. Keeping them distinct makes the town feel clearer."
              "ru": "Рух Ордо и поле петроглифов требуют разного настроения. Один ориентир стоит у воды и говорит символами; другой — открытая археология над городом. Когда они не смешаны, Чолпон-Ата становится понятнее."
              "uz": "Ruh Ordo va petroglif maydoni turli kayfiyat so‘raydi. Biri suv bo‘yida va ramziy; ikkinchisi shahar tepasidagi ochiq osmon osti arxeologiyasi. Ularni alohida tutish shaharchani aniqroq qiladi."
          - "type": "dashTitle"
            "title":
              "en": "Choose the next move before leaving"
              "ru": "Выберите следующий ход до выезда"
              "uz": "Ketishdan oldin keyingi harakatni tanlang"
            "description":
              "en": "Karakol, Grigorievka-Semenovka, Bokonbayevo, and the south shore all pull the route in different directions. Cholpon-Ata should help that choice, not blur it."
              "ru": "Каракол, Григорьевка и Семёновка, Боконбаево и южный берег тянут маршрут в разные стороны. Чолпон-Ата должна помочь с выбором, а не размыть его."
              "uz": "Karakol, Grigoryevka-Semyonovka, Bokonbayevo va janubiy qirgʻoq yoʻnalishni turli tomonga tortadi. Cholpon-Ata bu tanlovga yordam berishi kerak, uni xiralashtirmasligi kerak."
          - "type": "alert"
            "title":
              "en": "Traveler takeaway"
              "ru": "Что важно для путешественника"
              "uz": "Sayohatchi uchun xulosa"
            "description":
              "en": "Use Cholpon-Ata for lake contact, one focused cultural stop, and a clean decision about where Issyk-Kul goes next."
              "ru": "Чолпон-Ата подходит для контакта с озером, одной точной культурной остановки и ясного решения, куда дальше ведёт Иссык-Куль."
              "uz": "Cholpon-Atani ko‘l bilan aloqa, bitta aniq madaniy to‘xtash va Issiqkoʻl keyin qayerga borishini hal qilish uchun tanlang."
