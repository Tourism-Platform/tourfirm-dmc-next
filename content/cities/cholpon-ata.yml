  "metaDescription":
    "en": "Cholpon-Ata is not the whole lake. It is the practical north-shore town where travelers can slow down after the Bishkek road, touch the water, choose one or two cultural stops, and decide whether the next move is Karakol, the south shore, or a quieter mountain detour."
    "ru": "Чолпон-Ата — не весь Иссык-Куль. Это практичный городок северного берега, где после дороги из Бишкека можно замедлиться, выйти к воде, выбрать одну-две культурные остановки и решить, куда дальше вести маршрут: к Караколу, на южный берег или в более тихую горную сторону."
    "uz": "Cholpon-Ata butun Issiqkoʻl emas. Bu Bishkek yo‘lidan keyin sekinlashish, suvga chiqish, bir-ikki madaniy to‘xtashni tanlash va keyingi harakat Karakol, janubiy qirg‘oq yoki tinchroq togʻ tomonga borishini hal qilish mumkin bo‘lgan amaliy shimoliy qirg‘oq shaharchasi."
