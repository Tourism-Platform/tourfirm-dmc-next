      "ru": "Каракол — главное продолжение на восток, а Бишкек остаётся обычной западной точкой старта или возвращения. Боконбаево и южный берег важны для следующего этапа, но лучше держать их отдельным шагом, а не добавлять к этой компактной остановке."
