        "description":
          "en": "Beside Chorsu's market streets, Kukeldash lowers the tempo. Brick, blue tile, a shaded courtyard, and an active religious and educational setting remind you that old Tashkent is still used with care."
          "ru": "Рядом с рыночными улицами Чорсу Кукельдаш снижает темп. Кирпич, синяя керамика, тенистый двор и действующая религиозно-образовательная среда напоминают, что старый Ташкент не только хранит историю, но и продолжает жить."
          "uz": "Chorsu atrofidagi bozor ko‘chalari yonida Ko‘kaldosh surʼatni pasaytiradi. G‘isht, moviy koshin, soyali hovli va faol diniy-taʼlim muhiti eski Toshkent hali ham ehtiyot bilan foydalaniladigan joy ekanini eslatadi."
