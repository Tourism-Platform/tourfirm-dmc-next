        "description":
          "en": "From the TV Tower, Tashkent stops being separate streets, museums, markets, and squares and becomes one wide capital below you. The 375 m landmark is still a working broadcast tower, so the visit belongs on a confirmed public route, with a view from around 100 m and enough flexib"
          "ru": "С телебашни Ташкент перестаёт быть отдельными улицами, музеями, базарами и площадями: город собирается в широкую столицу под вами. 375-метровая башня остаётся действующим вещательным объектом, поэтому визит строится вокруг подтверждённого публичного маршрута, вида примерно со 100"
          "uz": "Teleminoradan Toshkent alohida ko‘chalar, muzeylar, bozorlar va xiyobonlar yig‘indisi emas, pastda yoyilgan bitta poytaxt bo‘lib ko‘rinadi. 375 metrli minora hanuz amaldagi aloqa inshooti, shuning uchun tashrif tasdiqlangan ochiq yo‘l, taxminan 100 metrlik manzara va kirish o‘zga"
        "ctaHref": "/destinations/uzbekistan/tashkent-region/tashkent/tashkent-tv-tower"
