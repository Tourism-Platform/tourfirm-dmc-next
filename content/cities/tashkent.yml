  - "blockType": "regular"
    "eyebrow":
      "en": "City rhythm"
      "ru": "Ритм города"
      "uz": "Shahar ritmi"
    "title":
      "en": "How Tashkent feels"
      "ru": "Как чувствуется Ташкент"
      "uz": "Toshkent qanday seziladi"
    "description":
      "en": "These are living city moments, not a checklist: tea after the old city, the metro, museum quiet, courtyard lunch, and evening avenues give Tashkent room to breathe."
      "ru": "Это живые городские моменты, а не список галочек: чай после старого города, метро, музейная тишина, обед во дворе и вечерние проспекты оставляют Ташкенту пространство."
      "uz": "Bular roʻyxat emas, tirik shahar lahzalari: eski shahardan keyingi choy, metro, muzey sokinligi, hovlida tushlik va kechki xiyobonlar Toshkentga kenglik qoldiradi."
    "gridClassName": "sm:grid-cols-2 lg:grid-cols-3"
    "cards":
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan/character/tashkent/tashkent-character-1.webp"
        "badge":
          "en": "Food"
          "ru": "Еда"
          "uz": "Taom"
        "title":
          "en": "Courtyard Lunch in the Old City"
          "ru": "Обед во дворе старого города"
          "uz": "Eski shaharda hovli tushligi"
        "description":
          "en": "In a shaded courtyard near the old-city lanes, the table fills slowly: bread torn by hand, greens, soup, and tea poured before the next old-city story. You are not rushing between sights; for a while Tashkent keeps the pace of lunch."
          "ru": "В тенистом дворе у улиц старого города стол наполняется не сразу: ломают лепёшку, ставят зелень, суп и пиалу чая перед следующим рассказом о старом городе. Вы не спешите от места к месту — на время Ташкент идёт в ритме обеда."
          "uz": "Eski shahar ko‘chalari yonidagi soyali hovlida dasturxon sekin to‘ladi: non qo‘l bilan uziladi, ko‘kat, sho‘rva va eski shahar haqidagi navbatdagi hikoyadan oldin choy keladi. Siz joydan joyga shoshmaysiz — bir muddat Toshkent tushlik ritmida yashaydi."
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan/character/tashkent/tashkent-character-2.webp"
        "badge":
          "en": "Craft"
          "ru": "Ремёсла"
          "uz": "Hunarmandchilik"
        "title":
          "en": "Applied Arts Indoors"
          "ru": "Тишина прикладного искусства"
          "uz": "Amaliy sanʼat sokinligi"
        "description":
          "en": "In a museum room, the city becomes quieter: ceramics, embroidery, and carved wood ask for attention rather than speed. You notice pattern, material, and the hands behind them."
          "ru": "В музейной комнате город становится тише: керамика, вышивка и резное дерево требуют не скорости, а внимания. Вы замечаете узор, материал и руки, которые за ними стоят."
          "uz": "Muzey xonasida shahar sokinlashadi: keramika, kashta va o‘yma yog‘och tezlikni emas, eʼtiborni so‘raydi. Siz naqsh, material va ularning ortidagi qo‘llarni sezasiz."
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan/character/tashkent/tashkent-character-3.webp"
        "badge":
          "en": "Culture"
          "ru": "Культура"
          "uz": "Madaniyat"
        "title":
          "en": "Evening on Broad Avenues"
          "ru": "Вечер на проспектах"
          "uz": "Xiyobonlarda kechqurun"
        "description":
          "en": "By evening the city opens wider: fountains, parks, traffic, families walking late, and light caught in the trees. You step out of a museum day into a living capital, where an ordinary evening helps you feel the city."
          "ru": "К вечеру город раскрывается шире: фонтаны, парки, движение, поздние прогулки семей и свет в кронах деревьев. Вы выходите из музейного дня в живую столицу, где обычный вечер помогает почувствовать город."
          "uz": "Kechga borib shahar kengroq ochiladi: favvoralar, bog‘lar, harakat, kechki oilaviy sayrlar va daraxtlardagi yorug‘lik. Siz muzeyli kundan tirik poytaxtga chiqasiz, oddiy kecha esa shaharni his qilishga yordam beradi."
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan/character/tashkent/tashkent-character-4.webp"
        "badge":
          "en": "Culture"
          "ru": "Культура"
          "uz": "Madaniyat"
        "title":
          "en": "Tea near Hazrati Imam"
          "ru": "Чай у Хазрати Имам"
          "uz": "Hazrati Imom yaqinida choy"
        "description":
          "en": "After the mosaic portals and courtyards of the old city, tea feels like part of the route. A cup cools in your hand, the conversation turns toward the mahalla, and Tashkent becomes a calm conversation rather than a list of sights."
          "ru": "После мозаичных порталов и дворов старого города чай кажется частью маршрута. Пиала остывает в руках, разговор уходит к махалле, и Ташкент становится спокойным разговором, а не списком достопримечательностей."
          "uz": "Eski shaharning mozaikali peshtoqlari va hovlilaridan keyin choy yo‘nalishning bir qismiga aylanadi. Piyola qo‘lingizda soviydi, suhbat mahalla tomonga ketadi, Toshkent esa joylar ro‘yxati emas, sokin suhbat bo‘lib qoladi."
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan/character/tashkent/tashkent-character-5.webp"
        "badge":
          "en": "Culture"
          "ru": "Культура"
          "uz": "Madaniyat"
        "title":
          "en": "Metro between Mosaics"
          "ru": "Метро среди мозаик"
          "uz": "Mozaikalar orasida metro"
        "description":
          "en": "A train arrives as if it were ordinary, but the station feels like a hall: marble, lamps, mosaics, and the quiet flow of passengers. You ride not only for transport, but to see how daily Tashkent became architecture."
          "ru": "Поезд приходит как обычный транспорт, но станция выглядит как зал: мрамор, светильники, мозаики и тихий поток пассажиров. Вы едете не только ради дороги, а чтобы увидеть, как повседневный Ташкент стал архитектурой."
          "uz": "Poyezd odatiy transportdek keladi, lekin bekat zalga o‘xshaydi: marmar, chiroqlar, mozaikalar va sokin yo‘lovchilar oqimi. Siz faqat yo‘l uchun emas, kundalik Toshkent qanday meʼmorchilikka aylanganini ko‘rish uchun ham minasiz."
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan/character/tashkent/tashkent-character-6.webp"
        "badge":
          "en": "Food"
          "ru": "Еда"
          "uz": "Taom"
        "title":
          "en": "Morning at Chorsu"
          "ru": "Утро на Чорсу"
          "uz": "Chorsuda tong"
        "description":
          "en": "Under Chorsu’s blue dome, the day starts with hot bread, dried fruit, and voices calling across the stalls. You have time to slow down, taste, ask, and hear how Tashkent wakes up."
          "ru": "Под синим куполом Чорсу день начинается с горячих лепёшек, сухофруктов и голосов продавцов. Вы успеваете замедлиться, попробовать, спросить и услышать, как просыпается Ташкент."
          "uz": "Chorsu ko‘k gumbazi ostida kun issiq non, quritilgan meva va rastalar orasidagi ovozlardan boshlanadi. Siz sekinlashib, tatib ko‘rib, so‘rab va Toshkent qanday uyg‘onishini eshitishga ulgurishingiz mumkin."
  - "blockType": "regular"
    "eyebrow":
      "en": "Before you go"
      "ru": "Перед поездкой"
      "uz": "Safardan oldin"
    "title":
      "en": "How to plan a Tashkent day"
      "ru": "Как выстроить день в Ташкенте"
      "uz": "Toshkent kunini qanday tuzish kerak"
    "description":
      "en": "Tashkent is easier to plan by the rhythm of the day, not by a list of places: arrival, the old city, metro and museum time, then one calm continuation before the mountains or the train onward."
      "ru": "Ташкент проще планировать не списком мест, а ритмом дня: прибытие, старый город, метро и музеи, затем одно спокойное продолжение перед горами или поездом дальше."
      "uz": "Toshkentni joylar roʻyxati emas, kun ritmi orqali rejalashtirish osonroq: kelish, eski shahar, metro va muzeylar, keyin togʻlar yoki keyingi poyezddan oldin bitta sokin davom."
    "rows":
      - "ratio": "2:1"
        "left":
          - "type": "dashTitle"
            "title":
              "en": "Arrival and the first day"
              "ru": "Прибытие и первый день"
              "uz": "Kelish va birinchi kun"
            "description":
              "en": "Most routes begin at the airport or station. A calm transfer, realistic hotel timing, and a short first walk keep the city from becoming only a set of transfers."
              "ru": "Большинство маршрутов начинается в аэропорту или на вокзале. Спокойный трансфер, понятное заселение и короткая первая прогулка помогают городу не превратиться в набор пересадок."
              "uz": "Koʻp yoʻnalish aeroport yoki vokzaldan boshlanadi. Sokin transfer, aniq joylashish va qisqa birinchi sayr shaharni faqat ko‘chishlar to‘plamiga aylantirmaydi."
          - "type": "quote"
            "quote":
              "en": "Tashkent opens the journey better when the first day does not try to show the whole city at once."
              "ru": "Ташкент лучше открывает маршрут, когда первый день не пытается показать весь город сразу."
              "uz": "Toshkent birinchi kun butun shaharni birdan ko‘rsatishga urinmaganda yoʻnalishni yaxshiroq ochadi."
          - "type": "dashTitle"
            "title":
              "en": "Old city and markets"
              "ru": "Старый город и рынки"
              "uz": "Eski shahar va bozorlar"
            "description":
              "en": "Chorsu, Khast Imam, Kukeldash, and nearby mahalla lanes are easier to feel in the morning, when it is simpler to move between courtyards, the bazaar, and old-city streets."
              "ru": "Чорсу, Хаст-Имам, Кукельдаш и ближайшие махалли лучше воспринимаются утром, когда легче двигаться между дворами, базаром и улицами старого города."
              "uz": "Chorsu, Hazrati Imom, Koʻkaldosh va yaqin mahallalar tongda yaxshiroq seziladi, chunki hovlilar, bozor va eski shahar ko‘chalari orasida harakat qilish osonroq."
          - "type": "dashTitle"
            "title":
              "en": "Museums, metro, and modern city"
              "ru": "Музеи, метро и современный город"
              "uz": "Muzeylar, metro va zamonaviy shahar"
            "description":
              "en": "Metro stations, the Applied Arts Museum, history museums, city squares, modernist avenues, and new cultural spaces show the capital without rushing. A day is clearer with one such continuation, not every stop at once."
              "ru": "Станции метро, Музей прикладного искусства, исторические музеи, городские площади, модернистские проспекты и новые культурные пространства показывают столицу без спешки. В один день лучше оставить одно такое продолжение, а не все остановки сразу."
              "uz": "Metro bekatlari, Amaliy sanʼat muzeyi, tarix muzeylari, shahar maydonlari, modernistik xiyobonlar va yangi madaniy maydonlar poytaxtni shoshmasdan ko‘rsatadi. Kun aniqroq bo‘lishi uchun hamma bekatni emas, shunday bitta davomni tanlash yetadi."
          - "type": "dashTitle"
            "title":
              "en": "Mountains or onward route"
              "ru": "Горы или продолжение"
              "uz": "Togʻlar yoki davom"
            "description":
              "en": "Chimgan and Charvak can give the route air, but they need a clear road-and-weather check. Some journeys keep Tashkent as a city day; others let it become a calm start before the mountain road or the train to Samarkand."
              "ru": "Чимган и Чарвак добавляют маршруту воздух, но им нужны понятные дорога и погода. Иногда Ташкент остаётся городским днём, иногда становится спокойным стартом перед горной дорогой или поездом в Самарканд."
              "uz": "Chimyon va Chorvoq yoʻnalishga havo qoʻshadi, lekin yoʻl va ob-havo aniq boʻlishi kerak. Baʼzi safarlarda Toshkent shahar kuni boʻlib qoladi, boshqalarida esa togʻ yoʻli yoki Samarqand poyezdi oldidan sokin boshlanishga aylanadi."
          - "type": "alert"
            "title":
              "en": "For travelers"
              "ru": "Для путешественника"
              "uz": "Sayohatchi uchun"
            "description":
              "en": "If you do not try to see everything at once, Tashkent becomes a clear first day of the route: old-city morning, metro or museum time, then one outing or the train onward."
              "ru": "Если не пытаться увидеть всё сразу, Ташкент становится понятным первым днём маршрута: утро в старом городе, метро или музей, затем один выезд или поезд дальше."
              "uz": "Hammasini birdan ko‘rishga urinmasangiz, Toshkent yo‘nalishning tushunarli birinchi kuniga aylanadi: eski shahar tongi, metro yoki muzey vaqti, keyin bitta chiqish yoki keyingi poyezd."
        "right":
          - "type": "miniTable"
            "title":
              "en": "Before you go"
              "ru": "Перед поездкой"
              "uz": "Safardan oldin"
            "icon": "Circle"
            "rows":
              - "icon": "MapPin"
                "title":
                  "en": "At a glance Stay"
                  "ru": "Коротко Срок"
                  "uz": "Qisqacha Muddat"
                "description":
                  "en": "1-2 nights; add one more for museums, architecture, mountains, or late arrivals."
                  "ru": "1-2 ночи; ещё одна для музеев, архитектуры, гор или позднего прилёта."
                  "uz": "1-2 kecha; muzeylar, meʼmorchilik, togʻlar yoki kech kelish uchun yana bir kecha."
              - "icon": "Landmark"
                "title":
                  "en": "Getting there"
                  "ru": "Как добраться"
                  "uz": "Qanday borish"
                "description":
                  "en": "Most international travelers enter Uzbekistan through Tashkent International Airport."
                  "ru": "Большинство международных путешественников въезжает в Узбекистан через Международный аэропорт Ташкента."
                  "uz": "Xalqaro sayohatchilarning koʻpi Oʻzbekistonga Toshkent xalqaro aeroporti orqali kiradi."
              - "icon": "Sun"
                "title":
                  "en": "Getting around"
                  "ru": "По городу"
                  "uz": "Shahar ichida"
                "description":
                  "en": "The metro, short taxi rides, and planned transfers keep the day comfortable; the old-city sights are not all walking distance from the modern centre."
                  "ru": "Метро, короткие такси и трансферы помогают соединить день без лишней спешки; старогородские места не всегда рядом с современным центром."
                  "uz": "Metro, qisqa taksi safarlari va transferlar kunni shoshirmasdan bogʻlaydi; eski shahar joylari doim markazdan piyoda masofada emas."
              - "icon": "Route"
                "title":
                  "en": "Season and pace"
                  "ru": "Сезон и темп"
                  "uz": "Mavsum va ritm"
                "description":
                  "en": "Spring and autumn are easiest for walks; summer needs early city time, metro and museum shade, and later starts; winter keeps museums and the metro strong."
                  "ru": "Весна и осень удобнее для прогулок; летом нужны ранние городские часы, тень метро и музеев, более поздние выходы; зимой сильнее музеи и метро."
                  "uz": "Bahor va kuz sayrlar uchun osonroq; yozda erta shahar vaqti, metro va muzey soyasi, kechroq chiqishlar kerak; qishda muzeylar va metro kuchliroq bo‘ladi."
  - "blockType": "regular"
    "eyebrow":
      "en": "Tour programs"
      "ru": "Турпрограммы"
      "uz": "Tur dasturlari"
    "title":
      "en": "Journeys that include Tashkent"
