      "ru": "Следующий шаг чаще всего ведёт к горному воздуху, воде Чарвака или скоростной железной дороге в сторону Самарканда."
      "uz": "Keyingi qadam koʻpincha togʻ havosi, Chorvoq suvi yoki Samarqand tomonga tezyurar temiryoʻl davomiga olib boradi."
