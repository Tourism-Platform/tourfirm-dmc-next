          "en": "Sheikhantaur is easy to miss if you read Tashkent only through traffic, markets and landmark squares. Behind the surrounding city streets, three preserved mausoleums remember Sheikh Hovendi at-Tahur, Kaldyrgach-biy and Yunus Khan, adding a quiet old-city pause after Chorsu, Kukel"
          "ru": "Шейхантаур легко пропустить, если смотреть на Ташкент только через движение, базары и главные площади. Среди городских улиц три сохранившихся мавзолея хранят память о шейхе Ховенди ат-Тахуре, Калдыргач-бие и Юнус-хане, добавляя тихую паузу старого города после Чорсу, Кукельдаша и"
          "uz": "Agar Toshkentni faqat harakat, bozorlar va katta maydonlar orqali ko‘rsangiz, Shayxontohur ko‘zdan qochishi mumkin. Shahar ko‘chalari orasida uchta saqlangan maqbara Shayx Xovandi Tohur, Qaldirg‘ochbiy va Yunusxon xotirasini tutib turadi; Chorsu, Ko‘kaldosh va Hazrati Imomdan key"
        "ctaHref": "/destinations/uzbekistan/tashkent-region/tashkent/sheikhantaur-ensemble"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
