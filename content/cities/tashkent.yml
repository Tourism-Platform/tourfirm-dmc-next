          "uz": "Chimyon Toshkent yoʻnalishiga eng yaqin togʻ burilishini beradi: togʻoldi yoʻllari, Chorvoq suvi, ochiq yonbagʻirlar, kurort chiqishlari va sharoit mos boʻlsa gidli daralar."
