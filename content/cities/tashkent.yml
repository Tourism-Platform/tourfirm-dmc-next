        "description":
          "en": "At the State Museum of Applied Arts, the building teaches the eye before the vitrines do. Painted panels, carved columns, wooden doors, ceramics, embroidery, jewelry, textiles, and ganch detail make applied art something you can read room by room."
          "ru": "В этом музее сначала работает само здание. Расписные панели, резные колонны, деревянные двери, керамика, вышивка, украшения, ткани и ганч превращают прикладное искусство из музейного раздела в то, что можно рассматривать комнату за комнатой."
          "uz": "Bu muzeyda avval binoning o‘zi ko‘zni tayyorlaydi. Naqshli panellar, o‘yma ustunlar, yog‘och eshiklar, kulolchilik, kashta, zargarlik, matolar va ganch amaliy sanʼatni muzey bo‘limidan xonama-xona ko‘riladigan tajribaga aylantiradi."
