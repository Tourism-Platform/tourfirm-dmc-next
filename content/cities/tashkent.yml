          "uz": "Suzuk Ota majmuasi"
        "description":
          "en": "Near Chorsu, Suzuk-Ota slows the old-city route down. The complex brings together a mosque, mausoleum, restored mahalla space and craft tradition, so Tashkent's religious memory meets the handwork of its craftspeople."
          "ru": "Рядом с Чорсу Сузук-Ота замедляет маршрут по старому городу. Комплекс соединяет мечеть, мавзолей, восстановленную махаллинскую среду и ремесленную традицию, так что религиозная память Ташкента встречается с живым ручным трудом мастеров."
          "uz": "Chorsu yaqinida Suzuk Ota eski shahar yo‘lini sekinlashtiradi. Majmua masjid, maqbara, tiklangan mahalla muhiti va hunarmandchilik anʼanasini birlashtiradi; Toshkentning diniy xotirasi ustalarning qo‘l mehnati bilan yonma-yon ko‘rinadi."
        "ctaHref": "/destinations/uzbekistan/tashkent-region/tashkent/suzuk-ota-complex"
