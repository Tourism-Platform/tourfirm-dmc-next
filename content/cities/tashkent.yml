        "description":
          "en": "Amir Temur Square gives the monument; the museum gives the story room to settle. Inside the round turquoise-domed building, murals, a crystal chandelier, maps, models, miniatures, and display cases point the Tashkent visit onward to Samarkand and Shakhrisabz."
          "ru": "В сквере вы видите памятник; в музее тема успевает сложиться. Внутри круглого здания с бирюзовым куполом росписи, хрустальная люстра, карты, макеты, миниатюры и витрины ведут ташкентский визит дальше — к Самарканду и Шахрисабзу."
          "uz": "Xiyobonda yodgorlikni ko‘rasiz; muzey esa mavzuni sekinroq tushuntiradi. Feruza gumbazli yumaloq bino ichida devoriy suratlar, billur qandil, xaritalar, maketlar, miniatyuralar va vitrinalar Toshkent tashrifini Samarqand hamda Shahrisabz tomonga davom ettiradi."
        "ctaHref": "/destinations/uzbekistan/tashkent-region/tashkent/state-museum-of-temurids-history"
