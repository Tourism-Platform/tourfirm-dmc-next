    "description":
      "en": "Tashkent usually opens or closes a journey through Uzbekistan: arrival, the old city, the metro, museums, a Chimgan outing, or the train onward meet here naturally."
      "ru": "Ташкент чаще всего открывает или завершает поездку по Узбекистану: прилёт, старый город, метро, музеи, выезд к Чимгану или поезд дальше удобно сходятся здесь."
      "uz": "Toshkent odatda Oʻzbekiston bo‘ylab sayohatni boshlaydi yoki yakunlaydi: kelish, eski shahar, metro, muzeylar, Chimyon chiqishi yoki keyingi poyezd shu yerda tabiiy tutashadi."
