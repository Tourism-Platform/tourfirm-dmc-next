  - blockType: regular
    eyebrow:
      en: Day plan
      ru: План на день
      uz: Kunlik reja
    title:
      en: A day in Tashkent — the highlights
      ru: День в Ташкенте — главное
      uz: Toshkentda bir kun — asosiy nuqtalar
    description:
      en: "A compact loop through old and modern Tashkent.\n\n• Morning: Khazrati Imam complex or Chorsu Bazaar in the old city.\n• Midday: plov lunch, then Amir Timur Museum or Applied Arts Museum.\n• Afternoon: metro architecture tour or Minor Mosque on the canal.\n• Evening: Broadway promenade, dinner and optional opera or theatre."
      ru: "Компактный маршрут по старому и новому Ташкенту.\n\n• Утро: комплекс Хазрати Имам или базар Чорсу в старом городе.\n• Полдень: обед с пловом, затем музей Амира Тимура или музей прикладного искусства.\n• День: архитектура метро или мечеть Минор на канале.\n• Вечер: прогулка по Broadway, ужин и по желанию опера или театр."
      uz: "Eski va zamonaviy Toshkent bo'ylab ixcham marshrut.\n\n• Ertalab: eski shaharda Hazrati Imom majmuasi yoki Chorsu bozori.\n• Tushlik: palov, keyin Amir Temur muzeyi yoki amaliy san'at muzeyi.\n• Kunduzi: metro me'morchiligi yoki Anhor kanalidagi Minor masjidi.\n• Kechqurun: Broadway sayr, kechki ovqat va ixtiyoriy opera yoki teatr."

