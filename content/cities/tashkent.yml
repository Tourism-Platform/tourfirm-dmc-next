          "ru": "Между широкими проспектами, деревьями, метро рядом и бронзовым конным памятником сквер даёт Ташкенту понятную центральную точку. Лучше оставить его компактной остановкой: увидеть памятник и зелёную часть, а затем продолжить к метро, музеям или улицам старого города."
