        "description":
          "en": "Khast Imam gathers old Tashkent at a calmer scale: courtyards, tiled portals, madrasahs, mosques, shade, and a manuscript tradition. After the movement of Chorsu, the ensemble gives the city a quieter voice."
          "ru": "Комплекс Хазрати Имам собирает старый Ташкент в спокойном масштабе: открытые дворы, мозаичные порталы, медресе, мечети, тень и историю рукописей. После движения Чорсу здесь появляется пауза, и старый город затихает."
          "uz": "Hazrati Imom majmuasi eski Toshkentni sokin ritmda ochadi: ochiq hovlilar, koshinli peshtoqlar, madrasalar, masjidlar, soya va qoʻlyozmalar tarixi. Chorsudagi harakatdan keyin bu yer shaharni sekinroq his qilishga imkon beradi."
