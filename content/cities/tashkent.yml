        "title":
          "en": "Tashkent Metro"
          "ru": "Ташкентское метро"
          "uz": "Toshkent metrosi"
        "description":
          "en": "In Tashkent, the metro is not only a way across town. You step below the streets and find blue arches, marble, lamps, mosaics, portraits of poets and thinkers, space-themed Kosmonavtlar, and people moving through the capital as usual."
          "ru": "В Ташкенте метро — не только способ пересечь город. Вы спускаетесь под улицы и видите синие арки, мрамор, светильники, мозаики, портреты поэтов и мыслителей, космический Космонавтлар и людей, которые едут по столице как обычно."
          "uz": "Toshkentda metro shaharni kesib o‘tishning oddiy usuli emas. Siz ko‘cha ostiga tushasiz va ko‘k ravoqlar, marmar, chiroqlar, mozaikalar, shoir va mutafakkirlar portretlari, kosmik mavzudagi Kosmonavtlar hamda poytaxt bo‘ylab odatdagidek ketayotgan odamlarni ko‘rasiz."
        "ctaHref": "/destinations/uzbekistan/tashkent-region/tashkent/tashkent-metro"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
      - "type": "routeIdea"
