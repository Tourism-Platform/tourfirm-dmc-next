        "description":
          "en": "The facade is already part of the story: a cube-like 1970 building wrapped in pale geometric screens. When the museum is open, the visit can move from that modernist shell into Uzbekistan's deeper historical arc; during repairs, it belongs only as a short exterior architecture pa"
          "ru": "Фасад уже часть истории: кубическое здание 1970 года с бледными геометрическими экранами. Когда музей открыт, визит переходит из этой модернистской оболочки к большой истории страны; пока идёт ремонт, место лучше воспринимать как короткую архитектурную остановку, если доступ внут"
          "uz": "Fasadning o‘zi ham hikoyaning bir qismi: 1970 yildagi kubsimon bino och rangli geometrik ekranlar bilan o‘ralgan. Kirish ochiq bo‘lsa, tashrif shu modernistik qobiqdan mamlakatning chuqurroq tarixiga o‘tadi; taʼmir davom etsa, kirish tasdiqlanmaguncha bu joy qisqa tashqi meʼmoriy"
        "ctaHref": "/destinations/uzbekistan/tashkent-region/tashkent/state-museum-of-history-of-uzbekistan"
