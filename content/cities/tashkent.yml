        "description":
          "en": "Minor Mosque gives Tashkent a bright contemporary landmark: white marble, two slim minarets, a turquoise dome and gardens beside the Ankhor canal. The visit feels strongest when it stays respectful, unhurried and aware of prayer-time rhythm."
          "ru": "Мечеть Минор даёт Ташкенту яркий современный ориентир: белый мрамор, два тонких минарета, бирюзовый купол и сад у канала Анхор. Место раскрывается лучше, когда визит остаётся уважительным, неспешным и внимательным к ритму молитвы."
          "uz": "Minor masjidi Toshkentga yorqin zamonaviy mo‘ljal beradi: oq marmar, ikki ingichka minora, feruza gumbaz va Anhor kanali bo‘yidagi bog‘. To‘xtam ehtiromli, shoshilmagan va namoz vaqti ritmiga sezgir bo‘lsa, taʼsiri kuchliroq bo‘ladi."
