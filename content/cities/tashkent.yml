"excerpt":
  "en": "Tashkent often begins with motion: an early flight, a train platform, the smell of bread near Chorsu, then the metro, museums, and wide avenues. It is not Uzbekistan’s postcard city, and that is why it matters. The city helps you enter the country in the present tense: through Hazrati Imam and Chorsu, metro stations, museum rooms, city squares, and the road to Chimgan."
  "ru": "Ташкент часто начинается с движения: ранний рейс, перрон, запах лепёшек у Чорсу, потом метро, музеи и широкие проспекты. Это не открыточный образ Узбекистана — и именно поэтому город важен. Он помогает войти в страну в настоящем времени: через Хазрати Имам и Чорсу, станции метро, музейные залы, городские площади и дорогу к Чимгану."
  "uz": "Toshkent ko‘pincha harakatdan boshlanadi: erta reys, vokzal perroni, Chorsu yaqinidagi non hidi, keyin metro, muzeylar va keng xiyobonlar. Bu Oʻzbekistonning klassik sayyohlik manzarasi emas — shuning uchun ham muhim. Shahar mamlakatga bugungi ritmda kirishga yordam beradi: Hazrati Imom va Chorsu, metro bekatlari, muzey zallari, shahar maydonlari va Chimyon tomonga yo‘l orqali."
