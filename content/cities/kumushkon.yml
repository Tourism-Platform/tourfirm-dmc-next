  "metaDescription":
    "en": "Kumushkon sits in Parkent District, close enough to Tashkent for a softer foothill outing and local enough to slow the route down. Official tourism-village status gives it a public place in the Parkent story; clean air, everyday households, heritage cues, and sacred-site etiquette give the visit its human scale. The stop is strongest when the arrival point, local welcome, meal, road timing, and Chashma pairing are set close to travel."
    "ru": "Кумушкан находится в Паркентском районе, достаточно близко к Ташкенту для мягкого выезда в предгорья и достаточно по-сельски, чтобы замедлить маршрут. Официальный статус туристического села даёт ему место в истории Паркента; чистый воздух, дворовая жизнь, наследие и этикет святынь добавляют человеческий масштаб. Визит лучше раскрывается, когда точка прибытия, встреча на месте, еда, дорога и пара с Чашмой согласованы ближе к поездке."
    "uz": "Kumushkon Parkent tumanida, Toshkentdan yumshoq tog‘oldi chiqishi uchun yetarlicha yaqin va yo‘lni sekinlatadigan darajada qishloqona joylashgan. Rasmiy turizm qishlog‘i maqomi uni Parkent yo‘nalishida asosli qiladi; toza havo, xonadon hayoti, meros belgilari va ziyorat odobi tashrifga insoniy o‘lcham beradi. Kelish nuqtasi, joydagi uchrashuv, ovqat, yo‘l vaqti va Chashma bilan juftlik safarga yaqin belgilanganda Kumushkon eng yaxshi ochiladi."
