              "ru": "Используйте Хорог для прогулки, отдыха, проверки дороги и внимательного выбора одного высокогорного направления."
              "uz": "Xorugʻda yuring, dam oling, yoʻlni tekshiring va bitta baland yoʻnalishni ehtiyotkorlik bilan tanlang."
