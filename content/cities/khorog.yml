    "description":
      "en": "From Khorog, the route can return toward Dushanbe, reconnect with Zeravshan through Penjikent, or move deeper into Pamir & GBAO through Ishkashim, Wakhan, Murghab, Bartang, and Karakul when current conditions support it."
      "ru": "Из Хорога маршрут может вернуться к Душанбе, выйти к Зеравшану через Пенджикент или уйти глубже в Памир и ГБАО через Ишкашим, Вахан, Мургаб, Бартанг и Каракуль, если текущие условия это позволяют."
      "uz": "Xorugʻdan yoʻnalish Dushanbe tomonga qaytishi, Panjikent orqali Zarafshonga chiqishi yoki joriy sharoitlar imkon bersa, Ishkashim, Vaxon, Murgʻob, Bartang va Qorakoʻl orqali Pomir va GBAO ichkarisiga chuqurroq kirishi mumkin."
