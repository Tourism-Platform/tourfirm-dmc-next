                  "ru": "Хорог помогает выбрать между Ваханом, Бартангом, Мургабом, высокими озёрами или дорогой обратно на запад."
                  "uz": "Xorugʻ Vaxon, Bartang, Murgʻob, baland koʻllar yoki gʻarbga qaytish yoʻli orasidan tanlashga yordam beradi."
