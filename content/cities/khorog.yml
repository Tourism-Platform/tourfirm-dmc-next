    "ru": "Хорог | TourLink"
    "uz": "Xorugʻ | TourLink"
  "metaDescription":
    "en": "Khorog sits where the Panj and Gunt river valleys make the Pamir road feel like a town again. After the long approach, travelers can walk near the water, breathe river air, and check permits, weather, road reports, and the next valley before the route climbs higher."
    "ru": "Хорог стоит там, где долины Пянджа и Гунта снова превращают памирскую дорогу в город. После долгого подъезда здесь можно пройтись у воды, почувствовать речной воздух и проверить разрешения, погоду, состояние дороги и следующую долину перед новым набором высоты."
    "uz": "Xorugʻ Panj va Gunt vodiylari Pomir yoʻlini yana shaharga aylantiradigan joyda turadi. Uzoq yoʻldan keyin bu yerda suv bo‘yida yurish, daryo havosini his qilish va yoʻl balandroqqa ko‘tarilishidan oldin ruxsatnoma, ob-havo, yoʻl holati hamda keyingi vodiyni tekshirish mumkin."
