          "ru": "Мавзолей Аль-Хакима ат-Термизи добавляет к маршруту по Термезу учёную и паломническую сторону города. Рядом с Древним Термезом комплекс соединяет мавзолей, мечеть, ханаку и память о Термез-ота."
          "uz": "Al-Hakim at-Termiziy maqbarasi Termiz yo‘nalishiga shaharning ilmiy va ziyorat tomonini qo‘shadi. Qadimgi Termiz yaqinidagi majmua maqbara, masjid, xonaqoh va Termiz-ota xotirasini birlashtiradi."
