          "en": "Fayaz Tepa"
          "ru": "Фаязтепа"
          "uz": "Fayoztepa"
        "description":
          "en": "Fayaz Tepa gives Termez a different kind of scale: not a portal or skyline, but a Buddhist monastery site on open ground near Old Termez. Low walls, stupa remains, and museum context help the southern route turn from monuments to archaeology."
          "ru": "Фаязтепа даёт Термезу другой масштаб: здесь нет портала или силуэта на горизонте, зато есть буддийский монастырский комплекс на открытой земле у Старого Термеза. Низкие стены, следы ступы и музейный контекст разворачивают южный маршрут от памятников к археологии."
          "uz": "Fayoztepa Termizga boshqacha miqyos beradi: bu portal yoki ufqdagi siluet emas, Eski Termiz yonidagi ochiq maydonda turgan buddaviy monastir majmuasi. Past devorlar, stupa izlari va muzey konteksti janubiy yo‘nalishni yodgorliklardan arxeologiyaga buradi."
        "ctaHref": "/destinations/uzbekistan/surkhandarya/termez/fayaz-tepa"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
