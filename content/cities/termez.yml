    "description":
      "en": "Termez needs a calmer plan than a quick add-on after the classic cities. Start with the museum or an introductory stop, then move to Ancient Termiz, Buddhist remains, shrine courtyards, and the route toward Boysun with heat and access in mind."
      "ru": "Термезу нужен более спокойный план, чем быстрая добавка после классических городов. Начните с музея или вводной остановки, затем переходите к Древнему Термезу, буддийским памятникам, дворам святынь и дороге к Байсуну с учётом жары и доступа."
      "uz": "Termiz klassik shaharlardan keyingi tez qo‘shimcha emas, sokinroq reja talab qiladi. Muzey yoki kirish bekatidan boshlang, keyin Qadimgi Termiz, buddaviy joylar, ziyorat hovlilari va Boysun tomonga yo‘lni issiq va kirish imkoniyatini hisobga olib davom ettiring."
