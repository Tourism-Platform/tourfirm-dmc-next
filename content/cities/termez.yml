          "en": "Sultan Saodat brings brick mausoleums, ayvans, and a long courtyard into the Termez route. Built around the burial places of the Termez Seyyids over several centuries, the complex adds an Islamic memorial setting after the Buddhist and Kushan sites."
          "ru": "Султан-Саодат добавляет к маршруту по Термезу кирпичные мавзолеи, айваны и длинный двор. Комплекс формировался несколько веков вокруг захоронений термезских сейидов и показывает исламский мемориальный контекст после буддийских и кушанских мест."
          "uz": "Sulton Saodat Termiz yo‘nalishiga g‘isht maqbaralar, ayvonlar va uzun hovlini qo‘shadi. Termiz sayyidlari dafn joylari atrofida bir necha asr davomida shakllangan majmua buddaviy va Kushon yodgorliklaridan keyin islomiy memorial kontekstni ko‘rsatadi."
