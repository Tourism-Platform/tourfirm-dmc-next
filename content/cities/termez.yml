            "ru": "Байсун уместен, когда маршрут может выйти из Термеза к хребтам, дорогам селений, музыке и более прохладной горной среде, а не как спешная добавка."
            "uz": "Boysun Termizdan tizmalar, qishloq yo‘llari, musiqa va salqinroq tog‘ muhitiga chiqadigan yo‘nalishga mos; uni shoshilinch qo‘shimcha bekatga aylantirmaslik kerak."
