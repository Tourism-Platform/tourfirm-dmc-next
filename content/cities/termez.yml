          "uz": "Termizda guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "2–3 nights is usually enough when the old core or main anchors get a full walking window. City tone: “Ancient Termiz, Buddhist sites, and the Amu Darya edge”."
          "ru": "Обычно хватает 2–3 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Древний Термез, буддийские памятники и Амударья»."
          "uz": "Odatda 2–3 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Qadimgi Termiz, buddaviy yodgorliklar va Amudaryo»."
      - "type": "destinationInsight"
        "icon": "Landmark"
        "title":
          "en": "Should Termez be a walkable core or a base for day trips?"
          "ru": "Термез — это пешеходное ядро или база для выездов?"
          "uz": "Termiz piyoda yadroimi yoki chiqishlar uchun baza?"
        "description":
          "en": "Start with the compact city walk first. Day trips only after the centre has settled — otherwise the stop feels like a transfer with monuments attached."
          "ru": "Сначала компактная городская прогулка. Выезды — только после того, как центр «сел»; иначе остановка ощущается как трансфер с памятниками."
          "uz": "Avval ixcham shahar sayri. Chiqishlar — markaz joylashgandan keyin; aks holda bekat yodgorlikli transferdek tuyuladi."
