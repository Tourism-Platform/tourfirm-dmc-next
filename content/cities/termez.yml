            "ru": "Султан-Саодат и Хаким ат-Термизи переводят маршрут от открытой археологии к кирпичным дворам, молитвенным пространствам и памяти людей, связанных с Термезом."
            "uz": "Sulton Saodat va Hakim at-Termiziy yo‘nalishni ochiq arxeologiyadan g‘isht hovlilar, ibodat makonlari va Termizda eslanadigan insonlar xotirasiga olib kiradi."
