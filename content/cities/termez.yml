          "ru": "Дворы святынь"
          "uz": "Ziyorat hovlilari"
        "description":
          "en": "Sultan Saodat and Al-Hakim at-Termezi bring the route into brick courtyards, prayer spaces, and people remembered in Termez after the open archaeological sites."
          "ru": "Султан-Саодат и Аль-Хаким ат-Термизи переводят маршрут после открытых археологических площадок к кирпичным дворам, молитвенным пространствам и памяти людей Термеза."
          "uz": "Sulton Saodat va Al-Hakim at-Termiziy ochiq arxeologik joylardan keyin yo‘nalishni g‘isht hovlilar, ibodat makonlari va Termizda eslanadigan insonlar xotirasiga olib kiradi."
