      "en": "Termez is not only a list of monuments: museum rooms before the sites, clay walls under open sky, shrine courtyards, and the Amu Darya close to the southern edge."
      "ru": "Термез держится не только на памятниках: музей перед выездом, глиняные стены под открытым небом, дворы святынь и близость Амударьи на южном краю маршрута."
      "uz": "Termiz faqat yodgorliklar ro‘yxati emas: yo‘lga chiqishdan oldingi muzey, ochiq osmon ostidagi loy devorlar, ziyorat hovlilari va janubiy chetga yaqin Amudaryo."
    "gridClassName": "sm:grid-cols-2 lg:grid-cols-3"
    "cards":
      - "type": "experience"
