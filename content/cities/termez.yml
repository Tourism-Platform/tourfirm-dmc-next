          "en": "Zurmala gives Termez's Buddhist past one clear surviving form: a rounded brick stupa near the Ancient Termiz archaeological area. It is easier to understand after the museum and beside Fayaz Tepa, when finds, monastery walls, and the stupa support the same story."
          "ru": "Зурмала даёт буддийскому прошлому Термеза ясную сохранившуюся форму: округлую кирпичную ступу рядом с археологическим районом Древнего Термеза. Её проще понять после музея и рядом с Фаязтепой, когда находки, монастырские стены и ступа читаются вместе."
          "uz": "Zurmala Termizning buddaviy o‘tmishiga aniq saqlanib qolgan shakl beradi: Qadimgi Termiz arxeologik hududi yonidagi yumaloq g‘isht stupa. Uni muzeydan keyin va Fayoztepa bilan birga tushunish osonroq; topilmalar, monastir devorlari va stupa bir mavzuni davom ettiradi."
