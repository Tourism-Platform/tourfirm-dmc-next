"excerpt":
  "en": "Termez changes the pace of an Uzbekistan journey. Here the route moves from classic city monuments to Ancient Termiz, Buddhist monastery sites, the archaeology museum, shrine courtyards, and the Amu Darya edge. It feels strongest when the first stop gives context before you go out to the open sites."
  "ru": "Термез меняет темп путешествия по Узбекистану. Здесь маршрут уходит от классических городских памятников к Древнему Термезу, буддийским монастырским местам, археологическому музею, дворам святынь и Амударье. Сильнее всего город раскрывается, когда сначала появляется музейный контекст, а затем открытые площадки за городом."
  "uz": "Termiz O‘zbekiston bo‘ylab sayohat surʼatini o‘zgartiradi. Bu yerda yo‘nalish klassik shahar yodgorliklaridan Qadimgi Termiz, buddaviy monastir joylari, arxeologiya muzeyi, ziyorat hovlilari va Amudaryoga tomon o‘tadi. Avval muzey konteksti paydo bo‘lib, keyin shahar tashqarisidagi ochiq joylarga chiqilganda Termiz kuchliroq ochiladi."
