          "ru": "Кырк-Кыз без простых ответов"
          "uz": "Qirq Qiz oson javoblarsiz"
        "description":
          "en": "Kirk Kiz adds a different ruin to the Termez route: square clay walls, uncertain stories, and the need to separate legend from what the site can actually show."
          "ru": "Кырк-Кыз добавляет к маршруту по Термезу другой тип руин: квадратные глиняные стены, неясные версии и необходимость отделять легенду от того, что место действительно показывает."
          "uz": "Qirq Qiz Termiz yo‘nalishiga boshqa turdagi xarobani qo‘shadi: kvadrat loy devorlar, noaniq hikoyalar va afsonani joy ko‘rsata oladigan narsadan ajratish zarurati."
