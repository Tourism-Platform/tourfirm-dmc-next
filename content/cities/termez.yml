          "en": "Termez Archaeological Museum"
          "ru": "Археологический музей Термеза"
          "uz": "Termiz arxeologiya muzeyi"
        "description":
          "en": "Start here when the Termez route needs context before the open sites. The museum connects Buddhist fragments, Kushan-era material, ceramics, stone objects, and maps with the places outside the city, from Fayaz Tepa to Zurmala and Ancient Termiz."
          "ru": "Начинайте здесь, если маршруту по Термезу нужен контекст перед открытыми площадками. Музей связывает буддийские фрагменты, материалы кушанского времени, керамику, каменные предметы и карты с местами за городом — от Фаязтепы до Зурмалы и Древнего Термеза."
          "uz": "Ochiq maydonlarga chiqishdan oldin Termiz yo‘nalishiga kontekst kerak bo‘lsa, shu yerdan boshlash qulay. Muzey buddaviy topilmalar, Kushon davri materiallari, sopol, tosh buyumlar va xaritalarni shahar tashqarisidagi joylar — Fayoztepa, Zurmala va Qadimgi Termiz bilan bog‘laydi."
        "ctaHref": "/destinations/uzbekistan/surkhandarya/termez/termez-archaeological-museum"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
