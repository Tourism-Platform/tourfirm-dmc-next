          "en": "Outside the modern city, Ancient Termiz turns history into ground underfoot: low walls, citadel traces, Buddhist sites, and the wider southern landscape."
          "ru": "За современным городом Древний Термез превращает историю в местность под ногами: низкие стены, следы цитадели, буддийские места и широкий южный ландшафт."
          "uz": "Zamonaviy shahardan tashqarida Qadimgi Termiz tarixni oyoq ostidagi joyga aylantiradi: past devorlar, qalʼa izlari, buddaviy joylar va keng janubiy manzara."
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan/character/termez/termez-character-3.webp"
        "badge":
