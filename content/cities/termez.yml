        "icon": "Hotel"
        "title":
          "en": "Where should overnight be relative to Termez's centre?"
          "ru": "Где лучше ночевать относительно центра Термез?"
          "uz": "Termiz markaziga nisbatan qayerda tunash yaxshi?"
        "description":
