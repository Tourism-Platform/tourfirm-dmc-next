          "ru": "Древний Термез возвращает маршруту по Термезу древний масштаб. К западу от современного города следы цитадели, буддийские места, остатки ступ, дороги к святыням и Амударья связывают музей, Фаязтепу, Зурмалу и поздние мемориалы в один южный ландшафт."
