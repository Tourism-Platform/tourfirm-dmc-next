          "en": "Museum rooms give the ruins outside Termez a first shape: Kushan material, Buddhist fragments, ceramics, and the questions to carry toward Old Termez."
          "ru": "Музейные залы дают руинам за Термезом первую форму: кушанский материал, буддийские фрагменты, керамику и вопросы, с которыми стоит ехать к Старому Термезу."
          "uz": "Muzey zallari Termiz tashqarisidagi xarobalarga birinchi shakl beradi: Kushon materiali, buddaviy bo‘laklar, sopol buyumlar va Eski Termizga olib boriladigan savollar."
      - "type": "experience"
