          "en": "Road toward Boysun"
          "ru": "Дорога к Байсуну"
          "uz": "Boysun tomonga yo‘l"
        "description":
          "en": "When the route continues, Boysun moves Surkhandarya from Termez archaeology toward ridges, village roads, music, and a cooler mountain setting."
          "ru": "Когда маршрут продолжается, Байсун переводит Сурхандарью от археологии Термеза к хребтам, дорогам селений, музыке и более прохладной горной среде."
          "uz": "Yo‘nalish davom etsa, Boysun Surxondaryoni Termiz arxeologiyasidan tizmalar, qishloq yo‘llari, musiqa va salqinroq tog‘ muhitiga olib chiqadi."
