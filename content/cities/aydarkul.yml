              "ru": "Айдаркуль подходит, когда между историческими городами маршруту нужен открытый воздух: берег озера, который всё равно возвращает к Нурате, Сентобу и большой дороге Кызылкума."
              "uz": "Tarixiy shaharlar orasida yo‘lga ochiq havo kerak bo‘lganda Aydarko‘l mos keladi: ko‘l qirg‘og‘i baribir Nurota, Sentob va keng Qizilqum yo‘liga qaytaradi."
