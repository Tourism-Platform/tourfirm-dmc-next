        "description":
          "en": "After the palace, mosque, madrasah, and Dakhma-i-Shahan, Modari Khan shows another side of Kokand: an 1825 hazira tied to Umarkhan's mother and Nodira's initiative, a surviving portal-dome pavilion, ganch, and majolica."
          "ru": "После дворца, мечети, медресе и Дахма-и-Шахан Модари-хан показывает другую сторону Коканда: хазиру 1825 года, связанную с матерью Умархана и инициативой Нодиры, сохранившимся портально-купольным павильоном, ганчем и майоликой."
          "uz": "Saroy, masjid, madrasa va Daxmai Shohondan keyin Modari Xon Qoʻqonning boshqa tomonini ko‘rsatadi: Umarxon onasi, Nodira tashabbusi, saqlangan portal-gumbazli pavilyon, ganch va majolika bilan bogʻliq 1825 yil xazirasi."
