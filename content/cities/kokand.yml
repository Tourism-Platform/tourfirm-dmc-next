          "ru": "Медресе Камол-Казы"
          "uz": "Komol Qozi madrasasi"
        "description":
          "en": "Near the Jami complex, Kamol-Kazy Madrasah focuses the Kokand visit on architectural detail: a decorated entrance, baked brick, hujras around the courtyard, a darskhona, and a mosque-ayvan."
