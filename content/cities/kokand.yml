        "icon": "CircleQuestionMark"
        "title":
          "en": "How long should groups stay in Kokand?"
          "ru": "Сколько времени группам стоит проводить в Коканд?"
          "uz": "Qoʻqonda guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "1–2 nights is usually enough when the old core or main anchors get a full walking window. City tone: “Palace history, mosque courtyards, madrasahs, and the road to the craft towns”."
          "ru": "Обычно хватает 1–2 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Дворцовая история, мечеть, медресе и дорога к ремесленным городам»."
          "uz": "Odatda 1–2 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Saroy tarixi, masjid hovlilari, madrasalar va hunarmandchilik shaharlari yo‘li»."
      - "type": "destinationInsight"
        "icon": "Footprints"
        "title":
          "en": "Should Kokand be a walkable core or a base for day trips?"
          "ru": "Коканд — это пешеходное ядро или база для выездов?"
          "uz": "Qoʻqon piyoda yadroimi yoki chiqishlar uchun baza?"
        "description":
          "en": "Start with the compact city walk first. Day trips only after the centre has settled — otherwise the stop feels like a transfer with monuments attached."
          "ru": "Сначала компактная городская прогулка. Выезды — только после того, как центр «сел»; иначе остановка ощущается как трансфер с памятниками."
          "uz": "Avval ixcham shahar sayri. Chiqishlar — markaz joylashgandan keyin; aks holda bekat yodgorlikli transferdek tuyuladi."
      - "type": "destinationInsight"
        "icon": "Clock"
        "title":
          "en": "Where should overnight be relative to Kokand's centre?"
          "ru": "Где лучше ночевать относительно центра Коканд?"
          "uz": "Qoʻqon markaziga nisbatan qayerda tunash yaxshi?"
        "description":
          "en": "Stay close enough for an evening return on foot or a short transfer. That keeps tea, dinner, and a second pass through the lanes easy without burning the next morning."
          "ru": "Живите достаточно близко, чтобы вечером вернуться пешком или коротким трансфером. Так чай, ужин и второй проход по улицам остаются лёгкими и не сжигают следующее утро."
          "uz": "Kechqurun piyoda yoki qisqa transfer bilan qaytishga yaqin turing. Choy, kechki ovqat va ko‘chalardan ikkinchi o‘tish oson qoladi, erta tongni yoqib yubormaydi."
