  "metaTitle":
    "en": "Sary-Mogul | TourLink"
    "ru": "Сары-Могол | TourLink"
    "uz": "Sary-Mogʻul | TourLink"
  "metaDescription":
    "en": "Sary-Mogul sits wide under the Trans-Alay range, with gravel tracks, low village roofs, cold air, and the road toward Tulpar-Kol and the Lenin Peak approach. It belongs in the route when the pace allows for altitude, season, permits, local hosts, and the long road back to Osh or onward across the high south."
    "ru": "Сары-Могол лежит широко под Заалайским хребтом: гравийные дороги, низкие крыши, холодный воздух и направление к Тулпар-Кёлю и маршрутам у пика Ленина. Он нужен маршруту тогда, когда темп позволяет учесть высоту, сезон, разрешения, местных хозяев и длинную дорогу назад к Ошу или дальше по высокому югу."
    "uz": "Sary-Mogʻul Zaalay tizmasi ostida keng yotadi: shagʻal yoʻllar, past tomlar, sovuq havo va Tulpar-Koʻl hamda Lenin choʻqqisi yoʻnalishlari tomonga ketadigan yoʻl. Bu joy balandlik, mavsum, ruxsatlar, mahalliy mezbonlar va Oʻshga qaytish yoki janubda yuqoriroq davom etish uchun vaqt bo‘lganda marshrutga kiradi."
