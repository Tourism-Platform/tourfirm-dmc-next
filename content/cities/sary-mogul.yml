          "ru": "Сколько времени группам стоит проводить в Сары-Могол?"
          "uz": "Sary-Mogʻulda guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "2–3 nights is usually enough when the old core or main anchors get a full walking window. City tone: “Alay village for high-road decisions”."
          "ru": "Обычно хватает 2–3 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Алайский кишлак для решений о высокогорной дороге»."
          "uz": "Odatda 2–3 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Yuqori togʻ yoʻli qarorlari uchun Olay qishlogʻi»."
      - "type": "destinationInsight"
