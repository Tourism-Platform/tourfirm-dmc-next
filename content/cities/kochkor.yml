          "ru": "Таш-Рабат - высокогорная остановка за Нарыном, где каменный караван-сарай, горная погода, сезон юртовых лагерей и южная дорога превращают наследие Шелкового пути в осознанное маршрутное решение."
          "uz": "Tash Rabat Naryndan keyingi baland vodiy toʻxtashi: tosh karvonsaroy, togʻ ob-havosi, oʻtov lagerlari mavsumi va janubiy yoʻl Ipak yoʻli merosini ehtiyotkor marshrut qaroriga aylantiradi."
