          "ru": "Сон-Куль - высокогорный район озера, где центральный Кыргызстан замедляется до юртовых лагерей, холодных ночей, лошадей и выбора дороги к Кочкору, Нарыну или Таш-Рабату."
          "uz": "Soʻng-Koʻl markaziy Qirgʻiziston sekinlashadigan baland yaylov-koʻl hududi: oʻtov lagerlari, sovuq tunlar, otlar va Kochkor, Narin yoki Tash Rabat sari yoʻl tanlovi."
