          "ru": "Нарын даёт маршруту по Центральному Тянь-Шаню полезную паузу у реки: городскую ночёвку, сухие горные склоны и выбор по погоде перед дорогой к Сон-Кулю, Таш-Рабату, Ат-Баши или Кель-Суу."
          "uz": "Naryn Markaziy Tyan-Shan yoʻnalishiga daryo boʻyidagi foydali pauzani beradi: shaharda tunash, quruq togʻ yonbagʻirlari va Soʻng-Koʻl, Tash-Rabat, At-Bashi yoki Kel-Suu sari yoʻldan oldingi ob-havo tanlovi."
