                  "ru": "Сон-Куль и Коль-Укок зависят от погоды, машины, покрытия, готовности хозяев и условий в лагерях."
                  "uz": "Soʻng-Koʻl va Koʻl-Ukok ob-havo, avtomobil, yoʻl holati, mezbonlar va lager sharoitlariga bogʻliq."
              - "icon": "MapPin"
