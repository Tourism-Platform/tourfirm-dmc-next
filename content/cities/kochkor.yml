    "title":
      "en": "Song-Kul, Naryn, and Tash Rabat need their own timing"
      "ru": "Сон-Кулю, Нарыну и Таш-Рабату нужно своё время"
      "uz": "Soʻng-Koʻl, Naryn va Tash-Rabatga alohida vaqt kerak"
    "description":
      "en": "Song-Kul is the high pasture lake, Naryn is the river-city pause farther along the road, and Tash Rabat is a separate caravanserai valley. Kochkor can introduce them, but each one needs its own route decision."
      "ru": "Сон-Куль — высокогорное озеро-пастбище, Нарын — городская пауза у реки дальше по дороге, а Таш-Рабат — отдельная долина караван-сарая. Кочкор может познакомить с ними, но каждому нужен свой маршрутный выбор."
      "uz": "Soʻng-Koʻl baland yaylov koʻli, Naryn yoʻl davomidagi daryo shahri, Tash-Rabat esa alohida karvonsaroy vodiysi. Kochkor ular bilan tanishtirishi mumkin, lekin har biri oʻz yoʻnalish qarorini talab qiladi."
