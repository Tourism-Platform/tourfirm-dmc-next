        "description":
          "en": "one focused city day plus overnight is usually enough when the old core or main anchors get a full walking window. City tone: “A Nuratau village stop where mountain air meets craft and household tables”."
          "ru": "Обычно хватает один насыщенный городской день плюс ночёвка, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Сельская остановка Нуратау, где горный воздух встречается с ремеслом и домашним столом»."
          "uz": "Odatda bitta zich shahar kuni va tunash yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Tog‘ havosi hunar va xonadon dasturxoni bilan uchrashadigan Nurota qishloq bekati»."
