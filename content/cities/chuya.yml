"excerpt":
  "en": "Chuya sits in the Nuratau foothills of Navoi Region. Begin with the mahalla itself: mountain edges, springs, household craft, qurut, bread, goat milk, local food, music, and rural life. Village stays, glamping, horse riding, agro-tourism, and ropeway outings can belong here too, but only when the date, road, weather, and traveler comfort make sense."
  "ru": "Чуя находится в предгорьях Нуратау в Навоийской области. Сначала это махалля: горный край, родники, домашние ремёсла, курут, лепёшка, козье молоко, местная еда, музыка и сельская жизнь. Ночёвки, глэмпинг, лошади, агротуризм и канатная дорога тоже могут быть частью Чуи, но только если дата, дорога, погода и комфорт путешественника складываются спокойно."
  "uz": "Chuya Navoiy viloyatining Nurota tog‘oldilarida joylashgan. Uni avval mahalla sifatida ko‘ring: tog‘ cheti, buloqlar, xonadon hunari, qurut, non, echki suti, mahalliy ovqat, musiqa va qishloq hayoti. Qishloq tunashi, glamping, ot minish, agro-turizm va osma yo‘l ham Chuyaga kirishi mumkin, lekin sana, yo‘l, ob-havo va sayohatchi qulayligiga mos kelganda."
