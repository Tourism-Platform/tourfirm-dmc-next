    "description":
      "en": "The blue-green color catches the eye first, but it should not be the only thing the traveler remembers. Rishtan feels warmer when the wheel, the maker's hands, the pattern before firing, and the story of the workshop stay close to the visit."
      "ru": "Сине-зелёный цвет первым бросается в глаза, но он не должен оставаться единственным впечатлением. Город становится теплее, когда рядом видны глина на круге, поправки пальцами, узор до обжига и мастер, который говорит о своей работе простыми словами."
      "uz": "Ko‘k-yashil rang birinchi bo‘lib ko‘zga tashlanadi, lekin u yagona taassurot bo‘lib qolmasligi kerak. Rishton charx, usta qo‘li, pishirishdan oldingi naqsh va ustaxona hikoyasi yonma-yon ko‘ringanda iliqroq seziladi."
    "rows":
      - "ratio": "2:1"
        "left":
          - "type": "dashTitle"
            "title":
              "en": "At the wheel"
              "ru": "У круга"
              "uz": "Charx yonida"
            "description":
              "en": "A good Rishtan visit slows down at the wheel: the maker holds the rim, removes a little clay, changes the form, and the finished piece begins to feel personal."
              "ru": "В мастерской внимание цепляется за малое: как мастер держит край, снимает лишнее, меняет форму. После этого готовая работа уже не выглядит просто предметом на полке."
              "uz": "Yaxshi Rishton tashrifi charx yonida sekinlashadi: usta chetni ushlaydi, ozroq loyni oladi, shaklni o‘zgartiradi, va tayyor buyum shaxsiyroq tuyula boshlaydi."
          - "type": "quote"
            "quote":
              "en": "In Rishtan, the color stays with you because the hands behind it are still visible."
              "ru": "В Риштане цвет запоминается сильнее, когда перед ним видна работа рук."
              "uz": "Rishtonda rang ortidagi qo‘l mehnati ko‘ringanda, u uzoqroq esda qoladi."
          - "type": "dashTitle"
            "title":
              "en": "Blue-green glaze"
              "ru": "Сине-зелёная глазурь"
              "uz": "Ko‘k-yashil sir"
            "description":
              "en": "The color is Rishtan's signature, but it feels stronger after the traveler has seen the wet clay, the pattern, and the firing that bring it there."
              "ru": "Цвет — знак Риштана, но он сильнее после глины, узора и обжига. Тогда глазурь воспринимается не как витрина, а как часть работы."
              "uz": "Rang Rishton belgisi, lekin sayohatchi nam loy, naqsh va pishirishni ko‘rgandan keyin u kuchliroq seziladi."
          - "type": "dashTitle"
            "title":
              "en": "With Kokand and Margilan"
              "ru": "С Кокандом и Маргиланом"
              "uz": "Qoʻqon va Margʻilon bilan"
            "description":
              "en": "Rishtan pairs naturally with Margilan silk and Kokand history. Some private studios, galleries, and small museum areas open differently by date, so our team checks what is available before the route is set."
              "ru": "Риштан естественно сочетается с шёлком Маргилана и историей Коканда. Частные мастерские, галереи и небольшие музейные зоны работают по-разному в разные дни, поэтому мы проверяем их до утверждения маршрута."
              "uz": "Rishton Margʻilon ipagi va Qoʻqon tarixi bilan tabiiy bogʻlanadi. Ayrim xususiy ustaxonalar, galereyalar va kichik muzey joylari turli kunlarda boshqacha ishlaydi, shuning uchun jamoamiz ularni marshrutdan oldin tekshiradi."
          - "type": "alert"
            "title":
              "en": "For the traveler"
              "ru": "Для путешественника"
              "uz": "Sayohatchi uchun"
            "description":
              "en": "Come for the ceramics, but do not make it only a purchase. See the workshop, understand the local school, then choose the piece you want to take with you."
              "ru": "Ехать в Риштан стоит не только за покупкой. Лучше увидеть мастерскую, понять местную школу и уже потом выбирать вещь, которую хочется увезти."
              "uz": "Rishtonga faqat xarid uchun kelmang. Avval ustaxonani ko‘ring, mahalliy maktabni tushuning, keyin olib ketmoqchi bo‘lgan buyumni tanlang."
        "right":
          - "type": "miniTable"
            "title":
              "en": "Before you go"
              "ru": "Перед поездкой"
              "uz": "Yo‘lga chiqishdan oldin"
            "icon": "Circle"
            "rows":
              - "icon": "MapPin"
                "title":
                  "en": "Before you go Where to start"
                  "ru": "Перед поездкой Где начать"
                  "uz": "Yo‘l oldidan Qayerdan boshlash"
                "description":
                  "en": "The International Ceramics Center gives the clearest introduction; a working studio or small museum/display area can follow when it is open to guests."
                  "ru": "Международный центр керамики даёт спокойное знакомство с Риштаном; мастерскую, музейную или выставочную зону стоит добавлять, когда они открыты для гостей."
                  "uz": "Xalqaro kulolchilik markazi Rishton bilan sokin tanishuv beradi; ishlayotgan ustaxona yoki kichik muzey/ko‘rgazma joyi mehmonlar uchun ochiq bo‘lsa, keyin qo‘shiladi."
              - "icon": "Landmark"
                "title":
                  "en": "Main craft"
                  "ru": "Главное ремесло"
                  "uz": "Asosiy hunar"
                "description":
                  "en": "Clay on the wheel, painted pattern, blue-green glaze, firing, and finished work."
                  "ru": "Глина на круге, расписной узор, сине-зелёная глазурь, обжиг и готовые работы."
                  "uz": "Charxdagi loy, chizilgan naqsh, ko‘k-yashil sir, pishirish va tayyor ishlar."
              - "icon": "Sun"
                "title":
                  "en": "Visit timing"
                  "ru": "Время визита"
                  "uz": "Tashrif vaqti"
                "description":
                  "en": "Year-round; confirm workshop access, demonstrations, and photography rules close to the visit."
                  "ru": "Круглый год; доступ в мастерские, демонстрации и правила съёмки лучше уточнять ближе к визиту."
                  "uz": "Yil bo‘yi; ustaxonaga kirish, namoyishlar va suratga olish qoidalari tashrifga yaqin tekshiriladi."
              - "icon": "Route"
                "title":
                  "en": "Route role"
                  "ru": "Роль в маршруте"
                  "uz": "Marshrutdagi roli"
                "description":
                  "en": "The ceramics town in the Kokand - Margilan - Rishtan craft route."
                  "ru": "Керамический город в связке Коканд — Маргилан — Риштан."
                  "uz": "Qoʻqon — Margʻilon — Rishton bogʻlamasidagi kulolchilik shahri."
  - "blockType": "regular"
    "eyebrow":
      "en": "Route connections"
      "ru": "Продолжение маршрута"
      "uz": "Marshrut davomi"
    "title":
      "en": "Where to continue in the valley"
      "ru": "Куда продолжить путь по долине"
      "uz": "Vodiy bo‘ylab qayerga davom etish"
    "description":
      "en": "Margilan keeps the craft route with silk, while Kokand adds palace history and central-city stops. Rishtan belongs between them as the ceramics town."
      "ru": "Маргилан продолжает ремесленную тему шёлком, а Коканд добавляет дворцовую историю и прогулку по центру. Риштан стоит между ними как город керамики."
      "uz": "Margʻilon hunar mavzusini ipak bilan davom ettiradi, Qoʻqon esa saroy tarixi va markaz bo‘ylab sayrni qo‘shadi. Rishton ular orasida kulolchilik shahri sifatida turadi."
    "gridClassName": "sm:grid-cols-2 lg:grid-cols-2"
