          "ru": "Маргилан — шёлковый город Ферганской долины: Yodgorlik, мастерские атласа и адраса, ремесленный центр и маршруты к Коканду и Риштану."
          "uz": "Margʻilon Fargʻona vodiysining ipak shahri: Yodgorlik, atlas va adras ustaxonalari, hunar markazi hamda Qoʻqon va Rishton yo‘nalishlari."
