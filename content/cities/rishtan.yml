          "uz": "Qoʻqon"
        "description":
          "en": "Kokand brings palace history into the Fergana Valley route before the day continues toward Margilan silk and Rishtan ceramics."
          "ru": "Коканд добавляет маршруту по Ферганской долине дворец Худояр-хана, мечеть Джами, медресе и дорогу к Маргилану и Риштану."
          "uz": "Qoʻqon Fargʻona vodiysi yoʻnalishiga Xudoyorxon saroyi, Jome masjidi, madrasalar va Margʻilon hamda Rishton tomonga yo‘lni qo‘shadi."
