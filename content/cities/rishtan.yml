  - "blockType": "regular"
    "eyebrow":
      "en": "City in detail"
      "ru": "Город в деталях"
      "uz": "Shahar batafsil"
    "title":
      "en": "How to place Rishtan in the day plan"
      "ru": "Как поставить Риштан в план дня"
      "uz": "Rishtonni kun rejasiga qanday joylashtirish"
    "description":
      "en": "Walking time, overnight location, and when day trips make sense."
      "ru": "Пешее время, место ночёвки и когда выезды имеют смысл."
      "uz": "Piyoda vaqt, tunash joyi va chiqishlar qachon o‘rinli."
    "gridClassName": "grid-cols-1"
    "cards":
      - "type": "destinationInsight"
        "icon": "CircleQuestionMark"
        "title":
          "en": "How long should groups stay in Rishtan?"
          "ru": "Сколько времени группам стоит проводить в Риштан?"
          "uz": "Rishtonda guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "1–2 nights is usually enough when the old core or main anchors get a full walking window. City tone: “Ceramic workshops and blue-green glaze in the Fergana Valley”."
          "ru": "Обычно хватает 1–2 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Керамические мастерские и сине-зелёная глазурь Ферганской долины»."
          "uz": "Odatda 1–2 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Fargʻona vodiysidagi kulolchilik ustaxonalari va ko‘k-yashil sir»."
      - "type": "destinationInsight"
        "icon": "Footprints"
        "title":
          "en": "Should Rishtan be a walkable core or a base for day trips?"
          "ru": "Риштан — это пешеходное ядро или база для выездов?"
          "uz": "Rishton piyoda yadroimi yoki chiqishlar uchun baza?"
        "description":
          "en": "Start with the compact city walk first. Day trips only after the centre has settled — otherwise the stop feels like a transfer with monuments attached."
          "ru": "Сначала компактная городская прогулка. Выезды — только после того, как центр «сел»; иначе остановка ощущается как трансфер с памятниками."
          "uz": "Avval ixcham shahar sayri. Chiqishlar — markaz joylashgandan keyin; aks holda bekat yodgorlikli transferdek tuyuladi."
      - "type": "destinationInsight"
        "icon": "Clock"
        "title":
          "en": "Where should overnight be relative to Rishtan's centre?"
          "ru": "Где лучше ночевать относительно центра Риштан?"
          "uz": "Rishton markaziga nisbatan qayerda tunash yaxshi?"
        "description":
          "en": "Stay close enough for an evening return on foot or a short transfer. That keeps tea, dinner, and a second pass through the lanes easy without burning the next morning."
          "ru": "Живите достаточно близко, чтобы вечером вернуться пешком или коротким трансфером. Так чай, ужин и второй проход по улицам остаются лёгкими и не сжигают следующее утро."
          "uz": "Kechqurun piyoda yoki qisqa transfer bilan qaytishga yaqin turing. Choy, kechki ovqat va ko‘chalardan ikkinchi o‘tish oson qoladi, erta tongni yoqib yubormaydi."
