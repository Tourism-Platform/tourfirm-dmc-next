              "ru": "Выбирайте Конигил, если нужна близкая ремесленная пауза, которая всё ещё ясно принадлежит самаркандскому маршруту."
              "uz": "Konigilni Samarqand marshrutiga aniq tegishli bo‘lgan yaqin hunarmandchilik pauzasi kerak bo‘lganda tanlang."
