              "ru": "Конигил — место, где самаркандский маршрут переходит от камня и мозаики к бумажному волокну, воде и тихой сельской улице."
              "uz": "Konigil Samarqand marshruti tosh va koshindan qog‘oz tolasi, suv va sokin qishloq yo‘lagiga o‘tadigan joy."
          - "type": "dashTitle"
            "title":
