              "ru": "Самарканд остаётся опорой; после Конигиля маршрут может спокойно вернуться в город или добавить одно соседнее село."
              "uz": "Samarqand tayanch bo‘lib qoladi; Konigildan keyin marshrut shaharga ravon qaytishi yoki bitta yaqin qishloq bekatini qo‘shishi mumkin."
          - "type": "alert"
            "title":
