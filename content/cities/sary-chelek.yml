  "metaDescription":
    "en": "Sary-Chelek changes the western Kyrgyzstan route from village roads and walnut-forest travel into a protected mountain-lake basin. The reward is deep water under forested slopes; the condition is patience. Our team treats the lake as a current access decision, so the visit stays respectful, calm, and worth the road."
    "ru": "Сары-Челек меняет западный маршрут по Кыргызстану: после сельских дорог и орехового леса он приводит к охраняемой горной котловине. Награда — глубокая вода под лесными склонами; условие — терпение. Наша команда относится к озеру как к актуальному решению по доступу, чтобы визит оставался уважительным, спокойным и стоил дороги."
    "uz": "Sary-Chelek Qirgʻiziston gʻarbidagi yoʻlni qishloq, yongʻoq oʻrmoni va vodiylardan muhofaza qilingan koʻl hududiga oʻtkazadi. Oʻrmonli yonbagʻirlar chuqur suvga tushadi, safar esa sokin reja soʻraydi: yoʻlni tekshirish, hudud qoidalarini hurmat qilish va koʻlni xaritadagi nom emas, haqiqiy manzil sifatida koʻrish."
