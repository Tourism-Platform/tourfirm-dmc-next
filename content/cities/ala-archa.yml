    "ru": "Ала-Арча | TourLink"
    "uz": "Ala-Archa | TourLink"
  "metaDescription":
    "en": "Ala-Archa is a mountain area rather than a built city. It gives Bishkek its closest real nature outing: the road enters a river gorge, juniper slopes rise above the valley, and the right walk depends on weather, daylight, footwear, and how much elevation belongs in the route."
    "ru": "Ала-Арча — горная территория, а не городской маршрут. Она даёт Бишкеку самый близкий настоящий выход к природе: дорога входит в речное ущелье, арчовые склоны поднимаются над долиной, а правильная прогулка зависит от погоды, светового дня, обуви и того, сколько высоты уместно в маршруте."
    "uz": "Ala-Archa shahar emas, togʻ hududidir. U Bishkekka eng yaqin haqiqiy tabiat chiqishini beradi: yo‘l daryo darasiga kiradi, archa yonbagʻirlari vodiy ustida ko‘tariladi, to‘g‘ri yurish esa ob-havo, kunduzgi vaqt, poyabzal va yo‘nalishga qancha balandlik mos kelishiga bogʻliq."
