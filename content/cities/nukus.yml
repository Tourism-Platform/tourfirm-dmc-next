          "ru": "Некрополь Миздакхан"
          "uz": "Mizdaxon nekropoli"
        "description":
          "en": "Mizdakhan is not a single monument. It is a walk across hills near Khojeyli, where ancient burials, pilgrimage stories, mausoleum domes, and nearby Gyaur-Kala move the route beyond Nukus museums."
          "ru": "Миздакхан — не один памятник, а прогулка по холмам у Ходжейли: древние погребения, паломнические предания, купола мавзолеев и контекст Гяур-Калы выводят маршрут за пределы музейного Нукуса."
          "uz": "Mizdaxon bitta yodgorlik emas. Bu Xo‘jayli yaqinidagi tepaliklar bo‘ylab yuriladigan joy: qadimiy dafnlar, ziyorat rivoyatlari, maqbara gumbazlari va yaqin Gyaur-Kala Nukus muzeylaridan keyingi yo‘lni ochiq manzaraga olib chiqadi."
