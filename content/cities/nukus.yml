          "ru": "Муйнак из Нукуса: кладбище кораблей, бывший рыбацкий порт, местный музей, сухое морское дно и контекст маршрута по Каракалпакстану."
          "uz": "Mo‘ynoqni Nukusdan rejalang: kema qabristoni, sobiq baliqchi porti, mahalliy muzey, quruq dengiz tubi va Qoraqalpog‘iston yo‘nalishi konteksti."
