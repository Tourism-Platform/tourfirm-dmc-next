          "en": "Beside Savitsky, this museum shows Karakalpakstan differently: archaeology from ancient Khorezm, ethnographic objects, folk craft, Aral-region nature, and the republic's memory gathered in Nukus."
          "ru": "Рядом с Савицким этот музей показывает Каракалпакстан иначе: через археологию древнего Хорезма, этнографические предметы, ремесло, природу Приаралья и память республики в Нукусе."
          "uz": "Savitskiy yonida bu muzey Qoraqalpog‘istonni boshqacha ko‘rsatadi: qadimgi Xorazm arxeologiyasi, etnografik buyumlar, xalq hunari, Orolbo‘yi tabiati va respublika xotirasi Nukusda jamlangan."
