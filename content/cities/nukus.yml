          "ru": "Элликкала выводит маршрут по Каракалпакстану к пустынным крепостям древнего Хорезма: Топрак-Кале, Кызыл-Кале, Аяз-Кале, открытым дорогам, проверкам доступа и пути между Нукусом и Хивой."
          "uz": "Ellikqal’a Qoraqalpog‘iston yo‘lini qadimgi Xorazm qalʼalariga olib boradi: Tuproq-qalʼa, Qizil-qalʼa, Ayoz-qalʼa, ochiq yo‘llar, kirish tekshiruvlari va Nukus bilan Xiva orasidagi yo‘l."
