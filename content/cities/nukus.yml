    "ru": "Нукус делает западный Узбекистан больше, чем переездом. Начните с музея Савицкого и каракалпакских коллекций, а затем решайте, куда продолжать маршрут: к Муйнаку, Чилпыку, Миздакхану или крепостям древнего Хорезма."
