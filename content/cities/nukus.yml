        "description":
          "en": "Chilpyk is best read as a hill and a ritual structure, not as another fortress. The circular adobe wall, exposed steps, and Amu Darya landscape connect Nukus with ancient Khorezm before the route continues toward Khiva or the desert fortresses."
          "ru": "Чилпык лучше воспринимать как холм и ритуальное сооружение, а не как ещё одну крепость. Круглая сырцовая стена, открытые ступени и ландшафт Амударьи связывают Нукус с древним Хорезмом перед дорогой к Хиве или пустынным крепостям."
          "uz": "Chilpiqni yana bir qalʼa emas, tepa va marosim inshooti sifatida ko‘rish kerak. Aylana xom g‘isht devor, ochiq zinapoyalar va Amudaryo manzarasi Nukusni qadimgi Xorazm bilan bog‘laydi, keyin yo‘l Xiva yoki cho‘l qalʼalariga davom etadi."
