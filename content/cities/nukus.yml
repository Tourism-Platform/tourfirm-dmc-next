    "description":
      "en": "Start with Savitsky and the State Museum, then use Nukus for Mizdakhan, Chilpyk, and the road toward ancient Khorezm. A fuller city stop can include Berdakh-related culture, bazaar life, craft, and Aral-route logistics when access and timing fit."
      "ru": "Начните с Савицкого и Государственного музея, затем используйте Нукус для Миздакхана, Чилпыка и дороги к древнему Хорезму. Более длинная остановка может включать культуру, связанную с Бердахом, рынки, ремесло и логистику маршрутов к Аралу, когда доступ и время подходят."
      "uz": "Avval Savitskiy va Davlat muzeylaridan boshlang, keyin Nukusni Mizdakhan, Chilpiq va qadimgi Xorazm yo‘li bilan bog‘lang. Uzunroq shahar bekati Berdaq bilan bog‘liq madaniyat, bozor hayoti, hunar va Orol yo‘nalishi logistikasini ham qo‘shishi mumkin, agar kirish va vaqt mos bo‘lsa."
