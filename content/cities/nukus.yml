          "en": "Near Khojeyli, hill paths, mazars, baked earth, and a guide's quiet explanation turn the Nukus chapter toward pilgrimage memory and ancient Khorezm under open sky."
          "ru": "У Ходжейли тропы на холмах, мазары, обожжённая земля и спокойное объяснение гида переводят главу Нукуса к паломнической памяти и древнему Хорезму под открытым небом."
          "uz": "Xo‘jayli yaqinida tepalik yo‘llari, mozorlar, pishgan yer va gidning sokin izohi Nukus bobini ochiq osmon ostidagi ziyorat xotirasi va qadimgi Xorazmga buradi."
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan/character/nukus/nukus-character-2.webp"
        "badge":
          "en": "Culture"
          "ru": "Культура"
          "uz": "Madaniyat"
        "title":
          "en": "Chilpyk river wind"
          "ru": "Речной ветер Чилпыка"
          "uz": "Chilpiq daryo shamoli"
        "description":
          "en": "On the hill south of Nukus, dry wind, adobe wall, and Amu Darya light turn the road pause into an ancient open-air memory rather than a quick viewpoint."
          "ru": "На холме к югу от Нукуса сухой ветер, сырцовая стена и свет Амударьи превращают дорожную паузу в древнюю память под открытым небом, а не в быстрый вид."
          "uz": "Nukus janubidagi tepalikda quruq shamol, xom g‘isht devor va Amudaryo nuri yo‘l pauzasini tezkor manzaradan ko‘ra qadimiy ochiq osmon xotirasiga aylantiradi."
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan.jpg"
        "badge":
          "en": "Craft"
          "ru": "Ремёсла"
          "uz": "Hunarmandchilik"
        "title":
          "en": "Karakalpak patterns"
          "ru": "Каракалпакские узоры"
          "uz": "Qoraqalpoq naqshlari"
        "description":
          "en": "Embroidery, headdresses, woven lines, and museum cases give Karakalpak identity a close scale. The patterns turn the city pause into a quiet conversation with the region."
          "ru": "Вышивка, головные уборы, тканые линии и музейные витрины приближают каракалпакскую идентичность. Узоры превращают городскую паузу в тихий разговор с регионом."
          "uz": "Kashta, bosh kiyimlar, to‘qima chiziqlar va muzey vitrinalari qoraqalpoq o‘zligini yaqin miqyosda ko‘rsatadi. Naqshlar shahar pauzasini hudud bilan sokin suhbatga aylantiradi."
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan.jpg"
        "badge":
          "en": "Culture"
          "ru": "Культура"
          "uz": "Madaniyat"
        "title":
          "en": "Savitsky gallery quiet"
          "ru": "Тишина галереи Савицкого"
          "uz": "Savitskiy galereyasi sokinligi"
        "description":
          "en": "In a calm museum room, avant-garde color, Karakalpak objects, a lowered voice, and the hush of footsteps make Nukus feel larger than its broad streets outside."
          "ru": "В спокойном зале музея авангардный цвет, каракалпакские предметы, пониженный голос и мягкий звук шагов делают Нукус шире, чем его прямые улицы за дверью."
          "uz": "Sokin muzey zalida avangard rang, qoraqalpoq buyumlari, past ovoz va yumshoq qadam tovushi Nukusni tashqaridagi keng ko‘chalaridan ham kattaroq his qildiradi."
  - "blockType": "regular"
    "eyebrow":
      "en": "Before you go"
      "ru": "Перед поездкой"
      "uz": "Safardan oldin"
    "title":
      "en": "How to place Nukus in the western route"
      "ru": "Как поставить Нукус в западный маршрут"
      "uz": "Nukusni g‘arbiy yo‘nalishga qanday joylashtirish"
    "description":
      "en": "Nukus works best when the route gives it a clear role: museum city, Karakalpak culture, and the decision point before Moynaq, Mizdakhan, Chilpyk, Ellikqala, or the return toward Khiva."
      "ru": "Нукус лучше раскрывается, когда у него есть ясная роль: музейный город, каракалпакская культура и точка выбора перед Муйнаком, Миздакханом, Чилпыком, Элликкалой или возвращением к Хиве."
      "uz": "Nukus yo‘nalishda aniq rol olganda yaxshiroq ochiladi: muzey shahri, qoraqalpoq madaniyati va Mo‘ynoq, Mizdakhan, Chilpiq, Ellikqal’a yoki Xiva tomonga qaytishdan oldingi tanlov nuqtasi."
    "rows":
      - "ratio": "2:1"
        "left":
          - "type": "dashTitle"
            "title":
              "en": "Museum first"
              "ru": "Сначала музей"
              "uz": "Avval muzey"
            "description":
              "en": "Start with Savitsky and add the State Museum when the route needs more local history. That keeps Nukus from becoming only an overnight stop before the next road."
              "ru": "Начните с Савицкого и добавляйте Государственный музей, когда маршруту нужна более глубокая местная история. Так Нукус не превращается только в ночёвку перед следующей дорогой."
              "uz": "Savitskiydan boshlang va yo‘nalishga mahalliy tarix kerak bo‘lsa, Davlat muzeyini qo‘shing. Shunda Nukus keyingi yo‘l oldidagi oddiy tunash joyiga aylanmaydi."
          - "type": "quote"
            "quote":
              "en": "Nukus is where the western route stops being only a transfer."
              "ru": "В Нукусе западный маршрут перестаёт быть просто переездом."
              "uz": "Nukusda g‘arbiy yo‘nalish oddiy transfer bo‘lib qolmaydi."
          - "type": "dashTitle"
            "title":
              "en": "Beyond Savitsky"
              "ru": "Не только Савицкий"
              "uz": "Savitskiydan tashqari"
            "description":
              "en": "Berdakh-related culture, applied arts, bazaar life, and Karakalpak food can make the city more complete, but they need current access and timing checks."
              "ru": "Культура, связанная с Бердахом, прикладное искусство, рынки и каракалпакская еда могут сделать город полнее, но для них нужны актуальные проверки доступа и времени."
              "uz": "Berdaq bilan bog‘liq madaniyat, amaliy sanʼat, bozorlar va qoraqalpoq taomlari shaharni to‘liqroq ko‘rsatishi mumkin, ammo ular uchun kirish va vaqtni tekshirish kerak."
          - "type": "dashTitle"
            "title":
              "en": "Choose the continuation"
              "ru": "Выберите продолжение"
              "uz": "Davomni tanlang"
            "description":
              "en": "Moynaq, Mizdakhan, Chilpyk, and Ellikqala should not be compressed automatically. Each one changes the route in a different direction."
              "ru": "Муйнак, Миздакхан, Чилпык и Элликкалу не стоит автоматически сжимать в одну программу. Каждое направление меняет маршрут по-своему."
              "uz": "Mo‘ynoq, Mizdakhan, Chilpiq va Ellikqal’ani avtomatik ravishda bitta dasturga siqmaslik kerak. Har biri yo‘nalishni boshqacha tomonga olib boradi."
          - "type": "alert"
            "title":
              "en": "For travelers"
              "ru": "Для путешественника"
              "uz": "Sayohatchilar uchun"
            "description":
              "en": "Treat Nukus as the museum and planning stop for western Uzbekistan: Savitsky first, then the road that best fits Moynaq, Mizdakhan, Chilpyk, Ellikqala, or the return toward Khiva."
              "ru": "Относитесь к Нукусу как к музейной и маршрутной остановке западного Узбекистана: сначала Савицкий, затем дорога, которая лучше подходит для Муйнака, Миздакхана, Чилпыка, Элликкалы или возвращения к Хиве."
              "uz": "Nukusga g‘arbiy O‘zbekistonning muzey va yo‘nalish bekati sifatida qarang: avval Savitskiy, keyin Mo‘ynoq, Mizdakhan, Chilpiq, Ellikqal’a yoki Xiva tomonga qaytishga eng mos yo‘l."
        "right":
          - "type": "miniTable"
            "title":
              "en": "Before you go"
              "ru": "Перед поездкой"
              "uz": "Safardan oldin"
            "icon": "Circle"
            "rows":
              - "icon": "MapPin"
                "title":
                  "en": "Before you go Route role"
                  "ru": "Перед поездкой Роль в маршруте"
                  "uz": "Safardan oldin Yo‘nalishdagi roli"
                "description":
                  "en": "Museum city and route anchor for Karakalpakstan after Khiva or Urgench."
                  "ru": "Музейный город и маршрутная опора Каракалпакстана после Хивы или Ургенча."
                  "uz": "Xiva yoki Urganchdan keyin Qoraqalpog‘iston uchun muzey shahri va yo‘nalish tayanchi."
              - "icon": "Landmark"
                "title":
                  "en": "First stop"
                  "ru": "Первое место"
                  "uz": "Birinchi bekat"
                "description":
                  "en": "Savitsky Museum, then the State Museum when the schedule allows."
                  "ru": "Музей Савицкого, затем Государственный музей, если график позволяет."
                  "uz": "Savitskiy muzeyi, keyin jadval mos bo‘lsa Tarix va madaniyat davlat muzeyi."
              - "icon": "Sun"
                "title":
                  "en": "Season and pace"
                  "ru": "Сезон и темп"
                  "uz": "Mavsum va surʼat"
                "description":
                  "en": "Spring and autumn are easiest; summer routes need heat-aware timing and confirmed transport."
                  "ru": "Весна и осень проще; летом нужны маршрут с учётом жары и подтверждённый транспорт."
                  "uz": "Bahor va kuz osonroq; yozgi yo‘nalishlarda issiqni hisobga olgan vaqt va tasdiqlangan transport kerak."
              - "icon": "Route"
                "title":
                  "en": "Next roads"
                  "ru": "Дальше"
                  "uz": "Keyingi yo‘llar"
                "description":
                  "en": "Moynaq, Mizdakhan, Chilpyk, Ellikqala, or a longer Aral and Ustyurt continuation."
                  "ru": "Муйнак, Миздакхан, Чилпык, Элликкала или более длинное продолжение к Аралу и Устюрту."
                  "uz": "Mo‘ynoq, Mizdakhan, Chilpiq, Ellikqal’a yoki Orol va Ustyurt tomonga uzunroq davom."
  - "blockType": "regular"
    "eyebrow":
