      "ru": "Муйнак, Элликкала и Хива — разные продолжения. Выбирайте по расстоянию, сезону и тому, что нужно маршруту: история Арала, древний Хорезм или возвращение к Хиве."
      "uz": "Mo‘ynoq, Ellikqal’a va Xiva bir xil davom emas. Masofa, mavsum va yo‘nalishga kerak bo‘lgan mavzu bo‘yicha tanlang: Orol hikoyasi, qadimgi Xorazm yoki Xiva tomonga qaytish."
