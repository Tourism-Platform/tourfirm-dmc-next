        "title":
          "en": "Lyabi-Hauz Ensemble"
          "ru": "Ляби-Хауз"
          "uz": "Labi Hovuz ansambli"
        "description":
          "en": "At Lyabi-Hauz, the old-city walk opens around the hauz: trees and tea tables by the water, Nadir Divan-Begi Madrasah and Khanaka, Kukeldash Madrasah nearby, and lanes leading back toward the trading passages."
          "ru": "У Ляби-Хауза прогулка по старой Бухаре раскрывается вокруг хауза: деревья и чайные столы у воды, медресе и ханака Нодира Диван-Беги, рядом медресе Кукельдаш и улицы, ведущие к торговым проходам."
          "uz": "Labi Hovuzda eski Buxoro sayri hovuz atrofida ochiladi: suv bo‘yidagi daraxtlar va choy stollari, Nodir Devonbegi madrasasi va xonaqohi, yaqinidagi Ko‘kaldosh madrasasi hamda savdo yo‘laklariga olib boradigan ko‘chalar."
        "ctaHref": "/destinations/uzbekistan/bukhara-region/bukhara/lyabi-hauz-ensemble"
        "ctaLabel":
