        "title":
          "en": "Samanid Mausoleum"
          "ru": "Мавзолей Саманидов"
          "uz": "Somoniylar maqbarasi"
        "description":
          "en": "At this compact 10th-century tomb, Bukhara's early Islamic architecture comes through in the brickwork, the balanced cube-and-dome form, and the calm park setting around it."
          "ru": "В этой компактной усыпальнице X века ранняя исламская архитектура Бухары видна в кирпичной кладке, уравновешенной форме куба и купола и спокойном парковом окружении."
          "uz": "Bu ixcham X asr maqbarasida Buxoroning ilk islom meʼmorchiligi g‘isht terimi, kub va gumbazning muvozanatli shakli hamda atrofdagi sokin park muhiti orqali ko‘rinadi."
        "ctaHref": "/destinations/uzbekistan/bukhara-region/bukhara/samanid-mausoleum"
        "ctaLabel":
