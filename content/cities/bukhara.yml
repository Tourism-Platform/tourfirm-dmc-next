          "uz": "Poyi Kalon majmuasi"
        "description":
          "en": "Poi-Kalyan changes Bukhara's scale at once: the Kalyan minaret rises above warm brick, Kalyan Mosque, and Miri-Arab Madrasah, while the old-city lanes stay close enough for the day to remain on foot."
          "ru": "Пои-Калян сразу меняет масштаб Бухары: минарет Калян поднимается над тёплым кирпичом, мечетью Калян и медресе Мири-Араб, а вокруг остаются пешеходные улицы старого города."
          "uz": "Poyi Kalon Buxoro miqyosini darhol o‘zgartiradi: Kalon minorasi iliq g‘isht, Kalon masjidi va Mir Arab madrasasi ustida ko‘tariladi, atrofida esa eski shaharning piyoda ko‘chalari qoladi."
