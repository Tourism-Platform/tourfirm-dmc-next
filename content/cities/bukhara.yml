        "title":
          "en": "Chashma-Ayub Mausoleum"
          "ru": "Мавзолей Чашма-Аюб"
          "uz": "Chashma-Ayub maqbarasi"
        "description":
          "en": "Near the Samanid Mausoleum, Chashma-Ayub shows another side of Bukhara: a spring associated with Job, a low shrine, trees, and a conical dome away from the larger ensembles."
          "ru": "Рядом с мавзолеем Саманидов Чашма-Аюб показывает другую сторону Бухары: родник, связанный с Айюбом, низкую святыню, деревья и конический купол вдали от крупных ансамблей."
          "uz": "Somoniylar maqbarasi yonida Chashma-Ayub Buxoroning boshqa tomonini ko‘rsatadi: Ayub bilan bog‘langan buloq, past maqbara, daraxtlar va yirik ansambllardan chetroqdagi konus gumbaz."
        "ctaHref": "/destinations/uzbekistan/bukhara-region/bukhara/chashma-ayub-mausoleum"
