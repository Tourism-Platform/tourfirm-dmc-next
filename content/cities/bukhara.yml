  - "blockType": "regular"
    "eyebrow":
      "en": "What to see"
      "ru": "Что посмотреть"
      "uz": "Nimalarni ko‘rish"
    "title":
      "en": "Main places of old Bukhara"
      "ru": "Главные места старой Бухары"
      "uz": "Eski Buxoroning asosiy joylari"
    "description":
      "en": "Poi-Kalyan, the Ark, and Lyabi-Hauz give the city three different entries: the minaret's height, citadel memory, and water with shaded tea tables. The walk then opens through the Samanid Mausoleum, Chashma-Ayub, Bolo-Hauz, Magoki-Attori, Chor Minor, madrasahs, trading domes, Fayzulla Khodjaev House-Museum, and the museum-preserve. With more time, Sitorai Mokhi-Khosa, Bahauddin Naqshband, and Chor-Bakr carry the day beyond the compact center."
      "ru": "Пои-Калян, Арк и Ляби-Хауз дают три разных входа в город: вертикаль минарета, крепостную память и воду с тенистыми чайными столами. Дальше пешая линия раскрывается через мавзолей Саманидов, Чашма-Аюб, Боло-Хауз, Магоки-Аттори, Чор-Минор, медресе, торговые купола, дом-музей Файзуллы Ходжаева и музей-заповедник. Если в городе есть больше времени, Ситораи Мохи-Хоса, Бахауддин Накшбанд и Чор-Бакр выводят день за пределы компактного центра."
      "uz": "Poyi Kalon, Ark va Labi Hovuz shaharga uch xil kirish beradi: minora balandligi, qalʼa xotirasi va soyali choy stollari yonidagi suv. Keyin piyoda yo‘l Somoniylar maqbarasi, Chashma-Ayub, Bolo-Hauz, Magʻoki Attori, Chor Minor, madrasalar, savdo gumbazlari, Fayzulla Xo‘jayev uy-muzeyi va muzey-qo‘riqxona orqali ochiladi. Shaharda ko‘proq vaqt bo‘lsa, Sitorai Mohi-Xosa, Bahouddin Naqshband va Chor Bakr kunni ixcham markazdan tashqariga olib chiqadi."
    "gridClassName": "sm:grid-cols-2 lg:grid-cols-3"
