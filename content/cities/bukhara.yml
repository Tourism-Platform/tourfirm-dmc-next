      "ru": "Бухара обычно стоит между Самаркандом и Хивой: с одной стороны приходит монументальный масштаб, с другой маршрут сужается к хорезмскому городу-крепости."
      "uz": "Buxoro odatda Samarqand va Xiva orasida turadi: bir tomonda monumental miqyos, ikkinchi tomonda Xorazmning devorli shahri bor."
