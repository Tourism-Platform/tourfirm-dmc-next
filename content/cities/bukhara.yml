          "ru": "Арк"
          "uz": "Ark qalʼasi"
        "description":
          "en": "The Ark gives the Bukhara day a different kind of stop: massive walls, a raised entrance, interior rooms, and a clear look back toward the lanes you have just walked."
          "ru": "Арк добавляет к дню в старой Бухаре другую остановку: мощные стены, приподнятый вход, внутренние залы и взгляд назад на улицы, по которым вы только что шли."
          "uz": "Arkda eski Buxoro bo‘ylab sayr boshqa ko‘rinish oladi: katta devorlar, baland kirish, ichki xonalar va hozirgina yurgan ko‘chalarga qaraydigan manzara."
        "ctaHref": "/destinations/uzbekistan/bukhara-region/bukhara/ark-citadel"
