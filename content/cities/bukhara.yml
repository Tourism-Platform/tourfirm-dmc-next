    "description":
      "en": "Bukhara belongs in almost every classic Uzbekistan itinerary, but nights matter: one night shows the main places; two or three give the old city room to breathe."
      "ru": "Бухара есть почти в каждом классическом маршруте по Узбекистану, но ночи важны: одна показывает главное, две или три дают старому городу воздух."
      "uz": "Buxoro deyarli har bir klassik Oʻzbekiston marshrutida bor, lekin tunlar muhim: bir tun asosiy joylarni ko‘rsatadi, ikki yoki uch tun eski shaharga nafas beradi."
  - "blockType": "regular"
