      - "type": "routeIdea"
        "image": "assets/images/destinations/uzbekistan/regions/bukhara-region/cities/bukhara/attractions/bolo-hauz-mosque.webp"
        "badge":
          "en": "Recommended"
          "ru": "Рекомендуем"
          "uz": "Tavsiya"
        "title":
          "en": "Bolo-Hauz Mosque"
          "ru": "Мечеть Боло-Хауз"
          "uz": "Bolo-Hauz masjidi"
        "description":
          "en": "At Bolo-Hauz, the Ark is close, but the first detail is the hauz, the historic water basin in front of the mosque. Around it, the carved wooden iwan, mosque porch, and old Registan edge make a short, calm stop between the citadel and the western side of the old-city route."
          "ru": "В Боло-Хаузе Арк совсем рядом, но первым замечаешь хауз — исторический водоём перед мечетью. Вокруг него складываются резной деревянный айван, крыльцо мечети и край старого Регистана — короткая спокойная остановка между цитаделью и западной частью старогородского маршрута."
          "uz": "Bolo-Hauzda Ark juda yaqin, lekin avval masjid oldidagi hovuz ko‘zga tashlanadi. Uning atrofida o‘yma yog‘och ayvon, masjid ayvoni va eski Registon cheti sitadel bilan eski shahar yo‘lining g‘arbiy tomoni orasidagi qisqa, sokin bekatni hosil qiladi."
        "ctaHref": "/destinations/uzbekistan/bukhara-region/bukhara/bolo-hauz-mosque"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
      - "type": "routeIdea"
        "image": "assets/images/destinations/uzbekistan/regions/bukhara-region/cities/bukhara/attractions/magoki-attori-mosque.webp"
        "badge":
          "en": "Recommended"
          "ru": "Рекомендуем"
          "uz": "Tavsiya"
        "title":
          "en": "Magoki-Attori Mosque"
          "ru": "Мечеть Магоки-Аттори"
          "uz": "Magʻoki Attori masjidi"
        "description":
          "en": "Magoki-Attori is a small but memorable pause near Lyabi-Hauz: an early mosque site where a carved lower portal, blue ornament, and the old Attoron bazaar story bring Bukhara's past closer to the walking route."
          "ru": "Магоки-Аттори — небольшая, но запоминающаяся остановка рядом с Ляби-Хаузом: раннее место мечети, где нижний резной портал, синий орнамент и история базара Атторон приближают прошлое Бухары к пешему маршруту."
          "uz": "Magʻoki Attori Labi Hovuz yaqinidagi kichik, ammo esda qoladigan bekat: bu yerda pastki oʻyma portal, ko‘k naqsh va eski Attoron bozori hikoyasi Buxoro tarixini piyoda yo‘lga yaqinlashtiradi."
        "ctaHref": "/destinations/uzbekistan/bukhara-region/bukhara/magoki-attori-mosque"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
      - "type": "routeIdea"
        "image": "assets/images/destinations/uzbekistan/regions/bukhara-region/cities/bukhara/attractions/chor-minor.webp"
        "badge":
          "en": "Recommended"
          "ru": "Рекомендуем"
          "uz": "Tavsiya"
        "title":
          "en": "Chor Minor"
          "ru": "Чор-Минор"
          "uz": "Chor Minor"
        "description":
          "en": "At Chor Minor, Bukhara shifts from big ensembles to a neighborhood lane. Four blue-domed towers rise above a compact gatehouse, while homes, doors, and everyday movement keep the monument close."
          "ru": "Чор-Минор показывает другую сторону старой Бухары: не площадь и не большой ансамбль, а тихую улицу с воротами бывшего медресе. Четыре башни с синими куполами видны над светлыми стенами, и памятник воспринимается почти в масштабе квартала."
          "uz": "Chor Minor eski Buxoroning boshqa tomonini ko‘rsatadi: katta maydon yoki yirik ansambl emas, sobiq madrasa darvozasi turgan sokin ko‘cha. Ko‘k gumbazlar och rang devorlar ustida ko‘rinadi, yodgorlik esa mahalla ritmiga yaqin seziladi."
        "ctaHref": "/destinations/uzbekistan/bukhara-region/bukhara/chor-minor"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
      - "type": "routeIdea"
        "image": "assets/images/destinations/uzbekistan/regions/bukhara-region/cities/bukhara/attractions/ulugbek-madrasah-bukhara.webp"
        "badge":
          "en": "Recommended"
          "ru": "Рекомендуем"
          "uz": "Tavsiya"
        "title":
          "en": "Ulugbek Madrasah"
          "ru": "Медресе Улугбека в Бухаре"
          "uz": "Buxorodagi Ulugbek madrasasi"
        "description":
          "en": "In Bukhara, Ulugbek Madrasah slows the old-city walk after the trading domes. The courtyard, portal, surviving tilework, and Mirzo Ulugbek's name bring the route from bazaar movement toward the city's history of study."
          "ru": "В Бухаре медресе Улугбека делает старогородскую прогулку спокойнее после торговых куполов. Двор, портал, сохранившаяся керамика и имя Мирзо Улугбека переводят маршрут от движения базара к городской истории знания."
          "uz": "Buxoroda Ulugbek madrasasi savdo gumbazlaridan keyin eski shahar sayrini sokinlashtiradi. Hovli, portal, saqlangan koshin bezaklari va Mirzo Ulugbek nomi marshrutni bozor harakatidan shaharning ilm tarixiga olib boradi."
        "ctaHref": "/destinations/uzbekistan/bukhara-region/bukhara/ulugbek-madrasah-bukhara"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
      - "type": "routeIdea"
        "image": "assets/images/destinations/uzbekistan/regions/bukhara-region/cities/bukhara/attractions/abdulaziz-khan-madrasah.webp"
        "badge":
          "en": "Recommended"
          "ru": "Рекомендуем"
          "uz": "Tavsiya"
        "title":
          "en": "Abdulaziz Khan Madrasah"
          "ru": "Медресе Абдулазиз-хана"
          "uz": "Abdulazizxon madrasasi"
        "description":
          "en": "Abdulaziz Khan Madrasah stands opposite Ulugbek Madrasah, so the two monuments are best seen together. One belongs to the Timurid tradition of learning; the other shows 17th-century Bukhara through a painted portal, carved detail, and the lived street beside the trading domes."
          "ru": "Медресе Абдулазиз-хана стоит напротив медресе Улугбека, поэтому два памятника удобно смотреть вместе. Один связан с тимуридской традицией учёбы, другой показывает Бухару XVII века через расписной портал, резные детали и жизнь улицы у торговых куполов."
          "uz": "Abdulazizxon madrasasi Ulugbek madrasasi ro‘parasida turadi, shuning uchun ikki yodgorlikni birga ko‘rish maʼqul. Biri temuriylar davri ilm anʼanasi bilan bog‘liq; ikkinchisi XVII asr Buxorosini rangli peshtoq, o‘yma detal va savdo gumbazlari yonidagi ko‘cha hayoti orqali ko‘rsat"
        "ctaHref": "/destinations/uzbekistan/bukhara-region/bukhara/abdulaziz-khan-madrasah"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
      - "type": "routeIdea"
        "image": "assets/images/destinations/uzbekistan/regions/bukhara-region/cities/bukhara/attractions/trading-domes-of-bukhara.webp"
        "badge":
          "en": "Recommended"
          "ru": "Рекомендуем"
          "uz": "Tavsiya"
        "title":
          "en": "Trading Domes of Bukhara"
          "ru": "Торговые купола Бухары"
          "uz": "Buxoro Savdo gumbazlari"
        "description":
          "en": "At the Trading Domes, the Bukhara walk passes through covered trade: brick vaults overhead, shopfronts at the sides, textiles, copperwork, ceramics, and bargaining at a slower pace."
          "ru": "У Торговых куполов бухарская прогулка проходит через крытую торговлю: над головой кирпичные своды, по сторонам лавки, ткани, медная работа, керамика и спокойный торг."
          "uz": "Savdo gumbazlarida Buxoro sayri yopiq savdo ichidan o‘tadi: tepada gʻisht ravoqlar, yon tomonda rastalar, matolar, mis buyumlar, keramika va sokin savdolashuv."
        "ctaHref": "/destinations/uzbekistan/bukhara-region/bukhara/trading-domes-of-bukhara"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
      - "type": "routeIdea"
        "image": "assets/images/destinations/uzbekistan/regions/bukhara-region/cities/bukhara/attractions/fayzulla-khodjaev-house-museum.webp"
        "badge":
          "en": "Recommended"
          "ru": "Рекомендуем"
          "uz": "Tavsiya"
        "title":
          "en": "Fayzulla Khodjaev House-Museum"
          "ru": "Дом-музей Файзуллы Ходжаева"
          "uz": "Fayzulla Xo‘jayev uy-muzeyi"
        "description":
          "en": "Fayzulla Khodjaev House-Museum shows another side of Bukhara: a merchant family house with courtyards, painted rooms, carved wood, porcelain, clothing, and the public story of Fayzulla Khodjaev."
          "ru": "Дом-музей Файзуллы Ходжаева показывает другую сторону Бухары: купеческий семейный дом с дворами, расписными комнатами, резным деревом, фарфором, одеждой и историей Файзуллы Ходжаева как общественного деятеля."
          "uz": "Fayzulla Xo‘jayev uy-muzeyi Buxoroning boshqa tomonini ko‘rsatadi: hovlilari, bezakli xonalari, o‘yma yog‘ochi, chinnisi, kiyimlari va Fayzulla Xo‘jayevning jamoat hayoti bilan bog‘liq savdogar oilasi uyi."
        "ctaHref": "/destinations/uzbekistan/bukhara-region/bukhara/fayzulla-khodjaev-house-museum"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
  - "blockType": "regular"
    "eyebrow":
      "en": "City rhythm"
      "ru": "Ритм города"
      "uz": "Shahar ritmi"
    "title":
      "en": "How Bukhara feels"
      "ru": "Как ощущается Бухара"
      "uz": "Buxoro qanday seziladi"
    "description":
      "en": "Bukhara's strongest moments are slow and close: tea beside water, brickwork in warm light, textiles under domes, and an evening return when the minaret becomes a marker in the lanes."
      "ru": "Самые сильные моменты Бухары медленные и близкие: чай у воды, кирпич в тёплом свете, ткани под куполами и вечернее возвращение, когда минарет становится ориентиром в улицах."
      "uz": "Buxoroning eng kuchli lahzalari sekin va yaqin: suv yonidagi choy, iliq nurdagi gʻisht, gumbazlar ostidagi matolar va minora ko‘chalarda belgi bo‘lib qolgan kechki qaytish."
    "gridClassName": "sm:grid-cols-2 lg:grid-cols-3"
    "cards":
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan/character/bukhara/bukhara-character-1.webp"
        "badge":
          "en": "Food"
          "ru": "Еда"
          "uz": "Taom"
        "title":
          "en": "Bazaar And Courtyard Rhythm"
          "ru": "Базар и двор"
          "uz": "Bozor va hovli ritmi"
        "description":
          "en": "At the morning bazaar, flatbread, dried apricot, and spice sit in the same warm air. A vendor cuts a melon for you to taste, and later the city slows down over tea in a shaded courtyard."
          "ru": "На утреннем базаре в одном тёплом воздухе держатся лепёшка, курага и специи. Продавец режет дыню, чтобы вы попробовали, а позже город замедляется за чаем в тенистом дворе."
          "uz": "Ertalabki bozorda non, quritilgan o‘rik va ziravor hidi bir iliq havoda qo‘shiladi. Sotuvchi siz tatib ko‘rishingiz uchun qovun kesadi, keyin shahar soyali hovlida choy bilan sekinlashadi."
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan/character/bukhara/bukhara-character-2.webp"
        "badge":
          "en": "Culture"
          "ru": "Культура"
          "uz": "Madaniyat"
        "title":
          "en": "Craft passage"
          "ru": "Ремесленный проход"
          "uz": "Hunarmandchilik yo‘lagi"
        "description":
          "en": "Brick vaults, shopfronts, textiles, copperwork, and ceramics make the route between Lyabi-Hauz and Poi-Kalyan feel like a working part of old Bukhara."
          "ru": "Кирпичные своды, лавки, ткани, медная работа и керамика показывают участок между Ляби-Хаузом и Пои-Каляном как живую часть старой Бухары."
          "uz": "Gʻisht ravoqlar, rastalar, matolar, mis buyumlar va keramika Labi Hovuz bilan Poyi Kalon orasidagi yo‘lni eski Buxoroning ishlayotgan qismi sifatida ko‘rsatadi."
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan/character/bukhara/bukhara-character-3.webp"
        "badge":
          "en": "Culture"
          "ru": "Культура"
          "uz": "Madaniyat"
        "title":
          "en": "Architecture in context"
          "ru": "Архитектура в контексте"
          "uz": "Kontekstdagi meʼmorchilik"
        "description":
          "en": "A madrasah, a fortress, and a walled street are more than separate monuments. Together they show where cities traded, ruled, studied, and met, so the route feels like a working place rather than a postcard sequence."
          "ru": "Медресе, крепость и улица за стенами важны не только по отдельности. Вместе они показывают, где торговали, где правили, где учились и где встречались, поэтому маршрут ощущается не набором открыток, а живым городом."
          "uz": "Madrasa, qalʼa va devor ichidagi ko‘cha alohida yodgorliklardan ko‘ra ko‘proq maʼno beradi. Birgalikda ular qayerda savdo bo‘lgan, qayerda hukm yuritilgan, qayerda taʼlim olingan va odamlar qayerda uchrashganini ko‘rsatadi."
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan/character/bukhara/bukhara-character-4.webp"
        "badge":
          "en": "Culture"
          "ru": "Культура"
          "uz": "Madaniyat"
        "title":
          "en": "Early brickwork"
          "ru": "Ранний кирпич"
          "uz": "Ilk gʻisht"
        "description":
          "en": "The small Samanid mausoleum brings Bukhara to an earlier scale: carved brick, park shade, and a quiet pause after minarets and fortress walls."
          "ru": "Небольшой мавзолей Саманидов возвращает Бухару к более раннему масштабу: резной кирпич, тень парка и тихая пауза после минаретов и крепостных стен."
          "uz": "Kichik Somoniylar maqbarasi Buxoroni ertaroq miqyosga qaytaradi: o‘yma gʻisht, park soyasi va minora hamda qalʼa devorlaridan keyingi sokin pauza."
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan/character/bukhara/bukhara-character-5.webp"
        "badge":
          "en": "Culture"
          "ru": "Культура"
          "uz": "Madaniyat"
        "title":
          "en": "Merchant rooms"
          "ru": "Купеческие комнаты"
          "uz": "Savdogar xonalari"
        "description":
          "en": "Painted rooms, carved wood, porcelain, clothing, and household displays bring the old-city walk into a merchant house at Fayzulla Khodjaev House-Museum."
          "ru": "Расписные комнаты, резное дерево, фарфор, одежда и бытовые экспозиции показывают старую Бухару внутри купеческого дома Файзуллы Ходжаева."
          "uz": "Bezakli xonalar, o‘yma yog‘och, chinni, kiyim va maishiy ekspozitsiyalar eski Buxoroni Fayzulla Xo‘jayevning savdogar uyi ichidan ko‘rsatadi."
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan/character/bukhara/bukhara-character-6.webp"
        "badge":
          "en": "Culture"
          "ru": "Культура"
          "uz": "Madaniyat"
        "title":
          "en": "Palace garden and rooms"
          "ru": "Сад и дворцовые комнаты"
          "uz": "Bogʻ va saroy xonalari"
        "description":
          "en": "A short drive from the old city brings marble lions, garden paths, mirrored rooms, and applied-art displays into the last emir's summer residence."
          "ru": "Короткий выезд из старого города приводит к мраморным львам, садовым дорожкам, зеркальным комнатам и прикладному искусству летней резиденции последнего эмира."
          "uz": "Eski shahardan qisqa yo‘l marmar sherlar, bogʻ yo‘llari, oynali xonalar va amaliy sanʼatni so‘nggi amirning yozgi qarorgohida ko‘rsatadi."
  - "blockType": "regular"
    "eyebrow":
      "en": "Before you go"
      "ru": "Перед поездкой"
      "uz": "Yo‘lga chiqishdan oldin"
    "title":
      "en": "How to give Bukhara enough time"
      "ru": "Как дать Бухаре достаточно времени"
      "uz": "Buxoroga qanday yetarli vaqt berish kerak"
    "description":
      "en": "Bukhara rewards a slower city stay. The old centre is walkable, but the memory comes from pauses: shade, carved wood, brick pattern, water, tea, and the guide's thread between power, trade, and daily life."
      "ru": "Бухара лучше раскрывается при медленном пребывании в городе. Старый центр пешеходный, но память остаётся от пауз: тени, резного дерева, кирпичного узора, воды, чая и нити рассказа между властью, торговлей и повседневностью."
      "uz": "Buxoro sekin shahar ritmida yaxshiroq ochiladi. Eski markaz piyoda, ammo xotira pauzalarda qoladi: soya, o‘yma yogʻoch, gʻisht naqshi, suv, choy va hokimiyat, savdo hamda kundalik hayotni bogʻlaydigan hikoya."
    "rows":
      - "ratio": "2:1"
        "left":
          - "type": "dashTitle"
            "title":
              "en": "Stay near the old city"
              "ru": "Рядом со старым городом"
              "uz": "Eski shahar yonida qolish"
            "description":
              "en": "Staying inside or near the historic centre lets the day move between monuments, tea, lunch, shade, and evening light without repeated long transfers."
              "ru": "Жизнь внутри или рядом с историческим центром позволяет дню двигаться между памятниками, чаем, обедом, тенью и вечерним светом без длинных повторных переездов."
              "uz": "Tarixiy markaz ichida yoki yaqinida yashash kunni yodgorliklar, choy, tushlik, soya va kechki nur orasida uzoq takroriy transferlarsiz olib boradi."
          - "type": "quote"
            "quote":
              "en": "Bukhara is most memorable when the old city remains close enough to revisit."
              "ru": "Бухара запоминается сильнее, когда к старому городу можно вернуться."
              "uz": "Buxoro eski shaharga qaytish imkoni qolganda kuchliroq esda qoladi."
          - "type": "dashTitle"
            "title":
              "en": "Walking rhythm"
              "ru": "Пешеходный ритм"
              "uz": "Piyoda ritm"
            "description":
              "en": "The old city is strongest on foot, but not as a forced march. Short pauses help the carved doors, brickwork, and domes become distinct."
              "ru": "Старый город сильнее всего пешком, но не как принудительный марш. Короткие паузы помогают различить резные двери, кирпич и купола."
              "uz": "Eski shahar piyoda eng kuchli, lekin bu majburiy yurish emas. Qisqa pauzalar o‘yma eshik, gʻisht va gumbazlarni alohida ko‘rsatadi."
          - "type": "dashTitle"
            "title":
              "en": "Beyond the old city"
              "ru": "За пределами старого города"
              "uz": "Eski shahardan tashqarida"
            "description":
              "en": "Craft, palace, and pilgrimage stops outside the center work best as measured continuations when the itinerary has enough space."
              "ru": "Ремесленные, дворцовые и паломнические остановки за пределами центра лучше добавлять как размеренные продолжения, когда в маршруте есть место."
              "uz": "Markaz tashqarisidagi hunarmandchilik, saroy va ziyorat bekatlarini marshrutda joy bo‘lsa, shoshilmas davom sifatida qo‘shgan yaxshiroq."
          - "type": "alert"
            "title":
              "en": "For the traveler"
              "ru": "Для путешественника"
              "uz": "Sayohatchi uchun"
            "description":
              "en": "The first walk feels best on foot. The city grows richer when the day returns to shade and water instead of racing from one outer stop to another."
              "ru": "Первая прогулка лучше чувствуется пешком. Город становится богаче, когда день возвращается к тени и воде, а не спешит от одной внешней точки к другой."
              "uz": "Birinchi sayr piyoda yaxshiroq seziladi. Kun soya va suvga qaytganda, tashqi bekatlar orasida shoshilgandan ko‘ra shahar boyroq seziladi."
        "right":
          - "type": "miniTable"
            "title":
              "en": "Before you go"
              "ru": "Перед поездкой"
              "uz": "Yo‘lga chiqishdan oldin"
            "icon": "Circle"
            "rows":
              - "icon": "MapPin"
                "title":
                  "en": "Before you go Where to stay"
                  "ru": "Перед поездкой Где остановиться"
                  "uz": "Yo‘l oldidan Qayerda qolish"
                "description":
                  "en": "Old-city hotels or nearby streets keep walks, shade, and evening returns simple."
                  "ru": "Отели в старом городе или рядом с ним упрощают прогулки, тень и вечерние возвращения."
                  "uz": "Eski shahar ichidagi yoki yaqinidagi mehmonxonalar yurish, soya va kechki qaytishni osonlashtiradi."
              - "icon": "Landmark"
                "title":
