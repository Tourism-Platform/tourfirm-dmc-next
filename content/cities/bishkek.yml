                  "ru": "Международный аэропорт Манас и дороги через Чуйскую долину."
                  "uz": "Manas xalqaro aeroporti va Chuy vodiysi orqali yoʻllar."
              - "icon": "Sun"
                "title":
                  "en": "Season and pace"
                  "ru": "Сезон и темп"
                  "uz": "Mavsum va ritm"
                "description":
                  "en": "Spring and autumn are comfortable for city walks; summer days benefit from early starts."
                  "ru": "Весна и осень комфортны для прогулок; летом лучше начинать раньше."
                  "uz": "Bahor va kuz sayr uchun qulay; yozda erta boshlash foydali."
  - "blockType": "regular"
    "eyebrow":
      "en": "Nearby"
      "ru": "Рядом"
      "uz": "Yaqin joylar"
    "title":
      "en": "Chuy foothills, lake roads, and the route south"
      "ru": "Чуйские предгорья, дороги к озеру и маршрут на юг"
      "uz": "Chuy etaklari, koʻl yoʻllari va janubga yoʻnalish"
    "description":
      "en": "Tokmok and Ala-Archa sit close to the capital. Karakol and Osh become the next major route anchors when the itinerary expands."
      "ru": "Токмок и Ала-Арча находятся рядом со столицей. Каракол и Ош становятся следующими крупными опорами, когда маршрут расширяется."
      "uz": "Toʻqmoq va Ala-Archa poytaxtga yaqin. Yoʻnalish kengaysa, Qorakoʻl va Oʻsh keyingi yirik tayanchlarga aylanadi."
    "gridClassName": "sm:grid-cols-2 lg:grid-cols-2"
    "cards":
      - "type": "routeIdea"
        "image": "assets/images/destinations/kyrgyzstan/next/bishkek-next-tokmok.webp"
        "badge":
          "en": "City"
          "ru": "Город"
          "uz": "Shahar"
        "title":
          "en": "Tokmok"
          "ru": "Токмок"
          "uz": "Toqmoq"
        "description":
          "en": "Tokmok gives the road east of Bishkek a clear Chuy Valley anchor: Burana Tower, Balasagun archaeology, open fields, and a route choice before Issyk-Kul or later Silk Road sites."
          "ru": "Токмок даёт дороге восточнее Бишкека ясный ориентир Чуйской долины: башню Бурану, археологию Баласагуна, открытые поля и выбор перед Иссык-Кулем или более поздними точками Шёлкового пути."
          "uz": "Toqmoq Bishkekdan sharqqa ketadigan yoʻlga aniq Chuy vodiysi tayanchini beradi: Burana minorasi, Balasagʻun arxeologiyasi, ochiq dalalar va Issiqkoʻl yoki keyingi Ipak yoʻli joylari oldidan yoʻnalish tanlovi."
        "ctaHref": "/destinations/kyrgyzstan/bishkek-and-chuy-foothills/tokmok"
        "ctaLabel":
