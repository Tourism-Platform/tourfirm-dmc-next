    "en": "Bishkek gives Kyrgyzstan a calm first frame: Ala-Too Square opens the city, Osh Bazaar adds bread steam and market movement, and the Tian Shan sits close enough to shape the next road."
    "ru": "Бишкек задаёт Кыргызстану спокойный первый ритм: площадь Ала-Тоо открывает город, Ошский базар добавляет запах лепёшек и рыночное движение, а Тянь-Шань остаётся так близко, что влияет на следующую дорогу."
    "uz": "Bishkek Qirgʻizistonga xotirjam birinchi ritm beradi: Ala-Too maydoni shaharni ochadi, Oʻsh bozori non hidi va bozor harakatini qoʻshadi, Tyan-Shan esa keyingi yoʻlni belgilaydigan darajada yaqin."
