              "en": "Bishkek is strongest when arrival turns into orientation."
              "ru": "Бишкек сильнее всего, когда приезд превращается в ориентацию."
              "uz": "Bishkek kelish kuni yoʻnalish olishga aylanganda eng kuchli."
          - "type": "dashTitle"
            "title":
              "en": "Let the market show daily life"
              "ru": "Пусть рынок покажет повседневную жизнь"
              "uz": "Bozor kundalik hayotni ko‘rsatsin"
            "description":
              "en": "Osh Bazaar matters because food, trade, household stalls, and busy lanes put the capital's everyday energy in one place."
              "ru": "Ошский базар важен тем, что еда, торговля, хозяйственные ряды и плотное движение собирают повседневную энергию столицы в одном месте."
              "uz": "Oʻsh bozori muhim, chunki taom, savdo, roʻzgʻor rastalari va gavjum yoʻlaklar poytaxtning kundalik energiyasini bir joyga jamlaydi."
          - "type": "dashTitle"
            "title":
              "en": "Choose one outward direction"
              "ru": "Выберите одно направление дальше"
              "uz": "Keyingi bitta yoʻnalishni tanlang"
            "description":
              "en": "Burana, Ala-Archa, Issyk-Kul, and Manas Airport pull the route in different directions. The route is calmer when the next road is chosen before more city stops are added."
              "ru": "Бурана, Ала-Арча, Иссык-Куль и аэропорт Манас тянут маршрут в разные стороны. День спокойнее, когда следующая дорога выбрана до того, как в план добавляются новые городские остановки."
              "uz": "Burana, Ala-Archa, Issiqkoʻl va Manas aeroporti yoʻnalishni turli tomonga tortadi. Keyingi yoʻl yangi shahar toʻxtashlari qoʻshilishidan oldin tanlansa, kun xotirjamroq boʻladi."
          - "type": "alert"
            "title":
              "en": "For the traveler"
              "ru": "Для путешественника"
              "uz": "Sayohatchi uchun"
            "description":
              "en": "Let Bishkek set the pace for Kyrgyzstan: a central walk, a market morning, and a next road chosen with care."
              "ru": "Пусть Бишкек задаст темп Кыргызстану: центральная прогулка, рыночное утро и следующая дорога, выбранная с запасом."
              "uz": "Bishkek Qirgʻiziston ritmini belgilasin: markaziy sayr, bozor tongi va ehtiyot bilan tanlangan keyingi yoʻl."
        "right":
          - "type": "miniTable"
            "title":
              "en": "Before you go"
              "ru": "Перед поездкой"
              "uz": "Borishdan oldin"
            "icon": "Circle"
            "rows":
              - "icon": "MapPin"
                "title":
                  "en": "Planning notes Suggested stay"
                  "ru": "Коротко Сколько времени"
                  "uz": "Rejalash qaydlari Qancha vaqt"
                "description":
                  "en": "One or two nights, depending on arrival time and onward road plans."
                  "ru": "Одна-две ночи, в зависимости от прилёта и дальнейших дорог."
                  "uz": "Kelish va keyingi yoʻllarga qarab bir yoki ikki kecha."
              - "icon": "Landmark"
                "title":
                  "en": "Main access"
                  "ru": "Главный доступ"
                  "uz": "Asosiy kirish"
                "description":
