          "ru": "Город"
          "uz": "Shahar"
        "title":
          "en": "Ala-Archa"
          "ru": "Ала-Арча"
          "uz": "Ala-Archa"
        "description":
          "en": "Ala-Archa is the national-park area south of Bishkek where the capital route turns toward a river gorge, juniper slopes, snowy ridges, and a walk chosen for current weather."
          "ru": "Ала-Арча — территория национального парка к югу от Бишкека, где столичный маршрут переходит к речному ущелью, арчовым склонам, снежным гребням и прогулке по погоде."
          "uz": "Ala-Archa Bishkekdan janubdagi milliy bogʻ hududi bo‘lib, poytaxt yo‘nalishini daryo darasi, archa yonbagʻirlari, qorli qirralar va ob-havoga mos yurish tanloviga olib chiqadi."
        "ctaHref": "/destinations/kyrgyzstan/bishkek-and-chuy-foothills/ala-archa"
        "ctaLabel":
          "en": "View"
          "ru": "Смотреть"
          "uz": "Ko'rish"
      - "type": "routeIdea"
