        "title":
          "en": "Osh"
          "ru": "Ош"
          "uz": "Oʻsh"
        "description":
          "en": "Osh is where Kyrgyzstan turns south: Sulaiman-Too above the city, bazaar lanes below it, and roads toward Uzgen, Alay, Sary-Mogul, and the Fergana edge."
          "ru": "Ош — место, где Кыргызстан поворачивает на юг: Сулайман-Тоо над городом, базарные ряды у подножия и дороги к Узгену, Алаю, Сары-Моголу и Ферганской долине."
          "uz": "Oʻshda Qirgʻiziston janubga buriladi: shahar ustida Sulaymon-Too, pastda bozor yoʻlaklari, oldinda esa Oʻzgan, Oloy, Sari-Mogʻol va Fargʻona vodiysi tomonga yoʻllar."
        "ctaHref": "/destinations/kyrgyzstan/osh-and-southern-silk-road/osh"
        "ctaLabel":
