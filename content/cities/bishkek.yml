          "uz": "Shahar"
        "title":
          "en": "Karakol"
          "ru": "Каракол"
          "uz": "Qorakoʻl"
        "description":
          "en": "Karakol anchors eastern Issyk-Kul with Dungan food, timber religious landmarks, guesthouse streets, museum context, and measured choices toward valleys, hot springs, and high trails."
          "ru": "Каракол держит восточный Иссык-Куль: дунганская еда, деревянные религиозные ориентиры, улицы гостевых домов, музейный контекст и продуманный выбор долин, источников и высоких троп."
          "uz": "Qorakoʻl sharqiy Issiqkoʻlni ushlab turadi: dungan taomi, yogʻoch diniy moʻljallar, mehmon uylari koʻchalari, muzey konteksti hamda vodiylar, buloqlar va baland soʻqmoqlar sari puxta tanlov."
        "ctaHref": "/destinations/kyrgyzstan/issyk-kul-and-karakol/karakol"
        "ctaLabel":
          "en": "View"
          "ru": "Смотреть"
