  "metaDescription":
    "en": "West of Ashgabat, Gokdepe changes the capital route from marble scale to a quieter town setting. The visit is not about adding many stops. It is about entering the mosque respectfully, reading the fortress site with care, and deciding whether the Ahal road fits the route conditions."
    "ru": "К западу от Ашхабада Гёкдепе переводит столичный маршрут из мраморного масштаба в более тихую городскую среду. Здесь не нужно набирать много остановок. Важнее уважительно войти в мечеть, спокойно прочитать место крепости и понять, подходит ли дороге Ахала текущий темп маршрута."
    "uz": "Ashxobod gʻarbida Goʻkdepe poytaxt marshrutini marmar miqyosdan sokinroq shahar muhitiga oʻtkazadi. Bu yerda koʻp bekat qoʻshish shart emas. Muhimi - masjidga hurmat bilan kirish, qalʼa joyini ehtiyotkor tushunish va Ahal yoʻli shu marshrut sharoitiga mos keladimi, shuni hal qilish."
