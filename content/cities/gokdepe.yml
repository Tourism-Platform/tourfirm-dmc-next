          "uz": "Odatda 1–2 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Ahaldagi masjid, xotira va togʻoldi yoʻli shaharchasi»."
