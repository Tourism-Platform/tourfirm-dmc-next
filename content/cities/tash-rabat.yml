    "title":
      "en": "Naryn, Song-Kul, and Kochkor shape the wider route"
      "ru": "Нарын, Сон-Куль и Кочкор задают широкий маршрут"
      "uz": "Naryn, Soʻng-Koʻl va Kochkor kengroq yoʻnalishni shakllantiradi"
    "description":
      "en": "Naryn is the practical river-road pause before the southbound approach, Song-Kul is a separate high-pasture lake decision, and Kochkor often gives the western craft-and-road context. Tash Rabat can connect with them, but it should not compress them."
      "ru": "Нарын помогает подготовить южный подъезд, Сон-Куль требует отдельного решения как высокогорное озеро, а Кочкор часто даёт западный ремесленный и дорожный контекст. Таш-Рабат может связываться с ними, но не должен сжимать их в одну спешную схему."
      "uz": "Naryn janubiy yondashuvni tayyorlaydi, Soʻng-Koʻl alohida baland yaylov koʻli qarorini talab qiladi, Kochkor esa koʻpincha gʻarbiy hunarmandchilik va yoʻl kontekstini beradi. Tash Rabat ular bilan bogʻlanishi mumkin, lekin ularni bitta shoshilinch rejaga siqmasligi kerak."
