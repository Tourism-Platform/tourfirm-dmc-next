  "metaDescription":
    "en": "Tash Rabat gives the southbound Naryn road a clear purpose. The valley narrows around a stone caravanserai, the weather feels close, and the route asks for a slower decision: visit the building well, check the season, then choose the road out with care."
    "ru": "Таш-Рабат даёт южной дороге из Нарына понятную цель. Долина сужается вокруг каменного караван-сарая, погода ощущается близко, и маршрут просит более спокойного решения: внимательно посмотреть здание, проверить сезон и только потом выбирать дорогу дальше."
    "uz": "Tash Rabat Naryndan janubga ketadigan yoʻlga aniq maʼno beradi. Vodiy tosh karvonsaroy atrofida torayadi, ob-havo yaqin seziladi, marshrut esa shoshilmaslikni soʻraydi: binoni diqqat bilan koʻrish, mavsumni tekshirish va keyingi yoʻlni ehtiyotkor tanlash."
