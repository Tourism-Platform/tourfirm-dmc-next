              "ru": "Токмок нужен маршруту потому, что стоит между Бишкеком и наследием Чуйской долины. Ценность не в длинном списке городских остановок, а в моменте, когда дорога получает историю."
              "uz": "Toqmoq Bishkek va Chuy vodiysi merosi orasida turgani uchun yoʻnalishga kerak. Qimmatli tomoni uzun shahar roʻyxatida emas, yoʻl tarixiy maʼno oladigan lahzada."
          - "type": "quote"
            "quote":
              "en": "Tokmok works best as a modest town with one clear tower, open Chuy ground, and an eastbound road that knows where it is going."
              "ru": "Токмок лучше всего звучит как скромный город с одной ясной башней, открытой Чуйской равниной и дорогой на восток, которая понимает своё направление."
              "uz": "Toqmoq kamtar shahar, bitta aniq minora, ochiq Chuy maydoni va qayerga ketayotganini biladigan sharqiy yoʻl sifatida eng yaxshi seziladi."
          - "type": "dashTitle"
            "title":
              "en": "Give Burana enough attention"
              "ru": "Дайте Буране достаточно внимания"
              "uz": "Buranaga yetarli eʼtibor bering"
            "description":
              "en": "Rushing the tower weakens the visit. Leave time for the first view, brick detail, balbal stones, museum context, and current access rules."
              "ru": "Спешка ослабляет визит. Оставьте время на первый вид башни, кирпичные детали, балбалы, музейный контекст и актуальные правила доступа."
              "uz": "Shoshilish tashrifni kuchsizlantiradi. Minoraning birinchi koʻrinishi, gʻisht detallari, balbal toshlari, muzey konteksti va joriy kirish qoidalariga vaqt qoldiring."
          - "type": "dashTitle"
            "title":
              "en": "Add extensions carefully"
              "ru": "Добавляйте продолжения аккуратно"
              "uz": "Davomlarni ehtiyotkor qoʻshing"
            "description":
              "en": "Ak-Beshim/Suyab and Krasnaya Rechka/Navekat can deepen the Silk Road story, but only when access, road time, and traveler interest support the extra stop."
              "ru": "Ак-Бешим/Суяб и Красная Речка/Навекат могут углубить тему Шёлкового пути, но только когда доступ, дорожное время и интерес путешественника поддерживают дополнительную остановку."
              "uz": "Ak-Beshim/Suyab va Krasnaya Rechka/Navekat Ipak yoʻli mavzusini chuqurlashtirishi mumkin, lekin faqat kirish, yoʻl vaqti va sayohatchi qiziqishi qoʻshimcha toʻxtashni oqlaganda."
          - "type": "alert"
            "title":
              "en": "Traveler takeaway"
              "ru": "Что важно для путешественника"
              "uz": "Sayohatchi uchun xulosa"
            "description":
              "en": "Let Tokmok clarify Burana and the Chuy road, not become a long city list."
              "ru": "Пусть Токмок объясняет Бурану и Чуйскую дорогу, а не превращается в длинный городской список."
              "uz": "Toqmoq Burana va Chuy yoʻlini tushuntirsin; uni uzun shahar roʻyxatiga aylantirmang."
