          "ru": "Ак-Бешим — не быстрая фотография у памятника. Это археологическая территория Суяба, одного из компонентов Шёлкового пути в Чуйской долине. Добавляйте её после Бураны, когда есть время на объяснение, аккуратную прогулку и ясную причину увидеть долину шире."
