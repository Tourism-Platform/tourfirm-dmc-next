          "ru": "Красная Речка даёт Чуйской равнине более тихую археологическую остановку после Бураны и Ак-Бешима/Суяба. С правильным контекстом низкие следы Навеката помогают увидеть долину как последовательность городищ, а не как один отдельный памятник."
