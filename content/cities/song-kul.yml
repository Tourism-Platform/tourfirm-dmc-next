  "metaDescription":
    "en": "Song-Kul is where the central highland route opens into water, pasture, horses, and sky. The lake area feels spacious because the journey slows down; it stays comfortable when weather, altitude, road condition, and the night's camp are treated with care."
    "ru": "Сон-Куль - место, где центральный высокогорный маршрут раскрывается водой, пастбищем, лошадьми и небом. Район озера кажется просторным потому, что путь здесь замедляется; комфортным он остается, когда к погоде, высоте, состоянию дороги и лагерю на ночь относятся внимательно."
    "uz": "Soʻng-Koʻl markaziy baland hudud marshruti suv, yaylov, otlar va osmonga ochiladigan joy. Koʻl hududi yoʻl sekinlashgani uchun keng tuyuladi; ob-havo, balandlik, yoʻl holati va tunash lageriga eʼtibor berilganda qulay bo‘ladi."
