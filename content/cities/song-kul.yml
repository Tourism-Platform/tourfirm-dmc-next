              "ru": "Сон-Куль лучше читать через движение, а не через улицы: подняться со стороны Кочкора или Нарына, оставить озеро главной паузой, внимательно выбрать юртовую ночевку и затем решить, вернется ли маршрут на запад, продолжится к Нарыну или позже повернет к Таш-Рабату."
