              "uz": "Soʻng-Koʻl marshrut kamroq narsani tanlaganda kuchliroq ochiladi. Bitta koʻl, bitta lager, ob-havoga mos bitta yoʻl tanlovi va real chiqish baland hududni yaxshiroq his qildiradi."
