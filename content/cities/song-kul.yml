              "en": "Tash Rabat, Naryn, Kochkor, and wider Central Tian Shan routes can all connect, but each needs enough road time and weather margin."
              "ru": "Таш-Рабат, Нарын, Кочкор и другие дороги Центрального Тянь-Шаня могут связываться с Сон-Кулем, но каждому нужен запас времени и погоды."
              "uz": "Tash Rabat, Narin, Kochkor va Markaziy Tyan-Shanning kengroq yoʻllari bogʻlanishi mumkin, lekin har biriga yoʻl va ob-havo zaxirasi kerak."
