  - "blockType": "regular"
    "eyebrow":
      "en": "Nearby"
      "ru": "Рядом"
      "uz": "Yaqinda"
    "title":
      "en": "Kochkor, Naryn, and Tash Rabat shape the next choices"
      "ru": "Кочкор, Нарын и Таш-Рабат задают следующие решения"
      "uz": "Kochkor, Narin va Tash Rabat keyingi tanlovlarni belgilaydi"
    "description":
      "en": "Kochkor often gives the craft-and-host approach, Naryn gives the practical river-road pause, and Tash Rabat adds a separate caravanserai valley when the route has enough time. Song-Kul connects them, but should not be used to compress them."
      "ru": "Кочкор часто дает ремесленный и гостевой подход, Нарын - практичную паузу на речной дороге, а Таш-Рабат добавляет отдельную долину караван-сарая, если у маршрута хватает времени. Сон-Куль связывает их, но не должен их сжимать."
      "uz": "Kochkor ko‘pincha hunarmandchilik va mezbonlik yondashuvini beradi, Narin amaliy daryo-yoʻl pauzasini beradi, Tash Rabat esa vaqt yetarli bo‘lsa, alohida karvonsaroy vodiysini qoʻshadi. Soʻng-Koʻl ularni bogʻlaydi, lekin siqmasligi kerak."
