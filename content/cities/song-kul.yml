          "ru": "Кочкор даёт центральному высокогорному маршруту спокойную первую паузу: войлочное ремесло, гостевой вечер, рыночные сборы и выбор дороги перед Сон-Кулем."
          "uz": "Kochkor markaziy baland togʻ yoʻnalishiga sokin birinchi pauza beradi: kigiz hunari, mehmon uyi vaqti, bozor tayyorgarligi va Soʻng-Koʻl oldidagi yoʻl tanlovi."
