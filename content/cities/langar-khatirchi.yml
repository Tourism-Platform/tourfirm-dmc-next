"excerpt":
  "en": "Langar sits on the Khatirchi side of Navoi Region's tourism-village map. It is not a landmark to rush through; it is a small mahalla stop where the route can slow into village lanes, shade, a family table, and the open country leading back toward Nurata, Chuya, Sentob, or Aydarkul."
  "ru": "Лангар находится на хатырчинской стороне туристической карты Навоийской области. Это не достопримечательность для быстрой отметки, а небольшая махалля, где маршрут может замедлиться до сельских улиц, тени, семейного стола и открытой местности по пути к Нурате, Чуе, Сентобу или Айдаркулю."
  "uz": "Langar Navoiy viloyati turizm qishloqlari xaritasining Xatirchi tomonida turadi. Bu shoshilib ko‘riladigan katta yodgorlik emas, balki yo‘l qishloq ko‘chalari, soya, oilaviy dasturxon va Nurota, Chuya, Sentob yoki Aydarko‘l sari ochiladigan kenglikka sekinlashishi mumkin bo‘lgan kichik mahalla bekati."
