  "metaDescription":
    "en": "Chodak sits on the mountain side of Pop District, where the road rises toward cooler air, gardens, walnut groves, springs, and the Chodaksoy valley. In a Fergana Valley route, it belongs as a modest village pause, not as a guaranteed resort stop."
    "ru": "Чодак лежит на горной стороне Папского района: дорога поднимается к прохладному воздуху, садам, ореховым рощам, родникам и долине Чодаксая. В маршруте по Ферганской долине это скромная сельская пауза, а не курортная остановка по умолчанию."
    "uz": "Chodak Pop tumanining tog‘ tomonida joylashgan: yo‘l salqin havo, bog‘lar, yong‘oqzorlar, buloqlar va Chodaksoy vodiysiga ko‘tariladi. Farg‘ona vodiysi marshrutida bu doimiy kurort bekati emas, kamtar qishloq pauzasi."
