          "uz": "Chodakda guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "2–3 nights is usually enough when the old core or main anchors get a full walking window. City tone: “A mountain village in the Chodaksoy valley”."
          "ru": "Обычно хватает 2–3 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Горное село в долине Чодаксая»."
          "uz": "Odatda 2–3 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Chodaksoy vodiysidagi tog‘ qishlog‘i»."
      - "type": "destinationInsight"
