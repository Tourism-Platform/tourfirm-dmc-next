          "ru": "Дорога из Худжанда переводит путешествие от города на Сырдарье к холму, голубому куполу, этикету святыни и следующему выбору в долине."
          "uz": "Xoʻjanddan keladigan yoʻl sayohatni Sirdaryo boʻyidagi shahardan tepalik, moviy gumbaz, ziyorat odobi va vodiydagi keyingi tanlovga olib oʻtadi."
  - "blockType": "regular"
