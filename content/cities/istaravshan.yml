      "uz": "Istaravshan yodgorliklar, ziyorat odobi, bozor yoʻlaklari va hunarmand ishi bitta sokin shahar yurishi ichida qolganida kuchliroq seziladi. Shu surʼatda u binolar roʻyxati emas, tirik shahar boʻlib oʻqiladi."
