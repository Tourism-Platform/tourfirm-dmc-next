      "uz": "Ostonadan yoʻl shimolga, Burabay ko‘l-o‘rmonlari va Qoʻrgʻaljin suv-botqoq hududlariga, yoki parvoz orqali janubga — Olmaota va Chimkentga burilishi mumkin."
