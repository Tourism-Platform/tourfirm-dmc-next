          "en": "National Museum and steppe scale"
          "ru": "Национальный музей и масштаб степи"
          "uz": "Milliy muzey va dasht miqyosi"
        "description":
          "en": "The National Museum pairs state history with open avenues, helping Astana feel tied to the steppe rather than only to its towers."
          "ru": "Национальный музей ставит историю государства рядом с широкими проспектами, и Астана ощущается связанной со степью, а не только с башнями."
          "uz": "Milliy muzey davlat tarixini keng shohko‘chalar bilan yonma-yon ko‘rsatadi; Ostona faqat minoralar emas, dasht bilan bog‘langan poytaxtdek seziladi."
  - "blockType": "regular"
