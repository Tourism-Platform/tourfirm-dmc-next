                  "ru": "С конца весны до начала осени проще всего. Зима может быть выразительной, но ветер и холод требуют тёплых пауз в помещении."
                  "uz": "Kech bahordan erta kuzgacha eng oson. Qish taʼsirli bo‘lishi mumkin, lekin shamol va sovuq yopiq joylarni oldindan o‘ylashni talab qiladi."
