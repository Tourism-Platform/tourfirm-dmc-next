              "uz": "Zamonaviy poytaxt uchun keling; keyingi qadam ko‘l-o‘rmon, qushlar qo‘riqxonasi, biznes dasturi yoki janubga qaytish ekanini aniq bilib keting."
        "right":
          - "type": "miniTable"
            "title":
