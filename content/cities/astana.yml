              "ru": "Бурабай и Коргалжын лучше планировать отдельно: с дорогой, сезоном и световым днём, проверенными до выезда."
              "uz": "Burabay va Qoʻrgʻaljin alohida reja bilan yaxshi chiqadi: yo‘l, mavsum va kunduzgi vaqt jo‘nashdan oldin tekshiriladi."
          - "type": "alert"
