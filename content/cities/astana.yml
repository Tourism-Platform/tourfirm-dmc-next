              "ru": "Астана сильнее всего, когда линия плановой столицы уравновешена одной неспешной человеческой паузой."
              "uz": "Ostona rejali poytaxt chizigʻi bir sekin insoniy pauza bilan muvozanatlanganda kuchliroq seziladi."
          - "type": "dashTitle"
