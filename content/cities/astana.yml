      "uz": "Dastlab poytaxt rasmiy ko‘rinishi mumkin. Chap qirgʻoqdagi aniq yo‘l, bitta asosiy muzey va Ishim bo‘yidagi yoki kechki ovqatdagi pauza shaharni faqat xaritadagi binolar emas, tirik joy sifatida ko‘rsatadi."
