        "description":
          "en": "Baiterek gives the planned capital a first line: tower views, open plazas, boulevard wind, and the scale of the Left Bank."
          "ru": "Байтерек задаёт первую линию новой столицы: вид с башни, открытые площади, ветер на бульваре и масштаб Левого берега."
          "uz": "Bayterek yangi poytaxtning ilk yoʻnalishini ko‘rsatadi: minora manzarasi, ochiq maydonlar, bulvar shamoli va chap qirgʻoq miqyosi."
      - "type": "experience"
        "image": "assets/images/destinations/kazakhstan.jpg"
        "badge":
          "en": "Special interest"
          "ru": "Специнтерес"
          "uz": "Maxsus qiziqish"
        "title":
          "en": "Nur Alem and the Expo sphere"
          "ru": "Nur Alem и сфера Expo"
          "uz": "Nur Alem va Expo sferasi"
        "description":
          "en": "The Expo sphere adds an indoor pause with future-energy displays, new architecture, and the wide space of Astana’s exhibition district."
          "ru": "Сфера Expo даёт паузу в помещении: экспозиции об энергии будущего, новая архитектура и широкое пространство выставочного района."
          "uz": "Expo sferasi tashrifga yopiq makondagi pauza qo‘shadi: kelajak energiyasi ekspozitsiyalari, yangi arxitektura va ko‘rgazma hududining keng maydoni."
      - "type": "experience"
