          "ru": "Сколько времени группам стоит проводить в Астана?"
          "uz": "Ostonada guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "1–2 nights is usually enough when the old core or main anchors get a full walking window. City tone: “A planned capital with the steppe still close”."
          "ru": "Обычно хватает 1–2 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Современная столица рядом со степью»."
          "uz": "Odatda 1–2 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Dashtga yaqin zamonaviy poytaxt»."
      - "type": "destinationInsight"
        "icon": "Footprints"
        "title":
