    "ru": "Астана не пытается казаться старой. Первый образ города — широкая линия Левого берега: Байтерек, стеклянные проспекты, Nur Alem, Национальный музей и Ишим, а ветер напоминает, как близко степь."
    "uz": "Ostona qadimiy shahar kabi ko‘rinishga urinmaydi. Uning birinchi taassuroti chap qirg‘oqdagi keng chiziqdan boshlanadi: Bayterek, keng shohko‘chalar va shisha binolar, Nur Alem, Milliy muzey va Ishim, shamol esa dasht qanchalik yaqinligini eslatadi."
