      "ru": "Дарваза обычно стоит между крупными опорами Туркменистана: столичным регионом, северным маршрутом Хорезма или более длинной программой, которая возвращается к Мары и Мерву."
      "uz": "Darvoza odatda Turkmanistonning kattaroq tayanchlari orasida turadi: poytaxt hududi, shimoliy Xorazm yoʻli yoki Mary va Marvga qaytadigan uzunroq dastur."
