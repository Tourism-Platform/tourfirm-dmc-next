  "metaDescription":
    "en": "Darvaza begins as a long Karakum road leg. The crater area, darkness, wind, and possible overnight stop can make the journey memorable, but only when current access, vehicle support, weather, and camp standards line up. When they do, Darvaza gives Turkmenistan a stark desert night between Ashgabat and the northern or eastern route."
    "ru": "Дарваза начинается как длинная дорога через Каракумы. Кратерная зона, темнота, ветер и возможная ночёвка могут запомниться надолго, но только когда доступ, машина, погода и лагерь подтверждены. Тогда Дарваза даёт Туркменистану суровую пустынную ночь между Ашхабадом и северным или восточным продолжением."
    "uz": "Darvoza uzoq Qoraqum yoʻli sifatida boshlanadi. Krater hududi, qorongʻilik, shamol va mumkin bo‘lgan tunash safarni esda qoldirishi mumkin, lekin kirish, transport, ob-havo va lager sharoiti mos kelganda. Shunda Darvoza Ashxobod bilan shimoliy yoki sharqiy davom orasida keskin sahro tunini beradi."
