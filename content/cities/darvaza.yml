        "icon": "CircleQuestionMark"
        "title":
          "en": "How long should groups stay in Darvaza?"
          "ru": "Сколько времени группам стоит проводить в Дарваза?"
          "uz": "Darvozada guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "one focused city day plus overnight is usually enough when the old core or main anchors get a full walking window. City tone: “Karakum road, crater night, and a careful desert decision”."
          "ru": "Обычно хватает один насыщенный городской день плюс ночёвка, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Дорога Каракумов, ночь у кратера и аккуратное решение»."
          "uz": "Odatda bitta zich shahar kuni va tunash yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Qoraqum yoʻli, krater tuni va ehtiyotkor qaror»."
      - "type": "destinationInsight"
        "icon": "MapPin"
        "title":
