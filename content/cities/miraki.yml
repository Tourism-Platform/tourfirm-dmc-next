  - "blockType": "regular"
    "eyebrow":
      "en": "Before you go"
      "ru": "Перед поездкой"
      "uz": "Safardan oldin"
    "title":
      "en": "Plan Miraki as a small foothill extension"
      "ru": "Планируйте Мираки как небольшое предгорное продолжение"
      "uz": "Miroqini kichik tog‘oldi davomi sifatida rejalang"
    "description":
      "en": "Miraki widens Shahrisabz without pretending to be a resort: river air, guesthouse life, seasonal fields, Hisorak views, and a visit rhythm shaped by the season and the road."
      "ru": "Мираки расширяет Шахрисабз, не притворяясь курортом: речной воздух, жизнь гостевых домов, сезонные поля, виды Гиссарака и ритм визита, который задают сезон и дорога."
      "uz": "Miroqi Shahrisabzni kurort qilib ko‘rsatmasdan kengaytiradi: daryo havosi, mehmon uylari hayoti, mavsumiy dalalar, Hisorak manzaralari va mavsum hamda yo‘lga bog‘liq tashrif ritmi."
    "rows":
      - "ratio": "2:1"
        "left":
          - "type": "dashTitle"
            "title":
