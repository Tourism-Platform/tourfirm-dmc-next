          "ru": "Лавки, двери гостевых домов, поля и местные голоса оживляют остановку, когда прогулка остаётся небольшой и уважительной."
          "uz": "Do‘konlar, mehmon uyi eshiklari, dalalar va mahalliy ovozlar yurish kichik va hurmatli bo‘lganda bekatni jonlantiradi."
      - "type": "experience"
