          "ru": "Чай, лепёшка, фрукты и простая еда звучат естественно, когда семья заранее знает время приезда, размер группы и особенности питания."
          "uz": "Choy, non, meva va sodda ovqat oila kelish vaqti, guruh soni va ovqatlanish ehtiyojini oldindan bilganda tabiiy chiqadi."
