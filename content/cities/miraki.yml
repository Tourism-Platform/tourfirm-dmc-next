              "ru": "Жизнь махалли, не постановка"
              "uz": "Mahalla hayoti, sahna emas"
            "description":
              "en": "The best visits keep guesthouse doors, small shops, family tables, and fields modest and personal. Arrival time, rooms, and meals should be arranged before the route reaches the village."
              "ru": "Лучшие визиты оставляют двери гостевых домов, небольшие лавки, семейный стол и поля скромными и личными. Время приезда, комнаты и питание лучше согласовать до прибытия в посёлок."
              "uz": "Eng yaxshi tashriflar mehmon uyi eshiklari, kichik do‘konlar, oilaviy dasturxon va dalalarni sodda hamda shaxsiy qoldiradi. Kelish vaqti, xonalar va ovqat qishloqqa yetib borishdan oldin kelishiladi."
          - "type": "dashTitle"
            "title":
              "en": "Hisorak is an extension"
              "ru": "Гиссарак как расширение, а не автоматическое включение"
              "uz": "Hisorak taxmin emas, kengayish"
            "description":
              "en": "Reservoir views, the cable-car area, boat rides, Suvtushar, or higher mountain outings can deepen the route when the weather, access, tickets, safety, and return road are clear."
              "ru": "Виды водохранилища, зона канатной дороги, катера, Сувтушар или более высокие горные выезды могут углубить маршрут, когда погода, доступ, билеты, безопасность и обратная дорога понятны."
              "uz": "Suv ombori manzaralari, kanat yo‘li hududi, qayiqlar, Suvtushar yoki yuqoriroq tog‘ chiqishlari ob-havo, kirish, chipta, xavfsizlik va qaytish yo‘li aniq bo‘lganda yo‘lni boyitadi."
          - "type": "alert"
            "title":
              "en": "For travelers"
              "ru": "Для путешественников"
              "uz": "Sayohatchilar uchun"
