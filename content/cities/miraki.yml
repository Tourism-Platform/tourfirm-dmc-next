          "ru": "Тюльпаны, ирисы, пшеничные поля и предгорный воздух дают Мираки сезонный облик без превращения пейзажа в твёрдое обещание."
          "uz": "Lola, iris, bug‘doy dalalari va tog‘oldi havosi Miroqiga mavsumiy qiyofa beradi, lekin manzarani qatʼiy vaʼdaga aylantirmaydi."
