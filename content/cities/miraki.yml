              "ru": "Выбирайте Мираки, когда Шахрисабз должен продолжиться в Гиссарские предгорья, а финальный визит пусть следует сезону, дороге и сельскому ритму места."
              "uz": "Shahrisabz Hisor tog‘oldilariga davom etishi kerak bo‘lsa, Miroqini tanlang; yakuniy tashrif mavsum, yo‘l va mehmon kutishga tayyor odamlar ritmiga ergashsin."
