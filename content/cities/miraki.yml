              "ru": "Сначала дорога и река"
              "uz": "Avval yo‘l va daryo"
            "description":
              "en": "The road from Shahrisabz and the Aksu line set the pace. When the river path is comfortable, Miraki becomes a calm short walk; when it is not, keep the stop close to the mahalla and the nearest viewpoints."
              "ru": "Дорога от Шахрисабза и линия Аксу задают темп. Когда речная тропа удобна, Мираки раскрывается как спокойная короткая прогулка; когда нет, лучше держать остановку ближе к махалле и ближайшим видам."
              "uz": "Shahrisabzdan yo‘l va Oqsuv chizig‘i surʼatni belgilaydi. Daryo so‘qmog‘i qulay bo‘lsa, Miroqi sokin qisqa sayrga aylanadi; bo‘lmasa, bekatni mahalla va eng yaqin manzaralar atrofida tutgan maʼqul."
          - "type": "quote"
            "quote":
              "en": "Let Miraki stay gentle: river first, mahalla next, and the higher road only when it keeps the route calm."
              "ru": "Пусть Мираки остаётся мягким: сначала река, затем махалля, а верхняя дорога — только когда она не ломает спокойный темп."
              "uz": "Miroqi yumshoq qolsin: avval daryo, keyin mahalla, yuqoriroq yo‘l esa safar sanasidagi kirish aniq bo‘lgandagina."
          - "type": "dashTitle"
            "title":
