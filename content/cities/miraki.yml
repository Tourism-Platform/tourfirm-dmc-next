"seo":
  "metaTitle":
    "en": "Miraki | TourLink"
    "ru": "Мираки | TourLink"
    "uz": "Miroqi | TourLink"
  "metaDescription":
    "en": "Miraki sits in the Gissar foothills about 30 kilometres from Shahrisabz. The Aksu River, orchards, guesthouse lanes, and the road toward Hisorak Reservoir move Kashkadarya from Timurid brick and blue domes into cooler mountain air. Keep the stop small and current: river paths, family tables, rooms, and recreation feel strongest when arrival time, meals, stays, and activity details are set before the route begins."
    "ru": "Мираки находится в Гиссарских предгорьях примерно в 30 километрах от Шахрисабза. Река Аксу, сады, улицы с гостевыми домами и дорога к Гиссаракскому водохранилищу переводят Кашкадарью от тимуридского кирпича и синих куполов к более прохладному горному воздуху. Пусть остановка остаётся небольшой и живой: речные тропы, семейный стол, комнаты и отдых раскрываются сильнее, когда время приезда, питание, ночёвка и активности понятны до выезда."
    "uz": "Miroqi Shahrisabzdan taxminan 30 kilometr narida, Hisor tog‘oldilarida joylashgan. Oqsuv daryosi, bog‘lar, mehmon uylari ko‘chalari va Hisorak suv omboriga boradigan yo‘l Qashqadaryoni temuriylar g‘ishti va ko‘k gumbazlardan salqinroq tog‘ havosiga olib chiqadi. To‘xtam kichik va hozirgi holatga mos qolsin: daryo yo‘llari, oilaviy dasturxon, xonalar va dam olish joylari kelish vaqti, ovqat, tunash va faoliyatlar safardan oldin aniqlanganda kuchliroq seziladi."
