                  "ru": "Гиссарские предгорья примерно в 30 километрах от Шахрисабза, рядом с рекой Аксу и Гиссаракским водохранилищем."
                  "uz": "Shahrisabzdan taxminan 30 kilometr naridagi Hisor tog‘oldilari, yaqinida Oqsuv daryosi va Hisorak suv ombori."
