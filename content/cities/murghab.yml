  "metaDescription":
    "en": "Murghab brings the Pamir Highway back to the body: thin air, wind, wide streets, and a horizon that makes distance visible. It is a practical high-town stop where you slow down, hear the latest road advice, and decide which plateau road should come next."
    "ru": "В Мургабе Памирский тракт снова ощущается телом: тонкий воздух, ветер, широкие улицы и горизонт, на котором сразу видны расстояния. Это практичная высокогорная остановка, где вы замедляетесь, узнаёте свежие дорожные новости и решаете, какая дорога плато должна быть следующей."
    "uz": "Murgʻobda Pomir trakti tanada seziladi: yupqa havo, shamol, keng ko‘chalar va masofani darhol ko‘rsatadigan ufq. Bu amaliy baland togʻ shaharchasi; bu yerda sayohatchi sekinlaydi, eng yangi yoʻl xabarini eshitadi va plato tomondagi qaysi yoʻl keyingi bo‘lishini tanlaydi."
