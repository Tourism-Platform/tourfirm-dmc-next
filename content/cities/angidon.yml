"excerpt":
  "en": "Angidon sits among the mountains of Khatirchi District, about 100 km from Navoi and 45 km from the district center. For a Nurata-Aydarkul journey, it gives the road a cooler village stop: slopes around the lanes, food prepared at home, local craft, folklore, and, when it fits, a short ride or fishing stop. The public marker orients the village; exact walks, meals, overnights, and outdoor details are arranged around the travel dates."
  "ru": "Ангидон лежит среди гор Хатырчинского района, примерно в 100 км от Навои и в 45 км от районного центра. В маршруте Нурата-Айдаркуль это более прохладная сельская остановка: склоны рядом с улицами, домашняя еда, местное ремесло, фольклор и, если уместно, короткая верховая прогулка или рыбалка. Публичный маркер помогает сориентироваться; точные прогулки, еда, ночёвка и отдых на воздухе подбираются под даты поездки."
  "uz": "Angidon Xatirchi tumanidagi tog‘lar orasida, Navoiydan taxminan 100 km, tuman markazidan 45 km narida joylashgan. Nurota-Aydarko‘l yo‘lida bu salqinroq qishloq bekati: ko‘chalar yonidagi yonbag‘irlar, xonadon taomi, mahalliy hunar, folklor va mos kelsa qisqa ot minish yoki baliq ovi. Ommaviy marker qishloqni topishga yordam beradi; aniq sayr, taom, tunash va ochiq havo tafsilotlari safar sanasiga qarab tuziladi."
