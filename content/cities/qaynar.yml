          "ru": "Простая остановка на природе уместна только тогда, когда вода, тень, погода и местная ориентация делают её комфортной."
          "uz": "Oddiy ochiq havo bekati suv, soya, ob-havo va mahalliy yo‘l-yo‘riq uni qulay qilganda mos keladi."
