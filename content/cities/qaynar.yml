  "metaDescription":
    "en": "Below Taxtiqoracha Pass, Qaynar slows the Kitob foothill road after Shakhrisabz. Spring water, open fields, mountain air, short walks, and a village table shift the journey from Timurid monuments to rural Kashkadarya life. The best visit stays simple: water, foothills, and village welcome rather than a resort promise."
    "ru": "Под перевалом Тахтакарача Кайнар замедляет дорогу через Китабские предгорья после Шахрисабза. Родниковая вода, открытые поля, горный воздух, короткие прогулки и сельский стол переводят маршрут от тимуридских памятников к сельской Кашкадарье. Лучший визит остаётся простым: вода, предгорья и сельская встреча вместо обещания курорта."
    "uz": "Taxtiqoracha dovoni ostida Qaynar Shahrisabzdan keyingi Kitob tog‘oldi yo‘lini sekinlashtiradi. Buloq suvi, ochiq dalalar, tog‘ havosi, qisqa yurishlar va qishloq dasturxoni yo‘lni temuriy yodgorliklardan qishloq Qashqadaryosi hayotiga olib o‘tadi. Eng yaxshi tashrif oddiy qoladi: kurort vaʼdasi emas, suv, tog‘oldi va qishloq kutib olishi."
