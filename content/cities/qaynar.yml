      "ru": "Кайнар лучше всего держится на роднике, открытых полях, горном воздухе, сельском столе и короткой прогулке. Ему не нужны лечебные обещания, тяжёлая развлекательная программа или курортный язык."
      "uz": "Qaynar buloq suvi, ochiq dalalar, tog‘ havosi, qishloq dasturxoni va qisqa yurishga tayanganda yaxshiroq ochiladi. Unga shifo vaʼdalari, og‘ir ko‘ngilochar dastur yoki kurort tili kerak emas."
