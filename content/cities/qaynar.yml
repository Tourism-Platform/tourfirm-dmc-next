              "ru": "Короткая прогулка или остановка на природе зависят от сезона, тени, покрытия дороги, воды и обратного пути. Когда условия не подходят, Кайнар может остаться короткой родниковой остановкой."
              "uz": "Qisqa yurish yoki ochiq havo bekati mavsum, soya, yo‘l yuzasi, suv va qaytish yo‘liga bog‘liq. Sharoit mos bo‘lmasa, Qaynar qisqa buloq bekati bo‘lib qolishi mumkin."
          - "type": "alert"
