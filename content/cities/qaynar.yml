              "uz": "Buloq, dalalar va past yonbag‘irlar kelish sababidir. Shahrisabzdan keyin Qaynar saroy devorlari va hovlilardan suv, ekinlar va dovon tomondagi manzaraga o‘tadi."
          - "type": "quote"
            "quote":
              "en": "Come for the spring first. Add food, craft, music, or an outdoor stop only when the village and the road can keep the visit calm."
              "ru": "Сначала приезжайте к роднику. Еду, ремесло, музыку или паузу на природе добавляйте только тогда, когда село и дорога позволяют сохранить спокойный темп."
              "uz": "Avval buloq uchun keling. Taom, hunar, musiqa yoki ochiq havo bekatini qishloq va yo‘l sokin saqlay olganda qo‘shing."
