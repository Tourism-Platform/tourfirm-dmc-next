  "en": "Sayram is close to Shymkent on the map, yet it changes the southern route's mood. Residential lanes, shrine courtyards, the Sairam Museum, and the memory of old Ispijab make the visit feel quieter than the city road that brings you here. Come with a guide who can keep the place respectful: which gates are open, how to dress and speak around shrines, when the museum helps, and when the walk should simply stay unhurried."
  "ru": "Сайрам совсем близок к Шымкенту на карте, но меняет настроение южного маршрута. Жилые переулки, дворы святынь, Сайрамский музей и память старого Испиджаба делают визит тише, чем городская дорога, которая сюда приводит. Ехать сюда лучше с гидом, который поможет сохранить уважительный ритм: какие ворота открыты, как одеться и говорить у святынь, когда музей помогает понять место и когда прогулку стоит оставить неспешной."
  "uz": "Sayram xaritada Chimkentga juda yaqin, lekin janubiy yoʻnalishning kayfiyatini oʻzgartiradi. Turar joy koʻchalari, ziyorat hovlilari, Sayram muzeyi va eski Isfijob xotirasi bu tashrifni bu yerga olib keladigan shahar yoʻlidan sokinroq qiladi. Bu yerga hurmatli ritmni saqlay oladigan gid bilan kelgan maʼqul: qaysi darvozalar ochiq, ziyorat joylarida qanday kiyinish va gapirish kerak, muzey qachon joyni tushunishga yordam beradi va qachon sayrni shoshirmaslik yaxshiroq."
