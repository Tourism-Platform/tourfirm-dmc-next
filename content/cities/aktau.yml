  "metaDescription":
    "en": "Aktau feels spare at first: pale blocks, sea wind, long horizons, and a city grid that quickly gives way to western Kazakhstan's harder landscapes. Start at the Caspian, let the first evening stay simple, and let the city show how far the road beyond it really is."
    "ru": "Сначала Актау кажется сдержанным: светлые кварталы, ветер с моря, длинные горизонты и городская сетка, которая быстро переходит в более суровые ландшафты западного Казахстана. Начните у Каспия, оставьте первый вечер простым и дайте городу показать, насколько длинной будет дорога за его пределами."
    "uz": "Aqtau avvaliga vazmin tuyuladi: och rangli kvartallar, dengiz shamoli, uzun ufqlar va tez orada gʻarbiy Qozogʻistonning qattiqroq manzaralariga ulanadigan shahar tuzilishi. Kaspiydan boshlang, birinchi kechani sodda qoldiring va shahar uning ortidagi yo'l qanchalik uzunligini ko'rsatsin."
