              "uz": "Beket-Ata odob va joriy mahalliy maslahat talab qiladi. Torysh, Sherqala, Airakty va Bozzhyra yo'l vaqti, kunduzgi yorugʻlik va mos avtomobil talab qiladi."
          - "type": "alert"
            "title":
              "en": "Traveler takeaway"
              "ru": "Что запомнить"
              "uz": "Sayohatchi uchun xulosa"
            "description":
              "en": "Start at the Caspian, let the city steady the route, and treat each remote Mangystau stop as its own decision."
              "ru": "Начните у Каспия, дайте городу выровнять маршрут и относитесь к каждой удалённой остановке Мангистау как к отдельному решению."
              "uz": "Kaspiydan boshlang, shahar yo'nalishni tinchlantirsin va Mangʻistovdagi har bir uzoq to'xtovni alohida qaror sifatida ko'ring."
        "right":
          - "type": "miniTable"
            "title":
              "en": "Before you go"
              "ru": "Перед поездкой"
              "uz": "Yo'lga chiqishdan oldin"
            "icon": "Circle"
            "rows":
              - "icon": "MapPin"
                "title":
                  "en": "At a glance Place"
                  "ru": "Коротко Место"
                  "uz": "Qisqacha Joy"
                "description":
                  "en": "Caspian city in Mangystau Region, useful for arrivals, overnights, shoreline time, and western Kazakhstan route planning."
                  "ru": "Каспийский город в Мангистауской области, удобный для прилёта, ночёвки, прогулки у моря и планирования маршрута по западному Казахстану."
                  "uz": "Mangʻistov regionidagi Kaspiy shahri; kelish, tunash, qirgʻoq vaqti va gʻarbiy Qozogʻiston yoʻnalishini rejalash uchun qulay."
              - "icon": "Landmark"
                "title":
                  "en": "Main city stop"
                  "ru": "Главная городская остановка"
                  "uz": "Asosiy shahar to'xtovi"
                "description":
                  "en": "Other Aktau and Mangystau places need their own verified timing and access."
                  "ru": "Другим местам Актау и Мангистау нужны собственные проверки времени и доступа."
                  "uz": "Aqtau va Mangʻistovdagi boshqa joylar uchun vaqt va kirish alohida tasdiqlanishi kerak."
              - "icon": "Sun"
                "title":
                  "en": "Time"
                  "ru": "Время"
                  "uz": "Vaqt"
                "description":
                  "en": "Often one night before or after a Mangystau route, with extra time when flights, museum plans, or recovery after the road make it worthwhile."
                  "ru": "Часто достаточно одной ночи до или после маршрута по Мангистау; больше времени нужно, если этого требуют рейсы, музей или восстановление после дороги."
                  "uz": "Ko'pincha Mangʻistov yoʻnalishidan oldin yoki keyin bir tun yetarli; parvoz, muzey rejasi yoki yo'ldan keyingi tiklanish talab qilsa, ko'proq vaqt kerak bo'ladi."
              - "icon": "Route"
                "title":
                  "en": "Season and comfort"
                  "ru": "Сезон и комфорт"
                  "uz": "Mavsum va qulaylik"
                "description":
                  "en": "Spring and autumn are easier for remote roads; summer heat and winter wind can reshape the route."
                  "ru": "Весна и осень легче для удалённых дорог; летняя жара и зимний ветер могут изменить форму маршрута."
                  "uz": "Bahor va kuz uzoq yoʻllar uchun osonroq; yozgi issiq va qishki shamol yo'nalish shaklini o'zgartirishi mumkin."
              - "icon": "MapPin"
                "title":
                  "en": "Before travel"
                  "ru": "Перед поездкой"
                  "uz": "Safardan oldin"
                "description":
                  "en": "Confirm flight timing, hotel logistics, vehicle, driver, road condition, daylight, weather, access, museum timing, shrine etiquette, and traveler readiness close to the date."
                  "ru": "Ближе к дате проверьте время рейсов, отельную логистику, машину, водителя, состояние дорог, световой день, погоду, доступ, время музея, этикет у святынь и готовность путешественников."
                  "uz": "Sanaga yaqin parvoz vaqti, mehmonxona logistikasi, avtomobil, haydovchi, yo'l holati, kunduzgi vaqt, ob-havo, kirish, muzey vaqti, ziyorat odobi va sayohatchilar tayyorgarligini tasdiqlang."


