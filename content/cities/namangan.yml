      "ru": "Самая естественная пара для Намангана — Чуст. Андижан, Фергана и Коканд помогают решить, пойдёт ли маршрут на восток, вернётся ли через центр долины или пересечёт главные ремесленные и дворцовые города."
      "uz": "Namangan uchun eng tabiiy juftlik Chustdir. Andijon, Fargʻona va Qoʻqon esa yoʻl sharqqa buriladimi, vodiyning markazidan qaytadimi yoki asosiy hunarmandchilik va saroy shaharlari orqali o‘tadimi, buni aniqlashga yordam beradi."
