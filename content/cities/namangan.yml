          "en": "2–3 nights is usually enough when the old core or main anchors get a full walking window. City tone: “Flowers, park life, and northern Valley roads”."
          "ru": "Обычно хватает 2–3 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Цветы, городской парк и северные дороги долины»."
          "uz": "Odatda 2–3 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Gullar, bogʻ hayoti va vodiyning shimoliy yoʻllari»."
