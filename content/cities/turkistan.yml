    "en": "Turkistan slows the southern route around the blue dome of Khoja Ahmed Yasawi. In the square and the Azret Sultan reserve, brick, blue tile, pilgrim movement, and desert-edge light make the city the quiet center before the road turns to Otrar, Sauran, Shymkent, or Sayram."
    "ru": "Туркестан замедляет южный маршрут вокруг голубого купола Ходжи Ахмеда Ясави. На площади и в заповеднике-музее «Азрет Султан» кирпич, синяя майолика, движение паломников и свет открытого юга делают город тихим центром перед дорогой к Отрару, Саурану, Шымкенту или Сайраму."
    "uz": "Turkiston janubiy yoʻlni Xoja Ahmad Yasaviy maqbarasining moviy gumbazi atrofida sekinlashtiradi. Maydon va Azret Sulton hududida gʻisht, moviy koshin, ziyoratchilar harakati va ochiq janub yorugʻligi shaharni Oʻtror, Sauran, Chimkent yoki Sayramdan oldingi sokin markazga aylantiradi."
