          "en": "The reserve-museum context keeps the mausoleum connected to courtyards, sacred space, and city memory instead of a single photo stop."
          "ru": "Контекст заповедника-музея удерживает мавзолей рядом с дворами, священным пространством и памятью города, а не превращает его в одну фотостановку."
          "uz": "Qoʻriqxona-muzey konteksti maqbarani bitta foto bekati emas, hovlilar, muqaddas makon va shahar xotirasi bilan bogʻlab turadi."
