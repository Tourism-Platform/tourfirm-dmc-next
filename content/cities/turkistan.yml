          "en": "one focused city day plus overnight is usually enough when the old core or main anchors get a full walking window. City tone: “Sacred city on Kazakhstan's southern Silk Road”."
          "ru": "Обычно хватает один насыщенный городской день плюс ночёвка, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Священный город на южном Шёлковом пути»."
          "uz": "Odatda bitta zich shahar kuni va tunash yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Janubiy Ipak yoʻlidagi muqaddas shahar»."
