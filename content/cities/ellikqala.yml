"seo":
  "metaTitle":
    "en": "Ellikqala | TourLink"
    "ru": "Элликкала | TourLink"
    "uz": "Ellikqal’a | TourLink"
  "metaDescription":
    "en": "Ellikqala is not a compact town stop. It is a fortress area where the route leaves Nukus, Moynaq, or Khiva for Toprak-Kala, Kyzyl-Kala, and Ayaz-Kala; mud-brick walls, exposed ground, road time, and archaeological context all belong to the same visit."
    "ru": "Элликкала — не компактная городская остановка. Это территория крепостей, куда маршрут выходит из Нукуса, Муйнака или Хивы ради Топрак-Калы, Кызыл-Калы и Аяз-Калы; глинобитные стены, открытая местность, дорожное время и археологический контекст здесь идут вместе."
    "uz": "Ellikqal’a ixcham shahar bekati emas. Bu Nukus, Mo‘ynoq yoki Xivadan Tuproq-qalʼa, Qizil-qalʼa va Ayoz-qalʼa tomonga chiqadigan qalʼalar hududi; paxsa devorlar, ochiq yer, yo‘l va arxeologik kontekst bu yerda birga seziladi."
