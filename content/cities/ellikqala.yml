          "ru": "После Топрак-Калы и Кызыл-Калы Аяз-Кала раскрывает Элликкалу шире: стены стоят над равниной, а комплекс из трёх городищ помогает увидеть древний Хорезм как пространство, а не только ряд руин."
          "uz": "Tuproq-qalʼa va Qizil-qalʼadan so‘ng Ayoz-qalʼa Ellikqal’a yo‘lini kengroq ochadi: devorlar tekislik ustida turadi, uch qismli majmua esa qadimgi Xorazmni faqat xarobalar qatori emas, keng makon sifatida ko‘rsatadi."
