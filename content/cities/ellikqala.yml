          "en": "Toprak-Kala is the stop where the Ellikqala fortress route becomes more than walls on the horizon. The raised palace area, room traces, defensive lines, sanctuaries, and excavated finds help the site read as a city where power, worship, work, and daily life once met."
          "ru": "Топрак-Кала — остановка, где маршрут крепостей Элликкалы становится больше, чем линией стен на горизонте. Дворцовая часть, следы помещений, оборонительные линии, святилища и находки помогают читать площадку как город, где рядом существовали власть, культ, работа и повседневная жи"
          "uz": "Tuproq-qalʼa Ellikqal’a qalʼalari yo‘lida ufqdagi devorlardan ko‘proq narsa ko‘rsatadigan bekatdir. Saroy qismi, xona izlari, mudofaa chiziqlari, ziyorat joylari va topilmalar bu maydonni hokimiyat, ibodat, mehnat va kundalik hayot uchrashgan shahar sifatida o‘qishga yordam berad"
