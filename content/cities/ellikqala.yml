        "description":
          "en": "In Buston, the Ellikqala Museum of Archaeology and History brings the fortress route indoors for a quieter reading. Archaeological finds, local history, ethnography, applied arts, and Sergei Pavlovich Tolstov's name help the open ruins outside feel part of a wider Ancient Khorezm"
          "ru": "В Бустоне музей археологии и истории Элликкалы переносит крепостной маршрут в помещение и задаёт ему более спокойное чтение. Археологические находки, местная история, этнография, прикладное искусство и имя Сергея Павловича Толстова помогают увидеть открытые руины как часть истори"
          "uz": "Bo‘stonda Ellikqal’a arxeologiya va tarix muzeyi qalʼalar yo‘lini xonalar ichiga olib kirib, unga sokinroq maʼno beradi. Arxeologik topilmalar, mahalliy tarix, etnografiya, amaliy sanʼat va Sergey Pavlovich Tolstov nomi tashqaridagi xarobalarni qadimgi Xorazm tarixining bir qismi"
