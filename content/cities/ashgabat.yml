    "en": "Ashgabat first shows Turkmenistan through formal scale, then brings it closer. White-marble avenues and ceremonial parks set the capital's public face; the State Museum, carpet galleries, and the road toward Nisa bring the visit back to objects, craft, and older history."
    "ru": "Ашхабад сначала показывает Туркменистан с официальной стороны, а потом становится ближе. Беломраморные проспекты и церемониальные парки задают образ столицы; Государственный музей, ковровые галереи и дорога к Нисе возвращают маршрут к предметам, ремеслу и более древней истории."
    "uz": "Ashgabat Turkmanistonni avval rasmiy ko‘rsatadi, keyin yaqinlashtiradi. Oq marmar xiyobonlar va marosim parklar poytaxt qiyofasini beradi; Davlat muzeyi, gilam galereyalari va Nisa yoʻli esa yoʻnalishni buyumlar, hunar va qadimiyroq tarixga qaytaradi."
