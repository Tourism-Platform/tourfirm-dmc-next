          "en": "one focused city day plus overnight is usually enough when the old core or main anchors get a full walking window. City tone: “Former port, ship graveyard, and the road from Nukus”."
          "ru": "Обычно хватает один насыщенный городской день плюс ночёвка, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Бывший порт, кладбище кораблей и дорога из Нукуса»."
          "uz": "Odatda bitta zich shahar kuni va tunash yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Sobiq port, kema qabristoni va Nukusdan yo‘l»."
