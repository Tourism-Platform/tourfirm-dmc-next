              "ru": "Корабли понятнее вместе с контекстом: жизнью бывшего порта, рыбацким трудом, изменившимся морем и музейной историей вокруг."
              "uz": "Kemalar sobiq port hayoti, baliqchilik mehnati, o‘zgargan dengiz va muzey hikoyasi bilan birga yaxshiroq tushuniladi."
          - "type": "dashTitle"
            "title":
