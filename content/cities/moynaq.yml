              "ru": "Музей и городской контекст связывают визит с людьми, работой и семейной жизнью до ухода моря."
              "uz": "Muzey va shahar konteksti tashrifni dengiz ketishidan oldingi odamlar, mehnat va oilaviy hayot bilan bog‘laydi."
