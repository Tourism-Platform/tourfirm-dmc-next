              "ru": "Планируйте Муйнак с запасом времени на дорогу, музей, кладбище кораблей, погоду и возвращение в Нукус. Более длинные маршруты к Аралу и Устюрту лучше отделять до проверки доступа и условий."
              "uz": "Mo‘ynoqni yo‘l, muzey, kema qabristoni, ob-havo va Nukusga qaytish uchun yetarli vaqt bilan rejalang. Uzunroq Orol va Ustyurt yo‘llarini kirish va sharoitlar tasdiqlanguncha alohida tuting."
