  "metaDescription":
    "en": "Shymkent shows the south through city life, not only monuments. Begin around the old-city and citadel area, follow the noise into Central and Upper Bazaar, then choose whether the road turns toward Turkistan, Otrar, Sayram, or the foothills."
    "ru": "Шымкент показывает юг не только через памятники, а через городскую жизнь. Сначала старый город и район цитадели, затем шум Центрального и Верхнего базара, а дальше выбор дороги: Туркестан, Отрар, Сайрам или предгорья."
    "uz": "Chimkent janubni faqat yodgorliklar orqali emas, shahar hayoti orqali ko‘rsatadi. Avval eski shahar va qalʼa hududi, keyin Markaziy va Yuqori bozor shovqini, soʻng yoʻl tanlovi: Turkiston, Oʻtror, Sayram yoki togʻoldi."
