          "uz": "Chimkentda guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "1–2 nights is usually enough when the old core or main anchors get a full walking window. City tone: “Old streets, bazaar noise, and roads across the south”."
          "ru": "Обычно хватает 1–2 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Старые улицы, шум базара и дороги юга»."
          "uz": "Odatda 1–2 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Eski ko‘chalar, bozor shovqini va janub yoʻllari»."
