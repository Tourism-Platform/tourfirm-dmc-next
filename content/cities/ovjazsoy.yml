  "uz": "Ovjazsoy Toshkent viloyatining Ohangaron tomonida, yo‘l shahar tekisligidan kichik qishloq hayotiga ko‘tarila boshlaydigan joyda turadi. Uning jozibasi kamtar va yaqin: bog‘ chetlari, xo‘jalik ritmi, safar sanasiga kelishilgan oilaviy qabul va qishloqning yuqori qismidagi salqinroq havo."
