  "en": "Ovjazsoy sits on the Ohangaron side of Tashkent Region, where the road leaves the city plain and starts to rise toward smaller village life. The draw is modest and close: orchard edges, farm routines, family welcome when it is arranged for the date, and cooler air from the upper part of the village."
