  "metaDescription":
    "en": "Ovjazsoy sits on the Ohangaron side of Tashkent Region, where the road leaves the city plain and starts to rise toward smaller village life. The draw is modest and close: orchard edges, farm routines, family welcome when it is arranged for the date, and cooler air from the upper part of the village."
    "ru": "Овжазсой стоит на ахангаранской стороне Ташкентской области, там, где дорога уходит с городской равнины к небольшим сёлам. Его интерес скромный и близкий: садовые края, хозяйственный ритм, семейный приём, если он согласован на дату, и воздух верхней части села."
    "uz": "Ovjazsoy Toshkent viloyatining Ohangaron tomonida, yo‘l shahar tekisligidan kichik qishloq hayotiga ko‘tarila boshlaydigan joyda turadi. Uning jozibasi kamtar va yaqin: bog‘ chetlari, xo‘jalik ritmi, safar sanasiga kelishilgan oilaviy qabul va qishloqning yuqori qismidagi salqinroq havo."
