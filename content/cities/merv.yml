          "ru": "Кыз-Кала — одно из мест, где древний Мерв становится видимым с первого взгляда. Большая и Малая Кыз-Кала стоят в открытом оазисе ребристыми глинобитными объёмами, и сначала вы замечаете тень, поверхность и масштаб, а уже потом переходите к истории места."
