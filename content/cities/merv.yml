              "ru": "Хороший гид превращает отдельные руины в маршрут: поселения оазиса, сельджукскую власть, движение караванов и глинобитные следы, которые ещё видны вокруг."
              "uz": "Yaxshi gid alohida xarobalarni yo‘lga aylantiradi: voha manzillari, saljuqiy qudrat, karvon harakati va atrofda hali ko‘rinib turgan xom g‘isht izlari bir-biriga ulanadi."
          - "type": "dashTitle"
