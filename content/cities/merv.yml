      "uz": "Birinchi yo‘nalishda UNESCO bog‘i, Sulton Sanjar va Qiz qal’aga eʼtibor bering. Erk qal’a, Govur qal’a va keyingi devorlar Marvning haqiqiy qismlari, lekin ular kirish, issiq va vaqt chuqurroq tashrifga imkon berganda qo‘shiladi."
