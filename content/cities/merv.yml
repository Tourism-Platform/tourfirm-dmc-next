          "uz": "Sulton Sanjar maqbarasi"
        "description":
          "en": "In the open ground of Ancient Merv, Sultan Sanjar Mausoleum gives the Seljuk city a visible centre. Its cube-like brick body, dome, decoration traces, and open approach turn a wide archaeological park into one place you can stand, look around, and understand the scale."
          "ru": "На открытой площадке Древнего Мерва мавзолей Султана Санджара собирает сельджукский город в один видимый центр. Кубический кирпичный объём, купол, следы декора и пространство вокруг помогают почувствовать масштаб Султан-Калы."
          "uz": "Qadimiy Marvning ochiq hududida Sulton Sanjar maqbarasi saljuqiy shaharni ko‘rinadigan markazga jamlaydi. G‘ishtli kubsimon hajm, gumbaz, bezak izlari va atrofdagi kenglik Sulton Qal’a miqyosini his qildiradi."
        "ctaHref": "/destinations/turkmenistan/mary-and-ancient-merv/merv/sultan-sanjar-mausoleum"
        "ctaLabel":
