        "description":
          "en": "Ancient Merv UNESCO Park is not a single monument. Walls, tells, Seljuk remains, and roads between ruins sit across a wide oasis landscape, so the visit feels like moving between cities that once shared the same desert edge."
          "ru": "Археологический парк Древний Мерв — не один памятник. Стены, археологические холмы, сельджукские остатки и дороги между руинами лежат в широком оазисном ландшафте, поэтому визит ощущается как движение между городами, которые когда-то стояли на одном краю пустыни."
          "uz": "Qadimiy Marv UNESCO arxeologik parki bitta yodgorlik emas. Devorlar, arxeologik tepaliklar, saljuqiy qoldiqlar va xarobalar orasidagi yo‘llar keng voha manzarasiga yoyilgan; shuning uchun tashrif bir vaqtlar shu cho‘l chekkasida yashagan shaharlar orasida yurishdek seziladi."
        "ctaHref": "/destinations/turkmenistan/mary-and-ancient-merv/merv/ancient-merv-unesco-park"
