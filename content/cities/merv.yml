            "title":
              "en": "A city understood through movement"
              "ru": "Город, который понимаешь в движении"
              "uz": "Harakat orqali tushuniladigan shahar"
            "description":
              "en": "Ancient Merv makes sense as you move between its parts. The space between walls, domes, and earthworks helps the old oasis city feel real."
              "ru": "Древний Мерв складывается, когда вы движетесь между его частями. Пространство между стенами, куполами и валами помогает почувствовать старый оазисный город."
              "uz": "Qadimiy Marv qismlari orasida yurganingizda maʼno kasb etadi. Devorlar, gumbazlar va tuproq izlari orasidagi kenglik eski voha shahrini his qilishga yordam beradi."
          - "type": "quote"
