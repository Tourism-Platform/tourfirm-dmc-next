              "ru": "Эрк-Кала, Гяур-Кала, поздние стены и более ранняя археология важны, но требуют проверки доступа и времени. Они не должны перегружать первое посещение Мерва."
              "uz": "Erk qal’a, Govur qal’a, keyingi devorlar va qadimiyroq arxeologiya muhim, lekin ular kirish tekshiruvi va vaqt talab qiladi. Ular birinchi Marv tashrifini og‘irlashtirmasligi kerak."
          - "type": "alert"
            "title":
              "en": "Traveler takeaway"
              "ru": "Что важно запомнить"
              "uz": "Sayohatchi uchun xulosa"
            "description":
