              "ru": "Начните из Мары, держите фокус на самых сильных точках и планируйте время с учётом жары, чтобы Мерв воспринимался как оазисный город, а не как набор разрозненных руин."
              "uz": "Maridan boshlang, eng kuchli nuqtalarda qoling va vaqtni issiqni hisobga olib rejalang, shunda Marv tarqoq xarobalar emas, voha shahri sifatida ochiladi."
