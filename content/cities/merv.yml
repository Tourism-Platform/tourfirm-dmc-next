          "uz": "Gid devorlar, tepaliklar, saljuqiy g‘isht va Qiz qal’ani ko‘rsatganda, ular orasidagi masofa ham hikoyaning bir qismiga aylanadi."
      - "type": "experience"
        "image": "assets/images/destinations/turkmenistan.jpg"
        "badge":
          "en": "Culture"
          "ru": "Культура"
          "uz": "Madaniyat"
        "title":
          "en": "Kyz Kala walls in dry light"
          "ru": "Стены Кыз-Калы в сухом свете"
          "uz": "Qiz qal’a devorlari quruq nurda"
        "description":
          "en": "Corrugated mudbrick walls catch the sun and make Kyz Kala feel tactile, fragile, and exposed."
          "ru": "Рифлёная глинобитная кладка ловит солнце, и Кыз-Кала ощущается хрупкой, осязаемой и открытой."
          "uz": "Qovurg‘ali xom g‘isht devorlar quyoshda yaqqol ko‘rinadi; Qiz qal’a nozik, qo‘lga yaqin va ochiq tuyuladi."
      - "type": "experience"
        "image": "assets/images/destinations/turkmenistan.jpg"
        "badge":
          "en": "Culture"
          "ru": "Культура"
          "uz": "Madaniyat"
        "title":
          "en": "Sultan Sanjar standing apart"
          "ru": "Султан Санджар отдельно в оазисе"
          "uz": "Voha ichida alohida turgan Sulton Sanjar"
        "description":
          "en": "The brick dome rises away from the other stops, giving the visit one clear Seljuk landmark before the route widens again."
          "ru": "Кирпичный купол стоит в стороне от других точек и даёт маршруту ясный сельджукский ориентир перед тем, как пространство снова расширяется."
          "uz": "G‘isht gumbaz boshqa nuqtalardan chetroqda ko‘rinadi va yo‘l yana kengayishidan oldin aniq saljuqiy mo‘ljal beradi."
  - "blockType": "regular"
