      "ru": "Мерв сильнее всего раскрывается в выборочном посещении. Цель не в том, чтобы гнаться за каждой руиной, а в том, чтобы через несколько точек почувствовать оазисный город."
      "uz": "Marv tanlab ko‘rilganda kuchliroq ochiladi. Maqsad har bir xarobani quvish emas, bir necha yaxshi tanlangan nuqta orqali voha shahrini tushunishdir."
    "rows":
