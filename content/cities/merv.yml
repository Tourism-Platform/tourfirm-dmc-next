              "en": "Merv becomes clear when the space between ruins starts to tell the story: walls, domes, heat, and a guide's explanation all matter."
              "ru": "Мерв становится понятным, когда расстояние между руинами начинает рассказывать: стены, купола, жара и объяснение гида здесь одинаково важны."
              "uz": "Marv xarobalar orasidagi masofa hikoya qila boshlaganda tushunarli bo‘ladi: devorlar, gumbazlar, issiq va gid izohi bu yerda birdek muhim."
          - "type": "dashTitle"
