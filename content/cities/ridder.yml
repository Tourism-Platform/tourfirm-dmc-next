"excerpt":
  "en": "Ridder is not a polished resort stop. It is a working mountain town with mining memory, forest air, and roads that can change quickly with snow, weather, and local access rules.


    Ridder fits after Oskemen when the trip is built for mountain time: a museum or town walk, a careful look toward West Altai, and no promise of trails or reserve visits until current conditions are clear."
  "ru": "Риддер — не отполированная курортная остановка. Это рабочий горный город с памятью о рудниках, лесным воздухом и дорогами, которые быстро меняются из-за снега, погоды и местных правил доступа.


    Риддер хорошо встаёт после Усть-Каменогорска, когда поездка рассчитана на горное время: музей или прогулка по городу, внимательный взгляд в сторону Западного Алтая и никаких обещаний по тропам или заповеднику, пока условия не подтверждены."
  "uz": "Ridder silliq kurort to‘xtashi emas. Bu konlar xotirasi, oʻrmon havosi va qor, ob-havo hamda mahalliy kirish qoidalari bilan tez o‘zgaradigan yoʻllari bor ishchi togʻ shahri.


    Ridder safar togʻ vaqtiga qurilganda Oʻskemendan keyin mos tushadi: muzey yoki shahar sayri, Gʻarbiy Oltay tomonga ehtiyotkor qarash va sharoit aniq bo‘lmaguncha soʻqmoq yoki qoʻriqxona bo‘yicha vaʼda bermaslik."
