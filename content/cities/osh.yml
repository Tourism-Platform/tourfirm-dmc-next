      "uz": "Oʻzgan, Oloy yoki shimolga yoʻl"
    "description":
      "en": "Uzgen keeps the heritage route close. Sary-Mogul and the Alay side pull the journey higher. Bishkek brings the wider Kyrgyzstan route back to its northern rhythm."
      "ru": "Узген держит рядом южное наследие. Сары-Могол и Алай ведут выше в горы. Бишкек возвращает маршрут к северному ритму Кыргызстана."
      "uz": "Oʻzgan janubiy meros yoʻlini yaqin tutadi. Sari-Mogʻol va Oloy yoʻnalishni balandroq togʻlarga olib chiqadi. Bishkek esa Qirgʻiziston safarini shimoliy ritmga qaytaradi."
