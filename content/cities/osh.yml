                  "ru": "Международный аэропорт Ош и дороги к Узгену, Алаю, Сары-Моголу и Бишкеку."
                  "uz": "Oʻsh xalqaro aeroporti va Oʻzgan, Oloy, Sari-Mogʻol hamda Bishkek tomonga yoʻllar."
