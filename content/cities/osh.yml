              "en": "The mountain is not only a view over the city. It brings pilgrimage memory, history, and everyday Osh into the same skyline."
              "ru": "Гора — не только вид на город. Она собирает паломническую память, историю и повседневный Ош в одном силуэте."
              "uz": "Togʻ faqat shahar manzarasi emas. U ziyorat xotirasi, tarix va kundalik Oʻshni bitta ufqqa yigʻadi."
          - "type": "quote"
            "quote":
              "en": "Osh is clearest when the sacred mountain, the bazaar, and the road out each have their own weight."
              "ru": "Ош понятнее всего, когда священная гора, базар и дорога дальше имеют собственный вес."
              "uz": "Oʻsh muqaddas togʻ, bozor va keyingi yoʻlning har biri oʻz vazniga ega boʻlganda eng aniq koʻrinadi."
          - "type": "dashTitle"
            "title":
              "en": "Keep the bazaar close to real life"
              "ru": "Держите базар близко к жизни"
              "uz": "Bozor hayotga yaqin qolsin"
            "description":
              "en": "The market is strongest when you move through bread, spices, tea, cloth, and household goods with a clear path, not a forced wander through crowds."
              "ru": "Базар сильнее, когда вы идёте через хлеб, специи, чай, ткани и хозяйственные ряды по понятному пути, а не блуждаете в толпе."
              "uz": "Bozor non, ziravor, choy, mato va kundalik buyumlar orasidan aniq yoʻl bilan oʻtilganda kuchliroq; maqsadsiz gavjumlik uning maʼnosini susaytiradi."
          - "type": "dashTitle"
            "title":
              "en": "Decide the road before the plan blurs"
              "ru": "Решите дорогу до перегруза маршрута"
              "uz": "Yoʻlni reja ogʻirlashmasidan tanlang"
            "description":
              "en": "Southern Kyrgyzstan can turn toward heritage towns, high valleys, flights, or the long road north. Osh feels clearer when that choice is made before the plan is overloaded."
              "ru": "Южный Кыргызстан может повернуть к городам наследия, высоким долинам, перелёту или длинной дороге на север. Ош понятнее, когда этот выбор сделан заранее."
              "uz": "Janubiy Qirgʻiziston meros shaharlari, baland vodiylar, parvoz yoki shimolga uzun yoʻl tomon burilishi mumkin. Tanlov oldindan aniq boʻlsa, Oʻsh tushunarliroq qoladi."
          - "type": "alert"
            "title":
              "en": "For the traveler"
              "ru": "Для путешественника"
              "uz": "Sayohatchi uchun"
            "description":
              "en": "Treat Osh as a southern city first: mountain air, bazaar movement, and one clear onward choice."
              "ru": "Сначала воспринимайте Ош как южный город: горный воздух, движение рынка и один ясный выбор дальше."
              "uz": "Oʻshni avval janubiy shahar sifatida qabul qiling: togʻ havosi, bozor harakati va keyingi yoʻl boʻyicha bitta aniq tanlov."
        "right":
