          "ru": "Сары-Могол поворачивает юг Кыргызстана к Алаю: высокий кишлак под Заалайским хребтом, где Тулпар-Кёль, перевалы, разрешения и погода требуют отдельного плана."
          "uz": "Sary-Mogʻul Qirgʻiziston janubini Olay tomonga buradi: Zaalay tizmasi ostidagi baland qishloq, Tulpar-Koʻl, dovonlar, ruxsatlar va ob-havo alohida reja soʻraydigan joy."
