  "metaDescription":
    "en": "Osh is where Kyrgyzstan turns south. Sulaiman-Too holds the skyline, the bazaar keeps the streets moving, and the onward road asks for a clear choice: Uzgen, Alay, Sary-Mogul, the airport, or the long return north."
    "ru": "В Оше Кыргызстан поворачивает на юг. Сулайман-Тоо держит городской силуэт, базар движет улицы, а дальнейшая дорога требует ясного выбора: Узген, Алай, Сары-Могол, аэропорт или длинный путь на север."
    "uz": "Oʻshda Qirgʻiziston janubga buriladi. Sulaymon-Too shahar ufqini ushlab turadi, bozor koʻchalarga harakat beradi, keyingi yoʻl esa aniq tanlov soʻraydi: Oʻzgan, Oloy, Sari-Mogʻol, aeroport yoki shimolga uzun qaytish."
