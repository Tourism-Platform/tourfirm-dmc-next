                  "ru": "В тёплые месяцы гору лучше ставить раньше, а базар проходить без спешки."
                  "uz": "Iliq oylarda togʻga ertaroq chiqish, bozorni esa shoshilmasdan yurish qulayroq."
  - "blockType": "regular"
