          "ru": "Сколько времени группам стоит проводить в Ош?"
          "uz": "Oʻshda guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "2–3 nights is usually enough when the old core or main anchors get a full walking window. City tone: “A southern Silk Road city under Sulaiman-Too”."
          "ru": "Обычно хватает 2–3 ночи, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Южный город Шёлкового пути под Сулайман-Тоо»."
          "uz": "Odatda 2–3 tun yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Sulaymon-Too ostidagi janubiy Ipak yoʻli shahri»."
      - "type": "destinationInsight"
        "icon": "Landmark"
        "title":
