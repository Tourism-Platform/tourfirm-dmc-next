          "ru": "Узген — городок Шёлкового пути рядом с Ошем: караханидская кладка, компактная городская среда и дорога обратно превращают одну остановку наследия в спокойный выбор по южному маршруту."
          "uz": "Oʻzgan Osh yaqinidagi Buyuk Ipak yoʻli shaharchasi: Qoraxoniylar gʻishti, ixcham shahar muhiti va qaytish yoʻli bitta meros bekatini sokinroq janubiy yoʻnalishga aylantiradi."
