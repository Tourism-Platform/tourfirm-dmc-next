        "description":
          "en": "Shah-i-Zinda brings Samarkand close: a narrow ascent of mausoleums, blue mosaic almost within reach, and a sacred center tied to Qusam ibn Abbas. The place is understood step by step, not through one facade."
          "ru": "Шахи-Зинда приближает Самарканд: узкий подъём мавзолеев, синяя мозаика почти рядом с рукой и сакральный центр, связанный с Кусамом ибн Аббасом. Место понимается шаг за шагом, а не через один фасад."
          "uz": "Shohi Zinda Samarqandni yaqinlashtiradi: tor maqbaralar ko‘tarilishi, qo‘l yetgudek ko‘k koshin va Qusam ibn Abbos bilan bog‘liq muqaddas markaz. Bu joy bitta fasad orqali emas, qadam-baqadam tushuniladi."
