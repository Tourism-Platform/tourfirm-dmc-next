          "uz": "Kontekstdagi meʼmorchilik"
        "description":
          "en": "Registan, Shah-i-Zinda, and Bibi-Khanym are not separate postcard stops. Together they show how Samarkand moves from open square to close mosaic, mosque wall, bazaar sound, and old-city life."
          "ru": "Регистан, Шахи-Зинда и Биби-Ханым — не отдельные открытки. Вместе они показывают, как Самарканд переходит от открытой площади к близкой мозаике, стенам мечети, звуку базара и жизни старого города."
          "uz": "Registon, Shohi Zinda va Bibi Xonim alohida otkritka bekatlari emas. Birga ular Samarqand ochiq maydondan yaqin mozaika, masjid devori, bozor tovushi va eski shahar hayotiga qanday o‘tishini ko‘rsatadi."
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan/character/samarkand/samarkand-character-4.webp"
        "badge":
          "en": "Culture"
          "ru": "Культура"
          "uz": "Madaniyat"
        "title":
          "en": "Evening after Registan"
          "ru": "Вечер после Регистана"
          "uz": "Registondan keyingi oqshom"
        "description":
          "en": "After the square, Samarkand needs a slower return: quieter streets, the last color on tile, and enough space to let Shah-i-Zinda or the bazaar remain separate in memory, not folded into one list."
          "ru": "После площади Самарканду нужен более медленный возврат: тихие улицы, последний цвет на керамике и достаточно места, чтобы Шахи-Зинда или базар остались отдельной памятью, а не частью одного списка."
          "uz": "Maydondan keyin Samarqandga sekinroq qaytish kerak: sokin ko‘chalar, koshindagi oxirgi rang va Shohi Zinda yoki bozor bitta ro‘yxatga qo‘shilib ketmay, alohida xotira bo‘lib qolishi uchun yetarli joy."
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan/character/samarkand/samarkand-character-5.webp"
        "badge":
          "en": "Special interest"
          "ru": "Специнтерес"
          "uz": "Maxsus qiziqish"
        "title":
          "en": "Afrasiab and the observatory"
          "ru": "Афрасиаб и обсерватория"
          "uz": "Afrosiyob va rasadxona"
        "description":
          "en": "Afrasiab and Ulugh Beg's observatory move the city beyond the postcard view. The route turns toward ancient ground, maps, fragments, and a scientific memory that changes how you read the domes."
          "ru": "Афрасиаб и обсерватория Улугбека выводят город за пределы открыточного вида. Маршрут поворачивает к древней земле, картам, фрагментам и научной памяти, после которой купола воспринимаются иначе."
          "uz": "Afrosiyob va Ulug‘bek rasadxonasi shaharni otkritka manzarasidan kengroq qiladi. Yo‘l qadimiy zamin, xaritalar, parcha topilmalar va gumbazlarni boshqacha o‘qishga yordam beradigan ilmiy xotiraga buriladi."
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan.jpg"
        "badge":
          "en": "Craft"
          "ru": "Ремёсла"
          "uz": "Hunarmandchilik"
        "title":
          "en": "Konigil paper and hands"
          "ru": "Конигил: бумага и руки"
          "uz": "Konigil: qog‘oz va qo‘llar"
        "description":
          "en": "Outside the monumental core, Konigil slows the day to water channels, paper fibre, bread, and hands at work. You understand Samarkand not only through blue tile, but through a craft rhythm that still belongs to the region."
          "ru": "За пределами главных памятников Конигил замедляет день: арыки, волокно бумаги, хлеб и работа рук. Самарканд становится понятнее не только через синюю керамику, но и через ремесленный ритм, который всё ещё принадлежит региону."
          "uz": "Asosiy yodgorliklardan tashqarida Konigil kunni ariqlar, qog‘oz tolasi, non va ishlayotgan qo‘llar ritmiga sekinlashtiradi. Samarqand faqat ko‘k koshin orqali emas, hududga hanuz tegishli hunar ritmi orqali ham tushunarli bo‘ladi."
  - "blockType": "regular"
    "eyebrow":
      "en": "Before you go"
      "ru": "Перед поездкой"
      "uz": "Yo‘lga chiqishdan oldin"
    "title":
      "en": "How to pace a Samarkand day"
      "ru": "Как выстроить день в Самарканде"
      "uz": "Samarqand kunini shoshmasdan ko‘rish"
    "description":
      "en": "Samarkand is easy to enter, and just as easy to turn into a list. The day feels clearer with simple pauses: market sound, station rhythm, one archaeological or scientific stop, and a pause after the open square."
      "ru": "В Самарканд легко приехать, но день быстро превращается в список, если всё держится только на памятниках. Помогают простые паузы: звук рынка, ритм вокзала, одна археологическая или научная остановка и передышка после открытой площади."
      "uz": "Samarqandga kelish oson, lekin kun tezda yodgorliklar ro‘yxatiga aylanib qolishi mumkin. Oddiy pauzalar yordam beradi: bozor tovushi, vokzal ritmi, bitta arxeologik yoki ilmiy to‘xtash va ochiq maydondan keyingi nafas."
    "rows":
      - "ratio": "2:1"
        "left":
          - "type": "dashTitle"
            "title":
              "en": "Arrival without rush"
              "ru": "Приезд без спешки"
              "uz": "Shoshilmasdan kelish"
            "description":
              "en": "The train station or airport sets the first city impression. A calm transfer and a little room before the first visit keep the domes from feeling rushed."
              "ru": "Вокзал или аэропорт задают первое впечатление. Спокойный трансфер и небольшая пауза перед первой прогулкой помогают увидеть купола без ощущения спешки."
              "uz": "Vokzal yoki aeroport birinchi taassurotni beradi. Sokin transfer va birinchi sayrdan oldingi kichik pauza gumbazlarni shoshilmasdan ko‘rishga yordam beradi."
          - "type": "quote"
            "quote":
              "en": "Samarkand stays whole when Registan leaves room for mausoleums, archaeology, the bazaar, and the road onward."
              "ru": "Самарканд остаётся цельным, когда после Регистана есть место для мавзолеев, археологии, базара и дороги дальше."
              "uz": "Samarqand Registondan keyin maqbaralar, arxeologiya, bozor va keyingi yo‘l uchun joy qolganida yaxlitroq seziladi."
          - "type": "dashTitle"
            "title":
              "en": "Monuments, mausoleums, and archaeology"
              "ru": "Памятники, мавзолеи и археология"
              "uz": "Yodgorliklar, maqbaralar va arxeologiya"
            "description":
              "en": "Registan, Shah-i-Zinda, Bibi-Khanym, and Gur-e-Amir are close enough for short transfers, but each needs a different pace. Afrasiab and Ulugh Beg's observatory add older history and scientific context when the route has room."
              "ru": "Регистан, Шахи-Зинда, Биби-Ханым и Гур-Эмир находятся недалеко друг от друга, но каждому месту нужен свой темп. Афрасиаб и обсерватория Улугбека добавляют древнюю историю и научный контекст, если в маршруте есть место."
              "uz": "Registon, Shohi Zinda, Bibi Xonim va Go‘ri Amir bir-biriga yaqin, lekin har biri alohida ritmni so‘raydi. Afrosiyob va Ulug‘bek rasadxonasi marshrutda joy bo‘lsa, qadimiy tarix va ilmiy kontekst qo‘shadi."
          - "type": "dashTitle"
            "title":
              "en": "Bazaar, small stops, and onward route"
              "ru": "Базар, малые остановки и продолжение маршрута"
              "uz": "Bozor, kichik bekatlar va davom yo‘li"
            "description":
              "en": "Siab Bazaar, Chorsu Gallery, old-city lanes, and small craft pauses give the day voices, bread, and street movement before the journey turns west toward Bukhara and Khiva."
              "ru": "Сиабский базар, галерея Чорсу, старые улицы и короткие ремесленные паузы дают дню голоса, хлеб и движение старого города перед дорогой на запад к Бухаре и Хиве."
              "uz": "Siyob bozori, Chorsu galereyasi, eski ko‘chalar va qisqa hunarmandchilik pauzalari Buxoro hamda Xivaga gʻarb yo‘li oldidan kunga ovoz, non hidi va eski shahar harakatini beradi."
          - "type": "alert"
            "title":
              "en": "For the traveler"
              "ru": "Для путешественника"
              "uz": "Sayohatchi uchun"
            "description":
              "en": "One calm morning or evening gives the square, tilework, mausoleum, bazaar, one calmer stop, and onward train enough room to belong together."
              "ru": "Одного спокойного утра или вечера достаточно, чтобы площадь, керамика, мавзолей, базар, одна спокойная остановка и следующий поезд стали частью одного дня."
              "uz": "Hech bo‘lmaganda bitta sokin tong yoki oqshom qolsa, maydon, koshin, maqbara, bozor, bitta sokin to‘xtash va keyingi poyezd bir kunning qismlariga aylanadi."
        "right":
          - "type": "miniTable"
            "title":
              "en": "Before you go"
              "ru": "Перед поездкой"
              "uz": "Yo‘lga chiqishdan oldin"
            "icon": "Circle"
            "rows":
              - "icon": "MapPin"
                "title":
                  "en": "Before you go Stay rhythm"
                  "ru": "Перед поездкой Темп пребывания"
                  "uz": "Yo‘l oldidan Qolish ritmi"
                "description":
                  "en": "Two nights give Registan, Shah-i-Zinda, Bibi-Khanym, Gur-e-Amir, the bazaar, and one archaeology or observatory stop enough room."
                  "ru": "Две ночи дают место для Регистана, Шахи-Зинды, Биби-Ханым, Гур-Эмира, базара и одной археологической или обсерваторной остановки."
                  "uz": "Ikki tun Registon, Shohi Zinda, Bibi Xonim, Go‘ri Amir, bozor va bitta arxeologiya yoki rasadxona to‘xtashi uchun joy beradi."
              - "icon": "Landmark"
                "title":
                  "en": "Main place"
                  "ru": "Главное место"
                  "uz": "Asosiy joy"
                "description":
                  "en": "Registan is the first major place, but the city becomes clearer with Shah-i-Zinda, Gur-e-Amir, and the old-city side."
                  "ru": "Регистан — первое сильное место, но город понятнее вместе с Шахи-Зиндой, Гур-Эмиром и старым городом."
                  "uz": "Registon birinchi kuchli joy, ammo shahar Shohi Zinda, Go‘ri Amir va eski shahar bilan tushunarliroq bo‘ladi."
              - "icon": "Sun"
                "title":
                  "en": "Best rhythm"
                  "ru": "Лучший ритм"
                  "uz": "Eng yaxshi ritm"
                "description":
                  "en": "Spring and autumn are easiest; summer needs early starts, cooler pauses, and evening returns."
                  "ru": "Весна и осень удобнее всего; летом нужны ранние выходы, прохладные паузы и вечерние возвращения."
                  "uz": "Bahor va kuz eng qulay; yozda erta chiqish, salqin pauzalar va kechki qaytish kerak."
              - "icon": "Route"
                "title":
                  "en": "Route role"
                  "ru": "Роль в маршруте"
                  "uz": "Marshrutdagi roli"
                "description":
                  "en": "Rail link between Tashkent and Bukhara, with Khiva as the wider westward continuation."
                  "ru": "Железнодорожный узел между Ташкентом и Бухарой, с Хивой как западным продолжением."
                  "uz": "Toshkent va Buxoro orasidagi temiryo‘l tuguni, Xiva esa gʻarbdagi davom yo‘li."
  - "blockType": "regular"
    "eyebrow":
      "en": "Route programs"
      "ru": "Маршруты"
      "uz": "Yo‘nalishlar"
    "title":
      "en": "Routes that include Samarkand"
      "ru": "Маршруты с Самаркандом"
      "uz": "Samarqand bor yo‘nalishlar"
    "description":
      "en": "Samarkand belongs in most Uzbekistan routes, but the number of hours changes the experience: a rushed stop shows monuments; a calmer stay adds Gur-e-Amir, Afrasiab or the observatory, market sound, and pauses."
      "ru": "Самарканд входит в большинство маршрутов по Узбекистану, но время меняет сам день: спешная остановка показывает памятники, а спокойное пребывание добавляет Гур-Эмир, Афрасиаб или обсерваторию, звук базара и паузы."
      "uz": "Samarqand Oʻzbekiston marshrutlarining ko‘pida bor, lekin vaqt tajribani o‘zgartiradi: shoshilgan bekat yodgorliklarni ko‘rsatadi, sokinroq qolish esa Go‘ri Amir, Afrosiyob yoki rasadxona, bozor tovushi va pauzalarni qo‘shadi."
  - "blockType": "regular"
    "eyebrow":
      "en": "Route connections"
      "ru": "Куда дальше"
      "uz": "Keyingi yo‘l"
    "title":
      "en": "Where the route continues"
      "ru": "Куда маршрут идёт дальше"
      "uz": "Yo‘l qayerga davom etadi"
    "description":
      "en": "After Samarkand, the journey usually turns west to Bukhara and Khiva, where the scale tightens from open squares to old-city walls and courtyard rhythm."
      "ru": "После Самарканда путь обычно уходит на запад к Бухаре и Хиве, где открытые площади сменяются стенами старого города и ритмом дворов."
      "uz": "Samarqanddan keyin yo‘l ko‘pincha gʻarbga, Buxoro va Xivaga buriladi; u yerda ochiq maydonlar eski shahar devorlari va hovlilar ritmiga almashadi."
