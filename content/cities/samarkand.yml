        "description":
          "en": "Bibi-Khanym stands at the edge of monument and bazaar: a great portal, brick, blue ornament, and Siab Bazaar a few steps away. The place is easier to understand with the old-city life around it, not as a monument apart."
          "ru": "Биби-Ханым стоит на границе памятника и базара: большой портал, кирпич, синий орнамент и Сиабский базар в нескольких шагах. Место понятнее не отдельно, а вместе со старогородской жизнью вокруг."
          "uz": "Bibi Xonim yodgorlik va bozor chegarasida turadi: katta portal, g‘isht, ko‘k naqsh va bir necha qadam naridagi Siyob bozori. Bu joy alohida emas, atrofidagi eski shahar hayoti bilan tushunarliroq."
