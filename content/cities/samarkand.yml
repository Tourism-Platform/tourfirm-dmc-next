        "description":
          "en": "Registan is Samarkand at full scale: Ulugh Beg, Sher-Dor, and Tilya-Kori madrasahs facing one open square. The place is easiest to understand when the first view has time, then the details begin to separate: mosaic, calligraphy, courtyards, and doorways."
          "ru": "Регистан показывает Самарканд в полном масштабе: медресе Улугбека, Шер-Дор и Тилля-Кари стоят вокруг открытой каменной площади. Место легче понять, если сначала дать время общему виду, а потом приблизиться к мозаике, каллиграфии, дворам и дверям медресе."
          "uz": "Registon Samarqandni katta miqyosda ko‘rsatadi: Ulug‘bek, Sherdor va Tillakori madrasalari ochiq tosh maydon atrofida turadi. Joyni avval umumiy ko‘rinishga vaqt berib, keyin mozaika, xattotlik, hovlilar va eshiklarga yaqinlashganda tushunish osonroq."
        "ctaHref": "/destinations/uzbekistan/samarkand-region/samarkand/registan-square"
