    "title":
      "en": "How to place Samarkand in the day plan"
      "ru": "Как поставить Самарканд в план дня"
      "uz": "Samarqandni kun rejasiga qanday joylashtirish"
    "description":
      "en": "Walking time, overnight location, and when day trips make sense."
      "ru": "Пешее время, место ночёвки и когда выезды имеют смысл."
      "uz": "Piyoda vaqt, tunash joyi va chiqishlar qachon o‘rinli."
    "gridClassName": "grid-cols-1"
    "cards":
      - "type": "destinationInsight"
        "icon": "CircleQuestionMark"
        "title":
          "en": "How long should groups stay in Samarkand?"
          "ru": "Сколько времени группам стоит проводить в Самарканд?"
          "uz": "Samarqandda guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "one focused city day plus overnight is usually enough when the old core or main anchors get a full walking window. City tone: “Blue tile, rail rhythm, and old-city life”."
          "ru": "Обычно хватает один насыщенный городской день плюс ночёвка, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Синяя керамика, ритм поездов и жизнь старого города»."
          "uz": "Odatda bitta zich shahar kuni va tunash yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Koʻk koshin, poyezd ritmi va eski shahar hayoti»."
      - "type": "destinationInsight"
        "icon": "MapPin"
        "title":
          "en": "Should Samarkand be a walkable core or a base for day trips?"
          "ru": "Самарканд — это пешеходное ядро или база для выездов?"
          "uz": "Samarqand piyoda yadroimi yoki chiqishlar uchun baza?"
        "description":
          "en": "Start with the compact city walk first. Day trips only after the centre has settled — otherwise the stop feels like a transfer with monuments attached."
          "ru": "Сначала компактная городская прогулка. Выезды — только после того, как центр «сел»; иначе остановка ощущается как трансфер с памятниками."
          "uz": "Avval ixcham shahar sayri. Chiqishlar — markaz joylashgandan keyin; aks holda bekat yodgorlikli transferdek tuyuladi."
      - "type": "destinationInsight"
        "icon": "Moon"
        "title":
          "en": "Where should overnight be relative to Samarkand's centre?"
          "ru": "Где лучше ночевать относительно центра Самарканд?"
          "uz": "Samarqand markaziga nisbatan qayerda tunash yaxshi?"
        "description":
          "en": "Stay close enough for an evening return on foot or a short transfer. That keeps tea, dinner, and a second pass through the lanes easy without burning the next morning."
          "ru": "Живите достаточно близко, чтобы вечером вернуться пешком или коротким трансфером. Так чай, ужин и второй проход по улицам остаются лёгкими и не сжигают следующее утро."
          "uz": "Kechqurun piyoda yoki qisqa transfer bilan qaytishga yaqin turing. Choy, kechki ovqat va ko‘chalardan ikkinchi o‘tish oson qoladi, erta tongni yoqib yubormaydi."
