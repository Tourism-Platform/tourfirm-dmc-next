  "en": "Registan may be the first image travelers carry of Uzbekistan, but Samarkand is wider than one square. The day leads on to Shah-i-Zinda, Gur-e-Amir, Bibi-Khanym, Siab Bazaar, old lanes, early trains from Tashkent, Afrasiab beneath today's city, and the scientific story around Ulugh Beg's observatory."
  "ru": "Регистан часто становится первым образом Узбекистана, но Самарканд шире одной площади. День ведёт дальше — к Шахи-Зинде, Гур-Эмиру, Биби-Ханым, Сиабскому базару, старым улицам, ранним поездам из Ташкента, Афрасиабу под современным городом и научной истории вокруг обсерватории Улугбека."
  "uz": "Registon ko‘p sayohatchilar uchun Oʻzbekistonning birinchi tasviri bo‘lishi mumkin, lekin Samarqand bitta maydondan kengroq. Shahar ko‘k koshin, Go‘ri Amir, bozor noni, eski ko‘chalar, Toshkentdan keladigan erta poyezdlar, zamonaviy shahar ostidagi Afrosiyob va Ulug‘bek rasadxonasi tomon davom etadi."
