          "ru": "Лёгкий активный маршрут"
          "uz": "Yengil faol yoʻnalish"
        "title":
          "en": "Hisorak road rhythm"
          "ru": "Ритм дороги через Хисорак"
          "uz": "Hisorak yo‘li ritmi"
        "description":
          "en": "The climb itself is part of the experience: daylight, bends, weather, and border-area context shape how far and how calmly the route should go."
          "ru": "Сам подъём — часть впечатления: светлое время, повороты, погода и приграничный контекст задают, насколько далеко и спокойно двигаться."
          "uz": "Ko‘tarilishning o‘zi tajribaning bir qismi: kunduzgi vaqt, burilishlar, ob-havo va chegara hududi yo‘lning qanchalik sokin davom etishini belgilaydi."
  - "blockType": "regular"
