          "ru": "Ремесло в масштабе дома"
          "uz": "Xonadon o‘lchamidagi hunar"
        "description":
          "en": "Woodcarving, painting, and home-museum corners feel strongest when they stay personal: one room, one family story, and time to look closely."
          "ru": "Резьба по дереву, живопись и домашние музейные уголки сильнее всего звучат лично: одна комната, одна семейная история и время рассмотреть детали."
          "uz": "Yog‘och o‘ymakorligi, rassomchilik va uy-muzey burchaklari shaxsiy qolganda kuchliroq: bir xona, bir oilaviy hikoya va diqqat bilan qarash uchun vaqt."
      - "type": "experience"
        "image": "assets/images/destinations/uzbekistan.jpg"
        "badge":
          "en": "Culture"
          "ru": "Культура"
          "uz": "Madaniyat"
        "title":
          "en": "Old mill and water"
          "ru": "Старая мельница и вода"
          "uz": "Eski tegirmon va suv"
        "description":
          "en": "The old stone mill and village water give G‘elon a working sound, the kind of detail that turns a mountain stop into a lived place."
          "ru": "Старая каменная мельница и вода дают Гелону рабочий звук — ту деталь, из-за которой горная остановка становится живым местом."
          "uz": "Eski tosh tegirmon va qishloq suvi G‘elonga mehnat ovozini beradi; tog‘dagi bekat shu tafsilot bilan yashagan joyga aylanadi."
      - "type": "experience"
