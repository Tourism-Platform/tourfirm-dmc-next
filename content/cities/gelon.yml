              "ru": "Дорога и сезон"
              "uz": "Yo‘l va mavsum"
            "description":
              "en": "First impressions begin before the village. Beyond Shakhrisabz and Hisorak, the road rises into clearer air, open slopes, and long views. Daylight, weather, and vehicle comfort matter because the approach is part of the visit, not just transit."
              "ru": "Первое впечатление начинается до самого села. За Шахрисабзом и Хисораком дорога поднимается к более ясному воздуху, открытым склонам и дальним видам. Светлое время, погода и комфорт машины важны потому, что подъезд — часть визита, а не просто переезд."
              "uz": "Birinchi taassurot qishloqdan oldin boshlanadi. Shahrisabz va Hisorakdan keyin yo‘l tiniqroq havo, ochiq yonbag‘irlar va uzoq manzaralarga ko‘tariladi. Kunduzgi vaqt, ob-havo va mashina qulayligi muhim, chunki bu kirish shunchaki o‘tish emas, tashrifning bir qismi."
          - "type": "quote"
            "quote":
              "en": "The climb gives G‘elon its distance; the village gives it its warmth."
              "ru": "Подъём даёт Гелону дистанцию; село даёт ему тепло."
              "uz": "Ko‘tarilish G‘elonga masofa beradi; qishloq unga iliqlik beradi."
