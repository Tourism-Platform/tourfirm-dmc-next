  "metaDescription":
    "en": "G‘elon sits high above Hisorak, where the Shakhrisabz road climbs into sharper air, orchard slopes, and pakhsa clay lanes. The village is strongest at human scale: water channels, family tables, craft rooms, the old mill, and a mountain pace that asks the route to slow down."
    "ru": "Гелон стоит высоко над Хисораком, там, где дорога из Шахрисабза поднимается к более резкому воздуху, садам на склонах и пахсовым улицам. Село сильнее всего раскрывается в человеческом масштабе: вода, домашние столы, ремесленные комнаты, старая мельница и горный ритм, который замедляет маршрут."
    "uz": "G‘elon Hisorakdan yuqorida, Shahrisabz yo‘li tiniqroq havo, yonbag‘ir bog‘lari va paxsa ko‘chalarga ko‘tariladigan joyda turadi. Qishloqning kuchi xonadon o‘lchamida seziladi: suv, dasturxon, hunar xonalari, eski tegirmon va yo‘lni sekinlashtiradigan tog‘ ritmi."
