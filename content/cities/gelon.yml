              "ru": "Выбирайте Гелон, когда хотите, чтобы маршрут из Шахрисабза поднялся в настоящее высокогорное село, с временем на дорогу, короткую прогулку, воду, сады и тихий стол."
              "uz": "Shahrisabz yo‘li haqiqiy baland tog‘ qishlog‘iga ko‘tarilishini, yo‘l, qisqa yurish, suv, bog‘lar va sokin dasturxonga vaqt bo‘lishini xohlasangiz, G‘elonni tanlang."
