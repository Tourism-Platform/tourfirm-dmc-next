            "title":
              "en": "Village life at household scale"
              "ru": "Сельская жизнь в масштабе дома"
              "uz": "Xonadon o‘lchamidagi qishloq hayoti"
            "description":
              "en": "Inside G‘elon, the memorable details are deliberately small: pakhsa walls, narrow lanes, gardens, livestock, potatoes, fruit, walnuts, a school, a mosque, a chaikhana, and the work of mountain households. A short walk stays close to daily life instead of turning the village into a show."
              "ru": "В Гелоне запоминаются именно малые детали: пахсовые стены, узкие улицы, сады, скот, картофель, фрукты, орехи, школа, мечеть, чайхана и труд горных домов. Короткая прогулка остаётся рядом с повседневной жизнью и не превращает село в постановку."
              "uz": "G‘elonda esda qoladigan tafsilotlar kichik: paxsa devorlar, tor ko‘chalar, bog‘lar, chorva, kartoshka, mevalar, yong‘oq, maktab, masjid, choyxona va tog‘ xonadonlarining mehnati. Qisqa yurish kundalik hayotga yaqin qoladi va qishloqni tomoshaga aylantirmaydi."
          - "type": "dashTitle"
            "title":
              "en": "Craft rooms, water, and family tables"
              "ru": "Ремесленные комнаты, вода и семейные столы"
              "uz": "Hunar xonalari, suv va oilaviy dasturxon"
            "description":
              "en": "Woodcarving, painting rooms, home-museum corners, the old stone mill, tea, and seasonal family stays give the village its human voice. They belong in the route when the visit remains modest and respectful of household rhythm."
              "ru": "Резьба по дереву, живописные комнаты, домашние музейные уголки, старая каменная мельница, чай и сезонное семейное размещение дают селу человеческий голос. Они уместны в маршруте, когда визит остаётся скромным и уважает домашний ритм."
              "uz": "Yog‘och o‘ymakorligi, rassomchilik xonalari, uy-muzey burchaklari, eski tosh tegirmon, choy va mavsumiy oilaviy tunashlar qishloqqa insoniy ovoz beradi. Tashrif vazmin bo‘lib, xonadon ritmini hurmat qilganda ular yo‘lga mos tushadi."
