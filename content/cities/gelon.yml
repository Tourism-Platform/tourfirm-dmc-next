    "description":
      "en": "G‘elon feels strongest when the route gives the climb and the village enough quiet. The point is not to collect services, but to understand how a high settlement above Hisorak lives with water, gardens, craft, family tables, and weather."
      "ru": "Гелон сильнее всего ощущается, когда маршрут оставляет подъёму и селу достаточно тишины. Смысл не в перечне услуг, а в том, как высокогорное поселение над Хисораком живёт с водой, садами, ремеслом, семейными столами и погодой."
      "uz": "G‘elon yo‘l ko‘tarilishi va qishloqqa yetarli sokinlik berilganda kuchliroq seziladi. Maqsad xizmat sanash emas, Hisorak ustidagi baland manzil suv, bog‘, hunar, oilaviy dasturxon va ob-havo bilan qanday yashashini tushunishdir."
