  "metaDescription":
    "en": "Bozzhira is where Mangystau opens into pale escarpments, fang-like rock, and a plateau that makes distance visible. The reward is not only the view; it is the measured approach, the local driver's judgment, the light on the chalk, and the choice to leave the ground unmarked."
    "ru": "Бозжыра - место, где Мангистау раскрывается белыми уступами, зубчатыми скалами и плато, на котором особенно чувствуется расстояние. Впечатление рождается не только на смотровой: его создают размеренный подъезд, решение местного водителя, свет на меловой поверхности и бережное движение без следов."
    "uz": "Bozzhira Mangistau och rangli qoya devorlari, tishsimon shakllar va masofani sezdiradigan plato bilan ochiladigan joy. Taassurot faqat manzaradan tugʻilmaydi; uni oʻlchangan yoʻl, mahalliy haydovchi qarori, boʻr yuzasidagi yorugʻlik va zaminni izsiz qoldirish istagi yaratadi."
