              "ru": "Саид Ахмад-Ходжа, Пир Сиддик, мечеть Хонахан и Кумтепа-базар могут расширить Маргилан, когда доступ и время на маршруте понятны."
              "uz": "Said Ahmad Xoja, Pir Siddiq, Xonaxon masjidi va Kumtepa bozori kirish va yo‘nalishdagi vaqt aniq bo‘lganda Margʻilonni kengaytirishi mumkin."
