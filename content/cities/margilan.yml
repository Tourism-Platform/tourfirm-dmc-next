              "ru": "Атлас и адрас, обучение, мастерские, выставки и работа по сохранению ремесла показывают, почему город важен шире одной фабрики."
              "uz": "Atlas va adras, taʼlim, ustaxonalar, ko‘rgazmalar va hunarni saqlash ishlari shahar nima uchun bitta fabrikadan kengroq ekanini ko‘rsatadi."
          - "type": "dashTitle"
