          "uz": "Margʻilonda guruhlar qancha vaqt o‘tkazishi kerak?"
        "description":
          "en": "one focused city day plus overnight is usually enough when the old core or main anchors get a full walking window. City tone: “Silk workshops, atlas and adras, and the craft route through the valley”."
          "ru": "Обычно хватает один насыщенный городской день плюс ночёвка, если старому центру или главным якорям дать полноценное пешеходное окно. Тон города: «Шёлковые мастерские, атлас и адрас, ремесленный маршрут долины»."
          "uz": "Odatda bitta zich shahar kuni va tunash yetadi — eski markaz yoki asosiy tayanchlarga to‘liq piyoda oyna bersangiz. Shahar ohangi: «Ipak ustaxonalari, atlas va adras, vodiydagi hunar yo‘li»."
