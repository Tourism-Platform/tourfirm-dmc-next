"seo":
  "metaTitle":
    "en": "Katon-Karagay | TourLink"
    "ru": "Катон-Карагай | TourLink"
    "uz": "Katon-Qaragʻay | TourLink"
  "metaDescription":
    "en": "Katon-Karagay changes the scale of the eastern journey. After Oskemen and the Irtysh, the road moves toward dark forest, river valleys, pale mountain light, and protected Altai landscapes where weather can reshape the sequence. Come for distance, quiet, and enough time to let the mountains enter the plan."
    "ru": "Катон-Карагай меняет масштаб восточного путешествия. После Усть-Каменогорска и Иртыша дорога уходит к тёмному лесу, речным долинам, светлым горным склонам и охраняемым алтайским ландшафтам, где погода может изменить порядок остановок. Сюда едут за расстоянием, тишиной и временем для гор."
    "uz": "Katon-Qaragʻay sharqiy safarning miqyosini oʻzgartiradi. Oʻskemen va Irtish ortda qolgach, yoʻl qoramtir oʻrmon, daryo vodiylari, och togʻ nuri va qoʻriqlanadigan Altay manzaralari tomon buriladi; bu yerda ob-havo toʻxtashlar ketma-ketligini oʻzgartirishi mumkin. Bu yerga masofa, sokinlik va togʻlarni his qilish uchun vaqt bilan keling."
