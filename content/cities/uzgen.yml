  "metaDescription":
    "en": "Uzgen changes the Osh route without becoming a large city stop. The historical complex gives the visit its focus: mausoleum portals, a minaret, patterned brick, and everyday town life nearby. Start with the Karakhanid architecture; add bazaar or rice notes only when the local plan genuinely supports them."
    "ru": "Узген меняет маршрут от Оша, не превращаясь в большую городскую остановку. Исторический комплекс задаёт фокус визита: порталы мавзолеев, минарет, орнамент кирпича и повседневная жизнь городка рядом. Сначала приезжайте за караханидской архитектурой; базар и рисовую историю добавляйте только тогда, когда местный план действительно это поддерживает."
    "uz": "Oʻzgan Oshdan chiqadigan yoʻlni oʻzgartiradi, lekin katta shahar bekatiga aylanmaydi. Tarixiy majmua tashrifning diqqatini belgilaydi: maqbara peshtoqlari, minora, naqshli gʻisht va yon-atrofdagi kundalik shahar hayoti. Avval Qoraxoniylar meʼmorchiligi uchun keling; bozor va guruch hikoyasini faqat mahalliy reja mos boʻlganda qoʻshing."
