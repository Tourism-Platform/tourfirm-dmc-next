  "en": "Mushkan sits in Nurota District on the mountain side of the Nurata, Aydarkul & Kyzylkum route. It suits a modest village stop: a household meal, bread-making, weaving or music, and a nearby continuation toward Kichiksoy or Nurata."
  "ru": "Мушкан находится в Нуратинском районе, на горной стороне маршрута Нурата, Айдаркуль и Кызылкум. Село подходит для спокойной сельской остановки: домашний стол, выпечка хлеба, ткачество или музыка и близкое продолжение к Кичиксою или Нурате."
  "uz": "Mushkan Nurota tumanida, Nurota, Aydarko‘l va Qizilqum yo‘lining tog‘ tomonida joylashgan. Bu yer xonadon dasturxoni, non yopish, to‘quv yoki musiqa va Kichiksoy yoki Nurota tomon yaqin davom uchun sokin qishloq bekati bo‘la oladi."
