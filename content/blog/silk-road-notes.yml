    description:
      en: "Samarkand's Registan is rarely empty — but it changes character. This note is about scheduling the square so clients feel the architecture, not only photograph it between bus arrivals."
      ru: "Регистан в Самарканде редко пуст — но меняет характер. Эта заметка о том, как планировать площадь, чтобы клиенты чувствовали архитектуру, а не только снимали её между подъездами автобусов."
      uz: "Samarqand Registoni kamdan-kam bo'sh — lekin xarakteri o'zgaradi. Bu qayd maydonni shunday rejalashtirish haqida, mijozlar arxitekturani his qilsin, faqat avtobuslar orasida suratga olmasin."
  - blockType: regular
    eyebrow:
      en: Route note
      ru: Заметка с маршрута
      uz: Marshrut qaydi
    title:
      en: Reading the square at the right hour
      ru: Читать площадь в правильный час
      uz: Maydonni to'g'ri soatda o'qish
    description:
      en: "Midday heat and tour buses compress Registan into a checkpoint. Late afternoon light pulls color from the tiles and lengthens shadows across the courtyard. On a silk-road-classics arc, we often place Samarkand's first full day with a late Registan visit after lunch and a slower museum block in the morning.\n\nFor FIT travelers, the same logic applies without a guide rush — buy tickets ahead, enter from the side that matches your hotel walk, and keep thirty minutes unscheduled on the square itself. That margin is when clients notice acoustic detail and tile geometry that a fifteen-minute stop never reveals."
      ru: "Полуденная жара и автобусы превращают Регистан в контрольную точку. Вечерний свет вытягивает цвет из изразцов и удлиняет тени во дворе. На дуге silk-road-classics мы часто ставим первый полный день в Самарканде с поздним визитом в Регистан после обеда и спокойным музейным блоком утром.\n\nДля FIT та же логика без спешки гида — билеты заранее, вход с той стороны, что совпадает с прогулкой от отеля, и тридцать минут без программы на самой площади. Именно в этом запасе клиенты замечают акустику и геометрию плитки, которую пятнадцатиминутная остановка не показывает."
      uz: "Tushdan keyingi issiq va sayohat avtobuslari Registoni nazorat punktiga aylantiradi. Kechki yorug'lik kafellardan rangni chiqaradi va hovlidagi soyalarni uzaytiradi. silk-road-classics yoyida Samarqandning birinchi to'liq kunini tushlikdan keyin kech Registon tashrifi va ertalab sekin muzey bloki bilan rejalashtiramiz.\n\nFIT sayohatchilar uchun ham xuddi shu mantiq — chiptalarni oldindan, mehmonxonadan piyoda yo'lga mos kirish va maydonda dastursiz o'ttiz daqiqa. Aynan shu zaxirada mijozlar o'n besh daqiqalik to'xtash ko'rsatmaydigan akustika va kafel geometriyasini sezadi."
