subtitle:
  en: A route note on Registan timing for agency groups and FIT travelers
  ru: Заметка о времени в Регистане для агентских групп и FIT
  uz: Agentlik guruhlari va FIT sayohatchilar uchun Registon vaqti haqida qayd
excerpt:
  en: The best Registan moments often come after the midday rush — when light softens, tiles read differently, and a six-day Silk Road arc finally has room to breathe. A short editorial note from the journal, not a day-by-day itinerary.
  ru: Лучшие моменты в Регистане часто приходят после полуденной суеты — когда свет смягчается, изразцы читаются иначе, и шестидневная дуга Шёлкового пути наконец дышит. Короткая редакционная заметка, а не программа по дням.
  uz: Registondagi eng yaxshi lahzalar ko'pincha tushdan keyingi shovqindan keyin keladi — yorug'lik yumshaganda, kafellar boshqacha ko'ringanda va olti kunlik Ipak yo'li yoyi nafas oladi. Kunlik dastur emas, qisqa tahririy qayd.
