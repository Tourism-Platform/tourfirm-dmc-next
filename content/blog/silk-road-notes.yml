          ru: Передача агентству
          uz: Agentlikka topshirish
        description:
          en: Share this note with clients as context — the linked routes carry day counts; this journal entry explains why Samarkand day two is not interchangeable with day one.
          ru: Передайте агентству как контекст — связанные маршруты дают число дней; эта заметка объясняет, почему второй день в Самарканде не равен первому.
          uz: Agentlikka kontekst sifatida ulashing — bog'langan marshrutlar kunlar sonini beradi; bu qayd nima uchun Samarqand ikkinchi kuni birinchi kun bilan almashtirilmasligini tushuntiradi.
