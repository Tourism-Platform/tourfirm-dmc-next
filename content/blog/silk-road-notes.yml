        description:
          en: Aim for 16:00–18:00 in shoulder months; summer may shift later. Pair with wine-route-samarkand tastings the same evening if pacing allows.
          ru: В межсезонье ориентир 16:00–18:00; летом позже. При хорошем темпе в тот же вечер можно добавить дегустацию из wine-route-samarkand.
          uz: Oraliq mavsumda 16:00–18:00; yozda kechroq. Ritm ruxsat bersa, o'sha kech wine-route-samarkand dasturxonini qo'shing.
