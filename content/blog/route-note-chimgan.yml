    description:
      en: "Chimgan is close on the map and far in experience — the drive is part of the product. This note is for planners who treat mountain legs like city hops and wonder why clients arrive tired before the first viewpoint."
      ru: "Чимган на карте близко, в опыте — далеко; дорога — часть продукта. Заметка для тех, кто относится к горным перегонам как к городским и удивляется, почему клиенты устают до первой смотровой."
      uz: "Chimgan xaritada yaqin, tajribada uzoq — yo'l mahsulotning bir qismi. Tog' yo'nalishlarini shahar ko'chishlari kabi ko'radigan va mijozlar birinchi kuzatuv maydonchasigacha charchaganini hayron ko'radigan rejalashtiruvchilar uchun qayd."
  - blockType: regular
    eyebrow:
      en: Mountain pacing
      ru: Темп в горах
      uz: Tog'larda ritm
    title:
      en: Why buffer beats optimism
      ru: Почему запас побеждает оптимизм
      uz: Nega zaxira optimistik rejadan ustun
    description:
      en: "Navigation apps quote ninety minutes Tashkent to Chimgan on a clear Tuesday. Friday outbound traffic, roadside produce stops, and Charvak reservoir viewpoints routinely push the block past two hours. tashkent-to-chimgan builds one full road day — not a morning add-on before an evening flight.\n\nWe schedule lunch near the reservoir with a hard cutoff for the ascent, keep photo stops counted (two, not six), and hold a weather buffer before cable-car or ridge walks. Agencies quoting same-day Chimgan plus city touring should split products; clients attempting both remember traffic, not mountains."
      ru: "Навигаторы дают полтора часа из Ташкента в Чимган в ясный вторник. Пятничный трафик, остановки у дороги и смотровые у Чарвака регулярно растягивают блок за два часа. tashkent-to-chimgan строит один полный дорожный день — не утреннее дополнение перед вечерним рейсом.\n\nМы планируем обед у водохранилища с жёстким лимитом на подъём, считаем фото-остановки (две, не шесть) и держим погодный запас перед канаткой или хребтом. Агентства, продающие Чимган и город в один день, должны разделить продукты; клиенты, пытающиеся совместить, запоминают пробки, а не горы."
      uz: "Navigatorlar aniq seshanba kuni Toshkentdan Chimganga bir yarim soat ko'rsatadi. Juma chiqish tirbandligi, yo'l bo'yi to'xtashlar va Charvak suv ombori manzaralari blokni muntazam ikki soatdan oshiradi. tashkent-to-chimgan bitta to'liq yo'l kunini quradi — kechki reysdan oldin ertalab qo'shimcha emas.\n\nSuv ombori yaqinida tushlikni qattiq chegarada rejalashtiramiz, foto to'xtashlarni sanaymiz (ikkita, oltita emas) va arqon yo'li yoki qirra sayriga oldin ob-havo zaxirasini saqlaymiz. Bir kunda Chimgan va shahar turini sotadigan agentliklar mahsulotlarni ajratishi kerak; ikkalasini birlashtirgan mijozlar tog'larni emas, tirbandlikni eslaydi."
    gridClassName: md:grid-cols-2
    cards:
      - type: destinationInsight
        icon: clock
        title:
          en: Minimum road block
          ru: Минимальный дорожный блок
          uz: Minimal yo'l bloki
        description:
          en: Count four hours gate-to-lodge in peak season; three in shoulder months. Anything less risks dinner in the car.
          ru: В пик — четыре часа от ворот до лоджа; в межсезонье — три. Меньше — риск ужина в машине.
          uz: Eng yuqori mavsumda eshikdan lujgacha to'rt soat; oraliq mavsumda uch. Kamroq — mashinada kechki ovqat xavfi.
      - type: destinationInsight
        icon: map-pin
        title:
          en: Charvak as a meal, not a drive-by
          ru: Чарвак как обед, а не проезд
          uz: Charvak haydash emas, tushlik
        description:
          en: Thirty seated minutes lakeside stabilizes the afternoon ascent. Rushed ten-minute stops frustrate photographers and drivers alike.
          ru: Тридцать минут у озера стабилизируют послеобеденный подъём. Десятиминутные остановки раздражают и фотографов, и водителей.
          uz: Ko'l bo'yida o'ttiz daqiqa o'tirish tushdan keyingi ko'tarilishni barqarorlashtiradi. O'n daqiqalik shoshilinch to'xtashlar ham fotograflarni, ham haydovchilarni asabiylashtiradi.
