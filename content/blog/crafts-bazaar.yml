subtitle:
  en: Why craft stops need calendar space on a Bukhara arc
  ru: Почему ремесленным остановкам нужно место в календаре на дуге Бухары
  uz: Nega hunarmandchilik to'xtashlari Buxoro yoyida taqvimga joy kerak
excerpt:
  en: Hands need time, questions need space — a good craft stop is scheduled like a meal, not squeezed between monuments. This note explains how we block half-day workshop slots on bukhara-craft-trail and silk-road-classics without breaking transfer math.
  ru: Рукам нужно время, вопросам — пространство — хорошая ремесленная остановка планируется как обед, а не впихивается между памятниками. Заметка о том, как мы выделяем полудневные мастерские на bukhara-craft-trail и silk-road-classics без нарушения переездов.
  uz: Qo'llarga vaqt, savollarga joy kerak — yaxshi hunarmandchilik to'xtashi yodgorliklar orasiga siqilmay, tushlik kabi rejalashtiriladi. bukhara-craft-trail va silk-road-classics da yarim kunlik ustaxona slotlarini transfer hisobini buzmasdan qanday ajratishimiz haqida qayd.
