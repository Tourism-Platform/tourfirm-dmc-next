          ru: Порядок городов, дорожные блоки и впечатления на одном экране — паттерн silk-road-classics и связанных редакционных маршрутов.
          uz: Shahar tartibi, yo'l bloklari va taassurot belgilari bir ko'rinishda — silk-road-classics va bog'langan tahririy marshrutlar ortidagi naqsh.
