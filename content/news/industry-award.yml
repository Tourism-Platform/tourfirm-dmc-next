title:
  en: TourLink recognized for Silk Road program design
  ru: TourLink отмечен за дизайн программ Шёлкового пути
  uz: TourLink Ipak yo'li dasturlari dizayni uchun e'tirof etildi
excerpt:
  en: Regional industry award for curated route logic and agency-ready documentation. Judges highlighted map clarity, experience pairing, and realistic pacing across Uzbekistan programs including silk-road-classics.
  ru: Региональная отраслевая награда за продуманную логику маршрутов и документацию для агентств. Жюри отметило ясность карт, сочетание впечатлений и реалистичный темп в программах по Узбекистану, включая silk-road-classics.
  uz: Tanlangan marshrut mantiqi va agentliklar uchun hujjatlar uchun mintaqaviy soha mukofoti. Hakamlar silk-road-classics ham bo'lganda O'zbekiston dasturlaridagi xarita aniqligi, taassurot juftlashuvi va realistik ritmni ta'kidladilar.
