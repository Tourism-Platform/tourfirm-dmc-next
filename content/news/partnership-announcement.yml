    description:
      en: "New contracts improve shoulder-season availability and courtyard-style properties for cultural routes — Samarkand for arrival scale, Bukhara for walkable old-city nights."
      ru: "Новые контракты улучшают доступность в межсезонье и двориковые объекты для культурных маршрутов — Самарканд для масштаба прибытия, Бухара для прогулочных вечеров в старом городе."
      uz: "Yangi shartnomalar madaniy marshrutlar uchun oraliq mavsum mavjudligi va hovli uslubidagi ob'ektlarni yaxshilaydi — Samarqand kelish miqyosi uchun, Buxoro eski shaharda piyoda kechalar uchun."
  - blockType: regular
    eyebrow:
      en: Partnership news
      ru: Новости о партнёрствах
      uz: Hamkorlik yangiliklari
    title:
      en: What changes for agency programs
      ru: Что меняется для агентских программ
      uz: Agentlik dasturlari uchun nima o'zgaradi
    description:
      en: "Samarkand additions focus on properties within sensible transfer time to Registan and wine-route evening slots. Bukhara partners emphasize old-city gates — craft workshops on bukhara-craft-trail no longer require late-night cross-town transfers.\n\nInventory blocks are held for confirmed agency series in shoulder months (March–April, October–November). FIT travelers gain more courtyard options with the same documentation standards — rooming lists, dietary notes, and emergency contacts bundled in the partner brief."
      ru: "Дополнения в Самарканде — объекты в разумном времени до Регистана и вечерних слотов винного маршрута. Партнёры в Бухаре у ворот старого города — мастерские bukhara-craft-trail больше не требуют поздних переездов через город.\n\nБлоки номеров зарезервированы для подтверждённых агентских серий в межсезонье (март–апрель, октябрь–ноябрь). FIT получают больше двориковых вариантов с теми же стандартами документации — списки размещения, питание и контакты в брифе партнёра."
      uz: "Samarqand qo'shimchalari Registonga va vino yo'li kechki slotlariga maqul transfer vaqtidagi ob'ektlarga qaratilgan. Buxoro hamkorlari eski shahar darvozalarida — bukhara-craft-trail ustaxonalari endi kechki shahar bo'ylab ko'chish talab qilmaydi.\n\nXona bloklari oraliq mavsumda (mart–aprel, oktyabr–noyabr) tasdiqlangan agentlik seriyalari uchun saqlanadi. FIT xuddi shu hujjat standartlari bilan ko'proq hovli variantlariga ega — joylashtirish ro'yxatlari, ovqatlanish va favqulodda aloqalar hamkor brifida."
