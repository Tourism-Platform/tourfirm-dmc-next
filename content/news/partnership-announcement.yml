title:
  en: New hotel partners across Samarkand and Bukhara
  ru: Новые партнёры-отели в Самарканде и Бухаре
  uz: Samarqand va Buxoroda yangi mehmonxona hamkorlari
excerpt:
  en: Expanded accommodation network for agency groups and private Silk Road itineraries. New contracts improve shoulder-season availability and courtyard-style properties aligned with silk-road-classics and bukhara-craft-trail pacing.
  ru: Расширенная сеть размещения для агентских групп и частных маршрутов Шёлкового пути. Новые контракты улучшают доступность в межсезонье и двориковые объекты в ритме silk-road-classics и bukhara-craft-trail.
  uz: Agentlik guruhlari va shaxsiy Ipak yo'li marshrutlari uchun kengaytirilgan joylashtirish tarmog'i. Yangi shartnomalar silk-road-classics va bukhara-craft-trail ritmiga mos hovli uslubidagi ob'ektlar va oraliq mavsum mavjudligini yaxshilaydi.
