title:
  en: TourLink opens expanded Tashkent office
  ru: TourLink открывает расширенный офис в Ташкенте
  uz: TourLink kengaytirilgan Toshkent ofisini ochdi
excerpt:
  en: New coordination space for agency programs, route planning, and regional partner meetings. The expanded office adds dedicated B2B briefing rooms and a route workshop area for onboarding incoming partners.
  ru: Новое координационное пространство для агентских программ, планирования маршрутов и встреч с региональными партнёрами. Расширенный офис добавляет отдельные комнаты для B2B-брифингов и зону маршрутных воркшопов для онбординга inbound-партнёров.
  uz: Agentlik dasturlari, marshrut rejalashtirish va mintaqaviy hamkorlar uchrashuvlari uchun yangi muvofiqlashtirish maydoni. Kengaytirilgan ofis B2B brifing xonalari va inbound hamkorlarni jalb qilish uchun marshrut workshop zonasini qo'shadi.
