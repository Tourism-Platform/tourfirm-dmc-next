blocks:
  - blockType: hero
    image: assets/images/hero-image.jpg
    imageAlt:
      en: TourLink office
      ru: Офис TourLink
      uz: TourLink ofisi
    title:
      en: Expanded Tashkent office
      ru: Расширенный офис в Ташкенте
      uz: Kengaytirilgan Toshkent ofisi
    description:
      en: "The team now has dedicated space for B2B briefings, route workshops, and partner onboarding — the same programs we coordinate on the road now have a home base for agencies visiting Uzbekistan."
      ru: "У команды теперь есть отдельное пространство для B2B-брифингов, маршрутных воркшопов и онбординга партнёров — те же программы, что мы ведём в регионе, получили базу для агентств, приезжающих в Узбекистан."
      uz: "Jamoada endi B2B brifinglar, marshrut workshoplari va hamkorlarni jalb qilish uchun alohida joy bor — mintaqada olib boradigan dasturlar O'zbekistonga tashrif buyuradigan agentliklar uchun bazaga ega bo'ldi."
  - blockType: regular
    eyebrow:
      en: Company news
      ru: Новости компании
      uz: Kompaniya yangiliklari
    title:
      en: What the new space enables
      ru: Что даёт новое пространство
      uz: Yangi maydon nima imkon beradi
    description:
      en: "Opening day brought regional hotel partners, guide leads, and agency reps into one floor plan — route maps on wall screens, sample day plans for silk-road-classics, and live catalog queries for 2026 seasons.\n\nGoing forward, the office hosts pre-season briefings, emergency coordination during active groups, and partner contract signings. Visitors can walk in with a group profile and leave with a draft itinerary linked to editorial routes and experiences."
      ru: "В день открытия на одном этаже собрались региональные отельные партнёры, ведущие гиды и представители агентств — маршрутные карты на экранах, примеры программ для silk-road-classics и живые запросы каталога на сезон 2026.\n\nДальше офис принимает предсезонные брифинги, координацию во время активных групп и подписание контрактов. Можно прийти с профилем группы и уйти с черновиком программы, связанной с редакционными маршрутами и впечатлениями."
      uz: "Ochilish kuni mintaqaviy mehmonxona hamkorlari, bosh gidlar va agentlik vakillari bir qavatda yig'ildi — devor ekranlarida marshrut xaritalari, silk-road-classics uchun namuna kunlik rejalar va 2026 mavsumi uchun jonli katalog so'rovlari.\n\nEndi ofis mavsumoldi brifinglar, faol guruhlar paytida favqulodda muvofiqlashtirish va hamkorlik shartnomalarini imzolashni qabul qiladi. Guruh profili bilan kelib, tahririy marshrutlar va taassurotlarga bog'langan dastur qoralamasi bilan ketish mumkin."
    gridClassName: md:grid-cols-2
    cards:
      - type: destinationInsight
        icon: building-2
        title:
          en: B2B briefing rooms
          ru: Комнаты для B2B-брифингов
          uz: B2B brifing xonalari
        description:
          en: Bookable slots for agency teams — route logic, documentation standards, and emergency contact lines in one sitting.
          ru: Бронируемые слоты для команд агентств — логика маршрутов, стандарты документации и линии связи за одну встречу.
          uz: Agentlik jamoalari uchun band qilinadigan slotlar — marshrut mantiqi, hujjat standartlari va favqulodda aloqa bir uchrashuvda.
      - type: destinationInsight
        icon: route
        title:
          en: Route workshop area
          ru: Зона маршрутных воркшопов
          uz: Marshrut workshop zonasi
        description:
