          ru: Живое редактирование программ с картами и впечатлениями — результат даёт запросы каталога, которые агентства отправляют клиентам.
          uz: Xaritalar va taassurot juftlashuvi bilan kunlik rejalar jonli tahriri — natija agentliklar mijozlarga ulashadigan katalog so'rovlarini beradi.
