          en: "I meet guests, lead excursions, and monitor the quality of the program." # Исправлен перевод
          ru: "Встречаю гостей, провожу экскурсии и контролирую качество программы."
          uz: "Mehmonlarni kutib olaman, ekskursiyalar o'tkazaman va dastur sifatini nazorat qilaman." # Исправлен перевод
