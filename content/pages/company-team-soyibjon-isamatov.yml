          ru: "Встреча в аэропорту"
          uz: "Aeroportda kutib olish" # Исправлено: был русский
        description:
          en: "I prefer to personally meet my guests at the airport. For guests without an accompanying guide, I arrange a local SIM card when possible." # Исправлен перевод
          ru: "Встречать своих гостей в аэропорту я предпочитаю лично. Для гостей без сопровождающего гида по возможности организую местную SIM-карту."
          uz: "Mehmonlarimni aeroportda shaxsan kutib olishni afzal ko'raman. Hamroh gidsiz mehmonlar uchun iloji bo'lsa mahalliy SIM-karta tashkil qilaman." # Исправлен перевод
  - blockType: "regular"
    eyebrow:
      en: "Background"
      ru: "Опыт"
      uz: "Tajriba"
    title:
      en: "What goes into organizing a trip" # Исправлен перевод (был русский)
      ru: "Что стоит за организацией поездки"
      uz: "Sayohatni tashkil qilish ortida nima turibdi" # Исправлен перевод (был русский)
    description:
      en: "I have a higher education degree, completed professional courses for guides and a Japanese language training program, and also improved my qualifications in the hospitality industry in Japan. I am fluent in Uzbek, have Japanese at a C1 level, and primarily work with travelers and partners from Japan. Before arrival, I thoroughly inform guests about the weather, appropriate clothing, airport pickup, and other practical details. During the trip, I remain constantly available and strive to quickly resolve any issues that arise." # Исправлен перевод
      ru: "Я получил высшее образование, окончил профессиональные курсы для гидов и программу подготовки по японскому языку, а также повышал квалификацию в сфере гостиничного бизнеса в Японии. Я свободно говорю на узбекском, владею японским языком на уровне C1 и работаю преимущественно с путешественниками и партнёрами из Японии. До приезда я подробно рассказываю гостям о погоде, подходящей одежде, встрече в аэропорту и других практических деталях. Во время путешествия остаюсь постоянно на связи и стараюсь быстро решать любые возникающие вопросы."
      uz: "Men oliy ma'lumotga egaman, gidlar uchun professional kurslar va yapon tili bo'yicha tayyorgarlik dasturini tamomlaganman, shuningdek, Yaponiyada mehmonxona biznesi sohasida malakamni oshirganman. O'zbek tilida erkin gaplashaman, yapon tilini C1 darajasida bilaman va asosan Yaponiyadan kelgan sayohatchilar va hamkorlar bilan ishlayman. Kelishdan oldin mehmonlarga ob-havo, mos kiyim, aeroportda kutib olish va boshqa amaliy tafsilotlar haqida batafsil ma'lumot beraman. Sayohat davomida doim aloqada bo'lib, yuzaga keladigan har qanday muammolarni tezda hal qilishga harakat qilaman." # Исправлен перевод
