  - blockType: "regular"
    eyebrow:
      en: "About"
      ru: "О сотруднике"
      uz: "Xodim haqida"
    rows:
      - ratio: "1:2"
        left:
          - type: "portrait"
            image: "assets/images/people.jpg"
            title:
              en: "Soyibjon Isamatov"
              ru: "Сойибжон Исаматов"
              uz: "Soyibjon Isamatov"
        right:
          - type: "quote"
            quote:
              en: "An older brother and mentor who worked as a Japanese-speaking guide once received two bookings for the same date and entrusted one of them to me. That was the first tour I led on my own."
              ru: "Старший брат и наставник, работавший гидом по японскому языку, однажды получил два заказа на одну дату и доверил один из них мне. Тогда я впервые самостоятельно провёл экскурсию."
              uz: "Yapon tilida gid bo'lgan aka va ustoz bir kunga ikki buyurtma olib, bittasini menga ishonib topshirdi. O'shanda birinchi marta o'zim ekskursiya o'tkazdim."
            caption:
              en: "Soyibjon Isamatov, travel expert"
              ru: "Сойибжон Исаматов, эксперт по путешествиям"
              uz: "Soyibjon Isamatov, sayohat eksperti"
          - type: "dashTitle"
            description:
              en: "I have been working in tourism since 2018 — as a tour operator and a guide. I met the profession unexpectedly, and gradually tourism became my work."
              ru: "Я работаю в туризме с 2018 года — как туроператор и гид. Знакомство с профессией началось довольно неожиданно, но постепенно туризм стал моей профессией."
              uz: "2018 yildan turizmda ishlayman — turoperator va gid. Kasb bilan tanishuv kutilmaganda boshlandi, asta-sekin turizm kasbimga aylandi."
          - type: "dashTitle"
            title:
              en: "Education and training"
              ru: "Образование и подготовка"
              uz: "Ta'lim va tayyorgarlik"
            description:
              en: "I have a higher degree, completed professional guide courses and Japanese-language training, and upgraded my skills in the hotel business in Japan. I am fluent in Uzbek and speak Japanese at C1."
              ru: "Я получил высшее образование, окончил профессиональные курсы для гидов и программу подготовки по японскому языку, а также повышал квалификацию в сфере гостиничного бизнеса в Японии. Свободно говорю на узбекском, владею японским на уровне C1."
              uz: "Oliy ma'lumot, gidlar uchun kasbiy kurslar va yapon tili dasturi, Yaponiyada mehmonxona biznesi malakasini oshirdim. O'zbek tilida erkin, yapon — C1."
          - type: "dashTitle"
            title:
              en: "Approach"
              ru: "Подход"
              uz: "Yondashuv"
            description:
              en: "When building a route it is not enough to add famous sights — the trip should be comfortable and logical. I have worked as a guide and operator for years, and I keep learning on every new journey."
              ru: "При составлении маршрута мне важно не просто включить известные достопримечательности, а сделать поездку комфортной и логичной. Я много лет работаю гидом и туроператором, но в каждом новом путешествии продолжаю учиться сам."
              uz: "Marshrutda mashhur joylarni kiritishning o'zi yetarli emas — sayohat qulay va mantiqiy bo'lishi kerak. Ko'p yil gid va turoperatorman, har yangi sayohatda o'zim ham o'rganaman."
  - blockType: "timeline"
    tone: "tint"
    layout: "horizontal"
    indicatorType: "number"
    eyebrow:
      en: "What I do"
      ru: "Чем я занимаюсь"
      uz: "Nima bilan shug'ullanaman"
    title:
      en: "The whole process — from route to airport"
      ru: "Весь процесс — от маршрута до аэропорта"
      uz: "Butun jarayon — marshrutdan aeroportgacha"
    description:
      en: "I design routes, book hotels and services, arrange transport, meet guests, lead tours and control the quality of the program."
      ru: "Разрабатываю маршруты, бронирую отели и услуги, организую транспорт, встречаю гостей, провожу экскурсии и контролирую качество программы."
      uz: "Marshrut tuzaman, mehmonxona va xizmatlarni bron qilaman, transport tashkil qilaman, mehmonlarni kutib olaman, ekskursiya o'tkazaman va dastur sifatini nazorat qilaman."
    items:
      - title:
          en: "Before arrival"
          ru: "До приезда"
          uz: "Kelishdan oldin"
        description:
          en: "I explain the weather, suitable clothing, the airport meeting and other practical details."
          ru: "Подробно рассказываю о погоде, подходящей одежде, встрече в аэропорту и других практических деталях."
          uz: "Ob-havo, kiyim, aeroportda kutib olish va boshqa amaliy detallarni tushuntiraman."
      - title:
          en: "Route"
          ru: "Маршрут"
          uz: "Marshrut"
        description:
          en: "A logical program without exhausting transfers — not a list of famous sights."
          ru: "Логичная программа без утомительных переездов — а не список известных достопримечательностей."
          uz: "Charchatadigan ko'chishlarsiz mantiqiy dastur — mashhur joylar ro'yxati emas."
      - title:
          en: "Hotels and transport"
          ru: "Отели и транспорт"
          uz: "Mehmonxonalar va transport"
        description:
          en: "A good hotel in a convenient place, a reliable driver, restaurants with real Uzbek food."
          ru: "Качественный отель в удобном месте, надёжный водитель, рестораны с настоящей узбекской кухней."
          uz: "Qulay joyda yaxshi mehmonxona, ishonchli haydovchi, haqiqiy o'zbek oshxonasi."
      - title:
          en: "Meet and stay in touch"
          ru: "Встреча и связь"
          uz: "Kutib olish va aloqa"
        description:
          en: "I prefer to meet my guests at the airport in person. During the trip I stay constantly in touch."
          ru: "Своих гостей в аэропорту предпочитаю встречать лично. Во время поездки остаюсь постоянно на связи."
          uz: "Mehmonlarimni aeroportda shaxsan kutib olishni afzal ko'raman. Sayohat davomida doim aloqadaman."
    criteria:
      label:
        en: "Comfort in the details"
        ru: "Комфорт в деталях"
        uz: "Tafsilotlardagi qulaylik"
      title:
        en: "What it is made of"
        ru: "Из чего он складывается"
        uz: "Nimadan tuziladi"
      description:
        en: "For guests without an accompanying guide I arrange a local SIM card when possible, so they can always reach me."
        ru: "Для гостей без сопровождающего гида я по возможности организую местную SIM-карту, чтобы они всегда могли связаться со мной."
        uz: "Hamroh gidsiz mehmonlarga imkon bo'lsa mahalliy SIM beraman — menga doim bog'lana olsin."
      tags:
        - label:
            en: "No exhausting transfers"
            ru: "Без утомительных переездов"
            uz: "Charchatadigan ko'chishlarsiz"
        - label:
            en: "Hotel in a convenient place"
            ru: "Отель в удобном месте"
            uz: "Qulay joydagi mehmonxona"
        - label:
            en: "Reliable driver"
            ru: "Надёжный водитель"
            uz: "Ishonchli haydovchi"
        - label:
            en: "Real cuisine"
            ru: "Настоящая кухня"
            uz: "Haqiqiy oshxona"
        - label:
            en: "Quality control"
            ru: "Контроль качества"
            uz: "Sifat nazorati"
        - label:
            en: "Local SIM card"
            ru: "Местная SIM-карта"
            uz: "Mahalliy SIM-karta"
  - blockType: "regular"
    eyebrow:
      en: "Principle"
      ru: "Принцип"
      uz: "Tamoyil"
    title:
      en: "I treat the guest as a close friend"
      ru: "Отношусь к гостю как к близкому другу"
      uz: "Mehmonga yaqin do'stdek munosabatda bo'laman"
    rows:
      - left:
          - type: "quote"
            quoteVariant: "wide"
            quote:
              en: "My main professional principle is to earn the traveler's trust and live up to it. Long-term trust matters far more than a one-off gain."
              ru: "Мой главный профессиональный принцип — заслужить доверие путешественника и оправдать его. Долгосрочное доверие гораздо важнее разовой выгоды."
              uz: "Asosiy kasbiy tamoyilim — sayyohning ishonchini qozonish va oqlash. Uzoq muddatli ishonch bir martalik foydadan muhimroq."
            caption:
              en: "The main principle at work"
              ru: "Главный принцип в работе"
              uz: "Ishdagi asosiy tamoyil"
      - ratio: "3:2"
        left:
          - type: "dashTitle"
            title:
              en: "What matters at work"
              ru: "Что важно в работе"
              uz: "Ishda nima muhim"
            description:
              en: "I feel responsible for every detail of the trip, so I never recommend a program only to make a sale. If a service or route does not match the person's expectations, I say so directly and offer a better option."
              ru: "Я чувствую ответственность за каждую деталь поездки, поэтому никогда не стану рекомендовать программу только ради продажи. Если я понимаю, что услуга или маршрут не соответствуют ожиданиям человека, скажу об этом прямо и предложу более подходящий вариант."
              uz: "Sayohatning har bir detali uchun mas'ulman, shuning uchun dasturni faqat sotish uchun tavsiya qilmayman. Xizmat yoki marshrut kutganiga mos kelmasa, ochiq aytaman va mosroq variant taklif qilaman."
          - type: "dashTitle"
            description:
              en: "I like meeting different people, exchanging views and telling them about our culture, history and hospitality through travel."
              ru: "Мне нравится знакомиться с разными людьми, обмениваться взглядами и через путешествия рассказывать им о культуре, истории и гостеприимстве нашей страны."
              uz: "Turli odamlar bilan tanishish, fikr almashish va sayohat orqali madaniyat, tarix va mehmondo'stligimizni aytib berish yoqadi."
        right:
          - type: "dashTitle"
            title:
              en: "What result means to me"
              ru: "Что для меня результат"
              uz: "Men uchun natija"
            description:
              en: "A good result is when a person leaves not only with beautiful photos, but with memories of people, meetings and the atmosphere of Uzbekistan. I want everyone here to feel not like an ordinary tourist, but a truly valued guest."
              ru: "Хороший результат — когда человек уезжает не только с красивыми фотографиями, но и с воспоминаниями о людях, встречах и атмосфере Узбекистана. Я хочу, чтобы здесь каждый чувствовал себя не обычным туристом, а действительно дорогим гостем."
              uz: "Yaxshi natija — odam nafaqat chiroyli surat, balki odamlar, uchrashuvlar va O'zbekiston muhiti haqidagi xotiralar bilan ketishi. Bu yerda oddiy turist emas, qadrli mehmondek his qilsin."
          - type: "valuePoint"
            title:
              en: "A direct conversation"
              ru: "Прямой разговор"
              uz: "Ochiq suhbat"
            description:
              en: "If an option does not fit, I say so before booking."
              ru: "Если вариант не подходит, я скажу об этом до брони."
              uz: "Variant mos kelmasa, bron oldin aytaman."
          - type: "valuePoint"
            title:
              en: "Responsibility for details"
              ru: "Ответственность за детали"
              uz: "Tafsilotlar uchun mas'uliyat"
            description:
              en: "Every small part of the trip is on me, not on the contractor."
              ru: "Каждая мелочь поездки — на мне, а не на подрядчике."
              uz: "Sayohatning har bir mayda narsasi pudratchida emas, menda."
          - type: "valuePoint"
            title:
              en: "Long-term trust"
              ru: "Долгосрочное доверие"
              uz: "Uzoq muddatli ishonch"
            description:
              en: "More important than a one-off sale. Always."
              ru: "Важнее разовой продажи. Всегда."
              uz: "Bir martalik sotuvdan muhimroq. Har doim."
  - blockType: "regular"
    tone: "warm"
    eyebrow:
      en: "A story"
      ru: "История"
      uz: "Hikoya"
    title:
      en: "A night in Bukhara I still remember"
      ru: "Ночь в Бухаре, которую я помню до сих пор"
      uz: "Haliyam eslab turadigan Buxorodagi tun"
    rows:
      - left:
          - type: "quote"
            quoteVariant: "wide"
            quote:
              en: "You are a guest, and we do not take money from guests."
              ru: "Вы гость, а с гостей мы денег не берём."
              uz: "Siz mehmonsiz, mehmondan pul olmaymiz."
            caption:
              en: "The host of the house that took me in"
              ru: "Хозяйка дома, где меня приютили"
              uz: "Meni boshpana qilgan uyning sohibasi"
      - ratio: "3:2"
        left:
          - type: "dashTitle"
            description:
              en: "Once in high season after working with a group I was left without a booked place to sleep. Almost no rooms were free. A local woman noticed I was looking for lodging, learned the situation and invited me to her home."
              ru: "Однажды в высокий сезон после работы с группой я сам остался без забронированного места для ночлега. Свободных номеров практически не было. Местная женщина заметила, что я ищу жильё, узнала о ситуации и пригласила меня к себе домой."
              uz: "Yuqori mavsumda guruh bilan ishlagach, o'zim tungi joy bron qilmagan edim. Bo'sh xona deyarli yo'q edi. Mahalliy ayol uy qidirayotganimni ko'rib, vaziyatni bilib, uyiga taklif qildi."
          - type: "dashTitle"
            description:
              en: "I met her family, they fed me and kept me for two nights. When I tried to pay on leaving, the host refused. I still remember that phrase."
              ru: "Я познакомился с её семьёй, меня накормили и оставили у себя на две ночи. Когда при отъезде я попытался заплатить, хозяйка отказалась. Эту фразу я помню до сих пор."
              uz: "Oilasi bilan tanishdim, ovqatlantirishdi va ikki kecha qoldirishdi. Ketayotganda to'lamoqchi bo'lganimda sohiba rad etdi. Shu jumlani haliyam eslayman."
        right:
          - type: "dashTitle"
            title:
              en: "Why it matters"
              ru: "Почему это важно"
              uz: "Nima uchun muhim"
            description:
              en: "This is the Uzbekistan I want to show guests — not only famous squares and minarets, but the real life of people."
              ru: "Именно такой Узбекистан мне хочется показывать гостям — не только знаменитые площади и минареты, но и настоящую жизнь людей."
              uz: "Mehmonlarga shunday O'zbekistonni ko'rsatmoqchiman — nafaqat mashhur maydon va minoralar, balki odamlarning haqiqiy hayoti."
