        right:
          - type: "dashTitle"
            title:
              en: "How I work"
              ru: "Как я работаю"
              uz: "Qanday ishlayman"
            description:
              en: "If I understand that a service or route does not meet a person's expectations, I will say so directly and offer a more suitable option. For me, long-term trust is far more important than short-term gain." # Исправлен перевод
              ru: "Если я понимаю, что услуга или маршрут не соответствуют ожиданиям человека, скажу об этом прямо и предложу более подходящий вариант. Для меня долгосрочное доверие гораздо важнее разовой выгоды."
              uz: "Agar xizmat yoki marshrut odamning kutganlariga mos kelmasligini tushunsam, buni to'g'ridan-to'g'ri aytaman va mosroq variantni taklif qilaman. Men uchun uzoq muddatli ishonch bir martalik foydadan ancha muhimroq." # Исправлен перевод
  - blockType: "regular"
    eyebrow:
      en: "Principle"
      ru: "Принцип"
      uz: "Tamoyil"
    title:
      en: "Earn trust and live up to it" # Исправлен перевод (был русский)
      ru: "Заслужить доверие и оправдать его"
      uz: "Ishonchni qozonish va uni oqlash" # Исправлен перевод (был русский)
    rows:
      - ratio: "2:1"
        left:
          - type: "quote"
            quote:
              en: "You are a guest, and we don't take money from guests."
              ru: "Вы гость, а с гостей мы денег не берём."
              uz: "Siz mehmonsiz, mehmonlardan pul olmaymiz."
          - type: "dashTitle"
            title:
              en: "Main principle"
              ru: "Главный принцип"
              uz: "Asosiy tamoyil"
            description:
              en: "My main professional principle is to earn the traveler's trust and live up to it. I treat every guest like a close friend and feel responsible for every detail of their trip. That's why I would never recommend a program just for the sake of making a sale." # Исправлен перевод
              ru: "Мой главный профессиональный принцип — заслужить доверие путешественника и оправдать его. Я отношусь к каждому гостю как к близкому другу и чувствую ответственность за каждую деталь его поездки. Поэтому никогда не стану рекомендовать программу только ради продажи."
              uz: "Mening asosiy professional tamoyilim — sayoatchining ishonchini qozonish va uni oqlash. Men har bir mehmonga yaqin do'stdek munosabatda bo'laman va ularning sayohatidagi har bir detal uchun mas'uliyatni his qilaman. Shuning uchun hech qachon faqat sotish uchun dastur tavsiya qilmayman." # Исправлен перевод
        right:
          - type: "dashTitle"
            title:
              en: "What result means to me" # Исправлен перевод (был русский)
              ru: "Что для меня результат"
              uz: "Men uchun natija nima" # Исправлен перевод (был русский)
            description:
              en: "When a person leaves not only with beautiful photos, but also with memories of the people, encounters, and atmosphere of Uzbekistan. I want everyone here to feel not like an ordinary tourist, but like a truly valued guest." # Исправлен перевод
              ru: "Когда человек уезжает не только с красивыми фотографиями, но и с воспоминаниями о людях, встречах и атмосфере Узбекистана. Я хочу, чтобы здесь каждый чувствовал себя не обычным туристом, а действительно дорогим гостем."
              uz: "Odam nafaqat chiroyli fotosuratlar bilan, balki odamlar, uchrashuvlar va O'zbekiston atmosferasi haqidagi xotiralar bilan ketganda. Men bu yerda har kim o'zini oddiy sayyoh emas, balki haqiqatan ham qadrli mehmon sifatida his qilishini xohlayman." # Исправлен перевод
  - blockType: "regular"
    eyebrow:
      en: "Tips"
      ru: "Советы"
      uz: "Maslahatlar"
    title:
      en: "What I recommend to see" # Исправлен перевод (был русский)
      ru: "Что я рекомендую увидеть"
      uz: "Ko'rishni tavsiya qiladigan joylarim" # Исправлен перевод (был русский)
    description:
      en: "Bukhara holds a special place in my heart. It is connected to a story that perfectly captures the hospitality I want to show our travelers. Once during the high season, after working with a group, I found myself without a booked place to stay. There were practically no available rooms. A local woman noticed that I was looking for accommodation, learned about the situation, and invited me to her home. I met her family, was fed, and they let me stay for two nights. When I tried to pay upon leaving, the hostess refused, saying: 'You are a guest, and we don't take money from guests.' I remember this phrase to this day. In Bukhara, I would definitely recommend visiting a local home, meeting the hosts, and cooking a national dish together, then seeing the magnificent Kalyan Minaret. For those who want to discover the less known pages of our history, I also recommend Termez and its archaeological sites. And beyond Uzbekistan, I am particularly interested in routes to the gas crater in Turkmenistan." # Исправлен перевод
      ru: "Особое место в моём сердце занимает Бухара. С ней связана история, которая очень точно передаёт то гостеприимство, которое я хочу показать нашим путешественникам. Однажды в высокий сезон после работы с группой я сам остался без забронированного места для ночлега. Свободных номеров практически не было. Местная женщина заметила, что я ищу жильё, узнала о ситуации и пригласила меня к себе домой. Я познакомился с её семьёй, меня накормили и оставили у себя на две ночи. Когда при отъезде я попытался заплатить, хозяйка отказалась со словами: «Вы гость, а с гостей мы денег не берём». Эту фразу я помню до сих пор. В Бухаре я обязательно предложил бы побывать в местном доме, познакомиться с хозяевами и вместе приготовить национальное блюдо, а затем увидеть величественный минарет Калян. Тем, кто хочет открыть менее известные страницы нашей истории, я также рекомендую Термез и его археологические памятники. А за пределами Узбекистана мне особенно интересны маршруты к газовому кратеру в Туркменистане."
      uz: "Buxoro mening qalbimda alohida o'rin tutadi. U bilan men sayohatchilarimizga ko'rsatmoqchi bo'lgan mehmondo'stlikni juda aniq ifodalovchi hikoya bog'liq. Bir marta yuqori mavsumda guruh bilan ishlagandan so'ng, men o'zim tunash uchun bron qilingan joy qolmagan edim. Bo'sh xonalar deyarli yo'q edi. Mahalliy ayol men turar joy izlayotganimni payqab, vaziyatni bilib, meni uyiga taklif qildi. Men uning oilasi bilan tanishdim, meni ovqatlantirishdi va ikki kecha o'zlarida qoldirishdi. Ketishda pul to'lamoqchi bo'lganimda, uy bekasi: 'Siz mehmonsiz, mehmonlardan pul olmaymiz', deb rad etdi. Bu iborani hali ham eslayman. Buxoroda men mahalliy uyda bo'lishni, uy egalari bilan tanishishni va birgalikda milliy taom tayyorlashni, so'ngra ulug'vor Kalyan minorasini ko'rishni albatta taklif qilgan bo'lardim. Tariximizning kamroq mashhur sahifalarini kashf qilmoqchi bo'lganlar uchun Termiz va uning arxeologik yodgorliklarini ham tavsiya qilaman. O'zbekistondan tashqarida esa menga Turkmanistondagi gaz krateriga boradigan marshrutlar ayniqsa qiziq." # Исправлен перевод
