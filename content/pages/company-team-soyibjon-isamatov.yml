            title:
              en: "Soyibjon Isamatov"
              ru: "Сойибжон Исаматов"
              uz: "Soyibjon Isamatov"
        right:
          - type: "quote"
            quote:
              en: "I have been working in tourism since 2018 — as a tour operator and guide. My introduction to the profession started rather unexpectedly: my older brother and mentor, who worked as a Japanese-speaking guide, once received two bookings for the same date and entrusted one of them to me. That was when I first independently led a tour and realized how much I enjoyed this work. Gradually, tourism became my profession." # Исправлен перевод
              ru: "Я работаю в туризме с 2018 года — как туроператор и гид. Моё знакомство с профессией началось довольно неожиданно: мой старший брат и наставник, работавший гидом по японскому языку, однажды получил два заказа на одну дату и доверил один из них мне. Именно тогда я впервые самостоятельно провёл экскурсию и понял, насколько мне интересна эта работа. Постепенно туризм стал моей профессией."
              uz: "Men 2018 yildan beri turizmda — turoperator va gid sifatida ishlayman. Kasb bilan tanishishim ancha kutilmagan tarzda boshlandi: yapon tilidagi gid bo'lib ishlagan katta akam va ustozim bir kunga ikkita buyurtma olib, ulardan birini menga ishonib topshirdi. O'shanda men birinchi marta mustaqil ravishda ekskursiya o'tkazdim va bu ish menga naqadar qiziq ekanligini angladim. Asta-sekin turizm mening kasbimga aylandi." # Исправлен перевод
          - type: "dashTitle"
            title:
              en: "Role"
              ru: "Роль"
              uz: "Rol"
            description:
              en: "Travel Expert. Japanese Market — tour operator and guide. Fluent in Uzbek, Japanese at C1 level." # Исправлен перевод
              ru: "Эксперт по путешествиям. Японский рынок — туроператор и гид. Свободно говорю на узбекском, японский на уровне C1."
              uz: "Sayohat Eksperti. Yaponiya Bozori — turoperator va gid. O'zbek tilida erkin gaplashaman, yapon tili C1 darajasida." # Исправлен перевод
          - type: "dashTitle"
            title:
              en: "Approach"
              ru: "Подход"
              uz: "Yondashuv"
            description:
              en: "I treat every guest like a close friend and feel responsible for every detail of their trip. That's why I would never recommend a program just for the sake of making a sale." # Исправлен перевод
              ru: "Я отношусь к каждому гостю как к близкому другу и чувствую ответственность за каждую деталь его поездки. Поэтому никогда не стану рекомендовать программу только ради продажи."
              uz: "Men har bir mehmonga yaqin do'stdek munosabatda bo'laman va ularning sayohatidagi har bir detal uchun mas'uliyatni his qilaman. Shuning uchun hech qachon faqat sotish uchun dastur tavsiya qilmayman." # Исправлен перевод
      - left:
          - type: "dashTitle"
            title:
              en: "How I see the country"
              ru: "Как я смотрю на страну"
              uz: "Mamlakatga qanday qarayman"
            description:
              en: "This is the Uzbekistan I want to show guests — not just the famous squares and minarets, but the real life of the people. I have been working as a guide and tour operator for many years, but I continue to learn in every new journey. I enjoy meeting different people, exchanging perspectives, and through travel, telling them about the culture, history, and hospitality of our country." # Исправлен перевод
              ru: "Именно такой Узбекистан мне хочется показывать гостям — не только знаменитые площади и минареты, но и настоящую жизнь людей. Я много лет работаю гидом и туроператором, но в каждом новом путешествии продолжаю учиться сам. Мне нравится знакомиться с разными людьми, обмениваться взглядами и через путешествия рассказывать им о культуре, истории и гостеприимстве нашей страны."
              uz: "Aynan shunday O'zbekistonni mehmonlarga ko'rsatishni xohlayman — nafaqat mashhur maydonlar va minoralar, balki odamlarning haqiqiy hayotini. Men ko'p yillar davomida gid va turoperator bo'lib ishlayman, lekin har bir yangi sayohatda o'zim ham o'rganishda davom etaman. Menga turli odamlar bilan tanishish, fikr almashish va sayohatlar orqali ularga mamlakatimiz madaniyati, tarixi va mehmondo'stligi haqida gapirib berish yoqadi." # Исправлен перевод
  - blockType: "regular"
    eyebrow:
      en: "Work"
      ru: "Направления"
      uz: "Yo'nalishlar"
    title:
      en: "What I do"
      ru: "Чем я занимаюсь"
      uz: "Nima bilan shug'ullanaman"
    description:
      en: "Today, I am involved in the entire process of creating a trip: developing routes, booking hotels and other services, arranging transport, meeting guests, leading tours, and ensuring the quality of the program. When planning a route, it's important for me not just to include famous landmarks, but to make the trip comfortable and logical: avoid exhausting transfers, choose a quality hotel in a convenient location, find a reliable driver, and select restaurants where guests can experience authentic Uzbek cuisine and culture." # Исправлен перевод
      ru: "Сегодня я участвую во всём процессе создания путешествия: разрабатываю маршруты, бронирую отели и другие услуги, организую транспорт, встречаю гостей, провожу экскурсии и контролирую качество программы. При составлении маршрута мне важно не просто включить известные достопримечательности, а сделать поездку комфортной и логичной: избежать утомительных переездов, подобрать качественный отель в удобном месте, найти надёжного водителя и рестораны, где гости смогут познакомиться с настоящей узбекской кухней и культурой."
      uz: "Bugun men sayohat yaratishning butun jarayonida ishtirok etaman: marshrutlarni ishlab chiqish, mehmonxonalar va boshqa xizmatlarni bron qilish, transportni tashkil qilish, mehmonlarni kutib olish, ekskursiyalar o'tkazish va dastur sifatini nazorat qilish. Marshrutni tuzishda menga faqat mashhur diqqatga sazovor joylarni kiritish emas, balki sayohatni qulay va mantiqiy qilish muhim: charchatuvchi ko'chishlardan qochish, qulay joyda sifatli mehmonxonani tanlash, ishonchli haydovchi va mehmonlar haqiqiy o'zbek oshxonasi va madaniyati bilan tanishishlari mumkin bo'lgan restoranlarni topish." # Исправлен перевод
