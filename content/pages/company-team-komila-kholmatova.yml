          ru: "Чистота, комфорт, расположение, качество и разумное соотношение цены и уровня сервиса."
          uz: "Tozalik, qulaylik, joylashuv, sifat hamda narx va xizmat darajasining oqilona nisbati."
      - type: "destinationInsight"
        icon: "headset"
        title:
          en: "Care during the trip"
          ru: "Забота в поездке"
          uz: "Sayohatdagi g'amxo'rlik"
        description:
          en: "Route details, safety, contacts and staying in touch. When we meet — a light atmosphere, real conversation, good mood."
          ru: "Особенности маршрута, безопасность, контакты и связь. При встрече — лёгкая атмосфера, живое общение, хорошее настроение."
          uz: "Marshrut xususiyatlari, xavfsizlik, kontaktlar va aloqa. Uchrashuvda — yengil muhit, jonli muloqot, yaxshi kayfiyat."
  - blockType: "regular"
    eyebrow:
      en: "Background"
      ru: "Опыт"
      uz: "Tajriba"
    title:
      en: "What goes into organizing a trip"
      ru: "Что стоит за организацией поездки"
      uz: "Sayohatni tashkil qilish ortida nima turibdi"
    description:
      en: "After university I chose to grow in tourism and joined TourLink. Today I work mainly with travellers and partners from English-speaking countries. I like thinking through the details in advance: a well-organised trip should be interesting, comfortable and safe."
      ru: "После университета решила развиваться в туризме и присоединилась к TourLink. Сегодня работаю преимущественно с путешественниками и партнёрами из англоязычных стран. Мне нравится заранее продумывать детали: хорошо организованная поездка должна быть интересной, комфортной и безопасной."
      uz: "Universitetdan keyin turizmda rivojlanishga qaror qildim va TourLink jamoasiga qo'shildim. Bugun asosan ingliz tilida so'zlashuvchi mamlakatlardan kelgan sayohatchilar va hamkorlar bilan ishlayman. Tafsilotlarni oldindan o'ylab chiqish menga yoqadi: yaxshi tashkil etilgan sayohat qiziqarli, qulay va xavfsiz bo'lishi kerak."
