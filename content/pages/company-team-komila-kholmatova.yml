  - blockType: "regular"
    eyebrow:
      en: "About"
      ru: "О сотруднике"
      uz: "Xodim haqida"
    rows:
      - ratio: "1:2"
        left:
          - type: "portrait"
            image: "assets/images/people.jpg"
            title:
              en: "Komila Kholmatova"
              ru: "Комила Холматова"
              uz: "Komila Xolmatova"
        right:
          - type: "quote"
            quote:
              en: "I have long been drawn to working with people from different countries, learning about their culture and at the same time opening Uzbekistan to them."
              ru: "Меня давно привлекала возможность работать с людьми из разных стран, общаться с ними, узнавать больше об их культуре и одновременно открывать для них Узбекистан."
              uz: "Turli mamlakatlardan odamlar bilan ishlash, madaniyatini bilish va ayni paytda ularga O'zbekistonni ochish meni uzoqdan o'ziga tortgan."
            caption:
              en: "Komila Kholmatova, travel expert"
              ru: "Комила Холматова, эксперт по путешествиям"
              uz: "Komila Xolmatova, sayohat eksperti"
          - type: "dashTitle"
            description:
              en: "I entered tourism in June 2026. After university I chose this field and joined the TourLink team."
              ru: "Я пришла в туризм в июне 2026 года. Поэтому после окончания университета я решила развиваться именно в туристической сфере и присоединилась к команде TourLink."
              uz: "Turizmga 2026 yil iyunda keldim. Universitetdan keyin shu sohada rivojlanib, TourLink jamoasiga qo'shildim."
          - type: "dashTitle"
            title:
              en: "Education and languages"
              ru: "Образование и языки"
              uz: "Ta'lim va tillar"
            description:
              en: "In 2024 I graduated from Uzbekistan State World Languages University in English. I am fluent in English and also speak Russian and Turkish. Today I work mainly with travelers and partners from English-speaking countries."
              ru: "В 2024 году я окончила Узбекский государственный университет мировых языков по направлению английского языка. Свободно владею английским, также говорю на русском и турецком языках. Сегодня я работаю преимущественно с путешественниками и партнёрами из англоязычных стран."
              uz: "2024 yilda O'zbekiston davlat jahon tillari universitetini ingliz tili yo'nalishi bo'yicha tamomladim. Ingliz tilida erkin, rus va turk tillarida ham gaplashaman. Bugun asosan ingliz tilidagi mamlakatlardan kelgan sayyoh va hamkorlar bilan ishlayman."
          - type: "dashTitle"
            title:
              en: "Approach"
              ru: "Подход"
              uz: "Yondashuv"
            description:
              en: "A trip begins with the person. First I try to understand their interests, budget, dates and purpose — and only then I propose a suitable route."
              ru: "В моей работе путешествие начинается с человека. Сначала я стараюсь понять его интересы, бюджет, даты и цель поездки, а уже после этого предлагаю подходящий маршрут."
              uz: "Sayohat odamdan boshlanadi. Avval qiziqish, byudjet, sanalar va maqsadni tushunaman — keyin mos marshrut taklif qilaman."
  - blockType: "timeline"
    tone: "tint"
    layout: "horizontal"
    indicatorType: "number"
    eyebrow:
      en: "What I do"
      ru: "Чем я занимаюсь"
      uz: "Nima bilan shug'ullanaman"
    title:
      en: "From the first email to the last day"
      ru: "От первого письма до последнего дня"
      uz: "Birinchi xatdan oxirgi kungacha"
    description:
      en: "I like thinking through details in advance. A well-organized trip should be interesting, comfortable and safe at once."
      ru: "Мне нравится заранее продумывать детали. Хорошо организованная поездка для меня должна быть одновременно интересной, комфортной и безопасной."
      uz: "Tafsilotlarni oldindan o'ylash yoqadi. Yaxshi tashkil etilgan sayohat qiziqarli, qulay va xavfsiz bo'lishi kerak."
    items:
      - title:
          en: "Getting acquainted"
          ru: "Знакомство"
          uz: "Tanishuv"
        description:
          en: "Interests, budget, dates and purpose. Only after that I propose a suitable route."
          ru: "Интересы, бюджет, даты и цель поездки. Только после этого я предлагаю подходящий маршрут."
          uz: "Qiziqish, byudjet, sanalar va maqsad. Shundan keyin mos marshrut taklif qilaman."
      - title:
          en: "Program and quote"
          ru: "Программа и расчёт"
          uz: "Dastur va hisob"
        description:
          en: "Tour programs, calculations and service bookings."
          ru: "Составление туристических программ, расчёты и бронирование услуг."
          uz: "Tur dasturlari, hisob-kitob va xizmat bronlari."
      - title:
          en: "Transport and meet-and-greet"
          ru: "Транспорт и встречи"
          uz: "Transport va kutib olish"
        description:
          en: "Transport, meeting guests and seeing them off."
          ru: "Организация транспорта, встреча и проводы гостей."
          uz: "Transport, mehmonlarni kutib olish va kuzatib qo'yish."
      - title:
          en: "Care during the trip"
          ru: "Забота в поездке"
          uz: "Sayohatda g'amxo'rlik"
        description:
          en: "Route and transport details, safety rules, necessary contacts — and I stay in touch."
          ru: "Особенности маршрута и транспорта, правила безопасности, необходимые контакты — и я остаюсь на связи."
          uz: "Marshrut va transport, xavfsizlik qoidalari, kerakli kontaktlar — va aloqada qolaman."
    criteria:
      label:
        en: "Hotels and restaurants"
        ru: "Выбор отелей и ресторанов"
        uz: "Mehmonxona va restoran tanlash"
      title:
        en: "Five criteria I look at"
        ru: "Пять критериев, по которым я смотрю"
        uz: "Qarayman besh mezoni"
      description:
        en: "When choosing hotels and restaurants I look at cleanliness, comfort, location, quality and a reasonable balance of price and service."
        ru: "При выборе отелей и ресторанов обращаю внимание на чистоту, комфорт, расположение, качество и разумное соотношение цены и уровня сервиса."
        uz: "Mehmonxona va restoranda tozalik, qulaylik, joylashuv, sifat va narx-servis nisbatiga qarabman."
      tags:
        - label:
            en: "Cleanliness"
            ru: "Чистота"
            uz: "Tozalik"
        - label:
            en: "Comfort"
            ru: "Комфорт"
            uz: "Qulaylik"
        - label:
            en: "Location"
            ru: "Расположение"
            uz: "Joylashuv"
        - label:
            en: "Quality"
            ru: "Качество"
            uz: "Sifat"
        - label:
            en: "Price and service"
            ru: "Цена и уровень сервиса"
            uz: "Narx va servis"
  - blockType: "regular"
    eyebrow:
      en: "Principle"
      ru: "Принцип"
      uz: "Tamoyil"
    title:
      en: "What stands behind every recommendation"
      ru: "Что стоит за каждой рекомендацией"
      uz: "Har bir tavsiya ortida nima turadi"
    rows:
      - left:
          - type: "quote"
            quoteVariant: "wide"
            quote:
              en: "I would never recommend unsafe transport or an option that clearly does not match the traveler's interests and budget."
              ru: "Я никогда не стала бы рекомендовать небезопасный транспорт или вариант, который явно не соответствует интересам и бюджету путешественника."
              uz: "Xavfli transport yoki sayyohning qiziqishi va byudjetiga mos kelmaydigan variantni tavsiya qilmayman."
            caption:
              en: "The main principle at work"
              ru: "Главный принцип в работе"
              uz: "Ishdagi asosiy tamoyil"
      - ratio: "3:2"
        left:
          - type: "dashTitle"
            title:
              en: "If something changes"
              ru: "Если что-то меняется"
              uz: "Biror narsa o'zgarsa"
            description:
              en: "If changes arise during the trip, I first find the reason, warn the guest in time and offer the most convenient alternative."
              ru: "Если во время путешествия возникают изменения, я стараюсь сначала разобраться в причине, своевременно предупредить гостя и предложить наиболее удобную альтернативу."
              uz: "Sayohatda o'zgarish bo'lsa, avval sababini tushunaman, mehmonni o'z vaqtida ogohlantiraman va qulay muqobil taklif qilaman."
          - type: "dashTitle"
            description:
              en: "It matters that guests feel they are truly looked after. I explain the route and transport, safety rules, share contacts and stay in touch. In person I want a light, friendly atmosphere — live conversation, a good mood, sometimes even jokes and stories."
              ru: "Особенно важно, чтобы во время поездки гости чувствовали, что о них действительно заботятся. Я объясняю особенности маршрута и транспорта, правила безопасности, предоставляю необходимые контакты и остаюсь на связи. А при личной встрече мне хочется создать лёгкую и доброжелательную атмосферу — с живым общением, хорошим настроением и иногда даже с шутками и забавными историями."
              uz: "Mehmonlar haqiqatan g'amxo'rlik qilinayotganini his qilsin. Marshrut, transport, xavfsizlik va kontaktlarni tushuntiraman, aloqada qolaman. Uchashuvda yengil, do'stona muhit — jonli suhbat, kayfiyat, ba'zan hazil va hikoyalar."
        right:
          - type: "dashTitle"
            title:
              en: "What result means to me"
              ru: "Что для меня результат"
              uz: "Men uchun natija"
            description:
              en: "I want guests to go home not only satisfied with the service, but happy, inspired and willing to come back to Uzbekistan one day."
              ru: "Мне хочется, чтобы после путешествия гости возвращались домой не просто довольными услугами, а счастливыми, вдохновлёнными и с желанием однажды снова приехать в Узбекистан."
              uz: "Mehmonlar uyga nafaqat xizmatdan mamnun, balki baxtli, ilhomlangan va O'zbekistonga yana kelish istagi bilan qaytishini xohlayman."
          - type: "valuePoint"
            title:
              en: "Responsibility"
              ru: "Ответственность"
              uz: "Mas'uliyat"
            description:
              en: "Checked transport, hotels and contractors."
              ru: "Проверенный транспорт, отели и подрядчики."
              uz: "Tekshirilgan transport, mehmonxona va pudratchilar."
          - type: "valuePoint"
            title:
              en: "Sincerity"
              ru: "Искренность"
              uz: "Samimiylik"
            description:
              en: "Honest about what fits the guest and what does not."
              ru: "Честно о том, что подходит гостю, а что нет."
              uz: "Mehmonga nima mos, nima yo'q — ochiq aytaman."
          - type: "valuePoint"
            title:
              en: "Hospitality"
              ru: "Гостеприимство"
              uz: "Mehmondo'stlik"
            description:
              en: "A light atmosphere, live conversation, a good mood."
              ru: "Лёгкая атмосфера, живое общение, хорошее настроение."
              uz: "Yengil muhit, jonli suhbat, yaxshi kayfiyat."
