    description:
      en: "Komila Kholmatova works with English-language route enquiries at TourLink, keeping practical trip details visible while each proposal takes shape.\n\nShe helps travellers and partners move from an initial question to a clear, confirmable programme."
      ru: "Комила Холматова работает с англоязычными маршрутными запросами в TourLink, удерживая практические детали поездки на виду, пока формируется каждое предложение.\n\nОна помогает путешественникам и партнёрам перейти от первого вопроса к понятной, подтверждаемой программе."
      uz: "Komila Xolmatova TourLinkda ingliz tilidagi marshrut so'rovlari bilan ishlaydi, har bir taklif shakllanayotganda sayohatning amaliy tafsilotlarini ko'z oldida tutadi.\n\nU sayohatchilar va hamkorlarga dastlabki savoldan aniq, tasdiqlanadigan dasturga o'tishga yordam beradi."
