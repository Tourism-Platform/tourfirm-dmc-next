            description:
              en: "Understand the person first — interests, budget, dates, purpose of the trip — and only then suggest a route. I think through the details in advance so the trip is interesting, comfortable and safe."
              ru: "Сначала понять человека — интересы, бюджет, даты, цель поездки — и только потом предлагать маршрут. Детали продумываю заранее, чтобы поездка была интересной, комфортной и безопасной."
              uz: "Avval odamni tushunish — qiziqishlar, byudjet, sanalar, sayohat maqsadi — keyin marshrut taklif qilish. Tafsilotlarni oldindan o'ylab chiqaman, sayohat qiziqarli, qulay va xavfsiz bo'lishi uchun."
  - blockType: "regular"
    eyebrow:
      en: "Principle"
      ru: "Принцип"
      uz: "Tamoyil"
    title:
      en: "Responsibility and hospitality"
      ru: "Ответственность и гостеприимство"
      uz: "Mas'uliyat va mehmondo'stlik"
    rows:
      - ratio: "2:1"
        left:
          - type: "quote"
            quote:
              en: "I would never recommend unsafe transport or an option that clearly does not match the traveller's interests and budget."
              ru: "Я никогда не стала бы рекомендовать небезопасный транспорт или вариант, который явно не соответствует интересам и бюджету путешественника."
              uz: "Hech qachon xavfsiz bo'lmagan transportni yoki sayohatchining qiziqishlari va byudjetiga aniq mos kelmaydigan variantni tavsiya qilmagan bo'lardim."
          - type: "dashTitle"
            title:
              en: "Main principle"
              ru: "Главный принцип"
              uz: "Asosiy tamoyil"
            description:
              en: "In my work, responsibility, sincerity and hospitality matter most. During the trip, guests should feel that they are genuinely looked after."
              ru: "В работе для меня особенно важны ответственность, искренность и гостеприимство. Во время поездки гости должны чувствовать, что о них действительно заботятся."
              uz: "Ishda men uchun mas'uliyat, samimiylik va mehmondo'stlik ayniqsa muhim. Sayohat davomida mehmonlar haqiqatan g'amxo'rlik qilinayotganini his qilishlari kerak."
        right:
          - type: "dashTitle"
            title:
              en: "What result means to me"
              ru: "Что для меня результат"
              uz: "Men uchun natija nima"
            description:
              en: "I want guests to go home not just satisfied with the service, but happy, inspired and wanting to come back to Uzbekistan one day."
              ru: "Хочу, чтобы гости возвращались домой не просто довольными услугами, а счастливыми, вдохновлёнными и с желанием однажды снова приехать в Узбекистан."
              uz: "Mehmonlar uyga nafaqat xizmatdan mamnun, balki baxtli, ilhomlangan va bir kun O'zbekistonga qaytib kelish istagi bilan qaytishlarini xohlayman."
  - blockType: "regular"
    eyebrow:
      en: "Tips"
      ru: "Советы"
      uz: "Maslahatlar"
    title:
      en: "What I recommend to see"
      ru: "Что я рекомендую увидеть"
      uz: "Ko'rishni tavsiya qiladigan joylarim"
    description:
      en: "One of my favourite places is Sangardak Waterfall in Surkhandarya: nature, atmosphere and a chance to combine scenery with active rest. Warm family memories are tied to this place — once we arrived with a large group of relatives, split into teams and spent the whole day playing together. For guests I would show the waterfall itself, the surrounding nature and the cable car — especially for those who like a bit of adrenaline. For a less-known Uzbekistan I also recommend the Fergana Valley. I always complement getting to know the country with food — plov, samsa and other national dishes — and with living impressions: watching traditional bread being made, meeting crafts and local people."
      ru: "Одно из любимых мест — Сангардакский водопад в Сурхандарье: природа, атмосфера и возможность совместить пейзаж с активным отдыхом. С этим местом связаны тёплые семейные воспоминания — однажды мы приехали большой компанией родственников, разделились на команды и весь день играли вместе. Гостям я бы показала сам водопад, окружающую природу и канатную дорогу — особенно тем, кто любит немного адреналина. Тем, кто хочет менее известный Узбекистан, советую Ферганскую долину. Знакомство со страной обязательно дополняю кухней — пловом, самсой и другими национальными блюдами — и живыми впечатлениями: приготовление традиционного хлеба, ремёсла, встречи с местными жителями."
      uz: "Sevimli joylarimdan biri — Surxondaryodagi Sangardak sharsharasi: tabiat, muhit va manzarani faol dam olish bilan birlashtirish imkoniyati. Bu joy bilan iliqlik oilaviy xotiralar bog'liq — bir kuni katta qarindoshlar guruhi bilan kelib, jamoalarga bo'linib, butun kun o'ynadik. Mehmonlarga o'zim sharsharani, atrof tabiatini va kanat yo'lini ko'rsatgan bo'lardim — ayniqsa biroz adrenalinnni yaxshi ko'radiganlarga. Kamroq taniqli O'zbekistonni ko'rmoqchi bo'lganlarga Farg'ona vodiysini maslahat beraman. Mamlakat bilan tanishuvni albatta oshxona bilan to'ldiraman — palov, somsa va boshqa milliy taomlar — hamda jonli taassurotlar: an'anaviy non pishirish, hunarmandchilik, mahalliy aholi bilan uchrashuvlar."
    gridClassName: "sm:grid-cols-2"
    cards:
