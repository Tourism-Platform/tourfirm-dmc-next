            title:
              en: "Komila Kholmatova"
              ru: "Комила Холматова"
              uz: "Komila Xolmatova"
        right:
          - type: "quote"
            quote:
              en: "I joined tourism in June 2026. I had long been drawn to working with people from different countries, talking with them, learning more about their culture, and at the same time opening Uzbekistan for them."
              ru: "Я пришла в туризм в июне 2026 года. Меня давно привлекала возможность работать с людьми из разных стран, общаться с ними, узнавать больше об их культуре и одновременно открывать для них Узбекистан."
              uz: "Turizmga 2026 yil iyunida keldim. Meni uzoq vaqtdan beri turli mamlakatlardan kelgan odamlar bilan ishlash, ular bilan muloqot qilish, madaniyatlarini chuqurroq bilish va shu bilan birga ularga O'zbekistonni ochib berish imkoniyati jalb qilgan."
          - type: "dashTitle"
            title:
              en: "Role"
              ru: "Роль"
              uz: "Rol"
            description:
              en: "Travel Expert. English-speaking markets. Graduated from Uzbekistan State World Languages University in English in 2024. Speaks English fluently, also Russian and Turkish."
              ru: "Эксперт по путешествиям. Англоязычные рынки. В 2024 году окончила Узбекский государственный университет мировых языков по направлению английского языка. Свободно владеет английским, говорит на русском и турецком."
              uz: "Sayohat Eksperti. Ingliz tilidagi bozorlar. 2024 yilda O'zbekiston davlat jahon tillari universitetini ingliz tili yo'nalishi bo'yicha tamomlagan. Ingliz tilida erkin gaplashadi, rus va turk tillarini ham biladi."
          - type: "dashTitle"
            title:
              en: "Approach"
              ru: "Подход"
              uz: "Yondashuv"
            description:
              en: "A trip starts with the person: interests, budget, dates and purpose first — and only then the itinerary. If something changes during the trip, I look into the reason, warn the guest and offer a convenient alternative."
              ru: "Путешествие начинается с человека: сначала интересы, бюджет, даты и цель поездки — и только потом маршрут. Если во время поездки что-то меняется, разбираюсь в причине, предупреждаю гостя и предлагаю удобную альтернативу."
              uz: "Sayohat odamdan boshlanadi: avval qiziqishlar, byudjet, sanalar va maqsad — keyin marshrut. Sayohat davomida nimadir o'zgarsa, sababini aniqlayman, mehmonni ogohlantiraman va qulay muqobil taklif qilaman."
      - left:
          - type: "dashTitle"
            title:
              en: "How I see the country"
              ru: "Как я смотрю на страну"
              uz: "Mamlakatga qanday qarayman"
            description:
              en: "I am drawn to nature, people, history, culture and everyday life. I complement getting to know the country with local food, crafts and real meetings with residents — not only the main routes."
              ru: "Мне интересны природа, люди, история, культура и повседневная жизнь. Знакомство со страной я дополняю местной кухней, ремёслами и живыми встречами с жителями — не только главными маршрутами."
              uz: "Menga tabiat, odamlar, tarix, madaniyat va kundalik hayot qiziq. Mamlakat bilan tanishuvni mahalliy oshxona, hunarmandchilik va aholi bilan jonli uchrashuvlar bilan to'ldiraman — faqat asosiy marshrutlar bilan emas."
  - blockType: "regular"
    eyebrow:
      en: "Work"
      ru: "Направления"
      uz: "Yo'nalishlar"
    title:
      en: "What I do"
      ru: "Чем я занимаюсь"
      uz: "Nima bilan shug'ullanaman"
    description:
      en: "I put together tour programmes, calculate costs, book services, arrange transport, arrivals and departures. When choosing hotels and restaurants I look at cleanliness, comfort, location, quality and a fair balance of price and service. During the trip I explain the route and transport, safety rules, share contacts and stay in touch. When we meet in person I want a light, friendly atmosphere — with real conversation and sometimes jokes and stories."
      ru: "Составляю туристические программы, считаю стоимость, бронирую услуги, организую транспорт, встречи и проводы. При выборе отелей и ресторанов смотрю на чистоту, комфорт, расположение, качество и разумное соотношение цены и сервиса. Во время поездки объясняю маршрут и транспорт, правила безопасности, даю контакты и остаюсь на связи. При личной встрече хочу лёгкую и доброжелательную атмосферу — с живым общением и иногда с шутками и историями."
      uz: "Turistik dasturlar tuzaman, narxni hisoblayman, xizmatlarni bron qilaman, transport, kutib olish va kuzatib qo'yishni tashkil qilaman. Mehmonxona va restoranlarni tanlashda tozalik, qulaylik, joylashuv, sifat hamda narx va xizmatning oqilona nisbatiga qarayman. Sayohat davomida marshrut va transportni, xavfsizlik qoidalarini tushuntiraman, kontaktlar beraman va aloqada qolaman. Shaxsiy uchrashuvda yengil va mehribon muhit istayman — jonli muloqot, ba'zan hazil va hikoyalar bilan."
    gridClassName: "sm:grid-cols-2"
    cards:
