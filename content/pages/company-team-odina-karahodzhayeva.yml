    description:
      en: "I handle individual and group tours, cultural, gastronomic, and active programs, MICE and VIP trips, hotel bookings, transport, logistics, and guest support. For me, it's important to first understand the person: their interests, preferences, budget, and idea of comfort, and only then create the travel program." # Исправлен перевод
      ru: "Я занимаюсь индивидуальными и групповыми турами, культурными, гастрономическими и активными программами, MICE и VIP-поездками, бронированием отелей, транспортом, логистикой и сопровождением гостей. Для меня важно сначала понять самого человека: его интересы, пожелания, бюджет и представление о комфорте, а уже затем создавать программу путешествия."
      uz: "Men individual va guruhli turlar, madaniy, gastronomik va faol dasturlar, MICE va VIP sayohatlar, mehmonxonalarni bron qilish, transport, logistika va mehmonlarga hamrohlik qilish bilan shug'ullanaman. Men uchun avval odamni tushunish muhim: uning qiziqishlari, istaklari, byudjeti va qulaylik haqidagi tasavvuri, shundan keyingina sayohat dasturini yaratish." # Исправлен перевод
