              ru: "Mehmon — otangday ulug'"
              uz: "Mehmon — otangday ulug'"
  - blockType: "regular"
    eyebrow:
      en: "Tips"
      ru: "Советы"
      uz: "Maslahatlar"
    title:
      en: "What I recommend to see" # Исправлен перевод (был русский)
      ru: "Что я рекомендую увидеть"
      uz: "Ko'rishni tavsiya qiladigan joylarim" # Исправлен перевод (был русский)
    description:
      en: "In Uzbekistan, it's hard for me to choose just one favorite place — every city and every region is beautiful in its own way. But for those who want to see something less known, I recommend paying attention to Shahimardan. And getting to know our country is impossible without Uzbek cuisine — above all, plov and samsa. I want guests to see not only the famous landmarks, but also to feel the country's atmosphere, its people, traditions, and genuine hospitality." # Исправлен перевод
      ru: "В Узбекистане мне сложно выбрать только одно любимое место — каждый город и каждый регион красив по-своему. Но тем, кто хочет увидеть что-то менее известное, я советую обратить внимание на Шахимардан. А знакомство с нашей страной невозможно представить без узбекской кухни — прежде всего плова и самсы. Мне хочется, чтобы гости увидели не только знаменитые достопримечательности, но и почувствовали атмосферу страны, её людей, традиции и настоящее гостеприимство."
      uz: "O'zbekistonda faqat bitta sevimli joyni tanlash menga qiyin — har bir shahar va har bir mintaqa o'ziga xos tarzda go'zal. Ammo kamroq mashhur narsalarni ko'rmoqchi bo'lganlarga Shahimardonga e'tibor berishni maslahat beraman. Mamlakatimiz bilan tanishishni o'zbek oshxonasisiz, birinchi navbatda plov va samsasiz tasavvur qilib bo'lmaydi. Men mehmonlar nafaqat mashhur diqqatga sazovor joylarni ko'rishlarini, balki mamlakat atmosferasini, uning odamlarini, an'analarini va haqiqiy mehmondo'stlikni his qilishlarini xohlayman." # Исправлен перевод
