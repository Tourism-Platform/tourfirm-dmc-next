            description:
              en: "Even after the tour ends, I find it hard to say goodbye to guests — I continue to stay in touch with many of them." # Исправлен перевод
              ru: "Даже после окончания тура бывает трудно прощаться с гостями — со многими из них я продолжаю поддерживать связь."
