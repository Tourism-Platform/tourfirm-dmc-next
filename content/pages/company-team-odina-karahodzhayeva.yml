              uz: "Rostgo'ylik"
            description:
              en: "Comfort, safety, attention to detail, and care for people always come first. Even after the tour, it's hard to say goodbye — I continue to stay in touch with many guests." # Исправлен перевод
              ru: "Комфорт, безопасность, внимание к деталям и забота о человеке всегда остаются на первом месте. Даже после тура бывает трудно прощаться — со многими гостями я продолжаю поддерживать связь."
              uz: "Qulaylik, xavfsizlik, detallarga e'tibor va odamga g'amxo'rlik har doim birinchi o'rinda turadi. Turdan keyin ham xayrlashish qiyin — ko'plab mehmonlar bilan aloqani davom ettiraman." # Исправлен перевод
        right:
