      uz: "Sayohatni tashkil qilish ortida nima turibdi" # Исправлен перевод (был русский)
    description:
      en: "I have a higher education degree in Accounting and Auditing, as well as additional professional training in Transport and Logistics. I hold a freight forwarding certificate and have practical experience working with transport and logistics processes. A significant part of my professional experience is related to organizing events and celebrations — which is why I am skilled at coordinating a large number of details, working with various contractors, and creating comfortable conditions for large groups. Today, this experience helps me approach the organization of travel, events, and complex tour programs with particular care." # Исправлен перевод
      ru: "У меня высшее образование в области бухгалтерского учёта и аудита, а также дополнительная профессиональная подготовка в сфере транспорта и логистики. Я имею сертификат экспедитора и практический опыт работы с транспортными и логистическими процессами. Значительная часть моего профессионального опыта связана с организацией мероприятий и торжеств — поэтому я хорошо умею координировать большое количество деталей, работать с разными подрядчиками и создавать комфортные условия для большого числа гостей. Сегодня этот опыт помогает мне особенно внимательно подходить к организации путешествий, мероприятий и сложных туристических программ."
      uz: "Men Buxgalteriya hisobi va audit sohasida oliy ma'lumotga ega bo'lib, shuningdek, Transport va logistika sohasida qo'shimcha kasbiy tayyorgarlikdan o'tganman. Menda ekspeditor sertifikati va transport va logistika jarayonlari bilan ishlash bo'yicha amaliy tajriba mavjud. Kasbiy tajribamning muhim qismi tadbirlar va bayramlarni tashkil qilish bilan bog'liq — shuning uchun men ko'plab detallarni muvofiqlashtirish, turli pudratchilar bilan ishlash va ko'p sonli mehmonlar uchun qulay sharoitlar yaratishni yaxshi bilaman. Bugun bu tajriba menga sayohatlar, tadbirlar va murakkab turistik dasturlarni tashkil qilishga ayniqsa ehtiyotkorlik bilan yondashishga yordam bermoqda." # Исправлен перевод
