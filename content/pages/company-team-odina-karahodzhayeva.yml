          - type: "quote"
            quote:
              en: "If after traveling through Uzbekistan you want to come back here again, it means we did our job right. I want to create trips that stay in memory for a long time and after which Uzbekistan becomes a place you want to return to again and again." # Исправлен перевод
              ru: "Если после путешествия по Узбекистану вам захочется вернуться сюда ещё раз, значит, мы сделали свою работу правильно. Я хочу создавать поездки, которые остаются в памяти надолго и после которых Узбекистан становится местом, куда хочется возвращаться снова и снова."
              uz: "Agar O'zbekiston bo'ylab sayohatdan keyin yana bu yerga qaytib kelishni xohlasangiz, demak biz o'z ishimizni to'g'ri qilganmiz. Men uzoq vaqt xotirada qoladigan va undan keyin O'zbekiston qayta-qayta qaytib kelishni xohlaydigan joyga aylanadigan sayohatlarni yaratmoqchiman." # Исправлен перевод
        right:
          - type: "dashTitle"
