              uz: "Avval odamni tushunish: qiziqishlar, istaklar, byudjet va qulaylik haqidagi tasavvur — va shundan keyingina dasturni yig'ish. Hatto murakkab so'rovlar va kutilmagan o'zgarishlar uchun ham." # Исправлен перевод
  - blockType: "regular"
    eyebrow:
      en: "Principle"
      ru: "Принцип"
      uz: "Tamoyil"
    title:
      en: "Guests, not just tourists" # Исправлен перевод (был русский)
      ru: "Гости, а не просто туристы"
      uz: "Mehmonlar, nafaqat sayyohlar" # Исправлен перевод (был русский)
    description:
      en: "The main principle of my work is honesty. For me, travelers are not just tourists — they are first and foremost our guests. I relate to the Uzbek saying: 'Mehmon — otangday ulug‘' (A guest is as great as your father). That is why comfort, safety, attention to detail, and care for people always come first for me. Even after the tour ends, I find it hard to say goodbye to guests, and I continue to stay in touch with many of them." # Исправлен перевод
      ru: "Главный принцип моей работы — честность. Для меня путешественники — не просто туристы, а прежде всего наши гости. Мне близка узбекская фраза: «Mehmon — otangday ulug‘». Именно поэтому комфорт, безопасность, внимание к деталям и забота о человеке для меня всегда остаются на первом месте. Даже после окончания тура мне бывает трудно прощаться с гостями, и со многими из них я продолжаю поддерживать связь."
      uz: "Ishimning asosiy tamoyili — rostgo'ylik. Men uchun sayohatchilar shunchaki sayyohlar emas — ular birinchi navbatda bizning mehmonlarimiz. Menga o'zbekcha ibora yaqin: «Mehmon — otangday ulug'». Aynan shuning uchun qulaylik, xavfsizlik, detallarga e'tibor va odamga g'amxo'rlik men uchun har doim birinchi o'rinda turadi. Tur tugaganidan keyin ham mehmonlar bilan xayrlashish menga qiyin bo'ladi va ularning ko'plari bilan aloqani davom ettiraman." # Исправлен перевод
    rows:
      - ratio: "2:1"
