          uz: "Mamlakatimiz bilan tanishishni o'zbek oshxonasisiz, birinchi navbatda plov va samsasiz tasavvur qilib bo'lmaydi." # Исправлен перевод
  - blockType: "regular"
    eyebrow:
      en: "After the trip"
      ru: "После поездки"
      uz: "Sayohatdan keyin"
    title:
      en: "To make you want to come back" # Исправлен перевод (был русский)
      ru: "Чтобы захотелось вернуться"
      uz: "Qaytib kelishni xohlashingiz uchun" # Исправлен перевод (был русский)
