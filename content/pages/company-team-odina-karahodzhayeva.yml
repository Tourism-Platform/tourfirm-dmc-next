    description:
      en: "Odina Karahodzhayeva ensures financial and administrative clarity at TourLink as route enquiries become confirmed programmes.\n\nShe keeps the practical side of each trip visible — from confirmation to coordination — so partners and travellers know what to expect at every step."
      ru: "Одина Караходжаева обеспечивает финансовую и административную ясность TourLink, когда маршрутные запросы становятся подтверждёнными программами.\n\nОна держит практическую сторону каждой поездки на виду — от подтверждения до координации — чтобы партнёры и путешественники понимали, чего ожидать на каждом шаге."
      uz: "Odina Karahodjayeva marshrut so'rovlari tasdiqlangan dasturlarga aylanganda TourLinkda moliyaviy va ma'muriy aniqlikni ta'minlaydi.\n\nU har bir sayohatning amaliy tomonini — tasdiqlashdan muvofiqlashtirishgacha — ko'z oldida tutadi, shunda hamkorlar va sayohatchilar har bir bosqichda nima kutishini biladi."
