            title:
              en: "Alizhon Mamatkulov"
              ru: "Алижон Маматкулов"
              uz: "Alizhon Mamatkulov"
        right:
          - type: "quote"
            quote:
              en: "I have been working in tourism since 2025, and in 2026 I joined the TourLink team, where I primarily focus on the Japanese market. My interest in tourism emerged while studying Japanese: one of my first teachers had worked in this field for many years and often shared stories from their practice during lessons." # Исправлен перевод
              ru: "Я работаю в туризме с 2025 года, а в 2026 году присоединился к команде TourLink, где занимаюсь прежде всего японским направлением. Мой интерес к туризму появился ещё во время изучения японского языка: один из моих первых преподавателей много лет работал в этой сфере и часто рассказывал на занятиях истории из своей практики."
              uz: "Men 2025 yildan beri turizm sohasida ishlayman, 2026 yilda esa TourLink jamoasiga qo'shildim, bu yerda asosan Yaponiya yo'nalishi bilan shug'ullanaman. Turizmga qiziqishim yapon tilini o'rganish paytida paydo bo'lgan: birinchi o'qituvchilarimdan biri bu sohada ko'p yillar ishlagan va darslarda o'z amaliyotidan hikoyalar aytib berardi." # Исправлен перевод
          - type: "dashTitle"
            title:
              en: "Role"
              ru: "Роль"
              uz: "Rol"
            description:
              en: "Travel Expert. Japanese Market — individual and group programs, support in Japanese and English." # Исправлен перевод
              ru: "Эксперт по путешествиям. Японский рынок — индивидуальные и групповые программы, сопровождение на японском и английском."
              uz: "Sayohat Eksperti. Yaponiya Bozori — individual va guruh dasturlari, yapon va ingliz tillarida hamrohlik." # Исправлен перевод
          - type: "dashTitle"
            title:
              en: "Approach"
              ru: "Подход"
              uz: "Yondashuv"
            description:
              en: "I start working with a new traveler or partner by understanding exactly what they expect from the trip: which region they want to see, what experiences they want to gain, what to try, and what to do." # Исправлен перевод
              ru: "Работу с новым путешественником или партнёром я начинаю с того, чтобы понять, чего именно он ждёт от поездки: какой регион хочет увидеть, какие впечатления получить, что попробовать и чем заняться."
              uz: "Yangi sayohatchi yoki hamkor bilan ishlashni uning sayohatdan nimani kutayotganini tushunishdan boshlayman: qaysi mintaqani ko'rmoqchi, qanday tajribalarga ega bo'lishni xohlaydi, nimani sinab ko'rmoqchi va nima bilan shug'ullanmoqchi." # Исправлен перевод
      - left:
          - type: "dashTitle"
            title:
              en: "How I see the country"
              ru: "Как я смотрю на страну"
              uz: "Mamlakatga qanday qarayman"
            description:
              en: "When traveling myself, I most enjoy observing people's daily lives: walking through residential neighborhoods, comparing lifestyles across countries, and noticing similarities and differences in culture and habits. The trip to Tokyo made a particularly strong impression on me." # Исправлен перевод
              ru: "Путешествуя сам, я больше всего люблю наблюдать за повседневной жизнью людей: гулять пешком по жилым кварталам, сравнивать образ жизни разных стран, замечать сходства и различия в культуре и привычках. Особенно сильное впечатление на меня произвела поездка в Токио."
              uz: "O'zim sayohat qilganda, menga odamlarning kundalik hayotini kuzatish eng ko'p yoqadi: turar-joy mahallalari bo'ylab piyoda yurish, turli mamlakatlarning turmush tarzini solishtirish, madaniyat va odatlardagi o'xshashlik va farqlarni payqash. Tokioga qilgan sayohatim menga ayniqsa kuchli taassurot qoldirdi." # Исправлен перевод
  - blockType: "regular"
    eyebrow:
      en: "Work"
      ru: "Направления"
      uz: "Yo'nalishlar"
    title:
      en: "What I do"
      ru: "Чем я занимаюсь"
      uz: "Nima bilan shug'ullanaman"
    description:
      en: "At TourLink, I handle the development of individual and group travel, cultural-educational, gastronomic, active, and business programs, hotel bookings, transport, logistics, and guest support. One area that particularly interests me is creating custom tours tailored to specific traveler preferences, as well as combined routes across Uzbekistan, Kyrgyzstan, Kazakhstan, and Turkmenistan. I find it easy to connect with people, so I strive to be available to guests throughout the entire trip." # Исправлен перевод
      ru: "В TourLink я занимаюсь разработкой индивидуальных и групповых путешествий, культурно-познавательных, гастрономических, активных и деловых программ, бронированием отелей, транспортом, логистикой и сопровождением гостей. Одно из направлений, которое мне особенно интересно, — создание индивидуальных туров под конкретные пожелания путешественника, а также комбинированных маршрутов по Узбекистану, Кыргызстану, Казахстану и Туркменистану. Мне легко находить общий язык с людьми, поэтому я стараюсь быть доступным для гостей на протяжении всей поездки."
      uz: "TourLink da men individual va guruhli sayohatlar, madaniy-ma'rifiy, gastronomik, faol va biznes dasturlarini ishlab chiqish, mehmonxonalarni bron qilish, transport, logistika va mehmonlarga hamrohlik qilish bilan shug'ullanaman. Menga ayniqsa qiziq bo'lgan yo'nalishlardan biri — sayoatchining aniq istaklariga moslashtirilgan individual turlarni yaratish, shuningdek, O'zbekiston, Qirg'iziston, Qozog'iston va Turkmaniston bo'ylab kombinatsiyalangan marshrutlarni tuzish. Odamlar bilan til topishish menga oson, shuning uchun butun sayohat davomida mehmonlar uchun mavjud bo'lishga harakat qilaman." # Исправлен перевод
    gridClassName: "sm:grid-cols-2"
    cards:
      - type: "destinationInsight"
        icon: "users"
        title:
          en: "Tours" # Исправлено: был русский
          ru: "Туры"
          uz: "Turlar" # Исправлено: был русский
        description:
          en: "Individual and group travel: cultural-educational, gastronomic, active, and business programs." # Исправлен перевод
          ru: "Индивидуальные и групповые путешествия: культурно-познавательные, гастрономические, активные и деловые программы."
          uz: "Individual va guruhli sayohatlar: madaniy-ma'rifiy, gastronomik, faol va biznes dasturlari." # Исправлен перевод
      - type: "destinationInsight"
        icon: "map"
        title:
          en: "Combined routes" # Исправлено: был русский
          ru: "Комбинированные маршруты"
          uz: "Kombinatsiyalangan marshrutlar" # Исправлено: был русский
        description:
          en: "Routes tailored to specific preferences — across Uzbekistan and beyond: Kyrgyzstan, Kazakhstan, Turkmenistan." # Исправлен перевод
          ru: "Маршруты под конкретные пожелания — по Узбекистану и дальше: Кыргызстан, Казахстан, Туркменистан."
          uz: "Aniq istaklarga moslashtirilgan marshrutlar — O'zbekiston bo'ylab va undan tashqarida: Qirg'iziston, Qozog'iston, Turkmaniston." # Исправлен перевод
      - type: "destinationInsight"
        icon: "building-2"
        title:
          en: "Hotels and logistics" # Исправлено: был русский
          ru: "Отели и логистика"
          uz: "Mehmonxonalar va logistika" # Исправлено: был русский
        description:
          en: "Hotel booking, transport, logistics. When choosing a hotel, location and service level matter; for the route — comfortable transfers and logical program flow." # Исправлен перевод
          ru: "Бронирование отелей, транспорт, логистика. При выборе отеля важны расположение и уровень сервиса, в маршруте — комфортные трансферы и логичность программы."
          uz: "Mehmonxonalarni bron qilish, transport, logistika. Mehmonxona tanlashda joylashuv va xizmat ko'rsatish darajasi muhim, marshrutda esa qulay transferlar va dasturning mantiqiyligi." # Исправлен перевод
      - type: "destinationInsight"
        icon: "headset"
        title:
          en: "24/7 support" # Исправлено: был русский
          ru: "Сопровождение 24/7"
          uz: "24/7 hamrohlik" # Исправлено: был русский
        description:
          en: "During the tour, I stay available around the clock, answer questions, and help resolve any situations that arise." # Исправлен перевод
          ru: "Во время тура я остаюсь на связи круглосуточно, отвечаю на вопросы и помогаю решать возникающие ситуации."
          uz: "Tur davomida men tunu kun aloqada bo'lib, savollarga javob beraman va yuzaga keladigan vaziyatlarni hal qilishga yordam beraman." # Исправлен перевод
  - blockType: "regular"
    eyebrow:
      en: "Background"
      ru: "Опыт"
      uz: "Tajriba"
    title:
      en: "What goes into organizing a trip" # Исправлен перевод (был русский)
      ru: "Что стоит за организацией поездки"
      uz: "Sayohatni tashkil qilish ortida nima turibdi" # Исправлен перевод (был русский)
    description:
      en: "I graduated from the Higher School of Japanese Studies at Tashkent State University of Oriental Studies. I also received training in English, the Japanese service industry, and hotel services as part of the Tokutei Ginou program. I use Japanese and English in my work. Thanks to the advice of my teachers and senior colleagues, I definitively decided to build my career in tourism." # Исправлен перевод
      ru: "Я окончил Высшую школу японоведения Ташкентского государственного университета востоковедения. Также проходил обучение по английскому языку, сфере обслуживания в Японии и гостиничному сервису в рамках подготовки по программе Tokutei Ginou. В работе использую японский и английский языки. Благодаря советам преподавателей и старших коллег я окончательно решил развиваться именно в туризме."
      uz: "Men Toshkent Davlat Sharqshunoslik Universitetining Oliy Yaponiyashunoslik Maktabini tamomlaganman. Shuningdek, Tokutei Ginou dasturi doirasida ingliz tili, Yaponiyadagi xizmat ko'rsatish sohasi va mehmonxona xizmati bo'yicha ta'lim olganman. Ishda yapon va ingliz tillaridan foydalanaman. O'qituvchilarim va katta hamkasblarimning maslahatlari tufayli men turizm sohasida rivojlanishga qaror qildim." # Исправлен перевод
    rows:
      - ratio: "3:2"
        left:
          - type: "miniTable"
            icon: "graduation-cap"
            title:
              en: "Education and languages"
              ru: "Образование и языки"
              uz: "Ta'lim va tillar"
            rows:
              - icon: "book-open"
                title:
                  en: "Japanese Studies"
                  ru: "Японоведение"
                  uz: "Yaponiyashunoslik"
                description:
                  en: "Higher School of Japanese Studies, TSUOS"
                  ru: "Высшая школа японоведения, ТГУВ"
                  uz: "Oliy Yaponiyashunoslik Maktabi, TDShU"
              - icon: "hotel"
                title:
                  en: "Tokutei Ginou"
                  ru: "Tokutei Ginou"
                  uz: "Tokutei Ginou"
                description:
                  en: "English, Japanese service industry, hotel services"
                  ru: "Английский, обслуживание в Японии, гостиничный сервис"
                  uz: "Ingliz tili, Yaponiyada xizmat ko'rsatish, mehmonxona xizmati"
              - icon: "languages"
                title:
                  en: "Languages at work"
                  ru: "Языки в работе"
                  uz: "Ishdagi tillar"
                description:
                  en: "Japanese and English"
                  ru: "Японский и английский"
                  uz: "Yapon va ingliz tillari"
        right:
          - type: "dashTitle"
            title:
              en: "How I work"
              ru: "Как я работаю"
              uz: "Qanday ishlayman"
            description:
              en: "When creating a route, the guest's preferences, budget, trip duration, convenience, and safety are especially important to me. If plans change unexpectedly, I calmly explain the circumstances and find a solution acceptable to all parties." # Исправлен перевод
              ru: "При создании маршрута для меня особенно важны пожелания гостя, его бюджет, продолжительность путешествия, удобство и безопасность. Если планы неожиданно меняются, я спокойно объясняю обстоятельства и ищу решение, которое будет приемлемым для всех сторон."
              uz: "Marshrut yaratishda men uchun mehmonning istaklari, uning byudjeti, sayohat davomiyligi, qulaylik va xavfsizlik ayniqsa muhim. Agar rejalar kutilmaganda o'zgarsa, men vaziyatni xotirjamlik bilan tushuntirib, barcha tomonlar uchun maqbul bo'lgan yechimni topaman." # Исправлен перевод
  - blockType: "regular"
    eyebrow:
      en: "Principle"
      ru: "Принцип"
      uz: "Tamoyil"
    title:
      en: "Quality over quantity" # Исправлен перевод (был русский)
      ru: "Качество важнее количества"
      uz: "Sifat miqdordan muhimroq" # Исправлен перевод (был русский)
    description:
      en: "In my work, I value attention to detail, responsibility, reliability, flexibility, and genuine hospitality. I consider one of TourLink's key strengths to be the combination of senior specialists' experience and the energy of the younger generation: knowledge is passed on within the team, and young employees are helped to make more balanced decisions. For me, quality always comes before quantity. I want every traveler to feel after their trip that they made the right choice of company to discover Uzbekistan." # Исправлен перевод
      ru: "В работе мне близки внимание к деталям, ответственность, надёжность, гибкость и искреннее гостеприимство. Я считаю одной из сильных сторон TourLink сочетание опыта старших специалистов и энергии молодого поколения: здесь знания передаются внутри команды, а молодым сотрудникам помогают принимать более взвешенные решения. Для меня качество всегда важнее количества. Я хочу, чтобы каждый путешественник после поездки чувствовал, что правильно выбрал компанию для знакомства с Узбекистаном."
      uz: "Ishimda menga detallarga e'tibor, mas'uliyat, ishonchlilik, moslashuvchanlik va samimiy mehmondo'stlik yaqin. Men TourLink ning kuchli tomonlaridan biri bu tajribali mutaxassislar tajribasi va yosh avlod energiyasining uyg'unligi deb hisoblayman: bu yerda bilimlar jamoa ichida uzatiladi va yosh xodimlarga yanada muvozanatli qarorlar qabul qilishga yordam beriladi. Men uchun sifat har doim miqdordan muhimroq. Har bir sayohatchi O'zbekiston bilan tanishish uchun to'g'ri kompaniyani tanlaganini his qilishini xohlayman." # Исправлен перевод
    rows:
      - ratio: "2:1"
        left:
          - type: "dashTitle"
            title:
              en: "How I support guests" # Исправлен перевод
              ru: "Как я сопровождаю гостя"
              uz: "Mehmonlarni qanday hamrohlik qilaman" # Исправлен перевод
            description:
              en: "I strive to be available throughout the trip. If something changes, it's important not to leave the guest alone with uncertainty — to explain the situation and find a solution together." # Исправлен перевод
              ru: "Я стараюсь быть доступным на протяжении всей поездки. Если что-то меняется, важно не оставить гостя один на один с неопределённостью — объяснить ситуацию и найти решение вместе."
              uz: "Butun sayohat davomida mavjud bo'lishga harakat qilaman. Agar biror narsa o'zgarsa, mehmonni noaniqlik bilan yolg'iz qoldirmaslik muhim — vaziyatni tushuntirib, birgalikda yechim topish." # Исправлен перевод
        right:
          - type: "quote"
            quote:
              en: "For me, quality always comes before quantity."
              ru: "Для меня качество всегда важнее количества."
              uz: "Men uchun sifat har doim miqdordan muhimroq."
  - blockType: "regular"
    eyebrow:
      en: "Tips"
      ru: "Советы"
      uz: "Maslahatlar"
    title:
      en: "What I recommend to see" # Исправлен перевод (был русский)
      ru: "Что я рекомендую увидеть"
      uz: "Ko'rishni tavsiya qiladigan joylarim" # Исправлен перевод (был русский)
    description:
      en: "One of my favorite places in Uzbekistan is Tashkent. My student years were spent here, and this city is connected to an important period of my personal development. I especially recommend guests to feel the difference between the atmosphere of old and modern Tashkent. For those who want to see the less well-known corners of the country, I recommend Bakhmal and Aidarkul in the Jizzakh region. Discovering Uzbekistan for me is impossible without local cuisine and craft traditions. I recommend trying samsa with tomato sauce, seeing the work of carving masters in Samarkand and Bukhara, attending a folklore performance at the Nadir Divan-begi Madrasa, and if the trip falls in spring, be sure to experience the atmosphere of Navruz and try the festive dishes." # Исправлен перевод
      ru: "Одно из моих любимых мест в Узбекистане — Ташкент. Здесь прошли мои студенческие годы, и именно с этим городом связан важный период моего личного развития. Гостям я особенно советую почувствовать разницу между атмосферой старого и современного Ташкента. А тем, кто хочет увидеть менее известные уголки страны, я рекомендую Бахмаль и Айдаркуль в Джизакской области. Знакомство с Узбекистаном для меня невозможно без местной кухни и ремесленных традиций. Я советую попробовать самсу с томатным соусом, увидеть работу мастеров резьбы в Самарканде и Бухаре, побывать на фольклорном представлении в медресе Нодир-Диван-Беги и, если путешествие приходится на весну, обязательно почувствовать атмосферу Навруза и попробовать праздничные блюда."
      uz: "O'zbekistondagi sevimli joylarimdan biri — Toshkent. Mening talabalik yillarim shu yerda o'tgan va aynan shu shahar mening shaxsiy rivojlanishimdagi muhim davr bilan bog'liq. Mehmonlarga ayniqsa eski va zamonaviy Toshkent atmosferasi o'rtasidagi farqni his qilishni tavsiya qilaman. Mamlakatning kamroq mashhur burchaklarini ko'rmoqchi bo'lganlarga esa Jizzax viloyatidagi Baxmal va Aydarkulni tavsiya qilaman. O'zbekiston bilan tanishish men uchun mahalliy oshxona va hunarmandchilik an'analarisiz mumkin emas. Men pomidor sousli samsa tatib ko'rishni, Samarqand va Buxoroda o'ymakorlik ustalarining ishini ko'rishni, Nodir Devonbegi madrasasidagi folklor tomoshasida bo'lishni va agar sayohat bahorga to'g'ri kelsa, Navruz atmosferasini his qilish va bayram taomlarini tatib ko'rishni tavsiya qilaman." # Исправлен перевод
    gridClassName: "sm:grid-cols-2"
    cards:
      - type: "destinationInsight"
        icon: "map-pin"
        title:
          en: "Tashkent"
          ru: "Ташкент"
          uz: "Toshkent"
        description:
