  - blockType: "regular"
    eyebrow:
      en: "About"
      ru: "О сотруднике"
      uz: "Xodim haqida"
    rows:
      - ratio: "1:2"
        left:
          - type: "portrait"
            image: "assets/images/people.jpg"
            title:
              en: "Alizhon Mamatkulov"
              ru: "Алижон Маматкулов"
              uz: "Alizhon Mamatkulov"
        right:
          - type: "quote"
            quote:
              en: "My interest in tourism began while I was studying Japanese: one of my first teachers had worked in this field for years and often shared stories from practice in class."
              ru: "Мой интерес к туризму появился ещё во время изучения японского языка: один из первых преподавателей много лет работал в этой сфере и часто рассказывал на занятиях истории из своей практики."
              uz: "Turizmga qiziqishim yapon tilini o'rganish paytida paydo bo'lgan: birinchi o'qituvchilarimdan biri bu sohada ko'p yillar ishlagan va darslarda amaliyotidan hikoyalar aytib berardi."
            caption:
              en: "Alizhon Mamatkulov, travel expert"
              ru: "Алижон Маматкулов, эксперт по путешествиям"
              uz: "Alizhon Mamatkulov, sayohat eksperti"
          - type: "dashTitle"
            description:
              en: "I have been working in tourism since 2025, and in 2026 I joined the TourLink team, where I primarily focus on the Japanese market. Later, thanks to advice from teachers and senior colleagues, I decided to build my career in tourism."
              ru: "Я работаю в туризме с 2025 года, а в 2026 году присоединился к команде TourLink, где занимаюсь прежде всего японским направлением. Позже, благодаря советам преподавателей и старших коллег, я окончательно решил развиваться именно в туризме."
              uz: "2025 yildan turizmda ishlayman, 2026 yilda TourLink jamoasiga qo'shildim — asosan Yaponiya yo'nalishi. O'qituvchilar va katta hamkasblar maslahati bilan shu sohada qolishga qaror qildim."
          - type: "dashTitle"
            title:
              en: "Education and languages"
              ru: "Образование и языки"
              uz: "Ta'lim va tillar"
            description:
              en: "I graduated from the Higher School of Japanese Studies at Tashkent State University of Oriental Studies. I also trained in English, the Japanese service industry and hotel services as part of the Tokutei Ginou program. I work in Japanese and English."
              ru: "Я окончил Высшую школу японоведения Ташкентского государственного университета востоковедения. Также проходил обучение по английскому языку, сфере обслуживания в Японии и гостиничному сервису в рамках подготовки по программе Tokutei Ginou. В работе использую японский и английский языки."
              uz: "Toshkent Davlat Sharqshunoslik Universitetining Oliy Yaponiyashunoslik Maktabini tamomladim. Tokutei Ginou dasturida ingliz tili, Yaponiyada xizmat va mehmonxona servisi bo'yicha o'qidim. Ishda yapon va ingliz tillaridan foydalanaman."
          - type: "dashTitle"
            title:
              en: "Approach"
              ru: "Подход"
              uz: "Yondashuv"
            description:
              en: "I start with a new traveler or partner by understanding what they expect: which region they want to see, what impressions they want, what to try and what to do."
              ru: "Работу с новым путешественником или партнёром я начинаю с того, чтобы понять, чего именно он ждёт от поездки: какой регион хочет увидеть, какие впечатления получить, что попробовать и чем заняться."
              uz: "Yangi sayyoh yoki hamkor bilan ishni kutganini tushunishdan boshlayman: qaysi mintaqa, qanday taassurot, nima tatib ko'rish va nima qilish."
