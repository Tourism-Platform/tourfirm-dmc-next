      uz: "Alizhon Mamatkulov TourLinkning yapon bozorini qo'llab-quvvatlaydi, yapon sayohatchilari va hamkorlariga marshrut tafsilotlarini aniq va tushunarli qilib beradi.\n\nBirinchi so'rovdan muvofiqlashtirishgacha u muloqotni amaliy, marshrut savollarini esa yaxshi shakllangan holda saqlaydi."
