  - blockType: "regular"
    eyebrow:
      en: "Principle"
      ru: "Принцип"
      uz: "Tamoyil"
    title:
      en: "How a good trip is measured"
      ru: "Чем измеряется хорошая поездка"
      uz: "Yaxshi sayohat nima bilan o'lchanadi"
    rows:
      - left:
          - type: "quote"
            quoteVariant: "wide"
            quote:
              en: "I want every traveler to feel after the trip that they chose the right company to discover Uzbekistan."
              ru: "Я хочу, чтобы каждый путешественник после поездки чувствовал, что правильно выбрал компанию для знакомства с Узбекистаном."
              uz: "Har bir sayyoh sayohatdan keyin O'zbekiston bilan tanishish uchun to'g'ri kompaniyani tanlaganini his qilishini xohlayman."
            caption:
              en: "Quality over quantity"
              ru: "Качество важнее количества"
              uz: "Sifat miqdordan muhimroq"
      - ratio: "3:2"
        left:
          - type: "dashTitle"
            title:
              en: "What matters at work"
              ru: "Что важно в работе"
              uz: "Ishda nima muhim"
            description:
              en: "I value attention to detail, responsibility, reliability, flexibility and genuine hospitality. I find it easy to connect with people, so I try to stay available throughout the trip."
              ru: "Мне близки внимание к деталям, ответственность, надёжность, гибкость и искреннее гостеприимство. Мне легко находить общий язык с людьми, поэтому я стараюсь быть доступным для гостей на протяжении всей поездки."
              uz: "Detallarga e'tibor, mas'uliyat, ishonchlilik, moslashuvchanlik va samimiy mehmondo'stlik. Odamlar bilan til topishish oson, shuning uchun butun sayohat davomida mavjud bo'lishga harakat qilaman."
          - type: "dashTitle"
            description:
              en: "One of TourLink's strengths is the mix of senior specialists' experience and younger energy: knowledge is passed on inside the team, and younger staff are helped to make more balanced decisions."
              ru: "Одной из сильных сторон TourLink я считаю сочетание опыта старших специалистов и энергии молодого поколения: здесь знания передаются внутри команды, а молодым сотрудникам помогают принимать более взвешенные решения."
              uz: "TourLink kuchli tomoni — tajribali mutaxassislar va yosh avlod energiyasi: bilim jamoa ichida o'tadi, yoshlarga muvozanatli qaror qabul qilishga yordam beriladi."
        right:
          - type: "dashTitle"
            title:
              en: "What result means to me"
              ru: "Что для меня результат"
              uz: "Men uchun natija"
            description:
              en: "I would be glad to help create unforgettable memories in Uzbekistan and, with TourLink, accompany you through a country of history, hospitality and the famous blue domes."
              ru: "Я буду рад помочь создать незабываемые воспоминания в Узбекистане и вместе с TourLink сопровождать вас в путешествии по стране, наполненной историей, гостеприимством и знаменитыми голубыми куполами."
              uz: "O'zbekistonda unutilmas xotiralar yaratishga yordam berishdan va TourLink bilan tarix, mehmondo'stlik va mashhur ko'k gumbazlar mamlakati bo'ylab hamrohlik qilishdan xursandman."
          - type: "valuePoint"
            title:
              en: "Responsibility and reliability"
              ru: "Ответственность и надёжность"
              uz: "Mas'uliyat va ishonchlilik"
            description:
              en: "The guest knows whom to contact at any moment of the trip."
              ru: "Гость знает, к кому обратиться в любой момент поездки."
              uz: "Mehmon sayohatning istalgan paytida kimga murojaat qilishini biladi."
          - type: "valuePoint"
            title:
              en: "Flexibility"
              ru: "Гибкость"
              uz: "Moslashuvchanlik"
            description:
              en: "Plans change — a solution is found calmly and for all sides."
              ru: "Планы меняются — решение находится спокойно и для всех сторон."
              uz: "Rejalar o'zgaradi — yechim xotirjam va barcha tomonlar uchun topiladi."
          - type: "valuePoint"
            title:
              en: "Genuine hospitality"
              ru: "Искреннее гостеприимство"
              uz: "Samimiy mehmondo'stlik"
            description:
              en: "Not a service formality, but a normal human attitude."
              ru: "Не сервисная формальность, а нормальное человеческое отношение."
              uz: "Servis formalligi emas, oddiy insoniy munosabat."
