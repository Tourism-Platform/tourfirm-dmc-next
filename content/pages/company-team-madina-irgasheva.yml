    description:
      en: "Madina Irgasheva supports French-language communication at TourLink, helping French-speaking travellers and partners formulate route questions from the first enquiry.\n\nShe works through sales and operations to keep each trip practical, clear and ready for confirmation."
      ru: "Мадина Иргашева поддерживает коммуникацию на французском языке в TourLink, помогая франкоязычным путешественникам и партнёрам формулировать маршрутные вопросы с первого запроса.\n\nОна ведёт продажи и операции, чтобы каждая поездка оставалась практичной, понятной и готовой к подтверждению."
      uz: "Madina Irgasheva TourLinkda fransuz tilidagi muloqotni qo'llab-quvvatlaydi, fransuz tilida so'zlashuvchi sayohatchilar va hamkorlarga birinchi so'rovdan boshlab marshrut savollarini shakllantirishga yordam beradi.\n\nU har bir sayohat amaliy, tushunarli va tasdiqlashga tayyor bo'lishi uchun sotuv va operatsiyalar bilan shug'ullanadi."
