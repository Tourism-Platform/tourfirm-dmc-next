    description:
      en: "Abdulaziz Mavlonov leads business development at TourLink, shaping partner conversations and the context in which routes are built and confirmed.\n\nAs TourLink's public DMC direction grows, he helps agencies, operators and suppliers find a clear entry point into the regional ecosystem."
      ru: "Абдулазиз Мавлонов ведёт направление развития бизнеса в TourLink, формируя партнёрские разговоры и контекст, в котором маршруты создаются и подтверждаются.\n\nПо мере роста публичного DMC-направления TourLink он помогает агентствам, операторам и поставщикам найти понятную точку входа в региональную экосистему."
      uz: "Abdulaziz Mavlonov TourLinkda biznes rivojlantirish yo'nalishini boshqaradi, hamkorlik suhbatlari va marshrutlar quriladigan hamda tasdiqlanadigan kontekstni shakllantiradi.\n\nTourLinkning ochiq DMC yo'nalishi o'sishi bilan u agentliklar, operatorlar va yetkazib beruvchilarga mintaqaviy ekotizimga aniq kirish nuqtasini topishga yordam beradi."
