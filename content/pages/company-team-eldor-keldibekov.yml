    description:
      en: "Eldor Keldibekov supports TourLink's Spanish-language direction, helping Spanish-speaking travellers and partners formulate clear route questions from the first enquiry.\n\nHe works through sales and operations until practical details are visible and a programme can move toward confirmation."
      ru: "Эльдор Келдибеков поддерживает испаноязычное направление TourLink, помогая путешественникам и партнёрам на испанском языке формулировать понятные маршрутные вопросы с первого запроса.\n\nОн ведёт продажи и операции до тех пор, пока практические детали не становятся видимыми и программа не может двигаться к подтверждению."
      uz: "Eldor Keldibekov TourLinkning ispan tilidagi yo'nalishini qo'llab-quvvatlaydi, ispan tilida so'zlashuvchi sayohatchilar va hamkorlarga birinchi so'rovdan boshlab aniq marshrut savollarini shakllantirishga yordam beradi.\n\nU amaliy tafsilotlar ko'rinib, dastur tasdiqlashga yaqinlashguncha sotuv va operatsiyalar bilan shug'ullanadi."
