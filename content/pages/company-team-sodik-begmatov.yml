    description:
      en: "Sodik Begmatov founded TourLink to connect Central Asia with the world through routes built by people who know the region from inside — not through aggregators or algorithms.\n\nEvery route enquiry at TourLink carries the weight of years of regional work: partner relationships, operational clarity and a team that stands behind each programme."
      ru: "Содик Бегматов основал TourLink, чтобы связать Центральную Азию с миром через маршруты, созданные теми, кто знает регион изнутри — без агрегаторов и алгоритмов.\n\nКаждый маршрутный запрос в TourLink опирается на годы региональной работы: партнёрские связи, операционную ясность и команду, которая стоит за каждой программой."
      uz: "Sodik Begmatov TourLinkni Markaziy Osiyoni regionni ichidan biladigan odamlar yaratgan marshrutlar orqali dunyo bilan bog'lash uchun asos solgan — agregatorlar va algoritmlarsiz.\n\nTourLinkdagi har bir marshrut so'rovi mintaqada yillar davomida qilingan ishga tayanadi: hamkorlik aloqalari, operatsion aniqlik va har bir dastur ortida turadigan jamoa."
