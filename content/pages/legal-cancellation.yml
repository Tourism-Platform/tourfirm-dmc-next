blocks:
  - blockType: "hero"
    image: "assets/images/hero-image.jpg"
    imageAlt:
      en: "Cancellation policy"
      ru: "Политика отмены"
      uz: "Bekor qilish siyosati"
    title:
      en: "Cancellation policy"
      ru: "Политика отмены"
      uz: "Bekor qilish siyosati"
    description:
      en: "How cancellation, changes and refunds work for TourLink bookings."
      ru: "Как работают отмена, изменения и возвраты для бронирований TourLink."
      uz: "TourLink bronlari uchun bekor qilish, o'zgartirishlar va qaytarishlar qanday ishlaydi."
  - blockType: "regular"
    title:
      en: "Specific booking terms come first"
      ru: "Сначала действуют условия конкретного бронирования"
      uz: "Avvalo aniq bron shartlari qo'llaniladi"
    description:
      en: "Cancellation terms may differ depending on the tour, supplier, season, group size, destination, special event, hotel, transport, permit, ticket, MICE service or B2B contract. For a confirmed booking, cancellation terms in the written proposal, invoice, booking confirmation, supplier terms or signed agreement apply first. This public policy applies where such documents are silent, or supplements them with general rules where there is no conflict."
      ru: "Условия отмены могут отличаться в зависимости от тура, поставщика, сезона, размера группы, направления, специального события, отеля, транспорта, разрешения, билета, MICE-услуги или B2B-договора. Для подтвержденного бронирования в первую очередь применяются условия отмены в письменном предложении, счете, подтверждении бронирования, условиях поставщика или подписанном соглашении. Эта публичная политика действует там, где такие документы ничего не говорят, или дополняет их общими правилами, если нет конфликта."
      uz: "Bekor qilish shartlari tur, yetkazib beruvchi, mavsum, guruh hajmi, yo'nalish, maxsus tadbir, mehmonxona, transport, ruxsatnoma, chipta, MICE xizmati yoki B2B shartnomaga qarab farq qilishi mumkin. Tasdiqlangan bron uchun yozma taklif, hisob-faktura, bron tasdiqi, yetkazib beruvchi shartlari yoki imzolangan kelishuvdagi bekor qilish shartlari birinchi navbatda qo'llaniladi. Ushbu ommaviy siyosat bunday hujjatlar jim bo'lgan joylarda qo'llaniladi yoki ziddiyat bo'lmasa, ularni umumiy qoidalar bilan to'ldiradi."
  - blockType: "regular"
    title:
      en: "Before booking confirmation"
      ru: "До подтверждения бронирования"
      uz: "Bron tasdiqlanishidan oldin"
    description:
      en: "An enquiry can usually be withdrawn before confirmation without a TourLink penalty. If you have already asked TourLink in writing to make a paid reservation, buy a ticket, obtain a permit, hold hotel rooms, enter a supplier contract or incur another cost, non-refundable and reasonable administrative costs may be charged to you."
      ru: "Запрос обычно можно отозвать до подтверждения без штрафа TourLink. Если вы уже письменно попросили TourLink сделать платную бронь, купить билет, получить разрешение, заблокировать места в отеле, заключить договор с поставщиком или понести другой расход, на вас могут быть отнесены невозвратные и разумные административные расходы."
      uz: "So'rov odatda tasdiqlanishidan oldin TourLink jarimasisiz qaytarib olinishi mumkin. Agar siz allaqachon TourLinkdan pullik bron qilish, chipta sotib olish, ruxsatnoma olish, mehmonxonada joy band qilish, yetkazib beruvchi bilan shartnoma tuzish yoki boshqa xarajat qilishni yozma so'ragan bo'lsangiz, qaytarib bo'lmaydigan va oqilona ma'muriy xarajatlar sizga yuklanishi mumkin."
  - blockType: "regular"
    title:
      en: "After booking confirmation"
      ru: "После подтверждения бронирования"
      uz: "Bron tasdiqlangandan keyin"
    description:
      en: "After confirmation, cancellation fees may apply. They may include non-refundable supplier costs, deposits or prepayments already paid, tickets, permits, visa support, booking fees, hotel or transport penalties, bank and payment fees, conversion costs and reasonable TourLink operational costs. TourLink calculates the cancellation amount based on the specific booking terms, supplier terms, amounts actually refundable and applicable law."
      ru: "После подтверждения могут применяться сборы за отмену. Они могут включать невозвратные расходы поставщиков, уже переданные депозиты или предоплаты, билеты, разрешения, визовую поддержку, сборы за бронирование, штрафы отелей или транспорта, банковские и платежные комиссии, расходы на конвертацию и разумные операционные расходы TourLink. TourLink рассчитывает сумму отмены по условиям конкретного бронирования, условиям поставщиков, фактически возвращаемым средствам и применимому закону."
      uz: "Tasdiqlangandan keyin bekor qilish to'lovlari qo'llanilishi mumkin. Ular qaytarib bo'lmaydigan yetkazib beruvchi xarajatlari, allaqachon to'langan depozit yoki oldindan to'lovlar, chiptalar, ruxsatnomalar, viza yordami, bron to'lovlari, mehmonxona yoki transport jarimalari, bank va to'lov komissiyalari, konvertatsiya xarajatlari hamda oqilona TourLink operatsion xarajatlarini o'z ichiga olishi mumkin. TourLink bekor qilish summasini aniq bron shartlari, yetkazib beruvchi shartlari, haqiqatan qaytariladigan mablag'lar va qo'llaniladigan qonun asosida hisoblaydi."
  - blockType: "regular"
    title:
      en: "Changes requested by the client"
      ru: "Изменения по просьбе клиента"
      uz: "Mijoz so'ragan o'zgarishlar"
    description:
      en: "A request to change dates, traveller names, group size, accommodation, transport, guide language, route, services or programme may be treated as a partial cancellation and new booking if the original services cannot be changed without cost."
      ru: "Запрос на изменение дат, имен путешественников, размера группы, размещения, транспорта, языка гида, маршрута, услуг или программы может рассматриваться как частичная отмена и новое бронирование, если первоначальные услуги нельзя изменить без расходов."
      uz: "Sanalar, sayohatchilar ismlari, guruh hajmi, joylashuv, transport, gid tili, marshrut, xizmatlar yoki dasturni o'zgartirish so'rovi, agar dastlabki xizmatlarni xarajatsiz o'zgartirib bo'lmasa, qisman bekor qilish va yangi bron sifatida ko'rilishi mumkin."
  - blockType: "regular"
    title:
      en: "No-show and unused services"
      ru: "Неявка и неиспользованные услуги"
      uz: "Kelmaslik va foydalanilmagan xizmatlar"
    description:
      en: "If a traveller does not arrive, is late, leaves early, misses a transfer, train or flight, refuses a service or does not use an included service for reasons not attributable to TourLink, a refund is not guaranteed. TourLink will try to help where reasonably possible, but additional costs due to delay, missed services, transport replacement, accommodation changes, guide waiting time or route restructuring may be charged to the client."
      ru: "Если путешественник не прибыл, опоздал, уехал раньше, пропустил трансфер, поезд или рейс, отказался от услуги или не использовал включенную услугу по причинам не со стороны TourLink, возврат не гарантируется. TourLink постарается помочь, когда это разумно возможно, но дополнительные расходы из-за задержки, пропущенных услуг, замены транспорта, изменения размещения, ожидания гида или перестройки маршрута могут быть отнесены на клиента."
      uz: "Agar sayohatchi kelmasa, kechiksa, erta ketsa, transfer, poezd yoki reysni o'tkazib yuborsa, xizmatdan voz kechsa yoki TourLink sababli bo'lmagan sabablarga ko'ra kiritilgan xizmatdan foydalanmasa, qaytarish kafolatlanmaydi. TourLink oqilona imkon bo'lganda yordam berishga harakat qiladi, lekin kechikish, o'tkazib yuborilgan xizmatlar, transport almashtirish, joylashuv o'zgarishi, gid kutish vaqti yoki marshrutni qayta tuzish sababli qo'shimcha xarajatlar mijozga yuklanishi mumkin."
  - blockType: "regular"
    title:
      en: "Cancellation by TourLink"
      ru: "Отмена со стороны TourLink"
      uz: "TourLink tomonidan bekor qilish"
    description:
      en: "TourLink may cancel or materially change a confirmed booking before travel if payments are not received on time, required data is not provided in time, supplier services are unavailable, safety or legality prevent the programme from running, force majeure affects the route or a stated condition is not met, such as minimum group size. If TourLink cancels for reasons not attributable to the client, TourLink will explain the situation and offer a refund, credit, postponement or alternative where appropriate and lawful. The exact outcome depends on booking terms, supplier refunds, applicable law and the reason for cancellation."
      ru: "TourLink может отменить или существенно изменить подтвержденное бронирование до поездки, если платежи не получены в срок, нужные данные не предоставлены вовремя, услуги поставщиков недоступны, безопасность или законность не позволяют провести программу, на маршрут влияет форс-мажор или не выполнено указанное условие, например минимальный размер группы. Если TourLink отменяет по причинам не со стороны клиента, TourLink объяснит ситуацию и предложит возврат, зачет, перенос или альтернативу, когда это уместно и законно. Точное решение зависит от условий бронирования, возврата средств от поставщиков, применимого закона и причины отмены."
      uz: "TourLink to'lovlar o'z vaqtida olinmasa, kerakli ma'lumotlar o'z vaqtida taqdim etilmasa, yetkazib beruvchi xizmatlari mavjud bo'lmasa, xavfsizlik yoki qonuniylik dasturni o'tkazishga imkon bermasa, marshrutga favqulodda holat ta'sir qilsa yoki minimal guruh hajmi kabi ko'rsatilgan shart bajarilmasa, sayohatdan oldin tasdiqlangan bronni bekor qilishi yoki sezilarli darajada o'zgartirishi mumkin. Agar TourLink mijoz sababli bo'lmagan sabablarga ko'ra bekor qilsa, TourLink vaziyatni tushuntiradi va tegishli hamda qonuniy bo'lganda qaytarish, hisobga o'tkazish, ko'chirish yoki muqobil taklif qiladi. Aniq yechim bron shartlari, yetkazib beruvchilardan qaytarish, qo'llaniladigan qonun va bekor qilish sababiga bog'liq."
  - blockType: "regular"
    title:
      en: "Extraordinary circumstances"
      ru: "Чрезвычайные обстоятельства"
      uz: "Favqulodda holatlar"
    description:
      en: "Extraordinary circumstances may include natural disasters, severe weather, health emergencies, war, unrest, terrorist risk, border closures, government actions, sanctions, transport disruptions, major supplier failure, strikes, route closures, safety warnings or other events beyond reasonable control."
      ru: "Чрезвычайные обстоятельства могут включать стихийные бедствия, тяжелую погоду, санитарные чрезвычайные ситуации, войну, беспорядки, террористический риск, закрытие границ, действия властей, санкции, транспортные сбои, крупный сбой поставщика, забастовки, закрытие маршрута, предупреждения по безопасности или другие события вне разумного контроля."
      uz: "Favqulodda holatlar tabiiy ofatlar, og'ir ob-havo, sanitariya favqulodda vaziyatlari, urush, tartibsizliklar, terror xavfi, chegara yopilishi, hukumat harakatlari, sanktsiyalar, transport uzilishlari, yetkazib beruvchining jiddiy nosozligi, ish tashlashlar, marshrut yopilishi, xavfsizlik ogohlantirishlari yoki oqilona nazoratdan tashqari boshqa hodisalarni o'z ichiga olishi mumkin."
  - blockType: "regular"
    title:
      en: "Refunds"
      ru: "Возвраты"
      uz: "Qaytarishlar"
    description:
      en: "Approved refunds are usually returned to the original payer or another lawful account agreed in writing. Timing depends on supplier refunds, bank processing, currency rules, accounting checks and payment method. Bank fees, intermediary fees, payment provider fees and conversion losses may be deducted where permitted by booking terms and applicable law."
      ru: "Одобренные возвраты обычно возвращаются первоначальному плательщику или на другой законный счет, согласованный письменно. Срок зависит от возврата средств поставщиками, банковской обработки, валютных правил, бухгалтерских проверок и способа оплаты. Банковские комиссии, комиссии посредников, платежных провайдеров и потери на конвертации могут удерживаться, если это допускают условия бронирования и применимый закон."
      uz: "Tasdiqlangan qaytarishlar odatda dastlabki to'lovchiga yoki yozma kelishilgan boshqa qonuniy hisobga qaytariladi. Muddat yetkazib beruvchilardan qaytarish, bank qayta ishlashi, valyuta qoidalari, buxgalteriya tekshiruvlari va to'lov usuliga bog'liq. Bank komissiyalari, vositachi komissiyalari, to'lov provayderi komissiyalari va konvertatsiya yo'qotishlari bron shartlari va qo'llaniladigan qonun ruxsat berganda ushlab qolinishi mumkin."
  - blockType: "regular"
    title:
      en: "How to cancel"
      ru: "Как отменить"
      uz: "Qanday bekor qilish mumkin"
    description:
      en: "Cancellation requests must be sent in writing to the booking contact or info@tourlink.uz. The cancellation date is the date and time TourLink receives the written request, unless the booking confirmation sets a different rule. For urgent cancellation during travel, contact the guide, tour leader, operations contact or support immediately and then confirm cancellation in writing."
      ru: "Запрос на отмену нужно отправить письменно контактному лицу по бронированию или на info@tourlink.uz. Дата отмены — дата и время получения TourLink письменного запроса, если подтверждение бронирования не устанавливает другое правило. Для срочной отмены во время поездки немедленно свяжитесь с гидом, руководителем тура, операционным контактом или поддержкой и затем подтвердите отмену письменно."
      uz: "Bekor qilish so'rovi bron bo'yicha aloqa shaxsiga yoki info@tourlink.uz manziliga yozma yuborilishi kerak. Bekor qilish sanasi — TourLink yozma so'rovni olgan sana va vaqt, agar bron tasdiqi boshqacha qoida belgilamagan bo'lsa. Sayohat paytida shoshilinch bekor qilish uchun darhol gid, tur rahbari, operatsion aloqa yoki qo'llab-quvvatlash bilan bog'laning va keyin bekor qilishni yozma tasdiqlang."
  - blockType: "regular"
    title:
      en: "Contact"
      ru: "Контакты"
      uz: "Aloqa"
    description:
      en: "For questions about this page or TourLink services, email info@tourlink.uz or use the contacts published on the website."
      ru: "По вопросам об этой странице или услугах TourLink напишите на info@tourlink.uz или используйте контакты, опубликованные на сайте."
      uz: "Ushbu sahifa yoki TourLink xizmatlari bo'yicha savollar uchun info@tourlink.uz manziliga yozing yoki saytda e'lon qilingan aloqa ma'lumotlaridan foydalaning."
