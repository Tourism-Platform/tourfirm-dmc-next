  - blockType: "regular"
    eyebrow:
      en: "Principle"
      ru: "Принцип"
      uz: "Tamoyil"
    title:
      en: "The guest comes before everything else"
      ru: "Гость дороже всего остального"
      uz: "Mehmon hamma narsadan qimmat"
    rows:
      - left:
          - type: "quote"
            quoteVariant: "wide"
            quote:
              en: "Mehmon — otangday ulug'."
              ru: "Mehmon — otangday ulug‘."
              uz: "Mehmon — otangday ulug‘."
            caption:
              en: "An Uzbek proverb that is close to me"
              ru: "Узбекская пословица, которая мне близка"
              uz: "Menga yaqin o'zbek maqoli"
      - ratio: "3:2"
        left:
          - type: "dashTitle"
            title:
              en: "Honesty"
              ru: "Честность"
              uz: "Rostgo'ylik"
            description:
              en: "Honesty is my main principle. Travelers are not just tourists — they are our guests. That is why comfort, safety, attention to detail and care for the person always come first."
              ru: "Главный принцип моей работы — честность. Для меня путешественники — не просто туристы, а прежде всего наши гости. Именно поэтому комфорт, безопасность, внимание к деталям и забота о человеке для меня всегда остаются на первом месте."
              uz: "Asosiy tamoyil — rostgo'ylik. Sayyohlar avvalo mehmonlarimiz. Shuning uchun qulaylik, xavfsizlik, detallarga e'tibor va odamga g'amxo'rlik birinchi o'rinda."
          - type: "dashTitle"
            description:
              en: "Even after a tour ends it is hard to say goodbye — and I stay in touch with many guests."
              ru: "Даже после окончания тура мне бывает трудно прощаться с гостями, и со многими из них я продолжаю поддерживать связь."
              uz: "Tur tugagach ham xayrlashish qiyin — ko'p mehmonlar bilan aloqani davom ettiraman."
        right:
          - type: "dashTitle"
            title:
              en: "What result means to me"
              ru: "Что для меня результат"
              uz: "Men uchun natija"
            description:
              en: "If after a trip around Uzbekistan you want to come back, we have done our job right."
              ru: "Если после путешествия по Узбекистану вам захочется вернуться сюда ещё раз, значит, мы сделали свою работу правильно."
              uz: "O'zbekiston sayohatidan keyin yana qaytishni xohlasangiz — ishimizni to'g'ri qilganmiz."
          - type: "valuePoint"
            title:
              en: "Honesty"
              ru: "Честность"
              uz: "Rostgo'ylik"
            description:
              en: "A direct conversation about what will actually work and what will not."
              ru: "Прямой разговор о том, что реально получится, а что нет."
              uz: "Nima haqiqatan ishlaydi, nima yo'q — ochiq suhbat."
          - type: "valuePoint"
            title:
              en: "Comfort and safety"
              ru: "Комфорт и безопасность"
              uz: "Qulaylik va xavfsizlik"
            description:
              en: "The first things checked in any program."
              ru: "Первое, что проверяется в любой программе."
              uz: "Har qanday dasturda birinchi tekshiriladigan narsa."
          - type: "valuePoint"
            title:
              en: "Attention to detail"
              ru: "Внимание к деталям"
              uz: "Detallarga e'tibor"
            description:
              en: "Event experience: the more people, the more the small things matter."
              ru: "Опыт мероприятий: чем больше людей, тем важнее мелочи."
              uz: "Tadbir tajribasi: odam qancha ko'p, mayda narsa shuncha muhim."
