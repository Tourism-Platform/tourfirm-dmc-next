  - blockType: "regular"
    eyebrow:
      en: "About"
      ru: "О сотруднике"
      uz: "Xodim haqida"
    rows:
      - ratio: "1:2"
        left:
          - type: "portrait"
            image: "assets/images/people.jpg"
            title:
              en: "Odina Karahodjayeva"
              ru: "Одина Караходжаева"
              uz: "Odina Karahodjayeva"
        right:
          - type: "quote"
            quote:
              en: "I came to tourism out of love for my country and a wish to show as many people as possible how beautiful, hospitable and varied Uzbekistan can be."
              ru: "В туризм меня привела любовь к своей стране и желание показать как можно большему числу людей, насколько красивым, гостеприимным и разным может быть Узбекистан."
              uz: "Turizmga vatanga muhabbat va O'zbekiston qanchalik go'zal, mehmondo'st va xilma-xil ekanini ko'proq odamlarga ko'rsatish istagi olib keldi."
            caption:
              en: "Odina Karahodjayeva, travel expert"
              ru: "Одина Караходжаева, эксперт по путешествиям"
              uz: "Odina Karahodjayeva, sayohat eksperti"
          - type: "dashTitle"
            description:
              en: "I have been working in tourism since 2019."
              ru: "Я работаю в туризме с 2019 года."
              uz: "2019 yildan beri turizmda ishlayman."
          - type: "dashTitle"
            title:
              en: "Education and training"
              ru: "Образование и подготовка"
              uz: "Ta'lim va tayyorgarlik"
            description:
              en: "I have a higher degree in accounting and audit, plus extra professional training in transport and logistics. I hold a freight-forwarder certificate and practical experience with transport and logistics processes."
              ru: "У меня высшее образование в области бухгалтерского учёта и аудита, а также дополнительная профессиональная подготовка в сфере транспорта и логистики. Я имею сертификат экспедитора и практический опыт работы с транспортными и логистическими процессами."
              uz: "Buxgalteriya va audit bo'yicha oliy ma'lumot, transport va logistika bo'yicha qo'shimcha tayyorgarlik. Ekspeditor sertifikati va amaliy tajriba."
          - type: "dashTitle"
            title:
              en: "Approach"
              ru: "Подход"
              uz: "Yondashuv"
            description:
              en: "I first need to understand the person: interests, wishes, budget and idea of comfort — and only then build the program. I try to find a solution even for complex requests and stay ready for unexpected changes."
              ru: "Для меня важно сначала понять самого человека: его интересы, пожелания, бюджет и представление о комфорте, а уже затем создавать программу путешествия. Я стараюсь находить решение даже для сложных запросов и всегда остаюсь готовой к неожиданным изменениям."
              uz: "Avval odamning o'zini tushunish muhim: qiziqish, istak, byudjet va qulaylik tasavvuri — keyin dastur. Murakkab so'rovlarga ham yechim qidiraman va kutilmagan o'zgarishga tayyorman."
  - blockType: "timeline"
    tone: "tint"
    layout: "horizontal"
    indicatorType: "number"
    eyebrow:
      en: "What I do"
      ru: "Чем я занимаюсь"
      uz: "Nima bilan shug'ullanaman"
    title:
      en: "Trips with especially many details"
      ru: "Поездки, где деталей особенно много"
      uz: "Tafsilotlari ayniqsa ko'p sayohatlar"
    description:
      en: "I especially enjoy organizing tours and events where many details and many people have to be handled at once."
      ru: "Особенно люблю организовывать туры и мероприятия, где необходимо одновременно учитывать множество деталей и работать с большим количеством людей."
      uz: "Ko'p tafsilot va ko'p odamni bir vaqtda hisobga oladigan tur va tadbirlarni tashkil qilish yoqadi."
    items:
      - title:
          en: "Getting acquainted"
          ru: "Знакомство"
          uz: "Tanishuv"
        description:
          en: "Interests, wishes, budget and idea of comfort. The program appears after that."
          ru: "Интересы, пожелания, бюджет и представление о комфорте. Программа появляется после этого."
          uz: "Qiziqish, istak, byudjet va qulaylik tasavvuri. Dastur shundan keyin paydo bo'ladi."
      - title:
          en: "Program"
          ru: "Программа"
          uz: "Dastur"
        description:
          en: "Individual and group tours, cultural, gastronomic and active routes, MICE and VIP trips."
          ru: "Индивидуальные и групповые туры, культурные, гастрономические и активные маршруты, MICE и VIP-поездки."
          uz: "Individual va guruhli turlar, madaniy, gastronomik va faol marshrutlar, MICE va VIP."
      - title:
          en: "Hotels and logistics"
          ru: "Отели и логистика"
          uz: "Mehmonxonalar va logistika"
        description:
          en: "Hotel bookings, transport and logistics — where forwarder experience helps."
          ru: "Бронирование отелей, транспорт и логистика — то, где пригождается опыт экспедитора."
          uz: "Mehmonxona bronlari, transport va logistika — ekspeditor tajribasi shu yerda kerak."
      - title:
          en: "Support"
          ru: "Сопровождение"
          uz: "Hamrohlik"
        description:
          en: "Guest support, solutions for complex requests and readiness for unexpected changes."
          ru: "Сопровождение гостей, решения для сложных запросов и готовность к неожиданным изменениям."
          uz: "Mehmonlarga hamrohlik, murakkab so'rovlarga yechim va kutilmagan o'zgarishga tayyorlik."
    criteria:
      label:
        en: "Trip formats"
        ru: "Форматы поездок"
        uz: "Sayohat formatlari"
      title:
        en: "What I work with"
        ru: "С чем я работаю"
        uz: "Nima bilan ishlayman"
      description:
        en: "From one guest to a large group: the program is built around the format, not the other way around."
        ru: "От одного гостя до большой группы: программа собирается под формат, а не наоборот."
        uz: "Bitta mehmondan katta guruhgacha: dastur formatga moslanadi, aksincha emas."
      tags:
        - label:
            en: "Individual"
