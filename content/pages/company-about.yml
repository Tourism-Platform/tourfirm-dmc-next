      - type: "country"
        countrySlug: uzbekistan
        featured: true
        image: "assets/images/destinations/uzbekistan.jpg"
        badge:
          en: "The heart of the Silk Road"
          ru: "Сердце Великого шёлкового пути"
          uz: "Buyuk Ipak yo'lining yuragi"
        description:
          en: "TourLink's home: courtyards, bazaar rhythm and Silk Road cities in one route."
          ru: "Дом TourLink: дворы, ритм базара и города Шёлкового пути в одном маршруте."
          uz: "TourLink uyi: hovlilar, bozor ritmi va Ipak yo'li shaharlari bitta yo'nalishda."
      - type: "country"
        countrySlug: kazakhstan
        image: "assets/images/destinations/kazakhstan.jpg"
        badge:
          en: "Steppe scale, mountain cities"
          ru: "Степной масштаб, горные города"
          uz: "Dasht miqyosi, tog' shaharlari"
        description:
          en: "From Astana's avenues to Almaty's foothills and Turkistan's courtyards."
          ru: "От широких проспектов Астаны к предгорьям Алматы и дворам Туркестана."
          uz: "Ostona xiyobonlaridan Olmaota tog'oldilari va Turkiston hovlilarigacha."
      - type: "country"
        countrySlug: kyrgyzstan
        image: "assets/images/destinations/kyrgyzstan.jpg"
        badge:
          en: "Mountains, lakes, and nomad roads"
          ru: "Горы, озёра и дороги кочевников"
          uz: "Tog'lar, ko'llar va ko'chmanchi yo'llar"
        description:
