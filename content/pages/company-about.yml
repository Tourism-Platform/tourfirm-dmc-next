        description:
          en: "Travellers worldwide with Central Asia."
          ru: "Путешественника со всего мира — с Центральной Азией."
          uz: "Butun dunyo sayohatchisini Markaziy Osiyo bilan."
      - type: "destinationInsight"
        icon: "compass"
        title:
