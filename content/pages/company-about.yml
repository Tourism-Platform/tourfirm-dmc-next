      ru: "Концепт бренда"
      uz: "Brend konsepti"
    title:
      en: "Connection at the core"
      ru: "Связь — в основе всего"
      uz: "Aloqa — hamma narsaning markazida"
    description:
      en: "TourLink connects sides that would struggle to meet without us — in geography, experience, business and technology."
      ru: "TourLink соединяет стороны, которые без нас встретились бы с трудом — в географии, опыте, бизнесе и технологиях."
      uz: "TourLink bizsiz uchrashishi qiyin bo'lgan tomonlarni bog'laydi — geografiya, tajriba, biznes va texnologiyalarda."
