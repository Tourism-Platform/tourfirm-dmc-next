  - blockType: "regular"
    eyebrow:
      en: "What TourLink is"
      ru: "Что такое TourLink"
      uz: "TourLink nima"
    title:
      en: "A link between Central Asia and the world"
      ru: "Связь между Центральной Азией и миром"
      uz: "Markaziy Osiyo va dunyo o'rtasidagi aloqa"
    rows:
      - ratio: "1:2"
        left:
          - type: "portrait"
            image: "assets/images/people.jpg"
            title:
              en: "The TourLink team"
              ru: "Команда TourLink"
              uz: "TourLink jamoasi"
            description:
              en: "The people behind every route"
              ru: "Люди, которые стоят за каждым маршрутом"
              uz: "Har bir marshrut ortidagi odamlar"
        right:
          - type: "quote"
            quote:
              en: "TourLink is not a startup. It is a team that brought everything it knew and built a platform around it."
              ru: "TourLink — это не стартап. Это команда, которая привела с собой всё, что знала, и построила вокруг этого платформу."
              uz: "TourLink — startap emas. Bu bilgan hamma narsasini olib kelgan va atrofida platforma qurgan jamoa."
            caption:
              en: "The team's mission"
              ru: "Миссия команды"
              uz: "Jamoa missiyasi"
          - type: "dashTitle"
            title:
              en: "The region's ecosystem"
              ru: "Экосистема региона"
              uz: "Mintaqa ekotizimi"
            description:
              en: "The region's first comprehensive travel ecosystem: tour operators, agencies, suppliers and travellers on one platform."
              ru: "Первая в регионе комплексная туристическая экосистема: туроператоры, агентства, поставщики и путешественники на одной платформе."
              uz: "Mintaqadagi birinchi kompleks sayohat ekotizimi: turoperatorlar, agentliklar, yetkazib beruvchilar va sayohatchilar bitta platformada."
          - type: "dashTitle"
            title:
              en: "Mission"
              ru: "Миссия"
              uz: "Missiya"
            description:
              en: "Connecting Central Asia with the world: travellers get direct access to the region, the industry gets a global audience."
              ru: "Соединять Центральную Азию с миром: путешественникам — прямой доступ к региону, индустрии — к глобальной аудитории."
              uz: "Markaziy Osiyoni dunyo bilan bog'lash: sayohatchilarga mintaqaga to'g'ridan-to'g'ri kirish, sohaga — global auditoriya."
  - blockType: "regular"
    tone: "tint"
    eyebrow:
      en: "Values"
      ru: "Ценности"
      uz: "Qadriyatlar"
    title:
      en: "How we make decisions"
      ru: "Как мы принимаем решения"
      uz: "Qanday qaror qabul qilamiz"
    description:
      en: "Seven principles that guide how we work with travellers, agencies and partners."
      ru: "Семь принципов, по которым мы работаем с путешественниками, агентствами и партнёрами."
      uz: "Sayohatchilar, agentliklar va hamkorlar bilan ishlashimizni boshqaradigan yettita tamoyil."
    rows:
      - ratio: "1:2"
        left:
          - type: "quote"
            quote:
              en: "If we do not know something, we say so. If something goes wrong, we fix it first."
              ru: "Если чего-то не знаем — говорим прямо. Если что-то пошло не так — решаем первыми."
              uz: "Bilmasak — to'g'ridan-to'g'ri aytamiz. Muammo bo'lsa — birinchi bo'lib hal qilamiz."
            caption:
              en: "How we work"
              ru: "Как мы работаем"
              uz: "Qanday ishlaymiz"
        right:
          - type: "dashTitle"
            title:
              en: "01 — Inside expertise"
              ru: "01 — Экспертиза изнутри"
              uz: "01 — Ichki ekspertiza"
            description:
              en: "We know the region from experience, not from the internet. If we do not know something, we say so — we do not invent it."
              ru: "Знаем регион не из интернета. Если чего-то не знаем — говорим прямо, а не выдумываем."
              uz: "Regionni internetdan emas, tajribadan bilamiz. Bilmasak — to'g'ridan-to'g'ri aytamiz, o'ylab topmaymiz."
          - type: "dashTitle"
            title:
              en: "02 — Reliability"
              ru: "02 — Надёжность"
              uz: "02 — Ishonchlilik"
            description:
              en: "We do what we promise. If something goes wrong, we fix it first — we do not wait for a complaint."
              ru: "Делаем то, что обещаем. Если что-то пошло не так — решаем первыми, не дожидаясь жалобы."
              uz: "Va'da qilganimizni qilamiz. Muammo bo'lsa — shikoyatni kutmasdan birinchi bo'lib hal qilamiz."
          - type: "dashTitle"
            title:
              en: "03 — Transparency"
              ru: "03 — Прозрачность"
              uz: "03 — Shaffoflik"
            description:
              en: "No hidden terms. Agents see commission, travellers see the full price, partners see how decisions are made."
              ru: "Без скрытых условий. Агенты видят комиссию, туристы — полную стоимость, партнёры — как принимаются решения."
              uz: "Yashirin shartlarsiz. Agentlar komissiyani, sayohatchilar to'liq narxni, hamkorlar qarorlar qanday qabul qilinishini ko'radi."
          - type: "dashTitle"
            title:
              en: "04 — Speed"
              ru: "04 — Скорость"
              uz: "04 — Tezlik"
            description:
              en: "We respect everyone's time. Enquiries are handled quickly and the platform avoids unnecessary steps."
              ru: "Ценим время всех участников. Запросы обрабатываем быстро, платформа не заставляет делать лишних шагов."
              uz: "Hammning vaqtini qadrlaymiz. So'rovlarni tez qayta ishlaymiz, platforma ortiqcha qadamlarni talab qilmaydi."
          - type: "dashTitle"
            title:
              en: "05 — Passion for the work"
              ru: "05 — Страсть к делу"
              uz: "05 — Ishga bo'lgan ishtiyoq"
            description:
              en: "We love travel and Central Asia. It shows in every tour and every conversation."
              ru: "Любим путешествия и Центральную Азию. Это чувствуется в каждом туре и в каждом разговоре."
              uz: "Sayohat va Markaziy Osiyoni yaxshi ko'ramiz. Bu har bir turda va har bir suhbatda seziladi."
          - type: "dashTitle"
            title:
              en: "06 — Respect for the region"
              ru: "06 — Уважение к региону"
              uz: "06 — Mintaqqa hurmat"
            description:
              en: "We talk about Central Asia accurately and respectfully — without clichés or selling exoticism."
              ru: "Рассказываем о Центральной Азии точно и с уважением — без клише и без торговли экзотикой."
              uz: "Markaziy Osiyo haqida aniq va hurmat bilan gapiramiz — klişe va ekzotika savdosiz."
          - type: "dashTitle"
            title:
              en: "07 — Partnership"
              ru: "07 — Партнёрство"
              uz: "07 — Hamkorlik"
            description:
              en: "Agencies, operators, hotels, guides and travellers are partners, not counterparties."
              ru: "Агентства, операторы, отели, гиды и путешественники — партнёры, а не контрагенты."
              uz: "Agentliklar, operatorlar, mehmonxonalar, gidlar va sayohatchilar — kontragent emas, hamkor."
