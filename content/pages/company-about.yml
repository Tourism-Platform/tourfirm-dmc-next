  - blockType: "timeline"
    tone: "tint"
    layout: "horizontal"
    indicatorType: "number"
    eyebrow:
      en: "Development stages"
      ru: "Этапы развития"
      uz: "Rivojlanish bosqichlari"
    title:
      en: "How the TourLink platform grows"
      ru: "Как растёт платформа TourLink"
      uz: "TourLink platformasi qanday o'sadi"
    items:
      - title:
          en: "Phase 1 — now"
          ru: "Фаза 1 — сейчас"
          uz: "1-bosqich — hozir"
        description:
          en: "Tour operators, agencies and travellers. Ready-made tours and custom programmes. Agents see commission and can request individual routes."
          ru: "Туроператоры, агентства и путешественники. Готовые туры и кастомные программы. Агенты видят комиссию и запрашивают индивидуальные маршруты."
          uz: "Turoperatorlar, agentliklar va sayohatchilar. Tayyor turlar va maxsus dasturlar. Agentlar komissiyani ko'radi va individual marshrut so'raydi."
      - title:
          en: "Phase 2 — next step"
          ru: "Фаза 2 — следующий шаг"
          uz: "2-bosqich — keyingi qadam"
        description:
          en: "Hotels, transport, restaurants and other suppliers. Building a bespoke tour from separate services."
          ru: "Отели, транспорт, рестораны и другие поставщики. Сборка индивидуального тура из отдельных услуг."
          uz: "Mehmonxonalar, transport, restoranlar va boshqa yetkazib beruvchilar. Alohida xizmatlardan individual tur yig'ish."
      - title:
          en: "Phase 3 — ecosystem"
          ru: "Фаза 3 — экосистема"
          uz: "3-bosqich — ekotizim"
        description:
          en: "A marketplace, B2B for agencies, analytics, tools for guides and integrations with international booking systems."
          ru: "Маркетплейс, B2B для агентств, аналитика, инструменты для гидов и интеграции с международными системами бронирования."
          uz: "Marketplace, agentliklar uchun B2B, analitika, gidlar uchun vositalar va xalqaro bronlash tizimlari bilan integratsiya."
  - blockType: "regular"
    eyebrow:
      en: "Geography"
      ru: "География"
      uz: "Geografiya"
    title:
      en: "Where TourLink operates"
      ru: "Где работает TourLink"
      uz: "TourLink qayerda ishlaydi"
    description:
      en: "In future — expansion to neighbouring Silk Road destinations, while keeping the focus on Central Asia."
      ru: "В перспективе — расширение на сопредельные направления Шёлкового пути, при сохранении фокуса на Центральной Азии."
      uz: "Kelajakda — Ipak yo'lining qo'shni yo'nalishlariga kengayish, fokus Markaziy Osiyoda qolgan holda."
    gridClassName: "sm:grid-cols-2 sm:gap-5 lg:gap-6"
