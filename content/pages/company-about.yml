segment: "company"
slug: "about"
title:
  en: "About us"
  ru: "О нас"
  uz: "Biz haqimizda"
seo:
  metaTitle:
    en: "About us | TourLink"
    ru: "О нас | TourLink"
    uz: "Biz haqimizda | TourLink"
  metaDescription:
    en: "TourLink is Central Asia's travel ecosystem — connecting the region with the world through on-the-ground expertise, a transparent platform and routes built by people who know the region from inside."
    ru: "TourLink — туристическая экосистема Центральной Азии. Связь между регионом и миром: экспертиза команды, прозрачная платформа и маршруты, созданные теми, кто знает регион изнутри."
    uz: "TourLink — Markaziy Osiyoning sayohat ekotizimi: mintaqani dunyo bilan bog'laydi — jamoa ekspertizasi, shaffof platforma va regionni ichidan biladigan odamlar yaratgan marshrutlar."
status:
  showInSitemap: true
blocks:
  - blockType: "hero"
    image: "assets/images/hero-image.jpg"
    imageAlt:
      en: "Central Asia landscape"
      ru: "Пейзаж Центральной Азии"
      uz: "Markaziy Osiyo manzarasi"
    title:
      en: "Your link to Central Asia"
      ru: "Ваша связь с Центральной Азией"
      uz: "Markaziy Osiyoga aloqangiz"
    description:
      en: "Directly. Unique routes across Uzbekistan, Kyrgyzstan, Kazakhstan and the wider region — built by a team that knows it from inside."
      ru: "Напрямую. Уникальные маршруты по Узбекистану, Кыргызстану, Казахстану и всему региону — от команды, которая знает его изнутри."
      uz: "To'g'ridan-to'g'ri. O'zbekiston, Qirg'iziston, Qozog'iston va butun mintaqa bo'ylab noyob marshrutlar — regionni ichidan biladigan jamoa tomonidan."
  - blockType: "regular"
    eyebrow:
      en: "What TourLink is"
      ru: "Что такое TourLink"
      uz: "TourLink nima"
    title:
      en: "A link between Central Asia and the world"
      ru: "Связь между Центральной Азией и миром"
      uz: "Markaziy Osiyo va dunyo o'rtasidagi aloqa"
    description:
      en: "TourLink is the region's first comprehensive travel ecosystem — tour operators, agencies, suppliers and travellers on one platform.\n\nWe connect you with the people who built these routes through years of work in the region — not through aggregators or algorithms. Uzbekistan, Kyrgyzstan, Kazakhstan, Tajikistan and Turkmenistan — five countries, one link."
      ru: "TourLink — первая в регионе комплексная туристическая экосистема: туроператоры, агентства, поставщики и путешественники на одной платформе.\n\nМы соединяем вас с теми, кто построил эти маршруты годами работы в регионе — без агрегаторов и алгоритмов. Узбекистан, Кыргызстан, Казахстан, Таджикистан и Туркменистан — пять стран, одна связь."
      uz: "TourLink — mintaqadagi birinchi kompleks sayohat ekotizimi: turoperatorlar, agentliklar, yetkazib beruvchilar va sayohatchilar bitta platformada.\n\nBiz sizni bu marshrutlarni regionda yillar davomida qurgan odamlar bilan bog'laymiz — agregatorlar va algoritmlarsiz. O'zbekiston, Qirg'iziston, Qozog'iston, Tojikiston va Turkmaniston — beshta mamlakat, bitta aloqa."
  - blockType: "regular"
    eyebrow:
      en: "Mission"
      ru: "Миссия"
      uz: "Missiya"
    title:
      en: "Connecting Central Asia with the world"
      ru: "Соединять Центральную Азию с миром"
      uz: "Markaziy Osiyoni dunyo bilan bog'lash"
    description:
      en: "Giving travellers direct access to the region and the industry access to a global audience."
      ru: "Давать путешественникам прямой доступ к региону, а индустрии — к глобальной аудитории."
      uz: "Sayohatchilarga mintaqaga to'g'ridan-to'g'ri kirish, sohaga esa global auditoriyaga chiqish imkonini berish."
    note:
      en: "TourLink is not a startup. It is a team that brought everything it knew and built a platform around it."
      ru: "TourLink — это не стартап. Это команда, которая привела с собой всё, что знала, и построила вокруг этого платформу."
      uz: "TourLink — startap emas. Bu bilgan hamma narsasini olib kelgan va atrofida platforma qurgan jamoa."
  - blockType: "regular"
    eyebrow:
      en: "Vision"
      ru: "Видение"
      uz: "Ko'rinish"
    title:
      en: "The main entry point to the region's ecosystem"
      ru: "Главная точка входа в экосистему региона"
      uz: "Mintaqa ekotizimiga asosiy kirish nuqtasi"
    description:
      en: "A platform that unites everyone in the industry and sets a new standard of quality and transparency in Central Asian travel."
      ru: "Платформа, которая объединяет всех участников отрасли и задаёт новый стандарт качества и прозрачности в туризме Центральной Азии."
      uz: "Sohaning barcha ishtirokchilarini birlashtiradigan va Markaziy Osiyo turizmida sifat va shaffoflikning yangi standartini belgilaydigan platforma."
  - blockType: "regular"
    eyebrow:
      en: "Values"
      ru: "Ценности"
      uz: "Qadriyatlar"
    title:
      en: "How we make decisions"
      ru: "Как мы принимаем решения"
      uz: "Qanday qaror qabul qilamiz"
    description:
      en: "Seven principles that guide how we work with travellers, agencies and partners."
      ru: "Семь принципов, по которым мы работаем с путешественниками, агентствами и партнёрами."
      uz: "Sayohatchilar, agentliklar va hamkorlar bilan ishlashimizni boshqaradigan yettita tamoyil."
    gridClassName: "sm:grid-cols-2 lg:grid-cols-3"
    cards:
      - type: "destinationInsight"
        icon: "compass"
        title:
          en: "Inside expertise"
          ru: "Экспертиза изнутри"
          uz: "Ichki ekspertiza"
        description:
          en: "We know the region from experience, not from the internet. If we do not know something, we say so — we do not invent it."
          ru: "Мы знаем регион не из интернета. Если чего-то не знаем — говорим прямо, а не выдумываем."
          uz: "Regionni internetdan emas, tajribadan bilamiz. Bilmasak — to'g'ridan-to'g'ri aytamiz, o'ylab topmaymiz."
      - type: "destinationInsight"
        icon: "shield-check"
        title:
          en: "Reliability"
          ru: "Надёжность"
          uz: "Ishonchlilik"
        description:
          en: "We do what we promise. If something goes wrong, we fix it first — we do not wait for a complaint."
          ru: "Делаем то, что обещаем. Если что-то пошло не так — решаем первыми, не дожидаясь жалобы."
          uz: "Va'da qilganimizni qilamiz. Muammo bo'lsa — shikoyatni kutmasdan birinchi bo'lib hal qilamiz."
      - type: "destinationInsight"
        icon: "eye"
        title:
          en: "Transparency"
          ru: "Прозрачность"
          uz: "Shaffoflik"
        description:
          en: "No hidden terms. Agents see commission, travellers see the full price, partners see how decisions are made."
          ru: "Без скрытых условий. Агенты видят комиссию, туристы — полную стоимость, партнёры — как принимаются решения."
          uz: "Yashirin shartlarsiz. Agentlar komissiyani, sayohatchilar to'liq narxni, hamkorlar qarorlar qanday qabul qilinishini ko'radi."
      - type: "destinationInsight"
        icon: "zap"
        title:
          en: "Speed"
          ru: "Скорость"
          uz: "Tezlik"
        description:
          en: "We respect everyone's time. Enquiries are handled quickly and the platform avoids unnecessary steps."
          ru: "Ценим время всех участников. Запросы обрабатываем быстро, платформа не заставляет делать лишних шагов."
          uz: "Hammning vaqtini qadrlaymiz. So'rovlarni tez qayta ishlaymiz, platforma ortiqcha qadamlarni talab qilmaydi."
      - type: "destinationInsight"
        icon: "heart"
        title:
          en: "Passion for the work"
          ru: "Страсть к делу"
          uz: "Ishga bo'lgan ishtiyoq"
        description:
          en: "We love travel and Central Asia. It shows in every tour and every conversation."
          ru: "Любим путешествия и Центральную Азию. Это чувствуется в каждом туре и в каждом разговоре."
          uz: "Sayohat va Markaziy Osiyoni yaxshi ko'ramiz. Bu har bir turda va har bir suhbatda seziladi."
      - type: "destinationInsight"
        icon: "globe"
        title:
          en: "Respect for the region"
          ru: "Уважение к региону"
          uz: "Mintaqqa hurmat"
        description:
          en: "We talk about Central Asia accurately and respectfully — without clichés or selling exoticism."
          ru: "Рассказываем о Центральной Азии точно и с уважением — без клише и без торговли экзотикой."
          uz: "Markaziy Osiyo haqida aniq va hurmat bilan gapiramiz — klişe va ekzotika savdosiz."
      - type: "destinationInsight"
        icon: "handshake"
        title:
          en: "Partnership"
          ru: "Партнёрство"
          uz: "Hamkorlik"
        description:
          en: "Agencies, operators, hotels, guides and travellers are partners, not counterparties. We build long-term relationships."
          ru: "Агентства, операторы, отели, гиды и путешественники — партнёры, а не контрагенты. Строим долгие отношения."
          uz: "Agentliklar, operatorlar, mehmonxonalar, gidlar va sayohatchilar — kontragent emas, hamkor. Uzoq muddatli munosabatlar quramiz."
  - blockType: "regular"
    eyebrow:
      en: "Our team"
      ru: "Наша команда"
      uz: "Bizning jamoa"
    title:
      en: "People stand behind every route"
      ru: "За маршрутом стоят люди"
      uz: "Marshrut ortida odamlar turadi"
    description:
      en: "Every enquiry starts with a person who helps clarify the language of communication, the shape of the route and the next practical step."
      ru: "Каждый запрос начинается с человека, который помогает уточнить язык общения, форму маршрута и следующий практический шаг."
      uz: "Har bir so'rov muloqot tili, marshrut shakli va keyingi amaliy qadamni aniqlashtirishga yordam beradigan odamdan boshlanadi."
    gridClassName: "sm:grid-cols-2 lg:grid-cols-3"
    cards:
      - type: "destinationInsight"
        icon: "user"
        title:
          en: "Sodik Begmatov"
          ru: "Содик Бегматов"
          uz: "Sodik Begmatov"
        description:
          en: "Founder. Founded TourLink as the public continuation of Orient Star Group's regional work — its people, routes, partner relationships and operational experience."
          ru: "Founder. Основал TourLink как публичное продолжение региональной работы Orient Star Group: людей, маршрутов, партнёрских связей и операционного опыта."
          uz: "Asoschisi. TourLinkni Orient Star Groupning mintaqaviy ishining — odamlar, marshrutlar, hamkorlik aloqalari va operatsion tajribaning — ochiq davomi sifatida asos solgan."
      - type: "destinationInsight"
        icon: "user"
        title:
          en: "Muhammad Amin Begmatov"
          ru: "Мухаммад Амин Бегматов"
          uz: "Muhammadamin Begmatov"
        description:
          en: "CEO. Leads TourLink and connects route enquiries with team decisions until a programme is confirmed."
          ru: "CEO. Ведёт направление TourLink и связывает маршрутные запросы с командными решениями до подтверждения программы."
          uz: "Bosh direktor. TourLink yo'nalishini boshqaradi va marshrut so'rovlarini dastur tasdiqlanmaguncha jamoa qarorlari bilan bog'laydi."
      - type: "destinationInsight"
        icon: "user"
        title:
          en: "Abdulaziz Mavlonov"
          ru: "Абдулазиз Мавлонов"
          uz: "Abdulaziz Mavlonov"
        description:
          en: "BDD. Leads business development conversations and partner context as TourLink's public DMC direction grows."
          ru: "BDD. Ведёт разговоры по развитию бизнеса и партнёрскому контексту по мере роста публичного DMC-направления TourLink."
          uz: "BDD. TourLinkning ochiq DMC yo'nalishi o'sishi bilan biznes rivojlantirish va hamkorlik konteksti bo'yicha suhbatlarni olib boradi."
      - type: "destinationInsight"
        icon: "user"
        title:
          en: "Odina Karahodzhayeva"
          ru: "Одина Караходжаева"
          uz: "Odina Karahodjayeva"
        description:
          en: "CFO. Ensures financial and administrative clarity at TourLink when route enquiries move to confirmed programmes."
          ru: "CFO. Отвечает за финансовую и административную ясность TourLink, когда маршрутные запросы переходят к подтверждённым программам."
          uz: "Moliya direktori. Marshrut so'rovlari tasdiqlangan dasturlarga o'tganda TourLinkda moliyaviy va ma'muriy aniqlik uchun javobgar."
      - type: "destinationInsight"
        icon: "user"
        title:
          en: "Eldor Keldibekov"
          ru: "Эльдор Келдибеков"
          uz: "Eldor Keldibekov"
        description:
          en: "Tour Sales & Operations Manager. Supports the Spanish-language direction and helps formulate route questions for Spanish-speaking travellers and partners."
          ru: "Tour Sales & Operations Manager. Поддерживает испаноязычное направление и помогает формулировать маршрутные вопросы для путешественников и партнёров на испанском языке."
          uz: "Tur sotuvi va operatsiyalar menejeri. Ispan tilidagi yo'nalishni qo'llab-quvvatlaydi va ispan tilida so'zlashuvchi sayohatchilar va hamkorlar uchun marshrut savollarini shakllantirishga yordam beradi."
      - type: "destinationInsight"
        icon: "user"
        title:
          en: "Alizhon Mamatkulov"
          ru: "Алижон Маматкулов"
          uz: "Alizhon Mamatkulov"
        description:
          en: "Tour Sales & Operations Manager. Supports the Japanese market and helps make route details clear for Japanese travellers and partners."
          ru: "Tour Sales & Operations Manager. Поддерживает запросы японского рынка и помогает делать детали маршрута понятными для японских путешественников и партнёров."
          uz: "Tur sotuvi va operatsiyalar menejeri. Yapon bozori so'rovlarini qo'llab-quvvatlaydi va marshrut tafsilotlarini yapon sayohatchilari va hamkorlari uchun tushunarli qilishga yordam beradi."
      - type: "destinationInsight"
        icon: "user"
        title:
          en: "Nozima Begmatova"
          ru: "Нозима Бегматова"
          uz: "Nozima Begmatova"
        description:
          en: "Tour Sales & Operations Manager. Supports English-language enquiries, route clarification and practical coordination until a programme is confirmed."
          ru: "Tour Sales & Operations Manager. Поддерживает англоязычные запросы, уточнение маршрута и практическую координацию до перехода программы к подтверждению."
          uz: "Tur sotuvi va operatsiyalar menejeri. Ingliz tilidagi so'rovlar, marshrutni aniqlashtirish va dastur tasdiqlanmaguncha amaliy muvofiqlashtirishni qo'llab-quvvatlaydi."
      - type: "destinationInsight"
        icon: "user"
        title:
          en: "Komila Kholmatova"
          ru: "Комила Холматова"
          uz: "Komila Xolmatova"
        description:
          en: "Tour Sales & Operations Manager. Works with English-language route enquiries and helps keep practical details visible while a proposal is prepared."
          ru: "Tour Sales & Operations Manager. Работает с англоязычными маршрутными запросами и помогает удерживать практические детали на виду во время подготовки предложения."
          uz: "Tur sotuvi va operatsiyalar menejeri. Ingliz tilidagi marshrut so'rovlari bilan ishlaydi va taklif tayyorlanayotganda amaliy tafsilotlarni ko'z oldida tutishga yordam beradi."
      - type: "destinationInsight"
        icon: "user"
        title:
          en: "Subin Kang"
          ru: "Субин Канг"
          uz: "Subin Kang"
        description:
          en: "Tour Sales & Operations Manager. Supports English and Korean directions as TourLink's regional DMC work develops."
          ru: "Tour Sales & Operations Manager. Поддерживает англоязычные и корейские направления по мере развития региональной DMC-работы TourLink."
          uz: "Tur sotuvi va operatsiyalar menejeri. TourLinkning mintaqaviy DMC ishi rivojlanishi bilan ingliz va koreys yo'nalishlarini qo'llab-quvvatlaydi."
      - type: "destinationInsight"
        icon: "user"
        title:
          en: "Madina Irgasheva"
          ru: "Мадина Иргашева"
          uz: "Madina Irgasheva"
        description:
          en: "Tour Sales & Operations Manager. Supports French-language communication and helps formulate route questions for French-speaking travellers and partners."
          ru: "Tour Sales & Operations Manager. Поддерживает коммуникацию на французском языке и помогает формулировать маршрутные вопросы для франкоязычных путешественников и партнёров."
          uz: "Tur sotuvi va operatsiyalar menejeri. Fransuz tilidagi muloqotni qo'llab-quvvatlaydi va fransuz tilida so'zlashuvchi sayohatchilar va hamkorlar uchun marshrut savollarini shakllantirishga yordam beradi."
  - blockType: "regular"
    eyebrow:
      en: "Development stages"
      ru: "Этапы развития"
      uz: "Rivojlanish bosqichlari"
    title:
      en: "How the TourLink platform grows"
      ru: "Как растёт платформа TourLink"
      uz: "TourLink platformasi qanday o'sadi"
    cards:
      - type: "servicesProcess"
        step: "Phase 1"
        title:
          en: "Phase 1 — present"
          ru: "Фаза 1 — настоящее"
          uz: "1-bosqich — hozirgi holat"
        description:
          en: "Tour operators, travel agencies and individual travellers work on the platform. Ready-made tours and custom programmes on request are available. Partner agents interact with operators through a single interface, see their commission and can request bespoke tours."
          ru: "На платформе работают туроператоры, турагентства и индивидуальные туристы. Доступны готовые туры и кастомные программы по запросу. Агенты-партнёры взаимодействуют с операторами через единый интерфейс, видят свою комиссию и могут запрашивать индивидуальные туры."
          uz: "Platformada turoperatorlar, tur agentliklari va individual sayohatchilar ishlaydi. Tayyor turlar va so'rov bo'yicha maxsus dasturlar mavjud. Hamkor agentlar operatorlar bilan yagona interfeys orqali muloqot qiladi, komissiyasini ko'radi va individual turlarni so'rashi mumkin."
      - type: "servicesProcess"
        step: "Phase 2"
        title:
          en: "Phase 2 — next step"
          ru: "Фаза 2 — следующий шаг"
          uz: "2-bosqich — keyingi qadam"
        description:
          en: "Opening the platform to hotels, transport, restaurants and other service providers. Travellers and agents can build a bespoke tour from separate services across suppliers."
          ru: "Открытие платформы для отелей, транспорта, ресторанов и других поставщиков услуг. Возможность для туриста или агента собирать индивидуальный тур из отдельных услуг разных поставщиков."
          uz: "Mehmonxonalar, transport, restoranlar va boshqa xizmat yetkazib beruvchilar uchun platformani ochish. Sayohatchi yoki agent turli yetkazib beruvchilarning alohida xizmatlaridan individual tur yig'ishi mumkin."
      - type: "servicesProcess"
        step: "Phase 3"
        title:
          en: "Phase 3 — ecosystem"
          ru: "Фаза 3 — экосистема"
          uz: "3-bosqich — ekotizim"
        description:
          en: "A full Central Asian ecosystem: a services marketplace, B2B module for agencies, analytics for operators, tools for guides and integrations with international booking systems."
          ru: "Полная экосистема Центральной Азии: маркетплейс услуг, B2B-модуль для агентств, аналитика для операторов, инструменты для гидов, интеграции с международными системами бронирования."
          uz: "Markaziy Osiyoning to'liq ekotizimi: xizmatlar bozori, agentliklar uchun B2B moduli, operatorlar uchun analitika, gidlar uchun vositalar va xalqaro bronlash tizimlari bilan integratsiyalar."
  - blockType: "regular"
    eyebrow:
      en: "Geography"
      ru: "География"
      uz: "Geografiya"
    title:
      en: "Where TourLink operates"
      ru: "Где работает TourLink"
      uz: "TourLink qayerda ishlaydi"
    description:
      en: "Uzbekistan · Kyrgyzstan · Kazakhstan · Tajikistan · Turkmenistan"
      ru: "Узбекистан · Кыргызстан · Казахстан · Таджикистан · Туркменистан"
      uz: "O'zbekiston · Qirg'iziston · Qozog'iston · Tojikiston · Turkmaniston"
    note:
      en: "In future — expansion to neighbouring Silk Road destinations while keeping the main focus on Central Asia."
      ru: "В перспективе — расширение на сопредельные направления Шёлкового пути, при сохранении основного фокуса на Центральной Азии."
      uz: "Kelajakda — Ipak yo'lining qo'shni yo'nalishlariga kengayish, asosiy fokus Markaziy Osiyoda qolgan holda."
  - blockType: "regular"
    eyebrow:
