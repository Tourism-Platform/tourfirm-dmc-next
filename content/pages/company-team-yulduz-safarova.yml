  - blockType: "regular"
    eyebrow:
      en: "About"
      ru: "О сотруднике"
      uz: "Xodim haqida"
    rows:
      - ratio: "1:2"
        left:
          - type: "portrait"
            image: "media/team/yulduz-safarova.jpg"
            title:
              en: "Yulduz Safarova"
              ru: "Юлдуз Сафарова"
              uz: "Yulduz Safarova"
        right:
          - type: "quote"
            quote:
              en: "Travel always drew me with the chance to discover new cities, so over time the interest in my own trips grew into a wish to organize travel for others."
              ru: "Путешествия всегда привлекали меня возможностью открывать новые города, поэтому со временем интерес к собственным поездкам перерос в желание организовывать путешествия для других."
              uz: "Sayohatlar yangi shaharlarni ochish imkoni bilan o'ziga tortgan, shuning uchun o'z sayohatlariga qiziqish boshqalar uchun sayohat tashkil qilish istagiga aylandi."
            caption:
              en: "Yulduz Safarova, travel expert"
              ru: "Юлдуз Сафарова, эксперт по путешествиям"
              uz: "Yulduz Safarova, sayohat eksperti"
          - type: "dashTitle"
            description:
              en: "I have been working in tourism since 2021. Meeting people and cultures has always interested me — and that is why I put trips together today."
              ru: "Я работаю в туризме с 2021 года. Мне всегда было интересно знакомиться с людьми и культурами — и это то, ради чего я собираю поездки сегодня."
              uz: "2021 yildan turizmda ishlayman. Odamlar va madaniyatlar bilan tanishish doim qiziq — bugun sayohatlarni shuning uchun yig'aman."
          - type: "dashTitle"
            title:
              en: "Education and languages"
              ru: "Образование и языки"
              uz: "Ta'lim va tillar"
            description:
              en: "By education I am a philologist. At work I use Uzbek, Russian, German, Turkish and English. My main markets are German-speaking — Germany, Austria and Switzerland — and Türkiye."
              ru: "По образованию я филолог. В работе использую узбекский, русский, немецкий, турецкий и английский языки, а основными для меня являются немецкоязычные рынки — Германия, Австрия и Швейцария, а также Турция."
              uz: "Ma'lumotim bo'yicha filolog. Ishda o'zbek, rus, nemis, turk va ingliz tillaridan foydalanaman. Asosiy bozorlarim — Germaniya, Avstriya, Shveysariya va Turkiya."
          - type: "dashTitle"
            title:
              en: "Approach"
              ru: "Подход"
              uz: "Yondashuv"
            description:
              en: "I especially like creating individual programs from how the traveler imagines the trip, not from a ready-made template. The client's interests always come first."
              ru: "Мне особенно нравится создавать индивидуальные программы, опираясь не на готовый шаблон, а на то, каким сам путешественник представляет свою поездку. Интересы клиента всегда стоят на первом месте."
              uz: "Tayyor shablon emas — sayyohning o'zi sayohatni qanday tasavvur qilishiga tayanib individual dastur tuzish yoqadi. Mijoz qiziqishlari har doim birinchi o'rinda."
  - blockType: "timeline"
    tone: "tint"
    layout: "horizontal"
    indicatorType: "number"
    eyebrow:
      en: "What I do"
      ru: "Чем я занимаюсь"
      uz: "Nima bilan shug'ullanaman"
    title:
      en: "The trip as a whole, from start to finish"
      ru: "Поездка целиком, от начала до конца"
      uz: "Sayohat butunlay, boshidan oxirigacha"
    description:
      en: "I organize almost every stage of the trip — the program is built around how the guest imagines it, not around a template."
      ru: "Я занимаюсь организацией путешествия практически на всех его этапах — программа собирается не из готового шаблона, а вокруг того, как гость сам представляет свою поездку."
      uz: "Sayohatning deyarli barcha bosqichlarini tashkil qilaman — dastur shablon emas, mehmonning tasavvuri atrofida yig'iladi."
    items:
      - title:
          en: "Guest expectations"
          ru: "Ожидания гостя"
          uz: "Mehmon kutganlari"
        description:
          en: "I introduce possible cities and routes and talk through different ways to travel."
          ru: "Знакомлю с возможными городами и маршрутами, рассказываю о разных вариантах путешествия."
          uz: "Mumkin bo'lgan shahar va marshrutlar bilan tanishtiraman, turli variantlarni aytib beraman."
      - title:
          en: "Program"
          ru: "Программа"
          uz: "Dastur"
        description:
          en: "I gradually shape the route from the guest's wishes — from start to finish."
          ru: "Постепенно формирую маршрут исходя из пожеланий гостя — от начала до конца."
          uz: "Mehmon istaklaridan kelib marshrutni asta-sekin — boshidan oxirigacha — shakllantiraman."
      - title:
          en: "Hotels, guides, tickets"
          ru: "Отели, гиды, билеты"
          uz: "Mehmonxonalar, gidlar, chiptalar"
        description:
          en: "Selecting and booking hotels, finding guides, rail and air tickets."
          ru: "Подбор и бронирование отелей, поиск гидов, железнодорожные и авиабилеты."
          uz: "Mehmonxona tanlash va bron, gidlar, temir yo'l va aviachiptalar."
      - title:
          en: "Meet and stay in touch"
          ru: "Встреча и связь"
          uz: "Kutib olish va aloqa"
        description:
          en: "When needed I meet guests. During the trip I stay in touch and am ready to help."
          ru: "При необходимости встречаю гостей. Во время поездки остаюсь на связи и готова помочь."
          uz: "Zarurat bo'lsa, mehmonlarni kutib olaman. Sayohat davomida aloqada va yordamga tayyorman."
    criteria:
      label:
        en: "What I take on"
        ru: "Что я беру на себя"
        uz: "Nimani o'z zimmamga olaman"
      title:
        en: "Seven parts of one trip"
        ru: "Семь частей одной поездки"
        uz: "Bitta sayohatning yetti qismi"
      description:
        en: "The guest does not have to assemble the trip from pieces or deal with several contractors."
        ru: "Гостю не приходится собирать поездку из кусков и договариваться с несколькими подрядчиками."
        uz: "Mehmon sayohatni bo'laklardan yig'maydi va bir nechta pudratchi bilan kelishmaydi."
      tags:
        - label:
            en: "Program"
            ru: "Программа"
            uz: "Dastur"
        - label:
            en: "Hotels"
            ru: "Отели"
            uz: "Mehmonxonalar"
        - label:
            en: "Guides"
            ru: "Гиды"
            uz: "Gidlar"
        - label:
            en: "Rail tickets"
            ru: "Ж/д билеты"
            uz: "Temir yo'l chiptalari"
        - label:
            en: "Air tickets"
            ru: "Авиабилеты"
            uz: "Aviachiptalar"
        - label:
            en: "Routes"
            ru: "Маршруты"
            uz: "Marshrutlar"
        - label:
            en: "Meeting guests"
            ru: "Встреча гостей"
            uz: "Mehmonlarni kutib olish"
  - blockType: "regular"
    eyebrow:
      en: "Principle"
      ru: "Принцип"
      uz: "Tamoyil"
    title:
      en: "What remains after the trip"
      ru: "Что остаётся после поездки"
      uz: "Sayohatdan keyin nima qoladi"
    rows:
      - left:
          - type: "quote"
            quoteVariant: "wide"
            quote:
              en: "What inspires me most in tourism is the moment of saying goodbye: when a person has not only seen the sights, but fallen in love with my country and already starts missing it."
              ru: "Больше всего в туризме меня вдохновляет момент прощания с гостями: когда человек не просто увидел достопримечательности, а полюбил мою страну и уже начинает по ней скучать."
              uz: "Turizmda eng ilhomlantiradigan narsa xayrlashuv: odam nafaqat diqqatga sazovor joylarni ko'rdi, balki yurtimni sevib qoldi va allaqachon sog'ina boshladi."
            caption:
              en: "The most rewarding result of the work"
              ru: "Самый приятный результат работы"
              uz: "Ishning eng yoqimli natijasi"
      - ratio: "3:2"
        left:
          - type: "dashTitle"
            title:
              en: "What matters at work"
              ru: "Что важно в работе"
              uz: "Ishda nima muhim"
            description:
              en: "I especially value precision, attention to detail, responsibility, flexibility and genuine hospitality. A good trip for me is one in which a person feels calm, safe and comfortable even in an unfamiliar country."
              ru: "Я особенно ценю точность, внимание к деталям, ответственность, гибкость и искреннее гостеприимство. Хорошее путешествие для меня — это путешествие, в котором человек даже в незнакомой стране чувствует себя спокойно, безопасно и комфортно."
              uz: "Aniqlik, detallarga e'tibor, mas'uliyat, moslashuvchanlik va samimiy mehmondo'stlikni qadrlayman. Yaxshi sayohat — odam notanish mamlakatda ham xotirjam, xavfsiz va qulay his qiladigan sayohat."
          - type: "dashTitle"
            description:
              en: "After discovering Uzbekistan many guests say they would like to come again."
              ru: "После знакомства с Узбекистаном многие гости говорят, что хотели бы приехать снова."
              uz: "O'zbekiston bilan tanishgach ko'p mehmonlar yana kelishni xohlayotganini aytadi."
        right:
          - type: "dashTitle"
            title:
              en: "What result means to me"
              ru: "Что для меня результат"
              uz: "Men uchun natija"
            description:
              en: "I want a trip to Uzbekistan to give guests surprise and joy — and after they return home, a light longing for our country."
              ru: "Я хочу, чтобы поездка в Узбекистан дарила гостям удивление и радость, а после возвращения домой оставляла лёгкую тоску по нашей стране."
              uz: "O'zbekistonga sayohat mehmonlarga hayrat va quvonch bersin, uyga qaytgach esa yurtimizga yengil sog'inch qolsin."
          - type: "valuePoint"
            title:
              en: "Precision"
              ru: "Точность"
              uz: "Aniqlik"
            description:
              en: "Attention to detail at every stage of the program."
              ru: "Внимание к деталям на каждом этапе программы."
              uz: "Dasturning har bosqichida detallarga e'tibor."
          - type: "valuePoint"
            title:
              en: "Responsibility and flexibility"
              ru: "Ответственность и гибкость"
              uz: "Mas'uliyat va moslashuvchanlik"
            description:
              en: "The plan holds, but it adapts to the guest."
              ru: "План держится, но подстраивается под гостя."
              uz: "Reja saqlanadi, lekin mehmonga moslashadi."
          - type: "valuePoint"
            title:
              en: "Genuine hospitality"
              ru: "Искреннее гостеприимство"
              uz: "Samimiy mehmondo'stlik"
            description:
              en: "Calm, safe and comfortable — even in an unfamiliar country."
              ru: "Спокойно, безопасно и комфортно — даже в незнакомой стране."
              uz: "Xotirjam, xavfsiz va qulay — hatto notanish mamlakatda ham."
