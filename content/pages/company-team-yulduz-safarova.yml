  - blockType: "regular"
    eyebrow:
      en: "Principle"
      ru: "Принцип"
      uz: "Tamoyil"
    title:
      en: "Fall in love with the country, not just see it" # Исправлен перевод (был русский)
      ru: "Полюбить страну, а не только увидеть её"
      uz: "Mamlakatni ko'rish emas, balki sevib qolish" # Исправлен перевод (был русский)
    rows:
      - ratio: "2:1"
        left:
          - type: "quote"
            quote:
              en: "I want a trip to Uzbekistan to bring guests surprise and joy, and after returning home, to leave a gentle longing for our country." # Исправлен перевод
              ru: "Я хочу, чтобы поездка в Узбекистан дарила гостям удивление и радость, а после возвращения домой оставляла лёгкую тоску по нашей стране."
              uz: "Men O'zbekistonga sayohat mehmonlarga hayrat va quvonch baxsh etishini va uyga qaytgandan keyin mamlakatimizga nisbatan engil sog'inch qoldirishini xohlayman." # Исправлен перевод
          - type: "dashTitle"
            title:
              en: "How I work" # Исправлен перевод
              ru: "Как я работаю"
              uz: "Qanday ishlayman" # Исправлен перевод
            description:
              en: "In my work, I particularly value precision, attention to detail, responsibility, flexibility, and genuine hospitality. A good trip for me is one where a person feels calm, safe, and comfortable, even in an unfamiliar country. I want a trip to Uzbekistan to bring guests surprise and joy, and after returning home, to leave a gentle longing for our country." # Исправлен перевод
              ru: "В своей работе я особенно ценю точность, внимание к деталям, ответственность, гибкость и искреннее гостеприимство. Хорошее путешествие для меня — это путешествие, в котором человек даже в незнакомой стране чувствует себя спокойно, безопасно и комфортно. Я хочу, чтобы поездка в Узбекистан дарила гостям удивление и радость, а после возвращения домой оставляла лёгкую тоску по нашей стране."
              uz: "Ishimda men ayniqsa aniqlik, detallarga e'tibor, mas'uliyat, moslashuvchanlik va samimiy mehmondo'stlikni qadrlayman. Men uchun yaxshi sayohat — bu odam hatto notanish mamlakatda ham o'zini xotirjam, xavfsiz va qulay his qiladigan sayohatdir. Men O'zbekistonga sayohat mehmonlarga hayrat va quvonch baxsh etishini va uyga qaytgandan keyin mamlakatimizga nisbatan engil sog'inch qoldirishini xohlayman." # Исправлен перевод
        right:
          - type: "dashTitle"
            title:
              en: "What result means to me" # Исправлен перевод (был русский)
              ru: "Что для меня результат"
              uz: "Men uchun natija nima" # Исправлен перевод (был русский)
            description:
              en: "Knowing that a person didn't just see the sights, but truly fell in love with my country and is already starting to miss it." # Исправлен перевод
