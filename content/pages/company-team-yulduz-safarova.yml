    description:
      en: "By education, I am a philologist. In my work, I use Uzbek, Russian, German, Turkish, and English, and my primary focus is the German-speaking markets — Germany, Austria, and Switzerland — as well as Türkiye. I introduce guests to possible cities and routes, tell them about different travel options, and gradually build a program based on their preferences." # Исправлен перевод
      ru: "По образованию я филолог. В работе использую узбекский, русский, немецкий, турецкий и английский языки, а основными для меня являются немецкоязычные рынки — Германия, Австрия и Швейцария, а также Турция. Я знакомлю гостя с возможными городами и маршрутами, рассказываю о разных вариантах путешествия и постепенно формирую программу исходя из его пожеланий."
      uz: "Ma'lumoti bo'yicha men filologman. Ishda o'zbek, rus, nemis, turk va ingliz tillaridan foydalanaman, asosiy yo'nalishlarim esa nemis tilidagi bozorlar — Germaniya, Avstriya va Shveytsariya, shuningdek Turkiya. Men mehmonlarni mumkin bo'lgan shaharlar va marshrutlar bilan tanishtiraman, sayohatning turli variantlari haqida gapirib beraman va asta-sekin ularning istaklariga asoslanib dastur tuzaman." # Исправлен перевод
