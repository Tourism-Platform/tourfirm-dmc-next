            quote:
              en: "I have been working in tourism since 2021. Travel has always attracted me with the opportunity to discover new cities, meet people, and explore cultures, so over time my interest in my own trips grew into a desire to organize travel for others." # Исправлен перевод
              ru: "Я работаю в туризме с 2021 года. Путешествия всегда привлекали меня возможностью открывать новые города, знакомиться с людьми и культурами, поэтому со временем интерес к собственным поездкам перерос в желание организовывать путешествия для других."
              uz: "Men 2021 yildan beri turizmda ishlayman. Sayohatlar meni har doim yangi shaharlarni kashf qilish, odamlar va madaniyatlar bilan tanishish imkoniyati bilan jalb qilgan, shuning uchun vaqt o'tishi bilan o'z sayohatlarimga bo'lgan qiziqish boshqalar uchun sayohatlar tashkil qilish istagiga aylandi." # Исправлен перевод
          - type: "dashTitle"
            title:
              en: "Role"
              ru: "Роль"
              uz: "Rol"
            description:
              en: "Travel Expert. German-Speaking Markets — Germany, Austria, and Switzerland — as well as Türkiye. By education — philologist." # Исправлен перевод
              ru: "Эксперт по путешествиям. Немецкоязычные рынки — Германия, Австрия и Швейцария, а также Турция. По образованию филолог."
              uz: "Sayohat Eksperti. Nemis Tilidagi Bozorlar — Germaniya, Avstriya va Shveytsariya, shuningdek Turkiya. Ma'lumoti — filolog." # Исправлен перевод
          - type: "dashTitle"
            title:
              en: "Approach"
              ru: "Подход"
              uz: "Yondashuv"
            description:
              en: "At the start of my work, it's important for me to understand the guest's expectations. I introduce them to possible cities and routes, tell them about different travel options, and gradually build a program based on their preferences." # Исправлен перевод
              ru: "В начале работы мне важно понять ожидания гостя. Я знакомлю его с возможными городами и маршрутами, рассказываю о разных вариантах путешествия и постепенно формирую программу исходя из его пожеланий."
              uz: "Ish boshida men uchun mehmonning kutganlarini tushunish muhim. Men ularni mumkin bo'lgan shaharlar va marshrutlar bilan tanishtiraman, sayohatning turli variantlari haqida gapirib beraman va asta-sekin ularning istaklariga asoslanib dastur tuzaman." # Исправлен перевод
      - left:
          - type: "dashTitle"
            title:
              en: "How I see the country"
              ru: "Как я смотрю на страну"
              uz: "Mamlakatga qanday qarayman"
            description:
              en: "What inspires me most in tourism is the moment of saying goodbye to guests. After getting to know Uzbekistan, many say they would like to come again. For me, this is one of the most rewarding results of my work: knowing that a person didn't just see the sights, but truly fell in love with my country and is already starting to miss it." # Исправлен перевод
              ru: "Больше всего в туризме меня вдохновляет момент прощания с гостями. После знакомства с Узбекистаном многие говорят, что хотели бы приехать снова. Для меня это один из самых приятных результатов работы: понимать, что человек не просто увидел достопримечательности, а действительно полюбил мою страну и уже начинает по ней скучать."
              uz: "Turizmda meni eng ko'p mehmonlar bilan xayrlashish lahzasi ilhomlantiradi. O'zbekiston bilan tanishgandan so'ng, ko'pchilik yana kelishni xohlashlarini aytishadi. Men uchun bu ishning eng yoqimli natijalaridan biri: odam shunchaki diqqatga sazovor joylarni ko'rmaganini, balki mening mamlakatimni chin dildan sevib qolganini va allaqachon uni sog'ina boshlaganini tushunish." # Исправлен перевод
  - blockType: "regular"
    eyebrow:
      en: "Work"
      ru: "Направления"
      uz: "Yo'nalishlar"
    title:
      en: "What I do"
      ru: "Чем я занимаюсь"
      uz: "Nima bilan shug'ullanaman"
    description:
      en: "I handle trip organization at almost every stage: I build the program from start to finish, select and book hotels, find guides, arrange train and flight tickets, plan routes, and meet guests when needed. I particularly enjoy creating custom programs based not on a ready-made template, but on how the traveler imagines their trip. For me, the client's interests always come first, and during the trip itself, it's especially important to stay in touch and be ready to help." # Исправлен перевод
      ru: "Я занимаюсь организацией путешествия практически на всех его этапах: составляю программу от начала до конца, подбираю и бронирую отели, нахожу гидов, организую железнодорожные и авиабилеты, продумываю маршруты и при необходимости встречу гостей. Мне особенно нравится создавать индивидуальные программы, опираясь не на готовый шаблон, а на то, каким сам путешественник представляет свою поездку. Для меня интересы клиента всегда стоят на первом месте, а во время самой поездки особенно важно оставаться на связи и быть готовой помочь."
      uz: "Men sayohatni tashkil qilishning deyarli barcha bosqichlarida ishtirok etaman: dasturni boshidan oxirigacha tuzaman, mehmonxonalarni tanlayman va bron qilaman, gidlar topaman, temir yo'l va aviachiptalarni tashkil qilaman, marshrutlarni rejalashtiraman va kerak bo'lganda mehmonlarni kutib olaman. Menga ayniqsa, tayyor shablonga emas, balki sayoatchining o'z sayohatini qanday tasavvur qilishiga asoslangan holda shaxsiy dasturlar yaratish yoqadi. Men uchun mijozning manfaatlari har doim birinchi o'rinda turadi va sayohat davomida aloqada bo'lish va yordam berishga tayyor bo'lish ayniqsa muhimdir." # Исправлен перевод
