              uz: "Odam shunchaki diqqatga sazovor joylarni ko'rmaganini, balki mening mamlakatimni chin dildan sevib qolganini va allaqachon uni sog'ina boshlaganini tushunish." # Исправлен перевод
  - blockType: "regular"
    eyebrow:
      en: "Tips"
      ru: "Советы"
      uz: "Maslahatlar"
    title:
      en: "What I recommend to see" # Исправлен перевод (был русский)
      ru: "Что я рекомендую увидеть"
      uz: "Ko'rishni tavsiya qiladigan joylarim" # Исправлен перевод (был русский)
    description:
      en: "Bukhara holds a special place for me — the city where I was born and raised. But one of my most beloved places in Uzbekistan remains Khiva. There, I get the feeling of having traveled back several centuries. The old city, historical monuments, and sincere, warm-hearted people create a truly special atmosphere. Khiva is a place I can discover again and again. For those who want to see a less familiar side of Uzbekistan, I also recommend paying attention to Surkhandarya. And I would always complement getting to know our country with local cuisine: plov, Khivan shivit oshi, and, for example, cooking plov together with locals in a traditional house in Bukhara. These are the moments that allow you not just to see the country, but to feel it from within." # Исправлен перевод
      ru: "Особое место для меня занимает Бухара — город, где я родилась и выросла. Но одним из самых любимых мест в Узбекистане остаётся Хива. Там у меня возникает ощущение, будто я перенеслась на несколько веков назад. Старый город, исторические памятники и искренние, доброжелательные люди создают совершенно особую атмосферу. Именно Хиву я могу открывать для себя снова и снова. Тем, кто хочет увидеть менее привычный Узбекистан, я также советую обратить внимание на Сурхандарью. А знакомство с нашей страной я обязательно дополнила бы местной кухней: пловом, хивинским шивит оши и, например, приготовлением плова вместе с местными жителями в традиционном доме в Бухаре. Именно такие моменты позволяют не просто посмотреть страну, а почувствовать её изнутри."
      uz: "Buxoro men uchun alohida o'rin tutadi — tug'ilib o'sgan shahrim. Ammo O'zbekistondagi eng sevimli joylarimdan biri Xiva bo'lib qolmoqda. U yerda men bir necha asr orqaga ketgandek his qilaman. Eski shahar, tarixiy yodgorliklar va samimiy, mehribon odamlar butunlay o'ziga xos atmosferani yaratadi. Aynan Xivani men qayta-qayta kashf qila olaman. O'zbekistonning kamroq tanish tomonini ko'rmoqchi bo'lganlarga Surxondaryoga e'tibor berishni maslahat beraman. Mamlakatimiz bilan tanishishni esa men albatta mahalliy oshxona bilan to'ldirgan bo'lardim: plov, xivalik shivit oshi va, masalan, Buxorodagi an'anaviy uyda mahalliy aholi bilan birgalikda plov tayyorlash. Aynan shunday lahzalar mamlakatni shunchaki ko'rishga emas, balki uni ichidan his qilishga imkon beradi." # Исправлен перевод
