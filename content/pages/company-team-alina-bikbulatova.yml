          ru: "Сопровождение"
          uz: "Hamrohlik"
        description:
          en: "I stay in touch: directions, translation help, sorting out a booking."
          ru: "Остаюсь на связи: подсказать дорогу, помочь с переводом, разобраться с бронированием."
          uz: "Aloqada qolaman: yo'l ko'rsatish, tarjima, bronni tushunish."
    criteria:
      label:
