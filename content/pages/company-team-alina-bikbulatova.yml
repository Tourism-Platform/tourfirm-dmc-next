              en: "Alina Bikbulatova"
              ru: "Алина Бикбулатова"
              uz: "Alina Bikbulatova"
        right:
          - type: "quote"
            quote:
              en: "I genuinely love travel, new countries and other cultures. Now I enjoy helping others discover the world with the same interest."
              ru: "Я сама искренне люблю путешествия, новые страны и знакомство с другими культурами. Теперь мне нравится помогать другим открывать мир с тем же интересом."
              uz: "Sayohat, yangi mamlakatlar va boshqa madaniyatlarni chin dildan yaxshi ko'raman. Endi boshqalarga dunyoni shu qiziqish bilan ochishga yordam berish yoqadi."
            caption:
              en: "Alina Bikbulatova, travel expert"
              ru: "Алина Бикбулатова, эксперт по путешествиям"
              uz: "Alina Bikbulatova, sayohat eksperti"
          - type: "dashTitle"
            description:
              en: "I entered tourism in 2026. At TourLink I primarily work with the Italian market."
              ru: "Я пришла в туризм в 2026 году. В TourLink работаю прежде всего с итальянским рынком."
              uz: "Turizmga 2026 yilda keldim. TourLinkda asosan Italiya bozori bilan ishlayman."
          - type: "dashTitle"
            title:
              en: "Education and languages"
              ru: "Образование и языки"
              uz: "Ta'lim va tillar"
            description:
              en: "My education is in philology — I studied at Renessans University. I speak Russian and Italian fluently, and English at B2."
              ru: "Моё образование связано с филологией — я училась в университете Renessans на факультете филологии. Свободно говорю на русском и итальянском языках, владею английским на уровне B2."
              uz: "Ta'limim filologiya — Renessans universitetida o'qiganman. Rus va italyan tillarida erkin gaplashaman, ingliz — B2."
          - type: "dashTitle"
            title:
              en: "Approach"
              ru: "Подход"
              uz: "Yondashuv"
            description:
              en: "I prefer assembling a trip for a specific person rather than using a ready-made template. One guest wants quiet and a good hotel, another a packed program, food or active experiences. The route is built from those details."
              ru: "Мне особенно нравится работать не с готовыми шаблонами, а собирать путешествие под конкретного человека. Одному важны тишина и хороший отель, другому — насыщенная программа, гастрономия или активные впечатления. Именно из таких деталей постепенно складывается маршрут."
              uz: "Tayyor shablon emas — sayohatni odamga moslab yig'aman. Biriga tinchlik va yaxshi mehmonxona, boshqasiga boy dastur, gastronomiya yoki faol taassurot. Marshrut shu detallardan tuziladi."
  - blockType: "timeline"
