              ru: "Как я смотрю на страну"
              uz: "Mamlakatga qanday qarayman"
            description:
              en: "In my travels, I'm interested in almost everything: architecture, cuisine, history, nature, people, and everyday culture. I love places where a traveler can not just see a sight, but also see the work of craftsmen, meet people, and feel the local culture from the inside." # Исправлен перевод
              ru: "В путешествиях мне интересно практически всё: архитектура, кухня, история, природа, люди и повседневная культура. Я люблю места, в которых путешественник может не просто посмотреть достопримечательность, а увидеть работу мастеров, познакомиться с людьми и почувствовать местную культуру изнутри."
              uz: "Sayohatlarda menga deyarli hamma narsa qiziq: arxitektura, oshxona, tarix, tabiat, odamlar va kundalik madaniyat. Menga sayyoh diqqatga sazovor joyni shunchaki ko'ribgina qolmay, hunarmandlarning ishini ko'rishi, odamlar bilan tanishishi va mahalliy madaniyatni ichidan his qilishi mumkin bo'lgan joylar yoqadi." # Исправлен перевод
  - blockType: "regular"
