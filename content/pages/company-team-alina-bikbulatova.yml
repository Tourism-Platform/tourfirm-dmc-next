              uz: "Turizmga 2026 yilda keldim, chunki o'zim sayohat qilishni, yangi mamlakatlarni va boshqa madaniyatlarni o'rganishni chin dildan yaxshi ko'raman. Endi menga boshqalarga dunyoni xuddi shunday qiziqish va ilhom bilan kashf etishga yordam berish yoqadi." # Исправлен перевод
