    description:
      en: "My education is in philology — I studied at Renessans University on the philology faculty. I speak Russian and Italian fluently, and have English at a B2 level. At TourLink, I primarily work with the Italian market. When planning, I pay particular attention to logistics. It's important to me that the traveler does not waste unnecessary time on inconvenient transfers, and that hotels, transport, and other services meet their expectations." # Исправлен перевод
      ru: "Моё образование связано с филологией — я училась в университете Renessans на факультете филологии. Свободно говорю на русском и итальянском языках, владею английским на уровне B2. В TourLink я работаю прежде всего с итальянским рынком. При планировании я особенно внимательно отношусь к логистике. Для меня важно, чтобы путешественник не тратил лишнее время на неудобные переезды, а отели, транспорт и другие услуги соответствовали его ожиданиям."
      uz: "Mening ta'limim filologiya bilan bog'liq — men Renessans universitetining filologiya fakultetida o'qiganman. Rus va italyan tillarida erkin gaplashaman, ingliz tilini esa B2 darajasida bilaman. TourLink da men asosan Italiya bozori bilan ishlayman. Rejalashtirishda men logistikaga alohida e'tibor beraman. Men uchun sayohatchi noqulay ko'chishlarga ortiqcha vaqt sarflamasligi, mehmonxonalar, transport va boshqa xizmatlar uning kutganlariga mos kelishi muhim." # Исправлен перевод
