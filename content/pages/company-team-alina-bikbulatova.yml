    description:
      en: "I handle individual and group travel, including cultural, gastronomic, active, MICE, and VIP programs. My work covers the entire trip preparation cycle: itinerary planning, cost calculation, booking hotels and other services, arranging tickets and guides, as well as supporting the traveler from the start of planning until the tour's completion. One person values peace and a good hotel, another wants a packed program, gastronomy, or active experiences. The route gradually comes together from these details." # Исправлен перевод
      ru: "Я занимаюсь индивидуальными и групповыми путешествиями, культурными, гастрономическими, активными, MICE- и VIP-программами. В моей работе есть весь основной цикл подготовки поездки: составление программы, расчёт, бронирование отелей и других услуг, подбор билетов и гидов, а также сопровождение путешественника от начала планирования до завершения тура. Одному человеку важны тишина и хороший отель, другому — насыщенная программа, гастрономия или активные впечатления. Именно из таких деталей постепенно складывается маршрут."
      uz: "Men individual va guruhli sayohatlar, madaniy, gastronomik, faol, MICE va VIP dasturlar bilan shug'ullanaman. Mening ishim sayohatni tayyorlashning to'liq siklini o'z ichiga oladi: dastur tuzish, hisob-kitob, mehmonxonalar va boshqa xizmatlarni bron qilish, chiptalar va gidlarni tanlash, shuningdek, rejalashtirish boshlanishidan to tur tugaguniga qadar sayohatchiga hamrohlik qilish. Bir kishi uchun tinchlik va yaxshi mehmonxona muhim, boshqasi uchun esa boy dastur, gastronomiya yoki faol tajribalar. Aynan shu detallardan marshrut asta-sekin shakllanadi." # Исправлен перевод
