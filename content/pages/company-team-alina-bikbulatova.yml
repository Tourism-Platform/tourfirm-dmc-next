  - blockType: "regular"
    eyebrow:
      en: "Principle"
      ru: "Принцип"
      uz: "Tamoyil"
    title:
      en: "Why I mention the downsides in advance"
      ru: "Почему я говорю о минусах заранее"
      uz: "Kamchiliklarni nima uchun oldindan aytaman"
    rows:
      - left:
          - type: "quote"
            quoteVariant: "wide"
            quote:
              en: "If an option has drawbacks, I would rather mention them in advance than create a perfect picture that later does not match reality."
              ru: "Если у варианта есть недостатки, я предпочту рассказать о них заранее, а не создавать идеальную картинку, которая потом не совпадёт с реальностью."
              uz: "Agar variantda kamchilik bo'lsa, keyin haqiqatga to'g'ri kelmaydigan ideal rasm yaratishdan ko'ra, oldindan aytaman."
            caption:
              en: "Safety and honesty"
              ru: "Безопасность и честность"
              uz: "Xavfsizlik va rostgo'ylik"
      - ratio: "3:2"
        left:
          - type: "dashTitle"
            title:
              en: "What matters at work"
              ru: "Что важно в работе"
              uz: "Ishda nima muhim"
            description:
              en: "I do not recommend dubious services and work with reliable partners. For restaurants and experiences I look for a living local atmosphere, not only standard tourist spots."
              ru: "Я не рекомендую сомнительные услуги и стараюсь работать с надёжными партнёрами. При выборе ресторанов и впечатлений ищу места с живой местной атмосферой, а не только стандартные туристические точки."
              uz: "Shubhali xizmatlarni tavsiya etmayman, ishonchli hamkorlar bilan ishlayman. Restoran va taassurotlarda oddiy turistik nuqta emas, jonli mahalliy muhitni qidiraman."
          - type: "dashTitle"
            description:
              en: "Sometimes it is enough to quickly give directions, help with translation or sort out a booking — those small things often shape the overall impression."
              ru: "Иногда человеку достаточно быстро подсказать дорогу, помочь с переводом или разобраться с бронированием — именно такие небольшие вещи часто определяют общее впечатление от поездки."
              uz: "Ba'zan yo'lni tez ko'rsatish, tarjima yoki bron yetarli — shu kichik narsalar umumiy taassurotni belgilaydi."
        right:
          - type: "dashTitle"
            title:
              en: "What result means to me"
              ru: "Что для меня результат"
              uz: "Men uchun natija"
            description:
              en: "I most enjoy the moment when someone returns and says everything was as they imagined: a good hotel, the right recommendations, calm organization — and all they had to do was enjoy the trip."
              ru: "Больше всего мне нравится момент, когда человек возвращается из поездки и говорит, что всё оказалось именно таким, как он представлял: хороший отель, удачные рекомендации, спокойная организация — и ему оставалось только наслаждаться путешествием."
              uz: "Sayohatdan qaytib, hammasi tasavvurdagidek bo'lganini aytganda: yaxshi mehmonxona, to'g'ri tavsiyalar, tinch tashkilot — faqat zavqlanish qolgan."
          - type: "valuePoint"
            title:
              en: "Honesty"
              ru: "Честность"
              uz: "Rostgo'ylik"
            description:
              en: "The guest learns about drawbacks before booking, not on the ground."
              ru: "О недостатках варианта гость узнаёт до брони, а не на месте."
              uz: "Kamchiliklar haqida mehmon joyida emas, bron oldin biladi."
          - type: "valuePoint"
            title:
              en: "Reliable partners"
              ru: "Надёжные партнёры"
              uz: "Ishonchli hamkorlar"
            description:
              en: "Dubious services do not enter the program."
              ru: "Сомнительные услуги в программу не попадают."
              uz: "Shubhali xizmatlar dasturga kirmaydi."
          - type: "valuePoint"
            title:
              en: "Calm logistics"
              ru: "Спокойная логистика"
              uz: "Tinch logistika"
            description:
              en: "No extra hours on inconvenient transfers."
              ru: "Никаких лишних часов в неудобных переездах."
              uz: "Noqulay ko'chishlarda ortiqcha soatlar yo'q."
