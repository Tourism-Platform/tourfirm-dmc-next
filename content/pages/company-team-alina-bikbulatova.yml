    title:
      en: "What I recommend to see" # Исправлен перевод (был русский)
      ru: "Что я рекомендую увидеть"
      uz: "Ko'rishni tavsiya qiladigan joylarim" # Исправлен перевод (был русский)
    description:
      en: "In Uzbekistan, one of the places I find interesting is the Center of Islamic Civilization in Tashkent. I appreciate the blend of Eastern history, architecture, and its modern presentation. For those wanting to see Uzbekistan beyond the most famous routes, I would recommend Sentob in the Navoi region — a mountain village with traditional houses and a completely different atmosphere. I also really like the Fergana Valley, especially Margilan and Rishtan, where craft traditions remain part of modern life. From Uzbek cuisine, I definitely recommend trying not only plov but also the Khorezmian tuhum-barak. And near Samarkand, I consider getting acquainted with the traditional paper-making in Konigil a fascinating experience." # Исправлен перевод
      ru: "В Узбекистане одним из интересных для меня мест является Центр исламской цивилизации в Ташкенте. Мне близко сочетание истории Востока, архитектуры и современного способа её представления. А тем, кто хочет увидеть Узбекистан за пределами самых известных маршрутов, я бы посоветовала Сентоб в Навоийской области — горное село с традиционными домами и совершенно другой атмосферой. Мне также очень нравится Ферганская долина, особенно Маргилан и Риштан, где ремесленные традиции остаются частью современной жизни. Из узбекской кухни я обязательно советую попробовать не только плов, но и хорезмский тухум-барак. А одним из интересных впечатлений около Самарканда считаю знакомство с традиционным изготовлением бумаги в Конигиле."
      uz: "O'zbekistonda men uchun qiziqarli joylardan biri Toshkentdagi Islom sivilizatsiyasi markazidir. Menga Sharq tarixi, arxitektura va uni zamonaviy taqdim etish usulining uyg'unligi yaqin. Eng mashhur marshrutlardan tashqarida O'zbekistonni ko'rmoqchi bo'lganlarga Navoiy viloyatidagi Sentobni tavsiya qilgan bo'lardim — an'anaviy uylari va butunlay boshqa muhitga ega tog'li qishloq. Menga Farg'ona vodiysi, ayniqsa Marg'ilon va Rishton juda yoqadi, u yerda hunarmandchilik an'analari zamonaviy hayotning bir qismi bo'lib qolgan. O'zbek oshxonasidan men nafaqat plovni, balki xorazm tuxum-barag'ini ham tatib ko'rishni tavsiya qilaman. Samarqand yaqinidagi qiziqarli tajribalardan biri esa Konigilda an'anaviy qog'oz tayyorlash bilan tanishishdir." # Исправлен перевод
