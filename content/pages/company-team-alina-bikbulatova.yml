            description:
              en: "One of my main principles is safety and honesty. I do not recommend dubious services and try to work with reliable partners. For me, a good trip is one that goes smoothly, easily, and without unnecessary stress." # Исправлен перевод
              ru: "Один из моих главных принципов — безопасность и честность. Я также не рекомендую сомнительные услуги и стараюсь работать с надёжными партнёрами. Для меня хорошее путешествие — это прежде всего поездка, которая прошла спокойно, легко и без ненужного стресса."
              uz: "Mening asosiy tamoyillarimdan biri — xavfsizlik va rostgo'ylik. Men shubhali xizmatlarni tavsiya etmayman va ishonchli hamkorlar bilan ishlashga harakat qilaman. Men uchun yaxshi sayohat, bu avvalo tinch, oson va ortiqcha stresssiz o'tgan sayohatdir." # Исправлен перевод
