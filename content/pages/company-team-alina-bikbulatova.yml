          ru: "Отели, билеты, гиды"
          uz: "Mehmonxonalar, chiptalar, gidlar"
        description:
          en: "Hotel and service bookings, tickets and guides."
          ru: "Бронирование отелей и других услуг, подбор билетов и гидов."
          uz: "Mehmonxona va xizmat bronlari, chipta va gidlar."
      - title:
