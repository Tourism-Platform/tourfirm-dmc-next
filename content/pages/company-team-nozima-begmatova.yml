    description:
      en: "Nozima Begmatova supports English-language route enquiries at TourLink, helping clarify the shape of each trip and coordinating practical details until a programme is confirmed.\n\nShe keeps communication direct so travellers and partners always know the next step."
      ru: "Нозима Бегматова поддерживает англоязычные маршрутные запросы в TourLink, помогая уточнить форму каждой поездки и координировать практические детали до подтверждения программы.\n\nОна держит коммуникацию прямой, чтобы путешественники и партнёры всегда знали следующий шаг."
      uz: "Nozima Begmatova TourLinkda ingliz tilidagi marshrut so'rovlarini qo'llab-quvvatlaydi, har bir sayohat shaklini aniqlashtirishga va dastur tasdiqlanmaguncha amaliy tafsilotlarni muvofiqlashtirishga yordam beradi.\n\nU muloqotni to'g'ridan-to'g'ri saqlaydi, shunda sayohatchilar va hamkorlar har doim keyingi qadamni biladi."
