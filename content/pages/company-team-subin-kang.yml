  - blockType: "regular"
    eyebrow:
      en: "About"
      ru: "О сотруднике"
      uz: "Xodim haqida"
    rows:
      - ratio: "1:2"
        left:
          - type: "portrait"
            image: "media/team/kang-subin.jpg"
            title:
              en: "Kang Subin"
              ru: "Канг Субин"
              uz: "Kang Subin"
        right:
          - type: "quote"
            quote:
              en: "Over time I realized I wanted not only to discover new places myself, but also to help other travelers do so comfortably and with genuine interest."
              ru: "Со временем я поняла, что хочу не только открывать новые места сама, но и помогать другим путешественникам делать это комфортно и с интересом."
              uz: "Vaqt o'tishi bilan tushundim: yangi joylarni o'zim kashf qilishning o'zi yetarli emas — boshqa sayyohlarga ham qulay va qiziqarli qilishda yordam berishni xohlayman."
            caption:
              en: "Kang Subin, travel expert"
              ru: "Канг Субин, эксперт по путешествиям"
              uz: "Kang Subin, sayohat eksperti"
          - type: "dashTitle"
            description:
              en: "I have been working in tourism since 2024. I was drawn to this field by a love of travel and an interest in different countries and cultures."
              ru: "Я работаю в туризме с 2024 года. В эту сферу меня привели любовь к путешествиям и интерес к разным странам и культурам."
              uz: "2024 yildan beri turizmda ishlayman. Bu sohaga meni sayohatga muhabbat va turli mamlakatlar madaniyatiga qiziqish olib keldi."
          - type: "dashTitle"
            title:
              en: "Education and languages"
              ru: "Образование и языки"
              uz: "Ta'lim va tillar"
            description:
              en: "I earned a degree in tourism and Korean language at Kimyo International University. I am fluent in Russian, with English at C1, Korean at B2 and Spanish at B1."
              ru: "Я получила высшее образование в Международном университете Kimyo по направлению туризма и корейского языка. Свободно говорю на русском, владею английским на уровне C1, корейским на уровне B2 и испанским на уровне B1."
              uz: "Kimyo Xalqaro Universitetida turizm va koreys tili yo'nalishi bo'yicha oliy ma'lumot oldim. Rus tilida erkin gaplashaman, ingliz — C1, koreys — B2, ispan — B1."
          - type: "dashTitle"
            title:
              en: "Approach"
              ru: "Подход"
              uz: "Yondashuv"
            description:
              en: "With a guest, the right communication format matters most. I adapt to what is convenient: messaging, a phone call or a video call."
              ru: "В работе с гостем для меня особенно важна правильная коммуникация. Я стараюсь подстроиться под тот формат общения, который удобен самому путешественнику: переписку, телефонный разговор или видеозвонок."
              uz: "Mehmon bilan ishlashda to'g'ri muloqot formati muhim. Qulay bo'lganiga moslashaman: yozishma, telefon yoki videoqo'ng'iroq."
  - blockType: "timeline"
    tone: "tint"
    layout: "horizontal"
    indicatorType: "number"
    eyebrow:
      en: "What I do"
      ru: "Чем я занимаюсь"
      uz: "Nima bilan shug'ullanaman"
    title:
      en: "Routes beyond the usual set"
      ru: "Маршруты за пределами привычного набора"
      uz: "Odatdagi to'plamdan tashqaridagi marshrutlar"
    description:
      en: "Individual and group travel, cultural, gastronomic, active, MICE and VIP programs. I especially enjoy creating unconventional and exclusive routes."
      ru: "Индивидуальные и групповые путешествия, культурные, гастрономические, активные, MICE- и VIP-программы. Особенно интересно создавать нестандартные и эксклюзивные маршруты."
      uz: "Individual va guruhli sayohatlar, madaniy, gastronomik, faol, MICE va VIP dasturlar. Ayniqsa nostandart va eksklyuziv marshrutlar yaratish qiziq."
    items:
      - title:
          en: "Communication"
          ru: "Коммуникация"
          uz: "Muloqot"
        description:
          en: "Messaging, a phone call or a video call — whichever format is convenient for the guest."
          ru: "Переписка, телефонный разговор или видеозвонок — тот формат, который удобен самому гостю."
          uz: "Yozishma, telefon yoki videoqo'ng'iroq — mehmonga qulay format."
      - title:
          en: "Program and quote"
          ru: "Программа и расчёт"
          uz: "Dastur va hisob"
        description:
          en: "Route and program design, calculations. I factor in the desired comfort level and requirements for hotels, transport and guides."
          ru: "Составление маршрутов и программ, расчёты. Учитываю желаемый уровень комфорта и требования к отелям, транспорту и гидам."
          uz: "Marshrut va dastur tuzish, hisob-kitob. Istalgan qulaylik, mehmonxona, transport va gid talablarini hisobga olaman."
      - title:
          en: "Hotels and logistics"
          ru: "Отели и логистика"
          uz: "Mehmonxonalar va logistika"
        description:
          en: "Hotel and service bookings, transport logistics."
          ru: "Бронирование отелей и других услуг, транспортная логистика."
          uz: "Mehmonxona va xizmatlarni bron qilish, transport logistikasi."
      - title:
          en: "Meet and stay in touch"
          ru: "Встреча и связь"
          uz: "Kutib olish va aloqa"
        description:
          en: "When needed I meet guests at the airport in person. During the trip I stay in touch and check how things are going."
          ru: "При необходимости лично встречаю гостей в аэропорту. Во время поездки остаюсь на связи и интересуюсь, как всё проходит."
          uz: "Zarurat bo'lsa, aeroportda shaxsan kutib olaman. Sayohat davomida aloqada bo'lib, qanday ketayotganini so'rayman."
    criteria:
      label:
        en: "My focus"
        ru: "Моя специализация"
        uz: "Mutaxassisligim"
      title:
        en: "Nomad tourism and hard-to-reach places"
        ru: "Nomad tourism и труднодоступное"
        uz: "Nomad tourism va qiyin joylar"
      description:
        en: "These trips let you see the region far more deeply than through a standard set of famous sights."
        ru: "Такие поездки позволяют увидеть регион гораздо глубже, чем через стандартный набор известных достопримечательностей."
        uz: "Bunday sayohatlar mintaqani mashhur diqqatga sazovor joylarning standart to'plamidan ancha chuqurroq ko'rsatadi."
      tags:
        - label:
            en: "Active travel"
            ru: "Активные путешествия"
            uz: "Faol sayohatlar"
        - label:
            en: "Lesser-known places"
            ru: "Малоизвестные места"
            uz: "Kam tanilgan joylar"
        - label:
            en: "Hard-to-reach spots"
            ru: "Труднодоступные точки"
            uz: "Qiyin yetib boriladigan nuqtalar"
        - label:
            en: "Nomadic culture"
            ru: "Кочевая культура"
            uz: "Ko'chmanchi madaniyat"
        - label:
            en: "Nomad tourism"
            ru: "Nomad tourism"
            uz: "Nomad tourism"
        - label:
            en: "Exclusive routes"
            ru: "Эксклюзивные маршруты"
            uz: "Eksklyuziv marshrutlar"
  - blockType: "regular"
    eyebrow:
      en: "Principle"
      ru: "Принцип"
      uz: "Tamoyil"
    title:
      en: "What matters more than a sale"
      ru: "Что для меня важнее продажи"
      uz: "Sotuvdan muhimroq narsa"
    rows:
      - left:
          - type: "quote"
            quoteVariant: "wide"
            quote:
              en: "For me, trust between the traveler and the manager matters more than simply selling a program."
              ru: "Для меня доверие между путешественником и менеджером важнее попытки просто продать программу."
              uz: "Men uchun sayyoh va menejer o'rtasidagi ishonch dasturni shunchaki sotishdan muhimroq."
            caption:
              en: "Be honest with the client"
              ru: "Быть честной с клиентом"
              uz: "Mijoz bilan rostgo'y bo'lish"
      - ratio: "3:2"
        left:
          - type: "dashTitle"
            title:
              en: "What matters at work"
              ru: "Что важно в работе"
              uz: "Ishda nima muhim"
            description:
              en: "I see my strengths as responsibility, practicality and speed. I match services and routes to the person, and when choosing a hotel I look first at location, reviews and service level."
              ru: "Своими сильными сторонами я считаю ответственность, практичность и оперативность. Услуги и маршрут стараюсь подбирать индивидуально, а при выборе отеля обращаю внимание прежде всего на расположение, отзывы и уровень сервиса."
              uz: "Kuchli tomonlarim — mas'uliyat, amaliylik va tezkorlik. Xizmat va marshrutni odamga moslayman, mehmonxonada esa avvalo joylashuv, sharhlar va servis darajasiga qarabman."
          - type: "dashTitle"
            description:
              en: "What I like most about tourism is its pace: new people, new tasks, new countries and the chance to keep learning."
              ru: "Больше всего в туризме мне нравится его динамика: новые люди, новые задачи, новые страны и возможность постоянно узнавать что-то новое."
              uz: "Turizmda menga uning sur'ati yoqadi: yangi odamlar, vazifalar, mamlakatlar va doim o'rganish imkoni."
        right:
          - type: "dashTitle"
            title:
              en: "What result means to me"
              ru: "Что для меня результат"
              uz: "Men uchun natija"
            description:
              en: "The best result is when, after the trip, the person is genuinely happy with how everything was organized."
              ru: "Лучший результат моей работы — когда после завершения поездки человек остаётся действительно доволен тем, как всё было организовано."
              uz: "Eng yaxshi natija — sayohatdan keyin odam tashkilotdan chinakam mamnun bo'lishi."
          - type: "valuePoint"
            title:
              en: "Responsibility"
              ru: "Ответственность"
              uz: "Mas'uliyat"
            description:
              en: "For the whole program, not just separate bookings."
              ru: "За программу целиком, а не за отдельные брони."
              uz: "Butun dastur uchun, alohida bronlar uchun emas."
          - type: "valuePoint"
            title:
              en: "Practicality"
              ru: "Практичность"
              uz: "Amaliylik"
            description:
              en: "A solution that works, not one that only sounds good."
              ru: "Решение, которое работает, а не то, что красивее звучит."
              uz: "Ishlaydigan yechim, shunchaki chiroyli eshitiladigan emas."
          - type: "valuePoint"
            title:
              en: "Speed"
              ru: "Оперативность"
              uz: "Tezkorlik"
            description:
              en: "A reply comes quickly — including during the trip."
              ru: "Ответ приходит быстро — в том числе во время поездки."
              uz: "Javob tez keladi — jumladan sayohat paytida ham."
