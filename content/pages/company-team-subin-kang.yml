    description:
      en: "Subin Kang supports English and Korean directions at TourLink as the platform's regional DMC work develops.\n\nHe helps travellers and partners from both markets formulate route questions clearly and move toward confirmed programmes."
      ru: "Субин Канг поддерживает англоязычные и корейские направления в TourLink по мере развития региональной DMC-работы платформы.\n\nОн помогает путешественникам и партнёрам из обоих рынков чётко формулировать маршрутные вопросы и двигаться к подтверждённым программам."
      uz: "Subin Kang platformaning mintaqaviy DMC ishi rivojlanishi bilan TourLinkda ingliz va koreys yo'nalishlarini qo'llab-quvvatlaydi.\n\nU ikkala bozordagi sayohatchilar va hamkorlarga marshrut savollarini aniq shakllantirish va tasdiqlangan dasturlarga yaqinlashishga yordam beradi."
