      - ratio: "2:1"
        left:
          - type: "quote"
            quote:
              en: "One of my main professional principles is very simple — to be honest with the client. For me, trust between the traveler and the manager is more important than trying to simply sell a program." # Исправлен перевод
              ru: "Один из моих главных профессиональных принципов очень простой — быть честной с клиентом. Для меня доверие между путешественником и менеджером важнее попытки просто продать программу."
              uz: "Mening asosiy professional tamoyillarimdan biri juda oddiy — mijoz bilan rostgo'y bo'lish. Men uchun sayoatchi va menejer o'rtasidagi ishonch shunchaki dasturni sotishga urinishdan muhimroqdir." # Исправлен перевод
          - type: "dashTitle"
            title:
              en: "Main principle"
              ru: "Главный принцип"
              uz: "Asosiy tamoyil"
            description:
              en: "I consider responsibility, practicality, and efficiency to be my strengths. For me, trust between the traveler and the manager is more important than trying to simply sell a program." # Исправлен перевод
              ru: "Своими сильными сторонами я считаю ответственность, практичность и оперативность. Для меня доверие между путешественником и менеджером важнее попытки просто продать программу."
              uz: "O'zimning kuchli tomonlarim deb mas'uliyat, amaliylik va tezkorlikni hisoblayman. Men uchun sayoatchi va menejer o'rtasidagi ishonch shunchaki dasturni sotishga urinishdan muhimroqdir." # Исправлен перевод
