      en: "Tips"
      ru: "Советы"
      uz: "Maslahatlar"
    title:
      en: "What I recommend to see" # Исправлен перевод (был русский)
      ru: "Что я рекомендую увидеть"
      uz: "Ko'rishni tavsiya qiladigan joylarim" # Исправлен перевод (был русский)
    description:
      en: "One of my favorite places in Uzbekistan is Lyab-i Hauz Square in Bukhara. I love how here history becomes part of everyday city life: people relax by the water, meet in teahouses, and socialize against the backdrop of ancient architecture. This place becomes especially beautiful in the evening, when soft lighting appears and a completely different atmosphere emerges. For travelers who want to go beyond the most famous routes, I recommend paying attention to Surkhandarya. For me, Uzbekistan is interesting not only for Samarkand, Bukhara, and Khiva — there are still many places in the country that can surprise even an experienced traveler." # Исправлен перевод
      ru: "Одно из моих любимых мест в Узбекистане — площадь Ляби-Хауз в Бухаре. Мне нравится, как здесь история становится частью обычной городской жизни: люди отдыхают у воды, встречаются в чайханах и общаются на фоне старинной архитектуры. Особенно красивым это место становится вечером, когда появляется мягкий свет и совсем другая атмосфера. А путешественникам, которые хотят выйти за пределы самых известных маршрутов, я советую обратить внимание на Сурхандарью. Для меня Узбекистан интересен не только Самаркандом, Бухарой и Хивой — в стране ещё много мест, которые способны удивить даже опытного путешественника."
      uz: "O'zbekistondagi sevimli joylarimdan biri — Buxorodagi Lyabi-Xauz maydoni. Menga bu yerda tarix qanday qilib oddiy shahar hayotining bir qismiga aylanishi yoqadi: odamlar suv bo'yida dam olishadi, choyxonalarda uchrashishadi va qadimiy me'morchilik fonida suhbatlashishadi. Bu joy ayniqsa kechqurun, yumshoq yorug'lik paydo bo'lganda va butunlay boshqa atmosfera vujudga kelganda go'zal bo'ladi. Eng mashhur marshrutlardan tashqariga chiqmoqchi bo'lgan sayoatchilarga Surxondaryoga e'tibor berishni maslahat beraman. Men uchun O'zbekiston nafaqat Samarqand, Buxoro va Xiva bilan qiziqarli — mamlakatda hatto tajribali sayoatchini ham hayratda qoldiradigan ko'plab joylar hali bor." # Исправлен перевод
