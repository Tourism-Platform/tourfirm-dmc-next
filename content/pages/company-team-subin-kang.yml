    description:
      en: "I earned my higher education degree from Kimyo International University in Tourism and Korean Language. I am fluent in Russian, have English at a C1 level, Korean at B2, and Spanish at B1. In my work, I interact with travelers and partners from various countries, including the USA, Canada, the UK, Spain, South Korea, Australia, and Latin American countries." # Исправлен перевод
      ru: "Я получила высшее образование в Международном университете Kimyo по направлению туризма и корейского языка. Свободно говорю на русском языке, владею английским на уровне C1, корейским на уровне B2 и испанским на уровне B1. В работе я взаимодействую с путешественниками и партнёрами из разных стран, включая США, Канаду, Великобританию, Испанию, Южную Корею, Австралию и страны Латинской Америки."
      uz: "Men Kimyo Xalqaro Universitetida turizm va koreys tili yo'nalishi bo'yicha oliy ma'lumot oldim. Rus tilida erkin gaplashaman, ingliz tilini C1, koreys tilini B2 va ispan tilini B1 darajasida bilaman. Ishda men turli mamlakatlardan, jumladan AQSh, Kanada, Buyuk Britaniya, Ispaniya, Janubiy Koreya, Avstraliya va Lotin Amerikasi mamlakatlaridan kelgan sayoatchilar va hamkorlar bilan hamkorlik qilaman." # Исправлен перевод
