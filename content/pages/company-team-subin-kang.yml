            quote:
              en: "I have been working in tourism since 2024. I was drawn to this field by my love of travel and interest in different countries and cultures. Over time, I realized that I wanted not only to discover new places myself, but also to help other travelers do so comfortably and with genuine interest." # Исправлен перевод
              ru: "Я работаю в туризме с 2024 года. В эту сферу меня привели любовь к путешествиям и интерес к разным странам и культурам. Со временем я поняла, что хочу не только открывать новые места сама, но и помогать другим путешественникам делать это комфортно и с интересом."
              uz: "Men 2024 yildan beri turizmda ishlayman. Bu sohaga meni sayohatga bo'lgan muhabbat va turli mamlakatlar va madaniyatlarga qiziqish olib keldi. Vaqt o'tishi bilan men nafaqat o'zim yangi joylarni kashf qilishni, balki boshqa sayoatchilarga buni qulay va qiziqarli tarzda qilishga yordam berishni xohlayotganimni angladim." # Исправлен перевод
          - type: "dashTitle"
            title:
              en: "Role"
              ru: "Роль"
              uz: "Rol"
            description:
              en: "Travel Expert. English, Spanish, and Korean Markets. Education — Tourism and Korean Language, Kimyo International University." # Исправлен перевод
              ru: "Эксперт по путешествиям. Англоязычные, испаноязычные и корейский рынки. Образование — туризм и корейский язык, Международный университет Kimyo."
              uz: "Sayohat Eksperti. Ingliz, Ispan va Koreys Bozorlari. Ta'lim — turizm va koreys tili, Kimyo Xalqaro Universiteti." # Исправлен перевод
          - type: "dashTitle"
            title:
              en: "Approach"
              ru: "Подход"
              uz: "Yondashuv"
            description:
              en: "In working with guests, proper communication is especially important to me. I try to adapt to the communication format that is most convenient for the traveler: messaging, phone calls, or video calls." # Исправлен перевод
              ru: "В работе с гостем для меня особенно важна правильная коммуникация. Я стараюсь подстроиться под тот формат общения, который удобен самому путешественнику: переписку, телефонный разговор или видеозвонок."
              uz: "Mehmonlar bilan ishlashda men uchun to'g'ri muloqot ayniqsa muhim. Men sayoatchiga qulay bo'lgan muloqot formatiga moslashishga harakat qilaman: yozishmalar, telefon orqali suhbat yoki videoqo'ng'iroqlar." # Исправлен перевод
      - left:
          - type: "dashTitle"
            title:
              en: "How I see the country"
              ru: "Как я смотрю на страну"
              uz: "Mamlakatga qanday qarayman"
            description:
              en: "I am particularly interested in creating unconventional and exclusive routes. I am drawn to active travel, little-known and hard-to-reach places in Central Asia, as well as destinations related to nomadic culture and nomad tourism. Such trips allow you to see the region much more deeply than through the standard set of famous landmarks." # Исправлен перевод
              ru: "Особенно мне интересно создавать нестандартные и эксклюзивные маршруты. Мне близки активные путешествия, малоизвестные и труднодоступные места Центральной Азии, а также направления, связанные с кочевой культурой и nomad tourism. Такие поездки позволяют увидеть регион гораздо глубже, чем через стандартный набор известных достопримечательностей."
              uz: "Ayniqsa, menga nostandart va eksklyuziv marshrutlarni yaratish qiziq. Menga faol sayohatlar, Markaziy Osiyoning kam taniqli va qiyin yetib boriladigan joylari, shuningdek, ko'chmanchi madaniyat va nomad tourism bilan bog'liq yo'nalishlar yaqin. Bunday sayohatlar mintaqani mashhur diqqatga sazovor joylarning standart to'plamidan ko'ra ancha chuqurroq ko'rish imkonini beradi." # Исправлен перевод
  - blockType: "regular"
    eyebrow:
      en: "Work"
      ru: "Направления"
      uz: "Yo'nalishlar"
    title:
      en: "What I do"
      ru: "Чем я занимаюсь"
      uz: "Nima bilan shug'ullanaman"
    description:
      en: "I handle individual and group travel, cultural, gastronomic, active, MICE, and VIP programs. My work includes route and program planning, calculations, hotel and service bookings, transport logistics, and guest reception. When creating a program, I always consider the desired level of comfort, requirements for hotels, transport, and guides. I try to select services and routes individually, and during the trip itself I stay in touch and check in on how things are going. When necessary, I also personally meet guests at the airport." # Исправлен перевод
      ru: "Я занимаюсь индивидуальными и групповыми путешествиями, культурными, гастрономическими, активными, MICE- и VIP-программами. В моей работе есть составление маршрутов и программ, расчёты, бронирование отелей и других услуг, транспортная логистика и встреча гостей. При составлении программы я обязательно учитываю желаемый уровень комфорта, требования к отелям, транспорту и гидам. Услуги и маршрут стараюсь подбирать индивидуально, а во время самого путешествия остаюсь на связи и интересуюсь, как проходит поездка. При необходимости я также лично встречаю гостей в аэропорту."
      uz: "Men individual va guruhli sayohatlar, madaniy, gastronomik, faol, MICE va VIP dasturlar bilan shug'ullanaman. Mening ishim marshrutlar va dasturlarni tuzish, hisob-kitoblar, mehmonxonalar va boshqa xizmatlarni bron qilish, transport logistikasi va mehmonlarni kutib olishni o'z ichiga oladi. Dastur tuzishda men har doim istalgan qulaylik darajasini, mehmonxonalar, transport va gidlarga bo'lgan talablarni hisobga olaman. Xizmatlar va marshrutni individual tanlashga harakat qilaman va sayohat davomida aloqada bo'lib, sayohat qanday ketayotgani bilan qiziqaman. Zarur bo'lganda, men mehmonlarni aeroportda shaxsan kutib olaman." # Исправлен перевод
