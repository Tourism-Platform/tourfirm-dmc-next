  - blockType: "regular"
    eyebrow:
      en: "Principle"
      ru: "Принцип"
      uz: "Tamoyil"
    title:
      en: "Be honest with the client" # Исправлен перевод (был русский)
      ru: "Быть честной с клиентом"
      uz: "Mijoz bilan rostgo'y bo'lish" # Исправлен перевод (был русский)
