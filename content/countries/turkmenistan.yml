        "icon": "CircleQuestionMark"
        "title":
          "en": "How many nights work for a first trip to Turkmenistan?"
          "ru": "Сколько ночей оптимально для первой поездки (Туркменистан)?"
          "uz": "Turkmanistonga birinchi safar uchun necha tun yetarli?"
        "description":
          "en": "For a first programme, 7–10 nights usually holds: keep the classic spine readable, then add one extension only if the season and group pace allow it. Use “Marble capital, oasis ruins, and desert roads” as the brief for what the country actually sells."
          "ru": "Для первой программы обычно хватает 7–10 ночей: держите классическую линию читаемой и добавляйте одно расширение только если сезон и темп группы позволяют. Ориентир страны — «Мраморная столица, оазисные руины и пустынные дороги»."
          "uz": "Birinchi dastur uchun odatda 7–10 tun yetadi: klassik chiziqni o‘qiladigan tuting, kengaytmani esa mavsum va guruh sur’ati ruxsat bersagina qo‘shing. Mamlakat brifi — «Marmar poytaxt, voha xarobalari va cho‘l yo‘llari»."
      - "type": "destinationInsight"
        "icon": "Bus"
        "title":
          "en": "Where are the long transfers in Turkmenistan, and how do you soften them?"
          "ru": "Где в маршруте по стране «Туркменистан» длинные переезды и как их смягчить?"
          "uz": "Turkmaniston marshrutida uzun ko‘chishlar qayerda va ularni qanday yumshatish mumkin?"
        "description":
          "en": "Plan long road or rail legs as part of the product, not leftovers between hotels. Evening or overnight moves, buffer mornings, and one clear anchor per day keep Turkmenistan sellable for agencies."
          "ru": "Длинные ж/д или автомобильные участки планируйте как часть продукта, а не как остаток между отелями. Вечерние/ночные переезды, запас утра и один ясный якорь на день делают Туркменистан удобным для агентств."
          "uz": "Uzun temiryo‘l yoki avto bo‘limlarni mehmonxona orasidagi qoldiq emas, mahsulot qismi qiling. Kechki/tungi ko‘chish, ertalab zaxirasi va kuniga bitta aniq tayanch Turkmanistonni agentliklar uchun sotiladigan qiladi."
      - "type": "destinationInsight"
        "icon": "Landmark"
        "title":
          "en": "How do you mix culture and landscape in Turkmenistan without overload?"
          "ru": "Как совместить культуру и природу в программе по «Туркменистан» без перегруза?"
          "uz": "Turkmaniston dasturida madaniyat va tabiatni ortiqcha yuklamasdan qanday birlashtirish mumkin?"
        "description":
          "en": "Split the trip into readable chapters: heritage days, then one nature or foothill pause, then return to the main city line. Clients remember clarity more than packing every highlight into one week."
          "ru": "Делите поездку на читаемые главы: дни наследия, затем одна природная или предгорная пауза, затем возврат к основной городской линии. Клиенты лучше помнят ясность, чем попытку уместить все хайлайты в одну неделю."
          "uz": "Safarni o‘qiladigan boblarga bo‘ling: meros kunlari, keyin bitta tabiat yoki tog‘oldi pauza, so‘ng asosiy shahar chizig‘iga qaytish. Mijozlar bir haftaga hamma narsani tiqishdan ko‘ra aniqlikni eslaydi."
