          "ru": "Октябрь — самое сильное осеннее окно: пустынные дороги становятся легче, на руинах меньше жёсткой жары, а длинные переезды воспринимаются спокойнее. В сентябре ещё нужна осторожность; ноябрь лучше подходит для коротких культурных маршрутов."
          "uz": "Oktabr eng kuchli kuzgi davr: cho‘l yo‘llari yengillashadi, xarobalarda qattiq issiq kamayadi, uzun transferlar sokinroq seziladi. Sentabrda hali ehtiyot kerak; noyabr qisqaroq madaniy yo‘nalishlarga mos."
