      Мары и древний Мерв расширяют маршрут к оазисным руинам, сельджукскому кирпичу, свету пустыни и северному повороту к Куня-Ургенчу."
    "uz": "Turkmaniston masofa orqali ochiladi: Ashxobodning oq xiyobonlari Parfiya Nisasiga olib boradi.


      Mari va qadimiy Marv yoʻlni voha xarobalari, saljuqiy gʻisht, choʻl yorugʻi va Koʻhna Urganch tomon kengaytiradi."
