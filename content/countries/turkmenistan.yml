      "uz": "Issiq, cho‘l qulayligi, qisqa kunduz va joylarga kirish mamlakatni tez o‘zgartiradi; to‘g‘ri mavsum yo‘nalishga qancha ochiq yo‘l kerakligiga bog‘liq."
