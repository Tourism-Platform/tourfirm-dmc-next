          "ru": "Зима декабрь-февраль"
          "uz": "Qish dekabr-fevral"
        "title":
          "en": "Winter"
          "ru": "Зима"
          "uz": "Qish"
        "description":
          "en": "Cold, quiet, and lower-demand. Winter suits travelers who prefer empty courtyards and do not mind a coat."
          "ru": "Холодно, тихо, спрос ниже. Зима подходит тем, кто любит пустые дворы и не против тёплой куртки."
          "uz": "Sovuq, sokin, talab pastroq. Qish boʻsh hovlilarni yoqtiradigan va issiq kiyimdan choʻchimaydiganlar uchun."
