          uz: Eski shahar, Po'i Kalon, Ark va savdo gumbazlari.
      - type: destinationInsight
        icon: Castle
        title:
          en: "Day 7+: Khiva"
          ru: "День 7+: Хива"
          uz: "7+-kun: Xiva"
        description:
          en: Itchan Kala and fortress-wall heritage.
          ru: Ичан-Кала и крепостные стены.
          uz: Ichan Qal'a va qal'a devorlari.

  - blockType: regular
    eyebrow:
      en: Seasons
      ru: Сезоны
      uz: Mavsumlar
    title:
      en: Seasonal rhythm
      ru: Сезонный ритм
      uz: Mavsumiy ritm
    description:
      en: Desert cities are hottest in July–August; mountains stay cooler year-round.
      ru: В пустынных городах жарко в июле–августе; в горах прохладнее круглый год.
      uz: Cho'l shaharlarida iyul–avgustda issiq; tog'larda yil bo'yi salqinroq.
    gridClassName: sm:grid-cols-2 lg:grid-cols-4
    cards:
      - type: tripFormat
        icon: CalendarDays
        badge:
          en: Spring
          ru: Весна
          uz: Bahor
        title:
          en: April–May
          ru: Апрель–май
          uz: Aprel–may
        description:
          en: Green valleys, mild temperatures, ideal for city walking.
          ru: Зелёные долины, мягкая погода, идеально для прогулок по городам.
          uz: Yashil vodiyalar, yumshoq harorat, shahar sayriga qulay.
      - type: tripFormat
        icon: SunMedium
        badge:
          en: Summer
          ru: Лето
          uz: Yoz
        title:
          en: June–August
          ru: Июнь–август
          uz: Iyun–avgust
        description:
          en: Very hot in Bukhara and Khiva; better in mountains.
          ru: Очень жарко в Бухаре и Хиве; комфортнее в горах.
          uz: Buxoro va Xivada juda issiq; tog'larda yaxshiroq.
      - type: tripFormat
        icon: Leaf
        badge:
          en: Autumn
          ru: Осень
          uz: Kuz
        title:
          en: September–October
          ru: Сентябрь–октябрь
          uz: Sentyabr–oktyabr
        description:
          en: Harvest season, clear skies — best overall window.
          ru: Сезон урожая, ясное небо — лучшее окно в целом.
          uz: Hosil mavsumi, ochiq osmon — umumiy eng yaxshi oyna.
      - type: tripFormat
        icon: Snowflake
        badge:
          en: Winter
          ru: Зима
          uz: Qish
        title:
          en: November–March
          ru: Ноябрь–март
          uz: Noyabr–mart
        description:
          en: Fewer tourists, cold in mountains, mild in Tashkent.
          ru: Меньше туристов, холод в горах, мягче в Ташкенте.
          uz: Kamroq sayohatchi, tog'larda sovuq, Toshkentda yumshoqroq.

  - blockType: regular
    eyebrow:
      en: Planning
      ru: Практика
      uz: Amaliyot
    title:
      en: Practical notes
      ru: Полезные заметки
      uz: Foydali eslatmalar
    description:
      en: Spring and autumn are ideal. The Afrosiyob high-speed train links Tashkent, Samarkand and Bukhara in 2–2.5 hours.
      ru: Весна и осень — оптимальны. Скоростной поезд «Афросиёб» связывает Ташкент, Самарканд и Бухару за 2–2,5 часа.
      uz: Bahor va kuz ideal. Afrosiyob tezkor poyezdi Toshkent, Samarqand va Buxoroni 2–2,5 soatda bog'laydi.
    gridClassName: sm:grid-cols-2 lg:grid-cols-3
    cards:
      - type: destinationInsight
        icon: Map
        title:
          en: Best season
          ru: Лучший сезон
          uz: Eng yaxshi mavsum
        description:
          en: April–May and September–October avoid summer heat in the desert cities.
          ru: Апрель–май и сентябрь–октябрь помогают избежать летней жары в пустынных городах.
          uz: Aprel–may va sentyabr–oktyabr cho'l shaharlaridagi yoz issig'idan qochishga yordam beradi.
      - type: destinationInsight
        icon: Clock3
        title:
          en: Classic timing
          ru: Классический срок
          uz: Klassik muddat
        description:
          en: Allow 7–10 days for the Golden Triangle; add Khiva for a fuller two-week loop.
          ru: Заложите 7–10 дней на Золотой треугольник; добавьте Хиву для двухнедельного кольца.
          uz: Oltin uchburchak uchun 7–10 kun qoldiring; ikki haftalik halqa uchun Xivani qo'shing.
      - type: destinationInsight
        icon: Train
        title:
          en: Getting around
          ru: Передвижение
          uz: Harakatlanish
        description:
          en: Afrosiyob train between major cities; Yandex Go works well for local rides in Tashkent.
          ru: «Афросиёб» между крупными городами; Yandex Go удобен для локальных поездок в Ташкенте.
          uz: Yirik shaharlar orasida Afrosiyob; Toshkentda mahalliy sayohatlar uchun Yandex Go qulay.

  - blockType: regular
    eyebrow:
      en: Routes in detail
      ru: Маршруты в деталях
      uz: Marshrut tafsilotlari
    title:
      en: How route pacing works in practice
      ru: Как темп маршрута работает на практике
      uz: Marshrut tempi amalda qanday ishlaydi
    description:
      en: Use these notes to brief clients on transfer times and overnight logic.
      ru: Используйте эти заметки для брифа клиентов по переездам и логике ночёвок.
      uz: Mijozlarga transfer va tunlash mantiqini tushuntirish uchun ushbu eslatmalardan foydalaning.
    gridClassName: sm:grid-cols-1 lg:grid-cols-1
    cards:
      - type: destinationInsight
        icon: HelpCircle
        title:
          en: How many nights are ideal for first-time Uzbekistan?
          ru: Сколько ночей оптимально для первой поездки в Узбекистан?
          uz: O'zbekistonga birinchi safar uchun necha tun optimal?
        description:
          en: "Most first programs work best with 7-10 nights: Tashkent arrival, 2 nights Samarkand, 2 nights Bukhara, and optional Khiva extension."
          ru: "Для первой программы обычно хватает 7–10 ночей: прилёт в Ташкент, 2 ночи в Самарканде, 2 в Бухаре и опционально Хива."
          uz: "Birinchi dastur uchun odatda 7–10 tun yetadi: Toshkentga kelish, Samarqandda 2 tun, Buxoroda 2 tun va ixtiyoriy Xiva kengaytmasi."
      - type: destinationInsight
        icon: HelpCircle
        title:
          en: Where are long transfers and how do we soften them?
          ru: Где длинные переезды и как их смягчить?
          uz: Qayerda uzoq ko'chalar bor va ularni qanday yumshatish mumkin?
        description:
          en: Tashkent-Samarkand-Bukhara is efficient by Afrosiyob. The long leg is typically Bukhara-Khiva; place it as an evening/overnight transfer and keep next morning lighter.
          ru: "Связка Ташкент–Самарканд–Бухара удобна на «Афросиёбе». Длинный участок — обычно Бухара–Хива: лучше вечерний/ночной переезд и более лёгкое утро на следующий день."
          uz: "Toshkent–Samarqand–Buxoro Afrosiyob bilan qulay. Uzoq parcha odatda Buxoro–Xiva: kechki/tungi ko'chani rejalashtiring va ertasi kuni yengilroq qiling."
      - type: destinationInsight
        icon: HelpCircle
        title:
          en: How to combine culture and nature without fatigue?
          ru: Как совместить культуру и природу без перегруза?
          uz: Madaniyat va tabiatni charchatmasdan qanday ulash mumkin?
        description:
          en: "Use Tashkent as a split point: heritage in old city, then Chimgan/Charvak day escape, then return to Silk Road city sequence."
          ru: "Используйте Ташкент как точку разделения: наследие в старом городе, затем однодневка в Чимган/Чарвак, потом возврат к городской последовательности Шёлкового пути."
          uz: "Toshkentni ajratish nuqtasi sifatida ishlating: eski shaharda meros, keyin Chimgan/Charvak kunligi, so'ng Ipak yo'li shaharlar ketma-ketligiga qaytish."

