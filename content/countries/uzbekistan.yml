          "uz": "Qoraqalpog‘iston va Orol dengizi"
        "description":
          "en": "Between Samarkand, Bukhara, and Khiva, this desert-edge route links Rabat-i Malik, Sarmyshsay, Nurata, Aydarkul, and Sentyab: portals, stored water, rock art, lake shore, foothill villages, and night air."
          "ru": "Маршрут у края пустыни между Самаркандом, Бухарой и Хивой: Рабат-и Малик, Сармышсай, Нурата, Айдаркуль и Сентоб соединяют порталы, сохранённую воду, петроглифы, берег озера, предгорные сёла и ночной воздух."
          "uz": "Qoraqalpog‘iston va Orol dengizi O‘zbekiston yo‘nalishini Nukus muzeylari, Mo‘ynoq, Mizdaxon, Chilpiq, Ellikqal’a qalʼalari va Xivadan keyingi yo‘l orqali davom ettiradi."
