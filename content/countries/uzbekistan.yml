  - blockType: regular
    eyebrow:
      en: Overview
      ru: Обзор
      uz: Umumiy
    title:
      en: Why Uzbekistan is the strongest Central Asia entry
      ru: Почему Узбекистан — лучший вход в Центральную Азию
      uz: Nega O'zbekiston Markaziy Osiyoga kirish uchun eng kuchli yo'nalish
    description:
      en: "Uzbekistan combines major Silk Road cities with practical logistics. Tashkent is an accessible hub, and high-speed rail cuts transfer time between Samarkand and Bukhara. The cultural density is high: monumental Timurid architecture, living bazaars, madrasas and modern urban layers can fit in a week. For mixed profiles, combine city heritage with Chimgan and Charvak day escapes to balance pace, climate and visual variety."
      ru: "Узбекистан сочетает ключевые города Шёлкового пути с практичной логистикой. Ташкент — удобный хаб, а скоростная железная дорога сокращает переезды между Самаркандом и Бухарой. Культурная плотность высокая: монументальная архитектура Тимуридов, базары, медресе и современный городской слой укладываются в недельную программу. Для смешанных групп хорошо работает связка городского наследия с однодневкой в Чимган и на Чарвак."
      uz: "O'zbekiston yirik Ipak yo'li shaharlarini amaliy logistika bilan birlashtiradi. Toshkent qulay hub, tezkor temir yo'l esa Samarqand va Buxoro orasidagi ko'chish vaqtini qisqartiradi. Madaniy zichlik yuqori: timuriylar me'morchiligi, bozorlar, madrasalar va zamonaviy shahar qatlamlari bir haftalik dasturga sig'adi. Aralash guruhlar uchun shahar merosi bilan Chimgan va Charvak kunlik sayohatini ulash yaxshi ishlaydi."

  - blockType: regular
    eyebrow:
      en: History
      ru: История
      uz: Tarix
    title:
      en: Silk Road context in one compact loop
      ru: Шёлковый путь в одном компактном кольце
      uz: Bitta ixcham halqadagi Ipak yo'li konteksti
    description:
      en: From Tashkent through Samarkand and Bukhara to Khiva, each stop adds a distinct layer. Use Tashkent for arrival and culture primer, Samarkand for imperial scale, Bukhara for atmosphere, and Khiva for a walled-city finale.
      ru: От Ташкента через Самарканд и Бухару к Хиве — каждая остановка добавляет свой слой. Ташкент — для прилёта и культурного введения, Самарканд — для имперского масштаба, Бухара — для атмосферы, Хива — для финала в стенах старого города.
      uz: Toshkentdan Samarqand va Buxoro orqali Xivagacha — har bir to'xtash o'z qatlamini qo'shadi. Toshkent — kelish va madaniy kirish uchun, Samarqand — imperiya masshtabi uchun, Buxoro — atmosfera uchun, Xiva — devor ichidagi final uchun.

