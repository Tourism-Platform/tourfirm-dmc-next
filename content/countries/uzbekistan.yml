  - blockType: regular
    eyebrow:
      en: About
      ru: О стране
      uz: Mamlakat haqida
    title:
      en: Uzbekistan
      ru: Узбекистан
      uz: O'zbekiston
    description:
      en: "Uzbekistan compresses centuries of Islamic architecture and Silk Road history into a week of fast trains. The Afrosiyob links Tashkent, Samarkand and Bukhara; Khiva rewards travelers who push west to the desert edge. For travel agents, Uzbekistan is one of the easiest Central Asia products to sell: predictable rail links, clear city pacing, and a compact heritage loop that works in 7–12 days without exhausting transfers."
      ru: "Узбекистан собирает вековую исламскую архитектуру и историю Шёлкового пути в маршрут на неделю на скоростных поездах. «Афросиёб» связывает Ташкент, Самарканд и Бухару; Хива ждёт тех, кто поедет на запад к пустыне. Для турагентств Узбекистан — один из самых удобных продуктов по Центральной Азии: предсказуемые ж/д связки, понятный темп по городам и компактное наследие, которое укладывается в 7–12 дней без изнурительных переездов."
      uz: "O'zbekiston asrlar davomida shakllangan islom me'morchiligi va Ipak yo'li tarixini bir haftalik tezkor poezd marshrutiga jamlaydi. «Afrosiyob» Toshkent, Samarqand va Buxoroni bog'laydi; Xiva esa cho'l chekkasiga boradigan sayohatchilarni kutadi. Sayohat agentliklari uchun O'zbekiston Markaziy Osiyodagi eng qulay yo'nalishlardan biri: bashorat qilinadigan temir yo'l bog'lamalari, shaharlar bo'yicha aniq temp va 7–12 kunga sig'adigan ixcham meros halqasi."

