          "ru": "Весна март-май"
          "uz": "Bahor mart-may"
        "title":
          "en": "Spring"
          "ru": "Весна"
          "uz": "Bahor"
        "description":
          "en": "The country wakes up. Blossoms, clear light, and crossable desert routes make March to May the easiest first window."
          "ru": "Страна просыпается. Цветение, ясный свет и пустынные маршруты без жары делают март-май самым простым первым окном."
          "uz": "Mamlakat uygʻonadi. Gullash, tiniq nur va jazirasiz choʻl yoʻllari mart-mayni eng oson birinchi davr qiladi."
      - "type": "tripFormat"
