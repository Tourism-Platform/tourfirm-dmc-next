            \            Afrosiyob rail connects major cities; flights and private transfers cover longer distances and route extensions."
          "ru": "Транспорт Поезд и трансферы



            \            Поезд Afrosiyob связывает крупные города; перелёты и частные трансферы закрывают длинные расстояния и дальние части маршрута."
          "uz": "Transport Poyezd va transferlar



            \            Afrosiyob yirik shaharlarni bogʻlaydi; parvozlar va shaxsiy transferlar uzun masofalar va kengaytmalarni yopadi."
  - "blockType": "regular"
    "eyebrow":
      "en": "Routes in detail"
      "ru": "Маршруты в деталях"
      "uz": "Marshrutlar batafsil"
    "title":
      "en": "How route pace works in practice"
      "ru": "Как темп маршрута работает на практике"
      "uz": "Marshrut sur’ati amalda qanday ishlaydi"
    "description":
      "en": "Use these notes to brief clients on transfers and overnight logic in Uzbekistan."
      "ru": "Используйте эти заметки для брифа клиентов по переездам и логике ночёвок в Узбекистан."
      "uz": "Ko‘chishlar va tunash mantig‘i bo‘yicha mijoz brifi uchun ushbu izohlardan foydalaning (Oʻzbekiston)."
    "gridClassName": "grid-cols-1"
    "cards":
      - "type": "destinationInsight"
        "icon": "CircleQuestionMark"
        "title":
          "en": "How many nights work for a first trip to Uzbekistan?"
          "ru": "Сколько ночей оптимально для первой поездки (Узбекистан)?"
          "uz": "Oʻzbekistonga birinchi safar uchun necha tun yetarli?"
        "description":
          "en": "For a first programme, 7–10 nights usually holds: keep the classic spine readable, then add one extension only if the season and group pace allow it. Use “The heart of the Silk Road” as the brief for what the country actually sells."
          "ru": "Для первой программы обычно хватает 7–10 ночей: держите классическую линию читаемой и добавляйте одно расширение только если сезон и темп группы позволяют. Ориентир страны — «Сердце Великого шёлкового пути»."
          "uz": "Birinchi dastur uchun odatda 7–10 tun yetadi: klassik chiziqni o‘qiladigan tuting, kengaytmani esa mavsum va guruh sur’ati ruxsat bersagina qo‘shing. Mamlakat brifi — «Buyuk Ipak yoʻlining yuragi»."
      - "type": "destinationInsight"
        "icon": "Bus"
        "title":
          "en": "Where are the long transfers in Uzbekistan, and how do you soften them?"
          "ru": "Где в маршруте по стране «Узбекистан» длинные переезды и как их смягчить?"
          "uz": "Oʻzbekiston marshrutida uzun ko‘chishlar qayerda va ularni qanday yumshatish mumkin?"
        "description":
          "en": "Plan long road or rail legs as part of the product, not leftovers between hotels. Evening or overnight moves, buffer mornings, and one clear anchor per day keep Uzbekistan sellable for agencies."
          "ru": "Длинные ж/д или автомобильные участки планируйте как часть продукта, а не как остаток между отелями. Вечерние/ночные переезды, запас утра и один ясный якорь на день делают Узбекистан удобным для агентств."
          "uz": "Uzun temiryo‘l yoki avto bo‘limlarni mehmonxona orasidagi qoldiq emas, mahsulot qismi qiling. Kechki/tungi ko‘chish, ertalab zaxirasi va kuniga bitta aniq tayanch Oʻzbekistonni agentliklar uchun sotiladigan qiladi."
      - "type": "destinationInsight"
        "icon": "Landmark"
        "title":
          "en": "How do you mix culture and landscape in Uzbekistan without overload?"
          "ru": "Как совместить культуру и природу в программе по «Узбекистан» без перегруза?"
          "uz": "Oʻzbekiston dasturida madaniyat va tabiatni ortiqcha yuklamasdan qanday birlashtirish mumkin?"
        "description":
          "en": "Split the trip into readable chapters: heritage days, then one nature or foothill pause, then return to the main city line. Clients remember clarity more than packing every highlight into one week."
          "ru": "Делите поездку на читаемые главы: дни наследия, затем одна природная или предгорная пауза, затем возврат к основной городской линии. Клиенты лучше помнят ясность, чем попытку уместить все хайлайты в одну неделю."
          "uz": "Safarni o‘qiladigan boblarga bo‘ling: meros kunlari, keyin bitta tabiat yoki tog‘oldi pauza, so‘ng asosiy shahar chizig‘iga qaytish. Mijozlar bir haftaga hamma narsani tiqishdan ko‘ra aniqlikni eslaydi."
  - "blockType": "cta"
    "image": "assets/images/destinations/uzbekistan/country.webp"
    "eyebrow":
      "en": "Start with a conversation"
      "ru": "Начните с разговора"
      "uz": "Suhbatdan boshlang"
    "title":
      "en": "Plan Uzbekistan with the team that starts here"
      "ru": "Спланировать Узбекистан с командой, для которой он дом"
      "uz": "Oʻzbekistonni shu yerdan boshlangan jamoa bilan rejalang"
    "description":
      "en": "Tell us your dates, pace, and what you want to understand. We will shape a route around the season, distances, and local team."
      "ru": "Напишите даты, темп и что вам важно понять. Мы соберём маршрут с учётом сезона, расстояний и команды на месте."
      "uz": "Sana, surʼat va nimani tushunmoqchi ekaningizni yozing. Biz mavsum, masofa va joyidagi jamoa asosida yoʻnalish tuzamiz."
