          "en": "Money"
          "ru": "Деньги"
          "uz": "Pul"
        "description":
          "en": "Money Som, with cash backup



            \            The Uzbek som is local currency. Cards work in cities; cash remains useful in bazaars and smaller stops."
          "ru": "Деньги Сум и запас наличных



            \            Местная валюта - узбекский сум. Карты работают в городах, но на базарах и малых остановках нужны наличные."
          "uz": "Pul Soʻm va naqd zaxira



            \            Mahalliy valyuta — oʻzbek soʻmi. Shaharlarda karta ishlaydi, bozorlar va kichik toʻxtashlarda naqd pul kerak boʻladi."
