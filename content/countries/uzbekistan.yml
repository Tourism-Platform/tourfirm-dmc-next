          "en": "Karakalpakstan and the Aral Sea extend the Uzbekistan route through Nukus museums, Moynaq, Mizdakhan, Chilpyk, Ellikqala fortresses, and the road beyond Khiva."
          "ru": "Каракалпакстан и Аральское море продолжают маршрут по Узбекистану через музеи Нукуса, Муйнак, Миздакхан, Чилпык, крепости Элликкалы и дорогу дальше после Хивы."
          "uz": "Samarqand, Buxoro va Xiva orasidagi cho‘l cheti yo‘li: Rabat-i Malik, Sarmishsoy, Nurota, Aydarko‘l va Sentob peshtoqlar, saqlangan suv, petrogliflar, ko‘l qirg‘og‘i, tog‘oldi qishloqlari va tungi havoni birlashtiradi."
