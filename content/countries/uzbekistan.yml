          "ru": "Сурхандарья добавляет к маршруту дальний юг Узбекистана: археологию Термеза, Амударью, исламские мемориалы, культуру Байсуна и горные дороги."
          "uz": "Surxondaryo O‘zbekistonning uzoq janubini yo‘nalishga qo‘shadi: Termiz arxeologiyasi, Amudaryo, islomiy yodgorliklar, Boysun madaniyati va tog‘ yo‘llari."
