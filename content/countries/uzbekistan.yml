          "uz": "Zomin va Jizzax tog‘lari"
        "description":
          "en": "Between Zaamin, Bakhmal, and Gallaorol, this Jizzakh mountain route links Duoba, Novqa, Muzbuloq, and Uzunbuloq with village hosts, rural roads, pilgrimage context, and nature stops confirmed close to travel."
          "ru": "Между Заамином, Бахмалом и Галляаралом джизакский горный маршрут связывает Дуобу, Новку, Музбулок и Узунбулок с хозяевами, сельскими дорогами, паломническим контекстом и природными остановками, которые нужно подтвердить ближе к поездке."
          "uz": "Zomin, Baxmal va G‘allaorol oralig‘ida Jizzax tog‘ marshruti Duoba, Novqa, Muzbuloq va Uzunbuloqni mezbonlar, qishloq yo‘llari, ziyorat konteksti va safarga yaqin tasdiqlanadigan tabiat bekatlari bilan bog‘laydi."
