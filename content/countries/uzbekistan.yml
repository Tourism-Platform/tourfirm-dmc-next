    "title":
      "en": "Seasonal rhythm"
      "ru": "Сезонный ритм"
      "uz": "Mavsumiy ritm"
    "description":
      "en": "Uzbekistan is generous, but not neutral. Spring and autumn carry the classic cities; summer asks for early starts, mountains, or a different pace."
      "ru": "Узбекистан щедр к маршруту, но сезон важен. Весна и осень держат классические города; летом нужны ранние старты, горы или другой темп."
      "uz": "Oʻzbekiston saxiy, lekin betaraf emas. Bahor va kuz klassik shaharlar uchun qulay; yoz erta startlar, togʻlar yoki boshqa surʼat talab qiladi."
    "gridClassName": "sm:grid-cols-2 lg:grid-cols-4"
    "cards":
