        "description":
          "en": "Kashkadarya starts south of Samarkand with Shakhrisabz, then opens toward Qarshi, Kitab, Langar Ata, Gissar foothill roads, and Surkhandarya."
          "ru": "Кашкадарья начинается к югу от Самарканда с Шахрисабза, а затем раскрывается через Карши, Китаб, Лангар-Ата, предгорные дороги и путь к Сурхандарье."
          "uz": "Qashqadaryo Samarqanddan janubda Shahrisabz bilan boshlanadi, keyin Qarshi, Kitob, Langar ota, tog‘oldi yo‘llari va Surxondaryo tomonga ochiladi."
