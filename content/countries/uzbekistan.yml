          "en": "Autumn"
          "ru": "Осень"
          "uz": "Kuz"
        "description":
          "en": "Heat softens, bazaars fill with fruit, and the heritage cities become walkable again. September and October are the strongest months."
          "ru": "Жара становится мягче, базары наполняются фруктами, исторические города снова удобны для прогулок. Сентябрь и октябрь - самые сильные месяцы."
          "uz": "Jazirama yumshaydi, bozorlar meva bilan toʻladi, tarixiy shaharlar yana piyoda yurishga qulay boʻladi. Sentabr va oktabr eng kuchli oylar."
      - "type": "tripFormat"
        "icon": "Snowflake"
        "badge":
