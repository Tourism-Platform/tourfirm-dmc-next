          "ru": "Хорезм ведёт маршрут к Хиве и дальше на запад: Ичан-Кала, Кальта-Минор, Джума-мечеть, пустынные крепости и дорога к Аралу задают смысл региона."
          "uz": "Xorazm yo‘lni Xivaga va undan g‘arbga olib boradi: Ichan Qalʼa, Kalta Minor, Juma masjidi, cho‘l qalʼalari va Orol tomonga yo‘l hudud mazmunini belgilaydi."
