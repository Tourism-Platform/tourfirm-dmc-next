        "description":
          "en": "Bukhara region starts in the old city, then widens to Gijduvan ceramics, Sitorai, Naqshband, Chor-Bakr, archaeology, and the road to Khiva."
          "ru": "Бухарский регион начинается со старого города, затем ведёт к керамике Гиждувана, Ситораи, Накшбанду, Чор-Бакру, археологии и дороге к Хиве."
          "uz": "Buxoro hududi eski shahardan boshlanib, Gʻijduvon kulolchilik maktabi, Sitorai, Naqshband, Chor Bakr, arxeologiya va Xiva yoʻliga kengayadi."
