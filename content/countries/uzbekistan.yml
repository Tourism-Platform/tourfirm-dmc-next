          "ru": "Лето июнь-август"
          "uz": "Yoz iyun-avgust"
        "title":
          "en": "Summer"
          "ru": "Лето"
          "uz": "Yoz"
        "description":
          "en": "June can work with early starts. July and August are better for mountain breaks or routes built carefully around heat."
          "ru": "Июнь ещё подходит с ранними стартами. Июль и август лучше отдавать горам или маршрутам, построенным вокруг жары."
          "uz": "Iyun erta startlar bilan ishlaydi. Iyul va avgust togʻlar yoki issiq atrofida tuzilgan yoʻnalishlar uchun yaxshiroq."
      - "type": "tripFormat"
