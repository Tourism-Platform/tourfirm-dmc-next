        "icon": "Passport"
        "title":
          "en": "Visa"
          "ru": "Виза"
          "uz": "Viza"
        "description":
          "en": "Visa Check by passport



            \            Many passports enter visa-free; others can use the official e-visa. Check the rule by passport before booking."
          "ru": "Виза Проверять по паспорту



            \            Многие паспорта въезжают без визы; остальные могут оформить официальную электронную визу. Правило проверяем по паспорту до бронирования."
          "uz": "Viza Pasport boʻyicha tekshirish



            \            Koʻp pasportlar vizasiz kira oladi; boshqalar rasmiy e-visa olishi mumkin. Qoidani bron qilishdan oldin pasport boʻyicha tekshiramiz."
