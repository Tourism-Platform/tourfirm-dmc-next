          "ru": "Безопасность"
          "uz": "Xavfsizlik"
        "description":
          "en": "Safety Comfortable city travel



            \            Tourist cities are calm and visitor-friendly. We still plan walking time, transfers, and evening movement deliberately."
          "ru": "Безопасность Спокойные города



            \            Туристические города спокойные и дружелюбные к гостям. Время прогулок, трансферы и вечерние перемещения всё равно лучше планировать заранее."
          "uz": "Xavfsizlik Qulay shahar sayohati



            \            Turistik shaharlar sokin va mehmonlarga ochiq. Piyoda vaqt, transferlar va kechki harakatni baribir oldindan rejalaymiz."
