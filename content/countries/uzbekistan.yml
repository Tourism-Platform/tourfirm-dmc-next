"excerpt":
  "en": "For two and a half thousand years, Uzbekistan has stood at a crossroads. The routes that carried silk, ideas, and prayers still hold Samarkand, Bukhara, Khiva, Shahrisabz, and newer heritage landscapes in one story.


    This is also our home. Our team grew up around these courtyards, knows the rhythm of the bazaars, and builds routes where people step out from behind the monuments — a potter at the wheel, a conversation over a bowl of tea."
  "ru": "Две с половиной тысячи лет Узбекистан стоит на перекрёстке. Маршруты, по которым шли шёлк, идеи и молитвы, до сих пор связывают Самарканд, Бухару, Хиву, Шахрисабз и менее очевидные пространства наследия в одну историю.


    Это ещё и наш дом. Наша команда выросла среди этих дворов, знает ритм базаров и собирает маршруты, где за памятниками открываются люди — мастер за гончарным кругом, разговор за пиалой чая."
  "uz": "Ikki yarim ming yildan beri Oʻzbekiston chorrahada turadi. Ipak, fikr va ibodatlarni olib oʻtgan yoʻllar Samarqand, Buxoro, Xiva, Shahrisabz va yangi meros landshaftlarini bitta hikoyaga bogʻlaydi.


    Bu yer biz uchun ham vatan. Jamoamiz shu hovlilar atrofida ulgʻaygan, bozorlar ohangini biladi va yodgorliklar ortidan odamlar ochiladigan yoʻnalishlar quradi — charx ortidagi kulol, bir piyola choy ustidagi suhbat."
