            "description":
              "en": "Astana sets the modern capital tone; Almaty opens mountains and city life; Turkistan and the south hold pilgrimage courtyards and older Silk Road depth. Distances are the product’s grammar: trains, flights and road days must be planned as part of the experience, not as leftovers between hotels."
              "ru": "Астана задаёт тон современной столицы; Алматы открывает горы и городской ритм; Туркестан и юг держат паломнические дворы и более старую глубину Шёлкового пути. Расстояния — грамматика продукта: поезда, перелёты и дорожные дни планируют как часть опыта, а не как остаток между отелями."
              "uz": "Ostona zamonaviy poytaxt ohangini beradi; Olmaota togʻ va shahar hayotini ochadi; Turkiston va janub ziyorat hovlilari va Ipak yoʻlining qadimiy chuqurligini ushlaydi. Masofalar — mahsulot grammatikasi: poyezd, parvoz va yoʻl kunlari mehmonxona orasidagi qoldiq emas, tajribaning qismi."
        "right":
