    "cards":
      - "type": "destinationInsight"
        "icon": "Passport"
        "title":
          "en": "Visa"
          "ru": "Виза"
          "uz": "Viza"
        "description":
          "en": "Visa Check by passport


            Visa-free rules vary by nationality and stay length. For multi-country journeys, check Kazakhstan entry rules together with the rest of the route."
          "ru": "Виза Проверяется по паспорту


            Безвизовые правила зависят от гражданства и срока пребывания. Для комбинированных маршрутов проверяйте правила въезда в Казахстан вместе с остальной поездкой."
          "uz": "Viza Pasport boʻyicha tekshiriladi


            Vizasiz kirish qoidalari fuqarolik va qolish muddatiga bogʻliq. Bir nechta mamlakatli safarlarda Qozogʻiston kirish qoidalarini butun yoʻnalish bilan birga tekshiring."
      - "type": "destinationInsight"
        "icon": "Wallet"
        "title":
          "en": "Money"
          "ru": "Деньги"
          "uz": "Pul"
        "description":
          "en": "Money Tenge, cards, cash


            Cards work well in major cities. Carry cash for markets, small cafes, rural stops, and remote mountain, steppe, or western routes."
          "ru": "Деньги Тенге, карты, наличные


            В крупных городах карты работают хорошо. Наличные нужны для рынков, небольших кафе, сельских остановок и удалённых горных, степных или западных маршрутов."
          "uz": "Pul Tenge, karta, naqd


            Yirik shaharlarda karta yaxshi ishlaydi. Bozorlar, kichik kafelar, qishloq toʻxtashlari va uzoq togʻ, dasht yoki gʻarbiy yoʻnalishlar uchun naqd pul olib yuring."
      - "type": "destinationInsight"
        "icon": "ShieldCheck"
        "title":
          "en": "Safety"
          "ru": "Безопасность"
          "uz": "Xavfsizlik"
        "description":
          "en": "Safety Straightforward with planning


            Cities are generally easy for travelers. Remote nature routes need suitable vehicles, weather checks, realistic timing, and enough margin for distance."
          "ru": "Безопасность Спокойно при хорошем плане


            Города обычно понятны путешественнику. Для удалённой природы нужны подходящие машины, проверка погоды, реалистичное время и запас на расстояния."
          "uz": "Xavfsizlik Yaxshi reja bilan sokin


            Shaharlar sayohatchi uchun odatda tushunarli. Uzoq tabiat yoʻnalishlarida mos transport, ob-havo tekshiruvi, real vaqt va masofa uchun zaxira zarur."
      - "type": "destinationInsight"
        "icon": "Train"
        "title":
          "en": "Transport"
          "ru": "Транспорт"
          "uz": "Transport"
        "description":
          "en": "Transport Distance decides the rhythm


            Flights connect far cities, rail can add a slower rhythm, and tested vehicles matter for canyons, steppe, Mangystau, and mountain roads."
          "ru": "Транспорт Расстояние задаёт ритм


            Перелёты соединяют дальние города, поезд может добавить спокойный ритм, а проверенные машины важны для каньонов, степи, Мангистау и горных дорог."
          "uz": "Transport Masofa surʼatni belgilaydi


            Parvozlar uzoq shaharlarni ulaydi, poyezd sekinroq surʼat qoʻshishi mumkin, kanyonlar, dasht, Mangʻistov va togʻ yoʻllarida esa tekshirilgan mashina muhim."


  - "blockType": "regular"
    "eyebrow":
      "en": "Routes in detail"
      "ru": "Маршруты в деталях"
      "uz": "Marshrutlar batafsil"
    "title":
      "en": "How route pace works in practice"
      "ru": "Как темп маршрута работает на практике"
      "uz": "Marshrut sur’ati amalda qanday ishlaydi"
    "description":
      "en": "Use these notes to brief clients on transfers and overnight logic in Kazakhstan."
      "ru": "Используйте эти заметки для брифа клиентов по переездам и логике ночёвок в Казахстан."
      "uz": "Ko‘chishlar va tunash mantig‘i bo‘yicha mijoz brifi uchun ushbu izohlardan foydalaning (Qozogʻiston)."
    "gridClassName": "grid-cols-1"
    "cards":
      - "type": "destinationInsight"
        "icon": "CircleQuestionMark"
        "title":
          "en": "How many nights work for a first trip to Kazakhstan?"
          "ru": "Сколько ночей оптимально для первой поездки (Казахстан)?"
          "uz": "Qozogʻistonga birinchi safar uchun necha tun yetarli?"
        "description":
          "en": "For a first programme, 8–12 nights usually holds: keep the classic spine readable, then add one extension only if the season and group pace allow it. Use “Steppe scale, mountain cities, and Silk Road south” as the brief for what the country actually sells."
          "ru": "Для первой программы обычно хватает 8–12 ночей: держите классическую линию читаемой и добавляйте одно расширение только если сезон и темп группы позволяют. Ориентир страны — «Степной масштаб, горные города и южный Шёлковый путь»."
          "uz": "Birinchi dastur uchun odatda 8–12 tun yetadi: klassik chiziqni o‘qiladigan tuting, kengaytmani esa mavsum va guruh sur’ati ruxsat bersagina qo‘shing. Mamlakat brifi — «Dasht miqyosi, togʻ shaharlari va janubiy Ipak yoʻli»."
      - "type": "destinationInsight"
        "icon": "MapPin"
        "title":
          "en": "Where are the long transfers in Kazakhstan, and how do you soften them?"
          "ru": "Где в маршруте по стране «Казахстан» длинные переезды и как их смягчить?"
          "uz": "Qozogʻiston marshrutida uzun ko‘chishlar qayerda va ularni qanday yumshatish mumkin?"
        "description":
          "en": "Plan long road or rail legs as part of the product, not leftovers between hotels. Evening or overnight moves, buffer mornings, and one clear anchor per day keep Kazakhstan sellable for agencies."
          "ru": "Длинные ж/д или автомобильные участки планируйте как часть продукта, а не как остаток между отелями. Вечерние/ночные переезды, запас утра и один ясный якорь на день делают Казахстан удобным для агентств."
          "uz": "Uzun temiryo‘l yoki avto bo‘limlarni mehmonxona orasidagi qoldiq emas, mahsulot qismi qiling. Kechki/tungi ko‘chish, ertalab zaxirasi va kuniga bitta aniq tayanch Qozogʻistonni agentliklar uchun sotiladigan qiladi."
      - "type": "destinationInsight"
        "icon": "Compass"
        "title":
          "en": "How do you mix culture and landscape in Kazakhstan without overload?"
          "ru": "Как совместить культуру и природу в программе по «Казахстан» без перегруза?"
          "uz": "Qozogʻiston dasturida madaniyat va tabiatni ortiqcha yuklamasdan qanday birlashtirish mumkin?"
        "description":
          "en": "Split the trip into readable chapters: heritage days, then one nature or foothill pause, then return to the main city line. Clients remember clarity more than packing every highlight into one week."
          "ru": "Делите поездку на читаемые главы: дни наследия, затем одна природная или предгорная пауза, затем возврат к основной городской линии. Клиенты лучше помнят ясность, чем попытку уместить все хайлайты в одну неделю."
          "uz": "Safarni o‘qiladigan boblarga bo‘ling: meros kunlari, keyin bitta tabiat yoki tog‘oldi pauza, so‘ng asosiy shahar chizig‘iga qaytish. Mijozlar bir haftaga hamma narsani tiqishdan ko‘ra aniqlikni eslaydi."
