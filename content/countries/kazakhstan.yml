              "ru": "Один сильный якорь на каждый этап, честные дни в пути и сезон, который учитывает степную жару, горную погоду и длинные горизонты."
              "uz": "Har bosqichda bitta kuchli tayanch, halol yoʻl kunlari va dasht issiqligi, togʻ ob-havosi va uzoq ufqni hisobga olgan mavsum."
          - "type": "dashTitle"
