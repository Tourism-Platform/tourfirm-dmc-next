  "metaDescription":
    "en": "Kazakhstan gives Central Asia its scale: trains cross steppe horizons through the night.


      The journey moves from Astana's broad avenues to Almaty's foothills, Shymkent's southern rhythm, and Turkistan's pilgrimage courtyards."
    "ru": "Казахстан даёт Центральной Азии масштаб: поезд всю ночь идёт через степные горизонты.


      Маршрут движется от широких проспектов Астаны к предгорьям Алматы, южному ритму Шымкента и паломническим дворам Туркестана."
    "uz": "Qozogʻiston Markaziy Osiyoga miqyos beradi: poyezd dasht ufqlari boʻylab tun boʻyi yuradi.


      Yoʻl Ostonaning keng xiyobonlaridan Olmaota togʻoldilariga, Chimkentning janubiy ritmi va Turkistonning ziyorat hovlilariga boradi."
