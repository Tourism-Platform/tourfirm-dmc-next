          "ru": "Размеренная остановка на юге Казахстана: Тараз у Таласа, мавзолеи Айша-Биби и Бабаджи-Хатун, Карахан, Древний Тараз и Акыртас, если дорога подходит."
          "uz": "Janubiy Qozog‘istondagi sokin to‘xtash: Talas bo‘yidagi Taraz, Aysha-Bibi va Babaji-Xotun maqbaralari, Qoraxon, Qadimgi Taraz va yo‘l mos bo‘lsa Akyrtas."
        "ctaHref": "/destinations/kazakhstan/taraz-and-jambyl-silk-road"
        "ctaLabel":
          "en": "View"
          "ru": "Смотреть"
          "uz": "Ko'rish"
  - "blockType": "regular"
    "eyebrow":
      "en": "When to go"
      "ru": "Когда ехать"
      "uz": "Qachon borish"
    "title":
      "en": "Seasonal rhythm"
      "ru": "Сезонный ритм"
      "uz": "Mavsumiy surʼat"
    "description":
      "en": "Heat, snow, mountain access, desert comfort, and city walking all change the best route shape."
      "ru": "Жара, снег, горный доступ, пустынный комфорт и городские прогулки меняют форму маршрута."
      "uz": "Issiq, qor, togʻ yoʻllari, choʻl qulayligi va shahar sayrlari yoʻnalish shaklini oʻzgartiradi."
    "gridClassName": "sm:grid-cols-2 lg:grid-cols-4"
    "cards":
      - "type": "tripFormat"
        "icon": "Flower2"
        "badge":
          "en": "Spring March-May"
          "ru": "Весна март-май"
          "uz": "Bahor mart-may"
        "title":
          "en": "Spring"
          "ru": "Весна"
          "uz": "Bahor"
        "description":
          "en": "March belongs to Nauryz and the slow thaw. April and May are strong for first Kazakhstan routes: Almaty feels alive, Charyn is comfortable, Turkistan is warm, and roads are easier before summer heat."
          "ru": "Март принадлежит Наурызу и медленной оттепели. Апрель и май сильны для первого маршрута по Казахстану: Алматы оживает, Чарын комфортен, Туркестан тёплый, а дороги проще до летней жары."
          "uz": "Mart Navroʻz va sekin erish davri. Aprel va may Qozogʻiston bilan ilk tanishuv uchun kuchli: Olmaota jonlanadi, Charyn qulay, Turkiston iliq, yoʻllar esa yozgi jaziramadan oldin yengilroq."
      - "type": "tripFormat"
        "icon": "Sun"
        "badge":
          "en": "Summer June-August"
          "ru": "Лето июнь-август"
          "uz": "Yoz iyun-avgust"
        "title":
          "en": "Summer"
          "ru": "Лето"
          "uz": "Yoz"
        "description":
          "en": "Summer is strongest when the route respects altitude and distance. Almaty foothills, Kolsai and Kaindy, Burabay, and eastern mountain routes are good choices; the southern steppe and Mangystau need heat-aware planning."
          "ru": "Лето лучше всего раскрывается там, где маршрут уважает высоту и расстояние. Предгорья Алматы, Кольсай и Каинды, Бурабай и восточные горные маршруты — хорошие решения; южная степь и Мангистау требуют плана с учётом жары."
          "uz": "Yoz balandlik va masofa hisobga olinganda yaxshiroq ochiladi. Olmaota togʻoldi, Koʻlsay va Qayindi, Burabay va sharqiy togʻ yoʻnalishlari yaxshi tanlov; janubiy dasht va Mangʻistov issiqni hisobga olgan reja talab qiladi."
      - "type": "tripFormat"
        "icon": "Leaf"
        "badge":
          "en": "Autumn September-November"
          "ru": "Осень сентябрь-ноябрь"
          "uz": "Kuz sentabr-noyabr"
        "title":
          "en": "Autumn"
          "ru": "Осень"
          "uz": "Kuz"
        "description":
          "en": "September and October are often the most balanced months: dry air, softer light, cooler roads, and long views across the steppe. November is quieter and better for city-led or business travel."
          "ru": "Сентябрь и октябрь часто самые сбалансированные месяцы: сухой воздух, мягкий свет, прохладные дороги и длинные виды через степь. Ноябрь тише и лучше подходит для городских или деловых поездок."
          "uz": "Sentabr va oktabr koʻpincha eng muvozanatli oylar: quruq havo, yumshoq nur, salqinroq yoʻllar va dasht boʻylab uzoq manzaralar. Noyabr sokinroq va shahar yoki biznes safarlariga mosroq."
      - "type": "tripFormat"
        "icon": "Snowflake"
        "badge":
          "en": "Winter December-February"
          "ru": "Зима декабрь-февраль"
          "uz": "Qish dekabr-fevral"
        "title":
          "en": "Winter"
          "ru": "Зима"
          "uz": "Qish"
        "description":
          "en": "Winter is clear about its limits: Astana can be severe, and long road routes need caution. Almaty has a different winter logic, with mountains, skating, snow, warm cafes, and compact cultural days."
          "ru": "Зима честно показывает ограничения: в Астане бывает сурово, а длинные автопереезды требуют осторожности. У Алматы другая зимняя логика: горы, каток, снег, тёплые кафе и компактные культурные дни."
          "uz": "Qish cheklovlarni aniq koʻrsatadi: Ostonada sovuq keskin boʻlishi mumkin, uzoq avtomobil yoʻllari ehtiyotkorlik talab qiladi. Olmaotada esa qish boshqacha: togʻlar, muz maydoni, qor, iliq kafelar va ixcham madaniy kunlar."
