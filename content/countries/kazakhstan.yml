      "uz": "Qozogʻistonni bitta siqilgan roʻyxat sifatida koʻrish qiyin. Eng ravshan yoʻnalishlar asosiy tayanchdan boshlanadi: Olmaota va Tyanshan, Ostona va dasht yoki janubiy Ipak yoʻlida Chimkent hamda Turkiston."
