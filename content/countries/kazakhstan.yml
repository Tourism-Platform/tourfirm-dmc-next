  - "blockType": "regular"
    "eyebrow":
      "en": "Tourist regions"
      "ru": "Туристические регионы"
      "uz": "Turistik hududlar"
    "title":
      "en": "Regions of Kazakhstan"
      "ru": "Регионы Казахстана"
      "uz": "Qozogʻiston hududlari"
    "description":
      "en": "Kazakhstan is easiest to plan through broad travel regions: Almaty & Northern Tian Shan for the mountain edge, Astana & Akmola Steppe for capital scale, and Turkistan/Shymkent & the Southern Silk Road for southern heritage. Mangystau and East Kazakhstan/Altai remain strong near-term extensions when the route has the right season and distance."
      "ru": "Казахстан проще планировать через крупные туристические регионы: Алматы и Северный Тянь-Шань для горного края, Астана и Акмолинская степь для столичного масштаба, Туркестан/Шымкент и южный Шёлковый путь для южного наследия. Мангистау и Восточный Казахстан/Алтай остаются сильными ближайшими расширениями, если сезон и расстояние подходят."
      "uz": "Qozogʻistonni yirik turistik hududlar orqali rejalash osonroq: Olmaota va Shimoliy Tyanshan togʻ cheti uchun, Ostona va Aqmola dashti poytaxt miqyosi uchun, Turkiston/Shimkent va janubiy Ipak yoʻli janubiy meros uchun. Mangʻistov va Sharqiy Qozogʻiston/Oltay mavsum va masofa mos kelganda kuchli yaqin kengaytmalar boʻlib qoladi."
    "gridClassName": "sm:grid-cols-2 lg:grid-cols-2"
