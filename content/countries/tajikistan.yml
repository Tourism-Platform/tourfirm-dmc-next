            Many passports have short visa-free entry; others use an e-visa. Pamir/GBAO travel may need an additional permit, so check the rule before the route is fixed."
          "ru": "Виза Проверьте визу и разрешения


            Для многих паспортов действует краткий безвизовый въезд; другим нужна e-visa. Для Памира и ГБАО может понадобиться отдельное разрешение, поэтому правило лучше проверить до фиксации маршрута."
