      "en": "For travel, Tajikistan is easier to understand through valleys and mountain systems: Dushanbe & Hissar for arrival, the Fann Mountains & Zeravshan for archaeology and lake roads, Pamir & GBAO for high-country travel, with Khujand and Khatlon waiting as later northern and southern extensions."
      "ru": "Для путешествия Таджикистан понятнее через долины и горные системы: Душанбе и Гиссар для первого входа, Фанские горы и Зеравшан для археологии и озёрных дорог, Памир и ГБАО для высокогорья, а Худжанд и Хатлон — как будущие северное и южное продолжения."
      "uz": "Sayohat uchun Tojikistonni vodiylar va tog‘ tizimlari orqali tushunish osonroq: Dushanbe va Hisor birinchi kirish uchun, Fan tog‘lari va Zarafshon arxeologiya hamda ko‘l yo‘llari uchun, Pomir va GBAO baland tog‘li safar uchun, Xo‘jand va Xatlon esa keyingi shimoliy va janubiy davom sifatida."
