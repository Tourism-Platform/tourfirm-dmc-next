            Cards are most useful in Dushanbe and larger cities. Carry somoni cash for villages, homestays, markets, mountain roads, and driver stops."
          "ru": "Деньги Сомони и наличные


            Карты полезнее всего в Душанбе и крупных городах. Для деревень, гостевых домов, рынков, горных дорог и остановок у водителя нужны сомони наличными."
          "uz": "Pul Somoni va naqd pul


            Kartalar asosan Dushanbe va yirik shaharlarda foydali. Qishloqlar, mehmon uylari, bozorlar, tog‘ yo‘llari va haydovchi to‘xtashlari uchun somoni naqd pul olib yuring."
