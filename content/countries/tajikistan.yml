  "metaDescription":
    "en": "Tajikistan turns vertical quickly: Dushanbe starts with plane trees, fountains, and valley roads.


      Penjikent and Sarazm open older Zeravshan history; Khorog resets the scale before the Pamirs, where altitude and weather set the pace."
    "ru": "В Таджикистане маршрут быстро становится вертикальным: Душанбе встречает платанами, фонтанами и дорогами долин.


      Пенджикент и Саразм открывают историю Зеравшана; Хорог меняет масштаб перед Памиром, где высота и погода задают темп."
    "uz": "Tojikistonda yoʻl tezda balandlikka koʻtariladi: Dushanbe chinorlar, favvoralar va vodiy yoʻllari bilan boshlanadi.


      Panjikent va Sarazm Zarafshon tarixini ochadi; Xorugʻ esa Pomir oldidan miqyosni oʻzgartiradi."
