          "uz": "Yoz"
        "description":
          "en": "June to August is the main window for the Fann Mountains and the Pamir Highway. Lowlands can be hot, but altitude brings long light, open passes, homestays, lakes, and roads that hold together better. Serious mountain routes still need buffer days."
          "ru": "Июнь, июль и август — главное окно для Фанских гор и Памирского тракта. В низинах жарко, зато высота даёт длинный свет, открытые перевалы, гостевые дома, озёра и более устойчивые дороги. Для серьёзных горных маршрутов всё равно нужен запас дней."
          "uz": "Iyun-avgust Fan tog‘lari va Pomir trakti uchun asosiy davr. Pastliklarda issiq bo‘lishi mumkin, lekin balandlik uzun yorug‘lik, ochiq dovonlar, mehmon uylari, ko‘llar va barqarorroq yo‘llarni beradi. Jiddiy tog‘ yo‘nalishlariga baribir zaxira kunlar kerak."
      - "type": "tripFormat"
        "icon": "Leaf"
        "badge":
          "en": "Autumn September-November"
          "ru": "Осень сентябрь-ноябрь"
          "uz": "Kuz sentabr-noyabr"
        "title":
          "en": "Autumn"
          "ru": "Осень"
          "uz": "Kuz"
        "description":
          "en": "September often gives the clearest air and strongest mountain light. October can be beautiful in lower valleys, though high roads change fast. By November, compact cultural programs are safer than ambitious mountain crossings."
          "ru": "Сентябрь часто даёт самый чистый воздух и сильный горный свет. Октябрь красив в нижних долинах, но высокие дороги быстро меняются. К ноябрю компактные культурные программы безопаснее, чем амбициозные горные переезды."
          "uz": "Sentabr ko‘pincha eng tiniq havo va kuchli tog‘ nurini beradi. Oktabr past vodiylarda chiroyli, lekin baland yo‘llar tez o‘zgaradi. Noyabrga kelib ixcham madaniy dasturlar katta tog‘ kesib o‘tishlaridan xavfsizroq."
      - "type": "tripFormat"
        "icon": "Snowflake"
        "badge":
          "en": "Winter December-February"
          "ru": "Зима декабрь-февраль"
          "uz": "Qish dekabr-fevral"
        "title":
          "en": "Winter"
          "ru": "Зима"
          "uz": "Qish"
        "description":
          "en": "Winter suits Dushanbe, Khujand, Hissar, and selected lowland visits more than high-road travel. Pamir Highway sections, remote valleys, and high passes require caution, flexible timing, and local weather checks."
          "ru": "Зимой лучше подходят Душанбе, Худжанд, Гиссар и отдельные низинные выезды, а не высокогорные дороги. Участки Памирского тракта, удалённые долины и перевалы требуют осторожности, гибкого времени и местной проверки погоды."
          "uz": "Qishda Dushanbe, Xo‘jand, Hisor va ayrim past yo‘nalishlar baland tog‘ yo‘llaridan ko‘ra mosroq. Pomir trakti qismlari, uzoq vodiylar va baland dovonlar ehtiyot, moslashuvchan vaqt va mahalliy ob-havo tekshiruvini talab qiladi."
