              "ru": "Для кого это"
              "uz": "Kim uchun"
            "description":
              "en": "Clients who want landscape and living culture — yurt stays, lake days, mountain roads — with a DMC that respects weather and driving reality."
              "ru": "Клиентам, которым нужны пейзаж и живая культура — юрты, озёрные дни, горные дороги — и DMC, который уважает погоду и реальность дороги."
              "uz": "Manzara va tirik madaniyatni xohlagan mijozlar — oʻtov, koʻl kunlari, togʻ yoʻllari — va ob-havo hamda yoʻl haqiqatini hurmat qiladigan DMC."
