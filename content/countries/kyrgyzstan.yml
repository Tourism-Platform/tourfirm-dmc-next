          "en": "Summer June–August"
          "ru": "Лето июнь – август"
          "uz": "Yoz iyun – avgust"
        "title":
          "en": "Summer"
          "ru": "Лето"
          "uz": "Yoz"
        "description":
          "en": "This is Kyrgyzstan's main season. Yurts return to jailoo, lake roads become reliable, and long days make mountain routes work. July and August are the busiest around Issyk-Kul, so we plan the rhythm carefully: early starts, quieter valleys, and enough time between drives."
          "ru": "Главный сезон Кыргызстана. Юрты возвращаются на джайлоо, озёрные дороги становятся надёжнее, длинный день помогает строить горные маршруты. В июле и августе Иссык-Куль оживлён, поэтому важен правильный ритм: ранние выезды, тихие долины и запас между переездами."
          "uz": "Bu Qirgʻizistonning asosiy mavsumi. Oʻtovlar yaylovga qaytadi, koʻl yoʻllari ishonchliroq boʻladi, uzun kunlar togʻ marshrutlariga imkon beradi. Iyul va avgustda Issiqkoʻl gavjum, shuning uchun ritm muhim: erta chiqish, tinch vodiylar va yoʻllar orasida yetarli vaqt."
      - "type": "tripFormat"
        "icon": "Leaf"
        "badge":
          "en": "Autumn September–November"
          "ru": "Осень сентябрь – ноябрь"
          "uz": "Kuz sentabr – noyabr"
        "title":
          "en": "Autumn"
          "ru": "Осень"
          "uz": "Kuz"
        "description":
          "en": "September is often the most balanced month: clear air, fewer vehicles on lake roads, and strong light in the valleys. October can be beautiful but needs a softer route shape. November is already a city-and-lowland month, with high routes closing as snow returns."
          "ru": "Сентябрь часто самый сбалансированный месяц: чистый воздух, меньше машин у озера и сильный свет в долинах. Октябрь может быть красивым, но требует честного маршрута. Ноябрь — уже месяц городов и низин, пока снег возвращается на высоту."
          "uz": "Sentabr koʻpincha eng muvozanatli oy: tiniq havo, koʻl yoʻllarida kamroq mashina va vodiylarda kuchli nur. Oktabr chiroyli boʻlishi mumkin, lekin real marshrut talab qiladi. Noyabr esa qor balandlikka qaytadigan shahar va past vodiylar oyidir."
      - "type": "tripFormat"
        "icon": "Snowflake"
        "badge":
          "en": "Winter December–February"
          "ru": "Зима декабрь – февраль"
          "uz": "Qish dekabr – fevral"
        "title":
          "en": "Winter"
          "ru": "Зима"
          "uz": "Qish"
        "description":
          "en": "Winter is not the season for open-ended mountain travel. Roads, daylight, and weather set the limits. Bishkek, Osh, Karakol, and selected winter landscapes can still work when the day stays compact and honest about cold, snow, and road conditions."
          "ru": "Зима меняет Кыргызстан на более короткие и спокойные дни. Дороги, свет и погода задают границы; Бишкек, Ош, Каракол и отдельные зимние пейзажи остаются живыми, если вы принимаете холод, снег и более медленный темп."
          "uz": "Qish erkin togʻ sayohati uchun mavsum emas. Yoʻllar, kun uzunligi va ob-havo chegarani belgilaydi. Bishkek, Oʻsh, Qorakoʻl va ayrim qishki manzaralar ishlashi mumkin, ammo dastur ixcham va sovuq, qor, yoʻl sharoitiga nisbatan halol boʻlishi kerak."
