              "uz": "Marshrut qanday ishlaydi"
            "description":
              "en": "Bishkek opens the valley gateway; Issyk-Kul and Karakol hold water, mountains and seasonal rhythm; Osh brings Silk Road south and a different city scale. Drivers, hosts and altitude matter as much as sights — the product works when road time is designed, not improvised."
              "ru": "Бишкек открывает долину; Иссык-Куль и Каракол держат воду, горы и сезонный ритм; Ош приносит южный Шёлковый путь и другой масштаб города. Водители, хозяева и высота важны не меньше достопримечательностей — продукт работает, когда дорога спроектирована, а не импровизирована."
              "uz": "Bishkek vodiy darvozasini ochadi; Issiqkoʻl va Qorakoʻl suv, togʻ va mavsum ritmini ushlaydi; Oʻsh janubiy Ipak yoʻli va boshqa shahar miqyosini olib keladi. Haydovchi, mezbon va balandlik diqqatga sazovor joylardek muhim — mahsulot yoʻl improvisatsiya emas, loyiha boʻlganda ishlaydi."
        "right":
          - "type": "dashTitle"
            "title":
              "en": "What holds the product"
              "ru": "Что держит продукт"
              "uz": "Mahsulotni nima ushlab turadi"
            "description":
              "en": "Season, altitude and comfort level decide whether the journey stays soft or goes deeper into the mountains."
              "ru": "Сезон, высота и уровень комфорта решают, останется ли поездка мягкой или уйдёт глубже в горы."
              "uz": "Mavsum, balandlik va qulaylik darajasi safar yumshoq qolishini yoki togʻlarga chuqurroq ketishini belgilaydi."
          - "type": "dashTitle"
            "title":
