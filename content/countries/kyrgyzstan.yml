  "metaDescription":
    "en": "At Song-Kul, summer comes late: horses move through the grass and smoke rises from a yurt stove.


      Bishkek, Issyk-Kul, Karakol, and Osh show Kyrgyzstan through high pastures, blue water, mountain roads, and the old Silk Road."
    "ru": "На Сон-Куле лето приходит поздно: лошади идут по траве, из юрты тянется дым.


      Бишкек, Иссык-Куль, Каракол и Ош раскрывают Кыргызстан через высокие пастбища, синюю воду, горные дороги и старый Шёлковый путь."
    "uz": "Soʻng-Koʻlda yoz kech keladi: otlar oʻtloqda yuradi, oʻtovdan tutun koʻtariladi.


      Bishkek, Issiqkoʻl, Qorakoʻl va Oʻsh Qirgʻizistonni baland yaylovlar, moviy suv, togʻ yoʻllari va eski Ipak yoʻli orqali ochadi."
