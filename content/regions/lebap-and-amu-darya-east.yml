"excerpt":
  "en": "The Amu Darya gives eastern Turkmenistan its line. Turkmenabat sits near ancient Amul, where river crossings and Silk Road movement once made this edge of the country a point of passage rather than a postcard old town.


    Farther east, Koytendag changes the journey again. Caves, dry ridges, remote villages, and dinosaur-footprint context belong in the route only when roads, guides, permissions, season, and overnight plans are current. Lebap is a deliberate eastern leg, not a quick add-on to Ashgabat, Merv, or Darvaza."
  "ru": "Амударья задаёт восточному Туркменистану направление. Туркменабат стоит рядом с древним Амулем, где переправы и движение по Шёлковому пути когда-то делали этот край страны местом прохода, а не открыткой старого города.


    Дальше на восток Койтендаг снова меняет маршрут. Пещеры, сухие хребты, удалённые селения и следы динозавров уместны в программе только тогда, когда дороги, гиды, разрешения, сезон и ночёвки проверены перед поездкой. Лебап — осознанное восточное продолжение, а не быстрый довесок к Ашхабаду, Мерву или Дарвазе."
  "uz": "Amudaryo sharqiy Turkmanistonga yoʻnalish beradi. Turkmanobod qadimiy Amul yaqinida joylashgan: daryo kechuvlari va Ipak yoʻli harakati bu chekkani oddiy eski shahar emas, balki o‘tish nuqtasiga aylantirgan.


    Yana sharqda Koytendag marshrutni o‘zgartiradi. Gʻorlar, quruq tizmalar, olis qishloqlar va dinozavr izlari haqidagi joylar faqat yoʻl, gid, ruxsat, mavsum va tunash rejasi safar oldidan tekshirilganda dasturga kiradi. Lebap Ashxobod, Marv yoki Darvozaga tez qoʻshimcha emas, balki ongli sharqiy davom."
