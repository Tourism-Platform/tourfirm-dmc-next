  "metaDescription":
    "en": "Bishkek does not rush the mountains into view. The capital lets the route settle first: plane trees, market noise, Soviet-era boulevards, small cafes, and the Ala-Too range at the edge of clear air. Beyond the city, the Chuy road brings the first wider choices. Tokmok and Burana carry the memory of Balasagun and the Silk Road; Ala-Archa brings river, spruce, rock, and snow close enough for an early mountain outing. Kegeti, Konorchek, and Suusamyr belong to longer decisions, but they start from the same question: how quickly should Kyrgyzstan move from city streets into open country?"
    "ru": "Бишкек не торопит горы в первый план. Сначала столица помогает маршруту собраться: платаны, шум рынков, советские бульвары, небольшие кафе и линия Ала-Тоо на краю прозрачного воздуха. За городом Чуйская дорога открывает первые большие решения. Токмок и Бурана ведут к памяти Баласагуна и Шёлкового пути; Ала-Арча быстро меняет город на реку, ели, камень и снег. Кегеты, Конорчек и Суусамыр требуют более длинного планирования, но вопрос начинается здесь же: как быстро переводить Кыргызстан от городских улиц к открытому пространству?"
    "uz": "Bishkek togʻlarni darhol oldinga chiqarmaydi. Avval poytaxt yoʻnalishni joyiga qoʻyadi: chinorlar, bozor shovqini, sovet davri bulvarlari, kichik kafelar va tiniq havoda ko‘rinadigan Ala-Too chizigʻi. Shahar tashqarisida Chuy yoʻli birinchi katta tanlovlarni ochadi. Toʻqmoq va Burana Balasagun xotirasi va Ipak yoʻli tarixiga olib kiradi; Ala-Archa esa shaharni tezda daryo, archa, tosh va qorga almashtiradi. Kegeti, Konorchek va Suusamyr uzoqroq reja talab qiladi, lekin savol shu yerdan boshlanadi: Qirgʻiziston shahar ko‘chalaridan ochiq tabiatga qanchalik tez o‘tishi kerak?"
