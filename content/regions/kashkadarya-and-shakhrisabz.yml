          "en": "Treat Hisorak as an extension, not an automatic promise. Reservoir views, the cable-car area, boat rides, and higher outings can make the day stronger when the road, weather, safety, and return time line up."
          "ru": "Держите Гиссарак как расширение, а не автоматическое обещание. Виды водохранилища, зона канатной дороги, катера и более высокие выезды усиливают день, когда дорога, погода, безопасность и возвращение складываются."
          "uz": "Hisorakni avtomatik vaʼda emas, kengayish sifatida tuting. Suv ombori manzaralari, kanat yo‘li hududi, qayiqlar va yuqoriroq chiqishlar yo‘l, ob-havo, xavfsizlik va qaytish vaqti mos kelganda kunni kuchaytiradi."
