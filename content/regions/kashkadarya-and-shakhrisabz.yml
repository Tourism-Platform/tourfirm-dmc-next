"excerpt":
  "en": "South of Samarkand, Kashkadarya changes the Uzbekistan route without leaving the classic city line behind. Shakhrisabz is the first anchor: Ak-Saray, the UNESCO-listed historic centre, Dorut Tilovat, Dorus-Saodat, Kok Gumbaz, Chorsu, and museum context. Longer routes can continue toward Qarshi, Kitab, Langar Ata, reservoirs, mountain villages, and the Gissar foothills before returning to Samarkand or carrying on toward Surkhandarya."
  "ru": "К югу от Самарканда Кашкадарья меняет маршрут по Узбекистану, но не отрывает его от классической линии городов. Первая точка региона — Шахрисабз: Ак-Сарай, исторический центр из списка UNESCO, Дорут-Тиловат, Дорус-Саодат, Кок-Гумбаз, Чорсу и музейный контекст. Более длинные маршруты могут продолжаться к Карши, Китабу, Лангар-Ата, водохранилищам, горным селениям и Гиссарским предгорьям, а затем возвращаться к Самарканду или уходить дальше к Сурхандарье."
  "uz": "Samarqanddan janubda Qashqadaryo O‘zbekiston yo‘nalishini o‘zgartiradi, lekin klassik shaharlar chizig‘idan uzib yubormaydi. Mintaqaning birinchi nuqtasi Shahrisabz: Ak-Saroy, UNESCO ro‘yxatidagi tarixiy markaz, Dorut Tilovat, Dorus Saodat, Ko‘k-Gumbaz, Chorsu va muzey konteksti. Uzunroq yo‘nalishlar Qarshi, Kitob, Langar ota, suv omborlari, tog‘ qishloqlari va Hisor etaklariga davom etib, keyin Samarqandga qaytishi yoki Surxondaryo tomonga yurishi mumkin."
