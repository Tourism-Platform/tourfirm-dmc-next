    "description":
      "en": "The route starts with Kokand heritage, then moves toward Margilan silk and Rishtan ceramics. Wider-valley places should be added only when access, timing, and their role in the itinerary are clear."
      "ru": "Маршрут начинается с наследия Коканда, затем ведёт к шёлку Маргилана и керамике Риштана. Более широкие места долины стоит добавлять только тогда, когда понятны доступ, время и роль в программе."
      "uz": "Yoʻnalish Qoʻqon merosidan boshlanadi, keyin Margʻilon ipagi va Rishton kulolchiligi tomonga boradi. Kengroq vodiy joylari faqat kirish, vaqt va dasturdagi oʻrni aniq boʻlganda qoʻshilishi kerak."
