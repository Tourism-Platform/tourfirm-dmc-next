  - "blockType": "regular"
    "eyebrow":
      "en": "Region character"
      "ru": "Характер региона"
      "uz": "Hudud xarakteri"
    "title":
      "en": "A valley of palace history and working craft"
      "ru": "Долина дворцовой истории и живого ремесла"
      "uz": "Saroy tarixi va tirik hunar vodiysi"
    "description":
      "en": "After Uzbekistan's landmark cities, the Fergana Valley turns the route toward workshops, markets, and craft towns, where silk and ceramics are seen as processes rather than finished pieces.


        «When Kokand, Margilan, and Rishtan each get enough time, the route comes together: palace history, silk process, then ceramics.»"
      "ru": "После главных городов наследия Ферганская долина разворачивает маршрут к мастерским, рынкам и ремесленным городам: здесь шёлк и керамику видят как процесс, а не только как готовые вещи.


        «Когда Коканду, Маргилану и Риштану хватает времени, маршрут держится на ясной связке: дворцовая история, шёлк и керамика.»"
      "uz": "Oʻzbekistonning asosiy meros shaharlaridan keyin Fargʻona vodiysi yoʻlni ustaxonalar, bozorlar va hunar shaharlariga buradi: bu yerda ipak va kulolchilik tayyor buyumdan koʻra jarayon sifatida koʻrinadi.


        «Qoʻqon, Margʻilon va Rishtonga yetarli vaqt berilganda, yoʻnalish aniq bogʻlanadi: saroy tarixi, ipak jarayoni, keyin kulolchilik.»"
  - "blockType": "regular"
