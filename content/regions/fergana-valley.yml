          "ru": "Чодак стоит читать через дорогу, а не только через точку на карте. Наманган задаёт время, Пап — районную рамку, а горный подъезд показывает, насколько спокойной может быть сельская остановка."
          "uz": "Chodakni faqat xarita nuqtasi bilan emas, yo‘l orqali o‘qish kerak. Namangan vaqtni beradi, Pop tuman ramkasini belgilaydi, tog‘ yondashuvi esa qishloq bekati qanchalik sokin sezilishini ko‘rsatadi."
