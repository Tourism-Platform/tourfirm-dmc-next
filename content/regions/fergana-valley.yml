          "ru": "Нанай не должен обещать постановочную программу, если детали не подтверждены на дату поездки. Когда чай, простая еда, ремесленный или фольклорный контекст либо местный разговор действительно согласованы, сельская остановка становится теплее и лучше запоминается."
