          "uz": "Maqom Chodakka turizm xaritasida aniq o‘rin beradi, lekin tashrif baribir qishloqning o‘zidan boshlanishi kerak: tog‘ havosi, Chodaksoy vodiysi, bog‘lar, buloqlar va mahalliy qabul."
