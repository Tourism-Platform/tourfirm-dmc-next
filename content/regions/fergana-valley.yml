          "ru": "Чодак сильнее всего, когда приём остаётся небольшим и настоящим. Чашка чая, простая еда, короткая прогулка или разговор дают остановке человеческий масштаб, но только если такая встреча действительно согласована на дату поездки."
          "uz": "Chodak qabul kichik va haqiqiy bo‘lganda kuchliroq. Bir piyola choy, oddiy taom, qisqa sayr yoki suhbat bekatga insoniy o‘lcham beradi, lekin faqat bunday uchrashuv safar sanasiga kelishilganda."
