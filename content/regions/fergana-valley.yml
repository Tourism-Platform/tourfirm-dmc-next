    "description":
      "en": "Kokand, Margilan, and Rishtan give the first route a clear shape: palace history, silk process, and ceramics. Add wider valley places only when the trip has enough days."
      "ru": "Коканд, Маргилан и Риштан дают первому маршруту ясную форму: дворцовая история, шёлковый процесс и керамика. Более широкие места стоит добавлять только при достаточном количестве дней."
      "uz": "Qoʻqon, Margʻilon va Rishton birinchi yoʻnalishga aniq shakl beradi: saroy tarixi, ipak jarayoni va kulolchilik. Kengroq joylar safarda yetarli kun boʻlganda qoʻshilsin."
