    "gridClassName": "grid-cols-1"
    "cards":
      - "type": "destinationInsight"
        "icon": "CircleQuestionMark"
        "title":
          "en": "How many days does Fergana Valley need in a programme?"
          "ru": "Сколько дней нужно региону Ферганская долина в программе?"
          "uz": "Fargʻona vodiysi hududi dasturda necha kun olishi kerak?"
        "description":
          "en": "2–3 days usually works if you keep one strong core and treat outer stops as deliberate choices. The region brief is “Palace history, silk workshops, and Rishtan ceramics”."
          "ru": "Обычно хватает 2–3 дня, если держать одно сильное ядро, а внешние остановки выбирать осознанно. Кратко о регионе: «Дворцовая история, шёлковые мастерские и риштанская керамика»."
          "uz": "Odatda 2–3 kun yetadi — bitta kuchli yadro va tashqi bekatlarni ongli tanlov qiling. Hudud brifi: «Saroy tarixi, ipak ustaxonalari va Rishton kulolchiligi»."
      - "type": "destinationInsight"
        "icon": "MapPin"
        "title":
          "en": "What should come before and after Fergana Valley?"
          "ru": "Что ставить до и после региона Ферганская долина?"
          "uz": "Fargʻona vodiysidan oldin va keyin nima qo‘yish kerak?"
        "description":
          "en": "Use neighbouring cities as clean handovers: arrive with a calm first night, leave after one completed chapter, and avoid stacking two long transfers on the same day."
          "ru": "Соседние города держите как чистые стыки: приезжайте со спокойной первой ночью, уезжайте после завершённой главы и не ставьте два длинных переезда в один день."
          "uz": "Qo‘shni shaharlarni toza ulanish sifatida tuting: sokin birinchi tun bilan keling, yakunlangan bobdan keyin chiqing va bir kunga ikkita uzun ko‘chishni qo‘ymang."
      - "type": "destinationInsight"
        "icon": "CloudSun"
        "title":
          "en": "What season logic matters most in Fergana Valley?"
          "ru": "Какая сезонная логика важнее всего в Ферганская долина?"
          "uz": "Fargʻona vodiysida qaysi mavsum mantig‘i eng muhim?"
        "description":
          "en": "Heat, altitude, road condition, and opening hours change the product more than the brochure list. Build the region around what stays comfortable for the group that week."
          "ru": "Жара, высота, состояние дорог и часы работы меняют продукт сильнее списка из брошюры. Собирайте регион вокруг того, что комфортно именно этой группе в эту неделю."
          "uz": "Issiqlik, balandlik, yo‘l holati va ish soatlari broshyura ro‘yxatidan kuchliroq mahsulotni o‘zgartiradi. Hududni shu hafta guruh uchun qulay narsaga qurib chiqing."
