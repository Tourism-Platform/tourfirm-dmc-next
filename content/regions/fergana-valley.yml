        "title":
          "en": "Kokand"
          "ru": "Коканд"
          "uz": "Qoʻqon"
        "description":
          "en": "In Kokand, the Fergana Valley route turns to a former khanate capital: Khudoyar Khan Palace, Jameh Mosque, madrasah courtyards, khanate memorials, Kokand Craft House, and the road onward to Margilan silk and Rishtan ceramics."
          "ru": "В Коканде маршрут по Ферганской долине поворачивает к бывшей ханской столице: дворцу Худояр-хана, мечети Джами, дворам медресе, ханским мемориалам, Дому ремёсел и дороге дальше к шёлку Маргилана и керамике Риштана."
          "uz": "Qoʻqonda Fargʻona vodiysi yo‘nalishi sobiq xonlik poytaxtiga buriladi: Xudoyorxon saroyi, Jome masjidi, madrasa hovlilari, xonlik memoriallari, Hunarmandchilik uyi hamda Margʻilon ipagi va Rishton keramikasi tomonga yo‘l."
        "ctaHref": "/destinations/uzbekistan/fergana-valley/kokand"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
      - "type": "routeIdea"
        "image": "assets/images/destinations/uzbekistan/regions/fergana-valley/cities/margilan.webp"
        "badge":
          "en": "City"
          "ru": "Город"
          "uz": "Shahar"
        "title":
          "en": "Margilan"
          "ru": "Маргилан"
          "uz": "Margʻilon"
        "description":
          "en": "Start with Yodgorlik because it makes silk visible: cocoons, thread, dye, looms, fabric, and artisans at work. Then widen the visit carefully with the craft centre, atlas and adras, Said Ahmad-Khoja, Pir Siddiq, Kumtepa Bazaar, and the road toward Rishtan or Kokand."
          "ru": "Начните с Yodgorlik: здесь шёлк виден через коконы, нить, красители, станки, ткань и работу мастеров. Затем аккуратно расширяйте визит: ремесленный центр, атлас и адрас, медресе Саид Ахмад-Ходжа, Пир Сиддик, Кумтепа-базар и дорога к Риштану или Коканду."
          "uz": "Yodgorlikdan boshlang: bu yerda ipak pilla, ip, bo‘yoq, dastgoh, mato va ustalar ishi orqali ko‘rinadi. Keyin tashrifni hunar markazi, atlas va adras, Said Ahmad Xoja, Pir Siddiq, Kumtepa bozori hamda Rishton yoki Qoʻqon yo‘li bilan ehtiyotkor kengaytiring."
        "ctaHref": "/destinations/uzbekistan/fergana-valley/margilan"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
      - "type": "routeIdea"
        "image": "assets/images/destinations/uzbekistan/regions/fergana-valley/cities/rishtan.webp"
        "badge":
          "en": "City"
          "ru": "Город"
          "uz": "Shahar"
        "title":
          "en": "Rishtan"
          "ru": "Риштан"
          "uz": "Rishton"
        "description":
          "en": "Rishtan is easiest to understand when you see the work before the finished bowl: clay on the wheel, a pattern before firing, blue-green glaze, shelves of drying pieces, and the artisans who keep the local school alive."
          "ru": "Риштан понятнее, когда сначала видна работа, а не только готовая пиала: глина на круге, узор до обжига, сине-зелёная глазурь, полки с изделиями и мастера, которые продолжают местную школу."
          "uz": "Rishtonni tayyor piyola bilan emas, avval ish jarayoni bilan tushunish osonroq: charxdagi loy, pishirishdan oldingi naqsh, ko‘k-yashil sir, javondagi buyumlar va mahalliy maktabni davom ettirayotgan ustalar."
        "ctaHref": "/destinations/uzbekistan/fergana-valley/rishtan"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
      - "type": "routeIdea"
        "image": "assets/images/destinations/uzbekistan/regions/fergana-valley/cities/chust.webp"
        "badge":
          "en": "City"
          "ru": "Город"
          "uz": "Shahar"
        "title":
          "en": "Chust"
          "ru": "Чуст"
          "uz": "Chust"
        "description":
          "en": "Chust is not a broad sightseeing city. It earns its place when the route can slow down for one clear craft encounter: a pichoq maker, doʻppi work, or a market pause explained by a local host or guide."
          "ru": "Чуст не похож на большой город для осмотра. Он уместен, когда маршрут может замедлиться ради одной ясной ремесленной встречи: у ножевого мастера, за работой с доппи или на рыночной паузе с объяснением местного гида."
          "uz": "Chust keng shahar sayri uchun joy emas. U yoʻl bitta aniq hunarmandchilik uchrashuvi uchun sekinlashganda maʼno topadi: pichoq ustasi, doʻppi ishi yoki mahalliy gid izohi bilan bozor pauzasi."
        "ctaHref": "/destinations/uzbekistan/fergana-valley/chust"
        "ctaLabel":
          "en": "Open place"
