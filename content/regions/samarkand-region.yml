    "cards":
      - "type": "destinationInsight"
        "icon": "CircleQuestionMark"
        "title":
          "en": "How many days does Samarkand need in a programme?"
          "ru": "Сколько дней нужно региону Самарканд в программе?"
          "uz": "Samarqand hududi dasturda necha kun olishi kerak?"
        "description":
          "en": "3–5 days usually works if you keep one strong core and treat outer stops as deliberate choices. The region brief is “City monuments, craft, archaeology, and the road to Bukhara”."
          "ru": "Обычно хватает 3–5 дней, если держать одно сильное ядро, а внешние остановки выбирать осознанно. Кратко о регионе: «Городские памятники, ремесло, археология и дорога к Бухаре»."
          "uz": "Odatda 3–5 kun yetadi — bitta kuchli yadro va tashqi bekatlarni ongli tanlov qiling. Hudud brifi: «Shahar yodgorliklari, hunarmandchilik, arxeologiya va Buxoro yoʻli»."
      - "type": "destinationInsight"
        "icon": "Landmark"
        "title":
