    "description":
      "en": "Samarkand often becomes the strongest memory of the trip, but a good route does not end at Registan. It leaves room for archaeology, craft, a pilgrimage outing, or a calm train continuation to Bukhara."
      "ru": "Самарканд часто остаётся главной памятью поездки, но хороший маршрут не заканчивается на Регистане. Он оставляет место для археологии, ремесла, паломнического выезда или спокойного продолжения поездом к Бухаре."
      "uz": "Samarqand ko‘pincha O‘zbekiston yo‘nalishining asosiy xotirasi bo‘lib qoladi, lekin yaxshi yoʻnalish Registonda tugamaydi. U arxeologiya, hunarmandchilik, ziyorat chiqishi yoki Buxoro tomon sokin poyezd davomiga joy qoldiradi."


