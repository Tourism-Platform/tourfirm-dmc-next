      en: "Samarkand is the symbolic center of Uzbekistan's Silk Road narrative. Registan sets the visual tone, while Shah-i-Zinda adds spiritual and funerary architecture. Most first-time visits pair iconic monuments with a slower old-city walk to balance major landmarks and local rhythm."
