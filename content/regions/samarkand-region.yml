"seo":
  "metaTitle":
    "en": "Samarkand | TourLink"
    "ru": "Самарканд | TourLink"
    "uz": "Samarqand | TourLink"
  "metaDescription":
    "en": "Start with Samarkand city: Registan, Shah-i-Zinda, Bibi-Khanym, Siab Bazaar, Gur-e-Amir, Afrosiab, and Ulugh Beg Observatory make a clear first day. Then widen the region selectively: Konigil for craft, Urgut for the market and mountain side, Imam al-Bukhari and Saint Daniel for pilgrimage context, Tersak or Chor-Chinor for a separate outing, and the train onward to Bukhara."
    "ru": "Начните с Самарканда: Регистан, Шахи-Зинда, Биби-Ханым, Сиабский базар, Гур-Эмир, Афрасиаб и обсерватория Улугбека дают понятный первый день. Затем регион лучше расширять выборочно: Конигил для ремесла, Ургут для рынка и горной стороны, Имам аль-Бухари и Святой Даниил для паломнического контекста, Терсак или Чор-Чинор для отдельного выезда, поезд дальше к Бухаре."
    "uz": "Samarqand shahridan boshlang: Registon, Shohi Zinda, Bibi Xonim, Siyob bozori, Goʻri Amir, Afrosiyob va Ulugʻbek rasadxonasi birinchi kunni aniq qiladi. Keyin hududni tanlab kengaytiring: hunarmandchilik uchun Konigil, bozor va togʻ tomoni uchun Urgut, ziyorat konteksti uchun Imom al-Buxoriy va Doniyor paygʻambar, alohida chiqish uchun Tersak yoki Chor Chinor, Buxoro tomon davom etadigan poyezd."
