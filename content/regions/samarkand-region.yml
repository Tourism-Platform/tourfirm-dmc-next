  "uz": "Samarqand shahridan boshlang: Registon, Shohi Zinda, Bibi Xonim, Siyob bozori, Goʻri Amir, Afrosiyob va Ulugʻbek rasadxonasi birinchi kunni aniq qiladi. Keyin hududni tanlab kengaytiring: hunarmandchilik uchun Konigil, bozor va togʻ tomoni uchun Urgut, ziyorat konteksti uchun Imom al-Buxoriy va Doniyor paygʻambar, alohida chiqish uchun Tersak yoki Chor Chinor, Buxoro tomon davom etadigan poyezd."
