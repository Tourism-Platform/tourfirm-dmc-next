        "title":
          "en": "Proto-urban Site of Sarazm"
          "ru": "Протогородище Саразм"
          "uz": "Sarazm protoshahar yodgorligi"
        "description":
          "en": "Near Penjikent, Sarazm takes the Zeravshan story back to the 4th and 3rd millennia BCE. The site is quiet at first glance; with the chronology in mind, its protected remains become early houses, work areas, metalworking, and exchange across Central Asia."
          "ru": "Рядом с Пенджикентом Саразм уводит историю Зеравшана к IV-III тысячелетиям до н. э. Снаружи место кажется тихим, но с понятной хронологией его защищённые остатки складываются в ранние жилища, рабочие зоны, металлургию и обмен по Центральной Азии."
          "uz": "Panjikent yaqinidagi Sarazm Zarafshon hikoyasini miloddan avvalgi IV-III ming yilliklarga qaytaradi. Avvaliga joy sokin koʻrinadi, lekin vaqt tartibi tushunarli boʻlsa, himoyalangan qoldiqlarda ilk uylar, ish maydonlari, metall ishlovi va Markaziy Osiyo boʻylab almashinuv koʻrina"
        "ctaHref": "/destinations/tajikistan/fann-mountains-and-zeravshan/penjikent/proto-urban-site-of-sarazm"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
      - "type": "routeIdea"
        "image": "assets/images/destinations/tajikistan.jpg"
        "badge":
          "en": "Must see"
          "ru": "Главное"
          "uz": "Asosiy"
        "title":
          "en": "Ancient Penjikent"
          "ru": "Древний Пенджикент"
          "uz": "Qadimiy Panjikent"
        "description":
          "en": "Ancient Penjikent sits above the modern town, with the Zeravshan Valley below and the mountain roads beyond. Walk it slowly: the low walls, palace and temple traces, and open view need time and explanation."
          "ru": "Древний Пенджикент лежит над современным городом, с Зеравшанской долиной внизу и горными дорогами дальше. Здесь нужен неспешный шаг: низкие стены, следы дворца и храмов и открытый вид раскрываются с пояснением."
          "uz": "Qadimiy Panjikent zamonaviy shahar ustida, pastda Zarafshon vodiysi va uzoqda togʻ yoʻllari bilan turadi. Bu yerda sekin yurish kerak: past devorlar, saroy va ibodatxona izlari hamda ochiq manzara izoh bilan yaxshiroq ochiladi."
        "ctaHref": "/destinations/tajikistan/fann-mountains-and-zeravshan/penjikent/ancient-penjikent"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
      - "type": "routeIdea"
        "image": "assets/images/destinations/tajikistan.jpg"
        "badge":
          "en": "Must see"
          "ru": "Главное"
          "uz": "Asosiy"
        "title":
          "en": "Rudaki Museum in Penjikent"
          "ru": "Музей Рудаки в Пенджикенте"
          "uz": "Panjikentdagi Rudakiy muzeyi"
        "description":
          "en": "Inside the town, the museum gives names and objects to the archaeology outside. Rudaki's literary memory, local history rooms, and excavated material make Penjikent feel less like separate sites and more like a place with its own memory."
          "ru": "В городе музей даёт археологии имена и предметы. Память Рудаки, местная история и найденные материалы помогают воспринимать Пенджикент не как набор площадок, а как город со своей памятью."
          "uz": "Shahar ichida muzey tashqaridagi arxeologiyaga ism va buyumlar beradi. Rudakiy xotirasi, mahalliy tarix va topilmalar Panjikentni faqat joylar ketma-ketligi emas, oʻz xotirasi bor shahar sifatida koʻrsatadi."
        "ctaHref": "/destinations/tajikistan/fann-mountains-and-zeravshan/penjikent/rudaki-museum-in-penjikent"
