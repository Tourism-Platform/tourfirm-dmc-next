"excerpt":
  "en": "West of Tajikistan’s main route, Zeravshan opens with the walls of Ancient Penjikent, the early settlement horizon of Sarazm, and the river road toward the Fann Mountains. Penjikent gives the first town-and-market stop; from there, the route turns toward one lake or mountain continuation according to season, road condition, and how much mountain quiet belongs in the journey."
  "ru": "На западе Таджикистана Зеравшан открывается стенами древнего Пенджикента, ранним поселением Саразма и дорогой к Фанским горам. Пенджикент даёт маршруту городскую и рыночную остановку; дальше путь уходит к одному озёрному или горному продолжению - по сезону, состоянию дороги и тому, сколько горной тишины нужно в поездке."
  "uz": "Tojikiston gʻarbida Zarafshon qadimiy Panjikent devorlari, Sarazmning ilk manzili va Fan togʻlariga ketadigan yoʻl bilan ochiladi. Panjikent yoʻnalishga shahar va bozor toʻxtamini beradi; keyin yoʻl mavsum, yoʻl holati va safarga qancha togʻ sokinligi kerakligiga qarab bitta ko‘l yoki togʻ davomi tomon buriladi."
