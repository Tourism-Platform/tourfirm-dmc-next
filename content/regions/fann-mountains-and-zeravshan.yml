      "uz": "Yoʻnalishga shahar tayanchi kerak boʻlsa, Panjikentdan boshlang. Iskandarkoʻl va Yetti koʻl Panjikentga tegishli joylar emas, yonma-yon turgan koʻl hududlari sifatida oʻqiladi."
