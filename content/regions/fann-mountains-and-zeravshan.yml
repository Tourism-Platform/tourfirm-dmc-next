    "description":
      "en": "Ancient Penjikent, Sarazm, and the Rudaki Museum give the region its Sogdian and local-history start; after them, the route can turn toward Iskanderkul, Seven Lakes, or other Fann Mountain choices."
      "ru": "Древний Пенджикент, Саразм и музей Рудаки дают региону согдийское и местное историческое начало; после них маршрут может повернуть к Искандеркулю, Семи озёрам или другим горным продолжениям."
      "uz": "Qadimiy Panjikent, Sarazm va Rudakiy muzeyi regionga Sugʻd va mahalliy tarix boshlanishini beradi; ulardan keyin yoʻl Iskandarkoʻl, Yetti koʻl yoki Fan togʻlaridagi boshqa davomlarga burilishi mumkin."
