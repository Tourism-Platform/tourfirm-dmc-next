"seo":
  "metaTitle":
    "en": "Jalal-Abad & Arslanbob | TourLink"
    "ru": "Джалал-Абад и Арсланбоб | TourLink"
    "uz": "Jalolobod va Arslonbob | TourLink"
  "metaDescription":
    "en": "Jalal-Abad & Arslanbob is the greener western turn of a Kyrgyzstan route. From Osh or Bishkek connections, the road moves into warmer valleys, walnut shade, village courtyards, and protected lake country. The regional city now officially named Manas still appears in many travel contexts as Jalal-Abad, so both names matter when planning the road.


      Arslanbob and Sary-Chelek need time. Arslanbob asks for walking pace, hosts, waterfalls, and walnut-forest shade; Sary-Chelek asks for protected-area checks, road time, and a quiet nature plan. The region works best when it is not squeezed between larger Kyrgyzstan anchors."
    "ru": "Джалал-Абад и Арсланбоб — более зелёный западный поворот маршрута по Кыргызстану. После связок с Ошем или Бишкеком дорога уходит в тёплые долины, тень ореховых деревьев, деревенские дворы и озёрную природу. Региональный город, официально названный Манасом, всё ещё часто встречается путешественникам как Джалал-Абад, поэтому в планировании важны оба названия.


      Арсланбобу и Сары-Челеку нужно время. Арсланбоб просит пешего темпа, хозяев, водопадов и орехового леса; Сары-Челек просит проверки правил охраняемой территории, дороги и сезона. Регион лучше работает, когда его не сжимают между крупными опорами Кыргызстана."
    "uz": "Jalolobod va Arslonbob Qirgʻiziston yoʻnalishining yashilroq gʻarbiy burilishidir. Oʻsh yoki Bishkek bilan bogʻlangan yoʻllardan keyin marshrut iliq vodiylar, yongʻoq soyasi, qishloq hovlilari va koʻl tabiatiga kiradi. Hozir rasmiy nomi Manas boʻlgan mintaqaviy shahar sayohatchilarga hali ham Jalolobod sifatida uchrashi mumkin, shuning uchun yoʻl rejasida ikkala nom ham muhim.


      Arslonbob va Sary-Chelekka vaqt kerak. Arslonbob piyoda ritm, mezbonlar, sharsharalar va yongʻoq oʻrmoni soyasini soʻraydi; Sary-Chelek esa qoʻriqlanadigan hudud qoidalari, yoʻl va mavsum tekshiruvini talab qiladi. Hudud Qirgʻizistonning katta tayanchlari orasiga siqilmaganda yaxshiroq ishlaydi."
