    "description":
      "en": "Jalal-Abad & Arslanbob changes the feel of a Kyrgyzstan journey. The trip becomes warmer, greener, more village-led, and more dependent on road rhythm than on a long checklist.


        «The west works best when it slows the route down: a city name to read carefully, a village to walk through, and protected lake country that asks for restraint.»"
      "ru": "Джалал-Абад и Арсланбоб меняют ощущение путешествия по Кыргызстану. Поездка становится теплее, зеленее, ближе к деревням и сильнее зависит от ритма дороги, чем от длинного списка мест.


        «Запад лучше всего работает тогда, когда замедляет маршрут: городское название нужно прочитать внимательно, деревню — пройти пешком, а озёрной природе — оставить пространство.»"
      "uz": "Jalolobod va Arslonbob Qirgʻiziston sayohati kayfiyatini oʻzgartiradi. Yoʻl iliqroq, yashilroq, qishloqqa yaqinroq boʻladi va uzun roʻyxatdan koʻra yoʻl ritmiga koʻproq bogʻlanadi.


        «Gʻarb marshrutni sekinlashtirganda eng yaxshi ishlaydi: shahar nomini diqqat bilan oʻqish, qishloqdan piyoda oʻtish va koʻl tabiatiga kenglik qoldirish kerak.»"
  - "blockType": "regular"
