      "ru": "Регион читается через практический город, деревенско-лесной ритм Арсланбоба и озёрную природу Сары-Челека. Токтогул, Базар-Коргон и Сузак остаются маршрутным контекстом, пока не появятся более сильные источники и проверки доступа."
      "uz": "Hudud amaliy shahar, Arslonbobning qishloq-oʻrmon ritmi va Sary-Chelekning koʻl tabiati orqali oʻqiladi. Toktogul, Bazar-Korgon va Suzak kuchliroq manbalar hamda kirish tekshiruvlari tayyor boʻlguncha marshrut konteksti boʻlib qoladi."
