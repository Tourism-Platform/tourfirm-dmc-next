"excerpt":
  "en": "Osh begins before breakfast: bread ovens warming the streets, spice rows opening at the bazaar, Sulaiman-Too rising above the city. This is Kyrgyzstan's southern threshold, where the route carries Silk Road memory before it turns toward Uzgen, Sary-Mogul, the Alay Valley, or the wider Fergana edge. Come here when Kyrgyzstan should feel lived-in, historical, and connected to roads beyond the mountains."
  "ru": "Ош начинается до завтрака: тандыры прогревают улицы, на базаре открываются ряды специй, над городом поднимается Сулайман-Тоо. Это южный порог Кыргызстана: здесь маршрут несёт память Шёлкового пути, а дальше выбирает дорогу к Узгену, Сары-Моголу, Алайской долине или Ферганскому краю. Сюда стоит ехать, когда хочется увидеть Кыргызстан через живую южную историю, а не только через горный пейзаж."
  "uz": "Oʻsh nonushtagacha uygʻonadi: tandirlar qiziydi, bozorda ziravor qatorlari ochiladi, Sulaymon-Too shahar ustida koʻtariladi. Bu Qirgʻizistonning janubiy ostonasi: marshrut bu yerda Ipak yoʻli xotirasi bilan boshlanadi, keyin Oʻzgan, Sary-Mogol, Oloy vodiysi yoki Fargʻona tomonga yoʻl tanlaydi. Bu hudud Qirgʻizistonni faqat togʻ manzarasi emas, jonli janubiy tarix orqali ko‘rishni istaganlar uchun."
