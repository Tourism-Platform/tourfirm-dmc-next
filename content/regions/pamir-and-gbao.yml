  "en": "Pamir & GBAO is where Tajikistan turns into high-road travel. Khorog gives the journey a town anchor before the Panj valley, the Wakhan road, the Murghab plateau, Bartang, and Karakul make altitude, permits, road condition, and time part of the route."
