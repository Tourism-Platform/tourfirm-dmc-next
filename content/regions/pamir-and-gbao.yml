  "uz": "Pomir va GBAO Tojikiston baland yoʻl safariga aylana boshlaydigan hudud. Xorugʻ Panj vodiysi, Vaxon yoʻli, Murgʻob platosi, Bartang va Qorakoʻldan oldin shahar tayanchini beradi; bu yoʻllarda balandlik, ruxsatnoma, yoʻl holati va vaqt zaxirasi marshrutning bir qismiga aylanadi."
