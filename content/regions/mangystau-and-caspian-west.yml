      "en": "Mangystau is wind, chalk, salt, wide light, and long gaps between services. The journey feels strongest when the road is planned as carefully as the viewpoints.


        «In Mangystau, the road is not empty space between sights; it is the condition that makes the sights possible.»"
      "ru": "Мангистау — это ветер, мел, соль, широкий свет и большие расстояния между сервисами. Маршрут сильнее всего ощущается тогда, когда дорогу планируют так же внимательно, как сами виды.


        «В Мангистау дорога — не пустое пространство между местами; это условие, благодаря которому эти места становятся возможными.»"
      "uz": "Mangʻistov — shamol, boʻr, tuz, keng yorugʻlik va xizmatlar orasidagi uzoq masofa. Yo‘l manzaralar kabi diqqat bilan rejalanganda sayohat kuchliroq seziladi.


        «Mangʻistovda yo‘l joylar orasidagi bo‘shliq emas; u bu joylarni mumkin qiladigan shartdir.»"
