"excerpt":
  "en": "Mangystau & Caspian West changes Kazakhstan by scale. The route begins with Aktau's Caspian wind and pale city light, then moves inland toward chalk escarpments, stone fields, lone mesas, underground mosques, and roads where distance becomes part of the experience.


    This region can be extraordinary, but it should not be rushed. Bozzhira, Torysh, Sherkala, Beket-Ata, and the Ustyurt edge need the right vehicle, water, daylight, heat planning, and drivers who know which roads remain passable after weather and season changes."
  "ru": "Мангистау и запад Каспия меняют масштаб Казахстана. Маршрут начинается с каспийского ветра Актау и светлого городского берега, а затем уходит внутрь — к меловым уступам, каменным полям, одиноким столовым горам, подземным мечетям и дорогам, где расстояние становится частью впечатления.


    Этот регион может быть сильным, но его нельзя торопить. Бозжыра, Торыш, Шеркала, Бекет-Ата и край Устюрта требуют подходящей машины, воды, светового дня, плана на жару и водителей, которые знают, какие дороги остаются проходимыми после погоды и сезона."
  "uz": "Mangʻistov va Kaspiy gʻarbi Qozogʻistonning miqyosini oʻzgartiradi. Sayohat Aqtau shahridagi Kaspiy shamoli va och rangli shahar yorugʻligidan boshlanadi, keyin yoʻl boʻr qirlar, tosh maydonlari, yakka yassi togʻlar, yerosti masjidlari va masofa taassurotning bir qismiga aylangan yoʻllarga kiradi.


    Bu hudud juda kuchli bo‘lishi mumkin, lekin uni shoshirib bo‘lmaydi. Bozzhira, Torysh, Sherkala, Beket-Ata va Ustyurt cheti mos avtomobil, suv, kunduzgi vaqt, issiqda yurish rejasi va ob-havo hamda mavsumdan keyin qaysi yo‘llar yurishga yaroqli ekanini biladigan haydovchilarni talab qiladi."
