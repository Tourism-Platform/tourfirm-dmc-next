        "title":
          "en": "Abdulaziz Khan Madrasah"
          "ru": "Медресе Абдулазиз-хана"
          "uz": "Abdulazizxon madrasasi"
        "description":
          "en": "Abdulaziz Khan Madrasah stands opposite Ulugbek Madrasah, so the two monuments are best seen together. One belongs to the Timurid tradition of learning; the other shows 17th-century Bukhara through a painted portal, carved detail, and the lived street beside the trading domes."
          "ru": "Медресе Абдулазиз-хана стоит напротив медресе Улугбека, поэтому два памятника удобно смотреть вместе. Один связан с тимуридской традицией учёбы, другой показывает Бухару XVII века через расписной портал, резные детали и жизнь улицы у торговых куполов."
          "uz": "Abdulazizxon madrasasi Ulugbek madrasasi ro‘parasida turadi, shuning uchun ikki yodgorlikni birga ko‘rish maʼqul. Biri temuriylar davri ilm anʼanasi bilan bog‘liq; ikkinchisi XVII asr Buxorosini rangli peshtoq, o‘yma detal va savdo gumbazlari yonidagi ko‘cha hayoti orqali ko‘rsat"
        "ctaHref": "/destinations/uzbekistan/bukhara-region/bukhara/abdulaziz-khan-madrasah"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
