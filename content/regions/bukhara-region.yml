  - "blockType": "regular"
    "eyebrow":
      "en": "What to see"
      "ru": "Что посмотреть"
      "uz": "Nima ko‘rish kerak"
    "title":
      "en": "Old city and places beyond it"
      "ru": "Старый город и места за его пределами"
      "uz": "Eski shahar va uning tashqarisidagi joylar"
    "description":
      "en": "Poi-Kalyan, the Ark, and Lyabi-Hauz shape the first old-city walk. The Samanid Mausoleum, Chashma-Ayub, Bolo-Hauz, Magoki-Attori, Chor Minor, madrasahs, trading domes, museum houses, and the museum-preserve deepen the city day; Sitorai Mokhi-Khosa, Bahauddin Naqshband, Chor-Bakr, Gijduvan, Vabkent, Varakhsha, Paikend, and Jeyran carry the route beyond the compact center."
      "ru": "Из Пои-Каляна, Арка и Ляби-Хауза складывается первая прогулка по старой Бухаре. Мавзолей Саманидов, Чашма-Аюб, Боло-Хауз, Магоки-Аттори, Чор-Минор, медресе, торговые купола, музейные дома и музей-заповедник углубляют городской день; Ситораи Мохи-Хоса, Бахауддин Накшбанд, Чор-Бакр, Гиждуван, Вабкент, Варахша, Пайкенд и Джейран продолжают маршрут за пределами компактного центра."
      "uz": "Poyi Kalon, Ark va Labi Hovuzdan eski Buxoro bo‘ylab birinchi sayr yigʻiladi. Somoniylar maqbarasi, Chashma-Ayub, Bolo-Hauz, Magʻoki Attori, Chor Minor, madrasalar, savdo gumbazlari, muzey uylari va muzey-qo‘riqxona shahar kunini chuqurlashtiradi; Sitorai Mohi-Xosa, Bahouddin Naqshband, Chor Bakr, Gʻijduvon, Vobkent, Varaxsha, Poykend va Jayron yo‘lni ixcham markazdan tashqariga davom ettiradi."
