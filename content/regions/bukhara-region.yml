    "title":
      "en": "How Bukhara shapes the westward route"
      "ru": "Как Бухара меняет путь на запад"
      "uz": "Buxoro gʻarbga yoʻlni qanday oʻzgartiradi"
    "description":
      "en": "Bukhara can be the calm midpoint between Samarkand and Khiva when the route starts with the old city and chooses one or two continuations by meaning: Gijduvan, Vabkent, Seven Pirs, palace, necropolis, archaeology, nature, or the road to Khorezm."
      "ru": "Бухара может стать спокойной серединой пути между Самаркандом и Хивой, если маршрут начинается со старого города и выбирает одно-два продолжения по смыслу: Гиждуван, Вабкент, Семь пиров, дворец, некрополь, археологию, природу или дорогу к Хорезму."
      "uz": "Buxoro Samarqand va Xiva orasida sokin oʻrta nuqta boʻla oladi, agar yoʻnalish eski shahardan boshlanib, maʼnosi bo‘yicha bir yoki ikki davomni tanlasa: Gʻijduvon, Vobkent, Yetti Pir, saroy, nekropol, arxeologiya, tabiat yoki Xorazm tomonga yoʻl."


