      - "type": "routeIdea"
        "image": "assets/images/destinations/uzbekistan/regions/bukhara-region/cities/bukhara/attractions/bukhara-state-architectural-art-museum-preserve.webp"
        "badge":
          "en": "Must see"
          "ru": "Главное"
          "uz": "Asosiy"
        "title":
          "en": "Bukhara Museum-Preserve"
          "ru": "Бухарский музей-заповедник"
          "uz": "Buxoro muzey-qo‘riqxonasi"
        "description":
          "en": "Bukhara State Art-Architectural Museum-Preserve is a museum system, not a single monument. The Ark gives it the clearest public address; the branches continue the story through palace rooms, a merchant house, fine-art galleries, documents, coins, textiles, books, and objects from"
          "ru": "Бухарский государственный архитектурно-художественный музей-заповедник — это музейная система, а не один памятник. Арк даёт ей самый понятный публичный адрес; филиалы продолжают тему через дворцовые залы, купеческий дом, художественные коллекции, документы, монеты, ткани, книги и"
          "uz": "Buxoro davlat meʼmoriy-badiiy muzey-qo‘riqxonasi bitta yodgorlik emas, balki muzey tizimidir. Ark uning eng tushunarli ommaviy manzili; filiallar esa saroy xonalari, savdogar uyi, tasviriy sanʼat, hujjatlar, tangalar, matolar, kitoblar va Buxoroning kundalik hayoti buyumlari orqa"
        "ctaHref": "/destinations/uzbekistan/bukhara-region/bukhara/bukhara-state-architectural-art-museum-preserve"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
