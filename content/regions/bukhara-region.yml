          "ru": "Главное"
          "uz": "Asosiy"
        "title":
          "en": "Abdulkhalik Gijduvani"
          "ru": "Абдулхалик Гиждувани"
          "uz": "Abduxoliq Gʻijduvoniy"
        "description":
          "en": "This is the Gijduvan stop where the day moves from craft to pilgrimage memory: a memorial courtyard, the mausoleum, and the start of the Seven Pirs route before the road turns back toward Bukhara."
          "ru": "Это остановка в Гиждуване, где день переходит от ремесла к паломнической памяти: мемориальный двор, мавзолей и начало маршрута Семи пиров перед возвращением дороги к Бухаре."
          "uz": "Bu Gʻijduvondagi kun hunardan ziyorat xotirasiga oʻtadigan toʻxtash: memorial hovli, maqbara va Buxoroga qaytish yoʻlidan oldin Yetti Pir marshrutining boshlanishi."
