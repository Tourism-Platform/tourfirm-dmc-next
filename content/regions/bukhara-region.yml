          "ru": "Гиждуван"
          "uz": "Gʻijduvon"
        "description":
          "en": "On the road from Bukhara, Gijduvan shifts the day from old-city monuments to clay, pattern, and the hands that make them. The visit centers on ceramics, with Abdulkhalik Gijduvani added when the route also follows the Seven Pirs story."
          "ru": "На дороге из Бухары Гиждуван переводит день от памятников старого города к глине, узору и рукам мастера. Главный смысл визита — керамика; Абдулхалик Гиждувани входит в день, когда маршрут связан с историей Семи пиров."
          "uz": "Buxorodan chiqadigan yoʻlda Gʻijduvon kunni eski shahar yodgorliklaridan loy, naqsh va usta qoʻliga buradi. Tashrifning asosiy maʼnosi kulolchilik, Abduxoliq Gʻijduvoniy esa yoʻnalish Yetti Pir hikoyasi bilan bogʻlanganda kunga kiradi."
