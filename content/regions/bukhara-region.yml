        "description":
          "en": "Bukhara does not open from one square. The old center comes together through short transitions: a shaded trading dome, a carved doorway, tea beside Lyabi-Hauz, then the sudden vertical line of Kalyan Minaret above the lanes."
          "ru": "Бухара не раскрывается с одной площади. Старый центр собирается из коротких переходов: тенистый торговый купол, резная дверь, чай у Ляби-Хауза, а затем резкая вертикаль минарета Калян над улицами."
          "uz": "Buxoro bitta maydondan ochilmaydi. Eski markaz qisqa o‘tishlardan yigʻiladi: soyali savdo gumbazi, o‘yma eshik, Labi Hovuz yonidagi choy, keyin ko‘chalar ustida ko‘tarilgan Kalon minorasi."
