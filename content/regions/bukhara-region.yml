  - "blockType": "regular"
    "eyebrow":
      "en": "Region character"
      "ru": "Характер региона"
      "uz": "Hudud xarakteri"
    "title":
      "en": "The old city as the beginning, not the whole region"
      "ru": "Старый город как начало, а не весь регион"
      "uz": "Eski shahar - boshlanish, butun hudud emas"
    "description":
      "en": "The strongest Bukhara route lets the old center settle first, then uses craft, palace, pilgrimage, archaeology, nature, and rail-gateway stops to show why the region is larger than the city walls.


        «Bukhara region is clearer when the old city becomes the starting point, not a substitute for the whole route.»"
      "ru": "Самый сильный маршрут по Бухаре сначала даёт старому центру стать понятным, а затем через ремесло, дворец, паломнические места, археологию, природу и железнодорожные ворота показывает, что регион больше городских стен.


        «Бухарский регион понятнее, когда старый город становится отправной точкой, а не заменяет собой весь маршрут.»"
      "uz": "Buxoro boʻylab eng kuchli yoʻnalish avval eski markazni tushunarli qiladi, keyin hunarmandchilik, saroy, ziyorat, arxeologiya, tabiat va temiryoʻl kirishlari orqali hudud shahar devorlaridan kengroq ekanini ko‘rsatadi.


        «Buxoro hududi eski shahar butun yoʻnalish oʻrnini bosmay, boshlanish nuqtasi bo‘lganda aniqroq ko‘rinadi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "Where to start"
      "ru": "Где начать"
      "uz": "Qayerdan boshlash"
    "title":
      "en": "Old city first, then the wider route"
      "ru": "Старый город и выезды из него"
      "uz": "Avval eski shahar, keyin kengroq yo‘l"
    "description":
      "en": "Start with Bukhara's old city. Gijduvan adds ceramics, family workshops, and the first pir on the Seven Pirs road; Vabkent, Romitan-area ziyorat, Kagan, and other outer points make the route wider than one city."
      "ru": "Начните со старого города Бухары. Гиждуван добавляет керамику, семейные мастерские и первого из Семи пиров; Вабкент, паломнические остановки у Ромитана, Каган и другие внешние точки делают маршрут шире одного города."
      "uz": "Buxoroning eski shahridan boshlang. Gʻijduvon keramika, oilaviy ustaxonalar va Yetti Pir yoʻlidagi birinchi pirni qoʻshadi; Vobkent, Romitan atrofidagi ziyorat joylari, Kogon va boshqa tashqi nuqtalar yoʻlni bitta shahardan kengroq qiladi."
