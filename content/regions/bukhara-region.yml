"excerpt":
  "en": "For travelers, Bukhara region starts in the old city: Lyabi-Hauz, the trading domes, Poi-Kalyan, and the Ark sit close enough for a first day on foot. From there the route can continue to Gijduvan ceramics, Vabkent, the Seven Pirs, Sitorai Mokhi-Khosa, Chor-Bakr, Bahauddin Naqshband, Varakhsha, Paikend, Jeyran, Kagan, and the road to Khiva."
  "ru": "Для путешественника Бухарский регион начинается со старого города: Ляби-Хауз, торговые купола, Пои-Калян и Арк стоят достаточно близко, чтобы первый день проходил пешком. Дальше маршрут может продолжиться к гиждуванской керамике, Вабкенту, Семи пирам, Ситораи Мохи-Хоса, Чор-Бакру, Бахауддину Накшбанду, Варахше, Пайкенду, Джейрану, Кагану и дороге на Хиву."
  "uz": "Sayohatchi uchun Buxoro hududi eski shahardan boshlanadi: Labi Hovuz, savdo gumbazlari, Poyi Kalon va Ark birinchi kunni piyoda o‘tkazishga yetarlicha yaqin. Keyin yo‘l Gʻijduvon keramikasi, Vobkent, Yetti Pir, Sitorai Mohi-Xosa, Chor Bakr, Bahouddin Naqshband, Varaxsha, Poykend, Jayron, Kogon va Xiva tomonga davom etishi mumkin."
