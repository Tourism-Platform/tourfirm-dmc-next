"seo":
  "metaTitle":
    "en": "Khatlon & Southern Archaeology | TourLink"
    "ru": "Хатлон и южная археология | TourLink"
    "uz": "Xatlon va Janubiy arxeologiya | TourLink"
  "metaDescription":
    "en": "Khatlon begins south of Dushanbe, where the road opens into warmer valleys and the Vakhsh landscape starts to set the pace. Kulob brings pilgrimage memory and market life, Bokhtar keeps the valley route practical, Nurek adds water and engineering scale, and Ajinatepa with Kalai Hulbuk gives the south its strongest archaeology signal.


      Ancient Khuttal is now a World Heritage frame for reading this part of Tajikistan, but the route still needs care. The best Khatlon plan chooses a few confirmed anchors, allows for shade and explanation, and keeps Takhti-Sangin separate until access and border-side movement are locally cleared."
    "ru": "Хатлон начинается к югу от Душанбе, где дорога выходит в более тёплые долины, а Вахшская долина задаёт другой темп. Куляб приносит память паломничества и рыночную жизнь, Бохтар держит маршрут по долине практичным, Нурек добавляет воду и инженерный масштаб, а Аджинатеппа и Калаи Хульбук дают югу самый сильный археологический ориентир.


      Древний Хутталь теперь помогает читать эту часть Таджикистана как объект Всемирного наследия, но маршрут всё равно требует аккуратности. Лучший план по Хатлону выбирает несколько подтверждённых опор, оставляет место для тени и объяснений, а Тахти-Сангин держит отдельно до местной проверки доступа и движения у границы."
    "uz": "Xatlon Dushanbedan janubda, yoʻl iliqroq vodiylarga ochilib, Vaxsh manzarasi boshqa surʼat bergan joyda boshlanadi. Koʻlob ziyorat xotirasi va bozor hayotini olib kiradi, Boxtar vodiy yoʻlini amaliy tutadi, Nurek suv va muhandislik miqyosini qoʻshadi, Ajinatepa bilan Kalai Xulbuk esa janubning eng kuchli arxeologik belgisini beradi.


      Qadimgi Xuttal bu qismni Jahon merosi sifatida oʻqishga yordam beradi, lekin yoʻnalish baribir ehtiyotkorlik talab qiladi. Eng yaxshi Xatlon rejasi bir nechta tasdiqlangan tayanchni tanlaydi, soya va tushuntirishga vaqt beradi, Taxti-Sanginni esa kirish va chegara yaqinidagi harakat joyida tasdiqlanmaguncha alohida qoldiradi."
