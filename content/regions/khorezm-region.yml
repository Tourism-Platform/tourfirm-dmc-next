"excerpt":
  "en": "Khorezm carries the Uzbekistan route west: most journeys pass through Urgench, then the road tightens toward Khiva and the walls of Itchan Kala. Inside the city, Kalta Minor, Juma Mosque, gates, courtyards, and mudbrick lanes keep the day close and walkable. The region needs more than a quick transfer: the overnight location, the first evening by the walls, and an early walk in Itchan Kala all matter before the route turns back, continues toward desert fortresses, or links onward to the Aral Sea."
  "ru": "Хорезм уводит маршрут по Узбекистану на запад: чаще всего через Ургенч, затем короткой дорогой к Хиве и стенам Ичан-Калы. Внутри города Кальта-Минор, Джума-мечеть, ворота, дворы и глинобитные улицы собирают день в пешую прогулку. Региону нужно больше, чем быстрый трансфер: важны не только дорога, но и место ночёвки, первый вечер у стен и ранний выход в Ичан-Калу, прежде чем путь вернётся назад, уйдёт к пустынным крепостям или продолжится к Аралу."
  "uz": "Xorazm O‘zbekiston yo‘lini g‘arbga olib boradi: yo‘l ko‘pincha Urganch orqali o‘tadi, keyin Xiva va Ichan Qalʼa devorlariga yaqinlashadi. Shahar ichida Kalta Minor, Juma masjidi, darvozalar, hovlilar va paxsa ko‘chalar kunni piyoda va yaqin qiladi. Bu hududga shunchaki tez transfer yetmaydi: tunash joyi, devorlar yonidagi birinchi oqshom va Ichan Qalʼadagi erta sayr muhim. Keyin yo‘l ortga qaytishi, cho‘l qalʼalariga chiqishi yoki Orol dengizi tomon davom etishi mumkin."
