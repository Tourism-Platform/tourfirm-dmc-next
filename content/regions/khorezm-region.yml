    "description":
      "en": "Khorezm is easiest to plan when the road through Urgench, the night in Khiva, and the next route choice are treated as one western chapter of Uzbekistan.


        «Khorezm opens up when Khiva is more than a daytime stop, with an evening by the walls and a morning walk.»"
      "ru": "Хорезм легче планировать, когда дорога через Ургенч, ночь в Хиве и следующий шаг маршрута складываются в одну западную главу Узбекистана.


        «Хорезм раскрывается лучше, когда Хива получает не только дневной осмотр, но и вечер у стен.»"
      "uz": "Xorazmni Urganch orqali yo‘l, Xivadagi tun va keyingi yo‘l tanlovi O‘zbekistonning bitta g‘arbiy bobi sifatida ko‘rilganda rejalash osonroq bo‘ladi.


        «Xiva faqat kunduzgi ko‘rish bilan cheklanmasa, devorlar yonidagi oqshom Xorazmni yaxshiroq ochadi.»"
