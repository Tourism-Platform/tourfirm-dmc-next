"excerpt":
  "en": "Issyk-Kul changes the pace of a Kyrgyzstan route before the road climbs higher. The lake carries you past north-shore resort towns, petroglyph fields, and long blue water, then the road turns toward Karakol's food, wooden landmarks, guesthouses, and guide conversations. South-shore villages, Skazka Canyon, Barskoon, and Tamga add a quieter side of the lake, while Jeti-Oguz and Altyn-Arashan make the mountain choices feel real."
  "ru": "Иссык-Куль меняет темп кыргызстанского маршрута ещё до того, как дорога поднимается выше. Озеро ведёт через курортный северный берег, поля петроглифов и длинную синюю воду; дальше маршрут приходит к Караколу с дунганской едой, деревянными ориентирами, гостевыми домами и разговорами с гидами. Южный берег, Боконбаево, каньон Сказка, Барскоон и Тамга дают более тихую сторону озера, а Джети-Огуз и Алтын-Арашан превращают горы из фона в настоящий выбор."
  "uz": "Issiqkoʻl Qirgʻiziston marshrutining surʼatini yoʻl balandroqqa chiqishidan oldin o‘zgartiradi. Koʻl shimoliy qirgʻoq kurortlari, petroglif maydonlari va uzun moviy suv bo‘ylab olib boradi; keyin yoʻl dungan taomi, yogʻoch inshootlari, mehmon uylari va gidlar bilan suhbatlari bor Qorakoʻlga keladi. Janubiy qirgʻoq, Bokonbayevo, Skazka, Barskoon va Tamga ko‘lning sokinroq tomonini beradi, Jeti-Oʻgʻuz va Oltin-Arashan esa togʻni fon emas, haqiqiy tanlovga aylantiradi."
