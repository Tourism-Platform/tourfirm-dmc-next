    "description":
      "en": "The region is strongest when the lake and the mountains are not collapsed into one stop. Issyk-Kul gives the route distance, light, and shore life; Karakol turns the eastern side into food, town walks, and practical mountain choices."
      "ru": "Регион становится яснее, когда озеро и горы не сжаты в одну остановку. Иссык-Куль даёт маршруту расстояние, свет и жизнь берегов; Каракол переводит восточную сторону в еду, городскую прогулку и реальные решения по горам."
      "uz": "Hudud ko‘l va togʻ bir bekatga qisib qo‘yilmaganda yaxshiroq ochiladi. Issiqkoʻl marshrutga masofa, nur va qirgʻoq hayotini beradi; Qorakoʻl esa sharqiy tomonni taom, shahar sayri va togʻ bo‘yicha aniq tanlovlarga olib keladi."
