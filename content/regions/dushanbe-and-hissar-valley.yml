"excerpt":
  "en": "Dushanbe lets Tajikistan begin calmly: plane-tree shade on Rudaki Avenue, fountains, museum time, tea-house stops, and mountains already visible beyond the city edge. The capital gives travelers room to arrive before the road turns toward Hissar, Varzob, and higher country.


    West of the city, Hissar brings fortress walls and old-route memory; north, Varzob changes the air quickly with river bends, gorge roads, and cooler weekend escapes. This region belongs at the start of the journey because it keeps the first choices close, readable, and easy to adjust around flights, weather, and the next road."
  "ru": "Душанбе позволяет начать Таджикистан спокойно: тень платанов на проспекте Рудаки, фонтаны, музейное время, чайханы и горы, которые уже видны за краем города. Столица даёт путешественнику время прийти в себя, прежде чем дорога уйдёт к Гиссару, Варзобу и более высоким маршрутам.


    К западу от города Гиссар добавляет крепостные стены и память старых дорог; к северу Варзоб быстро меняет воздух - речные повороты, ущелья и прохладные выезды на выходные. Этот регион хорошо ставить в начало путешествия: первые решения остаются близкими, понятными и гибкими для рейсов, погоды и следующей дороги."
  "uz": "Dushanbe Tojikistonni sokin boshlashga yordam beradi: Rudakiy xiyobonidagi chinor soyasi, favvoralar, muzey vaqti, choyxonalar va shahar chetida allaqachon koʻrinadigan togʻlar. Poytaxt sayohatchiga Hisor, Varzob va balandroq yoʻllarga chiqishdan oldin kelib olish uchun vaqt beradi.


    Shahardan gʻarbda Hisor qalʼa devorlari va eski yoʻllar xotirasini qoʻshadi; shimolda Varzob daryo burilishlari, dara yoʻllari va salqin dam olish joylari bilan havoni tez oʻzgartiradi. Bu hudud sayohat boshiga mos: ilk tanlovlar yaqin, tushunarli va reyslar, ob-havo hamda keyingi yoʻlga qarab oson moslashadi."
