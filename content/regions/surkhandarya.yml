      "uz": "Surxondaryo Samarqand, Buxoro yoki Xivani takrorlamaydi. Bu yerda yo‘nalish Termiz, Amudaryo, arxeologik joylar, memorial majmualar va Boysun tog‘ madaniyati tomon boradi.


        «Janub yo‘nalishning alohida qismiga aylanganda Surxondaryo yaxshiroq tushuniladi.»"
