  "en": "Surkhandarya is clearest when the far south is not squeezed between the classic cities. Start in Termez for early Buddhist sites, Kushan-era archaeology, Islamic memorials, and the Amu Darya, then continue toward Boysun for mountain roads, village culture, canyons, and another side of Uzbekistan."
  "ru": "Сурхандарья понятнее, когда дальний юг не сжимают между классическими городами. Начните с Термеза: ранние буддийские памятники, кушанская археология, исламские мемориалы и Амударья; затем продолжайте к Байсуну — к горным дорогам, культуре селений, каньонам и другой стороне Узбекистана."
  "uz": "Surxondaryo klassik shaharlar orasida siqilmaganda yaxshiroq tushuniladi. Termizdan boshlang: ilk buddaviy yodgorliklar, Kushon davri arxeologiyasi, islomiy yodgorliklar va Amudaryo; keyin Boysun tomonga — tog‘ yo‘llari, qishloq madaniyati, kanyonlar va O‘zbekistonning boshqa bir tomoni sari davom eting."
