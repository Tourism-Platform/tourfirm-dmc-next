          "ru": "Историко-культурный заповедник-музей «Азрет Султан»"
          "uz": "Azret Sulton tarixiy-madaniy qoʻriqxona-muzeyi"
        "description":
          "en": "At Azret Sultan, the visit stays close to the Yasawi mausoleum but opens into the surrounding reserve-museum grounds. Open space, museum setting, and pilgrim movement help travelers understand why this part of Turkistan is treated as more than a single monument."
          "ru": "В «Азрет Султане» маршрут остаётся рядом с мавзолеем Ясави, но раскрывается через территорию заповедника-музея. Открытые пространства, музейная среда и движение паломников помогают понять, почему эту часть Туркестана воспринимают шире, чем один памятник."
          "uz": "Azret Sultonda yoʻl Yasaviy maqbarasiga yaqin qoladi, lekin qoʻriqxona-muzey hududi orqali kengayadi. Ochiq makon, muzey muhiti va ziyoratchilar harakati Turkistonning bu qismi nega bitta yodgorlikdan kengroq qabul qilinishini tushuntiradi."
