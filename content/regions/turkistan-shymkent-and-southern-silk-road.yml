        "description":
          "en": "Central Bazaar and the Upper Bazaar area show Shymkent at street-market pace. After Shym Qala and the old-city area, the route can shift from citadel ground to bread counters, produce rows, bargaining voices, and people moving through the warm southern city."
          "ru": "Центральный базар и район Верхнего базара показывают Шымкент в уличном рыночном ритме. После Шым Қала и старого города маршрут может перейти от цитадели к хлебным рядам, продуктам, голосам торга и людям, которые идут по делам в тёплом южном городе."
          "uz": "Markaziy bozor va Yuqori bozor hududi Chimkentni ko‘cha-bozor ritmida ko‘rsatadi. Shym Qala va eski shahar hududidan keyin yoʻl qalʼa izlaridan non rastalari, mahsulotlar, savdo ovozlari va iliq janubiy shaharda ish bilan yurgan odamlar harakatiga oʻtadi."
        "ctaHref": "/destinations/kazakhstan/turkistan-shymkent-and-southern-silk-road/shymkent/central-bazaar-upper-bazaar-shymkent"
