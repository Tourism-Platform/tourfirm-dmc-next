"excerpt":
  "en": "South of the steppe, Kazakhstan changes temperature and pace. Shymkent gives the route a human city start: markets, food, hotels, airport access, and evenings that make the south feel close. Turkistan slows the journey around the Yasawi mausoleum and the Azret Sultan heritage setting. Otrar, Sauran, Sayram, Arystan Bab, Akyrtas, and the Western Tian Shan are not afterthoughts; they belong only when heat, distance, access, and respect are built into the route."
  "ru": "Южнее степи Казахстан меняет температуру и темп. Шымкент даёт маршруту живое городское начало: рынки, еду, отели, аэропорт и вечера, в которых юг становится ближе. Туркестан замедляет поездку вокруг мавзолея Ясави и наследия Azret Sultan. Отрар, Сауран, Сайрам, Арыстан-Баб, Акыртас и Западный Тянь-Шань не добавки для галочки; они уместны только там, где в маршрут заложены жара, расстояния, доступ и уважительный темп."
  "uz": "Dashtdan janubda Qozogʻistonning harorati va surʼati oʻzgaradi. Chimkent yoʻnalishga jonli shahar boshlanishini beradi: bozorlar, taom, mehmonxonalar, aeroport va janubni yaqinroq his qildiradigan oqshomlar. Turkiston safarni Yassaviy maqbarasi va Azret Sultan merosi atrofida sekinlashtiradi. Oʻtror, Sauran, Sayram, Arystan-Bab, Akyrtas va Gʻarbiy Tyan-Shan shunchaki qoʻshimcha bekatlar emas; ular issiq, masofa, kirish va hurmatli surʼat yoʻnalishga oldindan kiritilganda maʼnoli boʻladi."
