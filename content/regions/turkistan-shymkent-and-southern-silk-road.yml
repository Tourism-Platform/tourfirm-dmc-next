          "ru": "Старый город Шымкента и Шым Қала"
          "uz": "Chimkent eski shahri va Shym Qala"
        "description":
          "en": "Begin at Shym Qala, the open-air complex that makes Shymkent's citadel, shahristan, and rabad readable in one city walk. Its archaeological outline brings the 2,200-year city story into view before Central Bazaar adds bread rows, bargaining voices, and everyday movement."
          "ru": "Начните с Шым Қала: этот комплекс под открытым небом помогает увидеть цитадель, шахристан и рабад как понятную городскую прогулку. Археологический контур показывает 2200-летнюю историю Шымкента, а затем Центральный базар добавляет хлебные ряды, голоса торга и повседневное движени"
          "uz": "Avval Shym Qaladan boshlang: bu ochiq osmon ostidagi majmua Chimkent qalʼasi, shahristoni va rabodini tushunarli shahar sayriga aylantiradi. Arxeologik izlar 2200 yillik shahar tarixini ko‘rsatadi; keyin Markaziy bozor non rastalari, savdo ovozlari va kundalik harakatni qoʻshadi."
        "ctaHref": "/destinations/kazakhstan/turkistan-shymkent-and-southern-silk-road/shymkent/shymkent-old-city-citadel-area"
