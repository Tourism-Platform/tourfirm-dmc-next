"seo":
  "metaTitle":
    "en": "Astana & Akmola Steppe | TourLink"
    "ru": "Астана и Акмолинская степь | TourLink"
    "uz": "Ostona va Aqmola dashti | TourLink"
  "metaDescription":
    "en": "Astana gives this northern Kazakhstan region its first line: Baiterek and Nur Alem, the Ishim River, broad avenues, and weather that makes distance visible. It is a modern capital, but the open horizon still keeps the steppe in the picture.


      North of the city, Akmola changes the journey. Burabay brings lake air, pine forest, and granite outcrops; Korgalzhyn points toward protected wetlands, birds, and visitor rules that need advance planning. Treat the region as a capital stay with one carefully chosen nature extension, not as a checklist."
    "ru": "Астана задаёт этому северному региону Казахстана первую линию: Байтерек и Нур-Алем, Ишим, широкие проспекты и погоду, в которой расстояния видны сразу. Это современная столица, но открытый горизонт всё равно удерживает степь в кадре.


      Севернее города Акмола меняет путешествие. Бурабай даёт озёрный воздух, сосновый лес и гранитные скалы; Коргалжын ведёт к заповедным водно-болотным угодьям, птицам и правилам посещения, которые нужно проверять заранее. Воспринимайте регион как столичную остановку с одним тщательно выбранным выездом к природе, а не как список отметок."
    "uz": "Ostona Qozogʻistonning bu shimoliy hududiga birinchi chiziqni beradi: Bayterek va Nur Alem, Ishim daryosi, keng prospektlar va masofani darrov sezdiradigan ob-havo. Bu zamonaviy poytaxt, lekin ochiq ufq dashtni doimo ko‘z oldida qoldiradi.


      Shahardan shimolda Aqmola safar ohangini o‘zgartiradi. Burabay ko‘l havosi, qaragʻay oʻrmoni va granit qoyalari bilan keladi; Qoʻrgʻaljin esa muhofaza qilinadigan suv-botqoq yerlari, qushlar va oldindan tekshiriladigan tashrif qoidalariga olib boradi. Hududni poytaxtdagi vaqt va bitta puxta tanlangan tabiat davomi sifatida oʻqing, roʻyxat sifatida emas."
