  - "blockType": "regular"
    "eyebrow":
      "en": "Region character"
      "ru": "Характер региона"
      "uz": "Mintaqa xarakteri"
    "title":
      "en": "A western chapter after Khiva"
      "ru": "Западная глава после Хивы"
      "uz": "Xivadan keyingi g‘arbiy bob"
    "description":
      "en": "Karakalpakstan is where the classic Uzbekistan route leaves the oasis cities and becomes wider, drier, and more remote. Nukus, Moynaq, Mizdakhan, Chilpyk, and Ellikqala explain the west through museums, memory, sacred ground, and ancient Khorezm.


        «After Khiva, Karakalpakstan becomes its own western route.»"
      "ru": "В Каракалпакстане классический маршрут по Узбекистану уходит от городов-оазисов к более широкому, сухому и удалённому западу. Нукус, Муйнак, Миздакхан, Чилпык и Элликкала объясняют этот край через музеи, память, святые места и древний Хорезм.


        «После Хивы Каракалпакстан становится отдельным западным маршрутом.»"
      "uz": "Qoraqalpog‘istonda klassik O‘zbekiston yo‘nalishi voha shaharlaridan kengroq, quruqroq va uzoqroq g‘arbga chiqadi. Nukus, Mo‘ynoq, Mizdaxon, Chilpiq va Ellikqal’a bu tomonni muzeylar, xotira, ziyorat joylari va qadimgi Xorazm orqali tushuntiradi.


        «Xivadan keyin Qoraqalpog‘iston alohida g‘arbiy yo‘nalishga aylanadi.»"
