          "ru": "Сколько дней нужно региону Каракалпакстан и Аральское море в программе?"
          "uz": "Qoraqalpog‘iston va Orol dengizi hududi dasturda necha kun olishi kerak?"
        "description":
          "en": "2–3 days usually works if you keep one strong core and treat outer stops as deliberate choices. The region brief is “Nukus museums, Aral memory, and ancient Khorezm fortresses”."
          "ru": "Обычно хватает 2–3 дня, если держать одно сильное ядро, а внешние остановки выбирать осознанно. Кратко о регионе: «Музеи Нукуса, память Арала и крепости древнего Хорезма»."
          "uz": "Odatda 2–3 kun yetadi — bitta kuchli yadro va tashqi bekatlarni ongli tanlov qiling. Hudud brifi: «Nukus muzeylari, Orol xotirasi va qadimgi Xorazm qalʼalari»."
      - "type": "destinationInsight"
        "icon": "MapPin"
        "title":
