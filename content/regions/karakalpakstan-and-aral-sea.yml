          "en": "Toprak-Kala is the stop where the Ellikqala fortress route becomes more than walls on the horizon. The raised palace area, room traces, defensive lines, sanctuaries, and excavated finds help the site read as a city where power, worship, work, and daily life once met."
          "ru": "Топрак-Кала — остановка, где маршрут крепостей Элликкалы становится больше, чем линией стен на горизонте. Дворцовая часть, следы помещений, оборонительные линии, святилища и находки помогают читать площадку как город, где рядом существовали власть, культ, работа и повседневная жи"
          "uz": "Tuproq-qalʼa Ellikqal’a qalʼalari yo‘lida ufqdagi devorlardan ko‘proq narsa ko‘rsatadigan bekatdir. Saroy qismi, xona izlari, mudofaa chiziqlari, ziyorat joylari va topilmalar bu maydonni hokimiyat, ibodat, mehnat va kundalik hayot uchrashgan shahar sifatida o‘qishga yordam berad"
        "ctaHref": "/destinations/uzbekistan/karakalpakstan-and-aral-sea/ellikqala/toprak-kala-route-context"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
      - "type": "routeIdea"
        "image": "assets/images/destinations/uzbekistan.jpg"
        "badge":
          "en": "Must see"
          "ru": "Главное"
          "uz": "Asosiy"
        "title":
          "en": "Moynaq Ship Graveyard"
          "ru": "Кладбище кораблей в Муйнаке"
          "uz": "Mo‘ynoq kemalar qabristoni"
        "description":
          "en": "North of Nukus, Moynaq brings the Aral Sea story down to ground level: rusted fishing vessels, the former port, the town museum, and the long road back all shape the same visit."
          "ru": "К северу от Нукуса история Арала становится конкретной: ржавые рыбацкие суда, бывший порт, городской музей и обратная дорога относятся к одному визиту, а не к отдельной фотоостановке."
          "uz": "Nukusdan shimolda Mo‘ynoq Orol hikoyasini aniqroq qiladi: zanglagan baliqchi kemalari, sobiq port, shahar muzeyi va qaytish yo‘li bitta tashrifning qismlariga aylanadi."
        "ctaHref": "/destinations/uzbekistan/karakalpakstan-and-aral-sea/moynaq/moynaq-ship-graveyard-open-air-museum"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
      - "type": "routeIdea"
        "image": "assets/images/destinations/uzbekistan/regions/karakalpakstan-and-aral-sea/cities/nukus/attractions/savitsky-state-museum-of-arts.webp"
        "badge":
          "en": "Must see"
          "ru": "Главное"
          "uz": "Asosiy"
        "title":
          "en": "Savitsky Museum"
          "ru": "Музей Савицкого"
          "uz": "Savitskiy muzeyi"
        "description":
          "en": "The Savitsky Museum is the reason to pause in Nukus instead of treating the city as a transfer. Inside, Russian avant-garde painting, Karakalpak craft, archaeological material, and Igor Savitsky's collecting story bring the region close before the route continues toward Moynaq, C"
          "ru": "Музей Савицкого — причина задержаться в Нукусе, а не проехать мимо по дороге дальше. В его залах русский авангард, каракалпакское ремесло, археологические материалы и история Игоря Савицкого помогают увидеть регион до маршрута к Муйнаку, Чилпыку или Элликкале."
          "uz": "Savitskiy muzeyi Nukusdan shunchaki o‘tib ketmaslik uchun sababdir. Uning zallarida rus avangard rangtasviri, qoraqalpoq hunari, arxeologik materiallar va Igor Savitskiy hikoyasi Mo‘ynoq, Chilpiq yoki Ellikqal’a yo‘lidan oldin mintaqani yaqinlashtiradi."
        "ctaHref": "/destinations/uzbekistan/karakalpakstan-and-aral-sea/nukus/savitsky-state-museum-of-arts"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
      - "type": "routeIdea"
        "image": "assets/images/destinations/uzbekistan/regions/karakalpakstan-and-aral-sea/cities/ellikqala/attractions/kyzyl-kala-route-context.webp"
        "badge":
          "en": "Recommended"
          "ru": "Рекомендуем"
          "uz": "Tavsiya"
        "title":
          "en": "Kyzyl-Kala Fortress"
          "ru": "Крепость Кызыл-Кала"
          "uz": "Qizil-qalʼa qalʼasi"
        "description":
          "en": "Kyzyl-Kala is the close comparison after Toprak-Kala. Instead of a palace-city plan, the traveler sees a compact red fortress with restored walls, tower lines, arrow-shaped openings, and a sloped approach across the Ellikqala plain."
          "ru": "Кызыл-Кала — близкое сравнение после Топрак-Калы. Вместо плана дворцового города здесь видна компактная красная крепость: восстановленные стены, линии башен, бойницы и наклонный подход через равнину Элликкалы."
          "uz": "Qizil-qalʼa Tuproq-qalʼadan keyingi yaqin taqqoslashdir. Saroy-shahar rejasi o‘rniga bu yerda tiklangan devorlari, minora chiziqlari, o‘q tuynuklari va Ellikqal’a tekisligi bo‘ylab qiya yondashuvi bor ixcham qizil qalʼa ko‘rinadi."
        "ctaHref": "/destinations/uzbekistan/karakalpakstan-and-aral-sea/ellikqala/kyzyl-kala-route-context"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
      - "type": "routeIdea"
        "image": "assets/images/destinations/uzbekistan/regions/karakalpakstan-and-aral-sea/cities/nukus/attractions/mizdakhan-necropolis.webp"
        "badge":
          "en": "Recommended"
          "ru": "Рекомендуем"
          "uz": "Tavsiya"
        "title":
          "en": "Mizdakhan Necropolis"
          "ru": "Некрополь Миздакхан"
          "uz": "Mizdaxon nekropoli"
        "description":
          "en": "Mizdakhan is not a single monument. It is a walk across hills near Khojeyli, where ancient burials, pilgrimage stories, mausoleum domes, and nearby Gyaur-Kala move the route beyond Nukus museums."
          "ru": "Миздакхан — не один памятник, а прогулка по холмам у Ходжейли: древние погребения, паломнические предания, купола мавзолеев и контекст Гяур-Калы выводят маршрут за пределы музейного Нукуса."
          "uz": "Mizdaxon bitta yodgorlik emas. Bu Xo‘jayli yaqinidagi tepaliklar bo‘ylab yuriladigan joy: qadimiy dafnlar, ziyorat rivoyatlari, maqbara gumbazlari va yaqin Gyaur-Kala Nukus muzeylaridan keyingi yo‘lni ochiq manzaraga olib chiqadi."
        "ctaHref": "/destinations/uzbekistan/karakalpakstan-and-aral-sea/nukus/mizdakhan-necropolis"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"


