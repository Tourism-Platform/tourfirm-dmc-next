          "ru": "Ниса — тихая археологическая остановка рядом с Ашхабадом: два низких холма, открытое небо и земляные стены ранней парфянской столицы. Посещение сильнее, когда Старая и Новая Ниса воспринимаются вместе, а музейное время и предгорный ландшафт помогают собрать фрагменты в понятную и"
