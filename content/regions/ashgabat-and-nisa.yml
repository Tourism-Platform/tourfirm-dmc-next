    "title":
      "en": "A capital start that reaches Parthian foothills"
      "ru": "Столичное начало, которое выходит к парфянским предгорьям"
      "uz": "Parfiya togʻoldilariga chiqadigan poytaxt boshlanishi"
    "description":
      "en": "Together, Ashgabat and Nisa answer the first two questions in Turkmenistan: how the modern capital presents itself, and how quickly the story moves toward older empires, trade routes, and fortified foothill landscapes.


        «Ashgabat brings the first scale; Nisa makes the same region older, quieter, and more archaeological.»"
      "ru": "Вместе Ашхабад и Ниса отвечают на первые вопросы о Туркменистане: как выглядит современная столица и как быстро маршрут уходит к более древним империям, торговым дорогам и укреплённым предгорьям.


        «Ашхабад задаёт первый масштаб; Ниса делает тот же регион древнее, тише и археологичнее.»"
      "uz": "Ashgabat va Nisa birga Turkmanistondagi ilk savollarga javob beradi: zamonaviy poytaxt oʻzini qanday koʻrsatadi va yoʻl qanchalik tez qadimiy imperiyalar, savdo yoʻllari va mustahkamlangan togʻoldi manzaralariga oʻtadi.


        «Ashgabat miqyosi kunni ochadi; Nisa esa uni qadimiyroq, sokinroq va arxeologikroq qiladi.»"
