  "en": "Ashgabat & Nisa opens Turkmenistan at city scale and archaeological scale. The capital brings marble avenues, formal parks, museum rooms, and carpet motifs. Nisa changes the pace near the Kopet-Dag foothills, where low earthen walls and open sky pull the first Turkmenistan route back into the Parthian world."
  "ru": "Ашхабад и Ниса открывают Туркменистан в двух масштабах. Столица задаёт прибытие: мраморные проспекты, официальные парки, музейные залы и ковровые мотивы. Ниса меняет темп у предгорий Копетдага: низкие глинобитные стены и открытое небо возвращают маршрут к парфянскому миру."
  "uz": "Ashgabat va Nisa Turkmanistonni ikki miqyosda ochadi. Poytaxt avval kelish hissini beradi: marmar xiyobonlar, rasmiy parklar, muzey xonalari va gilam naqshlari. Nisa esa Kopetdogʻ togʻoldilarida surʼatni pasaytiradi: past loy devorlar va ochiq osmon yoʻlni Parfiya dunyosiga qaytaradi."
