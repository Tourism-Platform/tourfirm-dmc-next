          "ru": "Ниса находится совсем рядом с Ашхабадом, но меняет возраст поездки. Белая столица остаётся позади, земля раскрывается низкими парфянскими стенами, и Старая с Новой Нисой начинают более древнюю линию пути к Мары, Мерву или пустыне."
