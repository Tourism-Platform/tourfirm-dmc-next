      "ru": "Ашхабад и Ниса — текущая публичная пара: столица для прибытия, музеев и ориентации; Ниса для парфянского выезда у предгорий. Гёкдепе, Ков-Ата, Аркадаг и Анау остаются контекстом широкого Ахала, пока по ним не завершены проверки."
