        "description":
          "en": "Ancient Merv makes sense as you move through the oasis: the dome of Sultan Sanjar, the ridged walls of Kyz Kala, low earthworks, and desert light. Mary keeps the route practical, but the site still needs time, shade planning, and a guide who can connect the separate ruins."
          "ru": "Древний Мерв понятен в движении по оазису: купол Султана Санджара, рифлёные стены Кыз-Калы, низкие валы и пустынный свет. Мары делает маршрут практичным, но самому Мерву всё равно нужны время, планирование жары и гид, который соединит разнесённые руины в понятный рассказ."
          "uz": "Qadimiy Marvni voha bo‘ylab harakat qilib tushunasiz: Sulton Sanjar gumbazi, Qiz qal’aning qovurg‘ali devorlari, past tuproq izlari va cho‘l nuri. Mari yo‘lni amaliy qiladi, ammo Marvga baribir vaqt, issiqni hisobga olish va alohida xarobalarni bog‘laydigan gid kerak."
