          "ru": "Эрк-Кала возвращает взгляд к форме, высоте и периметру древнего Мерва. Эта остановка не про законченный монумент, а про укреплённый холм, его края и то, как Мерв рос через разные городские участки в оазисе Мургаба. Лучше всего Эрк-Кала работает там, где маршрут замедляется для об"
          "uz": "Erk qal’a qadimiy Marvni shakl, balandlik va perimetr orqali ko‘rsatadi. Bu to‘xtash tayyor monument haqida emas; u mustahkamlangan tepalik, uning chetlari va Marv Murg‘ob vohasida turli shahar hududlari orqali qanday o‘sganini tushunish haqida. Erk qal’a gid izohi uchun marom se"
