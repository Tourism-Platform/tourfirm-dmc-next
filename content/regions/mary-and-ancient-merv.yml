    "title":
      "en": "Where Turkmenistan becomes an oasis journey"
      "ru": "Где Туркменистан становится оазисным путешествием"
      "uz": "Turkmaniston voha safariga aylangan joy"
    "description":
      "en": "This region matters because it changes the scale of the trip. After Ashgabat and Nisa, the traveler reaches a working city, museum rooms, and an archaeological landscape once shaped by oasis settlement, caravan roads, Seljuk power, and desert-edge movement.


        «Mary makes the oasis readable at human scale; Merv opens it into earth walls, Seljuk brick, and distance.»"
      "ru": "Этот регион важен потому, что меняет масштаб поездки. После Ашхабада и Нисы гость выходит к живому городу, музейным залам и археологическому ландшафту, где сходились оазисные поселения, караванные дороги, сельджукская власть и движение у края пустыни.


        «Мары делает оазис понятным в человеческом масштабе; Мерв раскрывает его через земляные стены, сельджукский кирпич и расстояние.»"
      "uz": "Bu hudud muhim, chunki u safar miqyosini o‘zgartiradi. Ashxobod va Nisadan keyin mehmon ishlayotgan shahar, muzey zallari va qadimgi voha joylashuvlari, karvon yo‘llari, saljuqiy kuchi hamda cho‘l chetidagi harakatni saqlagan arxeologik manzaraga chiqadi.


        «Mari vohani insoniy miqyosda tushunarli qiladi; Marv esa uni tuproq devorlar, saljuqiy g‘isht va masofa orqali ochadi.»"
