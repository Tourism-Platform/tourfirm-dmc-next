"excerpt":
  "en": "Western Turkmenistan changes the journey by scale. The road moves from the country's better-known oasis and monument rhythm toward Caspian air, Awaza's coastal edge, Balkanabat's inland pause, pale ridges, canyon color, and older heritage routes across the Balkan map.


    Plan this region as a spacious western leg, not as a quick beach stop or a single viewpoint run. Turkmenbashi, Awaza, Balkanabat, Yangykala, Gozli Ata, and Dehistan all need enough road time, suitable light, heat planning, vehicle support, and current local access checks."
  "ru": "Западный Туркменистан меняет путешествие масштабом. Дорога уходит от более привычного ритма оазисов и памятников к каспийскому воздуху, побережью Авазы, внутренней паузе Балканабата, светлым хребтам, цвету каньона и древним маршрутам наследия на карте Балкана.


    Планируйте этот регион как просторную западную часть путешествия, а не как быстрый пляжный выезд или одну точку обзора. Туркменбаши, Аваза, Балканабат, Янгыкала, Гозли-Ата и Дехистан требуют времени в дороге, подходящего света, учёта жары, правильного автомобиля и актуальной проверки доступа."
  "uz": "Gʻarbiy Turkmaniston sayohatni miqyos orqali oʻzgartiradi. Yoʻl mamlakatning tanish voha va yodgorlik ritmidan Kaspiy havosi, Avaza sohili, Balkanabatning ichki yoʻl pauzasi, och rangli tizmalar, kanyon rangi va Balkan xaritasidagi qadimiy meros yoʻllari tomon buriladi.


    Bu hududni tezkor plyaj chiqishi yoki bitta manzarali nuqta sifatida emas, keng gʻarbiy yoʻl boʻlagi sifatida rejalang. Turkmenbashi, Avaza, Balkanabat, Yangikala, Gozli Ata va Dehistan uchun yetarli yoʻl vaqti, mos yorugʻlik, issiqni hisobga olish, toʻgʻri avtomobil va dolzarb kirish tekshiruvlari kerak."
