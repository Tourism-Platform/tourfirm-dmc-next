    "description":
      "en": "Oskemen opens the region, Semey adds literary and river-city memory, Katon-Karagay carries the strongest mountain route, and Ridder remains a northern Altai branch for longer itineraries."
      "ru": "Усть-Каменогорск открывает регион, Семей добавляет литературную и речную память, Катон-Карагай несёт самый сильный горный маршрут, а Риддер остаётся северной веткой Алтая для длинных поездок."
      "uz": "Oʻskemen hududni ochadi, Semey adabiy va daryo xotirasini qo‘shadi, Katon-Qaragʻay eng kuchli togʻ yoʻnalishini ko‘taradi, Ridder esa uzunroq safarlar uchun shimoliy Oltay tarmogʻi bo‘lib qoladi."
