"seo":
  "metaTitle":
    "en": "East Kazakhstan & Altai | TourLink"
    "ru": "Восточный Казахстан и Алтай | TourLink"
    "uz": "Sharqiy Qozogʻiston va Oltay | TourLink"
  "metaDescription":
    "en": "At Oskemen, the Irtysh and Ulba meet before the roads begin rising toward Altai forests. Semey adds literature, memory, and river-city context, while Katon-Karagay and Ridder pull the route toward protected valleys, high lakes, village honey, and weather that can change the pace.


      This is Kazakhstan beyond the first city-and-steppe route. It needs space: city anchors first, then selected mountain roads, with local checks for protected areas, border proximity, road condition, and season before the eastern leg is fixed."
    "ru": "В Усть-Каменогорске Иртыш и Ульба сходятся перед дорогами, которые начинают подниматься к алтайским лесам. Семей добавляет литературу, память и речной город, а Катон-Карагай и Риддер уводят маршрут к охраняемым долинам, высоким озёрам, деревенскому мёду и погоде, которая может менять темп.


      Этот регион подходит тем, кто хочет увидеть Казахстан дальше первого городского и степного маршрута. Восточный участок лучше оставлять просторным: сначала городские опоры, затем выбранные горные дороги, с проверкой охраняемых территорий, близости границы, состояния дорог и сезона до фиксации маршрута."
    "uz": "Oʻskemenda Irtish va Ulba daryolari Oltay oʻrmonlari tomon ko‘tariladigan yo‘llar oldidan uchrashadi. Semey adabiyot, xotira va daryo shahri ohangini qo‘shadi; Katon-Qaragʻay va Ridder esa yoʻnalishni qoʻriqlanadigan vodiylar, baland koʻllar, qishloq asali va surʼatni oʻzgartiradigan ob-havo tomon olib boradi.


      Bu hudud Qozogʻistonni birinchi shahar va dasht yoʻnalishidan keyin chuqurroq ko‘rmoqchi bo‘lgan sayohatchilar uchun. Sharqiy qismni keng tutish kerak: avval shahar tayanchlari, keyin tanlangan togʻ yoʻllari; qoʻriqlanadigan hududlar, chegara yaqinligi, yoʻl holati va mavsum joyida tekshiriladi."
