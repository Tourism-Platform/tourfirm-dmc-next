  - "blockType": "regular"
    "eyebrow":
      "en": "Region character"
      "ru": "Характер региона"
      "uz": "Hudud xarakteri"
    "title":
      "en": "Where river cities give way to the Altai"
      "ru": "Где речные города переходят в Алтай"
      "uz": "Daryo shaharlari Oltayga o‘tadigan joy"
    "description":
      "en": "East Kazakhstan & Altai is not a quick scenic add-on. It moves from Irtysh river cities into forest, mining towns, high valleys, and protected landscapes where the road sets the rhythm.


        «In the Altai, distance is not only a transfer; it gives the forests, rivers, and villages enough room to be understood.»"
      "ru": "Восточный Казахстан и Алтай — не короткое живописное дополнение. Маршрут идёт от городов Иртыша к лесам, горняцким городам, высоким долинам и охраняемым ландшафтам, где дорога задаёт ритм.


        «В Алтае расстояние — не просто трансфер; оно даёт лесам, рекам и сёлам достаточно пространства, чтобы они стали понятны.»"
      "uz": "Sharqiy Qozogʻiston va Oltay qisqa manzarali qoʻshimcha emas. Yoʻnalish Irtish shaharlari, oʻrmonlar, konchilik shaharlari, baland vodiylar va yoʻl surʼatni belgilaydigan qoʻriqlanadigan landshaftlar orqali o‘tadi.


        «Oltayda masofa faqat transfer emas; u oʻrmon, daryo va qishloqlarni anglash uchun yetarli kenglik beradi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "Region areas"
      "ru": "Региональные точки"
      "uz": "Hudud joylari"
    "title":
