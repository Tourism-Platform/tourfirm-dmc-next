      en: Turquoise water and mountain backdrop make this the strongest visual break. Plan a short stop for photos and tea before continuing uphill to Chimgan.
      ru: Бирюзовая вода и горный фон дают сильную визуальную паузу в маршруте. Запланируйте короткую остановку на фото и чай перед подъёмом к Чимгану.
      uz: Moviy suv va tog' fonlari marshrutdagi eng kuchli vizual nuqtalardan biri. Chimganga ko'tarilishdan oldin surat va choy uchun qisqa to'xtash qo'ying.

