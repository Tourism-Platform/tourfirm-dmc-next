      "uz": "Toshkent va Chimyon poytaxt boshlanish boʻlib qolganida, togʻoldi esa mavsum va vaqtga qarab tanlanganda aniqroq bo‘ladi: Toshkent kontekst beradi, Chimyon, Chorvoq, Amirsoy, Beldersoy, Olaychoq va Ugom-Chotqol esa yoʻnalish shahardan qanchalik tez chiqishini ko‘rsatadi.


