      uz: Toshkent va Chimgan
    title:
      en: Tashkent & Chimgan
      ru: Ташкент и Чимган
      uz: Toshkent va Chimgan
    description:
      en: Tashkent locals escape summer heat in the Chimgan range, 80 km northeast of the capital. A typical day combines Khazrati Imam or Chorsu in the morning with Charvak Reservoir and Chimgan village in the afternoon.
      ru: Жители Ташкента уезжают от летней жары в Чимганские горы — всего 80 км к северо-востоку от столицы. Типичный день сочетает Хазрати Имам или Чорсу утром с Чарваком и Чимганом после обеда.
      uz: Toshkentliklar yoz issiqidan qochish uchun poytaxtdan 80 km shimoli-sharqda joylashgan Chimgan tog'lariga borishadi. Odatdagi kun ertalab Hazrati Imom yoki Chorsu bilan, tushdan keyin Charvak va Chimgan bilan tugaydi.
    actions:
      - type: mailto
        variant: default
        title:
          en: Request a tour
          ru: Запросить тур
          uz: Tur so'rash
        email: info@tourlink.uz

  - blockType: regular
    eyebrow:
      en: Overview
      ru: Обзор
      uz: Umumiy
    title:
      en: How the day flows
      ru: Как проходит день
      uz: Kun qanday o'tadi
    description:
      en: "A realistic one-day sequence from the capital to the mountains.\n\n• Morning in Tashkent: Khazrati Imam complex or Chorsu Bazaar.\n• Drive northeast (~1.5–2 h) through the Chirchiq valley.\n• Photo stop at Charvak Reservoir, then Chimgan village.\n• Optional cable car, short hike or horseback riding before return."
      ru: "Реалистичная однодневная связка от столицы к горам.\n\n• Утро в Ташкенте: комплекс Хазрати Имам или базар Чорсу.\n• Выезд на северо-восток (~1,5–2 ч) по долине Чирчика.\n• Остановка у Чарвака, затем посёлок Чимган.\n• По желанию — канатная дорога, короткий треккинг или конные прогулки."
      uz: "Poytaxtdan tog'larga boruvchi real kunlik marshrut.\n\n• Ertalab Toshkent: Hazrati Imom majmuasi yoki Chorsu bozori.\n• Chirchiq vodiy bo'ylab shimoli-sharqga (~1,5–2 soat).\n• Charvakda fototo'xtash, keyin Chimgan qishlog'i.\n• Ixtiyoriy: kanat yo'li, qisqa yurish yoki ot sayohati."

