"excerpt":
  "en": "At Chorsu in the morning, Tashkent is already awake: bread steam, spice rows, metro doors opening below the market dome. By afternoon, the same journey can lead north through the Chirchiq valley toward Chimgan, Charvak, Amirsoy, Beldersay, Alaichak, and Ugam-Chatkal. This region gives Uzbekistan a calm first entry: the capital helps you settle in, while the foothills give the first pause before Samarkand, Bukhara, or Khiva."
  "ru": "Утром у Чорсу Ташкент уже шумит: пар от лепёшек, ряды специй, двери метро под куполом базара. После обеда тот же маршрут может уйти на север через Чирчикскую долину к Чимгану, Чарваку, Амирсою, Бельдерсаю, Алайчаку и Угам-Чаткалу. Здесь путешествие получает спокойный вход в Узбекистан: столица помогает освоиться, а предгорья дают первую паузу перед Самаркандом, Бухарой или Хивой."
  "uz": "Ertalab Chorsuda Toshkent allaqachon uygʻongan boʻladi: non isi, ziravor qatorlari, bozor gumbazi ostida ochilib-yopilayotgan metro eshiklari. Tushdan keyin shu yoʻnalish Chirchiq vodiysi orqali Chimyon, Chorvoq, Amirsoy, Beldersoy, Olaychoq va Ugom-Chotqol tomonga chiqishi mumkin. Bu yerda Oʻzbekistonga kirish sokinroq boshlanadi: poytaxt yoʻlga moslashishga yordam beradi, togʻoldi esa Samarqand, Buxoro yoki Xivadan oldin birinchi pauzani beradi."
