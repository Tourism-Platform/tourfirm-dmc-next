  "metaDescription":
    "en": "Karakum & Darvaza is not spare distance between Turkmenistan's monuments. It is the country's desert leg: long road hours, sparse settlements, open sand, and the question of whether the crater area belongs in the journey at all.


      Darvaza can still be a powerful night stop, but it cannot be promised on old assumptions. Flame level, site access, overnight arrangements, heat, road conditions, and vehicle support all need a current local check before the desert leg is added."
    "ru": "Каракумы и Дарваза — не пустой промежуток между памятниками Туркменистана. Это отдельный пустынный участок маршрута: долгие часы дороги, редкие поселения, открытый песок и вопрос, нужен ли район кратера в поездке вообще.


      Дарваза может оставаться сильной ночной остановкой, но её нельзя обещать по старым ожиданиям. Уровень пламени, доступ к месту, ночёвка, жара, состояние дороги и машина требуют актуальной местной проверки до включения пустынного участка."
    "uz": "Qoraqum va Darvoza Turkmaniston yodgorliklari orasidagi boʻsh masofa emas. Bu alohida choʻl kesimi: uzoq yoʻl soatlari, siyrak aholi punktlari, ochiq qum va krater hududi safarga kerakmi-yoʻqmi degan savol.


