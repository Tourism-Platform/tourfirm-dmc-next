    "description":
      "en": "Almaty is large, but it never feels sealed away from its setting. Mountains hold the end of the streets, markets carry apple and herb smells, and an evening in the city can already turn the route toward higher air.


        «Almaty makes the mountains feel near; the northern Tian Shan reminds the traveler to choose the road carefully.»"
      "ru": "Алматы большой, но он не отрезан от своего ландшафта. Горы держат конец улиц, рынки пахнут яблоками и травами, а вечер в городе легко поворачивает разговор к дороге выше.


        «Алматы делает горы близкими; Северный Тянь-Шань напоминает, что дорогу нужно выбирать внимательно.»"
      "uz": "Olmaota katta shahar, lekin oʻz manzarasidan uzilmagan. Koʻchalar oxirida togʻlar turadi, bozorlar olma va oʻtlar hidini saqlaydi, shahardagi kech bir paytning oʻzida yuqoriroq yoʻl haqida suhbatga aylanadi.


        «Olmaota togʻlarni yaqin qiladi; Shimoliy Tyan-Shan esa yoʻlni ehtiyot tanlashni eslatadi.»"
