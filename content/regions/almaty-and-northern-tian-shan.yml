"seo":
  "metaTitle":
    "en": "Almaty & Northern Tian Shan | TourLink"
    "ru": "Алматы и Северный Тянь-Шань | TourLink"
    "uz": "Olmaota va Shimoliy Tyan-Shan | TourLink"
  "metaDescription":
    "en": "Almaty changes scale quickly. The city can begin with coffee terraces, market smells, and evening streets, then rise toward Kok-Tobe, Medeu, and Shymbulak before the wider region opens to Charyn, Saty, Kolsai, Kaindy, Tamgaly, Altyn-Emel, and the Assy Plateau. The best routes here choose distance carefully, so the mountains feel close without turning the journey into a checklist."
    "ru": "В Алматы масштаб меняется быстро. Город может начаться с кофеен, рыночных запахов и вечерних улиц, затем подняться к Кок-Тобе, Медеу и Шымбулаку, а дальше открыть дорогу к Чарыну, Саты, Кольсаю, Каинды, Тамгалы, Алтын-Эмелю и плато Ассы. Здесь сильнее всего те маршруты, где расстояния выбраны честно, а горы остаются близкими без гонки за списком."
    "uz": "Olmaotada miqyos tez oʻzgaradi. Shahar qahvaxonalar, bozor hidlari va kechki koʻchalardan boshlanib, Koʻk-Tobe, Medeu va Shimbuloq tomonga koʻtariladi; keyin kengroq hudud Chorin, Sati, Koʻlsay, Qayindi, Tamgʻali, Oltin-Emel va Assi platosi sari ochiladi. Bu yerda eng yaxshi yoʻnalishlar masofani ehtiyotkor tanlaydi: togʻlar yaqin seziladi, lekin safar roʻyxat ortidan quvishga aylanmaydi."
