"seo":
  "metaTitle":
    "en": "Nurata, Aydarkul & Kyzylkum | TourLink"
    "ru": "Нурата, Айдаркуль и Кызылкум | TourLink"
    "uz": "Nurota, Aydarko‘l va Qizilqum | TourLink"
  "metaDescription":
    "en": "Between Samarkand, Bukhara, and the Kyzylkum, this region turns the journey from monument streets toward open land. Rabat-i Malik and its Sardoba show how road travel depended on water; Sarmyshsay brings the route close to petroglyph stone; Nurata gathers Chashma, mosque courtyards, and fortress traces; Aydarkul widens the view to lake shore; Sentyab and nearby foothill roads add village paths, guesthouse tables, and cooler night air."
    "ru": "Между Самаркандом, Бухарой и Кызылкумом этот регион уводит путешествие от улиц с памятниками к открытой земле. Рабат-и Малик и его сардоба показывают, как дорога зависела от воды; Сармышсай подводит маршрут к камню с петроглифами; Нурата собирает Чашму, дворы мечетей и следы крепости; Айдаркуль расширяет вид до берега озера; Сентоб и близкие предгорные дороги добавляют сельские тропы, столы гостевых домов и более прохладный ночной воздух."
    "uz": "Samarqand, Buxoro va Qizilqum orasida bu mintaqa sayohatni yodgorlikli ko‘chalardan ochiq yer tomonga olib chiqadi. Rabat-i Malik va uning sardobasi yo‘l suvga qanday bog‘liq bo‘lganini ko‘rsatadi; Sarmishsoy yo‘lni petroglifli toshga yaqinlashtiradi; Nurota Chashma, masjid hovlilari va qalʼa izlarini jamlaydi; Aydarko‘l manzarani ko‘l qirg‘og‘igacha kengaytiradi; Sentob va yaqin tog‘oldi yo‘llari qishloq so‘qmoqlari, mehmon uylari dasturxoni va salqinroq tungi havoni qo‘shadi."
