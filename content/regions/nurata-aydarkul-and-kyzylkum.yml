          "ru": "Рабат-и Малик"
          "uz": "Rabat-i Malik"
        "description":
          "en": "Near Navoi, Rabat-i Malik is a place to read the road rather than a city to walk through. The surviving caravanserai portal gives the plain a threshold; the nearby sardoba explains the water, shade, and rest that made movement possible."
          "ru": "Рядом с Навои Рабат-и Малик лучше воспринимать не как город, а как место, где дорога становится понятной. Сохранившийся портал даёт равнине порог; сардоба рядом объясняет воду, тень и отдых, без которых движение было невозможно."
          "uz": "Navoiy yaqinida Rabat-i Malik shahar bo‘ylab sayr emas, yo‘lni tushunarli qiladigan meros bekati. Saqlangan karvonsaroy peshtoqi tekislikka kirish nuqtasini beradi; yonidagi sardoba esa suv, soya va dam harakat uchun nega zarur bo‘lganini ko‘rsatadi."
        "ctaHref": "/destinations/uzbekistan/nurata-aydarkul-and-kyzylkum/rabat-i-malik"
        "ctaLabel":
