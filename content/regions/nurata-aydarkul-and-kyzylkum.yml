        "description":
          "en": "Sentob sits below the Nuratau slopes where the road from Nurata begins to loosen toward Aydarkul and the Kyzylkum. Stone walls, narrow lanes, garden shade, and household tables make the stop feel personal before the route opens again to lake, reeds, sand, and desert air."
          "ru": "Сентоб лежит у склонов Нуратау, где дорога от Нураты начинает раскрываться к Айдаркулю и Кызылкуму. Каменные стены, узкие улицы, садовая тень и домашний стол делают остановку личной, прежде чем маршрут снова выйдет к озеру, камышам, песку и воздуху пустыни."
          "uz": "Sentob Nurota yonbag‘irlari etagida, Nurotadan chiqqan yo‘l Aydarko‘l va Qizilqum sari ochila boshlaydigan joyda joylashgan. Tosh devorlar, tor ko‘chalar, bog‘ soyasi va xonadon dasturxoni yo‘l yana ko‘l, qamish, qum va cho‘l havosiga ochilishidan oldin bekatni shaxsiy qiladi."
        "ctaHref": "/destinations/uzbekistan/nurata-aydarkul-and-kyzylkum/sentyab"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
          "uz": "Joyni ochish"
      - "type": "routeIdea"
        "image": "assets/images/destinations/uzbekistan/regions/nurata-aydarkul-and-kyzylkum/cities/sarmyshsay.webp"
        "badge":
