  - "blockType": "regular"
    "eyebrow":
      "en": "Region character"
      "ru": "Характер региона"
      "uz": "Mintaqa xarakteri"
    "title":
      "en": "Where the city route opens into water, stone, and desert"
      "ru": "Где городской маршрут открывается к воде, камню и пустыне"
      "uz": "Shahar yo‘li suv, tosh va cho‘lga ochiladigan joy"
    "description":
      "en": "Nurata, Aydarkul, and the Kyzylkum edge sit between monumental cities and open land. The value here is not another grand facade, but the shift into spring water, petroglyph stone, village hospitality, lake wind, and distance.


        «The middle of Uzbekistan can be quiet without feeling empty.»"
      "ru": "Нурата, Айдаркуль и край Кызылкума лежат между монументальными городами и открытой землёй. Ценность здесь не в ещё одном большом фасаде, а в переходе к воде источника, камню с петроглифами, сельскому гостеприимству, ветру у озера и чувству расстояния.


        «Середина Узбекистана может быть тихой и при этом не пустой.»"
      "uz": "Nurota, Aydarko‘l va Qizilqum cheti monumental shaharlar bilan ochiq yer orasida turadi. Bu yerning qadri yana bir katta peshtoqda emas, balki buloq suvi, petroglif toshi, qishloq mehmondo‘stligi, ko‘l shamoli va masofa hissiga o‘tishda.


        «O‘zbekistonning o‘rtasi sokin bo‘lib, bo‘sh tuyilmasligi mumkin.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "Region anchors"
      "ru": "Опоры региона"
      "uz": "Mintaqa tayanchlari"
    "title":
      "en": "Five anchors for the desert-edge route"
      "ru": "Пять опор маршрута у края пустыни"
      "uz": "Cho‘l chetidagi yo‘lning besh tayanchi"
    "description":
      "en": "The route starts clearest with these five anchors. Wider journeys can use Navoi or Karmana road context, continue toward Yangikazgan yurt-camp roads, or touch longer Kyzylkum edges such as Uchkuduk only when timing and local access make sense."
      "ru": "Маршрут понятнее всего начинается с этих пяти опор. Более широкие поездки могут учитывать дорогу через Навои или Карману, уходить к юртовым дорогам Янгигазгана или затрагивать дальние края Кызылкума, включая Учкудук, только когда это оправдано временем и местными условиями."
      "uz": "Yo‘l avvalo shu besh tayanch orqali ravshanlashadi. Kengroq sayohatlar Navoiy yoki Karmana yo‘l kontekstini, Yangigazgan o‘tov yo‘llarini yoki Uchkuduk kabi uzoq Qizilqum chetlarini faqat vaqt va mahalliy sharoit mos bo‘lganda qo‘shishi mumkin."
