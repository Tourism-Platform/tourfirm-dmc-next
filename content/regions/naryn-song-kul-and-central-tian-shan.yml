        "description":
          "en": "Song-Kul is where the Naryn high country opens wide. The lake lies among summer pasture, yurt camps, horses, and mountain roads that ask for patience. The visit is strongest with a night at the lake, a season check close to travel, and room for weather."
          "ru": "Сон-Куль - место, где Нарынское высокогорье раскрывается широко. Озеро лежит среди летних пастбищ, юртовых лагерей, лошадей и горных дорог, которым нужно терпение. Сильный визит дает озеру ночь, проверяет сезон ближе к поездке и оставляет место погоде."
          "uz": "Soʻng-Koʻl Narin baland hududi keng ochiladigan joy. Koʻl yozgi yaylovlar, oʻtov lagerlari, otlar va sabr talab qiladigan togʻ yoʻllari orasida yotadi. Kuchli tashrif koʻlga bir tun beradi, mavsumni safarga yaqin tekshiradi va ob-havo uchun joy qoldiradi."
