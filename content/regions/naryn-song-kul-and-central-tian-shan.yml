        "description":
          "en": "Naryn is not a city built around one monument. Its value is in the river, the dry mountain slopes, and the roads that make the central Tian Shan feel real before travelers choose a lake road, a caravanserai valley, or a deeper mountain journey."
          "ru": "Нарын не строится вокруг одного памятника. Его ценность в реке, сухих горных склонах и дорогах, которые делают Центральный Тянь-Шань понятным перед выбором озёрной дороги, долины караван-сарая или более глубокого горного маршрута."
          "uz": "Naryn bitta yodgorlik atrofida qurilgan shahar emas. Uning qadri daryo, quruq togʻ yonbagʻirlari va Markaziy Tyan-Shanni koʻl yoʻli, karvonsaroy vodiysi yoki uzoqroq togʻ safaridan oldin aniq his qildiradigan yoʻllarda."
