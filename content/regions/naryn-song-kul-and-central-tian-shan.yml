          "en": "Kochkor is where the highland road starts to slow down. Wool becomes shyrdak pattern in a hosted craft visit, tea follows the day's drive, and the next morning's plan depends on weather, vehicle, season, and how far the route should climb."
          "ru": "В Кочкоре высокогорная дорога начинает замедляться. Шерсть превращается в узор шырдака во время согласованного визита к мастеру, после дневного переезда появляется чай, а утренний план зависит от погоды, машины, сезона и того, насколько высоко должен подняться маршрут."
          "uz": "Kochkorda baland yoʻl sekinlashishni boshlaydi. Jun mezbonli hunarmandchilik tashrifida shyrdak naqshiga aylanadi, kunlik yoʻldan keyin choy paydo boʻladi, ertangi reja esa ob-havo, avtomobil, mavsum va yoʻnalish qanchalik balandga chiqishiga bogʻliq boʻladi."
