    "description":
      "en": "The strongest anchors are Song-Kul Lake and Tash Rabat Caravanserai. Naryn's river roads, Salkyn-Tor, At-Bashy, Kel-Suu, and pass approaches can support longer programs only when current road, permit, and weather checks support them."
      "ru": "Главные ориентиры региона - озеро Сон-Куль и караван-сарай Таш-Рабат. Нарынские речные дороги, Салкын-Тор, Ат-Баши, Кель-Суу и перевальные подходы могут поддержать длинные программы только тогда, когда это подтверждают актуальные проверки дорог, разрешений и погоды."
      "uz": "Hududning eng kuchli tayanchlari - Song-Koʻl va Tash Rabat karvonsaroyi. Narin daryosi yoʻllari, Salkyn-Tor, At-Bashy, Kel-Suu va dovon yoʻllari faqat joriy yoʻl, ruxsat va ob-havo tekshiruvlari mos bo‘lsa, uzoq dasturlarni kuchaytiradi."
    "gridClassName": "sm:grid-cols-2 lg:grid-cols-3"
    "cards":
      - "type": "routeIdea"
        "image": "assets/images/destinations/kyrgyzstan.jpg"
