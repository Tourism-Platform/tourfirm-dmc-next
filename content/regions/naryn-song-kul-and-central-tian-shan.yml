"excerpt":
  "en": "After Bishkek or Issyk-Kul, the road into Naryn changes scale: river gorges, dry valleys, long passes, and settlements set far apart. This is where Kyrgyzstan becomes a highland journey, not a quick chain of stops.


    Kochkor brings felt workshops and homestay conversations before the climb. Song-Kul opens into summer pasture and yurt camps. Naryn keeps the road practical, while Tash Rabat gives the mountains a stone Silk Road memory. The highland stretch feels strongest with room for weather, road condition, altitude, and camp readiness."
  "ru": "После Бишкека или Иссык-Куля дорога к Нарыну меняет масштаб: речные ущелья, сухие долины, длинные перевалы и посёлки далеко друг от друга. Здесь Кыргызстан становится высокогорным путешествием, а не быстрой цепочкой остановок.


    Кочкор даёт войлочные мастерские и разговоры в гостевых домах перед подъёмом. Сон-Куль открывается летними пастбищами и юртами. Нарын держит маршрут практичным, а Таш-Рабат добавляет горам каменную память Шёлкового пути. Регион лучше раскрывается, когда в плане есть пространство для погоды, дорог, высоты и готовности лагерей."
  "uz": "Bishkek yoki Issiqkoʻldan keyin Narin tomoni yoʻlning miqyosini oʻzgartiradi: daryo daralari, quruq vodiylar, uzun dovonlar va bir-biridan uzoq aholi punktlari. Bu yerda Qirgʻiziston tez bekatlar ketma-ketligidan baland hudud sayohatiga aylanadi.


    Kochkor balandlikdan oldin kigiz ustaxonalari va mehmon uylari suhbatlarini beradi. Song-Koʻl yozgi yaylovlar va oʻtov lagerlari bilan ochiladi. Narin yoʻlni amaliy qiladi, Tash Rabat esa togʻlarga Ipak yoʻlining tosh xotirasini qoʻshadi. Hudud ob-havo, yoʻl holati, balandlik va lager tayyorgarligiga joy qoldirilganda yaxshiroq ochiladi."
