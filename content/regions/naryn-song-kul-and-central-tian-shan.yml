          "ru": "Нарынский региональный музей"
          "uz": "Norin mintaqaviy muzeyi"
        "description":
          "en": "Naryn is often remembered through roads, weather, and the river. The museum gives that movement a quieter room: felt work, yurt life, local artefacts, and stories that make the highland route feel tied to people before you leave town."
          "ru": "Нарын часто запоминается через дороги, погоду и реку. Музей добавляет этому движению более тихую комнату: войлок, юртовый быт, местные артефакты и истории, которые связывают высокогорный маршрут с людьми ещё до выезда из города."
          "uz": "Norin ko‘pincha yoʻllar, ob-havo va daryo orqali esda qoladi. Muzey bu harakatga sokinroq xona qo‘shadi: kigiz, oʻtov hayoti, mahalliy topilmalar va shaharni tark etishdan oldin baland togʻ yoʻlini odamlarga yaqinlashtiradigan hikoyalar."
