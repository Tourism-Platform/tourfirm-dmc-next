          "uz": "Tash Rabat karvonsaroyi"
        "description":
          "en": "Tash Rabat gives the Naryn high country a hard stone center. The caravanserai stands away from towns, held by a narrow valley and mountain weather. Inside, the old road becomes tangible: shelter, distance, and a pause before the next stretch."
          "ru": "Таш-Рабат дает Нарынскому высокогорью твердый каменный центр. Караван-сарай стоит вдали от городов, в узкой долине и горной погоде. Внутри старая дорога становится ощутимой: укрытие, расстояние и пауза перед следующим отрезком."
          "uz": "Tash Rabat Naryn baland hududiga tosh markaz beradi. Karvonsaroy shaharlardan uzoqda, tor vodiy va togʻ ob-havosi ichida turadi. Ichkarida eski yoʻl sezilarli bo‘ladi: boshpana, masofa va keyingi yoʻldan oldingi pauza."
