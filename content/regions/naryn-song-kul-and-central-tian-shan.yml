          "uz": "Salkyn-Tor milliy bogʻi"
        "description":
          "en": "Naryn often feels like a city of long roads and high passes. Salkyn-Tor brings the mountain edge closer: a protected gorge, forested slopes, spring water, and a quieter feel of the central Tian Shan before the road turns toward bigger highland choices."
          "ru": "Нарын часто ощущается как город длинных дорог и высоких перевалов. Салкын-Тор приближает горный край: охраняемое ущелье, лесистые склоны, родниковую воду и более тихое ощущение центрального Тянь-Шаня перед большими высокогорными выездами."
          "uz": "Norin ko‘pincha uzun yo‘llar va baland dovonlar shahri sifatida esda qoladi. Salkyn-Tor tog‘ chetini yaqinlashtiradi: muhofaza qilinadigan dara, o‘rmonli yonbag‘irlar, buloq suvi va katta baland tog‘ yo‘llaridan oldin markaziy Tyan-Shanni sokinroq his qilish imkonini beradi."
        "ctaHref": "/destinations/kyrgyzstan/naryn-song-kul-and-central-tian-shan/naryn/salkyn-tor-national-park"
