  - "blockType": "regular"
    "eyebrow":
      "en": "Region character"
      "ru": "Характер региона"
      "uz": "Hudud xarakteri"
    "title":
      "en": "A highland route that needs room"
      "ru": "Высокогорный маршрут, которому нужно пространство"
      "uz": "Kenglik soʻraydigan baland yoʻl"
    "description":
      "en": "This region is strongest when travelers understand that distance, season, and hospitality are part of the place. The route should feel spacious, not crowded.


        «In central Kyrgyzstan, the route is measured not only by distance. It is measured by open roads, warm rooms, and the people ready to receive you.»"
      "ru": "Регион становится сильнее, когда путешественник понимает: расстояние, сезон и гостеприимство здесь часть самого места. Маршрут должен дышать, а не растягиваться тонкой ниткой.


        «В центральном Кыргызстане маршрут измеряется не только расстоянием. Он измеряется открытыми дорогами, тёплыми комнатами и людьми, готовыми принять гостей.»"
      "uz": "Bu hudud masofa, mavsum va mehmondoʻstlik joyning o‘z qismi ekanini tushunganda kuchliroq ochiladi. Yoʻnalish tor choʻzilmasin, keng nafas olsin.


        «Markaziy Qirgʻizistonda yoʻnalish faqat masofa bilan o‘lchanmaydi. U ochiq yoʻllar, iliq xonalar va mehmonni kutishga tayyor odamlar bilan o‘lchanadi.»"
  - "blockType": "regular"
    "eyebrow":
      "en": "Region areas"
      "ru": "Районы региона"
      "uz": "Hudud yoʻnalishlari"
    "title":
      "en": "Four anchors for the central high country"
      "ru": "Четыре ориентира центрального высокогорья"
      "uz": "Markaziy baland hududning toʻrt tayanchi"
    "description":
      "en": "Read the route through Kochkor for craft and the Song-Kul approach, Song-Kul for summer pasture, Naryn for river roads and practical rhythm, and Tash Rabat for the caravanserai valley. At-Bashy, Kel-Suu, and Chaek stay in the wider plan when access and timing support them."
      "ru": "Маршрут читается через Кочкор с ремёслами и подходом к Сон-Кулю, Сон-Куль с летними пастбищами, Нарын с речными дорогами и практичным темпом, а также Таш-Рабат с долиной караван-сарая. Ат-Баши, Кель-Суу и Чаек остаются в широкой программе, когда доступ и время это поддерживают."
      "uz": "Yoʻnalish Kochkor orqali hunarmandchilik va Song-Koʻlga yaqinlashishni, Song-Koʻl orqali yozgi yaylovni, Narin orqali daryo yoʻllari va amaliy ritmni, Tash Rabat orqali karvonsaroy vodiysini ko‘rsatadi. At-Bashy, Kel-Suu va Chaek kirish va vaqt mos bo‘lganda kengroq rejada qoladi."
