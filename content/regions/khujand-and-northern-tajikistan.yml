        "description":
          "en": "On Istaravshan's western side, Kok Gumbaz announces itself first by color: a light-blue dome above square brick and majolica. Closer in, the portal, painted walls, molded mihrab, and large hall turn the stop from a skyline marker into a mosque-madrasa with study and prayer memory"
          "ru": "На западной стороне Истаравшана Кок-Гумбаз сначала запоминается цветом: светло-голубой купол поднимается над квадратным кирпичом и майоликой. Ближе видны портал, росписи, лепной михраб и большой зал, поэтому памятник перестаёт быть только силуэтом и становится мечетью-медресе с п"
          "uz": "Istaravshanning gʻarbiy tomonida Koʻk Gumbaz avvalo rangi bilan esda qoladi: kvadrat gʻisht va majolika ustida havorang gumbaz koʻtariladi. Yaqinroq borganda peshtoq, devoriy bezaklar, bezatilgan mehrob va katta zal koʻrinadi; shunda yodgorlik faqat uzoqdan koʻrinadigan siluet em"
        "ctaHref": "/destinations/tajikistan/khujand-and-northern-tajikistan/istaravshan/kok-gumbaz-mosque-and-madrasa"
