  - "blockType": "regular"
    "eyebrow":
      "en": "Region character"
      "ru": "Характер региона"
      "uz": "Hudud xarakteri"
    "title":
      "en": "Where Tajikistan meets the Ferghana Valley"
      "ru": "Где Таджикистан встречается с Ферганской долиной"
      "uz": "Tojikiston Fargʻona vodiysi bilan uchrashadigan joy"
    "description":
      "en": "Northern Tajikistan changes the country route without sending it straight into high mountains. The north is river light, bazaar noise, craft streets, and valley roads where neighboring countries are never far from the map.


        «The north is not a shortcut to the mountains; it is where Tajikistan meets the Ferghana Valley at a human scale.»"
      "ru": "Северный Таджикистан меняет маршрут по стране, не уводя его сразу в высокие горы. Здесь есть свет реки, шум базара, ремесленные улицы и долинные дороги, где соседние страны всегда близко на карте.


        «Север — не короткий путь к горам; это место, где Таджикистан встречается с Ферганской долиной в человеческом масштабе.»"
      "uz": "Shimoliy Tojikiston mamlakat bo‘ylab yoʻnalishni darhol baland togʻlarga olib ketmasdan o‘zgartiradi. Bu yerda daryo nuri, bozor shovqini, hunarmand ko‘chalar va qo‘shni mamlakatlar xaritada yaqin turadigan vodiy yoʻllari bor.


        «Shimol togʻlarga qisqa yoʻl emas; bu Tojikiston Fargʻona vodiysi bilan insoniy miqyosda uchrashadigan joy.»"
  - "blockType": "regular"
