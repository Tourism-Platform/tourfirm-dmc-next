"seo":
  "metaTitle":
    "en": "Khujand & Northern Tajikistan | TourLink"
    "ru": "Худжанд и северный Таджикистан | TourLink"
    "uz": "Xoʻjand va Shimoliy Tojikiston | TourLink"
  "metaDescription":
    "en": "Khujand gathers northern Tajikistan at river scale: the Syr Darya, Panjshanbe market stalls, fortress walls, shaded mosque courtyards, and evening walks that feel closer to the Ferghana Valley than to the high Pamirs.


      The region is strongest as a measured northern turn. Khujand gives the arrival city; Istaravshan adds Mug Teppe, Kok Gumbaz, and craft streets; Isfara and Kayrakkum stay as carefully checked route extensions, with orchard, reservoir, and border-edge timing confirmed locally before the road is fixed."
    "ru": "Худжанд собирает северный Таджикистан в масштабе реки: Сырдарья, ряды базара Панджшанбе, стены крепости, тень у мечетей и вечерние прогулки, которые ближе к Ферганской долине, чем к высоким Памирам.


      Сильнее всего регион раскрывается как спокойный северный поворот маршрута. Худжанд даёт город прибытия; Истаравшан добавляет Муг-Теппе, Кок-Гумбаз и ремесленные улицы; Исфара и Кайраккум остаются аккуратными продолжениями маршрута, где сады, водохранилище и дороги рядом с границей нужно проверять на месте до фиксации программы."
    "uz": "Xoʻjand Shimoliy Tojikistonni daryo miqyosida jamlaydi: Sirdaryo, Panjshanbe bozori rastalari, qalʼa devorlari, masjid hovlilaridagi soya va baland Pomirdan ko‘ra Fargʻona vodiysiga yaqinroq seziladigan kechki sayrlar.


      Hudud eng kuchli tarzda shoshilmagan shimoliy burilish sifatida ochiladi. Xoʻjand kelish shahrini beradi; Istaravshan Mugʻtepa, Koʻk Gumbaz va hunarmand ko‘chalarni qo‘shadi; Isfara va Qayroqqum esa bogʻlar, suv ombori va chegara yonidagi yoʻllar joyida tekshirilgandan keyin marshrutga kiritiladigan ehtiyotkor davomlar bo‘lib qoladi."
