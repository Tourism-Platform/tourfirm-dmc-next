          "ru": "Парк и мавзолей Камоли Худжанди дают центру Худжанда более тихий поворот. После Панджшанбе, Шейха Муслихиддина и крепости прогулка переходит к памяти о поэте, деревьям и спокойной мемориальной среде. Он уместен как короткое дополнение, когда доступ к мемориальной зоне проверен на"
          "uz": "Kamoli Xujandiy bogʻi va maqbarasi Xoʻjand markaziga sokinroq burilish beradi. Panjshanbe, Shayx Muslihiddin va qalʼadan keyin bu joy yurishni shoir xotirasi, daraxtlar va xotirjam memorial muhitga olib kiradi. Memorial hududga kirish mahalliy tasdiqdan oʻtganda, u ixcham qoʻshim"
        "ctaHref": "/destinations/tajikistan/khujand-and-northern-tajikistan/khujand/kamoli-khujandi-park-and-mausoleum"
