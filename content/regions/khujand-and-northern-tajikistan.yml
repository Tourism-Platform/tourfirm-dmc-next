      "uz": "Yoʻnalishni Panjshanbe bozori, Shayx Muslihiddin, Xoʻjand qalʼa muzeyi, Kamoli Xoʻjandiy bogʻi, Arbob saroyi, Mugʻtepa, Koʻk Gumbaz, Hazrati Shoh, eski Isfara, Chorku va Qayroqqum suv ombori shakllantiradi."
