      "en": "Khujand is the main anchor. Istaravshan and Isfara widen the northern map through old-town craft, valley roads, and nearby points such as Kayrakkum, Kanibadam, and Buston."
      "ru": "Худжанд остаётся главной опорой. Истаравшан и Исфара расширяют северную карту через ремесленный старый город, долинные дороги и дополнительные точки вроде Кайраккума, Канибадама и Бустана."
      "uz": "Xoʻjand asosiy tayanch bo‘lib qoladi. Istaravshan va Isfara shimoliy xaritani hunarmand eski shahar, vodiy yoʻllari hamda Qayroqqum, Konibodom va Boʻston kabi qo‘shimcha joylar orqali kengaytiradi."
