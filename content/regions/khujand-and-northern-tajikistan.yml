          "en": "Arbob Palace sits in the Bobojon Gafurov area beyond Khujand's walking core. The visit shifts the route from market noise and old-city anchors to a formal palace setting, park grounds, Soviet-era regional history, and the political memory attached to 1992."
          "ru": "Дворец Арбоб находится в районе Бободжона Гафурова, за пределами пешеходного ядра Худжанда. Здесь маршрут меняет шум базара и центральные памятники на парадный дворец, парк, советскую региональную историю и память о событиях 1992 года."
          "uz": "Arbob saroyi Bobojon Gʻafurov hududida, Xoʻjandning piyoda yuriladigan markazidan tashqarida joylashgan. Bu tashrif bozor shovqini va markaziy obidalardan tantanali saroy muhitiga, bogʻ hududiga, sovet davri mintaqaviy tarixiga va 1992-yil xotirasiga oʻtadi."
