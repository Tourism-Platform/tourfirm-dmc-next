        "description":
          "en": "Mug Teppe is a compact hill site, not a restored castle. Its value is quieter: settlement memory, traces of an old gate and dome, and the first context for understanding why Istaravshan's later monuments belong together. Start here, and Kok Gumbaz, Hazrat-i-Shoh, bazaar streets, "
          "ru": "Муг-Теппе - компактная площадка на холме, а не восстановленная крепость. Его ценность спокойнее: память поселения, следы старых ворот и купола, первый контекст для понимания Истаравшана. Если начать прогулку здесь, Кок-Гумбаз, Хазрати-Шох, базарные улицы и кварталы ниже складываю"
          "uz": "Mug Teppe qayta tiklangan qalʼa emas, ixcham tepalik maydonidir. Uning qiymati sokinroq: manzilgoh xotirasi, eski darvoza va gumbaz izlari, Istaravshanni tushunish uchun birinchi kontekst. Sayr shu yerdan boshlansa, Kok Gumbaz, Hazrati Shoh, bozor koʻchalari va pastdagi mahallala"
        "ctaHref": "/destinations/tajikistan/khujand-and-northern-tajikistan/istaravshan/mug-teppe-mug-castle"
