          "ru": "Базар Панджшанбе сразу показывает Худжанд через людей. Его название означает четверг и напоминает о рыночном дне; сегодняшний визит складывается из хлеба, фруктов, специй, тканей, повседневных товаров, голосов и быстрого движения городского центра."
          "uz": "Panjshanbe bozori Xoʻjandni odamlar orqali tanishtiradi. Nomi payshanba degani va eski bozor kunini eslatadi; bugungi tashrif esa non, meva, ziravor, mato, kundalik buyumlar, bozor ovozlari va shahar markazining tez harakatidan tashkil topadi."
