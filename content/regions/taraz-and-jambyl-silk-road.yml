    "description":
      "en": "Taraz & Jambyl Silk Road is not a monument catalogue. It is a quieter corridor where a city, two mausoleums, urban archaeology, and open archaeological ground need time and explanation to belong together.


        «Taraz is strongest when the visit slows enough for brickwork, legend, city archaeology, and open road to belong to the same story.»"
      "ru": "Тараз и Жамбылский Шёлковый путь - не каталог памятников. Это тихий коридор, где город, два мавзолея, городская археология и открытое археологическое пространство складываются вместе только при спокойном темпе и хорошем объяснении.


        «Тараз сильнее всего, когда поездка замедляется настолько, что кирпичная кладка, легенда, городская археология и открытая дорога складываются в одну историю.»"
      "uz": "Taraz va Jambyl Ipak yo‘li yodgorliklar katalogi emas. Bu shahar, ikki maqbara, shahar arxeologiyasi va ochiq arxeologik hudud vaqt va yaxshi tushuntirish bilan bir-biriga ulanadigan sokin yo‘l.


        «Taraz tashrifi g‘isht naqshi, rivoyat, shahar arxeologiyasi va ochiq yo‘l bitta hikoyaga aylanishi uchun yetarlicha sekinlashganda kuchliroq ko‘rinadi.»"
