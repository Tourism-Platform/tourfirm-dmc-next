  "metaDescription":
    "en": "Taraz does not feel like a headline city. Its strength is quieter: Talas-side streets, museum-reserve context, terracotta ornament, paired mausoleums outside the city, and roads where old Silk Road memory sits beside modern traffic.


      Treat the region as a measured Silk Road stop. Taraz gives the journey a calm beginning, Aisha Bibi and Babaji Khatun give it a visible first memory, Karakhan and Ancient Taraz bring the story back into the city, and Akyrtas belongs only when there is enough time for the outer road."
    "ru": "Тараз не похож на город-заголовок. Его сила тише: улицы у Таласа, контекст музея-заповедника, терракотовый орнамент, парные мавзолеи за городом и дороги, где память Шёлкового пути стоит рядом с современным движением.


      Воспринимайте регион как размеренную остановку Шёлкового пути. Тараз даёт путешествию спокойное начало, Айша-Биби и Бабаджи-Хатун - первую видимую память, Карахан и Древний Тараз возвращают историю в город, а Акыртас стоит добавлять только тогда, когда хватает времени на внешнюю дорогу."
    "uz": "Taraz baland ovozli shahar kabi ko‘rinmaydi. Uning kuchi sokinroq: Talas bo‘yidagi ko‘chalar, muzey-qo‘riqxona konteksti, terrakota naqshlar, shahar tashqarisidagi juft maqbaralar va Ipak yo‘li xotirasi bugungi harakat yonida seziladigan yo‘llar.


      Mintaqani o‘lchangan Ipak yo‘li to‘xtashi sifatida ko‘ring. Taraz sayohatga sokin boshlanish beradi, Aysha-Bibi va Babaji-Xotun birinchi ko‘rinadigan xotirani yaratadi, Qoraxon va Qadimgi Taraz hikoyani shaharga qaytaradi, Akyrtas esa tashqi yo‘lga vaqt yetgandagina qo‘shiladi."
