          "uz": "Boyqongirsoy Muzbuloq ortidagi eng ravshan tabiat sababidir. Ekoqishloq g‘oyasi alohida faoliyat yorlig‘i emas, qishloq tashrifidan tabiiy chiqqanda ishonchli eshitiladi."
