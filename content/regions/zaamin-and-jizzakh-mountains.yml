          "en": "On the Zaamin side of the Jizzakh mountain route, Duoba brings the journey down to mahalla scale. Tea, a family meal, a craft demonstration, or cooking with a receiving household gives the stop its human center; cable-car, Sufa, riding, quad, and snow ideas come only after season"
          "ru": "На зааминской стороне джизакского горного маршрута Дуоба возвращает поездку к масштабу махалли. Чай, семейный обед, ремесленный показ или готовка с принимающей семьёй дают остановке человеческий центр; канатная дорога, Суфа, лошади, квадроциклы и снег добавляются только после про"
          "uz": "Jizzax tog‘ marshrutining Zomin tomonida Duoba safarni mahalla miqyosiga tushiradi. Mehmon kutadigan oila bilan choy, oilaviy ovqat, hunar namoyishi yoki taom tayyorlash bekatga insoniy markaz beradi; kanat yo‘li, Sufa, ot, kvadrosikl va qor esa mavsum, yo‘l va kirish tekshirilga"
