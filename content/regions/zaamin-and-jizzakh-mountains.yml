    "cards":
      - "type": "destinationInsight"
        "icon": "CircleQuestionMark"
        "title":
          "en": "How many days does Zaamin & Jizzakh Mountains need in a programme?"
          "ru": "Сколько дней нужно региону Заамин и горы Джизака в программе?"
          "uz": "Zomin va Jizzax tog‘lari hududi dasturda necha kun olishi kerak?"
        "description":
          "en": "2–4 days usually works if you keep one strong core and treat outer stops as deliberate choices. The region brief is “Mountain mahallas and village roads between Zaamin, Bakhmal, and Gallaorol”."
          "ru": "Обычно хватает 2–4 дня, если держать одно сильное ядро, а внешние остановки выбирать осознанно. Кратко о регионе: «Горные махалли и сельские дороги между Заамином, Бахмалом и Галляаралом»."
          "uz": "Odatda 2–4 kun yetadi — bitta kuchli yadro va tashqi bekatlarni ongli tanlov qiling. Hudud brifi: «Zomin, Baxmal va G‘allaorol oralig‘idagi tog‘ mahallalari va qishloq yo‘llari»."
      - "type": "destinationInsight"
        "icon": "Compass"
        "title":
          "en": "What should come before and after Zaamin & Jizzakh Mountains?"
          "ru": "Что ставить до и после региона Заамин и горы Джизака?"
          "uz": "Zomin va Jizzax tog‘laridan oldin va keyin nima qo‘yish kerak?"
        "description":
          "en": "Use neighbouring cities as clean handovers: arrive with a calm first night, leave after one completed chapter, and avoid stacking two long transfers on the same day."
          "ru": "Соседние города держите как чистые стыки: приезжайте со спокойной первой ночью, уезжайте после завершённой главы и не ставьте два длинных переезда в один день."
          "uz": "Qo‘shni shaharlarni toza ulanish sifatida tuting: sokin birinchi tun bilan keling, yakunlangan bobdan keyin chiqing va bir kunga ikkita uzun ko‘chishni qo‘ymang."
      - "type": "destinationInsight"
        "icon": "Calendar"
        "title":
          "en": "What season logic matters most in Zaamin & Jizzakh Mountains?"
          "ru": "Какая сезонная логика важнее всего в Заамин и горы Джизака?"
          "uz": "Zomin va Jizzax tog‘larida qaysi mavsum mantig‘i eng muhim?"
        "description":
          "en": "Heat, altitude, road condition, and opening hours change the product more than the brochure list. Build the region around what stays comfortable for the group that week."
          "ru": "Жара, высота, состояние дорог и часы работы меняют продукт сильнее списка из брошюры. Собирайте регион вокруг того, что комфортно именно этой группе в эту неделю."
          "uz": "Issiqlik, balandlik, yo‘l holati va ish soatlari broshyura ro‘yxatidan kuchliroq mahsulotni o‘zgartiradi. Hududni shu hafta guruh uchun qulay narsaga qurib chiqing."
