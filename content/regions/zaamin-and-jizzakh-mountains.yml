        "description":
          "en": "Muzbuloq brings the Bakhmal side of the Jizzakh mountains down to village scale. Boyqongirsoy and the nearby mountain edge give the stop its reason; the visit should stay simple, local, and matched to the road and weather close to travel."
          "ru": "Музбулок переводит бахмальскую сторону гор Джизака в сельский масштаб. Бойконгирсай и близкий горный край дают остановке смысл; сам визит должен оставаться простым, местным и соразмерным дороге и погоде."
          "uz": "Muzbuloq Jizzax tog‘larining Baxmal tomonini qishloq miqyosida ko‘rsatadi. Boyqongirsoy va yaqin tog‘ cheti bekatga maʼno beradi; tashrif sodda, mahalliy va yo‘l hamda ob-havoga mos bo‘lishi kerak."
        "ctaHref": "/destinations/uzbekistan/zaamin-and-jizzakh-mountains/muzbuloq"
        "ctaLabel":
          "en": "Open place"
          "ru": "Открыть место"
