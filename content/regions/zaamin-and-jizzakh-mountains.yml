          "en": "The road into Duoba starts to feel like Zaamin before the village appears: bends, open air, and weather that can change quickly. This is the mountain approach around the mahalla visit, not a separate resort or fixed activity."
          "ru": "Дорога к Дуобе начинает ощущаться как Заамин ещё до села: повороты, открытый воздух и погода, которая быстро меняется. Это горный подъезд к визиту в махаллю, а не отдельный курорт или активность с гарантированным доступом."
          "uz": "Duobaga boradigan yo‘l qishloq ko‘rinishidan oldin ham Zominni sezdira boshlaydi: burilishlar, ochiq havo va tez o‘zgaradigan ob-havo. Bu mahalla tashrifi uchun tog‘ tomondan kirish, alohida kurort yoki kafolatlangan faoliyat emas."
