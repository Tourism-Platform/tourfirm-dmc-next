          "en": "Avliyo is the threshold of the Uzunbuloq stop: the place where the visit starts with a village edge, a greeting, and a sense of what belongs there that day. A family table, craft room, meal, shopping pause, or photo point may follow later; the first meaning is respect."
          "ru": "Авлиё — порог остановки в Узунбулоке: здесь визит начинается с края села, приветствия и понимания, что уместно именно сегодня. Семейный стол, ремесленная комната, питание, торговля или место для фотографии могут появиться позже; первый смысл здесь — уважение."
          "uz": "Avliyo — Uzunbuloq bekatining ostonasi: tashrif qishloq cheti, birinchi salomlashuv va shu kunga nima mosligini aniqlashdan boshlanadi. Oilaviy dasturxon, hunar xonasi, ovqatlanish, savdo yoki rasm nuqtasi keyin qo‘shilishi mumkin; birinchi maʼno esa hurmat."
