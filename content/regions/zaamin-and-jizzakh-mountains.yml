        "description":
          "en": "Uzunbuloq gives the Zaamin & Jizzakh Mountains route a quieter Gallaorol stop. Start with the Avliyo mahalla and pilgrimage setting, then add a family table, craft room, shopping pause, or photo point only when it feels natural for the date and the people involved."
          "ru": "Узунбулок добавляет маршруту Заамин и горы Джизака спокойную остановку в Галляарале. Начните с махалли Авлиё и паломнической среды; семейный стол, ремесленную комнату, торговую паузу или место для фотографии добавляйте только тогда, когда это естественно для даты и людей на месте"
          "uz": "Uzunbuloq Zomin va Jizzax tog‘lari yo‘liga G‘allaorol tomondan sokin bekat qo‘shadi. Avval Avliyo mahallasi va ziyorat muhiti tushuniladi; oilaviy dasturxon, hunar xonasi, savdo yoki rasm nuqtasi esa sana va mahalliy odamlar uchun tabiiy bo‘lganda qo‘shiladi."
