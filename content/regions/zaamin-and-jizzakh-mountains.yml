          "en": "Before any arranged courtyard or table, the Bakhmal road gives Novqa its first feeling: cooler air, orchard-country edges, and a village that should be reached slowly."
          "ru": "До любого двора или стола дорога через Бахмал даёт Новке первое ощущение: более прохладный воздух, сады по сторонам и село, к которому нужно подъехать неспешно."
          "uz": "Hovli yoki dasturxon kelishilishidan oldin Baxmal yo‘li Novqaga ilk tuyg‘uni beradi: salqinroq havo, bog‘lar cheti va shoshilmay yetib boriladigan qishloq."
