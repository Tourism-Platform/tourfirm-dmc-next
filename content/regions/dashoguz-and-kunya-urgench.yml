          "uz": "Il Arslon maqbarasi Ko‘hna Urganch tashrifini yaqinroq ko‘lamga olib keladi. Bu Qutlug‘ Temur minorasining balandligi ham, keng UNESCO manzarasi ham emas; bu yerda ixcham g‘ishtli shakl, konussimon tom va kichik maqbaradagi detalga qaraysiz. U Sulton Tekesh yonida tabiiy ko‘rinad"
