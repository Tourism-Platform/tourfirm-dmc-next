"excerpt":
  "en": "Kunya-Urgench gives northern Turkmenistan its main heritage pull. Here, old Khorezm is understood through distance: open ground between monuments, hard light, heat, and silence. The route feels strongest when Dashoguz access is planned carefully and the north is treated as a deliberate extension, not a casual detour."
  "ru": "Куня-Ургенч даёт северу Туркменистана главный маршрутный смысл. Здесь старый Хорезм воспринимается через расстояние: открытые участки между памятниками, сильный свет, жару и тишину. Поэтому дорогу через Дашогуз лучше планировать заранее, а север не добавлять как случайный поворот."
  "uz": "Ko‘hna Urganch Turkmaniston shimoliga asosiy meros sababini beradi. Bu yerda eski Xorazm masofa orqali seziladi: yodgorliklar orasidagi ochiq joy, kuchli yorug‘lik, issiq va sukunat. Shuning uchun Dashoguz orqali borish oldindan rejalansa, shimol tasodifiy qo‘shimcha bo‘lib qolmaydi."
