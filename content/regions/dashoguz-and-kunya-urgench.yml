      "en": "The northern face of old Khorezm"
      "ru": "Северная сторона старого Хорезма"
      "uz": "Eski Xorazmning shimoliy yuzi"
    "description":
      "en": "This region matters because it widens Turkmenistan beyond the capital, Merv, and the Karakum road. Kunya-Urgench was one of old Khorezm's great centers; today its monuments stand apart from one another in heat, silence, and hard northern light.


        «Kunya-Urgench is strongest when the spaces between monuments are treated as part of old Khorezm, not as empty travel time.»"
      "ru": "Этот регион важен потому, что расширяет Туркменистан за пределы столицы, Мерва и дороги через Каракумы. Куня-Ургенч был одним из центров старого Хорезма; сегодня его памятники стоят отдельно друг от друга, в жаре, тишине и резком северном свете.


        «Куня-Ургенч сильнее всего, когда расстояния между памятниками воспринимаются как часть старого Хорезма, а не как пустые переезды.»"
      "uz": "Bu hudud Turkmanistonni poytaxt, Marv va Qoraqum yo‘lidan kengroq meros xaritasiga olib chiqadi. Ko‘hna Urganch eski Xorazmning muhim markazlaridan biri bo‘lgan; bugun uning yodgorliklari bir-biridan uzoqda, issiq, sukunat va keskin shimoliy nur ichida turadi.


        «Ko‘hna Urganch yodgorliklar orasidagi masofa eski Xorazmning bir qismi sifatida sezilganda kuchliroq taʼsir qiladi.»"
