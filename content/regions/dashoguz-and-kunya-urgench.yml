          "uz": "Ko‘hna Urganch bitta yodgorlik bekati emas. Eski shahar hududida masjid qoldiqlari, karvonsaroy darvozalari, istehkomlar, maqbaralar va 60 metrlik minora eski Xorazmni masofa, g‘isht va ochiq osmon orqali ko‘rsatadi."
