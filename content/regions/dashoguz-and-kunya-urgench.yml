          "uz": "Sulton Tekesh maqbarasi Ko‘hna Urganchda boshqa turdagi yodgorlikni ko‘rsatadi: Qutlug‘ Temur minorasining uzun vertikal chizig‘i ham emas, To‘rabek Xonimdagi ichki bezak ham emas, balki ko‘k koshinli tom bilan yopilgan hukmdor g‘isht maqbarasi. UNESCO manzarasi eski Urganch ko‘l"
