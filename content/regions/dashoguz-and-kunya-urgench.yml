          "ru": "Мавзолей Наджм ад-Дина Кубры переводит визит по Куня-Ургенчу от масштаба памятников к паломнической памяти. После открытого ландшафта ЮНЕСКО, минарета и царских мавзолеев эта северная остановка требует более тихого движения, скромной одежды и внимания к тому, как старый Хорезм пр"
          "uz": "Najm ad-Din Kubra maqbarasi Ko‘hna Urganch tashrifini yodgorliklar ko‘lamidan ziyorat xotirasiga buradi. Ochiq UNESCO manzarasi, minora va hukmdor maqbaralaridan keyin bu shimoliy to‘xtash sokinroq yurish, odobli kiyim va eski Xorazm nomlari qanday eslanishiga eʼtibor so‘raydi. B"
