    description:
      en: "Samarkand is not only tile and turquoise. The surrounding valleys produce wines that surprise first-time visitors — this route pairs tastings with monument visits at the right hours."
      ru: "Самарканд — не только кафель и бирюза. Окружающие долины дают вина, которые удивляют гостей — маршрут сочетает дегустации с посещением памятников в правильные часы."
      uz: "Samarqand faqat kafel va firuza emas. Atrofdagi vodiyilar mehmonlarni hayratlantiradigan vinolar beradi — marshrut dasturxonlarni to'g'ri soatlarda yodgorlik tashriflari bilan uyg'unlashtiradi."
