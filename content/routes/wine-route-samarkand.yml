    title:
      en: Tasting etiquette & timing
      ru: Этикет дегустации и тайминг
      uz: Dasturxon etiketi va vaqt
    description:
      en: "Schedule Registan for morning light, winery visits after lunch when cellars are ready, and leave Shah-i-Zinda for late afternoon. Drivers or guides handle the short hops between valley and city."
      ru: "Регистан — на утренний свет, винодельни — после обеда, когда погреба готовы, Шахи-Зинду — на поздний день. Короткие переезды между долиной и городом — на водителе или гиде."
      uz: "Registonni ertalabki yorug'likka, vino zavodlarini tushdan keyin, Shohi Zindani kechki soatga rejalashtiring. Vodiy va shahar orasidagi qisqa yo'llarni haydovchi yoki gid hal qiladi."
