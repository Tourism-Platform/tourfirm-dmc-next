  uz: silk-road-classics
title:
  en: Silk Road classics
  ru: Классика Шёлкового пути
  uz: Ipak yo'li klassikasi
subtitle:
  en: The essential Uzbekistan arc — three UNESCO cities linked by desert roads and living craft traditions.
  ru: Главная дуга Узбекистана — три объекта ЮНЕСКО, связанные пустынными дорогами и живыми ремёслами.
  uz: O'zbekistonning asosiy yoyi — cho'l yo'llari va tirik hunarmandchilik an'analari bilan bog'langan uchta YuNESKO shahri.
excerpt:
  en: Six to nine days between Samarkand, Bukhara, and Khiva — monuments by day, courtyards and bazaars by evening, with room for wine, crafts, and slow travel.
  ru: Шесть–девять дней между Самаркандом, Бухарой и Хивой — памятники днём, дворы и базары вечером, с местом для вина, ремёсел и неспешного темпа.
  uz: Samarqand, Buxoro va Xiva orasida olti–to'qqiz kun — kunduzi yodgorliklar, kechqurun hovli va bozorlar, vino, hunarmandchilik va sekin sayohat uchun joy bilan.
