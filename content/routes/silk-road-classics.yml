  - blockType: faq
    title:
      en: Planning questions
      ru: Вопросы при планировании
      uz: Rejalashtirish savollari
    items:
      - question:
          en: How many days do I need?
          ru: Сколько дней нужно?
          uz: Necha kun kerak?
        answer:
          en: "Eight days is the sweet spot for this arc with one night in transit. Compress to six only if you accept shorter city stays and fewer experiences."
          ru: "Восемь дней — оптимум для этой дуги с одной ночёвкой в пути. Сжать до шести можно только если готовы к более коротким стоянкам и меньшему числу впечатлений."
          uz: "Sakkiz kun bu yoy uchun yo'ldagi bir tun bilan eng qulay. Faqat shaharlar va taassurotlar sonini qisqartirishga tayyor bo'lsangiz, olti kungacha qisqartirish mumkin."
      - question:
          en: Is this route good in summer?
          ru: Подходит ли маршрут летом?
          uz: Bu marshrut yozda yaxshimi?
        answer:
          en: "Yes, but plan Registan and Itchan Kala for early morning or late afternoon. Desert transfers are best before midday heat peaks."
          ru: "Да, но Регистан и Ичан-Калу планируйте на раннее утро или поздний день. Пустынные переезды лучше до пика дневной жары."
          uz: "Ha, lekin Registon va Ichan Qal'ani erta tong yoki kechki soatlar uchun rejalashtiring. Cho'l transferlarini kunduzi issiqlik cho'qqisidan oldin qiling."
